  /* --- 初期化・データ取得 --- */
  function initLotteryView() {
    loadLotteryData();
    setupLotteryShortcuts();
    initVegasBgVisualizer();
    updateVegasBgmDisplay();
    updateVegasDramaDisplay();
    updateVegasImpactDisplay();
    setupVegasAudioAutoUnlock();
  }

  async function loadLotteryData() {
    try {
      const res = await ApiService.call('getLotteryDataApi');
      if (res && res.success !== false) {
        lotteryMembers = res.members || [];
        lotteryHistory = res.history || [];
      }
    } catch (e) {
      console.error('Failed to load lottery data:', e);
      if (typeof rawInitialData !== 'undefined' && rawInitialData.members) {
        lotteryMembers = rawInitialData.members.map(m => ({
          id: m.id,
          name: m.name,
          category: m.category || 'その他',
          profession: m.profession || '',
          win_count: 0,
          last_won_at: null
        }));
      }
    }

    // 基本DNA、上田、小瀬戸は初期状態でチェックを外す
    lotteryExcludedMemberIds.clear();
    lotteryMembers.forEach(m => {
      const mName = String(m.name || '');
      const mCat = String(m.category || '');
      const mProf = String(m.profession || '');
      if (
        mCat.includes('DNA') ||
        mProf.includes('DNA') ||
        mName.includes('DNA') ||
        mName.includes('上田') ||
        mName.includes('小瀬戸')
      ) {
        lotteryExcludedMemberIds.add(String(m.id));
      }
    });

    updateLotteryUI();
  }

  function updateLotteryUI() {
    const activeMembers = getActiveLotteryMembers();
    const activeBadge = document.getElementById('lottery-active-count-badge');
    const poolText = document.getElementById('lottery-target-pool-text');
    const histBadge = document.getElementById('lottery-history-count-badge');

    if (activeBadge) activeBadge.innerText = activeMembers.length;
    if (poolText) poolText.innerText = `候補: ${activeMembers.length} 名`;
    if (histBadge) histBadge.innerText = lotteryHistory.length;

    renderReelsInitialState(activeMembers);
  }

  function getActiveLotteryMembers() {
    return lotteryMembers.filter(m => !lotteryExcludedMemberIds.has(String(m.id)));
  }

  /* --- ルーレットアイテムの中央位置計算（物理的ズレ完全ゼロ保証） --- */
  function getCenterTranslateY(itemElement) {
    const windowEl = document.querySelector('.single-reel-window');
    if (!windowEl || !itemElement) return 0;
    const itemCenter = itemElement.offsetTop + (itemElement.offsetHeight / 2);
    const windowCenter = windowEl.clientHeight / 2;
    return windowCenter - itemCenter;
  }

  /* =========================================================================
     🌌 狂気のラスベガス背景エフェクトエンジン (60FPS Dynamic Canvas Visualizer)
     ========================================================================= */
  function initVegasBgVisualizer() {
    const canvas = document.getElementById('lottery-bg-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    function resize() {
      if (canvas.parentElement) {
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
      }
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    for (let i = 0; i < 95; i++) {
      particles.push({
        angle: Math.random() * Math.PI * 2,
        radius: Math.random() * 520 + 40,
        speed: (Math.random() * 0.03 + 0.01),
        size: Math.random() * 4 + 2,
        color: ['#f59e0b', '#fbbf24', '#fde047', '#ef4444', '#ffffff'][Math.floor(Math.random() * 5)],
        alpha: Math.random() * 0.8 + 0.2
      });
    }

    let vortexAngle = 0;
    let shockwaveRadius = 0;
    let lightningTicks = 0;
    let alertTicks = 0;

    function renderBg() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height * 0.48;

      if (vegasBgEffectMode === 'idle') {
        particles.forEach(p => {
          p.angle += 0.003;
          const px = cx + Math.cos(p.angle) * p.radius;
          const py = cy + Math.sin(p.angle) * (p.radius * 0.5);
          ctx.beginPath();
          ctx.arc(px, py, p.size * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha * 0.5;
          ctx.fill();
        });
      } else if (vegasBgEffectMode === 'warp') {
        ctx.globalAlpha = 0.85;
        for (let i = 0; i < 38; i++) {
          const ang = (i / 38) * Math.PI * 2 + vortexAngle;
          const r1 = 110;
          const r2 = Math.max(canvas.width, canvas.height) * 0.85;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * (r1 * 0.6));
          ctx.lineTo(cx + Math.cos(ang) * r2, cy + Math.sin(ang) * (r2 * 0.6));
          ctx.strokeStyle = i % 2 === 0 ? 'rgba(251, 191, 36, 0.45)' : 'rgba(245, 158, 11, 0.2)';
          ctx.lineWidth = (i % 3 === 0) ? 4 : 2;
          ctx.stroke();
        }
        vortexAngle += 0.08;

        // ★★★ ラスベガス・ムービングレーザービーム (4色レーザー) ★★★
        const laserColors = ['#10b981', '#38bdf8', '#f59e0b', '#ec4899'];
        laserColors.forEach((color, idx) => {
          ctx.save();
          const sweep = Math.sin(vortexAngle * 0.8 + idx * 1.5) * 0.45;
          const originX = idx % 2 === 0 ? 0 : canvas.width;
          const originY = idx < 2 ? 0 : canvas.height;
          const targetX = cx + sweep * canvas.width;
          const targetY = cy;

          ctx.beginPath();
          ctx.moveTo(originX, originY);
          ctx.lineTo(targetX, targetY);
          ctx.strokeStyle = color;
          ctx.lineWidth = 3.5;
          ctx.shadowColor = color;
          ctx.shadowBlur = 25;
          ctx.globalAlpha = 0.75;
          ctx.stroke();
          ctx.restore();
        });
      } else if (vegasBgEffectMode === 'red_alert') {
        // ★★★ 緊急事態レッドアラート・ストロボ警報 ★★★
        alertTicks++;
        const flashAlpha = (Math.sin(alertTicks * 0.25) + 1) * 0.5;

        // 赤色ストロボ
        ctx.fillStyle = `rgba(239, 68, 68, ${0.15 + flashAlpha * 0.25})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 警告斜めストライプ（警戒区域バー）
        ctx.save();
        ctx.strokeStyle = `rgba(239, 68, 68, ${0.25 + flashAlpha * 0.35})`;
        ctx.lineWidth = 12;
        for (let x = -canvas.height; x < canvas.width + canvas.height; x += 60) {
          ctx.beginPath();
          ctx.moveTo(x + (alertTicks * 4) % 60, 0);
          ctx.lineTo(x + canvas.height + (alertTicks * 4) % 60, canvas.height);
          ctx.stroke();
        }
        ctx.restore();

        // 巨大 WARNING ネオン
        ctx.save();
        ctx.font = '900 42px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(255, 255, 255, ${0.7 + flashAlpha * 0.3})`;
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 30;
        ctx.fillText('🚨 EMERGENCY WARNING 🚨', cx, cy - 200);
        ctx.fillText('⚡ FREEZE SYSTEM REVIVAL ⚡', cx, cy + 240);
        ctx.restore();

      } else if (vegasBgEffectMode === 'insane_vortex') {
        // ★★★ 狂気の黄金コズミック・ボルテックス ＆ 電撃ストーム ★★★
        vortexAngle += 0.05;

        const auraGrad = ctx.createRadialGradient(cx, cy, 60, cx, cy, canvas.width * 0.65);
        auraGrad.addColorStop(0, 'rgba(245, 158, 11, 0.4)');
        auraGrad.addColorStop(0.4, 'rgba(180, 83, 9, 0.2)');
        auraGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = auraGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let ring = 0; ring < 3; ring++) {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(vortexAngle * (ring % 2 === 0 ? 1 : -1.2) + ring * 1.5);
          ctx.beginPath();
          for (let a = 0; a < Math.PI * 2; a += 0.15) {
            const rad = 140 + ring * 90 + Math.sin(a * 4 + vortexAngle * 3) * 30;
            const rx = Math.cos(a) * rad;
            const ry = Math.sin(a) * (rad * 0.55);
            if (a === 0) ctx.moveTo(rx, ry);
            else ctx.lineTo(rx, ry);
          }
          ctx.closePath();
          ctx.strokeStyle = ring === 0 ? 'rgba(253, 224, 71, 0.85)' : (ring === 1 ? 'rgba(245, 158, 11, 0.65)' : 'rgba(239, 68, 68, 0.55)');
          ctx.lineWidth = 3.5 + ring * 1.5;
          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 20;
          ctx.stroke();
          ctx.restore();
        }

        particles.forEach(p => {
          p.angle += p.speed * 4;
          p.radius -= 1.3;
          if (p.radius < 50) p.radius = canvas.width * 0.55;

          const px = cx + Math.cos(p.angle) * p.radius;
          const py = cy + Math.sin(p.angle) * (p.radius * 0.55);

          ctx.beginPath();
          ctx.arc(px, py, p.size * 1.5, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.min(1, p.alpha * 1.6);
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 14;
          ctx.fill();
        });

        lightningTicks++;
        if (lightningTicks % 7 === 0) {
          ctx.save();
          ctx.strokeStyle = '#ffffff';
          ctx.shadowColor = '#fde047';
          ctx.shadowBlur = 25;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          let lx = Math.random() > 0.5 ? 0 : canvas.width;
          let ly = Math.random() * canvas.height;
          ctx.moveTo(lx, ly);
          for (let s = 0; s < 5; s++) {
            lx += (cx - lx) * 0.3 + (Math.random() - 0.5) * 80;
            ly += (cy - ly) * 0.3 + (Math.random() - 0.5) * 80;
            ctx.lineTo(lx, ly);
          }
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.font = '900 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(251, 191, 36, 0.14)';
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 15;
        ctx.fillText('★ LAS VEGAS 100M MEGA JACKPOT ★', cx, cy - 200);
        ctx.fillText('⚡ FEVER CLIMAX REACH ⚡', cx, cy + 240);
        ctx.restore();

      } else if (vegasBgEffectMode === 'supernova') {
        shockwaveRadius += 18;
        if (shockwaveRadius < canvas.width * 1.5) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, shockwaveRadius, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(253, 224, 71, ' + (1 - shockwaveRadius / (canvas.width * 1.5)) + ')';
          ctx.lineWidth = 15;
          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 35;
          ctx.stroke();
          ctx.restore();
        }
      }

      vegasBgAnimId = requestAnimationFrame(renderBg);
    }

    if (vegasBgAnimId) cancelAnimationFrame(vegasBgAnimId);
    renderBg();
  }

  function setVegasBgMode(mode) {
    vegasBgEffectMode = mode;

  function getAudioContext() {
    if (!lotteryAudioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        lotteryAudioCtx = new AudioContextClass();
      }
    }
    if (lotteryAudioCtx && lotteryAudioCtx.state === 'suspended') {
      lotteryAudioCtx.resume();
    }
    if (lotteryAudioCtx && !lotteryMasterGain) {
      setupStudioAudioRack(lotteryAudioCtx);
    }
    return lotteryAudioCtx;
  }

  function setupStudioAudioRack(ctx) {
    try {
      // 1. ノイズバッファの生成（スネア・ハイハット・クラッシュ用: 1秒で十分、超低負荷）
      const bufferSize = Math.floor(ctx.sampleRate * 1.0);
      lotteryNoiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = lotteryNoiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      // 2. スタジオ・マスタリング・コンプレッサー（音圧最大化＆クリッピング防止リミッター）
      lotteryCompressor = ctx.createDynamicsCompressor();
      lotteryCompressor.threshold.setValueAtTime(-14, ctx.currentTime);
      lotteryCompressor.knee.setValueAtTime(8, ctx.currentTime);
      lotteryCompressor.ratio.setValueAtTime(10, ctx.currentTime);
      lotteryCompressor.attack.setValueAtTime(0.003, ctx.currentTime);
      lotteryCompressor.release.setValueAtTime(0.12, ctx.currentTime);

      // 3. ラグジュアリー・ステレオ・ディレイ（軽快・安定・広大な空間音響）
      const delayNode = ctx.createDelay();
      delayNode.delayTime.setValueAtTime(0.24, ctx.currentTime);
      const delayFeedback = ctx.createGain();
      delayFeedback.gain.setValueAtTime(0.20, ctx.currentTime);
      const delayDamp = ctx.createBiquadFilter();
      delayDamp.type = 'lowpass';
      delayDamp.frequency.setValueAtTime(3200, ctx.currentTime);

      // 4. マスターゲイン（十分な音量）
      lotteryMasterGain = ctx.createGain();
      lotteryMasterGain.gain.setValueAtTime(1.15, ctx.currentTime);

      // 配線: Master -> Compressor -> Destination & Delay Loop
      lotteryMasterGain.connect(lotteryCompressor);
      lotteryMasterGain.connect(delayNode);
      delayNode.connect(delayDamp);
      delayDamp.connect(delayFeedback);
      delayFeedback.connect(delayNode);
      delayFeedback.connect(lotteryCompressor);

      lotteryCompressor.connect(ctx.destination);
    } catch (e) {
      console.warn('Audio Rack init error:', e);
      if (!lotteryMasterGain) {
        lotteryMasterGain = ctx.createGain();
        lotteryMasterGain.connect(ctx.destination);
      }
    }
  }

  function getMasterBus() {
    const ctx = getAudioContext();
    if (!ctx) return null;
    return lotteryMasterGain || ctx.destination;
  }

  /* --- 🥁 ドラム＆シンセ音源ジェネレーター（ラスベガス最高峰音質） --- */
  function playDrumKick(ctx, t, vol = 0.85) {
    // 1. サブベース・ボディ（重厚なサイン波ピッチスイープ）
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(185, t);
    osc.frequency.exponentialRampToValueAtTime(42, t + 0.08);
    osc.frequency.exponentialRampToValueAtTime(28, t + 0.28);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    osc.connect(gain);
    gain.connect(getMasterBus());
    osc.start(t);
    osc.stop(t + 0.32);

    // 2. アタック・トランジェント（パンチの効いた「カチッ」という芯）
    if (lotteryNoiseBuffer) {
      const click = ctx.createBufferSource();
      click.buffer = lotteryNoiseBuffer;
      const clickFilter = ctx.createBiquadFilter();
      clickFilter.type = 'bandpass';
      clickFilter.frequency.setValueAtTime(2800, t);
      clickFilter.Q.setValueAtTime(2.5, t);
      const clickGain = ctx.createGain();
      clickGain.gain.setValueAtTime(vol * 0.45, t);
      clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.025);
      click.connect(clickFilter);
      clickFilter.connect(clickGain);
      clickGain.connect(getMasterBus());
      click.start(t);
      click.stop(t + 0.025);
    }
  }

  function playDrumSnare(ctx, t, vol = 0.5) {
    if (!lotteryNoiseBuffer) return;
    // ノイズ成分
    const noise = ctx.createBufferSource();
    noise.buffer = lotteryNoiseBuffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1400, t);
    filter.Q.setValueAtTime(1.2, t);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(getMasterBus());
    noise.start(t);
    noise.stop(t + 0.16);

    // ボディトーン
    const tone = ctx.createOscillator();
    const toneGain = ctx.createGain();
    tone.type = 'triangle';
    tone.frequency.setValueAtTime(220, t);
    tone.frequency.exponentialRampToValueAtTime(70, t + 0.1);
    toneGain.gain.setValueAtTime(vol * 0.7, t);
    toneGain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    tone.connect(toneGain);
    toneGain.connect(getMasterBus());
    tone.start(t);
    tone.stop(t + 0.1);
  }

    gain.gain.setValueAtTime(0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 1.4);

    osc.connect(gain);
    gain.connect(getMasterBus());
    osc.start(t);

  /* --- 🏟️ オーディエンス・大歓声＆拍手チアエンジン --- */
  function playCrowdCheer(ctx, duration = 4.0, intensity = 0.8) {
    if (!lotteryNoiseBuffer) return;
    try {
      const src = ctx.createBufferSource();
      src.buffer = lotteryNoiseBuffer;
      src.loop = true;

      const f1 = ctx.createBiquadFilter();
      f1.type = 'bandpass';
      f1.frequency.setValueAtTime(1050, ctx.currentTime);
      f1.Q.setValueAtTime(1.4, ctx.currentTime);

      const f2 = ctx.createBiquadFilter();
      f2.type = 'bandpass';
      f2.frequency.setValueAtTime(2300, ctx.currentTime);
      f2.Q.setValueAtTime(1.8, ctx.currentTime);

      const gain = ctx.createGain();
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.exponentialRampToValueAtTime(intensity * 0.7, now + 0.5);
      gain.gain.setValueAtTime(intensity * 0.65, now + duration - 0.8);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      src.connect(f1);
      src.connect(f2);
      f1.connect(gain);
      f2.connect(gain);
      gain.connect(getMasterBus());

      src.start(now);
      src.stop(now + duration);
    } catch (e) {
      console.warn('Crowd cheer error:', e);
    }
  }

  /* --- 🪙 3Dゴールドコイン・リアル物理爆発シャワー --- */
  let vegasCoinAnimId = null;
  function spawn3DGoldCoinPhysicsExplosion(count = 140) {
    const canvas = document.getElementById('lottery-confetti-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    canvas.width = canvas.parentElement.offsetWidth || window.innerWidth;
    canvas.height = canvas.parentElement.offsetHeight || window.innerHeight;

    const coins = [];
    const cx = canvas.width / 2;
    const cy = canvas.height * 0.45;

    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const speed = 7 + Math.random() * 16;
      coins.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (5 + Math.random() * 8),
        gravity: 0.45 + Math.random() * 0.25,
        radius: 10 + Math.random() * 14,
        rotX: Math.random() * Math.PI,
        vRotX: 0.08 + Math.random() * 0.2,
        rotY: Math.random() * Math.PI,
        vRotY: 0.05 + Math.random() * 0.15,
        bounceCount: 0,
        maxBounces: 2 + Math.floor(Math.random() * 3),
        opacity: 1,
        colorType: Math.random() > 0.25 ? 'gold' : (Math.random() > 0.5 ? 'amber' : 'white')
      });
    }

    if (vegasCoinAnimId) cancelAnimationFrame(vegasCoinAnimId);

    function renderCoins() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let aliveCount = 0;

      coins.forEach(c => {
        c.x += c.vx;
        c.y += c.vy;
        c.vy += c.gravity;
        c.rotX += c.vRotX;
        c.rotY += c.vRotY;

        // 床バウンド物理
        if (c.y + c.radius >= canvas.height && c.bounceCount < c.maxBounces) {
          c.y = canvas.height - c.radius;
          c.vy = -c.vy * 0.55;
          c.vx *= 0.8;
          c.bounceCount++;
        }

        if (c.bounceCount >= c.maxBounces) {
          c.opacity -= 0.015;
        }

        if (c.opacity > 0) {
          aliveCount++;
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.globalAlpha = Math.max(0, c.opacity);

          const scaleX = Math.cos(c.rotX);
          ctx.scale(scaleX, 1);

          // コイン本体グラデーション
          const grad = ctx.createLinearGradient(-c.radius, -c.radius, c.radius, c.radius);
          if (c.colorType === 'gold') {
            grad.addColorStop(0, '#fef08a');
            grad.addColorStop(0.3, '#f59e0b');
            grad.addColorStop(0.7, '#d97706');
            grad.addColorStop(1, '#78350f');
          } else {
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.5, '#fde047');
            grad.addColorStop(1, '#b45309');
          }

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
          ctx.fill();

          // メタリック縁取り
          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          // 中央 '$' 刻印
          ctx.fillStyle = '#78350f';
          ctx.font = `900 ${Math.floor(c.radius * 1.1)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('$', 0, 1);

          ctx.restore();
        }
      });

      if (aliveCount > 0) {
        vegasCoinAnimId = requestAnimationFrame(renderCoins);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    renderCoins();
  }

  /* =========================================================================
     🍸 ラスベガス・カジノラウンジ待機BGM音源 (大人のジャズ＆ファンキーグルーヴ)
     ========================================================================= */
  function playLoungeRhodesChord(ctx, t, freqs, vol = 0.22) {
    freqs.forEach(freq => {
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq, t);

      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2, t);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2400, t);
      filter.frequency.exponentialRampToValueAtTime(800, t + 0.6);

      gain.gain.setValueAtTime(vol * 0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(getMasterBus());

      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 0.65);
      osc2.stop(t + 0.65);
    });
  }

  function playLoungeWalkingBass(ctx, t, freq, dur = 0.25, vol = 0.38) {
    const osc = ctx.createOscillator();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(380, t);
    filter.frequency.exponentialRampToValueAtTime(140, t + dur);

    gain.gain.setValueAtTime(vol * 0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(getMasterBus());

    osc.start(t);
    osc.stop(t + dur);
  }

  function playLoungeSoftKick(ctx, t, vol = 0.45) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.08);
    osc.frequency.exponentialRampToValueAtTime(32, t + 0.22);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    osc.connect(gain);
    gain.connect(getMasterBus());
    osc.start(t);
    osc.stop(t + 0.24);
  }

  function playLoungeRimshot(ctx, t, vol = 0.26) {
    if (!lotteryNoiseBuffer) return;
    const noise = ctx.createBufferSource();
    noise.buffer = lotteryNoiseBuffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1800, t);
    filter.Q.setValueAtTime(3.0, t);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(getMasterBus());
    noise.start(t);
    noise.stop(t + 0.08);
  }

  /* --- 🍸 ラスベガス・カジノラウンジ待機BGM (スピン待機中の極上グルーヴ) --- */
  function startVegasLoungeBgm() {
    if (!lotterySoundEnabled || lotteryIsSpinning) return;
    stopVegasLoungeBgm();

    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      if (ctx.state === 'suspended') {
        ctx.resume();
      }

      // エレガントなラスベガス・コード進行 (Cm9 -> Fm9 -> Bb13 -> Ebmaj9)
      const loungeChords = [
        [261.63, 311.13, 392.00, 466.16, 587.33], // Cm9
        [174.61, 207.65, 261.63, 311.13, 392.00], // Fm9
        [233.08, 293.66, 349.23, 415.30, 523.25], // Bb13
        [155.56, 196.00, 233.08, 293.66, 349.23]  // Ebmaj9
      ];
      const walkingBassLines = [
        [65.41, 73.42, 82.41, 87.31], // C -> D -> E -> F
        [87.31, 98.00, 103.83, 116.54], // F -> G -> G# -> A#
        [58.27, 65.41, 73.42, 77.78], // A# -> C -> D -> D#
        [77.78, 87.31, 98.00, 110.00]  // D# -> F -> G -> A
      ];

      let beat = 0;
      const bpm = 110;
      const stepDuration = 60 / bpm / 4; // 16分音符

      vegasLoungeInterval = setInterval(() => {
        if (lotteryIsSpinning || !lotterySoundEnabled) {
          stopVegasLoungeBgm();
          return;
        }

        const now = ctx.currentTime;
        const stepInBar = beat % 16;
        const barIdx = Math.floor((beat / 16) % 4);
        const currChord = loungeChords[barIdx % loungeChords.length];
        const bassLine = walkingBassLines[barIdx % walkingBassLines.length];
        const currBass = bassLine[Math.floor(stepInBar / 4) % bassLine.length];

        // 1. キック（1拍・3拍の頭）
        if (stepInBar === 0 || stepInBar === 8) {
          playLoungeSoftKick(ctx, now, 0.42);
        }
        // 2. リムショット（2拍・4拍）
        if (stepInBar === 4 || stepInBar === 12) {
          playLoungeRimshot(ctx, now, 0.25);
        }
        // 3. ハイハット（裏拍シャッフル）
        if (stepInBar % 2 === 0) {
          const isAccent = (stepInBar % 4 === 2);
          playDrumHiHat(ctx, now, isAccent ? 0.18 : 0.08);
        }
        // 4. ウォーキングベース（各拍の頭）
        if (stepInBar % 4 === 0) {
          playLoungeWalkingBass(ctx, now, currBass, 0.24, 0.35);
        }
        // 5. ローズピアノ和音（シンコペーション：0拍、6拍、10拍）
        if (stepInBar === 0 || stepInBar === 6 || stepInBar === 10) {
          playLoungeRhodesChord(ctx, now, currChord, 0.2);
        }
        // 6. クリスタル・コイン音（2小節に1回、キラッと輝く）
        if (barIdx === 3 && stepInBar === 14) {
          playCoinCascade(ctx, now, 0.12);
        }

        beat++;
      }, stepDuration * 1000);

    } catch (e) {
      console.warn('Lounge BGM error:', e);
    }
  }

  function stopVegasLoungeBgm() {
    if (vegasLoungeInterval) {
      clearInterval(vegasLoungeInterval);
      vegasLoungeInterval = null;
    }
  }

  /* --- 🎵 オーディオ自動アンロック ＆ 全体停止 --- */
  function setupVegasAudioAutoUnlock() {
    if (lotteryAudioCtx && lotteryAudioCtx.state === 'running' && lotterySoundEnabled) {
      if (!lotteryIsSpinning && !vegasMusicInterval && !vegasLoungeInterval) {
        startVegasLoungeBgm();
      }
      return;
    }

    const onFirstUserAction = () => {
      const ctx = getAudioContext();
      if (ctx) {
        if (ctx.state === 'suspended') {
          ctx.resume().then(() => {
            vegasAudioUnlocked = true;
            if (lotterySoundEnabled && !lotteryIsSpinning && !vegasMusicInterval && !vegasLoungeInterval) {
              startVegasLoungeBgm();
            }
          }).catch(e => console.warn('Audio resume failed:', e));
        } else {
          vegasAudioUnlocked = true;
          if (lotterySoundEnabled && !lotteryIsSpinning && !vegasMusicInterval && !vegasLoungeInterval) {
            startVegasLoungeBgm();
          }
        }
      }
      cleanup();
    };

    const cleanup = () => {
      document.removeEventListener('click', onFirstUserAction, true);
      document.removeEventListener('keydown', onFirstUserAction, true);
      document.removeEventListener('touchstart', onFirstUserAction, true);
    };

    document.addEventListener('click', onFirstUserAction, { capture: true, once: true });
    document.addEventListener('keydown', onFirstUserAction, { capture: true, once: true });
    document.addEventListener('touchstart', onFirstUserAction, { capture: true, once: true });
  }

  /* --- 🚀 ラスベガス・メガグルーヴBGM (10種類の豪華ラスベガス・スタイル自動演奏) --- */
  function startVegasCasinoGroove() {
    if (!lotterySoundEnabled) return;
    stopVegasMusic();

    try {
      const ctx = getAudioContext();
      if (!ctx) return;

      // 現在のスタイル（ランダムDJならスピン毎に選出）
      let activeStyle = null;
      if (currentVegasBgmIndex >= VEGAS_BGM_STYLES.length) {
        const randIdx = Math.floor(Math.random() * VEGAS_BGM_STYLES.length);
        activeStyle = VEGAS_BGM_STYLES[randIdx];
        const stageLabel = document.getElementById('lottery-stage-bgm-label');
        if (stageLabel) stageLabel.innerText = `🎵 DJ: ${activeStyle.shortName}`;
      } else {
        activeStyle = VEGAS_BGM_STYLES[currentVegasBgmIndex];
      }

      let beat = 0;
      const bpm = activeStyle.bpm || 132;
      const stepDuration = 60 / bpm / 4; // 16分音符 (ms)

      const chordProg = activeStyle.chords;
      const bassProg = activeStyle.bass;
      const styleType = activeStyle.type;
      const arpeggios = [523.25, 622.25, 783.99, 932.33, 1046.50, 1244.51, 1567.98];

      vegasMusicInterval = setInterval(() => {
        if (!lotteryIsSpinning) {
          stopVegasMusic();
          return;
        }

        const now = ctx.currentTime;
        const stepInBar = beat % 16;
        const barIdx = Math.floor((beat / 16) % 4);
        const currChord = chordProg[barIdx % chordProg.length];
        const currBass = bassProg[barIdx % bassProg.length];

        // 盛り上がり度（ビルドアップ）：スピンが長引くほど会場の興奮度上昇
        const isBuildUpBar = (barIdx >= 2);
        const isClimaxMeasure = (barIdx === 3 && stepInBar >= 8);

        if (styleType === 'edm') {
          // 1. ラスベガス・メガEDM: 4つ打ち + 808サブベース + ブラススタブ + コインベル + ビルドアップライザー
          if (stepInBar % 4 === 0) {
            playDrumKick(ctx, now, 0.95);
            if (stepInBar === 0 && barIdx === 0) playDrumCrash(ctx, now, 0.65);
          }
          if (stepInBar === 4 || stepInBar === 12) {
            playDrumSnare(ctx, now, 0.6);
          } else if (isClimaxMeasure && stepInBar % 2 === 0) {
            // クライマックスでのスネアロール連打
            playDrumSnare(ctx, now, 0.45);
          }
          // 裏拍オープンハイハット
          if (stepInBar % 2 === 0) playDrumHiHat(ctx, now, stepInBar % 4 === 2 ? 0.4 : 0.2);

          // 808サブベース（オクターブ跳躍でグルーヴ感をブースト）
          const edmBass = (stepInBar % 4 === 2) ? currBass * 1.5 : currBass;
          if (stepInBar % 2 === 0) playSynthBass(ctx, now, edmBass, 0.16, 0.5);

          // 華麗なブラススタブ（0拍・6拍・10拍で強烈なキメ）
          if ([0, 6, 10].includes(stepInBar)) {
            playVegasBrassStab(ctx, now, currChord, 0.2, 0.42);
          } else if ([3, 8, 14].includes(stepInBar)) {
            playSuperSawChord(ctx, now, currChord, 0.24, 0.32);
          }

          // カジノ金貨カスケード（小節の頭でチャリンと輝く）
          if (stepInBar === 0) playCoinCascade(ctx, now, 0.14);

          // 4小節目後半のホワイトノイズ・ライザースウィープ
          if (barIdx === 3 && stepInBar === 6) {
            playWhiteNoiseRiser(ctx, now, 0.95, 0.35);
          }

        } else if (styleType === 'funk') {
          // 2. オーシャンズ11・ファンク: スラップベース + ブレイクビート + ワウ＆ブラススタブ
          if (stepInBar === 0 || stepInBar === 7 || stepInBar === 10) playDrumKick(ctx, now, 0.85);
          if (stepInBar === 4 || stepInBar === 12) playDrumSnare(ctx, now, 0.65);
          if (stepInBar === 15) playDrumSnare(ctx, now, 0.3); // ゴーストスネア
          playDrumHiHat(ctx, now, stepInBar % 4 === 2 ? 0.3 : 0.2);

          // スラップベースのオクターブ跳躍
          if (stepInBar % 2 === 0) {
            const octJump = stepInBar === 2 || stepInBar === 6 ? currBass * 2 : currBass;
            playSynthBass(ctx, now, octJump, 0.13, 0.52);
          }
          // キレ味抜群のファンクホーン
          if ([2, 6, 11].includes(stepInBar)) {
            playVegasBrassStab(ctx, now, currChord, 0.16, 0.4);
          } else if (stepInBar === 0) {
            playCoinCascade(ctx, now, 0.12);
          }

        } else if (styleType === 'swing') {
          // 3. ベラージオ・ビッグバンド: スウィングドラム + ウォーキングベース + 豪華ホーンセクション
          if (stepInBar === 0 || stepInBar === 8) playDrumKick(ctx, now, 0.7);
          if (stepInBar === 4 || stepInBar === 12) playDrumSnare(ctx, now, 0.5);
          // シャッフルライドシンバル
          if ([0, 3, 4, 7, 8, 11, 12, 15].includes(stepInBar)) playDrumHiHat(ctx, now, 0.28);

          // ウォーキングベース (4分音符毎に滑らかに推移)
          if (stepInBar % 4 === 0) {
            const walkStep = (stepInBar / 4);
            const walkFreq = currBass * (1 + walkStep * 0.18);
            playSynthBass(ctx, now, walkFreq, 0.26, 0.48);
          }
          // ビッグバンド金管ブラスのゴージャスな咆哮！
          if ([0, 3, 6, 10].includes(stepInBar)) {
            playVegasBrassStab(ctx, now, currChord, 0.24, 0.48);
          }
          if (stepInBar === 0 && barIdx % 2 === 0) playCoinCascade(ctx, now, 0.12);

        } else if (styleType === 'fever') {
          // 4. 777スロットフィーバー: 金貨の滝 + 高速ベル + ディスコキック
          if (stepInBar % 4 === 0) playDrumKick(ctx, now, 0.9);
          if (stepInBar === 4 || stepInBar === 12) playDrumSnare(ctx, now, 0.55);
          playDrumHiHat(ctx, now, 0.22);
          if (stepInBar % 2 === 0) playSynthBass(ctx, now, currBass, 0.14, 0.45);
          if (stepInBar % 4 === 0) playVegasBrassStab(ctx, now, currChord, 0.22, 0.38);

          // 毎拍鳴り響くキラキラ金貨コイン
          if (stepInBar % 4 === 2) playCoinCascade(ctx, now, 0.18);

          // 毎16分音符でキラキラ滝のように鳴るベル
          const bellFreq = arpeggios[beat % arpeggios.length];
          const bellOsc = ctx.createOscillator();
          const bellGain = ctx.createGain();
          bellOsc.type = 'sine';
          bellOsc.frequency.setValueAtTime(bellFreq, now);
          bellGain.gain.setValueAtTime(0.14, now);
          bellGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          bellOsc.connect(bellGain);
          bellGain.connect(getMasterBus());
          bellOsc.start(now);
          bellOsc.stop(now + 0.1);

        } else if (styleType === 'samba') {
          // 5. ショーガール・サンバ: アゴゴ・シンコペーション + ラテンブラス
          if ([0, 3, 6, 10, 12].includes(stepInBar)) playDrumKick(ctx, now, 0.85);
          if ([4, 8, 12].includes(stepInBar)) playDrumSnare(ctx, now, 0.55);
          playDrumHiHat(ctx, now, 0.25);
          if (stepInBar % 2 === 0) playSynthBass(ctx, now, currBass, 0.15, 0.48);
          if ([0, 3, 7, 10, 14].includes(stepInBar)) playVegasBrassStab(ctx, now, currChord, 0.22, 0.44);

        } else if (styleType === 'eurobeat') {
          // 6. ハイローラー・ユーロビート: 152BPMの猛スピード疾走 + 16分ベース + 鋭利ブラス
          if (stepInBar % 4 === 0) playDrumKick(ctx, now, 0.95);
          if (stepInBar === 4 || stepInBar === 12) playDrumSnare(ctx, now, 0.65);
          if (stepInBar % 2 === 1) playDrumHiHat(ctx, now, 0.35); // 裏拍オープンハイハット
          // 16分連打ベース
          playSynthBass(ctx, now, currBass, 0.1, 0.48);
          if ([0, 3, 6, 9, 12, 14].includes(stepInBar)) playVegasBrassStab(ctx, now, currChord, 0.16, 0.42);

        } else if (styleType === 'trance') {
          // 7. サイバーネオン・トランス: 909キック + 16分ローリングサブベース + フィルターコード
          if (stepInBar % 4 === 0) playDrumKick(ctx, now, 0.95);
          if (stepInBar === 4 || stepInBar === 12) playDrumSnare(ctx, now, 0.55);
          if (stepInBar % 2 === 1) playDrumHiHat(ctx, now, 0.38);
          if (stepInBar % 4 !== 0) playSynthBass(ctx, now, currBass, 0.11, 0.52);
          if (stepInBar === 0 || stepInBar === 8) playSuperSawChord(ctx, now, currChord, 0.5, 0.38);
          if (stepInBar === 0) playCoinCascade(ctx, now, 0.15);

        } else if (styleType === 'trailer') {
          // 8. 映画予告シネマティック: ハンス・ジマー重厚太鼓 + 迫真の緊張感
          if (stepInBar === 0 || stepInBar === 8) playDrumKick(ctx, now, 1.0);
          if (stepInBar === 4 || stepInBar === 12) playDrumSnare(ctx, now, 0.45);
          const tickOsc = ctx.createOscillator();
          const tickGain = ctx.createGain();
          tickOsc.type = 'triangle';
          tickOsc.frequency.setValueAtTime(1200, now);
          tickGain.gain.setValueAtTime(0.08, now);
          tickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
          tickOsc.connect(tickGain);
          tickGain.connect(getMasterBus());
          tickOsc.start(now);
          tickOsc.stop(now + 0.02);
          if (stepInBar === 0) playCinemaBraam(ctx, now);
          if (stepInBar % 4 === 0) playVegasBrassStab(ctx, now, currChord, 0.3, 0.45);

        } else if (styleType === 'disco') {
          // 9. ゴージャス・70sディスコ: 4つ打ち + オクターブディスコベース + ホーンスタブ
          if (stepInBar % 4 === 0) playDrumKick(ctx, now, 0.9);
          if (stepInBar === 4 || stepInBar === 12) playDrumSnare(ctx, now, 0.6);
          if (stepInBar % 4 === 2) playDrumHiHat(ctx, now, 0.42); // ディスコオープンハット
          const discoBassFreq = (stepInBar % 4 === 2) ? currBass * 2 : currBass;
          playSynthBass(ctx, now, discoBassFreq, 0.16, 0.48);
          if ([0, 3, 6, 8, 10, 14].includes(stepInBar)) playVegasBrassStab(ctx, now, currChord, 0.2, 0.42);
          if (stepInBar === 0) playCoinCascade(ctx, now, 0.14);

        } else if (styleType === 'climax') {
          // 10. 1億円クライマックス: ダブルキック + 全開ブラス + 金貨の嵐
          if (stepInBar % 2 === 0) playDrumKick(ctx, now, 0.95);
          if (stepInBar % 4 === 2) playDrumSnare(ctx, now, 0.65);
          playDrumHiHat(ctx, now, 0.3);
          playSynthBass(ctx, now, currBass, 0.12, 0.55);
          if (stepInBar % 2 === 0) playVegasBrassStab(ctx, now, currChord, 0.2, 0.48);
          if (stepInBar % 8 === 0) playDrumCrash(ctx, now, 0.5);
          if (stepInBar % 4 === 0) playCoinCascade(ctx, now, 0.18);

        } else if (styleType === 'eva_impact') {
          // 11. 黙示録セカンドインパクト交響曲: ティンパニ乱打 + 聖歌隊 + 重低音ブラス
          if ([0, 1, 2, 3, 6, 7, 8, 12, 13, 14].includes(stepInBar)) {
            const isAcc = [0, 6, 8, 12].includes(stepInBar);
            playDrumKick(ctx, now, isAcc ? 0.98 : 0.68);
            playSynthBass(ctx, now, currBass, 0.12, isAcc ? 0.65 : 0.38);
          }
          if (stepInBar === 4 || stepInBar === 12) playDrumSnare(ctx, now, 0.68);
          if (stepInBar === 0 && barIdx === 0) playDrumCrash(ctx, now, 0.7);

          if (stepInBar === 0 || stepInBar === 8) {
            playSuperSawChord(ctx, now, currChord, 0.6, 0.45);
          }
          if (barIdx === 3 && stepInBar === 0) {
            playCinemaBraam(ctx, now);
          }
        }

        beat++;
      }, stepDuration * 1000);
    } catch (e) {
      console.warn('Vegas groove error:', e);
    }
  }

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.5);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.connect(gain);
        gain.connect(getMasterBus());
        osc.start(now);
        osc.stop(now + 0.5);

      } else if (type === 'tick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc.connect(gain);
        gain.connect(getMasterBus());
        osc.start(now);
        osc.stop(now + 0.03);

      } else if (type === 'snap') {

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(950, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.09);
        gain.gain.setValueAtTime(0.48, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(getMasterBus());
        osc.start(now);
        osc.stop(now + 0.09);

      } else if (type === 'reverse_snap') {
        // 逆戻り時の映画的巨大ショック（BWAAAM! ＋ 歪み）
        playCinemaBraam(ctx, now);

      } else if (type === 'slow_creep_tick') {

      } else if (type === 'blackout_power_down') {

          gain.gain.setValueAtTime(0.35, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.5);
          osc.connect(gain);
          gain.connect(getMasterBus());
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.5);
        });

      } else if (type === 'fanfare') {
        // ★★★ ラスベガス・グランドファンファーレ (豪華12声ビッグバンド・ブラスアンセム) ★★★
        playDrumCrash(ctx, now, 0.9);
        playDrumCrash(ctx, now + 0.85, 0.95);

        // 会場中がスタンディングオベーションの大歓声＆拍手
        playCrowdCheer(ctx, 6.5, 0.95);

        const fanfareChords = [
          { time: 0.0, freqs: [233.08, 293.66, 349.23, 466.16], dur: 0.28 }, // Bb
          { time: 0.24, freqs: [261.63, 329.63, 392.00, 523.25], dur: 0.28 }, // C
          { time: 0.48, freqs: [349.23, 440.00, 523.25, 698.46], dur: 0.38 }, // F
          { time: 0.85, freqs: [466.16, 587.33, 698.46, 932.33, 1174.66], dur: 3.5 } // High Bb Major add9
        ];

        fanfareChords.forEach(c => {
          playVegasBrassStab(ctx, now + c.time, c.freqs, c.dur, 0.65);
          playSuperSawChord(ctx, now + c.time, c.freqs, c.dur, 0.45);
          playDrumKick(ctx, now + c.time, 0.85);

        // 金貨コインシャワーの連続カスケード
        [0.1, 0.4, 0.7, 1.0, 1.3, 1.6, 2.0, 2.4].forEach(d => {
          playCoinCascade(ctx, now + d, 0.22);

      } else if (type === 'reach') {

    } catch (e) {
      console.warn('Audio playback error:', e);
    }
  }

  /* --- 満遍なく当たる公平アルゴリズム --- */
  function selectLotteryWinner(candidates) {
    if (!candidates || candidates.length === 0) return null;

    if (lotteryAlgoMode === 'round-robin') {
      let minWins = Infinity;
      candidates.forEach(m => {
        const count = Number(m.win_count || 0);
        if (count < minWins) minWins = count;
      });

      const pool = candidates.filter(m => Number(m.win_count || 0) === minWins);
      return pool[Math.floor(Math.random() * pool.length)];
    } else if (lotteryAlgoMode === 'weighted') {
      let weightedPool = [];
      candidates.forEach(m => {
        const count = Number(m.win_count || 0);
        const weight = count === 0 ? 100 : (count === 1 ? 15 : 3);
        for (let i = 0; i < weight; i++) {
          weightedPool.push(m);
        }
      });
      return weightedPool[Math.floor(Math.random() * weightedPool.length)];
    } else {
      return candidates[Math.floor(Math.random() * candidates.length)];
    }
  }

  async function startLotterySpin() {
    if (lotteryIsSpinning) return;

    if (candidates.length === 0) {
      showToast('抽選対象のメンバーがいません。出欠設定を確認してください。', 'warning');

    const theaterWrapper = document.getElementById('lottery-theater-wrapper');

    let activeDrama = null;
    if (currentVegasDramaIndex >= VEGAS_DRAMA_PATTERNS.length) {
      const randIdx = Math.floor(Math.random() * VEGAS_DRAMA_PATTERNS.length);
      activeDrama = VEGAS_DRAMA_PATTERNS[randIdx];

    } else {
      activeDrama = VEGAS_DRAMA_PATTERNS[currentVegasDramaIndex];
    }

    // リセット
    if (theaterWrapper) {
      theaterWrapper.classList.remove('vegas-blackout', 'vegas-red-alert');
    }
    if (cabinetBox) {
      cabinetBox.classList.add('vegas-active-cabinet');
      cabinetBox.classList.remove('vegas-red-alert', 'vegas-glitch');
    }

    if (spinBtn) {
      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-60', 'cursor-not-allowed');
      spinBtn.innerHTML = '<span class="flex items-center gap-2"><i class="fa-solid fa-spinner fa-spin text-base"></i><span>MEGA SPINNING...</span></span>';
    }
    if (statusMsg) {
      statusMsg.innerText = `★ MEGA JACKPOT ルーレット超高速スピン！！ [${activeDrama.shortName}] ★`;
      statusMsg.className = 'text-amber-300 font-extrabold tracking-widest animate-pulse';
    }

    const winner = selectLotteryWinner(candidates);
    currentWinner = winner;

    playLotterySound('spin_start');
    stopVegasLoungeBgm();
    startVegasCasinoGroove();
    setVegasBgMode('warp');
    triggerVegasScreenShake(350);

    const audioCtx = getAudioContext();
    if (audioCtx) playCrowdCheer(audioCtx, 4.5, 0.75);
    speakVegasAnnouncer('レディス・アンド・ジェントルメン！ 運命の1億円メガジャックポット！ スピン、スタート！');

    const strip = document.getElementById('reel-strip-1');
    if (!strip) return;

    strip.innerHTML = '';
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0px)';

    // 候補者プールの準備
    const otherCandidates = candidates.filter(m => String(m.id) !== String(winner.id));
    const kawaguchi = lotteryMembers.find(m => m.name && m.name.includes('川口')) || {
      id: 'kawaguchi_creator',

    const candA = otherCandidates[0] || winner;
    const candB = otherCandidates[1] || candA;
    const candC = otherCandidates[2] || candB;
    const candD = otherCandidates[3] || candC;

    const DUMMY_COUNT = 32;
    const shuffled = [...candidates].sort(() => Math.random() - 0.5);
    for (let i = 0; i < DUMMY_COUNT; i++) {
      strip.appendChild(createReelItemElement(shuffled[i % shuffled.length]));

    // ドラマごとのアイテム配置
    let itemFirstStop = null;
    let itemWinner = null;
    let dramaContext = { winner, candA, candB, candC, candD, candPres, kawaguchi };

      const targetFake = !isWinnerKawaguchi ? kawaguchi : candA;
      itemFirstStop = createReelItemElement(targetFake);
      const itemB = createReelItemElement(candB);
      const itemC = createReelItemElement(candC);
      const itemD = createReelItemElement(candD);
      const itemE = createReelItemElement(otherCandidates[4] || candA);
      const itemBack = createReelItemElement(targetFake);
      itemWinner = createReelItemElement(winner, true);

      strip.appendChild(itemB);
      strip.appendChild(itemC);
      strip.appendChild(itemD);
      strip.appendChild(itemE);
      strip.appendChild(itemBack);
      strip.appendChild(itemWinner);

      dramaContext.itemB = itemB;
      dramaContext.itemC = itemC;
      dramaContext.itemD = itemD;
      dramaContext.itemE = itemE;
      dramaContext.itemBack = itemBack;
      dramaContext.itemWinner = itemWinner;
      dramaContext.targetFake = targetFake;

    } else if (activeDrama.id === 'president') {
      itemFirstStop = createReelItemElement(candPres);
      strip.appendChild(itemFirstStop);
      for (let k = 0; k < 4; k++) strip.appendChild(createReelItemElement(shuffled[k % shuffled.length]));
      itemWinner = createReelItemElement(winner, true);
      strip.appendChild(itemWinner);
      strip.appendChild(createReelItemElement(candA));

      dramaContext.itemFirstStop = itemFirstStop;
      dramaContext.itemWinner = itemWinner;

    } else if (activeDrama.id === 'deadheat') {
      const itemA = createReelItemElement(candA);
      const itemB = createReelItemElement(candB);
      itemFirstStop = itemA;
      itemWinner = createReelItemElement(winner, true);
      strip.appendChild(itemA);
      strip.appendChild(itemB);
      strip.appendChild(itemWinner);
      strip.appendChild(createReelItemElement(candC));

      dramaContext.itemA = itemA;
      dramaContext.itemB = itemB;
      dramaContext.itemWinner = itemWinner;

    } else if (activeDrama.id === 'overrun') {
      itemWinner = createReelItemElement(winner, true);
      const itemOvershoot1 = createReelItemElement(candA);
      const itemOvershoot2 = createReelItemElement(candB);
      strip.appendChild(itemWinner);
      strip.appendChild(itemOvershoot1);
      strip.appendChild(itemOvershoot2); // ここまで行き過ぎる
      strip.appendChild(createReelItemElement(candC));

      itemFirstStop = itemOvershoot2;
      dramaContext.itemWinner = itemWinner;
      dramaContext.itemOvershoot1 = itemOvershoot1;
      dramaContext.itemOvershoot2 = itemOvershoot2;

    } else if (activeDrama.id === 'rookie') {
      const itemVet1 = createReelItemElement(candA);
      const itemVet2 = createReelItemElement(candB);
      itemWinner = createReelItemElement(winner, true);
      strip.appendChild(itemVet1);
      strip.appendChild(itemVet2);
      strip.appendChild(itemWinner);
      strip.appendChild(createReelItemElement(candC));

      itemFirstStop = itemVet1;
      dramaContext.itemVet1 = itemVet1;
      dramaContext.itemVet2 = itemVet2;
      dramaContext.itemWinner = itemWinner;

    } else if (activeDrama.id === 'defibrillator') {
      const itemDummyCrack = createReelItemElement(candA);
      itemWinner = createReelItemElement(winner, true);
      strip.appendChild(itemDummyCrack);
      strip.appendChild(itemWinner);
      strip.appendChild(createReelItemElement(candB));

      itemFirstStop = itemDummyCrack;
      dramaContext.itemDummyCrack = itemDummyCrack;
      dramaContext.itemWinner = itemWinner;

    } else if (activeDrama.id === 'triplejump') {
      const item1 = createReelItemElement(candA);
      const item2 = createReelItemElement(candB);
      itemWinner = createReelItemElement(winner, true);
      strip.appendChild(item1);
      strip.appendChild(item2);
      strip.appendChild(itemWinner);
      strip.appendChild(createReelItemElement(candC));

      itemFirstStop = item1;
      dramaContext.item1 = item1;
      dramaContext.item2 = item2;
      dramaContext.itemWinner = itemWinner;

    } else if (activeDrama.id === 'blackhole') {
      itemWinner = createReelItemElement(winner, true);
      strip.appendChild(createReelItemElement(candA));
      strip.appendChild(itemWinner);
      strip.appendChild(createReelItemElement(candB));

      itemFirstStop = itemWinner;
      dramaContext.itemWinner = itemWinner;

    } else if (activeDrama.id === 'instantflash') {
      itemWinner = createReelItemElement(winner, true);
      strip.appendChild(itemWinner);
      strip.appendChild(createReelItemElement(candA));

      itemFirstStop = itemWinner;
      dramaContext.itemWinner = itemWinner;

    } else if (activeDrama.id === 'poltergeist') {
      itemWinner = createReelItemElement(winner, true);
      strip.appendChild(createReelItemElement(candA));
      strip.appendChild(itemWinner);
      strip.appendChild(createReelItemElement(candB));

      itemFirstStop = itemWinner;
      dramaContext.itemWinner = itemWinner;
    }

    requestAnimationFrame(() => {
      strip.classList.add('reel-spinning');
    });

    // 1. 【第1フェーズ：超高速ワープスピン (5.0秒間)】
    setTimeout(() => {
      if (statusMsg && lotteryIsSpinning) {
        statusMsg.innerText = `⚡ [${activeDrama.shortName}] 超高速スピン大回転中！！ ボルテージ急上昇…！！ ⚡`;
        statusMsg.className = 'text-amber-300 font-black text-sm tracking-widest animate-pulse';
      }
    }, 2000);

    setTimeout(() => {
      if (statusMsg && lotteryIsSpinning) {
        statusMsg.innerText = '🔥 まもなく減速開始…！！ 運命の候補者は誰だ！？ 🔥';
        statusMsg.className = 'text-red-400 font-black text-sm tracking-widest animate-bounce';
      }
    }, 3800);

    // 【パターン9：電光石火一撃】のみ、減速せず10秒まで超高速のまま直撃！
    if (activeDrama.id === 'instantflash') {
      setTimeout(() => {
        strip.classList.remove('reel-spinning');
        stopVegasMusic();
        runDramaInstantFlash(strip, dramaContext);
      }, 10000);
      return;
    }

    // 2. 【第2フェーズ：徐々にゆっくり減速 (5.0秒間・合計10秒の究極ロングスピン！)】
    setTimeout(() => {
      strip.classList.remove('reel-spinning');
      speakVegasAnnouncer('スローダウン！ ここから徐々に減速！ 誰が選ばれるのか！？');

      const yFirstStop = getCenterTranslateY(itemFirstStop);
      // 5.0秒間かけて極めてリアルに滑らかに減速していくイージング
      strip.style.transition = 'transform 5.0s cubic-bezier(0.06, 0.88, 0.18, 1)';
      strip.style.transform = `translateY(${yFirstStop}px)`;

      if (statusMsg) {
        statusMsg.innerText = '⚡ 超高速から徐々に減速中…！！ [5秒間スローダウン] 運命の候補者が絞り込まれる…！！ ⚡';
        statusMsg.className = 'text-amber-300 font-black text-xs sm:text-sm tracking-wide';
      }

      // 減速中のリアルなラチェット通過音
      const clickDelays = [400, 900, 1500, 2200, 3000, 3900, 4700];
      clickDelays.forEach(d => {
        setTimeout(() => {
          if (lotteryIsSpinning) playLotterySound('tick');
        }, d);
      });

      // 5.0秒後（累計10秒後）：各ドラマ演出へ突入！
      setTimeout(() => {
        stopVegasMusic();
        dispatchDramaSequence(activeDrama.id, strip, dramaContext);
      }, 5100);

    }, 5000);
  }

  /* --- 🎭 10大ドラマ演出ディスパッチャー --- */
  function dispatchDramaSequence(dramaId, strip, ctx) {
    if (dramaId === 'kawaguchi') runDramaKawaguchi(strip, ctx);
    else if (dramaId === 'president') runDramaPresident(strip, ctx);
    else if (dramaId === 'deadheat') runDramaDeadheat(strip, ctx);
    else if (dramaId === 'overrun') runDramaOverrun(strip, ctx);
    else if (dramaId === 'rookie') runDramaRookie(strip, ctx);
    else if (dramaId === 'defibrillator') runDramaDefibrillator(strip, ctx);
    else if (dramaId === 'triplejump') runDramaTripleJump(strip, ctx);
    else if (dramaId === 'blackhole') runDramaBlackhole(strip, ctx);
    else if (dramaId === 'poltergeist') runDramaPoltergeist(strip, ctx);
    else runDramaKawaguchi(strip, ctx);
  }

     【ドラマ1: 自作自演疑惑SP】 (マシン物理崩壊・枠外飛び出し・斜め大暴走)
     ========================================================================= */
  function runDramaKawaguchi(strip, ctx) {
    const { winner, targetFake, isWinnerKawaguchi, itemFirstStop, itemWinner } = ctx;

    if (statusMsg) {
      statusMsg.innerText = !isWinnerKawaguchi ? `「川口 陽平（製作者）」さんで決定か…！？ まさかの自作自演！？` : `「${targetFake.name}」さんで決定か…！？`;
      statusMsg.className = 'text-amber-300 font-extrabold tracking-wide';
    }

    // 2. 偽ファンファーレ
    setTimeout(() => {
      playLotterySound('fake_fanfare');
      if (!isWinnerKawaguchi) speakVegasAnnouncer('おっと！？ 川口陽平！？ まさかの製作者、自作自演かーー！？');
      if (statusMsg) {
        statusMsg.innerText = !isWinnerKawaguchi ? `🎉 当選決定！？ 「川口 陽平」さんおめでと…って自分で作ったアプリやろ！？` : `🎉 当選決定！！ 「${targetFake.name}」さんおめでと…！？`;
        statusMsg.className = 'text-amber-400 font-black text-sm sm:text-base animate-pulse';
      }
    }, 1400);

    // 3. マシン負荷限界・ブラックアウト
    setTimeout(() => {
      if (theaterWrapper) theaterWrapper.classList.add('vegas-blackout');
      playLotterySound('blackout_power_down');
      triggerVegasScreenShake(600);
      speakVegasAnnouncer('警告！ 警告！ 自作自演の重圧でマシンが限界突破！！');
      if (statusMsg) {
        statusMsg.innerText = `⚠️ 自作自演検知！！ マシンの負荷が臨界突破！！ OVERHEAT!! ⚠️`;
        statusMsg.className = 'text-red-500 font-mono tracking-widest';
      }

      // 4. ★★★ 【ド派手マシン物理崩壊！ 枠からはみ出て斜めに飛び出す！！】 ★★★
      setTimeout(() => {
        if (theaterWrapper) {
          theaterWrapper.classList.remove('vegas-blackout');

        if (cabinetBox) {
          cabinetBox.classList.add('cabinet-exploded-skew', 'vegas-red-alert');
        }
        if (reelWindow) {
          reelWindow.classList.add('machine-broken-breakout');
        }

        setVegasBgMode('red_alert');
        playLotterySound('emergency_siren');
        playLotterySound('glitch_burst');
        triggerVegasScreenShake(1200);

        speakVegasAnnouncer('うわあああーー！！ マシンが壊れたーー！！ 枠からはみ出て斜めに飛び出したーー！！');
        if (statusMsg) {
          statusMsg.innerText = `💥💥 ドガァァァン！！ マシンが物理破壊！！ 枠からはみ出て斜めに大暴走中ーー！！ 💥💥`;
          statusMsg.className = 'text-red-500 font-black text-sm sm:text-base tracking-widest animate-bounce';
        }

        // ドラムが斜めに傾きながら枠外へ飛び出して回転し続ける！
        strip.classList.add('reel-diagonal-rampage', 'reel-spinning');

        // 5. 斜めにどこまでぶっ壊れていくんやー！実況
        setTimeout(() => {
          speakVegasAnnouncer('斜めにどこまでぶっ壊れていくんやーー！！ 制御不能！ ルーレットが画面全体を斜め大暴走中！！');
          triggerVegasScreenShake(800);
          playLotterySound('reverse_snap');
        }, 2200);

        // 6. 非常停止装置が激突！ 中央へ力づくで引き戻される！
        setTimeout(() => {
          speakVegasAnnouncer('非常停止装置、激突！！ ドラムが中央へ力づくで引き戻される！！');
          if (statusMsg) {
            statusMsg.innerText = `⚡⚡ 緊急ブレーキ激突！！ ドラムが中央へ力づくで引き戻される！！ ⚡⚡`;
            statusMsg.className = 'text-amber-300 font-black text-sm tracking-wide animate-pulse';
          }

          strip.classList.remove('reel-diagonal-rampage', 'reel-spinning');
          strip.style.transform = 'rotate(0deg) scale(1) translate(0, 0)';
          triggerVegasScreenShake(1000);
          playLotterySound('reverse_snap');

          // 7. 真の勝者へクリーン着地＆大爆発ジャックポット！
          setTimeout(() => {
            if (cabinetBox) cabinetBox.classList.remove('cabinet-exploded-skew', 'vegas-red-alert');
            if (reelWindow) reelWindow.classList.remove('machine-broken-breakout');

            const yWinner = getCenterTranslateY(itemWinner);
            strip.style.transition = 'transform 0.5s cubic-bezier(0.12, 1.4, 0.28, 1)';
            strip.style.transform = `translateY(${yWinner}px)`;

            }, 600);

          }, 1200);

        }, 4600);

      }, 1000);

     【ドラマ3: 2強一騎打ち・写真判定デッドヒート】 (ミリ差往復からダークホース)
     ========================================================================= */
  function runDramaDeadheat(strip, ctx) {
    const { winner, candA, candB, itemA, itemWinner } = ctx;
    const statusMsg = document.getElementById('lottery-status-message');

    const yA = getCenterTranslateY(itemA);
    strip.style.transition = 'transform 0.5s ease-out';
    strip.style.transform = `translateY(${yA}px)`;

    if (statusMsg) {
      statusMsg.innerText = `🔥 2強一騎打ち！！ 「${candA.name}」VS「${candB.name}」息を呑む写真判定！！ 🔥`;
      statusMsg.className = 'text-red-400 font-black text-xs sm:text-sm tracking-widest';
    }
    speakVegasAnnouncer(`${candA.name}さんか！？ ${candB.name}さんか！？ 写真判定デッドヒート！`);

    // 高速で上下に往復（写真判定）
    let toggle = 0;
    const interval = setInterval(() => {
      toggle++;
      const offset = (toggle % 2 === 0 ? 12 : -12);
      strip.style.transition = 'transform 0.15s ease-in-out';
      strip.style.transform = `translateY(${yA + offset}px)`;
      playLotterySound('tug_tick');

      if (toggle >= 8) {
        clearInterval(interval);
        // 第3の候補（Winner）が下から一気に滑り込む！
        setTimeout(() => {
          const yWinner = getCenterTranslateY(itemWinner);
          strip.style.transition = 'transform 0.35s cubic-bezier(0.15, 1.4, 0.3, 1)';
          strip.style.transform = `translateY(${yWinner}px)`;

        }, 400);
      }
    }, 180);

    }

    playLotterySound('fanfare');
    startConfetti();
    spawn3DGoldCoinPhysicsExplosion(120);

    const winnerItem = document.getElementById('winner-reel-item');
    if (winnerItem) winnerItem.classList.add('vegas-gold-card-foil');

    setTimeout(() => {
      openWinnerModal(winner);
    }, 2800);
  }

  async function recordWinnerToDb() {
    if (!currentWinner) return;
    const winner = currentWinner;
    const awardInput = document.getElementById('lottery-award-input');
    const awardTitle = awardInput ? (awardInput.value.trim() || '商品抽選') : '商品抽選';
    const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, '/');
    const recordBtn = document.getElementById('winner-record-btn');

    if (recordBtn) {
      recordBtn.disabled = true;
      recordBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 記録中...';
    }

    try {
      const res = await ApiService.call('recordLotteryWinnerApi', {
        member_id: String(winner.id),
        member_name: winner.name,
        award_title: awardTitle,
        won_at: todayStr
      });

      if (res && res.success !== false) {
        winner.win_count = (Number(winner.win_count) || 0) + 1;
        winner.last_won_at = todayStr;
        lotteryHistory.unshift({
          id: res.id || String(Date.now()),
          member_id: String(winner.id),
          member_name: winner.name,
          award_title: awardTitle,
          won_at: todayStr
        });

        const histBadge = document.getElementById('lottery-history-count-badge');
        if (histBadge) histBadge.innerText = lotteryHistory.length;

        showToast(`${winner.name} 様の当選を記録しました！`, 'success');
        if (recordBtn) {
          recordBtn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> 記録完了';
          recordBtn.className = 'px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm shadow-md transition-all flex items-center gap-2';
        }
      }
    } catch (e) {
      console.error('Failed to record lottery winner:', e);
      showToast('記録に失敗しました', 'error');
      if (recordBtn) {
        recordBtn.disabled = false;
        recordBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 再試行';
      }
    }
  }

  /* --- 当選モーダル --- */
  function openWinnerModal(winner) {
    const finalWinner = winner || currentWinner;
    if (!finalWinner) return;

    const modal = document.getElementById('lottery-winner-modal');
    const nameEl = document.getElementById('winner-modal-name');
    const catEl = document.getElementById('winner-modal-category');
    const profEl = document.getElementById('winner-modal-profession');
    const awardEl = document.getElementById('winner-modal-award-name');
    const initialEl = document.getElementById('winner-modal-avatar-initial');
    const awardInput = document.getElementById('lottery-award-input');
    const recordBtn = document.getElementById('winner-record-btn');

    if (nameEl) nameEl.innerText = finalWinner.name || '';
    if (catEl) catEl.innerText = finalWinner.category || 'メンバー';
    if (profEl) profEl.innerText = finalWinner.profession || '';
    if (awardEl) awardEl.innerText = awardInput ? (awardInput.value.trim() || '商品抽選') : '商品抽選';
    if (initialEl) initialEl.innerText = (finalWinner.name || '').trim().substring(0, 1) || 'R';

    if (recordBtn) {
      recordBtn.disabled = false;
      recordBtn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> 当選を記録する';
      recordBtn.className = 'px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-amber-600 hover:from-amber-300 hover:to-amber-500 text-slate-950 font-black text-sm shadow-lg shadow-amber-500/30 transition-all flex items-center gap-2 cursor-pointer';
    }

    if (modal) {
      modal.classList.remove('hidden');
      const card = modal.querySelector('.winner-card');
      if (card) {
        setTimeout(() => {
          card.classList.remove('scale-90', 'opacity-0');
          card.classList.add('scale-100', 'opacity-100');
        }, 50);
      }
    }
  }

  function closeWinnerModal() {
    const modal = document.getElementById('lottery-winner-modal');
    if (modal) {
      const card = modal.querySelector('.winner-card');
      if (card) {
        card.classList.remove('scale-100', 'opacity-100');
        card.classList.add('scale-90', 'opacity-0');
      }
      setTimeout(() => {
        modal.classList.add('hidden');
        stopConfetti();
        setVegasBgMode('idle');
        updateLotteryUI();
        if (lotterySoundEnabled && !lotteryIsSpinning) {
          startVegasLoungeBgm();
        }
      }, 250);
    }
  }

  /* --- 紙吹雪 (Confetti) アニメーションエンジン --- */
  function startConfetti() {
    const canvas = document.getElementById('lottery-confetti-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    const particles = [];
    const colors = ['#f59e0b', '#fbbf24', '#fde047', '#ffd700', '#ef4444', '#dc2626', '#10b981', '#ffffff'];

    for (let i = 0; i < 240; i++) {
      particles.push({
        x: canvas.width * 0.5 + (Math.random() - 0.5) * 260,
        y: canvas.height * 0.4 + (Math.random() - 0.5) * 130,
        vx: (Math.random() - 0.5) * 22,
        vy: -Math.random() * 20 - 5,
        size: Math.random() * 9 + 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 14,
        gravity: 0.35,
        drag: 0.96
      });
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = 0;

      particles.forEach(p => {
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.vrot;

        if (p.y < canvas.height + 20) {
          alive++;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        }
      });

      if (alive > 0) {
        confettiAnimationId = requestAnimationFrame(render);
      }
    }

    if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
    render();
  }

  function stopConfetti() {
    if (confettiAnimationId) {
      cancelAnimationFrame(confettiAnimationId);
      confettiAnimationId = null;
    }
    const canvas = document.getElementById('lottery-confetti-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  /* --- 16:9 フルスクリーン切替 --- */
  function toggleLotteryFullscreen() {
    const wrapper = document.getElementById('lottery-theater-wrapper');
    if (!wrapper) return;

    if (!document.fullscreenElement) {
      if (wrapper.requestFullscreen) {
        wrapper.requestFullscreen();
      } else if (wrapper.webkitRequestFullscreen) {
        wrapper.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }

  function exitLotteryFullscreen() {
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen();
    }
  }

  document.addEventListener('fullscreenchange', () => {
    const wrapper = document.getElementById('lottery-theater-wrapper');
    const closeBtn = document.querySelector('.lottery-fs-close-btn');
    const btnText = document.getElementById('lottery-fullscreen-btn-text');
    const isFs = !!document.fullscreenElement;

    if (wrapper) {
      if (isFs) {
        wrapper.classList.add('is-fullscreen');
        if (closeBtn) closeBtn.classList.remove('hidden');
        if (btnText) btnText.innerText = '全画面解除';
      } else {
        wrapper.classList.remove('is-fullscreen');
        if (closeBtn) closeBtn.classList.add('hidden');
        if (btnText) btnText.innerText = '16:9 全画面';
      }
    }
  });

  /* --- 賞名プリセット切替 --- */
  function cycleAwardPreset() {
    awardPresetIndex = (awardPresetIndex + 1) % AWARD_PRESETS.length;
    const input = document.getElementById('lottery-award-input');
    if (input) {
      input.value = AWARD_PRESETS[awardPresetIndex];
      input.focus();
    }
  }

  /* --- アルゴリズム切替 --- */
  function changeLotteryAlgoMode(mode) {
    lotteryAlgoMode = mode;
    const display = document.getElementById('lottery-mode-display');
    if (!display) return;

    if (mode === 'round-robin') {
      display.innerHTML = '<i class="fa-solid fa-scale-balanced text-amber-400"></i><span class="text-amber-400">未当選者優先 (Round-Robin)</span>';
    } else if (mode === 'weighted') {
      display.innerHTML = '<i class="fa-solid fa-chart-simple text-amber-400"></i><span class="text-amber-400">確率ウェイト (未当選者高確率)</span>';
    } else {
      display.innerHTML = '<i class="fa-solid fa-shuffle text-amber-300"></i><span class="text-amber-300">完全ランダム抽選</span>';
    }
  }

  /* --- メンバー抽選対象・出欠モーダル --- */
  function openLotteryMemberConfigModal() {
    const modal = document.getElementById('lottery-member-config-modal');
    if (!modal) return;
    renderLotteryMemberConfigList();
    modal.classList.remove('hidden');
  }

  function closeLotteryMemberConfigModal() {
    const modal = document.getElementById('lottery-member-config-modal');
    if (modal) modal.classList.add('hidden');
    updateLotteryUI();
  }

  function renderLotteryMemberConfigList() {
    const container = document.getElementById('lottery-member-config-list');
    if (!container) return;

    const byCategory = {};
    lotteryMembers.forEach(m => {
      const cat = m.category || 'その他';
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(m);
    });

    let html = '';
    for (const [cat, list] of Object.entries(byCategory)) {
      html += `<div class="mb-4">
        <div class="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 px-1">${escapeHtml(cat)}</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">`;

      list.forEach(m => {
        const mId = String(m.id);
        const isExcluded = lotteryExcludedMemberIds.has(mId);
        const wins = Number(m.win_count || 0);

        html += `
          <div class="flex items-center justify-between p-2.5 rounded-xl border ${isExcluded ? 'bg-slate-50 border-slate-200 opacity-60' : 'bg-white border-amber-200/80 shadow-xs'} transition-all">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="w-7 h-7 rounded-lg flex items-center justify-center text-[10px] font-black ${wins === 0 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">
                ${wins}勝
              </span>
              <div class="min-w-0">
                <div class="text-xs font-bold text-slate-900 truncate">${escapeHtml(m.name)}</div>
                <div class="text-[10px] text-slate-400 truncate">${escapeHtml(m.profession || '')}</div>
              </div>
            </div>
            <label class="relative inline-flex items-center cursor-pointer ml-2">
              <input type="checkbox" ${!isExcluded ? 'checked' : ''} onchange="toggleLotteryMemberActive('${mId}', this.checked)" class="sr-only peer">
              <div class="w-8 h-4 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-amber-500"></div>
            </label>
          </div>
        `;
      });

      html += `</div></div>`;
    }

    container.innerHTML = html;
  }

  function toggleLotteryMemberActive(memberId, isActive) {
    if (isActive) {
      lotteryExcludedMemberIds.delete(String(memberId));
    } else {
      lotteryExcludedMemberIds.add(String(memberId));
    }
    const activeBadge = document.getElementById('lottery-active-count-badge');
    const poolText = document.getElementById('lottery-target-pool-text');
    const activeCount = getActiveLotteryMembers().length;
    if (activeBadge) activeBadge.innerText = activeCount;
    if (poolText) poolText.innerText = `候補: ${activeCount} 名`;
  }

  function setAllLotteryMembersActive(active) {
    if (active) {
      lotteryExcludedMemberIds.clear();
    } else {
      lotteryMembers.forEach(m => lotteryExcludedMemberIds.add(String(m.id)));
    }
    renderLotteryMemberConfigList();
    const activeBadge = document.getElementById('lottery-active-count-badge');
    const poolText = document.getElementById('lottery-target-pool-text');
    const activeCount = getActiveLotteryMembers().length;
    if (activeBadge) activeBadge.innerText = activeCount;
    if (poolText) poolText.innerText = `候補: ${activeCount} 名`;
  }

  /* --- 当選履歴モーダル --- */
  function openLotteryHistoryModal() {
    const modal = document.getElementById('lottery-history-modal');
    if (!modal) return;
    renderLotteryHistoryList();
    modal.classList.remove('hidden');
  }

  function closeLotteryHistoryModal() {
    const modal = document.getElementById('lottery-history-modal');
    if (modal) modal.classList.add('hidden');
  }

  function renderLotteryHistoryList() {
    const tbody = document.getElementById('lottery-history-table-body');
    if (!tbody) return;

    if (lotteryHistory.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="text-center py-8 text-slate-400 text-xs">
            まだ当選履歴がありません
          </td>
        </tr>
      `;
      return;
    }

    let html = '';
    lotteryHistory.forEach((h) => {
      html += `
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="py-2.5 px-3 font-mono text-slate-500">${escapeHtml(h.won_at)}</td>
          <td class="py-2.5 px-3 font-bold text-slate-900">${escapeHtml(h.member_name)} 様</td>
          <td class="py-2.5 px-3">
            <span class="inline-block px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-800 border border-amber-200 text-[10px] font-bold">
              ${escapeHtml(h.award_title || '商品抽選')}
            </span>
          </td>
          <td class="py-2.5 px-3 text-right">
            <button onclick="deleteSingleLotteryHistory('${h.id}')" class="text-slate-400 hover:text-red-500 p-1.5 transition-colors" title="削除">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  async function deleteSingleLotteryHistory(historyId) {
    if (!confirm('この当選履歴を削除しますか？')) return;
    try {
      await ApiService.call('deleteLotteryHistoryApi', { id: historyId });
      lotteryHistory = lotteryHistory.filter(h => String(h.id) !== String(historyId));
      showToast('当選履歴を1件削除しました', 'info');
      await loadLotteryData();
      renderLotteryHistoryList();
    } catch (e) {
      showToast('削除に失敗しました', 'error');
    }
  }

  async function resetAllLotteryHistory() {
    if (!confirm('本当に全ての当選履歴をリセットしますか？\n（新期スタート時などに実行してください）')) return;
    try {
      await ApiService.call('resetLotteryHistoryApi');
      lotteryHistory = [];
      showToast('全当選履歴をリセットしました', 'info');
      await loadLotteryData();
      renderLotteryHistoryList();
    } catch (e) {
      showToast('リセットに失敗しました', 'error');
    }
  }

  /* --- キーボードショートカット --- */
  function setupLotteryShortcuts() {
    window.addEventListener('keydown', (e) => {
      const lotteryView = document.getElementById('view-lottery');
      if (!lotteryView || !lotteryView.classList.contains('active')) return;

      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;

      if (e.code === 'Space') {
        e.preventDefault();
        startLotterySpin();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleLotteryFullscreen();
      }
    });
  }
</script>
