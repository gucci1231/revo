<script>
  /* --- Modal: Follow Pending (時期尚早/保留 & 関係維持/アライアンス) Reminder Controller --- */

  function openFollowPendingReminderModal(visitorId, followType = '時期尚早') {
    const modal = document.getElementById('modal-follow-pending-reminder');
    if (!modal) return;

    const idInput = document.getElementById('fpr-visitor-id');
    const typeInput = document.getElementById('fpr-follow-type');
    const subnameEl = document.getElementById('fpr-visitor-subname');
    const titleEl = document.getElementById('fpr-title');
    const iconEl = document.getElementById('fpr-icon');
    const iconWrapEl = document.getElementById('fpr-icon-wrap');
    const dateLabelEl = document.getElementById('fpr-date-label');
    const dateHintEl = document.getElementById('fpr-date-hint');
    const dateInput = document.getElementById('fpr-due-date');
    const memoInput = document.getElementById('fpr-memo');
    const assigneeSelect = document.getElementById('fpr-assignee');

    if (idInput) idInput.value = visitorId;
    if (typeInput) typeInput.value = followType;

    // タイプ別のラベル＆配色切り替え
    const isMaintenance = (followType === '関係維持');
    if (titleEl) {
      titleEl.innerText = isMaintenance ? '定期連絡設定' : '再アプローチ設定';
    }
    if (iconEl) {
      iconEl.className = isMaintenance ? 'fa-regular fa-calendar-check' : 'fa-regular fa-clock';
    }
    if (iconWrapEl) {
      iconWrapEl.className = isMaintenance
        ? 'w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-sm font-bold'
        : 'w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-sm font-bold';
    }
    if (dateLabelEl) {
      dateLabelEl.innerText = isMaintenance ? '次回連絡予定日' : '再アプローチ予定日';
    }
    if (dateHintEl) {
      dateHintEl.innerText = isMaintenance ? '例: 3ヶ月後のイベント・定例会案内など' : '例: 半年後、独立予定時期など';
    }
    if (memoInput) {
      memoInput.placeholder = isMaintenance
        ? '例: 次回の定例会案内、3ヶ月後の近況確認 等'
        : '例: 10月に法人設立予定のため改めて案内、資金準備後に連絡 等';
      memoInput.value = '';
    }

    // ビジター名の表示
    let visitorName = 'ビジター No.' + visitorId;
    let inviter = '';
    const allVisitors = cachedAllVisitors || [];
    const pfVisitors = cachedPriorityFollowList || [];
    const target = allVisitors.find(v => String(v.id) === String(visitorId)) ||
                   pfVisitors.find(v => String(v.id || v.visitor_id) === String(visitorId));

    if (target) {
      visitorName = target.name || target.visitor_name || visitorName;
      inviter = resolveMemberName(target.inviter || '');
    }

    if (subnameEl) {
      subnameEl.innerText = `ビジター: ${visitorName}${inviter ? ` (紹介: ${inviter})` : ''}`;
    }

    // デフォルト期日（3ヶ月後）
    if (dateInput) {
      setFprQuickDate(3);
    }

    // 担当者プルダウンの非同期確実生成
    loadFprAssigneeOptions(inviter);

    modal.style.display = 'flex';
  }

  function setFprQuickDate(months, btnEl) {
    const dateInput = document.getElementById('fpr-due-date');
    if (!dateInput) return;

    const targetDate = new Date();
    targetDate.setMonth(targetDate.getMonth() + months);
    const yyyy = targetDate.getFullYear();
    const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
    const dd = String(targetDate.getDate()).padStart(2, '0');
    dateInput.value = `${yyyy}-${mm}-${dd}`;

    // ボタンのアクティブ状態更新
    if (btnEl) {
      document.querySelectorAll('.btn-date-preset').forEach(b => {
        b.classList.remove('active', 'bg-indigo-50', 'text-indigo-600', 'border-indigo-200');
        b.classList.add('bg-slate-100', 'text-slate-600', 'border-slate-200');
      });
      btnEl.classList.add('active', 'bg-indigo-50', 'text-indigo-600', 'border-indigo-200');
      btnEl.classList.remove('bg-slate-100', 'text-slate-600', 'border-slate-200');
    }
  }

  function loadFprAssigneeOptions(inviter = '') {
    const select = document.getElementById('fpr-assignee');
    if (!select) return;

    select.innerHTML = '<option value="">担当者を選択...</option>';

    function renderOptions(cats) {
      select.innerHTML = '<option value="">担当者を選択...</option>';
      if (Array.isArray(cats) && cats.length > 0) {
        cats.forEach(catObj => {
          const grp = document.createElement('optgroup');
          grp.label = catObj.category || 'その他';
          if (catObj.members && catObj.members.length > 0) {
            catObj.members.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m.name;
              opt.textContent = `${m.name}${m.profession ? ` (${m.profession})` : ''}`;
              if (inviter && m.name === inviter) {
                opt.selected = true;
              }
              grp.appendChild(opt);
            });
          }
          select.appendChild(grp);
        });
      }
      if (inviter) {
        // もし招待者がoptgroup外で未選択なら直接選択
        Array.from(select.options).forEach(opt => {
          if (opt.value === inviter) opt.selected = true;
        });
      }
    }

    if (typeof cachedMemberCategories !== 'undefined' && Array.isArray(cachedMemberCategories) && cachedMemberCategories.length > 0) {
      renderOptions(cachedMemberCategories);
      return;
    }

    // サーバーからメンバー一覧を取得
    ApiService.call('getMemberListApi')
      .then(res => {
        const cats = (res && (res.memberCategories || (res.data && res.data.memberCategories))) || [];
        if (cats && cats.length > 0) {
          cachedMemberCategories = cats;
          renderOptions(cats);
        } else if (res && res.flatMembers) {
          const defaultCat = [{ category: 'メンバー', members: res.flatMembers }];
          cachedMemberCategories = defaultCat;
          renderOptions(defaultCat);
        }
      })
      .catch(() => {});
  }

  function closeFollowPendingReminderModal() {
    const modal = document.getElementById('modal-follow-pending-reminder');
    if (modal) {
      modal.style.display = 'none';
    }
  }

  function submitFollowPendingReminder(e) {
    if (e) e.preventDefault();

    const vid = document.getElementById('fpr-visitor-id')?.value;
    const followType = document.getElementById('fpr-follow-type')?.value || '時期尚早';
    const dueDate = document.getElementById('fpr-due-date')?.value;
    const assignee = document.getElementById('fpr-assignee')?.value || '';
    const memo = document.getElementById('fpr-memo')?.value.trim();

    if (!vid) {
      showToast('ビジターIDが見つかりません');
      return;
    }

    if (!dueDate) {
      showToast('予定日を入力してください');
      return;
    }

    if (!memo) {
      showToast('理由・メモを入力してください');
      return;
    }

    const isMaintenance = (followType === '関係維持');
    const actionPrefix = isMaintenance ? '【定期連絡】' : '【再アプローチ】';
    const actionText = `${actionPrefix} ${memo}`;

    const payload = {
      visitorId: vid,
      visitor_id: vid,
      dueDate: dueDate,
      due_date: dueDate,
      assigneeName: assignee,
      assignee_name: assignee,
      actionType: 'その他',
      action_type: 'その他',
      actionText: actionText,
      action_text: actionText
    };

    showToast('リマインドを登録中...');

    ApiService.call('createActionPlanApi', payload)
      .then(res => {
        if (res && res.success) {
          showToast(`⏰ ${dueDate} の予定を登録しました！`);
          closeFollowPendingReminderModal();
          refreshAllActiveViews();
        } else {
          showToast('登録に失敗しました: ' + (res.message || 'エラー'));
        }
      })
      .catch(handleError);
  }
</script>
