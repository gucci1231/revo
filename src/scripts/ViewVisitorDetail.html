<script>
  /* --- 👤 Visitor Detail Full-Page View Controls (VIEW 4) --- */
  let currentVdVisitorId = null;
  let currentVisitorDetail = null;
  let previousTabBeforeDetail = "dashboard";
  let currentVdWebAppUrl = "";
  let currentVdActionPlans = [];
  let cachedMemberCategories = [];
  let currentVisitorNavList = null;
  let currentVdActiveTab = "action-plan";
  let isVdNavigating = false;
  let currentVdVisits = [];
  let currentVdHearings = [];
  let selectedVdVisitId = null;

  function openVisitorDetailModal(id) {
    openVisitorDetailView(id);
  }

  /* --- 🔄 Visitor Sequence Navigation Helpers --- */
  function getVisitorNavSequence() {
    if (currentVisitorNavList && currentVisitorNavList.length > 0) {
      const exists = currentVisitorNavList.some(v => v && (String(v.id) === String(currentVdVisitorId) || (v.allIds && v.allIds.some(id => String(id) === String(currentVdVisitorId)))));
      if (exists) return currentVisitorNavList;
    }
    if (typeof filteredVisitors !== 'undefined' && filteredVisitors && filteredVisitors.length > 0) {
      const exists = filteredVisitors.some(v => v && (String(v.id) === String(currentVdVisitorId) || (v.allIds && v.allIds.some(id => String(id) === String(currentVdVisitorId)))));
      if (exists) return filteredVisitors;
    }
    if (typeof cachedAllVisitors !== 'undefined' && cachedAllVisitors && cachedAllVisitors.length > 0) {
      return cachedAllVisitors;
    }
    if (typeof currentDashboardData !== 'undefined' && currentDashboardData && currentDashboardData.hotVisitors && currentDashboardData.hotVisitors.length > 0) {
      return currentDashboardData.hotVisitors;
    }
    if (typeof cachedPriorityFollowList !== 'undefined' && cachedPriorityFollowList && cachedPriorityFollowList.length > 0) {
      return cachedPriorityFollowList;
    }
    if (typeof cachedHearingList !== 'undefined' && cachedHearingList && cachedHearingList.length > 0) {
      return cachedHearingList;
    }
    // バックグラウンドで一覧を取得してナビゲーションを準備
    if (typeof fetchAllVisitorsData === 'function') {
      fetchAllVisitorsData(false);
    }
    return [];
  }

  function getAdjacentVisitors() {
    const list = getVisitorNavSequence();
    if (!list || list.length === 0 || !currentVdVisitorId) {
      return { prev: null, next: null, currentIndex: -1, total: 0 };
    }
    const currentIdStr = String(currentVdVisitorId);
    const idx = list.findIndex(v => {
      if (!v) return false;
      if (String(v.id) === currentIdStr) return true;
      if (v.allIds && Array.isArray(v.allIds)) {
        return v.allIds.some(id => String(id) === currentIdStr);
      }
      return false;
    });

    if (idx === -1) {
      return { prev: null, next: null, currentIndex: -1, total: list.length };
    }
    const prev = idx > 0 ? list[idx - 1] : null;
    const next = idx < list.length - 1 ? list[idx + 1] : null;
    return { prev, next, currentIndex: idx, total: list.length };
  }

  function updateVisitorNavUI() {
    const { prev, next, currentIndex, total } = getAdjacentVisitors();

    // トップバーのボタン & カウンター
    const topPrevBtn = document.getElementById('vd-nav-prev-btn');
    const topNextBtn = document.getElementById('vd-nav-next-btn');
    const topCounter = document.getElementById('vd-nav-counter');

    if (topPrevBtn) {
      topPrevBtn.disabled = !prev;
      topPrevBtn.title = prev ? `前のビジター: ${prev.name || 'No.' + prev.id} (← キー / 右スワイプ)` : '前のビジターはありません';
    }
    if (topNextBtn) {
      topNextBtn.disabled = !next;
      topNextBtn.title = next ? `次のビジター: ${next.name || 'No.' + next.id} (→ キー / 左スワイプ)` : '次のビジターはありません';
    }
    if (topCounter) {
      if (currentIndex >= 0 && total > 0) {
        topCounter.innerText = `${currentIndex + 1} / ${total}`;
      } else if (total > 0) {
        topCounter.innerText = `- / ${total}`;
      } else {
        topCounter.innerText = '- / -';
      }
    }

    // スマホ用フッターボタン（存在する場合のみ）
    const mobilePrevBtn = document.getElementById('vd-mobile-prev-btn');
    const mobileNextBtn = document.getElementById('vd-mobile-next-btn');
    if (mobilePrevBtn) {
      mobilePrevBtn.disabled = !prev;
    }
    if (mobileNextBtn) {
      mobileNextBtn.disabled = !next;
    }

    // PC用左カラムサイドバー一覧を更新
    renderVdSidebarList();
  }

  /* --- 💻 PC Left Sidebar List Controller --- */
  let vdSidebarSearchQuery = "";

  function handleVdSidebarSearch(val) {
    vdSidebarSearchQuery = (val || '').toLowerCase().trim();
    renderVdSidebarList();
  }

  function renderVdSidebarList() {
    const listContainer = document.getElementById('vd-sidebar-list');
    const countEl = document.getElementById('vd-sidebar-count');
    if (!listContainer) return;

    const fullList = getVisitorNavSequence();
    let displayList = fullList;

    const titleEl = document.querySelector('.vd-sidebar-title');
    if (titleEl) {
      if (previousTabBeforeDetail === 'priority-follow' || (currentVisitorNavList && currentVisitorNavList === filteredPfVisitors)) {
        titleEl.innerHTML = '<i class="fa-solid fa-fire text-rose-600"></i> 最優先フォロー';
      } else {
        titleEl.innerHTML = '<i class="fa-solid fa-users text-blue-600"></i> ビジター一覧';
      }
    }

    if (vdSidebarSearchQuery) {
      displayList = fullList.filter(v => {
        if (!v) return false;
        const q = vdSidebarSearchQuery;
        const name = (v.name || '').toLowerCase();
        const furigana = (v.furigana || '').toLowerCase();
        const company = (v.company || '').toLowerCase();
        const profession = (v.profession || '').toLowerCase();
        const inviter = (v.inviter || '').toLowerCase();
        return name.includes(q) || furigana.includes(q) || company.includes(q) || profession.includes(q) || inviter.includes(q);
      });
    }

    if (countEl) {
      countEl.innerText = `${displayList.length}件`;
    }

    if (displayList.length === 0) {
      listContainer.innerHTML = `
        <div style="padding: 24px 12px; text-align: center; color: #94a3b8; font-size: 12px; font-weight: 600;">
          <i class="fa-solid fa-user-slash" style="display:block; font-size: 18px; margin-bottom: 6px;"></i>
          一致するビジターはいません
        </div>
      `;
      return;
    }

    const currentIdStr = String(currentVdVisitorId || '');
    let html = '';

    displayList.forEach(v => {
      const isSelected = (String(v.id) === currentIdStr) || (v.allIds && Array.isArray(v.allIds) && v.allIds.some(id => String(id) === currentIdStr));
      const feel = (v.feelAbc || '').toUpperCase().trim();
      const rankChar = feel || '-';
      const rankClass = feel ? `rank-${feel}` : '';
      const count = v.visitCount || (v.allIds && v.allIds.length) || (v.attendanceCount && v.attendanceCount !== '初めて' ? v.attendanceCount : 1);
      const repeatTag = (typeof count === 'number' && count > 1) ? `<span style="font-size:10px; color:#d97706; background:#fef3c7; font-weight:800; padding:1px 5px; border-radius:4px; margin-left:4px;">${count}回</span>` : '';

      const subInfo = [v.company, v.profession].filter(Boolean).join(' · ') || (v.inviter ? `紹介: ${v.inviter}` : '-');

      html += `
        <div class="vd-sidebar-item ${isSelected ? 'is-selected' : ''}" onclick="openVisitorDetailView('${v.id}', true, true)">
          <div class="vd-sidebar-item-rank ${rankClass}">
            ${rankChar}
          </div>
          <div class="vd-sidebar-item-info">
            <div class="vd-sidebar-item-top">
              <span class="vd-sidebar-item-name">${escapeHtml(v.name || 'ビジター No.' + v.id)}${repeatTag}</span>
              <span class="vd-sidebar-item-date">${escapeHtml(formatShortDate(v.eventDate) || '')}</span>
            </div>
            <div class="vd-sidebar-item-sub">
              ${escapeHtml(subInfo)}
            </div>
          </div>
        </div>
      `;
    });

    listContainer.innerHTML = html;

    // 選択中のアイテムをサイドバーのリスト内でのみ可視領域へスクロール (getBoundingClientRectで正確に判定)
    setTimeout(() => {
      const activeEl = listContainer.querySelector('.vd-sidebar-item.is-selected');
      if (activeEl) {
        const listRect = listContainer.getBoundingClientRect();
        const elRect = activeEl.getBoundingClientRect();

        // すでに表示領域内に収まっている場合はスクロールしない
        if (elRect.top < listRect.top) {
          listContainer.scrollTop += (elRect.top - listRect.top - 8);
        } else if (elRect.bottom > listRect.bottom) {
          listContainer.scrollTop += (elRect.bottom - listRect.bottom + 8);
        }
      }
    }, 50);
  }

  function navigateVisitorDetail(direction) {
    if (isVdNavigating) return;
    const adj = getAdjacentVisitors();
    const targetVisitor = direction === 'next' ? adj.next : adj.prev;

    if (!targetVisitor || !targetVisitor.id) {
      if (direction === 'next' && adj.currentIndex >= 0 && adj.currentIndex === adj.total - 1) {
        showToast('最後のビジターです');
      } else if (direction === 'prev' && adj.currentIndex === 0) {
        showToast('最初のビジターです');
      } else if (adj.total === 0) {
        showToast('ビジター一覧を読み込み中です...');
        if (typeof fetchAllVisitorsData === 'function') {
          fetchAllVisitorsData(true);
        }
      }
      return;
    }

    isVdNavigating = true;
    const card = document.querySelector('#view-visitor-detail .vd-profile-card');
    if (card) {
      card.classList.remove('vd-slide-in-left', 'vd-slide-in-right', 'vd-slide-out-left', 'vd-slide-out-right');
      card.classList.add(direction === 'next' ? 'vd-slide-out-left' : 'vd-slide-out-right');
    }

    setTimeout(() => {
      openVisitorDetailView(targetVisitor.id, true, false, direction);
    }, 100);
  }

  /* --- 📱 Touch Swipe & Keyboard Handler --- */
  let vdTouchStartX = 0;
  let vdTouchStartY = 0;
  let vdTouchStartTime = 0;
  let isVdSwiping = false;

  function initVisitorDetailSwipeHandlers() {
    const container = document.getElementById('view-visitor-detail');
    if (!container || container.dataset.swipeInitialized === 'true') return;
    container.dataset.swipeInitialized = 'true';

    container.addEventListener('touchstart', function(e) {
      if (!e.touches || e.touches.length !== 1) {
        isVdSwiping = false;
        return;
      }
      const target = e.target;
      // 入力フォーム、モーダル、タブ切り替えバー等はスワイプ対象外
      if (target.closest('input, textarea, select, button, a, .vd-tab-nav, .vd-quick-chips, #vd-ap-form-modal.is-open, .modal')) {
        isVdSwiping = false;
        return;
      }
      vdTouchStartX = e.touches[0].clientX;
      vdTouchStartY = e.touches[0].clientY;
      vdTouchStartTime = Date.now();
      isVdSwiping = true;
    }, { passive: true });

    container.addEventListener('touchend', function(e) {
      if (!isVdSwiping || !e.changedTouches || e.changedTouches.length === 0) {
        isVdSwiping = false;
        return;
      }
      isVdSwiping = false;

      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const deltaX = endX - vdTouchStartX;
      const deltaY = endY - vdTouchStartY;
      const elapsed = Date.now() - vdTouchStartTime;

      const absX = Math.abs(deltaX);
      const absY = Math.abs(deltaY);

      // 横スワイプ判定: 45px以上の移動、縦より1.2倍以上横優位、0.8秒以内
      if (absX > 45 && absX > absY * 1.2 && elapsed < 800) {
        if (deltaX < 0) {
          // 左スワイプ -> 次へ
          navigateVisitorDetail('next');
        } else {
          // 右スワイプ -> 前へ
          navigateVisitorDetail('prev');
        }
      }
    }, { passive: true });

    // PCキーボード (← / →) ショートカット
    document.addEventListener('keydown', function(e) {
      const vdView = document.getElementById('view-visitor-detail');
      if (!vdView || !vdView.classList.contains('active')) return;

      const tag = (document.activeElement && document.activeElement.tagName) ? document.activeElement.tagName.toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

      const modal = document.getElementById('vd-ap-form-modal');
      if (modal && modal.classList.contains('is-open')) return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        navigateVisitorDetail('prev');
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        navigateVisitorDetail('next');
      }
    });
  }

  function openVisitorDetailView(id, updateHash = true, scrollToTop = true, navDirection = null) {
    if (!id || String(id).trim() === '' || String(id).trim() === 'undefined' || String(id).trim() === 'null') {
      return;
    }
    currentVdVisitorId = id;
    if (updateHash) {
      updateUrlHash('visitor/' + id, { visitorId: id });
    }
    if (scrollToTop && !navDirection) {
      window.scrollTo(0, 0);
      if (document.documentElement) document.documentElement.scrollTop = 0;
      if (document.body) document.body.scrollTop = 0;
      document.getElementById('loading').style.display = 'flex';
    }

    ApiService.call('getVisitorDetailApi', id)
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        if (!res || !res.success) {
          showToast('⚠️ ビジターデータの取得に失敗しました（存在しないIDです）');
          switchTab('dashboard', true);
          return;
        }

        currentVdWebAppUrl = res.webAppUrl || "";
        const v = res.visitor || {};
        currentVisitorDetail = v;
        currentVdVisits = res.visits && res.visits.length > 0 ? res.visits : [v];
        currentVdHearings = res.hearings || [];

        if (typeof updateHeaderCurrentPage === 'function') {
          updateHeaderCurrentPage('visitor-detail', v.name ? `${v.name} 様` : 'ビジター詳細', 'fa-solid fa-user-tag');
        }

        const st = res.status || {};
        const h = res.hearing || {};
        currentVdActionPlans = res.actionPlans || [];
        cachedMemberCategories = res.memberCategories || [];

        document.getElementById('vd-name').innerText = v.name || '-';
        document.getElementById('vd-furigana').innerText = v.furigana || '';
        document.getElementById('vd-company').innerText = v.company || '-';
        document.getElementById('vd-profession').innerText = v.profession || '-';
        document.getElementById('vd-inviter').innerText = v.inviter || '-';
        document.getElementById('vd-event-date').innerText = formatShortDate(v.eventDate) || '-';
        document.getElementById('vd-email').innerText = v.email || '-';
        const count = v.visitCount || currentVdVisits.length || (v.allIds && v.allIds.length) || (v.attendanceCount && v.attendanceCount !== '初めて' ? v.attendanceCount : 1);
        const countText = (typeof count === 'number' && count > 1) ? `(${count}回目)` : (v.attendanceCount ? `(${v.attendanceCount})` : '(初めて)');
        document.getElementById('vd-attendance-count').innerText = countText;

        // 自由メモ
        const freeMemoEl = document.getElementById('vd-free-memo');
        const fbMemoEl = document.getElementById('vd-ap-fb-memo');
        const memoVal = v.remarks || '';
        if (freeMemoEl) freeMemoEl.value = memoVal;
        if (fbMemoEl) fbMemoEl.value = memoVal;

        // 閲覧モード表示の更新
        updateVisitorMemoDisplay(memoVal);
        toggleVisitorMemoEdit(false);

        // 自由メモの双方向同期 & 自動リサイズ
        if (freeMemoEl && !freeMemoEl.dataset.synced) {
          freeMemoEl.dataset.synced = 'true';
          freeMemoEl.addEventListener('input', () => {
            const fb = document.getElementById('vd-ap-fb-memo');
            if (fb && fb !== document.activeElement) {
              fb.value = freeMemoEl.value;
              if (window.autoResizeTextarea) window.autoResizeTextarea(fb);
            }
            if (window.autoResizeTextarea) window.autoResizeTextarea(freeMemoEl);
          });
        }
        if (fbMemoEl && !fbMemoEl.dataset.synced) {
          fbMemoEl.dataset.synced = 'true';
          fbMemoEl.addEventListener('input', () => {
            const orig = document.getElementById('vd-free-memo');
            if (orig && orig !== document.activeElement) {
              orig.value = fbMemoEl.value;
              if (window.autoResizeTextarea) window.autoResizeTextarea(orig);
            }
            if (window.autoResizeTextarea) window.autoResizeTextarea(fbMemoEl);
          });
        }

        // ステータスセレクトボックスの反映
        const selectAtt = document.getElementById('vd-select-attended');
        if (selectAtt) {
          const info = getAttendStatusInfo(st.isAttended);
          selectAtt.value = info.value;
          selectAtt.className = 'vd-status-select ' + info.cls;
        }

        const selectJoin = document.getElementById('vd-select-joined');
        if (selectJoin) {
          const info = getJoinStatusInfo(st.isJoined);
          selectJoin.value = info.value;
          selectJoin.className = 'vd-status-select ' + info.cls;
        }

        const selectFollowType = document.getElementById('vd-select-follow-type');
        if (selectFollowType) {
          const info = getFollowTypeInfo(st.followType || v.followType);
          selectFollowType.value = info.value;
          selectFollowType.className = 'vd-status-select ' + info.cls;
        }

        // 複数回ヒアリングシートの描画＆切り替え初期化
        renderHearingSheetsMultiVisit(currentVdVisits, currentVdHearings, id);

        // アクションプランの担当者セレクト＆サジェスト初期化
        initActionPlanForm(v, h);
        renderActionPlansList(currentVdActionPlans);

        // メール履歴
        const mailContainer = document.getElementById('vd-mail-history-list');
        mailContainer.innerHTML = '';
        if (res.mailLogs && res.mailLogs.length > 0) {
          res.mailLogs.forEach(m => {
            const div = document.createElement('div');
            div.style.cssText = 'padding: 12px 16px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #364fc7; display: flex; justify-content: space-between; align-items: center; font-size: 13px;';
            div.innerHTML = `
              <div>
                <strong style="color:#343a40;">${m.mailType}</strong>
                <div style="font-size: 11px; color: #6c757d; margin-top:2px;">送信日時: ${m.sentAt}</div>
              </div>
              <span style="font-size: 11px; font-weight: 800; color: #2b8a3e; background: #d3f9d8; padding: 3px 10px; border-radius: 10px;">${m.status}</span>
            `;
            mailContainer.appendChild(div);
          });
        } else {
          mailContainer.innerHTML = '<div style="color:#868e96; font-size:13px; padding: 10px;">メール送信履歴はありません</div>';
        }

        // 画面全体を VIEW 4 (ビジター詳細全画面) へ切り替え
        document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('view-visitor-detail').classList.add('active');

        // ナビゲーションUIの更新とスワイプハンドラ初期化
        updateVisitorNavUI();
        initVisitorDetailSwipeHandlers();

        // スライドアニメーションの適用
        const card = document.querySelector('#view-visitor-detail .vd-profile-card');
        if (card) {
          card.classList.remove('vd-slide-out-left', 'vd-slide-out-right', 'vd-slide-in-left', 'vd-slide-in-right');
          if (navDirection === 'next') {
            card.classList.add('vd-slide-in-right');
          } else if (navDirection === 'prev') {
            card.classList.add('vd-slide-in-left');
          }
        }

        // サブタブ状態を維持
        switchVdTab(currentVdActiveTab || 'action-plan');

        if (scrollToTop && !navDirection) {
          window.scrollTo(0, 0);
          if (document.documentElement) document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
        }

        setTimeout(() => {
          isVdNavigating = false;
        }, 220);
      })
      .catch(err => {
        isVdNavigating = false;
        handleError(err);
      });
  }

  /* --- 📝 Multi-Visit Hearing Sheet Helper Functions --- */
  function renderHearingSheetsMultiVisit(visits, hearings, defaultVisitId) {
    // 選択するビジターIDを決定
    let targetVisitId = defaultVisitId;
    const hasCurrentSheet = hearings.some(h => String(h.visitorId) === String(defaultVisitId) && isHearingDataFilled(h));
    
    if (!hasCurrentSheet) {
      // 現在の回にシートがなく、他の回にシートがあれば最新のシートがある回を選択
      const filledHearing = [...hearings].reverse().find(h => isHearingDataFilled(h));
      if (filledHearing && filledHearing.visitorId) {
        targetVisitId = filledHearing.visitorId;
      }
    }

    selectedVdVisitId = String(targetVisitId || defaultVisitId || '');

    // 複数参加ナビゲーションタブのレンダリング
    renderHearingVisitsNav('vd-hearing-visits-nav', visits, hearings, selectedVdVisitId);
    renderHearingVisitsNav('vd-ap-fb-hearing-visits-nav', visits, hearings, selectedVdVisitId);

    // 選択中回のヒアリングシートを描画
    applySelectedHearingData();
  }

  function isHearingDataFilled(h) {
    if (!h) return false;
    return !!(
      (h.feelAbc && String(h.feelAbc).trim()) ||
      (h.q1 && String(h.q1).trim()) ||
      (h.q2 && String(h.q2).trim()) ||
      (h.q3 && String(h.q3).trim()) ||
      (h.orientUser && String(h.orientUser).trim()) ||
      (h.orientMemo && String(h.orientMemo).trim())
    );
  }

  function renderHearingVisitsNav(containerId, visits, hearings, currentSelectedId) {
    const navEl = document.getElementById(containerId);
    if (!navEl) return;

    if (!visits || visits.length <= 1) {
      navEl.style.display = 'none';
      navEl.innerHTML = '';
      return;
    }

    navEl.style.display = 'flex';
    let html = '';

    visits.forEach((vis, idx) => {
      const visId = String(vis.id);
      const isSelected = visId === String(currentSelectedId);
      const hearingForVisit = hearings.find(h => String(h.visitorId) === visId);
      const hasData = isHearingDataFilled(hearingForVisit);
      const countLabel = vis.attendanceCount && vis.attendanceCount !== '初めて' ? vis.attendanceCount : `${idx + 1}回目`;
      const dateLabel = vis.eventDate ? (formatShortDate(vis.eventDate) || vis.eventDate) : `No.${vis.id}`;

      html += `
        <button type="button" class="vd-hearing-visit-tab ${isSelected ? 'active' : ''}" onclick="selectHearingVisit('${visId}')" title="${escapeHtml(vis.eventDate || '')} (${countLabel})">
          <span class="vd-hearing-visit-status-dot ${hasData ? 'has-data' : 'empty'}"></span>
          <span>${escapeHtml(countLabel)} (${escapeHtml(dateLabel)})</span>
          ${hasData ? '<i class="fa-solid fa-check text-[10px] text-emerald-600"></i>' : ''}
        </button>
      `;
    });

    navEl.innerHTML = html;
  }

  function selectHearingVisit(visitId) {
    selectedVdVisitId = String(visitId);
    renderHearingVisitsNav('vd-hearing-visits-nav', currentVdVisits, currentVdHearings, selectedVdVisitId);
    renderHearingVisitsNav('vd-ap-fb-hearing-visits-nav', currentVdVisits, currentVdHearings, selectedVdVisitId);
    applySelectedHearingData();
  }

  function applySelectedHearingData() {
    const h = currentVdHearings.find(item => String(item.visitorId) === String(selectedVdVisitId)) || {};
    const hasData = isHearingDataFilled(h);

    const feel = (h.feelAbc || '').toUpperCase().trim();

    const select = document.getElementById('vd-ap-assignee-select');

    const currentVal = select.value;
    select.innerHTML = '<option value="">-- 担当メンバーを選択 --</option>';

      ? cats
      : ((typeof cachedMemberCategories !== 'undefined' && Array.isArray(cachedMemberCategories) && cachedMemberCategories.length > 0) ? cachedMemberCategories : null);

    if (actualCats && actualCats.length > 0) {
      actualCats.forEach(catObj => {

        grp.label = catObj.category;
        if (catObj.members && catObj.members.length > 0) {
          catObj.members.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.name;

  function updateApDateBadge() {
    const input = document.getElementById('vd-ap-due-date');
    const badge = document.getElementById('vd-ap-date-day-badge');
    if (!input || !badge) return;

    const val = input.value;
    if (!val) {
      badge.textContent = '';
      badge.style.display = 'none';
      return;
    }

    const d = new Date(val + 'T00:00:00');
    if (isNaN(d.getTime())) {
      badge.textContent = '';
      badge.style.display = 'none';
      return;
    }

    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const dayStr = days[d.getDay()];
    const m = d.getMonth() + 1;
    const dateNum = d.getDate();

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(d);
    target.setHours(0, 0, 0, 0);
    const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));

    let relativeStr = '';
    if (diffDays === 0) relativeStr = ' (本日)';
    else if (diffDays === 1) relativeStr = ' (明日)';
    else if (diffDays === 2) relativeStr = ' (明後日)';
    else if (diffDays > 0) relativeStr = ` (${diffDays}日後)`;
    else if (diffDays === -1) relativeStr = ' (期限切れ)';
    else relativeStr = ` (${Math.abs(diffDays)}日前/期限切れ)`;

    badge.textContent = `${m}/${dateNum}(${dayStr})${relativeStr}`;
    badge.className = `vd-date-day-badge ${diffDays < 0 ? 'is-overdue' : (diffDays <= 1 ? 'is-urgent' : '')}`;
    badge.style.display = 'inline-flex';
  }

  function openActionPlanModal(optVisitorId) {
    const modal = document.getElementById('vd-ap-form-modal');
    if (!modal) return;

    if (optVisitorId) {
      currentVdVisitorId = String(optVisitorId);
      let v = null;
      if (typeof cachedPriorityFollowList !== 'undefined' && Array.isArray(cachedPriorityFollowList)) {
        v = cachedPriorityFollowList.find(item => String(item.id || item.visitorId) === String(optVisitorId) || (item.allIds && item.allIds.some(id => String(id) === String(optVisitorId))));
      }
      if (!v && typeof filteredPfVisitors !== 'undefined' && Array.isArray(filteredPfVisitors)) {
        v = filteredPfVisitors.find(item => String(item.id || item.visitorId) === String(optVisitorId) || (item.allIds && item.allIds.some(id => String(id) === String(optVisitorId))));
      }
      if (!v && typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors)) {
        v = cachedAllVisitors.find(item => String(item.id || item.visitorId) === String(optVisitorId) || (item.allIds && item.allIds.some(id => String(id) === String(optVisitorId))));
      }
      if (!v && typeof currentVisitorDetail !== 'undefined' && currentVisitorDetail && (String(currentVisitorDetail.id) === String(optVisitorId) || (currentVisitorDetail.visitor && String(currentVisitorDetail.visitor.id) === String(optVisitorId)))) {
        v = currentVisitorDetail.visitor || currentVisitorDetail;
      }
      if (!v && typeof cachedHearingList !== 'undefined' && Array.isArray(cachedHearingList)) {
        v = cachedHearingList.find(item => String(item.visitorId || item.id) === String(optVisitorId));
      }

      if (v) {
        initActionPlanForm(v, (currentVisitorDetail && currentVisitorDetail.hearing) ? currentVisitorDetail.hearing : v);
      } else {
        initActionPlanForm({}, {});
      }
    }

    if (modal.parentElement !== document.body) {
      document.body.appendChild(modal);
    }

    populateAssigneeSelectOptions(cachedMemberCategories);

    modal.classList.add('is-open');
    const input = document.getElementById('vd-ap-action-text');
    if (input) {
      setTimeout(() => input.focus(), 150);
    }
  }

  function submitNewActionPlan() {
    if (!currentVdVisitorId) return;

    const editId = document.getElementById('vd-ap-edit-id').value;
    const dueDate = document.getElementById('vd-ap-due-date').value.trim();
    const assigneeName = document.getElementById('vd-ap-assignee-select').value.trim();
    const actionText = document.getElementById('vd-ap-action-text').value.trim();

    if (!dueDate) {
      alert('いつ（期日）を入力してください');
      return;
    }
    if (!assigneeName) {
      alert('誰が（担当者）を選択してください');
      return;
    }
    if (!actionText) {
      alert('どうする（アクション内容）を入力してください');
      return;
    }

    const payload = {
      visitorId: currentVdVisitorId,
      dueDate: dueDate,
      assigneeName: assigneeName,
      actionType: document.getElementById('vd-ap-type-val') ? document.getElementById('vd-ap-type-val').value : '1to1',
      actionText: actionText
    };

    if (editId) {
      payload.id = editId;
      showToast('アクションプランを更新中...');
      ApiService.call('updateActionPlanApi', payload)
        .then(res => {
          showToast('✅ アクションプランを更新しました！');
          if (res.list) renderActionPlansList(res.list);
          if (typeof fetchPriorityFollowData === 'function' && document.getElementById('view-priority-follow') && !document.getElementById('view-priority-follow').classList.contains('hidden')) {
            fetchPriorityFollowData(true);
          }
          closeActionPlanModal();
        })
        .catch(handleError);
    } else {
      showToast('アクションプランを登録中...');
      ApiService.call('createActionPlanApi', payload)
        .then(res => {
          showToast('✅ アクションプランを登録しました！');
          if (res.list) renderActionPlansList(res.list);
          if (typeof fetchPriorityFollowData === 'function' && document.getElementById('view-priority-follow') && !document.getElementById('view-priority-follow').classList.contains('hidden')) {
            fetchPriorityFollowData(true);
          }
          document.getElementById('vd-ap-action-text').value = '';
          setApTypeSelected('1to1');
          setApDateQuick(3);
          closeActionPlanModal();
        })
        .catch(handleError);
    }
  }

  function toggleActionPlan(id, newStatus) {
    if (!id) return;
    const planItem = Array.isArray(currentVdActionPlans) ? currentVdActionPlans.find(p => String(p.id) === String(id)) : null;

    ApiService.call('toggleActionPlanApi', id, newStatus)
      .then(res => {
        if (newStatus === 1 && window.CelebrationEffect) {
          const assignee = planItem ? planItem.assignee_name : '';
          const actionTxt = planItem ? planItem.action_text : '';
          const visitorName = currentVisitorDetail ? currentVisitorDetail.visitor_name : '';
          
          const actorGreeting = assignee
            ? `${assignee}さん、ナイスアクション！`
            : 'ナイスアクション！目標達成！';
          
          const detailSnippet = visitorName
            ? `${visitorName}様へのアクションを達成`
            : (actionTxt || 'アクションを完了しました');

          CelebrationEffect.triggerQuestClear({
            title: 'QUEST CLEAR !',
            subtitle: actorGreeting,
            detail: detailSnippet,
            badgeText: 'ACTION COMPLETED ✨'
          });
        } else {
          showToast(newStatus === 1 ? '🎉 アクションプランを完了にしました！' : 'アクションプランを未完了に戻しました');
        }
        if (res.list) renderActionPlansList(res.list);
      })
      .catch(handleError);
  }

  function editActionPlan(id) {
    const item = currentVdActionPlans.find(p => String(p.id) === String(id));
    if (!item) return;

    document.getElementById('vd-ap-edit-id').value = item.id;
    document.getElementById('vd-ap-due-date').value = item.due_date || '';
    updateApDateBadge();
    setApAssigneeQuick(item.assignee_name || '');
    setApTypeSelected(item.action_type || '1to1');
    document.getElementById('vd-ap-action-text').value = item.action_text || '';

    const titleEl = document.getElementById('vd-ap-form-title');
    if (titleEl) titleEl.innerText = 'アクション編集';
    const submitLabel = document.getElementById('vd-ap-btn-submit-label');
    if (submitLabel) submitLabel.innerText = '変更を保存する';
    const cancelBtn = document.getElementById('vd-ap-btn-cancel-edit');
    if (cancelBtn) cancelBtn.style.display = 'inline-block';

    openActionPlanModal();
  }

  function cancelApEdit() {
    const editIdInput = document.getElementById('vd-ap-edit-id');
    if (editIdInput) editIdInput.value = '';
    const titleEl = document.getElementById('vd-ap-form-title');
    if (titleEl) titleEl.innerText = 'アクション登録';
    const submitLabel = document.getElementById('vd-ap-btn-submit-label');
    if (submitLabel) submitLabel.innerText = '保存';
    const cancelBtn = document.getElementById('vd-ap-btn-cancel-edit');
    if (cancelBtn) cancelBtn.style.display = 'inline-block';
    const modal = document.getElementById('vd-ap-form-modal');
    if (modal) modal.classList.remove('is-open');
    updateApDateBadge();
  }

  function deleteActionPlan(id) {
    if (!confirm('このアクションプランを削除してもよろしいですか？')) return;

    ApiService.call('deleteActionPlanApi', id, currentVdVisitorId)
      .then(res => {
        showToast('🗑️ アクションプランを削除しました');
        if (res.list) renderActionPlansList(res.list);
      })
      .catch(handleError);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function updateVisitorMemoDisplay(memoText) {
    const text = memoText ? memoText.trim() : '';
    const displayHtml = text
      ? escapeAndLinkify(text, true, true)
      : '<span class="text-slate-400 font-normal italic"><i class="fa-solid fa-pen mr-1"></i> メモはまだありません（タップ / クリックして追加）</span>';

    const disp1 = document.getElementById('vd-memo-display');
    const disp2 = document.getElementById('vd-ap-fb-memo-display');
    if (disp1) disp1.innerHTML = displayHtml;
    if (disp2) disp2.innerHTML = displayHtml;
  }

  function toggleVisitorMemoEdit(isEditing) {
    const view1 = document.getElementById('vd-memo-view-mode');
    const edit1 = document.getElementById('vd-memo-edit-mode');
    const btn1 = document.getElementById('vd-memo-btn-edit');

    const view2 = document.getElementById('vd-ap-fb-memo-view');
    const edit2 = document.getElementById('vd-ap-fb-memo-edit');
    const btn2 = document.getElementById('vd-ap-fb-memo-btn-edit');

    if (view1) view1.style.display = isEditing ? 'none' : 'block';
    if (edit1) edit1.style.display = isEditing ? 'block' : 'none';
    if (btn1) btn1.style.display = isEditing ? 'none' : 'inline-flex';

    if (view2) view2.style.display = isEditing ? 'none' : 'block';
    if (edit2) edit2.style.display = isEditing ? 'block' : 'none';
    if (btn2) btn2.style.display = isEditing ? 'none' : 'inline-flex';

    if (isEditing) {
      const freeMemoEl = document.getElementById('vd-free-memo');
      const fbMemoEl = document.getElementById('vd-ap-fb-memo');
      const target = (fbMemoEl && fbMemoEl.offsetParent !== null) ? fbMemoEl : freeMemoEl;
      if (target) {
        if (window.autoResizeTextarea) window.autoResizeTextarea(target);
        setTimeout(() => target.focus(), 80);
      }
    }
  }

  function saveVisitorFreeMemo() {
    if (!currentVdVisitorId) return;
    const freeMemoEl = document.getElementById('vd-free-memo');
    const fbMemoEl = document.getElementById('vd-ap-fb-memo');
    let memoText = '';
    if (document.activeElement === fbMemoEl && fbMemoEl) {
      memoText = fbMemoEl.value.trim();
      if (freeMemoEl) freeMemoEl.value = fbMemoEl.value;
    } else if (freeMemoEl) {
      memoText = freeMemoEl.value.trim();
      if (fbMemoEl) fbMemoEl.value = freeMemoEl.value;
    } else if (fbMemoEl) {
      memoText = fbMemoEl.value.trim();
    }
    showToast(`共有メモを保存中...`);

    ApiService.call('saveVisitorMemoApi', currentVdVisitorId, memoText)
      .then(res => {
        showToast(`✅ メモを正常に保存しました！`);
        updateVisitorMemoDisplay(memoText);
        toggleVisitorMemoEdit(false);
        fetchDashboardData();
        if (cachedAllVisitors.length > 0) fetchAllVisitorsData();
      })
      .catch(handleError);
  }

  function toggleAttend(id, newStatus) {
    changeVisitorStatus(id, 'isAttended', newStatus);
  }

  function toggle1to1(id, current) {
    const next = (current === '済' || current === true) ? '未' : '済';
    changeVisitorStatus(id, 'is1to1', next);
  }

  function toggle1to1InDetail(id, current) {
    toggle1to1(id, current);
  }

  function toggleJoined(id, current) {
    const isJoinedBool = (current === '入会済' || current === '済' || current === '入会' || current === true);
    const next = isJoinedBool ? '未' : '入会済';
    changeVisitorStatus(id, 'isJoined', next);
  }

  function toggleJoinedInDetail(id, current) {
    toggleJoined(id, current);
  }

  function deleteVisitor(id, name) {
    if (!confirm(`【確認】ビジター「${name}」のデータを削除してもよろしいですか？`)) return;

    document.getElementById('loading').style.display = 'flex';
    ApiService.call('deleteVisitorApi', id)
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        if (res.success) {
          showToast(`🗑️ ${name}様のデータを削除しました`);
          fetchDashboardData();
          if (cachedAllVisitors.length > 0) fetchAllVisitorsData();
        }
      })
      .catch(handleError);
  }
</script>
