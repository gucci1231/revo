<script>
/**
 * Event & Training Calendar Controller (REvo Chapter & Kyoto CC Region)
 */

let allCalendarEvents = [];
let allTrainingEvents = []; // Backward compatibility
let currentCalendarMonth = new Date().toISOString().substring(0, 7);
let currentEventViewMode = 'calendar'; // 'calendar' or 'list'
let selectedDayForModal = '';

let currentTrainingFilter = {
  sourceType: '',      // '' (all), 'meeting', 'chapter', 'training'
  format: 'all',       // 'all', 'online', 'inperson'
  month: '',           // '' for all, or 'YYYY-MM'
  category: '',
  keyword: '',
  scope: 'upcoming'    // for list view
};
let trainingSearchTimeout = null;

function initTrainingView() {
  // Sync initial month if not set
  if (!currentCalendarMonth) {
    currentCalendarMonth = new Date().toISOString().substring(0, 7);
  }
  updateCalendarMonthHeader();
  loadCalendarAndEvents();
}

/**
 * Backward compatibility alias for loadCalendarAndEvents
 */
function loadTrainingEvents() {
  return loadCalendarAndEvents();
}

function setTrainingMonthFilter(month, btn) {
  if (month) {
    currentCalendarMonth = month;
    updateCalendarMonthHeader();
  }
  loadCalendarAndEvents();
}

/**
 * Update the year/month label in calendar toolbar
 */
function updateCalendarMonthHeader() {
  const label = document.getElementById('calendar-current-month-label');
  if (!label || !currentCalendarMonth) return;
  const parts = currentCalendarMonth.split('-');
  label.innerText = `${parts[0]}年 ${parseInt(parts[1], 10)}月`;
}

/**
 * Fetch calendar and event data
 */
async function loadCalendarAndEvents() {
  const loadingEl = document.getElementById('training-loading-state');
  const emptyEl = document.getElementById('training-empty-state');
  const gridEl = document.getElementById('calendar-grid');

  if (loadingEl) loadingEl.classList.remove('hidden');
  if (emptyEl) emptyEl.classList.add('hidden');

  try {
    const res = await ApiService.call('getCalendarEventsApi', {
      month: currentCalendarMonth,
      format: currentTrainingFilter.format !== 'all' ? currentTrainingFilter.format : '',
      source_type: currentTrainingFilter.sourceType,
      keyword: currentTrainingFilter.keyword
    });

    if (loadingEl) loadingEl.classList.add('hidden');

    if (res && res.success !== false) {
      const data = res.data || res;
      allCalendarEvents = data.events || [];
      allTrainingEvents = allCalendarEvents.filter(e => e.source_type === 'training');

      // Render KPIs
      renderTrainingKpis(data.summary);

      // Render Calendar Grid
      renderCalendarGrid();

      // Render List View
      renderFilteredTrainingEvents();
    } else {
      if (emptyEl) emptyEl.classList.remove('hidden');
      if (gridEl) {
        gridEl.innerHTML = `
          <div class="col-span-7 py-20 text-center bg-white text-xs text-slate-400">
            予定データの取得に失敗しました
          </div>
        `;
      }
    }
  } catch (err) {
    console.error('Failed to load calendar events:', err);
    if (loadingEl) loadingEl.classList.add('hidden');
    if (emptyEl) emptyEl.classList.remove('hidden');
    showToast('イベント情報の読み込みに失敗しました', 'error');
  }
}

/**
 * Navigate calendar month (delta = -1 or +1)
 */
function navigateCalendarMonth(delta) {
  const parts = currentCalendarMonth.split('-').map(Number);
  const d = new Date(parts[0], parts[1] - 1 + delta, 1);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  currentCalendarMonth = `${y}-${m}`;
  updateCalendarMonthHeader();
  loadCalendarAndEvents();
}

/**
 * Jump back to current real-world month
 */
function jumpToCurrentMonth() {
  currentCalendarMonth = new Date().toISOString().substring(0, 7);
  updateCalendarMonthHeader();
  loadCalendarAndEvents();
}

/**
 * Set Event View Mode (Calendar vs List)
 */
function setEventViewMode(mode) {
  currentEventViewMode = mode;
  const calContainer = document.getElementById('calendar-view-container');
  const listContainer = document.getElementById('list-view-container');
  const calToolbar = document.getElementById('calendar-month-toolbar');
  const listToolbar = document.getElementById('list-mode-toolbar');
  const btnCal = document.getElementById('btn-view-mode-calendar');
  const btnList = document.getElementById('btn-view-mode-list');

  if (mode === 'calendar') {
    if (calContainer) calContainer.classList.remove('hidden');
    if (listContainer) listContainer.classList.add('hidden');
    if (calToolbar) calToolbar.classList.remove('hidden');
    if (listToolbar) listToolbar.classList.add('hidden');

    if (btnCal) {
      btnCal.className = 'px-3.5 py-1.5 rounded-md transition-all bg-white text-slate-900 shadow-xs font-black flex items-center gap-1.5';
    }
    if (btnList) {
      btnList.className = 'px-3.5 py-1.5 rounded-md transition-all hover:text-slate-900 text-slate-600 flex items-center gap-1.5 font-bold';
    }
    renderCalendarGrid();
  } else {
    if (calContainer) calContainer.classList.add('hidden');
    if (listContainer) listContainer.classList.remove('hidden');
    if (calToolbar) calToolbar.classList.add('hidden');
    if (listToolbar) listToolbar.classList.remove('hidden');

    if (btnCal) {
      btnCal.className = 'px-3.5 py-1.5 rounded-md transition-all hover:text-slate-900 text-slate-600 flex items-center gap-1.5 font-bold';
    }
    if (btnList) {
      btnList.className = 'px-3.5 py-1.5 rounded-md transition-all bg-white text-slate-900 shadow-xs font-black flex items-center gap-1.5';
    }
    renderFilteredTrainingEvents();
  }
}

/**
 * Source Type Filter (All, Meeting, Chapter, Training)
 */
function setEventSourceFilter(type, btn) {
  currentTrainingFilter.sourceType = type;
  const container = document.getElementById('event-source-filters');
  if (container) {
    container.querySelectorAll('button').forEach(b => {
      b.className = 'px-2.5 py-1 rounded-md transition-all hover:text-slate-900 text-slate-600 flex items-center gap-1';
    });
    if (btn) {
      btn.className = 'px-2.5 py-1 rounded-md transition-all active-source-pill bg-white text-slate-900 shadow-xs font-bold flex items-center gap-1';
    }
  }
  loadCalendarAndEvents();
}

/**
 * Format Filter (All, Online, In-person)
 */
function setTrainingFormatFilter(format, btn) {
  currentTrainingFilter.format = format;
  const container = document.getElementById('training-format-filters');
  if (container) {
    container.querySelectorAll('button').forEach(b => {
      b.className = 'px-2 py-1 rounded-md transition-all hover:text-slate-900 text-slate-600';
    });
    if (btn) {
      btn.className = 'px-2 py-1 rounded-md transition-all bg-white text-slate-900 shadow-xs font-bold';
    }
  }
  loadCalendarAndEvents();
}

/**
 * Keyword search with debounce
 */
function debounceTrainingFilter() {
  clearTimeout(trainingSearchTimeout);
  trainingSearchTimeout = setTimeout(() => {
    const input = document.getElementById('training-search-input');
    currentTrainingFilter.keyword = input ? input.value.trim().toLowerCase() : '';
    loadCalendarAndEvents();
  }, 250);
}

/**
 * Render the 7-day Month Grid
 */
function renderCalendarGrid() {
  const gridEl = document.getElementById('calendar-grid');
  if (!gridEl) return;

  const [year, month] = currentCalendarMonth.split('-').map(Number);
  const firstDayObj = new Date(year, month - 1, 1);
  const lastDayObj = new Date(year, month, 0);

  const startDayOfWeek = firstDayObj.getDay(); // 0: Sun, 1: Mon, ... 4: Thu
  const totalDays = lastDayObj.getDate();

  // Days from previous month to fill the first row
  const prevMonthLastDay = new Date(year, month - 1, 0).getDate();

  const todayStr = new Date().toISOString().substring(0, 10);

  // Group events by YYYY-MM-DD
  const eventsByDate = {};
  allCalendarEvents.forEach(ev => {
    if (!ev.start_datetime) return;
    const dateKey = ev.start_datetime.substring(0, 10);
    if (!eventsByDate[dateKey]) eventsByDate[dateKey] = [];
    eventsByDate[dateKey].push(ev);
  });

  let cellsHtml = '';

  // 1. Prev month filler cells
  for (let i = startDayOfWeek - 1; i >= 0; i--) {
    const dayNum = prevMonthLastDay - i;
    const prevMonthNum = month - 1 === 0 ? 12 : month - 1;
    const prevYearNum = month - 1 === 0 ? year - 1 : year;
    const dateKey = `${prevYearNum}-${String(prevMonthNum).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dateKey] || [];

    cellsHtml += renderCalendarCell(dateKey, dayNum, dayEvents, false, dateKey === todayStr);
  }

  // 2. Current month cells
  for (let d = 1; d <= totalDays; d++) {
    const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dateKey] || [];

    cellsHtml += renderCalendarCell(dateKey, d, dayEvents, true, dateKey === todayStr);
  }

  // 3. Next month filler cells to complete the 7-col grid (up to 35 or 42 cells)
  const currentTotalCells = startDayOfWeek + totalDays;
  const targetTotal = currentTotalCells <= 35 ? 35 : 42;
  const nextMonthFill = targetTotal - currentTotalCells;

  for (let d = 1; d <= nextMonthFill; d++) {
    const nextMonthNum = month + 1 === 13 ? 1 : month + 1;
    const nextYearNum = month + 1 === 13 ? year + 1 : year;
    const dateKey = `${nextYearNum}-${String(nextMonthNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dateKey] || [];

    cellsHtml += renderCalendarCell(dateKey, d, dayEvents, false, dateKey === todayStr);
  }

  gridEl.innerHTML = cellsHtml;
}

/**
 * Helper to render individual calendar cell HTML
 */
function renderCalendarCell(dateKey, dayNum, dayEvents, isCurrentMonth, isToday) {
  const dObj = new Date(dateKey.replace(/-/g, '/'));
  const dayOfWeek = dObj.getDay();
  const isThursday = dayOfWeek === 4;

  let bgClass = isCurrentMonth ? 'bg-white' : 'bg-slate-50/50';
  if (isToday) bgClass = 'bg-blue-50/20';

  let numColorClass = isCurrentMonth ? 'text-slate-800' : 'text-slate-300';
  if (dayOfWeek === 0) numColorClass = isCurrentMonth ? 'text-rose-500 font-bold' : 'text-rose-200';
  if (dayOfWeek === 6) numColorClass = isCurrentMonth ? 'text-blue-500 font-bold' : 'text-blue-200';

  // Event pills (up to 3 visible, rest collapsed)
  const maxPills = 3;
  const visibleEvents = dayEvents.slice(0, maxPills);
  const extraCount = dayEvents.length - maxPills;

  const pillsHtml = visibleEvents.map(ev => {
    const timeStr = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
    let pillStyle = '';
    let icon = '';
    let titlePrefix = '';

    if (ev.source_type === 'meeting') {
      pillStyle = 'bg-blue-50 text-blue-800 border border-blue-200/80 hover:bg-blue-100';
      icon = '<span class="w-1.5 h-1.5 rounded-full bg-blue-500 shrink-0"></span>';
      if (ev.visitor_count > 0) {
        titlePrefix = `<span class="px-1 py-0.2 rounded text-3xs font-black bg-blue-600 text-white shrink-0">V:${ev.visitor_count}</span> `;
      }
    } else if (ev.source_type === 'chapter') {
      pillStyle = 'bg-purple-50 text-purple-800 border border-purple-200/80 hover:bg-purple-100';
      icon = '<span class="w-1.5 h-1.5 rounded-full bg-purple-500 shrink-0"></span>';
    } else {
      // Training
      pillStyle = 'bg-emerald-50 text-emerald-900 border border-emerald-200/80 hover:bg-emerald-100';
      icon = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>';
    }

    return `
      <div onclick="handleCalendarEventClick('${ev.id}', event)" class="group/pill flex items-center gap-1 px-1.5 py-0.5 rounded text-3xs font-bold ${pillStyle} transition-all cursor-pointer truncate shadow-2xs hover:scale-[1.02]">
        ${icon}
        <span class="font-mono text-3xs opacity-75 shrink-0">${timeStr}</span>
        ${titlePrefix}
        <span class="truncate">${escapeHtml(ev.title)}</span>
      </div>
    `;
  }).join('');

  const extraBadge = extraCount > 0 ? `
    <div onclick="openDayEventsModal('${dateKey}')" class="text-3xs font-extrabold text-slate-500 hover:text-blue-600 cursor-pointer pt-0.5 pl-1">
      + 他 ${extraCount} 件
    </div>
  ` : '';

  return `
    <div class="calendar-cell min-h-[105px] sm:min-h-[125px] p-1.5 sm:p-2 flex flex-col justify-between ${bgClass} transition-colors hover:bg-slate-50/80 group cursor-pointer relative ${isToday ? 'ring-2 ring-blue-500 ring-inset z-10' : ''}" onclick="onCalendarCellClick('${dateKey}', event)">
      <div>
        <!-- Top bar: Date Num & Badges -->
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-1">
            <span class="text-xs sm:text-sm font-black font-mono tabular-nums ${numColorClass}">${dayNum}</span>
            ${isToday ? '<span class="px-1.5 py-0.2 rounded text-3xs font-black bg-blue-600 text-white leading-none">TODAY</span>' : ''}
            ${isThursday && isCurrentMonth ? '<span class="text-3xs font-extrabold text-blue-500 hidden sm:inline">定例会</span>' : ''}
          </div>
          <button type="button" onclick="openChapterEventModalOnDate('${dateKey}', event)" class="w-5 h-5 rounded-full hover:bg-slate-200 text-slate-400 hover:text-slate-700 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-3xs" title="この日に予定を追加">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <!-- Event Pills -->
        <div class="space-y-1">
          ${pillsHtml}
          ${extraBadge}
        </div>
      </div>
    </div>
  `;
}

/**
 * Cell click -> open day detail modal
 */
function onCalendarCellClick(dateKey, evt) {
  // If target was a pill or button, don't trigger general cell click
  if (evt.target.closest('.group\\/pill') || evt.target.closest('button')) return;
  openDayEventsModal(dateKey);
}

/**
 * Handle individual event pill click
 */
function handleCalendarEventClick(eventId, evt) {
  if (evt) evt.stopPropagation();
  const ev = allCalendarEvents.find(e => e.id == eventId);
  if (!ev) return;

  if (ev.source_type === 'meeting') {
    openMeetingDetailModal(ev);
  } else if (ev.source_type === 'chapter') {
    openChapterEventModal(ev);
  } else {
    openTrainingDetailModal(ev.id);
  }
}

/**
 * Open Day Events Timeline Modal
 */
function openDayEventsModal(dateKey) {
  selectedDayForModal = dateKey;
  const modal = document.getElementById('modal-day-events');
  const titleEl = document.getElementById('modal-day-title');
  const listEl = document.getElementById('modal-day-events-list');
  if (!modal || !titleEl || !listEl) return;

  const d = new Date(dateKey.replace(/-/g, '/'));
  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  titleEl.innerText = `${d.getFullYear()}年 ${d.getMonth() + 1}月 ${d.getDate()}日 (${dayNames[d.getDay()]})`;

  const dayEvents = allCalendarEvents.filter(e => e.start_datetime && e.start_datetime.startsWith(dateKey));

  if (dayEvents.length === 0) {
    listEl.innerHTML = `
      <div class="py-12 text-center text-slate-400">
        <i class="fa-regular fa-calendar-xmark text-3xl mb-2 text-slate-300"></i>
        <div class="text-xs font-bold text-slate-600">この日の予定はありません</div>
        <button type="button" onclick="closeDayEventsModal(); openChapterEventModalOnDate('${dateKey}');" class="mt-3 px-3 py-1.5 rounded-lg text-xs font-bold text-blue-600 bg-blue-50 border border-blue-200 hover:bg-blue-100 transition-colors inline-flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-plus text-3xs"></i> 予定を登録する
        </button>
      </div>
    `;
  } else {
    listEl.innerHTML = dayEvents.map(ev => {
      const timeStr = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
      const endTimeStr = ev.end_datetime ? ` ～ ${ev.end_datetime.substring(11, 16)}` : '';
      let badge = '';
      if (ev.source_type === 'meeting') {
        badge = '<span class="px-2 py-0.5 rounded-full text-3xs font-extrabold bg-blue-50 text-blue-700 border border-blue-200">定例会</span>';
      } else if (ev.source_type === 'chapter') {
        badge = '<span class="px-2 py-0.5 rounded-full text-3xs font-extrabold bg-purple-50 text-purple-700 border border-purple-200">チャプター予定</span>';
      } else {
        badge = '<span class="px-2 py-0.5 rounded-full text-3xs font-extrabold bg-emerald-50 text-emerald-800 border border-emerald-200">京都CC研修</span>';
      }

      return `
        <div onclick="closeDayEventsModal(); handleCalendarEventClick('${ev.id}');" class="p-3 rounded-xl border border-slate-200 bg-white hover:border-slate-300 hover:shadow-xs transition-all cursor-pointer flex items-start gap-3">
          <div class="text-center font-mono shrink-0 pt-0.5">
            <span class="text-xs font-black text-slate-800 block">${timeStr}</span>
            <span class="text-3xs text-slate-400 font-bold">${ev.is_online ? 'Zoom' : '対面'}</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 mb-1">
              ${badge}
              <span class="text-3xs font-bold text-slate-500">${escapeHtml(ev.category || '')}</span>
            </div>
            <h4 class="text-xs sm:text-sm font-bold text-slate-900 truncate">${escapeHtml(ev.title)}</h4>
            ${ev.location_name ? `<p class="text-3xs text-slate-500 truncate mt-0.5"><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${escapeHtml(ev.location_name)}</p>` : ''}
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs shrink-0 self-center"></i>
        </div>
      `;
    }).join('');
  }

  modal.classList.remove('hidden');
}

function closeDayEventsModal() {
  const modal = document.getElementById('modal-day-events');
  if (modal) modal.classList.add('hidden');
}

function addEventOnSelectedDate() {
  const date = selectedDayForModal;
  closeDayEventsModal();
  openChapterEventModalOnDate(date);
}

/**
 * Chapter Event Modal Management
 */
function openChapterEventModal(eventObj = null) {
  const modal = document.getElementById('modal-chapter-event');
  const form = document.getElementById('form-chapter-event');
  const titleHeader = document.getElementById('modal-chapter-event-title');
  const btnDelete = document.getElementById('btn-delete-chapter-event');
  if (!modal || !form) return;

  form.reset();

  if (eventObj) {
    titleHeader.innerText = 'チャプター予定を編集';
    document.getElementById('ch-ev-id').value = eventObj.id || '';
    document.getElementById('ch-ev-title').value = eventObj.title || '';
    document.getElementById('ch-ev-category').value = eventObj.category || 'チャプターイベント';
    document.getElementById('ch-ev-is-online').value = eventObj.is_online ? '1' : '0';

    if (eventObj.start_datetime) {
      document.getElementById('ch-ev-date').value = eventObj.start_datetime.substring(0, 10);
      document.getElementById('ch-ev-start-time').value = eventObj.start_datetime.substring(11, 16);
    }
    if (eventObj.end_datetime) {
      document.getElementById('ch-ev-end-time').value = eventObj.end_datetime.substring(11, 16);
    }
    document.getElementById('ch-ev-location').value = eventObj.location_name || '';
    document.getElementById('ch-ev-url').value = eventObj.location_url || '';
    document.getElementById('ch-ev-organizer').value = eventObj.organizer || '';
    document.getElementById('ch-ev-desc').value = eventObj.description || '';

    if (btnDelete) btnDelete.classList.remove('hidden');
  } else {
    titleHeader.innerText = 'チャプター予定を追加';
    document.getElementById('ch-ev-id').value = '';
    document.getElementById('ch-ev-date').value = new Date().toISOString().substring(0, 10);
    document.getElementById('ch-ev-start-time').value = '19:00';
    document.getElementById('ch-ev-end-time').value = '21:00';
    if (btnDelete) btnDelete.classList.add('hidden');
  }

  modal.classList.remove('hidden');
}

function openChapterEventModalOnDate(dateStr, evt) {
  if (evt) evt.stopPropagation();
  openChapterEventModal();
  const dateInput = document.getElementById('ch-ev-date');
  if (dateInput) dateInput.value = dateStr;
}

function closeChapterEventModal() {
  const modal = document.getElementById('modal-chapter-event');
  if (modal) modal.classList.add('hidden');
}

/**
 * Save Chapter Event (Submit)
 */
async function handleChapterEventSubmit(evt) {
  evt.preventDefault();
  const btn = document.getElementById('btn-save-chapter-event');
  if (btn) btn.disabled = true;

  const id = document.getElementById('ch-ev-id').value;
  const title = document.getElementById('ch-ev-title').value.trim();
  const category = document.getElementById('ch-ev-category').value;
  const isOnline = parseInt(document.getElementById('ch-ev-is-online').value, 10);
  const date = document.getElementById('ch-ev-date').value;
  const startTime = document.getElementById('ch-ev-start-time').value || '00:00';
  const endTime = document.getElementById('ch-ev-end-time').value || '';
  const locationName = document.getElementById('ch-ev-location').value.trim();
  const locationUrl = document.getElementById('ch-ev-url').value.trim();
  const organizer = document.getElementById('ch-ev-organizer').value.trim();
  const desc = document.getElementById('ch-ev-desc').value.trim();

  const startDatetime = `${date} ${startTime}:00`;
  const endDatetime = endTime ? `${date} ${endTime}:00` : '';

  try {
    const res = await ApiService.call('saveChapterEventApi', {
      id,
      title,
      category,
      is_online: isOnline,
      start_datetime: startDatetime,
      end_datetime: endDatetime,
      location_name: locationName,
      location_url: locationUrl,
      organizer,
      description: desc
    });

    if (res && res.success !== false) {
      showToast(res.message || 'チャプター予定を保存しました', 'success');
      closeChapterEventModal();
      loadCalendarAndEvents();
    } else {
      showToast(res?.message || '保存に失敗しました', 'error');
    }
  } catch (err) {
    console.error('Save chapter event error:', err);
    showToast('予定の保存中にエラーが発生しました', 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

/**
 * Delete Chapter Event
 */
async function handleDeleteChapterEvent() {
  const id = document.getElementById('ch-ev-id').value;
  if (!id) return;

  if (!confirm('このチャプター予定を削除してもよろしいですか？')) return;

  try {
    const res = await ApiService.call('deleteChapterEventApi', { id });
    if (res && res.success !== false) {
      showToast('チャプター予定を削除しました', 'success');
      closeChapterEventModal();
      loadCalendarAndEvents();
    } else {
      showToast(res?.message || '削除に失敗しました', 'error');
    }
  } catch (err) {
    console.error('Delete error:', err);
    showToast('削除中にエラーが発生しました', 'error');
  }
}

/**
 * Open Regular Meeting Detail Modal
 */
function openMeetingDetailModal(meeting) {
  const modal = document.getElementById('modal-meeting-detail');
  if (!modal) return;

  const d = new Date(meeting.start_datetime.replace(/-/g, '/'));
  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  const formattedDate = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 (${dayNames[d.getDay()]}) 07:00 ～ 08:30`;

  document.getElementById('modal-meeting-datetime').innerText = formattedDate;
  document.getElementById('modal-meeting-visitor-count').innerText = meeting.visitor_count || 0;

  // Find visitors matching this date from global visitors cache if available
  const listWrap = document.getElementById('modal-meeting-visitors-wrap');
  const dateKey = meeting.start_datetime.substring(0, 10);
  const slashDate = dateKey.replace(/-/g, '/');

  let matchedVisitors = [];
  if (typeof StateService !== 'undefined' && StateService.getVisitorList) {
    const list = StateService.getVisitorList();
    if (Array.isArray(list)) {
      matchedVisitors = list.filter(v => {
        const vDate = (v.eventDate || v.event_date || '').substring(0, 10);
        return vDate === dateKey || vDate === slashDate;
      });
    }
  }

  if (matchedVisitors.length === 0) {
    listWrap.innerHTML = `
      <div class="text-slate-400 py-3 text-center text-xs">
        ${meeting.visitor_count > 0 ? `システム集計: ${meeting.visitor_count}名 登録あり` : '現在、この定例会へのビジター申込はありません'}
      </div>
    `;
  } else {
    listWrap.innerHTML = matchedVisitors.map(v => `
      <div class="flex items-center justify-between py-1 border-b border-slate-100 last:border-0">
        <div>
          <span class="font-bold text-slate-800">${escapeHtml(v.name || v.visitor_name || '')} 様</span>
          <span class="text-3xs text-slate-400 ml-1.5">(${escapeHtml(v.profession || 'ビジター')})</span>
        </div>
        <span class="text-3xs text-slate-500">紹介: ${escapeHtml(v.inviter || '-')}</span>
      </div>
    `).join('');
  }

  modal.classList.remove('hidden');
}

function closeMeetingDetailModal() {
  const modal = document.getElementById('modal-meeting-detail');
  if (modal) modal.classList.add('hidden');
}

/**
 * Render KPIs
 */
function renderTrainingKpis(summary) {
  if (!summary) return;

  const nextDateEl = document.getElementById('kpi-training-next-date');
  const nextTitleEl = document.getElementById('kpi-training-next-title');
  const monthCountEl = document.getElementById('kpi-training-month-count');
  const onlineCountEl = document.getElementById('kpi-training-online-count');
  const inpersonCountEl = document.getElementById('kpi-training-inperson-count');
  const lastSyncedEl = document.getElementById('training-last-synced');

  // Next Thursday meeting calculation
  const today = new Date();
  const dayOfWeek = today.getDay();
  let daysUntilThu = (4 - dayOfWeek + 7) % 7;
  if (daysUntilThu === 0 && today.getHours() >= 9) {
    daysUntilThu = 7;
  }
  const nextThu = new Date(today);
  nextThu.setDate(today.getDate() + daysUntilThu);
  const nextThuStr = `${nextThu.getMonth() + 1}/${nextThu.getDate()} (木)`;

  if (nextDateEl) nextDateEl.innerText = nextThuStr;
  if (nextTitleEl) nextTitleEl.innerText = '07:00 開会 / 6:45受付';

  // Count total events this month in calendar
  const totalEventsInMonth = allCalendarEvents.length;
  if (monthCountEl) monthCountEl.innerText = totalEventsInMonth || summary.currentMonthTotal || 0;

  // Online & In-person counts
  let onlineCnt = 0;
  let inpersonCnt = 0;
  allCalendarEvents.forEach(e => {
    if (e.is_online) onlineCnt++;
    else inpersonCnt++;
  });

  if (onlineCountEl) onlineCountEl.innerText = onlineCnt;
  if (inpersonCountEl) inpersonCountEl.innerText = inpersonCnt;

  if (lastSyncedEl && summary.lastSyncedAt) {
    lastSyncedEl.innerText = `最終同期: ${summary.lastSyncedAt}`;
  }
}

/**
 * Filtered List Rendering (List View)
 */
function renderFilteredTrainingEvents() {
  const listEl = document.getElementById('training-events-list');
  const emptyEl = document.getElementById('training-empty-state');
  if (!listEl) return;

  const filtered = allCalendarEvents;

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    if (emptyEl) emptyEl.classList.remove('hidden');
    return;
  }

  if (emptyEl) emptyEl.classList.add('hidden');

  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  const now = new Date();

  listEl.innerHTML = filtered.map(ev => {
    const startDate = new Date(ev.start_datetime.replace(/-/g, '/'));
    const monthNum = startDate.getMonth() + 1;
    const dayNum = startDate.getDate();
    const dayName = dayNames[startDate.getDay()];
    const isToday = startDate.toDateString() === now.toDateString();

    const timeStr = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
    const endTimeStr = ev.end_datetime ? ` ～ ${ev.end_datetime.substring(11, 16)}` : '';

    // Badges
    let sourceBadge = '';
    if (ev.source_type === 'meeting') {
      sourceBadge = '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-3xs font-extrabold bg-blue-50 text-blue-700 border border-blue-200">🔵 定例会</span>';
    } else if (ev.source_type === 'chapter') {
      sourceBadge = '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-3xs font-extrabold bg-purple-50 text-purple-700 border border-purple-200">🟣 チャプター</span>';
    } else {
      sourceBadge = '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-3xs font-extrabold bg-emerald-50 text-emerald-800 border border-emerald-200">🟢 京都CC研修</span>';
    }

    const formatBadge = ev.is_online
      ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-3xs font-extrabold bg-blue-50 text-blue-600 border border-blue-200"><i class="fa-solid fa-video text-3xs"></i> ONLINE</span>`
      : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-3xs font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-200"><i class="fa-solid fa-location-dot text-3xs"></i> 対面</span>`;

    return `
      <div class="bg-white border ${isToday ? 'border-blue-400 shadow-md ring-1 ring-blue-400/20' : 'border-slate-200'} rounded-2xl p-4 shadow-xs hover:border-slate-300 hover:-translate-y-0.5 transition-all flex flex-col justify-between group">
        <div>
          <!-- Header: Date Badge & Badges -->
          <div class="flex items-start gap-3 mb-2.5">
            <div class="w-13 h-13 rounded-xl bg-slate-50 border border-slate-200 flex flex-col items-center justify-center shrink-0 text-center shadow-2xs group-hover:border-blue-200 group-hover:bg-blue-50/30 transition-colors">
              <span class="text-3xs font-extrabold text-blue-600 uppercase tracking-wider">${monthNum}月</span>
              <span class="text-lg font-black text-slate-900 font-mono leading-none my-0.5 tabular-nums">${dayNum}</span>
              <span class="text-3xs font-bold text-slate-400">(${dayName})</span>
            </div>

            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap mb-1">
                ${sourceBadge}
                ${formatBadge}
                ${isToday ? '<span class="px-1.5 py-0.2 rounded text-3xs font-black bg-blue-600 text-white">TODAY</span>' : ''}
              </div>
              <h3 onclick="handleCalendarEventClick('${ev.id}')" class="text-sm font-extrabold text-slate-900 group-hover:text-blue-600 transition-colors cursor-pointer line-clamp-2 leading-snug">
                ${escapeHtml(ev.title)}
              </h3>
            </div>
          </div>

          <!-- Metadata -->
          <div class="space-y-1 text-xs text-slate-600 mt-2 pl-0.5">
            <div class="flex items-center gap-2">
              <i class="fa-regular fa-clock text-slate-400 text-3xs shrink-0 w-3.5"></i>
              <span class="font-mono font-bold text-slate-700 tabular-nums">${timeStr}${endTimeStr}</span>
            </div>
            ${ev.location_name ? `
              <div class="flex items-center gap-2 truncate">
                <i class="fa-solid fa-location-dot text-slate-400 text-3xs shrink-0 w-3.5"></i>
                <span class="truncate text-slate-600">${escapeHtml(ev.location_name)}</span>
              </div>
            ` : ''}
            ${ev.visitor_count !== undefined && ev.visitor_count > 0 ? `
              <div class="flex items-center gap-1.5 text-blue-600 font-bold">
                <i class="fa-solid fa-users text-blue-500 text-3xs"></i>
                <span>申込ビジター: ${ev.visitor_count}名</span>
              </div>
            ` : ''}
          </div>
        </div>

        <!-- Footer Actions -->
        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
          <button type="button" onclick="handleCalendarEventClick('${ev.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors flex items-center gap-1">
            <span>詳細を見る</span>
            <i class="fa-solid fa-chevron-right text-3xs"></i>
          </button>
          ${ev.source_type === 'training' ? `
            <a href="${ev.registration_url || ev.detail_url || 'https://bni-ck.com/ja/events'}" target="_blank" rel="noopener noreferrer" class="px-3.5 py-1.5 rounded-lg text-xs font-black text-white bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all shadow-xs flex items-center gap-1.5 no-underline">
              <span>参加申込</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-3xs"></i>
            </a>
          ` : (ev.source_type === 'chapter' ? `
            <button type="button" onclick="openChapterEventModal(allCalendarEvents.find(e => e.id == '${ev.id}'))" class="px-3 py-1.5 rounded-lg text-xs font-bold text-purple-700 bg-purple-50 hover:bg-purple-100 border border-purple-200 transition-colors">
              編集
            </button>
          ` : '')}
        </div>
      </div>
    `;
  }).join('');
}

/**
 * Backward compatibility helpers for Training Detail modal
 */
function openTrainingDetailModal(eventId) {
  const ev = allCalendarEvents.find(e => e.id == eventId) || allTrainingEvents.find(e => e.id == eventId);
  if (!ev) return;

  const modal = document.getElementById('modal-training-detail');
  if (!modal) return;

  document.getElementById('modal-ev-title').innerText = ev.title;
  document.getElementById('modal-ev-type').innerText = ev.event_type_name || ev.category || 'トレーニング';

  const formatEl = document.getElementById('modal-ev-format');
  if (ev.is_online) {
    formatEl.className = 'px-2 py-0.5 rounded-full text-3xs font-extrabold bg-blue-50 text-blue-600 border border-blue-200';
    formatEl.innerHTML = '<i class="fa-solid fa-video"></i> ONLINE';
  } else {
    formatEl.className = 'px-2 py-0.5 rounded-full text-3xs font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-200';
    formatEl.innerHTML = '<i class="fa-solid fa-location-dot"></i> 対面研修';
  }

  const startDate = new Date(ev.start_datetime.replace(/-/g, '/'));
  const endDate = ev.end_datetime ? new Date(ev.end_datetime.replace(/-/g, '/')) : startDate;
  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  const dateFormatted = `${startDate.getFullYear()}年${startDate.getMonth()+1}月${startDate.getDate()}日 (${dayNames[startDate.getDay()]}) ${String(startDate.getHours()).padStart(2,'0')}:${String(startDate.getMinutes()).padStart(2,'0')} ～ ${String(endDate.getHours()).padStart(2,'0')}:${String(endDate.getMinutes()).padStart(2,'0')}`;
  document.getElementById('modal-ev-datetime').innerText = dateFormatted;

  document.getElementById('modal-ev-location').innerText = ev.location_name || (ev.is_online ? 'オンライン（BNI online）' : '未定');
  const mapWrap = document.getElementById('modal-ev-map-wrap');
  const mapLink = document.getElementById('modal-ev-map-link');
  if (ev.location_map_url) {
    mapLink.href = ev.location_map_url;
    mapWrap.classList.remove('hidden');
  } else {
    mapWrap.classList.add('hidden');
  }

  document.getElementById('modal-ev-cost').innerText = ev.cost_member || '無料または要確認';
  const capEl = document.getElementById('modal-ev-capacity');
  if (ev.max_attendees > 0) {
    capEl.innerText = `定員: ${ev.max_attendees}名（現在 ${ev.num_registered || 0}名 登録済）`;
  } else {
    capEl.innerText = '';
  }

  const contactNameEl = document.getElementById('modal-ev-contact-name');
  const contactPhoneEl = document.getElementById('modal-ev-contact-phone');
  contactNameEl.innerText = ev.contact_name || ev.organizer || '京都シティセントラル事務局';
  contactPhoneEl.innerText = ev.contact_phone || '--';

  const bodyEl = document.getElementById('modal-ev-body');
  if (ev.body_html) {
    bodyEl.innerHTML = ev.body_html;
  } else if (ev.description) {
    bodyEl.innerText = ev.description;
  } else {
    bodyEl.innerHTML = '<span class="text-slate-400">詳細情報は公式ページをご確認ください。</span>';
  }

  const ckLink = document.getElementById('modal-ev-ck-link');
  ckLink.href = ev.detail_url || `https://bni-ck.com/ja/events`;

  const applyBtn = document.getElementById('modal-ev-apply-btn');
  applyBtn.href = ev.registration_url || ev.detail_url || `https://bni-ck.com/ja/events`;

  modal.classList.remove('hidden');
}

function closeTrainingDetailModal() {
  const modal = document.getElementById('modal-training-detail');
  if (modal) modal.classList.add('hidden');
}

async function syncTrainingEvents() {
  const icon = document.getElementById('sync-training-icon');
  const btn = document.getElementById('btn-sync-training');

  if (icon) icon.classList.add('fa-spin');
  if (btn) btn.disabled = true;

  showToast('京都シティセントラルのイベント情報を同期中...', 'info');

  try {
    const res = await ApiService.call('syncTrainingEventsApi');
    if (res && res.success !== false) {
      showToast('最新のトレーニング日程を同期しました', 'success');
      if (typeof celebrateQuestClear === 'function') {
        celebrateQuestClear();
      }
      loadCalendarAndEvents();
    } else {
      showToast(res?.message || '同期に失敗しました', 'error');
    }
  } catch (err) {
    console.error('Manual sync error:', err);
    showToast('同期中にエラーが発生しました', 'error');
  } finally {
    if (icon) icon.classList.remove('fa-spin');
    if (btn) btn.disabled = false;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
