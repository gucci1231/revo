<!-- Modal 4: メンバーマスタ登録・編集モーダル (CRUD) -->
<div id="modal-member-crud" class="modal-overlay" style="display:none;">
  <div class="modal-card" style="max-width: 520px;">
    <h2 id="modal-member-title" class="modal-title">メンバーの登録・編集</h2>
    <form id="member-crud-form">
      <input type="hidden" id="crud-m-id">

      <div class="form-group">
        <label class="form-label">カテゴリ / 専門領域 <span class="required">*</span></label>
        <input type="text" id="crud-m-category" class="form-input" placeholder="例：〇士業・事業サポート または DNAメンバー" required>
      </div>

      <div class="form-group">
        <label class="form-label">メンバー氏名 <span class="required">*</span></label>
        <input type="text" id="crud-m-name" class="form-input" placeholder="例：前井 宏之" required>
      </div>

      <div class="form-group">
        <label class="form-label">専門分野 <span class="required">*</span></label>
        <input type="text" id="crud-m-profession" class="form-input" placeholder="例：社長の孤独をなくす専属AI" required>
      </div>

      <div class="form-group">
        <label class="form-label">ステータス <span class="required">*</span></label>
        <div class="flex items-center gap-3 mt-1.5">
          <label class="inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer text-xs font-bold text-slate-800 transition-colors has-checked:border-blue-600 has-checked:bg-blue-50/40 has-checked:text-blue-700">
            <input type="radio" name="crud-m-status" id="crud-m-status-active" value="在籍" checked class="text-blue-600 focus:ring-0">
            <span>在籍中</span>
          </label>
          <label class="inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer text-xs font-bold text-slate-800 transition-colors has-checked:border-slate-400 has-checked:bg-slate-100 has-checked:text-slate-700">
            <input type="radio" name="crud-m-status" id="crud-m-status-resigned" value="退会" class="text-slate-500 focus:ring-0">
            <span class="text-slate-600">退会</span>
          </label>
        </div>
      </div>

      <div class="modal-footer-btns">
        <button type="button" class="btn-cancel" onclick="closeMemberCrudModal()">キャンセル</button>
        <button type="button" class="btn-save" onclick="submitMemberCrudForm()">保存する</button>
      </div>
    </form>
  </div>
</div>
