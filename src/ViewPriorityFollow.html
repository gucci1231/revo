<!-- VIEW: 最優先フォロービジター一覧 (感触A・B評価 カンバンボード ＆ リスト Master-Detail) -->
<div id="view-priority-follow" class="view-content">

  <!-- 1. 最優先フォロー 3大ステージ KPIカード -->
  <div class="dash-hero-grid grid-3">
    <!-- KPI 1: 放置 -->
    <div class="dash-hero-card cursor-pointer active-kpi-card" id="pf-kpi-card-stagnant" onclick="setPriorityFollowMobileStage('stagnant')" title="放置ビジターにフォーカス">
      <div class="dash-hero-split">
        <div class="dash-hero-left flex items-center gap-1.5">
          <span class="dash-hero-title">放置</span>
          <span class="kpi-status-dot slate" style="background:#94a3b8;" title="未対応・放置"></span>
        </div>
        <div class="dash-hero-right">
          <div class="dash-hero-val-container">
            <span class="dash-hero-number" id="pf-kpi-stagnant" style="color: #64748b;">-</span>
            <span class="dash-hero-unit-text">名</span>
          </div>
        </div>
      </div>
    </div>

    <!-- KPI 2: 検討中 -->
    <div class="dash-hero-card cursor-pointer" id="pf-kpi-card-active" onclick="setPriorityFollowMobileStage('active')" title="検討中ビジターにフォーカス">
      <div class="dash-hero-split">
        <div class="dash-hero-left flex items-center gap-1.5">
          <span class="dash-hero-title">検討中</span>
          <span class="kpi-status-dot blue" title="検討中"></span>
        </div>
        <div class="dash-hero-right">
          <div class="dash-hero-val-container">
            <span class="dash-hero-number" id="pf-kpi-active" style="color: #0071e3;">-</span>
            <span class="dash-hero-unit-text">名</span>
          </div>
        </div>
      </div>
    </div>

    <!-- KPI 3: 申込済み -->
    <div class="dash-hero-card cursor-pointer" id="pf-kpi-card-applying-review" onclick="setPriorityFollowMobileStage('applying-review')" title="申込済み・審査中ビジターにフォーカス">
      <div class="dash-hero-split">
        <div class="dash-hero-left flex items-center gap-1.5">
          <span class="dash-hero-title">申込済み</span>
          <span class="kpi-status-dot green" style="background:#10b981;" title="申込提出・審査中"></span>
        </div>
        <div class="dash-hero-right">
          <div class="dash-hero-val-container">
            <span class="dash-hero-number" id="pf-kpi-applying-review" style="color: #10b981;">-</span>
            <span class="dash-hero-unit-text">名</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 最優先フォロー トップヘッダー ＆ コントロールバー -->
  <div class="section-card p-3.5 mb-3.5 bg-white border border-slate-200">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
      
      <!-- タイトル ＆ 感触フィルター -->
      <div class="flex flex-wrap items-center gap-2.5">
        <h2 class="section-title text-base font-bold text-slate-800 m-0 flex items-center gap-1.5">
          <i class="fa-solid fa-fire text-rose-600"></i> 最優先フォロー
        </h2>
        <span id="pf-total-badge" class="px-2.5 py-0.5 rounded-full text-xs font-black bg-slate-100 text-slate-700">0</span>

        <!-- 感触フィルター (ALL / A / B) -->
        <div class="tab-filter-group flex gap-1 bg-slate-100 p-1 rounded-lg">
          <button type="button" class="tab-btn active px-2.5 py-1 text-xs font-bold" id="pf-tab-all" onclick="setPriorityFollowGradeFilter('ALL')">ALL</button>
          <button type="button" class="tab-btn px-2.5 py-1 text-xs font-bold" id="pf-tab-a" onclick="setPriorityFollowGradeFilter('A')">A</button>
          <button type="button" class="tab-btn px-2.5 py-1 text-xs font-bold" id="pf-tab-b" onclick="setPriorityFollowGradeFilter('B')">B</button>
        </div>
      </div>

      <!-- 検索ボックス ＆ 表示切替トグル (カンバン / リスト) -->
      <div class="flex items-center gap-2">
        <div class="relative flex-1 md:w-60">
          <input type="text" id="search-priority-follow-input" class="search-box w-full text-xs py-1.5 pl-3" placeholder="🔍 ビジター・担当者検索..." onkeyup="filterPriorityFollowTable()">
        </div>
        
        <!-- ビュー切り替えトグル (Kanban / List) -->
        <div class="tab-filter-group flex gap-1 bg-slate-100 p-1 rounded-lg shrink-0" id="pf-view-mode-group">
          <button type="button" class="tab-btn active px-2.5 py-1 text-xs font-bold flex items-center gap-1" id="pf-mode-btn-kanban" onclick="togglePfViewMode('kanban')" title="カンバンボード表示">
            <i class="fa-solid fa-table-columns"></i>
            <span class="hidden sm:inline">ボード</span>
          </button>
          <button type="button" class="tab-btn px-2.5 py-1 text-xs font-bold flex items-center gap-1" id="pf-mode-btn-list" onclick="togglePfViewMode('list')" title="リスト・詳細カルテ表示">
            <i class="fa-solid fa-list-ul"></i>
            <span class="hidden sm:inline">リスト</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- ======================================================== -->
  <!-- 📌 1. カンバンボード表示 (デフォルト) -->
  <!-- ======================================================== -->
  <div id="pf-kanban-container" class="pf-kanban-view-container">

    <!-- 🖥️ カンバンボード 3列グリッド (PC: 3列並び / スマホ: タブ連動1列) -->
    <div class="pf-kanban-board" id="pf-kanban-board">

      <!-- カラム 1: ⚪ 放置 (グレー) -->
      <div class="pf-kanban-column pf-kanban-col-stagnant" id="pf-col-stagnant" ondragover="onPfColumnDragOver(event)" ondragleave="onPfColumnDragLeave(event)" ondrop="onPfColumnDrop(event, 'stagnant')">
        <div class="pf-kanban-column-header">
          <div class="pf-kanban-col-title text-slate-700">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
            <span>放置</span>
          </div>
          <span class="pf-kanban-col-count bg-slate-100 text-slate-700" id="pf-kanban-count-stagnant">0</span>
        </div>
        <div class="pf-kanban-card-list" id="pf-kanban-list-stagnant"></div>
      </div>

      <!-- カラム 2: 🔵 検討中 (ブルー) -->
      <div class="pf-kanban-column pf-kanban-col-active" id="pf-col-active" ondragover="onPfColumnDragOver(event)" ondragleave="onPfColumnDragLeave(event)" ondrop="onPfColumnDrop(event, 'active')">
        <div class="pf-kanban-column-header">
          <div class="pf-kanban-col-title text-blue-700">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
            <span>検討中</span>
          </div>
          <span class="pf-kanban-col-count bg-blue-100 text-blue-800" id="pf-kanban-count-active">0</span>
        </div>
        <div class="pf-kanban-card-list" id="pf-kanban-list-active"></div>
      </div>

      <!-- カラム 3: 🟢 申込済み (グリーン) -->
      <div class="pf-kanban-column pf-kanban-col-applying-review" id="pf-col-applying-review" ondragover="onPfColumnDragOver(event)" ondragleave="onPfColumnDragLeave(event)" ondrop="onPfColumnDrop(event, 'applying-review')">
        <div class="pf-kanban-column-header">
          <div class="pf-kanban-col-title text-emerald-700">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <span>申込済み</span>
          </div>
          <span class="pf-kanban-col-count bg-emerald-100 text-emerald-800" id="pf-kanban-count-applying-review">0</span>
        </div>
        <div class="pf-kanban-card-list" id="pf-kanban-list-applying-review"></div>
      </div>

    </div>
  </div>

  <!-- ======================================================== -->
  <!-- 📋 2. リスト表示 (従来の 2カラム Master-Detail) -->
  <!-- ======================================================== -->
  <div id="pf-list-container" class="pf-2col-layout hidden">
    
    <!-- 左カラム: 最優先フォロー名簿パネル (Master List) -->
    <div class="pf-master-panel section-card">
      <div class="section-header flex-col gap-2 p-3 bg-white">
        <!-- アクション状況スマートセグメント (全件 / 🔴 超過 / ⚪ 放置 / 🔵 進行中) -->
        <div class="w-full overflow-x-auto pb-0.5">
          <div class="tab-filter-group flex gap-1 bg-slate-100 p-1 rounded-lg w-full" id="pf-action-filter-group">
            <button type="button" class="tab-btn active flex-1 py-1 text-xs font-bold text-center" id="pf-action-filter-all" onclick="setPriorityFollowActionFilter('ALL')">
              全件
            </button>
            <button type="button" class="tab-btn flex-1 py-1 text-xs font-bold flex items-center justify-center gap-1" id="pf-action-filter-overdue" onclick="setPriorityFollowActionFilter('OVERDUE')" title="期限超過">
              <span class="w-2 h-2 rounded-full bg-rose-500 shrink-0"></span>
              <span>超過</span>
              <span id="pf-count-overdue" class="text-[10px] tabular-nums font-bold text-slate-500">0</span>
            </button>
            <button type="button" class="tab-btn flex-1 py-1 text-xs font-bold flex items-center justify-center gap-1" id="pf-action-filter-stagnant" onclick="setPriorityFollowActionFilter('STAGNANT')" title="アクション放置（未設定）">
              <span class="w-2 h-2 rounded-full bg-slate-400 shrink-0"></span>
              <span>放置</span>
              <span id="pf-count-stagnant" class="text-[10px] tabular-nums font-bold text-slate-500">0</span>
            </button>
            <button type="button" class="tab-btn flex-1 py-1 text-xs font-bold flex items-center justify-center gap-1" id="pf-action-filter-active" onclick="setPriorityFollowActionFilter('ACTIVE')" title="進行中">
              <span class="w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>
              <span>進行中</span>
              <span id="pf-count-active" class="text-[10px] tabular-nums font-bold text-slate-500">0</span>
            </button>
          </div>
        </div>
      </div>

      <!-- ビジターアイテム一覧 (スクロール可能) -->
      <div id="pf-visitor-list" class="pf-visitor-list"></div>

      <!-- ページネーションバー -->
      <div class="pagination-bar p-3 border-t border-slate-100 bg-white">
        <div class="pagination-info text-[11px]" id="pf-pagination-info">0 件</div>
        <div class="pagination-controls gap-1">
          <button type="button" class="btn-action-secondary text-xs px-2.5 py-1" id="btn-pf-prev-page" onclick="changePriorityFollowPage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="pf-pagination-page-num" class="pagination-page-num text-xs">1/1</span>
          <button type="button" class="btn-action-secondary text-xs px-2.5 py-1" id="btn-pf-next-page" onclick="changePriorityFollowPage(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </div>

    <!-- 右カラム: ビジター詳細カルテパネル (Detail View) -->
    <div class="pf-detail-panel" id="pf-detail-panel">
      <div id="pf-detail-content" class="pf-detail-content">
        <!-- JSで選択されたビジターのカルテがここにリアルタイム描画される -->
      </div>
    </div>

  </div>

</div>
