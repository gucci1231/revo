<script>
/**
 * Event & Training Calendar Controller (REvo Chapter & Kyoto CC Region)
 */

let allCalendarEvents = [];
let allTrainingEvents = []; // Backward compatibility
let currentCalendarMonth = new Date().toISOString().substring(0, 7);
let currentEventViewMode = 'calendar'; // 'calendar' (or 'month'), 'week', 'list'
let currentWeekStartDate = getSundayOfDate(new Date());
let selectedCalendarDate = formatDateToIso(new Date());
let selectedDayForModal = '';
let currentDetailTrainingEvent = null;
let currentEditingChapterEvent = null;
let currentSharingEvent = null;

let currentTrainingFilter = {
  sourceType: '',      // '' (all), 'meeting', 'chapter', 'training'
  format: 'all',       // 'all', 'online', 'inperson'
  month: '',           // '' for all, or 'YYYY-MM'
  category: '',
  keyword: '',
  scope: 'upcoming'    // for list view
};
let trainingSearchTimeout = null;

function getSundayOfDate(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0 is Sunday
  date.setDate(date.getDate() - day);
  return date;
}

function formatDateToIso(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function initTrainingView() {
  // Sync initial month if not set
  if (!currentCalendarMonth) {
    currentCalendarMonth = new Date().toISOString().substring(0, 7);
  }
  if (!currentWeekStartDate) {
    currentWeekStartDate = getSundayOfDate(new Date());
  }

  // Mobile defaults to Week View (Apple Calendar standard)
  const isMobile = window.innerWidth <= 768;
  if (isMobile && currentEventViewMode !== 'week') {
    currentEventViewMode = 'week';
    const calContainer = document.getElementById('calendar-view-container');
    const weekContainer = document.getElementById('week-view-container');
    const btnMonth = document.getElementById('btn-view-mode-calendar');
    const btnWeek = document.getElementById('btn-view-mode-week');
    if (calContainer) calContainer.classList.add('hidden');
    if (weekContainer) weekContainer.classList.remove('hidden');
    if (btnMonth) btnMonth.className = 'px-3 py-1.5 rounded-md transition-all hover:text-slate-900 text-slate-600 flex items-center gap-1.5 font-bold cursor-pointer';
    if (btnWeek) btnWeek.className = 'px-3 py-1.5 rounded-md transition-all bg-white text-slate-900 shadow-xs font-black flex items-center gap-1.5 cursor-pointer';
  }

  updateCalendarMonthHeader();
  loadCalendarAndEvents();
  initCalendarTouchSwipe();
}

/**
 * Setup Touch Swipe navigation for weekly calendar (Mobile infinite week scroll)
 */
let calendarSwipeTouchStartX = 0;
let calendarSwipeTouchStartY = 0;
let calendarSwipeTouchEndX = 0;
let calendarSwipeTouchEndY = 0;
let calendarTouchBound = false;

function initCalendarTouchSwipe() {
  if (calendarTouchBound) return;
  const container = document.getElementById('week-view-container');
  if (!container) return;

  container.addEventListener('touchstart', (e) => {
    if (e.touches && e.touches.length === 1) {
      calendarSwipeTouchStartX = e.touches[0].clientX;
      calendarSwipeTouchStartY = e.touches[0].clientY;
      calendarSwipeTouchEndX = calendarSwipeTouchStartX;
      calendarSwipeTouchEndY = calendarSwipeTouchStartY;
    }
  }, { passive: true });

  container.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches.length === 1) {
      calendarSwipeTouchEndX = e.touches[0].clientX;
      calendarSwipeTouchEndY = e.touches[0].clientY;
    }
  }, { passive: true });

  container.addEventListener('touchend', (e) => {
    const deltaX = calendarSwipeTouchEndX - calendarSwipeTouchStartX;
    const deltaY = calendarSwipeTouchEndY - calendarSwipeTouchStartY;

    // Detect horizontal swipe if deltaX is significant and predominantly horizontal
    if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3) {
      if (deltaX < 0) {
        // Swiped Left -> Next Day (1 day forward)
        navigateCalendarDay(1);
      } else {
        // Swiped Right -> Prev Day (1 day backward)
        navigateCalendarDay(-1);
      }
    }
  }, { passive: true });

  calendarTouchBound = true;
}

/**
 * Backward compatibility alias for loadCalendarAndEvents
 */
function loadTrainingEvents() {
  return loadCalendarAndEvents();
}

function setTrainingMonthFilter(month, btn) {
  if (month) {
    currentCalendarMonth = month;
    updateCalendarMonthHeader();
  }
  loadCalendarAndEvents();
}

/**
 * Update the period (month or week) label in calendar toolbar
 */
function updateCalendarMonthHeader() {
  const label = document.getElementById('calendar-current-month-label');
  if (!label) return;

  if (currentEventViewMode === 'week') {
    const sun = new Date(currentWeekStartDate);
    const sat = new Date(currentWeekStartDate);
    sat.setDate(sat.getDate() + 6);

    const sunM = sun.getMonth() + 1;
    const satM = sat.getMonth() + 1;

    if (sunM === satM) {
      label.innerText = `${sunM}月`;
    } else {
      label.innerText = `${sunM}月 - ${satM}月`;
    }
  } else {
    if (!currentCalendarMonth) {
      currentCalendarMonth = new Date().toISOString().substring(0, 7);
    }
    const parts = currentCalendarMonth.split('-');
    label.innerText = `${parseInt(parts[1], 10)}月`;
  }
}

/**
 * Fetch calendar and event data
 */
async function loadCalendarAndEvents() {
  const loadingEl = document.getElementById('training-loading-state');
  const emptyEl = document.getElementById('training-empty-state');
  const gridEl = document.getElementById('calendar-grid');

  if (loadingEl) loadingEl.classList.remove('hidden');
  if (emptyEl) emptyEl.classList.add('hidden');

  try {
    const res = await ApiService.call('getCalendarEventsApi', {
      month: currentCalendarMonth,
      format: currentTrainingFilter.format !== 'all' ? currentTrainingFilter.format : '',
      source_type: currentTrainingFilter.sourceType,
      keyword: currentTrainingFilter.keyword
    });

    if (loadingEl) loadingEl.classList.add('hidden');

    if (res && res.success !== false) {
      const data = res.data || res;
      allCalendarEvents = data.events || [];
      allTrainingEvents = allCalendarEvents.filter(e => e.source_type === 'training');

      // Render KPIs
      renderTrainingKpis(data.summary);

      // Render Active View
      if (currentEventViewMode === 'week') {
        renderWeekView();
      } else if (currentEventViewMode === 'list') {
        renderFilteredTrainingEvents();
      } else {
        renderCalendarGrid();
      }

      // Check URL deep link for opening event modal
      checkUrlEventDeepLink();
    } else {
      if (emptyEl) emptyEl.classList.remove('hidden');
      if (gridEl) {
        gridEl.innerHTML = `
          <div class="col-span-7 py-20 text-center bg-white text-xs text-slate-400">
            予定データの取得に失敗しました
          </div>
        `;
      }
    }
  } catch (err) {
    console.error('Failed to load calendar events:', err);
    if (loadingEl) loadingEl.classList.add('hidden');
    if (emptyEl) emptyEl.classList.remove('hidden');
    showToast('イベント情報の読み込みに失敗しました', 'error');
  }
}

/**
 * Universal Period Navigation (works for both Month & Week modes)
 */
function navigateCalendarPeriod(delta) {
  if (currentEventViewMode === 'week') {
    navigateCalendarWeek(delta);
  } else {
    navigateCalendarMonth(delta);
  }
}

function jumpToCurrentCalendarPeriod() {
  if (currentEventViewMode === 'week') {
    jumpToCurrentWeek();
  } else {
    jumpToCurrentMonth();
  }
}

/**
 * Navigate calendar day in week view (delta = -1 or +1)
 * Moves selected day by 1 day. If crossing week boundaries, automatically shifts the active week.
 */
function navigateCalendarDay(delta) {
  let baseDateStr = selectedCalendarDate;
  if (!baseDateStr) {
    baseDateStr = formatDateToIso(currentWeekStartDate || new Date());
  }

  const cur = new Date(baseDateStr.replace(/-/g, '/'));
  cur.setDate(cur.getDate() + delta);
  selectedCalendarDate = formatDateToIso(cur);

  // Check if newly selected date falls outside the currently active week (Sun-Sat)
  const currentSun = new Date(currentWeekStartDate);
  currentSun.setHours(0, 0, 0, 0);
  const currentSat = new Date(currentSun);
  currentSat.setDate(currentSat.getDate() + 6);
  currentSat.setHours(23, 59, 59, 999);

  const checkDate = new Date(cur);
  checkDate.setHours(12, 0, 0, 0);

  if (checkDate < currentSun || checkDate > currentSat) {
    currentWeekStartDate = getSundayOfDate(cur);
  }

  // Determine the primary month of this week (use Wednesday as midpoint)
  const midWeek = new Date(currentWeekStartDate);
  midWeek.setDate(midWeek.getDate() + 3);
  const midMonth = `${midWeek.getFullYear()}-${String(midWeek.getMonth() + 1).padStart(2, '0')}`;

  updateCalendarMonthHeader();

  if (midMonth !== currentCalendarMonth) {
    currentCalendarMonth = midMonth;
    loadCalendarAndEvents();
  } else {
    renderWeekView();
  }
}

/**
 * Navigate calendar week (delta = -1 or +1)
 */
function navigateCalendarWeek(delta) {
  const current = new Date(currentWeekStartDate);
  current.setDate(current.getDate() + (delta * 7));
  currentWeekStartDate = current;

  // Sync selectedCalendarDate to the Sunday of newly navigated week
  selectedCalendarDate = formatDateToIso(currentWeekStartDate);

  // Determine the primary month of this week (use Wednesday as midpoint)
  const midWeek = new Date(currentWeekStartDate);
  midWeek.setDate(midWeek.getDate() + 3);
  const midMonth = `${midWeek.getFullYear()}-${String(midWeek.getMonth() + 1).padStart(2, '0')}`;

  updateCalendarMonthHeader();

  if (midMonth !== currentCalendarMonth) {
    currentCalendarMonth = midMonth;
    loadCalendarAndEvents();
  } else {
    renderWeekView();
  }
}

/**
 * Jump back to current week
 */
function jumpToCurrentWeek() {
  currentWeekStartDate = getSundayOfDate(new Date());
  selectedCalendarDate = formatDateToIso(new Date());
  const now = new Date();
  currentCalendarMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  updateCalendarMonthHeader();
  loadCalendarAndEvents();
}

/**
 * Navigate calendar month (delta = -1 or +1)
 */
function navigateCalendarMonth(delta) {
  const parts = currentCalendarMonth.split('-').map(Number);
  const d = new Date(parts[0], parts[1] - 1 + delta, 1);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  currentCalendarMonth = `${y}-${m}`;

  const todayStr = formatDateToIso(new Date());
  selectedCalendarDate = todayStr.startsWith(currentCalendarMonth) ? todayStr : `${currentCalendarMonth}-01`;

  updateCalendarMonthHeader();
  loadCalendarAndEvents();
}

/**
 * Jump back to current real-world month
 */
function jumpToCurrentMonth() {
  currentCalendarMonth = new Date().toISOString().substring(0, 7);
  selectedCalendarDate = formatDateToIso(new Date());
  updateCalendarMonthHeader();
  loadCalendarAndEvents();
}

/**
 * 1-Button View Mode Cycle (Week 📆 ⇋ Month 📅 ⇋ List 📋)
 * Seamlessly toggles view modes like Apple Calendar with a single clean icon button.
 */
function cycleEventViewMode() {
  let nextMode = 'month';
  if (currentEventViewMode === 'week') {
    nextMode = 'month';
  } else if (currentEventViewMode === 'month') {
    nextMode = 'list';
  } else {
    // Return to month view from list mode
    nextMode = 'month';
  }
  setEventViewMode(nextMode);
}

/**
 * Synchronize view mode tabs inside the filter modal
 */
function updateModalViewModeTabs() {
  const btnMonth = document.getElementById('modal-tab-view-month');
  const btnWeek = document.getElementById('modal-tab-view-week');
  const btnList = document.getElementById('modal-tab-view-list');
  if (!btnMonth || !btnWeek || !btnList) return;

  const activeClass = 'py-1.5 rounded-lg transition-all bg-white text-slate-900 shadow-xs cursor-pointer flex items-center justify-center gap-1.5 font-black';
  const inactiveClass = 'py-1.5 rounded-lg transition-all hover:text-slate-900 text-slate-600 cursor-pointer flex items-center justify-center gap-1.5 font-bold';

  btnMonth.className = currentEventViewMode === 'month' ? activeClass : inactiveClass;
  btnWeek.className = currentEventViewMode === 'week' ? activeClass : inactiveClass;
  btnList.className = currentEventViewMode === 'list' ? activeClass : inactiveClass;
}

/**
 * Set Event View Mode (Month vs Week vs List)
 */
function setEventViewMode(mode) {
  // Normalize 'calendar' or 'month'
  if (mode === 'calendar') mode = 'month';
  currentEventViewMode = mode;

  const calContainer = document.getElementById('calendar-view-container');
  const weekContainer = document.getElementById('week-view-container');
  const listContainer = document.getElementById('list-view-container');
  const calToolbar = document.getElementById('calendar-month-toolbar');
  const listToolbar = document.getElementById('list-mode-toolbar');

  const btnMonth = document.getElementById('btn-view-mode-calendar');
  const btnWeek = document.getElementById('btn-view-mode-week');
  const btnList = document.getElementById('btn-view-mode-list');
  const btnJumpToday = document.getElementById('btn-calendar-jump-today');
  const cycleIcon = document.getElementById('view-mode-cycle-icon');
  const cycleBtn = document.getElementById('btn-view-mode-cycle');

  const activeBtnClass = 'px-3 py-1.5 rounded-md transition-all bg-white text-slate-900 shadow-xs font-black flex items-center gap-1.5 cursor-pointer';
  const inactiveBtnClass = 'px-3 py-1.5 rounded-md transition-all hover:text-slate-900 text-slate-600 flex items-center gap-1.5 font-bold cursor-pointer';

  // Always keep main toolbar visible so switcher, filter popup, and add event buttons remain accessible
  if (calToolbar) calToolbar.classList.remove('hidden');

  if (mode === 'month') {
    if (calContainer) calContainer.classList.remove('hidden');
    if (weekContainer) weekContainer.classList.add('hidden');
    if (listContainer) listContainer.classList.add('hidden');
    if (listToolbar) listToolbar.classList.add('hidden');

    if (btnMonth) btnMonth.className = activeBtnClass;
    if (btnWeek) btnWeek.className = inactiveBtnClass;
    if (btnList) btnList.className = inactiveBtnClass;
    if (btnJumpToday) btnJumpToday.innerText = '今月';
    if (cycleIcon) cycleIcon.className = 'fa-solid fa-calendar-days text-sm text-blue-600';
    if (cycleBtn) cycleBtn.title = '月表示中 (タップでリスト表示へ)';

    updateCalendarMonthHeader();
    renderCalendarGrid();
  } else if (mode === 'week') {
    if (calContainer) calContainer.classList.add('hidden');
    if (weekContainer) weekContainer.classList.remove('hidden');
    if (listContainer) listContainer.classList.add('hidden');
    if (listToolbar) listToolbar.classList.add('hidden');

    if (btnMonth) btnMonth.className = inactiveBtnClass;
    if (btnWeek) btnWeek.className = activeBtnClass;
    if (btnList) btnList.className = inactiveBtnClass;
    if (btnJumpToday) btnJumpToday.innerText = '今週';
    if (cycleIcon) cycleIcon.className = 'fa-solid fa-calendar-week text-sm text-blue-600';
    if (cycleBtn) cycleBtn.title = '週表示中 (タップで月表示へ)';

    updateCalendarMonthHeader();
    renderWeekView();
  } else {
    // List mode
    if (calContainer) calContainer.classList.add('hidden');
    if (weekContainer) weekContainer.classList.add('hidden');
    if (listContainer) listContainer.classList.remove('hidden');
    if (listToolbar) listToolbar.classList.remove('hidden');

    if (btnMonth) btnMonth.className = inactiveBtnClass;
    if (btnWeek) btnWeek.className = inactiveBtnClass;
    if (btnList) btnList.className = activeBtnClass;
    if (btnJumpToday) btnJumpToday.innerText = '今月';
    if (cycleIcon) cycleIcon.className = 'fa-solid fa-list-ul text-sm text-blue-600';
    if (cycleBtn) cycleBtn.title = 'リスト表示中 (タップで月表示へ)';

    updateCalendarMonthHeader();
    renderFilteredTrainingEvents();
  }

  updateModalViewModeTabs();
}

/**
 * Filter Popup Modal Controls (Apple Style Modal)
 */
function openCalendarFilterModal() {
  const modal = document.getElementById('modal-calendar-filters');
  if (modal) {
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    const input = document.getElementById('training-search-input');
    if (input) {
      input.value = currentTrainingFilter.keyword || '';
    }
    updateCalendarFilterIndicator();
    updateModalViewModeTabs();
  }
}

function closeCalendarFilterModal() {
  const modal = document.getElementById('modal-calendar-filters');
  if (modal) {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }
}

/**
 * Update active indicator badge on filter trigger button
 */
function updateCalendarFilterIndicator() {
  const badgeDot = document.getElementById('calendar-filter-badge-dot');
  const isFiltered = (currentTrainingFilter.format && currentTrainingFilter.format !== 'all') ||
                     (currentTrainingFilter.sourceType && currentTrainingFilter.sourceType !== '') ||
                     (currentTrainingFilter.keyword && currentTrainingFilter.keyword !== '');

  if (badgeDot) {
    if (isFiltered) {
      badgeDot.classList.remove('hidden');
    } else {
      badgeDot.classList.add('hidden');
    }
  }
}

/**
 * Reset all calendar filters to default
 */
function resetCalendarFilters() {
  currentTrainingFilter.format = 'all';
  currentTrainingFilter.sourceType = '';
  currentTrainingFilter.keyword = '';

  const searchInput = document.getElementById('training-search-input');
  if (searchInput) searchInput.value = '';

  // Reset Format Pills
  const formatContainer = document.getElementById('training-format-filters');
  if (formatContainer) {
    const buttons = formatContainer.querySelectorAll('button');
    buttons.forEach((b, idx) => {
      if (idx === 0) {
        b.className = 'py-1.5 rounded-lg transition-all bg-white text-slate-900 shadow-xs cursor-pointer flex items-center justify-center gap-1.5';
      } else {
        b.className = 'py-1.5 rounded-lg transition-all hover:text-slate-900 text-slate-600 cursor-pointer flex items-center justify-center gap-1.5';
      }
    });
  }

  // Reset Source Pills
  const sourceContainer = document.getElementById('event-source-filters');
  if (sourceContainer) {
    sourceContainer.querySelectorAll('button').forEach(b => {
      b.className = 'p-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-bold flex items-center justify-between text-xs cursor-pointer hover:border-slate-300 transition-all';
      const check = b.querySelector('.filter-source-check');
      if (check) check.classList.add('hidden');
    });
    const allBtn = document.getElementById('btn-source-all');
    if (allBtn) {
      allBtn.className = 'p-2.5 rounded-xl border border-blue-500 bg-blue-50/40 text-blue-900 font-bold shadow-2xs flex items-center justify-between text-xs cursor-pointer transition-all active-source-pill';
      const allCheck = allBtn.querySelector('.filter-source-check');
      if (allCheck) allCheck.classList.remove('hidden');
    }
  }

  updateCalendarFilterIndicator();
  loadCalendarAndEvents();
}

function clearTrainingSearch() {
  const input = document.getElementById('training-search-input');
  if (input) {
    input.value = '';
    currentTrainingFilter.keyword = '';
    updateCalendarFilterIndicator();
    loadCalendarAndEvents();
  }
}

/**
 * Source Type Filter (All, Meeting, Chapter, Training, Action, Deadline)
 */
function setEventSourceFilter(type, btn) {
  currentTrainingFilter.sourceType = type;
  const container = document.getElementById('event-source-filters');
  if (container) {
    container.querySelectorAll('button').forEach(b => {
      b.className = 'p-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-bold flex items-center justify-between text-xs cursor-pointer hover:border-slate-300 transition-all';
      const check = b.querySelector('.filter-source-check');
      if (check) check.classList.add('hidden');
    });
    if (btn) {
      btn.className = 'p-2.5 rounded-xl border border-blue-500 bg-blue-50/40 text-blue-900 font-bold shadow-2xs flex items-center justify-between text-xs cursor-pointer transition-all active-source-pill';
      const check = btn.querySelector('.filter-source-check');
      if (check) check.classList.remove('hidden');
    }
  }
  updateCalendarFilterIndicator();
  loadCalendarAndEvents();
}

/**
 * Format Filter (All, Online, In-person)
 */
function setTrainingFormatFilter(format, btn) {
  currentTrainingFilter.format = format;
  const container = document.getElementById('training-format-filters');
  if (container) {
    container.querySelectorAll('button').forEach(b => {
      b.className = 'py-1.5 rounded-lg transition-all hover:text-slate-900 text-slate-600 cursor-pointer flex items-center justify-center gap-1.5';
    });
    if (btn) {
      btn.className = 'py-1.5 rounded-lg transition-all bg-white text-slate-900 shadow-xs font-bold cursor-pointer flex items-center justify-center gap-1.5';
    }
  }
  updateCalendarFilterIndicator();
  loadCalendarAndEvents();
}

/**
 * Keyword search with debounce
 */
function debounceTrainingFilter() {
  clearTimeout(trainingSearchTimeout);
  trainingSearchTimeout = setTimeout(() => {
    const input = document.getElementById('training-search-input');
    currentTrainingFilter.keyword = input ? input.value.trim().toLowerCase() : '';
    updateCalendarFilterIndicator();
    loadCalendarAndEvents();
  }, 250);
}

/**
/**
 * Render Weekly Calendar View (iPhone Style Week Strip & Responsive Timeline)
 */
function renderWeekView() {
  const weekGrid = document.getElementById('week-grid');
  if (!weekGrid) return;

  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  const todayStr = new Date().toISOString().substring(0, 10);
  const now = new Date();
  const currentHour = now.getHours();
  const currentMinutes = now.getMinutes();

  // Timeline configuration (06:00 to 22:00 = 17 hours)
  const START_HOUR = 6;
  const END_HOUR = 22;
  const TOTAL_HOURS = END_HOUR - START_HOUR + 1;
  const HOUR_HEIGHT = 56; // px per hour
  const TOTAL_HEIGHT = TOTAL_HOURS * HOUR_HEIGHT;

  // Group events by YYYY-MM-DD
  const eventsByDate = {};
  allCalendarEvents.forEach(ev => {
    if (!ev.start_datetime) return;
    const dateKey = ev.start_datetime.substring(0, 10);
    if (!eventsByDate[dateKey]) eventsByDate[dateKey] = [];
    eventsByDate[dateKey].push(ev);
  });

  const startDate = new Date(currentWeekStartDate);

  // Validate or set selectedCalendarDate within this week
  const weekDates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(startDate);
    d.setDate(d.getDate() + i);
    weekDates.push(formatDateToIso(d));
  }
  if (!weekDates.includes(selectedCalendarDate)) {
    selectedCalendarDate = weekDates.includes(todayStr) ? todayStr : weekDates[0];
  }

  // 1. Build Day Header Cells for Desktop (Top Bar)
  let desktopHeaderColsHtml = '';
  const daysMeta = [];

  for (let i = 0; i < 7; i++) {
    const dayDate = new Date(startDate);
    dayDate.setDate(dayDate.getDate() + i);

    const dateKey = formatDateToIso(dayDate);
    const dayOfWeek = dayDate.getDay();
    const dayName = dayNames[dayOfWeek];
    const dayNum = dayDate.getDate();
    const isToday = dateKey === todayStr;
    const isSelected = dateKey === selectedCalendarDate;
    const isThursday = dayOfWeek === 4;

    daysMeta.push({ dayDate, dateKey, dayOfWeek, dayName, dayNum, isToday, isSelected, isThursday });

    let dayNameColor = 'text-slate-500';
    let dayNumDisplay = `<span class="text-sm font-semibold font-mono tabular-nums text-slate-800">${dayNum}</span>`;

    if (dayOfWeek === 0) {
      dayNameColor = 'text-rose-500 font-bold';
      dayNumDisplay = `<span class="text-sm font-semibold font-mono tabular-nums text-rose-500">${dayNum}</span>`;
    } else if (dayOfWeek === 6) {
      dayNameColor = 'text-blue-500 font-bold';
      dayNumDisplay = `<span class="text-sm font-semibold font-mono tabular-nums text-blue-500">${dayNum}</span>`;
    } else if (isThursday) {
      dayNameColor = 'text-blue-600 font-bold';
      dayNumDisplay = `<span class="text-sm font-bold font-mono tabular-nums text-blue-600">${dayNum}</span>`;
    }

    if (isToday) {
      dayNameColor = 'text-blue-600 font-bold';
      dayNumDisplay = `<span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-2xs font-mono tabular-nums">${dayNum}</span>`;
    }

    desktopHeaderColsHtml += `
      <div class="flex-1 min-w-[110px] sm:min-w-[120px] p-2 text-center border-r border-slate-200 last:border-r-0 ${isToday ? 'bg-blue-50/30' : (isThursday ? 'bg-blue-50/15' : 'bg-white')} flex items-center justify-between group">
        <div class="flex items-center gap-1.5 mx-auto">
          <span class="text-xs ${dayNameColor}">${dayName}</span>
          ${dayNumDisplay}
          ${isThursday ? '<span class="text-3xs font-extrabold text-blue-600 hidden xl:inline ml-0.5">定例会</span>' : ''}
        </div>
        <button type="button" onclick="openChapterEventModalOnDate('${dateKey}', event)" class="w-5 h-5 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-700 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-3xs shrink-0 cursor-pointer" title="この日に予定を追加">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
    `;
  }

  // 2. Build Time Labels Column (Left Column)
  let timeLabelsHtml = '';
  for (let h = START_HOUR; h <= END_HOUR; h++) {
    const timeStr = `${String(h).padStart(2, '0')}:00`;
    timeLabelsHtml += `
      <div style="height: ${HOUR_HEIGHT}px;" class="relative border-b border-transparent">
        <span class="absolute -top-2.5 right-2 font-mono font-bold text-xs tabular-nums text-slate-400 select-none">
          ${timeStr}
        </span>
      </div>
    `;
  }

  // Helper function to build positioned event cards inside a timeline column
  function buildTimelineEventsHtml(dayEvents) {
    const timedEvents = [];
    const allDayEvents = [];

    dayEvents.forEach(ev => {
      const timePart = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
      if (!timePart || (timePart === '00:00' && (!ev.end_datetime || ev.end_datetime.substring(11, 16) === '00:00'))) {
        allDayEvents.push(ev);
      } else {
        const [h, m] = timePart.split(':').map(Number);
        const startMin = h * 60 + m;

        let endMin = startMin + 60; // Default 1 hour duration
        if (ev.end_datetime && ev.end_datetime.length >= 16) {
          const [eh, em] = ev.end_datetime.substring(11, 16).split(':').map(Number);
          const calculatedEnd = eh * 60 + em;
          if (calculatedEnd > startMin) endMin = calculatedEnd;
        }

        timedEvents.push({ ev, startMin, endMin });
      }
    });

    // Layout algorithm for overlapping events within the column
    timedEvents.sort((a, b) => a.startMin - b.startMin || (b.endMin - b.startMin) - (a.endMin - a.startMin));

    return timedEvents.map((item, idx, arr) => {
      const ev = item.ev;
      const startMinFromBase = item.startMin - (START_HOUR * 60);
      const durationMin = item.endMin - item.startMin;

      const topPx = Math.max(0, (startMinFromBase * HOUR_HEIGHT) / 60);
      const heightPx = Math.max(34, (durationMin * HOUR_HEIGHT) / 60);

      // Overlap detection
      const overlapping = arr.filter(other => (other.startMin < item.endMin && other.endMin > item.startMin));
      const colIndex = overlapping.indexOf(item);
      const colCount = Math.max(1, overlapping.length);

      const widthPct = 100 / colCount;
      const leftPct = colIndex * widthPct;

      const timeStr = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
      const endTimeStr = ev.end_datetime ? ` - ${ev.end_datetime.substring(11, 16)}` : '';

      const isDeadline = (ev.category === '締切・期限' || ev.category === '締切' || (ev.title || '').includes('締切'));
      let cardStyle = '';
      if (ev.source_type === 'member') {
        cardStyle = 'bg-orange-50/95 border-l-[3px] border-orange-500 text-orange-950 hover:bg-orange-100 hover:border-orange-600';
      } else if (ev.source_type === 'meeting') {
        cardStyle = 'bg-blue-50/95 border-l-[3px] border-blue-600 text-blue-950 hover:bg-blue-100 hover:border-blue-700';
      } else if (ev.source_type === 'action') {
        if (ev.is_completed) {
          cardStyle = 'bg-slate-100/95 border-l-[3px] border-slate-300 text-slate-500 hover:bg-slate-200 line-through';
        } else {
          cardStyle = 'bg-amber-50/95 border-l-[3px] border-amber-500 text-amber-950 hover:bg-amber-100 hover:border-amber-600';
        }
      } else if (isDeadline) {
        cardStyle = 'bg-rose-50/95 border-l-[3px] border-rose-500 text-rose-950 hover:bg-rose-100 hover:border-rose-600';
      } else if (ev.source_type === 'chapter') {
        cardStyle = 'bg-purple-50/95 border-l-[3px] border-purple-600 text-purple-950 hover:bg-purple-100 hover:border-purple-700';
      } else {
        cardStyle = 'bg-emerald-50/95 border-l-[3px] border-emerald-600 text-emerald-950 hover:bg-emerald-100 hover:border-emerald-700';
      }

      const visitorTag = (ev.visitor_count !== undefined && ev.visitor_count > 0)
        ? `<span class="inline-flex items-center gap-0.5 text-blue-600 font-bold text-3xs shrink-0" title="ビジター ${ev.visitor_count}名"><i class="fa-solid fa-users text-3xs"></i>${ev.visitor_count}</span>`
        : '';

      let typeTag = '';
      if (ev.source_type === 'action') {
        typeTag = ev.is_completed
          ? `<i class="fa-solid fa-check text-slate-400 text-xs shrink-0" title="完了"></i>`
          : `<i class="fa-regular fa-clock text-amber-500 text-xs shrink-0" title="アクション"></i>`;
      } else if (isDeadline) {
        typeTag = `<i class="fa-solid fa-flag text-rose-500 text-xs shrink-0" title="締切"></i>`;
      }

      const formatTag = ev.source_type === 'action' || isDeadline ? '' : (ev.is_online
        ? `<i class="fa-solid fa-video text-blue-500 text-xs shrink-0" title="Zoom"></i>`
        : `<i class="fa-solid fa-location-dot text-emerald-500 text-xs shrink-0" title="対面"></i>`);

      const flyerTag = ev.flyer_url
        ? `<i class="fa-solid fa-image text-orange-500 text-xs shrink-0" title="チラシあり"></i>`
        : '';

      return `
        <div onclick="handleCalendarEventClick('${ev.id}', event)"
             style="top: ${topPx}px; height: ${heightPx}px; left: calc(${leftPct}% + 1px); width: calc(${widthPct}% - 2px);"
             class="absolute z-10 rounded-lg p-1.5 sm:p-2 border ${cardStyle} shadow-2xs transition-all cursor-pointer overflow-hidden flex flex-col justify-between group/card hover:shadow-xs active:scale-[0.99]"
             title="${escapeHtml(ev.title)} (${timeStr}${endTimeStr})">

          <div>
            <!-- Unified Font Size: Time in tabular-nums and Title in same size -->
            <div class="flex items-center justify-between gap-1 mb-0.5">
              <div class="font-mono font-bold text-xs tabular-nums text-slate-800 flex items-center gap-1 shrink-0">
                <i class="fa-regular fa-clock text-slate-400 text-xs"></i>
                <span>${timeStr}${endTimeStr}</span>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                ${flyerTag}
                ${typeTag}
                ${formatTag}
                ${visitorTag}
              </div>
            </div>

            <h5 class="font-bold text-xs text-slate-900 leading-snug line-clamp-2 group-hover/card:text-blue-700 transition-colors">
              ${escapeHtml(ev.title)}
            </h5>
          </div>

          ${ev.location_name && heightPx > 50 ? `
            <p class="text-3xs text-slate-500 truncate mt-0.5 flex items-center gap-1">
              <i class="fa-solid fa-location-dot text-slate-400 text-3xs shrink-0"></i>
              <span class="truncate">${escapeHtml(ev.location_name)}</span>
            </p>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  // 3. Build 7 Day Timeline Columns for Desktop
  let desktopTimelineColsHtml = '';

  daysMeta.forEach(meta => {
    const dayEvents = eventsByDate[meta.dateKey] || [];
    const placedEventsHtml = buildTimelineEventsHtml(dayEvents);

    // Current Time Red Line Indicator (if today)
    let currentTimeIndicatorHtml = '';
    if (meta.isToday && currentHour >= START_HOUR && currentHour <= END_HOUR) {
      const nowMinFromBase = (currentHour * 60 + currentMinutes) - (START_HOUR * 60);
      const lineTopPx = (nowMinFromBase * HOUR_HEIGHT) / 60;
      currentTimeIndicatorHtml = `
        <div style="top: ${lineTopPx}px;" class="absolute left-0 right-0 z-20 pointer-events-none flex items-center">
          <div class="w-2.5 h-2.5 -ml-1.25 rounded-full bg-rose-500 ring-2 ring-white"></div>
          <div class="flex-1 h-0.5 bg-rose-500"></div>
        </div>
      `;
    }

    // Grid Horizontal Lines for each hour
    let hourLinesHtml = '';
    for (let h = 0; h < TOTAL_HOURS; h++) {
      hourLinesHtml += `
        <div style="height: ${HOUR_HEIGHT}px;" class="border-b border-slate-100 w-full hover:bg-slate-50/40 transition-colors cursor-pointer" onclick="openChapterEventModalOnDate('${meta.dateKey}', event)"></div>
      `;
    }

    desktopTimelineColsHtml += `
      <div class="flex-1 min-w-[110px] sm:min-w-[120px] relative border-r border-slate-100 last:border-r-0 ${meta.isToday ? 'bg-blue-50/10' : (meta.isThursday ? 'bg-blue-50/5' : 'bg-white')}" style="height: ${TOTAL_HEIGHT}px;">
        <!-- Hour Grid Lines -->
        <div class="absolute inset-0 pointer-events-auto">
          ${hourLinesHtml}
        </div>

        <!-- Current Time Line -->
        ${currentTimeIndicatorHtml}

        <!-- Positioned Events -->
        ${placedEventsHtml}
      </div>

  });

  // 4. Build Mobile iPhone Style Week Strip & Single Day Timeline
  const selectedDayMeta = daysMeta.find(m => m.dateKey === selectedCalendarDate) || daysMeta[0];
  const selectedDayEvents = eventsByDate[selectedDayMeta.dateKey] || [];

  // Mobile Top Week Strip (7 Days Buttons: 日〜土)
  let mobileWeekStripHtml = '';
  daysMeta.forEach(meta => {
    const isSelected = meta.dateKey === selectedCalendarDate;
    const hasEvents = (eventsByDate[meta.dateKey] || []).length > 0;
    const dayEvs = eventsByDate[meta.dateKey] || [];

    // Indicator dots
    const dots = [];
    if (dayEvs.some(e => e.source_type === 'meeting')) dots.push('bg-blue-500');
    if (dayEvs.some(e => e.source_type === 'member')) dots.push('bg-orange-500');
    if (dayEvs.some(e => e.source_type === 'chapter')) dots.push('bg-purple-500');
    if (dayEvs.some(e => e.source_type === 'training')) dots.push('bg-emerald-500');
    if (dayEvs.some(e => e.source_type === 'action')) dots.push('bg-amber-500');
    if (dayEvs.some(e => e.category === '締切' || e.category === '締切・期限')) dots.push('bg-rose-500');

    const dotsHtml = dots.slice(0, 3).map(color => `<span class="w-1.5 h-1.5 rounded-full ${color}"></span>`).join('');

    let nameColor = 'text-slate-400';
    if (meta.dayOfWeek === 0) nameColor = 'text-rose-500';
    else if (meta.dayOfWeek === 6) nameColor = 'text-blue-500';
    else if (meta.isThursday) nameColor = 'text-blue-600 font-bold';

    let numClass = 'text-slate-800';
    if (meta.dayOfWeek === 0) numClass = 'text-rose-500';
    else if (meta.dayOfWeek === 6) numClass = 'text-blue-500';
    else if (meta.isThursday) numClass = 'text-blue-600 font-bold';

    let circleClass = '';
    if (isSelected) {
      circleClass = 'bg-slate-900 text-white shadow-xs';
      nameColor = 'text-slate-900 font-black';
      numClass = 'text-white font-black';
    } else if (meta.isToday) {
      circleClass = 'bg-rose-500 text-white shadow-2xs';
      numClass = 'text-white font-bold';
    }

    mobileWeekStripHtml += `
      <button type="button" onclick="selectWeekDay('${meta.dateKey}')" class="flex-1 flex flex-col items-center py-2 px-0.5 rounded-xl transition-all cursor-pointer active:scale-95 ${isSelected ? 'bg-slate-100/80' : 'hover:bg-slate-50'}">
        <span class="text-3xs font-bold ${nameColor} mb-1">${meta.dayName}</span>
        <div class="w-7 h-7 rounded-full flex items-center justify-center font-mono font-bold text-xs tabular-nums ${circleClass}">
          <span class="${numClass}">${meta.dayNum}</span>
        </div>
        <div class="h-1.5 flex items-center gap-0.5 mt-1">
          ${dotsHtml}
        </div>
      </button>
    `;
  });

  // Mobile Single Day Agenda Card List
  let mobileDayAgendaListHtml = '';
  if (selectedDayEvents.length === 0) {
    mobileDayAgendaListHtml = `
      <div class="py-2.5 text-center text-slate-400 bg-white rounded-xl border border-slate-200/80 px-3">
        <span class="text-xs font-bold text-slate-500">この日の予定はありません</span>
        <button type="button" onclick="openChapterEventModalOnDate('${selectedDayMeta.dateKey}', event)" class="ml-2 px-2.5 py-1 rounded-lg text-3xs font-bold text-blue-600 bg-blue-50 border border-blue-200 hover:bg-blue-100 inline-flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-plus text-4xs"></i> 追加
        </button>
      </div>
    `;
  } else {
    mobileDayAgendaListHtml = `
      <div class="space-y-1.5 max-h-28 overflow-y-auto pr-0.5">
        ${selectedDayEvents.map(ev => {
          const timeStr = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
          const endTimeStr = ev.end_datetime ? ` - ${ev.end_datetime.substring(11, 16)}` : '';
          const isDeadline = (ev.category === '締切・期限' || ev.category === '締切' || (ev.title || '').includes('締切'));

          let borderBar = 'border-l-blue-600';
          if (ev.source_type === 'member') {
            borderBar = 'border-l-orange-500';
          } else if (ev.source_type === 'action') {
            borderBar = ev.is_completed ? 'border-l-slate-300' : 'border-l-amber-500';
          } else if (isDeadline) {
            borderBar = 'border-l-rose-500';
          } else if (ev.source_type === 'chapter') {
            borderBar = 'border-l-purple-600';
          } else if (ev.source_type === 'training') {
            borderBar = 'border-l-emerald-600';
          }

          let actionIcon = '';
          if (ev.source_type === 'action') {
            actionIcon = ev.is_completed
              ? `<i class="fa-solid fa-check text-slate-400 text-xs shrink-0" title="完了"></i>`
              : `<i class="fa-regular fa-clock text-amber-500 text-xs shrink-0" title="アクション"></i>`;
          } else if (isDeadline) {
            actionIcon = `<i class="fa-solid fa-flag text-rose-500 text-xs shrink-0" title="締切"></i>`;
          }

          const formatIcon = ev.source_type === 'action' || isDeadline ? '' : (ev.is_online
            ? `<i class="fa-solid fa-video text-blue-500 text-xs shrink-0" title="Zoom"></i>`
            : `<i class="fa-solid fa-location-dot text-emerald-500 text-xs shrink-0" title="対面"></i>`);

          const visitorTag = (ev.visitor_count !== undefined && ev.visitor_count > 0)
            ? `<span class="inline-flex items-center gap-0.5 text-blue-600 font-bold text-3xs shrink-0" title="ビジター ${ev.visitor_count}名"><i class="fa-solid fa-users text-3xs"></i>${ev.visitor_count}</span>`
            : '';

          const flyerIcon = ev.flyer_url
            ? `<button type="button" onclick="openFlyerLightbox('${escapeHtml(ev.flyer_url)}', '${escapeHtml(ev.title)}', event)" class="text-orange-500 hover:text-orange-600 text-xs p-0.5 cursor-pointer shrink-0" title="チラシを表示">
                <i class="fa-solid fa-image"></i>
              </button>`
            : '';

          return `
            <div onclick="handleCalendarEventClick('${ev.id}', event)" class="p-2 rounded-lg border border-slate-200 bg-white border-l-[3px] ${borderBar} shadow-2xs hover:shadow-xs transition-all cursor-pointer flex items-center justify-between gap-2 active:scale-[0.99]">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="font-mono font-bold text-xs text-slate-700 tabular-nums">${timeStr}${endTimeStr}</span>
                  ${actionIcon}
                  ${formatIcon}
                  ${visitorTag}
                  <span class="font-bold text-xs text-slate-900 leading-snug truncate">${escapeHtml(ev.title)}</span>
                </div>
                ${ev.location_name ? `
                  <div class="text-3xs text-slate-400 truncate mt-0.5 flex items-center gap-1">
                    <i class="fa-solid fa-location-dot text-3xs"></i>
                    <span>${escapeHtml(ev.location_name)}</span>
                  </div>
                ` : ''}
              </div>
              <div class="flex items-center gap-1 shrink-0">
                ${flyerIcon}
                <i class="fa-solid fa-chevron-right text-slate-300 text-3xs"></i>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // Mobile Single Day Timeline Placed Events
  const mobilePlacedEventsHtml = buildTimelineEventsHtml(selectedDayEvents);
  let mobileCurrentTimeIndicatorHtml = '';
  if (selectedDayMeta.isToday && currentHour >= START_HOUR && currentHour <= END_HOUR) {
    const nowMinFromBase = (currentHour * 60 + currentMinutes) - (START_HOUR * 60);
    const lineTopPx = (nowMinFromBase * HOUR_HEIGHT) / 60;
    mobileCurrentTimeIndicatorHtml = `
      <div style="top: ${lineTopPx}px;" class="absolute left-0 right-0 z-20 pointer-events-none flex items-center">
        <div class="w-2.5 h-2.5 -ml-1.25 rounded-full bg-rose-500 ring-2 ring-white"></div>
        <div class="flex-1 h-0.5 bg-rose-500"></div>
      </div>
    `;
  }

  let mobileHourLinesHtml = '';
  for (let h = 0; h < TOTAL_HOURS; h++) {
    mobileHourLinesHtml += `
      <div style="height: ${HOUR_HEIGHT}px;" class="border-b border-slate-100 w-full hover:bg-slate-50/40 transition-colors cursor-pointer" onclick="openChapterEventModalOnDate('${selectedDayMeta.dateKey}', event)"></div>
    `;
  }

  const dObj = new Date(selectedDayMeta.dateKey.replace(/-/g, '/'));
  const formattedDayTitle = `${dObj.getMonth() + 1}月 ${dObj.getDate()}日 (${dayNames[dObj.getDay()]})`;

  // Assemble full HTML: Mobile iPhone layout (sm:hidden) + Desktop 7-col layout (hidden sm:block)
  weekGrid.innerHTML = `
    <!-- ================= MOBILE VIEW (iPhone Style Week Strip & Single Day Timeline) ================= -->
    <div class="block sm:hidden bg-white select-none">
      <!-- 1. iPhone Top Week Strip (Directly connects below top navigation bar) -->
      <div class="border-b border-slate-200 bg-slate-50/40 p-1.5 flex items-center justify-between">
        ${mobileWeekStripHtml}
      </div>

      <!-- 2. Selected Day Header & Quick Agenda -->
      <div class="p-2 sm:p-2.5 bg-slate-50/30 border-b border-slate-100">
        <div class="flex items-center justify-between mb-1.5">

            ${selectedDayMeta.isToday ? '<span class="px-1.5 py-0.2 rounded-full text-3xs font-extrabold bg-blue-600 text-white">今日</span>' : ''}
            <span class="text-3xs text-slate-400 font-bold">${selectedDayEvents.length}件</span>

        ${mobileDayAgendaListHtml}

        <div class="flex-1 relative bg-white" style="height: ${TOTAL_HEIGHT}px;">
          <div class="absolute inset-0 pointer-events-auto">
            ${mobileHourLinesHtml}
          </div>
          ${mobileCurrentTimeIndicatorHtml}
          ${mobilePlacedEventsHtml}
        </div>
      </div>
    </div>

    <!-- ================= DESKTOP VIEW (Full 7-Column Time-Aware Table) ================= -->
    <div class="hidden sm:block overflow-x-auto bg-white">
      <div class="min-w-[770px]">
        <!-- Fixed Header Row (Days Sun - Sat) -->
        <div class="flex border-b border-slate-200 bg-slate-50/50 sticky top-0 z-20">
          <!-- Spacer for time axis -->
          <div class="w-14 sm:w-16 shrink-0 border-r border-slate-200 bg-slate-50/80 p-2 text-center text-3xs font-bold text-slate-400 flex items-center justify-center">
            <span>時刻</span>
          </div>
          <!-- 7 Day Headers -->
          <div class="flex-1 flex">
            ${desktopHeaderColsHtml}
          </div>
        </div>

        <!-- Scrollable Timeline Body -->
        <div class="flex overflow-y-auto max-h-[580px] sm:max-h-[640px] relative">
          <!-- Time Axis Labels (Left Column) -->
          <div class="w-14 sm:w-16 shrink-0 border-r border-slate-200 bg-slate-50/40 select-none" style="height: ${TOTAL_HEIGHT}px;">
            ${timeLabelsHtml}
          </div>

          <!-- 7 Day Timeline Columns Grid -->
          <div class="flex-1 flex relative">
            ${desktopTimelineColsHtml}
          </div>
        </div>
      </div>
    </div>
  `;
}

/**
 * Select a specific weekday in mobile week view
 */
function selectWeekDay(dateKey) {
  selectedCalendarDate = dateKey;
  renderWeekView();
}

/**
 * Render the 7-day Month Grid (Apple Calendar Radical Minimalism)
 */
function renderCalendarGrid() {
  const gridEl = document.getElementById('calendar-grid');
  if (!gridEl) return;

  const [year, month] = currentCalendarMonth.split('-').map(Number);
  const firstDayObj = new Date(year, month - 1, 1);
  const lastDayObj = new Date(year, month, 0);

  const startDayOfWeek = firstDayObj.getDay(); // 0: Sun, 1: Mon, ... 4: Thu
  const totalDays = lastDayObj.getDate();

  // Days from previous month to fill the first row
  const prevMonthLastDay = new Date(year, month - 1, 0).getDate();

  const todayStr = new Date().toISOString().substring(0, 10);

  // Group events by YYYY-MM-DD
  const eventsByDate = {};
  allCalendarEvents.forEach(ev => {
    if (!ev.start_datetime) return;
    const dateKey = ev.start_datetime.substring(0, 10);
    if (!eventsByDate[dateKey]) eventsByDate[dateKey] = [];
    eventsByDate[dateKey].push(ev);
  });

  // Ensure selectedCalendarDate is set to a valid date in this month if not already
  if (!selectedCalendarDate || !selectedCalendarDate.startsWith(currentCalendarMonth)) {
    selectedCalendarDate = todayStr.startsWith(currentCalendarMonth) ? todayStr : `${currentCalendarMonth}-01`;
  }

  let cellsHtml = '';

  // 1. Prev month filler cells
  for (let i = startDayOfWeek - 1; i >= 0; i--) {
    const dayNum = prevMonthLastDay - i;
    const prevMonthNum = month - 1 === 0 ? 12 : month - 1;
    const prevYearNum = month - 1 === 0 ? year - 1 : year;
    const dateKey = `${prevYearNum}-${String(prevMonthNum).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dateKey] || [];

    cellsHtml += renderCalendarCell(dateKey, dayNum, dayEvents, false, dateKey === todayStr, dateKey === selectedCalendarDate);
  }

  // 2. Current month cells
  for (let d = 1; d <= totalDays; d++) {
    const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dateKey] || [];

    cellsHtml += renderCalendarCell(dateKey, d, dayEvents, true, dateKey === todayStr, dateKey === selectedCalendarDate);
  }

  // 3. Next month filler cells to complete the 7-col grid (up to 35 or 42 cells)
  const currentTotalCells = startDayOfWeek + totalDays;
  const targetTotal = currentTotalCells <= 35 ? 35 : 42;
  const nextMonthFill = targetTotal - currentTotalCells;

  for (let d = 1; d <= nextMonthFill; d++) {
    const nextMonthNum = month + 1 === 13 ? 1 : month + 1;
    const nextYearNum = month + 1 === 13 ? year + 1 : year;
    const dateKey = `${nextYearNum}-${String(nextMonthNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dateKey] || [];

    cellsHtml += renderCalendarCell(dateKey, d, dayEvents, false, dateKey === todayStr, dateKey === selectedCalendarDate);
  }

  gridEl.innerHTML = cellsHtml;

  // Render iPhone Style Inline Day Agenda directly underneath
  renderCalendarDayAgenda();
}

/**
 * Helper to render individual calendar cell HTML (iPhone & Desktop Adaptive)
 */
function renderCalendarCell(dateKey, dayNum, dayEvents, isCurrentMonth, isToday, isSelected) {
  const dObj = new Date(dateKey.replace(/-/g, '/'));
  const dayOfWeek = dObj.getDay();
  const isThursday = dayOfWeek === 4;

  let bgClass = isCurrentMonth ? 'bg-white' : 'bg-slate-50/40';
  if (isSelected) {
    bgClass = 'bg-blue-50/40';
  } else if (isToday) {
    bgClass = 'bg-blue-50/20';
  }

  // Numbers styling for desktop & mobile
  let numDisplay = `<span class="text-xs sm:text-sm font-semibold font-mono tabular-nums text-slate-800">${dayNum}</span>`;

  if (!isCurrentMonth) {
    numDisplay = `<span class="text-xs sm:text-sm font-normal font-mono tabular-nums text-slate-300">${dayNum}</span>`;
  } else if (dayOfWeek === 0) {
    numDisplay = `<span class="text-xs sm:text-sm font-bold font-mono tabular-nums text-rose-500">${dayNum}</span>`;
  } else if (dayOfWeek === 6) {
    numDisplay = `<span class="text-xs sm:text-sm font-bold font-mono tabular-nums text-blue-500">${dayNum}</span>`;
  } else if (isThursday) {
    numDisplay = `<span class="text-xs sm:text-sm font-bold font-mono tabular-nums text-blue-600">${dayNum}</span>`;
  }

  // iPhone Style Selection & Today Circle
  if (isSelected) {
    numDisplay = `
      <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-xs sm:text-sm shadow-xs font-mono tabular-nums mx-auto sm:mx-0">
        ${dayNum}
      </div>
    `;
  } else if (isToday) {
    numDisplay = `
      <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold text-xs sm:text-sm shadow-2xs font-mono tabular-nums mx-auto sm:mx-0">
        ${dayNum}
      </div>
    `;
  }

  // Mobile Indicator Dots (iPhone Calendar Style)
  const dots = [];
  if (dayEvents.some(e => e.source_type === 'meeting')) dots.push('bg-blue-500');
  if (dayEvents.some(e => e.source_type === 'chapter')) dots.push('bg-purple-500');
  if (dayEvents.some(e => e.source_type === 'member' || e.category === 'メンバーイベント')) dots.push('bg-orange-500');
  if (dayEvents.some(e => e.source_type === 'training')) dots.push('bg-emerald-500');
  if (dayEvents.some(e => e.source_type === 'action')) dots.push('bg-amber-500');
  if (dayEvents.some(e => e.category === '締切' || e.category === '締切・期限')) dots.push('bg-rose-500');

  const mobileDotsHtml = dots.length > 0 ? `
    <div class="flex sm:hidden justify-center items-center gap-0.5 mt-1">
      ${dots.slice(0, 5).map(color => `<span class="w-1.5 h-1.5 rounded-full ${color}"></span>`).join('')}
    </div>
  ` : '<div class="h-2.5 sm:hidden"></div>';

  // Desktop Event Pills (up to 3 visible, rest collapsed)
  const maxPills = 3;
  const visibleEvents = dayEvents.slice(0, maxPills);
  const extraCount = dayEvents.length - maxPills;

  const desktopPillsHtml = visibleEvents.map(ev => {
    const timeStr = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
    const isDeadline = (ev.category === '締切・期限' || ev.category === '締切' || (ev.title || '').includes('締切'));
    const isMember = (ev.source_type === 'member' || ev.category === 'メンバーイベント');
    let pillStyle = '';

    if (ev.source_type === 'meeting') {
      pillStyle = 'bg-blue-50/90 text-blue-950 border-l-[3px] border-blue-600 hover:bg-blue-100';
    } else if (ev.source_type === 'action') {
      if (ev.is_completed) {
        pillStyle = 'bg-slate-100/90 text-slate-400 line-through border-l-[3px] border-slate-300 hover:bg-slate-200';
      } else {
        pillStyle = 'bg-amber-50/90 text-amber-950 border-l-[3px] border-amber-500 hover:bg-amber-100';
      }
    } else if (isDeadline) {
      pillStyle = 'bg-rose-50/90 text-rose-950 border-l-[3px] border-rose-500 hover:bg-rose-100';
    } else if (isMember) {
      pillStyle = 'bg-orange-50/90 text-orange-950 border-l-[3px] border-orange-500 hover:bg-orange-100';
    } else if (ev.source_type === 'chapter') {
      pillStyle = 'bg-purple-50/90 text-purple-950 border-l-[3px] border-purple-600 hover:bg-purple-100';
    } else {
      pillStyle = 'bg-emerald-50/90 text-emerald-950 border-l-[3px] border-emerald-600 hover:bg-emerald-100';
    }

    let actionIcon = '';
    if (ev.source_type === 'action') {
      actionIcon = ev.is_completed
        ? `<i class="fa-solid fa-check text-slate-400 text-3xs shrink-0"></i>`
        : `<i class="fa-regular fa-clock text-amber-500 text-3xs shrink-0"></i>`;
    } else if (isDeadline) {
      actionIcon = `<i class="fa-solid fa-flag text-rose-500 text-3xs shrink-0"></i>`;
    }

    const flyerIcon = ev.flyer_url
      ? `<i class="fa-solid fa-image text-orange-500 text-3xs shrink-0" title="チラシあり"></i>`
      : '';

    const visitorTag = (ev.visitor_count !== undefined && ev.visitor_count > 0)
      ? `<span class="text-blue-600 font-bold text-3xs shrink-0 flex items-center gap-0.5"><i class="fa-solid fa-users text-3xs"></i>${ev.visitor_count}</span>`
      : '';

    const formatIcon = (!ev.is_online && ev.source_type === 'meeting')
      ? `<i class="fa-solid fa-location-dot text-emerald-600 text-3xs shrink-0" title="対面"></i>`
      : (ev.is_online ? `<i class="fa-solid fa-video text-blue-500 text-3xs shrink-0" title="Zoom"></i>` : '');

    return `
      <div onclick="handleCalendarEventClick('${ev.id}', event)" class="group/pill flex items-center gap-1 px-1.5 py-0.5 rounded-md text-xs font-semibold ${pillStyle} transition-all cursor-pointer truncate shadow-2xs hover:shadow-xs active:scale-[0.99]" title="${escapeHtml(ev.title)}">
        <span class="font-mono font-bold tabular-nums text-xs shrink-0 text-slate-800">${timeStr}</span>
        ${actionIcon}
        ${flyerIcon}
        ${formatIcon}
        ${visitorTag}
        <span class="truncate font-semibold text-xs text-slate-900">${escapeHtml(ev.title)}</span>
      </div>
    `;
  }).join('');

  const extraBadge = extraCount > 0 ? `
    <div onclick="openDayEventsModal('${dateKey}')" class="text-3xs font-extrabold text-slate-500 hover:text-blue-600 cursor-pointer pt-0.5 pl-1.5">
      + 他 ${extraCount} 件
    </div>
  ` : '';

  return `
    <div class="calendar-cell min-h-[48px] sm:min-h-[125px] p-1 sm:p-2 flex flex-col justify-between ${bgClass} transition-colors hover:bg-slate-50/80 group cursor-pointer relative" onclick="onCalendarCellClick('${dateKey}', event)">
      <div>
        <!-- Top bar: Date Num & Action -->
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-1.5 w-full sm:w-auto justify-center sm:justify-start">
            ${numDisplay}
            ${isThursday && isCurrentMonth ? '<span class="text-3xs font-extrabold text-blue-600 hidden sm:inline">定例会</span>' : ''}
          </div>
          <button type="button" onclick="openChapterEventModalOnDate('${dateKey}', event)" class="w-5 h-5 rounded-full hover:bg-slate-200 text-slate-400 hover:text-slate-700 opacity-0 group-hover:opacity-100 transition-opacity hidden sm:flex items-center justify-center text-3xs cursor-pointer" title="この日に予定を追加">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <!-- Mobile Dot Indicators (iPhone Style) -->
        ${mobileDotsHtml}

        <!-- Desktop Event Pills (Hidden on Mobile) -->
        <div class="hidden sm:block space-y-1 mt-1">
          ${desktopPillsHtml}
          ${extraBadge}
        </div>
      </div>
    </div>
  `;
}

/**
 * Render iPhone Style Inline Day Agenda List directly below the calendar grid
 */
function renderCalendarDayAgenda() {
  const agendaEl = document.getElementById('calendar-selected-day-agenda');
  if (!agendaEl) return;

  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  const todayStr = new Date().toISOString().substring(0, 10);
  const targetDate = selectedCalendarDate || todayStr;

  const d = new Date(targetDate.replace(/-/g, '/'));
  const dayName = dayNames[d.getDay()];
  const formattedDate = `${d.getFullYear()}年 ${d.getMonth() + 1}月 ${d.getDate()}日 (${dayName})`;
  const isToday = targetDate === todayStr;

  const dayEvents = allCalendarEvents.filter(e => e.start_datetime && e.start_datetime.startsWith(targetDate));

  // Sort events by time
  dayEvents.sort((a, b) => {
    const timeA = a.start_datetime || '';
    const timeB = b.start_datetime || '';
    return timeA.localeCompare(timeB);
  });

  let eventsListHtml = '';
  if (dayEvents.length === 0) {
    eventsListHtml = `
      <div class="py-8 text-center bg-white rounded-xl border border-slate-200/80 p-6 shadow-2xs">
        <i class="fa-regular fa-calendar-xmark text-3xl mb-2 text-slate-300"></i>
        <div class="text-sm font-bold text-slate-700 mb-1">この日の予定はありません</div>
        <div class="text-xs text-slate-400 max-w-xs mx-auto mb-3">チャプターのミーティングや面談予定を登録できます。</div>
        <button type="button" onclick="openChapterEventModalOnDate('${targetDate}', event)" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-blue-600 bg-blue-50 border border-blue-200 hover:bg-blue-100 transition-colors inline-flex items-center gap-1 cursor-pointer shadow-2xs active:scale-95">
          <i class="fa-solid fa-plus text-3xs"></i> 予定を追加する
        </button>
      </div>
    `;
  } else {
    eventsListHtml = `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        ${dayEvents.map(ev => {
          const timeStr = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
          const endTimeStr = ev.end_datetime ? ` ～ ${ev.end_datetime.substring(11, 16)}` : '';
          const isDeadline = (ev.category === '締切・期限' || ev.category === '締切' || (ev.title || '').includes('締切'));

          let borderBar = 'border-l-blue-600';
          if (ev.source_type === 'action') {
            borderBar = ev.is_completed ? 'border-l-slate-300' : 'border-l-amber-500';
          } else if (isDeadline) {
            borderBar = 'border-l-rose-500';
          } else if (ev.source_type === 'member' || ev.category === 'メンバーイベント') {
            borderBar = 'border-l-orange-500';
          } else if (ev.source_type === 'chapter') {
            borderBar = 'border-l-purple-600';
          } else if (ev.source_type === 'training') {
            borderBar = 'border-l-emerald-600';
          }

          let actionIcon = '';
          if (ev.source_type === 'action') {
            actionIcon = ev.is_completed
              ? `<i class="fa-solid fa-check text-slate-400 text-xs shrink-0" title="完了"></i>`
              : `<i class="fa-regular fa-clock text-amber-500 text-xs shrink-0" title="アクション"></i>`;
          } else if (isDeadline) {
            actionIcon = `<i class="fa-solid fa-flag text-rose-500 text-xs shrink-0" title="締切"></i>`;
          }

          const formatIcon = ev.source_type === 'action' || isDeadline ? '' : (ev.is_online
            ? `<i class="fa-solid fa-video text-blue-500 text-xs shrink-0" title="Zoom"></i>`
            : `<i class="fa-solid fa-location-dot text-emerald-500 text-xs shrink-0" title="対面"></i>`);

          const visitorTag = (ev.visitor_count !== undefined && ev.visitor_count > 0)
            ? `<span class="inline-flex items-center gap-0.5 text-blue-600 font-bold text-3xs shrink-0" title="ビジター ${ev.visitor_count}名"><i class="fa-solid fa-users text-3xs"></i>${ev.visitor_count}</span>`
            : '';

          const flyerThumbnail = ev.flyer_url
            ? `<div class="shrink-0 self-center" onclick="event.stopPropagation(); openFlyerLightbox('${escapeHtml(ev.flyer_url)}', '${escapeHtml(ev.title)}');" title="クリックしてチラシを拡大表示">
                <img src="${escapeHtml(ev.flyer_url)}" alt="チラシ" class="w-12 h-12 object-cover rounded-lg border border-slate-200 shadow-2xs hover:opacity-85 hover:ring-2 hover:ring-blue-400 transition-all cursor-pointer">
              </div>`
            : '';

          return `
            <div onclick="handleCalendarEventClick('${ev.id}', event)" class="p-3.5 rounded-xl border border-slate-200 bg-white border-l-[4px] ${borderBar} shadow-2xs hover:shadow-xs hover:border-slate-300 transition-all cursor-pointer flex items-center justify-between gap-3 group active:scale-[0.99]">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap mb-1.5">
                  <span class="font-mono font-bold text-xs text-slate-800 tabular-nums flex items-center gap-1">
                    <i class="fa-regular fa-clock text-slate-400 text-3xs"></i>
                    ${timeStr}${endTimeStr}
                  </span>
                  ${actionIcon}
                  ${formatIcon}
                  ${visitorTag}
                </div>
                <div class="font-bold text-sm text-slate-900 group-hover:text-blue-600 transition-colors leading-snug">
                  ${escapeHtml(ev.title)}

                ${ev.organizer ? `
                  <div class="text-xs text-slate-500 truncate mt-1 flex items-center gap-1">
                    <i class="fa-solid fa-user-check text-slate-400 text-3xs shrink-0"></i>
                    <span class="truncate">担当: ${escapeHtml(ev.organizer)}</span>
                  </div>
                ` : ''}
                ${ev.location_name ? `
                  <div class="text-xs text-slate-500 truncate mt-0.5 flex items-center gap-1">
                    <i class="fa-solid fa-location-dot text-slate-400 text-3xs shrink-0"></i>
                    <span class="truncate">${escapeHtml(ev.location_name)}</span>

                ` : ''}
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                ${flyerThumbnail}
                ${ev.source_type === 'chapter' ? `
                  <button type="button" onclick="confirmDeleteChapterEventDirect('${ev.id}', event)" class="w-7 h-7 rounded-full bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-600 border border-transparent hover:border-red-200 flex items-center justify-center transition-colors cursor-pointer shrink-0" title="このチャプター予定を削除">
                    <i class="fa-regular fa-trash-can text-xs"></i>
                  </button>
                ` : ''}
                <div class="w-7 h-7 rounded-full bg-slate-50 text-slate-400 group-hover:bg-blue-50 group-hover:text-blue-600 flex items-center justify-center transition-colors shrink-0">
                  <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  agendaEl.innerHTML = `
    <!-- iPhone Calendar Style Header -->
    <div class="flex items-center justify-between gap-2 mb-3 pb-2 border-b border-slate-200">
      <div class="flex items-center gap-2">
        <h4 class="text-sm sm:text-base font-black text-slate-900 tracking-tight">${formattedDate}</h4>
        ${isToday ? '<span class="px-2 py-0.5 rounded-full text-3xs font-extrabold bg-rose-500 text-white shadow-2xs">今日</span>' : ''}
        <span class="text-xs text-slate-400 font-bold">${dayEvents.length}件の予定</span>
      </div>
      <button type="button" onclick="openChapterEventModalOnDate('${targetDate}', event)" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-bold text-blue-600 bg-white border border-slate-200 hover:bg-blue-50 hover:border-blue-300 shadow-2xs transition-all cursor-pointer active:scale-95">
        <i class="fa-solid fa-plus text-3xs"></i>
        <span>予定を追加</span>
      </button>
    </div>

    <!-- Events List -->
    ${eventsListHtml}
  `;
}

/**
 * Cell click -> Select date in iPhone style & refresh inline agenda
 */
function onCalendarCellClick(dateKey, evt) {
  // If target was a button or pill link, don't trigger general cell click
  if (evt && (evt.target.closest('.group\\/pill') || evt.target.closest('button'))) return;

  selectedCalendarDate = dateKey;
  renderCalendarGrid();
}

/**
 * Handle individual event pill click
 */
function handleCalendarEventClick(eventId, evt) {
  if (evt) evt.stopPropagation();
  const ev = allCalendarEvents.find(e => e.id == eventId);
  if (!ev) return;

  if (ev.source_type === 'action') {
    openActionDetailModal(ev);
    return;
  }
  if (ev.source_type === 'meeting') {
    openMeetingDetailModal(ev);
  } else if (ev.source_type === 'chapter' || ev.source_type === 'member' || ev.source_type === 'deadline') {
    // Open info detail view instead of form
    openChapterEventDetailModal(ev);
  } else {
    openTrainingDetailModal(ev.id);
  }
}

/**
 * Chapter Event Detail Modal (Info View)
 */
let currentViewingChapterEvent = null;

function openChapterEventDetailModal(ev) {
  if (!ev) return;
  currentViewingChapterEvent = ev;

  const modal = document.getElementById('modal-chapter-event-detail');
  if (!modal) {
    openChapterEventModal(ev);
    return;
  }

  const idEl = document.getElementById('ch-detail-id');
  if (idEl) idEl.value = ev.id || '';

  const titleEl = document.getElementById('ch-detail-title');
  if (titleEl) titleEl.innerText = ev.title || 'イベント';

  const catTextEl = document.getElementById('ch-detail-category-text');
  const catDotEl = document.getElementById('ch-detail-category-dot');
  const catBadgeEl = document.getElementById('ch-detail-category-badge');
  const formatBadgeEl = document.getElementById('ch-detail-format-badge');
  const formatIconEl = document.getElementById('ch-detail-format-icon');

  const isMember = ev.source_type === 'member' || ev.category === 'メンバーイベント';
  const isDeadline = ev.source_type === 'deadline' || ev.category === '締切・期限' || ev.category === '締切' || (ev.title || '').includes('締切');

  let catLabel = ev.category || 'チャプター予定';
  let dotColor = 'bg-purple-500';
  let badgeStyle = 'bg-purple-50 text-purple-700 border-purple-200';

  if (isMember) {
    catLabel = ev.category || 'メンバーイベント';
    dotColor = 'bg-orange-500';
    badgeStyle = 'bg-orange-50 text-orange-700 border-orange-200';
  } else if (isDeadline) {
    catLabel = ev.category || '締切';
    dotColor = 'bg-rose-500';
    badgeStyle = 'bg-rose-50 text-rose-700 border-rose-200';
  }

  if (catTextEl) catTextEl.innerText = catLabel;
  if (catDotEl) catDotEl.className = `w-1.5 h-1.5 rounded-full ${dotColor}`;
  if (catBadgeEl) catBadgeEl.className = `px-2 py-0.5 rounded-full text-3xs font-extrabold border flex items-center gap-1 ${badgeStyle}`;

  if (formatBadgeEl) {
    if (ev.is_online) {
      formatBadgeEl.innerHTML = `<i class="fa-solid fa-video text-blue-500"></i><span class="text-blue-600 font-bold">Zoom</span>`;
    } else {
      formatBadgeEl.innerHTML = `<i class="fa-solid fa-location-dot text-emerald-500"></i><span class="text-emerald-700 font-bold">対面</span>`;
    }
  }
  if (formatIconEl) {
    formatIconEl.innerHTML = ev.is_online
      ? `<i class="fa-solid fa-video text-blue-500 text-lg"></i>`
      : `<i class="fa-solid fa-location-dot text-emerald-500 text-lg"></i>`;
  }

  const dtEl = document.getElementById('ch-detail-datetime');
  if (dtEl) {
    let dtStr = '';
    if (ev.start_datetime) {
      const datePart = ev.start_datetime.substring(0, 10);
      const timePart = ev.start_datetime.substring(11, 16);
      const endTimePart = ev.end_datetime ? ` ～ ${ev.end_datetime.substring(11, 16)}` : '';
      const d = new Date(datePart.replace(/-/g, '/'));
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      dtStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 (${dayNames[d.getDay()]}) ${timePart}${endTimePart}`;
    }
    dtEl.innerText = dtStr || '--';
  }

  const locWrap = document.getElementById('ch-detail-location-wrap');
  const locEl = document.getElementById('ch-detail-location');
  const urlWrap = document.getElementById('ch-detail-url-wrap');
  const urlEl = document.getElementById('ch-detail-url');

  if (ev.location_name) {
    if (locEl) locEl.innerText = ev.location_name;
    if (locWrap) locWrap.classList.remove('hidden');
  } else {
    if (locEl) locEl.innerText = ev.is_online ? 'Zoom オンライン' : '未定 / 会場指定なし';
    if (locWrap) locWrap.classList.remove('hidden');
  }

  if (ev.location_url) {
    if (urlEl) urlEl.href = ev.location_url;
    if (urlWrap) urlWrap.classList.remove('hidden');
  } else {
    if (urlWrap) urlWrap.classList.add('hidden');
  }

  const orgWrap = document.getElementById('ch-detail-organizer-wrap');
  const orgEl = document.getElementById('ch-detail-organizer');
  if (ev.organizer) {
    if (orgEl) orgEl.innerText = ev.organizer;
    if (orgWrap) orgWrap.classList.remove('hidden');
  } else {
    if (orgWrap) orgWrap.classList.add('hidden');
  }

  // Participants / Target Members
  const partWrap = document.getElementById('ch-detail-participants-wrap');
  const partCountEl = document.getElementById('ch-detail-participants-count');
  const partListEl = document.getElementById('ch-detail-participants-list');
  const participants = parseParticipantsList(ev.participants);

  if (partWrap && partListEl) {
    if (participants.length > 0) {
      if (partCountEl) partCountEl.innerText = `${participants.length}名`;
      const allMembers = getActiveChapterMembers();
      const memberMap = new Map();
      allMembers.forEach(m => memberMap.set(m.name, m));

      partListEl.innerHTML = participants.map(name => {
        const m = memberMap.get(name);
        const roleBadge = m && m.role
          ? `<span class="px-1.5 py-0.2 rounded text-[9px] font-bold bg-slate-100 text-slate-600 border border-slate-200/80">${escapeHtml(m.role)}</span>`
          : '';
        return `
          <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-white border border-slate-200/80 text-xs font-bold text-slate-800 shadow-2xs">
            <i class="fa-regular fa-user text-blue-500 text-3xs"></i>
            <span>${escapeHtml(name)}</span>
            ${roleBadge}
          </div>
        `;
      }).join('');
      partWrap.classList.remove('hidden');
    } else {
      if (partCountEl) partCountEl.innerText = '全員 / 指定なし';
      partListEl.innerHTML = `<span class="text-3xs text-slate-400 italic">全メンバー対象（個別参加者の指定なし）</span>`;
      partWrap.classList.remove('hidden');
    }
  }

  const flyerWrap = document.getElementById('ch-detail-flyer-wrap');
  const flyerImg = document.getElementById('ch-detail-flyer-img');
  const flyerName = document.getElementById('ch-detail-flyer-name');
  const flyerLink = document.getElementById('ch-detail-flyer-link');

  if (ev.flyer_url) {
    if (flyerImg) flyerImg.src = ev.flyer_url;
    if (flyerName) flyerName.innerText = `${ev.title || 'イベント'}のチラシ`;
    if (flyerLink) flyerLink.href = ev.flyer_url;
    if (flyerWrap) flyerWrap.classList.remove('hidden');
  } else {
    if (flyerWrap) flyerWrap.classList.add('hidden');
  }

let eventSelectedParticipants = [];

/**
 * BNI REvo メンバー役職マッピング定義
 * 役職文字列から所属グループのキーリストを返す
 */
function getMemberRoleKeys(roleStr = '') {
  if (!roleStr) return [];
  const r = roleStr.toLowerCase();
  const keys = [];
  // 3役 (プレジデント、バイスプレジデント、書記/会計)
  if (r.includes('プレジデント') || r.includes('書記') || r.includes('会計') || r.includes('３役') || r.includes('三役')) {
    keys.push('3yaku');
  }
  // 4役・5役 (3役に加えエデュケーションコーディネーター、メンターコーディネーター)
  if (keys.includes('3yaku') || r.includes('エデュケーション') || r.includes('メンター') || r.includes('４役') || r.includes('四役') || r.includes('５役') || r.includes('五役')) {
    keys.push('45yaku');
  }
  // ビジターホスト
  if (r.includes('ビジターホスト') || r.includes('ホスト')) {
    keys.push('vh');
  }
  // メンバーシップ
  if (r.includes('メンバーシップ')) {
    keys.push('ms');
  }
  // イベント委員
  if (r.includes('イベント')) {
    keys.push('event');
  }
  // BOD
  if (r.includes('bod')) {
    keys.push('bod');
  }
  // 1to1
  if (r.includes('1to1')) {
    keys.push('1to1');
  }
  return keys;
}

/**
 * チャプター在籍メンバー一覧（退会除外）の取得
 */
function getActiveChapterMembers() {
  if (window.cachedMembersList && Array.isArray(window.cachedMembersList) && window.cachedMembersList.length > 0) {
    return window.cachedMembersList.filter(m => (m.status || '在籍') !== '退会');
  }
  // Config.js REVO_MEMBERS から抽出
  if (typeof REVO_MEMBERS !== 'undefined' && Array.isArray(REVO_MEMBERS)) {
    const list = [];
    REVO_MEMBERS.forEach(cat => {
      if (cat.members && Array.isArray(cat.members)) {
        cat.members.forEach(m => {
          list.push({
            name: m.name,
            role: m.role || '',
            profession: m.profession || '',
            category: cat.category || '',
            status: '在籍'
          });
        });
      }
    });
    return list;
  }
  return [];
}

/**
 * 役職キーごとのメンバー一覧を取得
 */
function getMembersByRoleKey(roleKey) {
  const allMembers = getActiveChapterMembers();
  if (roleKey === 'all') {
    return allMembers;
  }
  return allMembers.filter(m => {
    const keys = getMemberRoleKeys(m.role || '');
    return keys.includes(roleKey);
  });
}

/**
 * カンマ区切りまたは配列から参加者リストを正規化
 */
function parseParticipantsList(val) {
  if (!val) return [];
  if (Array.isArray(val)) return val.map(s => String(s).trim()).filter(Boolean);
  if (typeof val === 'string') {
    try {
      const parsed = JSON.parse(val);
      if (Array.isArray(parsed)) return parsed.map(s => String(s).trim()).filter(Boolean);
    } catch(e) {}
    return val.split(',').map(s => s.trim()).filter(Boolean);
  }
  return [];
}

function renderEventParticipantsChips() {
  const container = document.getElementById('ch-ev-participants-chips');
  const countEl = document.getElementById('ch-ev-participants-count');
  const hiddenInput = document.getElementById('ch-ev-participants');
  if (!container) return;

  }).join('');

function renderEventMemberPalette(filterText = '') {
  const grid = document.getElementById('ch-ev-member-grid');
  if (!grid) return;

  const allMembers = getActiveChapterMembers();
  const q = (filterText || '').toLowerCase().trim();

  const filtered = allMembers.filter(m => {
    if (!q) return true;
    return (m.name || '').toLowerCase().includes(q) ||
           (m.role || '').toLowerCase().includes(q) ||
           (m.profession || '').toLowerCase().includes(q);
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="col-span-full py-2 text-center text-3xs text-slate-400">該当するメンバーが見つかりません</div>`;
    return;
  }

  grid.innerHTML = filtered.map(m => {
    const isSelected = eventSelectedParticipants.includes(m.name);
    const activeClass = isSelected
      ? 'bg-blue-600 text-white border-blue-600 shadow-2xs'
      : 'bg-white text-slate-700 border-slate-200 hover:border-blue-300 hover:bg-blue-50/30';
    const checkIcon = isSelected ? '<i class="fa-solid fa-check text-[10px] mr-1"></i>' : '';
    const roleSub = m.role ? `<div class="text-[9px] truncate opacity-75">${escapeHtml(m.role)}</div>` : '';

    return `
      <button type="button" onclick="toggleEventParticipantMember('${escapeHtml(m.name)}')" class="px-2 py-1.5 rounded-lg border text-left transition-all cursor-pointer flex flex-col justify-center min-w-0 ${activeClass}">

          ${checkIcon}<span>${escapeHtml(m.name)}</span>
        </div>
        ${roleSub}
      </button>
    `;
  }).join('');
}

function toggleEventParticipantMember(name) {
  if (!name) return;
  const idx = eventSelectedParticipants.indexOf(name);
  if (idx >= 0) {
    eventSelectedParticipants.splice(idx, 1);
  } else {
    eventSelectedParticipants.push(name);
  }
  renderEventParticipantsChips();
  renderEventMemberPalette(document.getElementById('ch-ev-member-search')?.value || '');
}

function toggleRoleParticipants(roleKey) {
  const targetMembers = getMembersByRoleKey(roleKey);
  if (!targetMembers || targetMembers.length === 0) {
    showToast('該当する役職のメンバーが見つかりません', 'info');
    return;
  }
  const targetNames = targetMembers.map(m => m.name);
  const allIncluded = targetNames.every(name => eventSelectedParticipants.includes(name));

  if (allIncluded) {
    eventSelectedParticipants = eventSelectedParticipants.filter(name => !targetNames.includes(name));
  } else {
    targetNames.forEach(name => {
      if (!eventSelectedParticipants.includes(name)) {
        eventSelectedParticipants.push(name);
      }
    });
  }

  renderEventParticipantsChips();
  renderEventMemberPalette(document.getElementById('ch-ev-member-search')?.value || '');
}

function addCustomEventParticipant() {
  const input = document.getElementById('ch-ev-custom-participant');
  if (!input) return;
  const name = input.value.trim();
  if (!name) return;

  if (!eventSelectedParticipants.includes(name)) {
    eventSelectedParticipants.push(name);
    renderEventParticipantsChips();
    renderEventMemberPalette(document.getElementById('ch-ev-member-search')?.value || '');
  }
  input.value = '';
}

  eventSelectedParticipants = eventSelectedParticipants.filter(n => n !== name);

/**
 * Chapter Event Modal Management
 */
function openChapterEventModal(eventObj = null) {
  currentEditingChapterEvent = eventObj;
  const modal = document.getElementById('modal-chapter-event');
  const form = document.getElementById('form-chapter-event');
  const titleHeader = document.getElementById('modal-chapter-event-title');
  const btnDelete = document.getElementById('btn-delete-chapter-event');
  const btnDeleteSeries = document.getElementById('btn-delete-chapter-series');
  const btnShare = document.getElementById('btn-share-chapter-event');
  const repeatSection = document.getElementById('ch-ev-repeat-section');
  if (!modal || !form) return;

  form.reset();
  resetFlyerState();
  populateMemberNamesDatalist();

  const todayStr = new Date().toISOString().substring(0, 10);
  const next3Months = new Date(Date.now() + 90 * 86400000).toISOString().substring(0, 10);

  if (eventObj) {
    const isMember = eventObj.category === 'メンバーイベント' || eventObj.source_type === 'member';
    titleHeader.innerText = isMember ? 'メンバーイベントを編集' : '予定・イベントを編集';
    document.getElementById('modal-add-type-tabs')?.classList.add('hidden');
    switchAddEventModalTab('event');

    document.getElementById('ch-ev-title').value = eventObj.title || '';
    document.getElementById('ch-ev-category').value = eventObj.category || (isMember ? 'メンバーイベント' : 'チャプターイベント');

    document.getElementById('ch-ev-is-online').value = eventObj.is_online ? '1' : '0';

      document.getElementById('ch-ev-date').value = eventObj.start_datetime.substring(0, 10);

    }
    if (eventObj.end_datetime) {

    document.getElementById('ch-ev-url').value = eventObj.location_url || '';
    document.getElementById('ch-ev-organizer').value = eventObj.organizer || '';
    document.getElementById('ch-ev-desc').value = eventObj.description || '';

    initChapterEventParticipants(eventObj.participants || '');

    // Flyer attachment if exists
    if (eventObj.flyer_url) {
      setFlyerPreview(eventObj.flyer_url, `${eventObj.title || 'イベント'}のチラシ`);
    } else {
      resetFlyerState();
    }

    // Repeat section hidden on single edit
    if (repeatSection) repeatSection.classList.add('hidden');

    if (btnShare) btnShare.classList.remove('hidden');
    if (btnDelete) btnDelete.classList.remove('hidden');
