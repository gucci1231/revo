<script>
/**
 * CelebrationEffect - High-Impact Game-Clear Gap Celebration Engine
 * 普段の超シンプルUI ⇆ 完了時だけアーケード/RPG全開の超ド派手演出
 * - ユーザーが自分でタップして閉じるまで永続表示
 * - 閉じた瞬間に画面の最新データリロード（ステータス反映）を確実に実行
 */
window.CelebrationEffect = (function() {
  let audioCtx = null;

  // Web Audio による本格的で重厚な勝利ファンファーレ (ブラス＆クリスタル調)
  function playClearChime() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      // ファンファーレノート進行 (重厚なメジャーアルペジオ & 和音)
      const chordEvents = [
        // 1. 低音アタック + C4
        { freqs: [130.81, 261.63], time: 0.00, dur: 0.25, gain: 0.22, type: 'triangle' },
        // 2. E4 + G4
        { freqs: [329.63, 392.00], time: 0.09, dur: 0.25, gain: 0.24, type: 'triangle' },
        // 3. C5 + E5
        { freqs: [523.25, 659.25], time: 0.18, dur: 0.30, gain: 0.26, type: 'triangle' },
        // 4. クライマックスの重厚なハイコード (G5 + C6 + E6)
        { freqs: [783.99, 1046.50, 1318.51], time: 0.28, dur: 1.1, gain: 0.30, type: 'triangle' },
        // 煌びやかなベル倍音
        { freqs: [2093.00], time: 0.28, dur: 0.9, gain: 0.12, type: 'sine' }
      ];

      chordEvents.forEach(evt => {
        evt.freqs.forEach(freq => {
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();

          osc.type = evt.type;
          osc.frequency.setValueAtTime(freq, now + evt.time);

          gainNode.gain.setValueAtTime(0.0001, now + evt.time);
          gainNode.gain.exponentialRampToValueAtTime(evt.gain, now + evt.time + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, now + evt.time + evt.dur);

          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          osc.start(now + evt.time);
          osc.stop(now + evt.time + evt.dur + 0.05);
        });
      });
    } catch (e) {
      console.warn('Web Audio playback error (skipped):', e);
    }
  }

  // 画面シェイク (インパクト感の演出)
  function triggerScreenShake() {
    const styleId = 'revo-screen-shake-style';
    if (!document.getElementById(styleId)) {
      const style = document.createElement('style');
      style.id = styleId;
      style.innerHTML = `
        @keyframes revoScreenShake {
          0% { transform: translate(0, 0) scale(1); }
          15% { transform: translate(-3px, 4px) scale(1.003); }
          30% { transform: translate(4px, -3px) scale(0.998); }
          45% { transform: translate(-3px, -2px) scale(1.002); }
          60% { transform: translate(2px, 2px) scale(1); }
          80% { transform: translate(-1px, 1px) scale(1); }
          100% { transform: translate(0, 0) scale(1); }
        }
        .revo-screen-shaking {
          animation: revoScreenShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important;
        }
        @keyframes revoSunburstSpin {
          0% { transform: translate(-50%, -50%) rotate(0deg); }
          100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes revoShockwaveRing {
          0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; border-width: 8px; }
          100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; border-width: 1px; }
        }
        @keyframes revoEmblemBounce {
          0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
          50% { transform: scale(1.2) rotate(4deg); opacity: 1; }
          75% { transform: scale(0.95) rotate(-2deg); }
          100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
      `;
      document.head.appendChild(style);
    }

    const appContainer = document.getElementById('app-main-layout') || document.body;
    appContainer.classList.remove('revo-screen-shaking');
    void appContainer.offsetWidth; // reflow
    appContainer.classList.add('revo-screen-shaking');
    setTimeout(() => {
      appContainer.classList.remove('revo-screen-shaking');
    }, 500);
  }

  // 大量の花火・金吹雪・スターパーティクル (Canvas - 永続ループ対応)
  function runHeavyParticles(canvas) {
    const ctx = canvas.getContext('2d');
    const width = (canvas.width = window.innerWidth);
    const height = (canvas.height = window.innerHeight);

    const particles = [];
    const colors = [
      '#FFD700', // Bright Gold
      '#F59E0B', // Amber
      '#FBBF24', // Yellow Gold
      '#10B981', // Emerald Neon
      '#06B6D4', // Cyan Neon
      '#EC4899', // Hot Pink
      '#8B5CF6', // Purple
      '#FFFFFF'  // Pure Diamond
    ];

    const originX = width / 2;
    const originY = height / 2 - 20;

    // 1. 初期の爆発スパーク (80個)
    for (let i = 0; i < 80; i++) {
      const angle = (Math.PI * 2 * i) / 80 + (Math.random() - 0.5) * 0.4;
      const speed = Math.random() * 14 + 6;
      particles.push({
        type: 'burst',
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed * (Math.random() * 0.8 + 0.5),
        vy: Math.sin(angle) * speed * (Math.random() * 0.8 + 0.5) - 3.5,
        size: Math.random() * 6 + 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        shape: Math.random() > 0.35 ? 'star' : 'diamond',
        alpha: 1,
        decay: Math.random() * 0.012 + 0.008,
        gravity: 0.22,
        friction: 0.95
      });
    }

    // 2. 金吹雪リボン生成ヘルパー
    function createConfetti() {
      return {
        type: 'confetti',
        x: Math.random() * width,
        y: -20,
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 2 + 1.8,
        width: Math.random() * 7 + 5,
        height: Math.random() * 12 + 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.12,
        alpha: Math.random() * 0.4 + 0.6,
        decay: 0, // 画面外に出るまで生き続ける
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: Math.random() * 0.08 + 0.04
      };
    }

    // 初期金吹雪
    for (let i = 0; i < 45; i++) {
      const c = createConfetti();
      c.y = Math.random() * height; // 画面全体に散らす
      particles.push(c);
    }

    let isRunning = true;
    let animId = null;

    function render() {
      if (!isRunning) return;
      ctx.clearRect(0, 0, width, height);

      // 定期的に新しい紙吹雪を上部から追加して永続的に舞わせる
      if (particles.filter(p => p.type === 'confetti').length < 45) {
        particles.push(createConfetti());
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        if (p.type === 'burst') {
          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= p.friction;
          p.vy = p.vy * p.friction + p.gravity;
          p.rotation += p.vRot;
          p.alpha -= p.decay;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;

          if (p.shape === 'star') {
            const r = p.size;
            ctx.beginPath();
            ctx.moveTo(0, -r * 1.6);
            ctx.quadraticCurveTo(0, 0, r * 1.6, 0);
            ctx.quadraticCurveTo(0, 0, 0, r * 1.6);
            ctx.quadraticCurveTo(0, 0, -r * 1.6, 0);
            ctx.quadraticCurveTo(0, 0, 0, -r * 1.6);
            ctx.fill();
          } else {
            const r = p.size;
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(r * 1.2, 0);
            ctx.lineTo(0, r);
            ctx.lineTo(-r * 1.2, 0);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        } else if (p.type === 'confetti') {
          p.wobble += p.wobbleSpeed;
          p.x += p.vx + Math.sin(p.wobble) * 1.2;
          p.y += p.vy;
          p.rotation += p.vRot;

          // 画面下に消えたらリサイクル
          if (p.y > height + 20) {
            p.y = -20;
            p.x = Math.random() * width;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.scale(Math.cos(p.wobble), 1);
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.width / 2, -p.height / 2, p.width, p.height);
          ctx.restore();
        }
      }

      animId = requestAnimationFrame(render);
    }

    render();

    return () => {
      isRunning = false;
      if (animId) cancelAnimationFrame(animId);
    };
  }

  /**
   * メイン演出トリガー: ギャップを極大化するド派手ゲームクリアHUD
   * - 自分でタップするまで表示
   * - 閉じた時に画面の最新リロード (onClose / refreshCurrentActiveView) を実行
   */
  function triggerQuestClear(options = {}) {
    const title = options.title || 'QUEST CLEAR !';
    const subtitle = options.subtitle || 'ナイスアクション！目標達成！';
    const detail = options.detail || '';
    const badgeText = options.badgeText || '★ MISSION ACCOMPLISHED ★';
    const onCloseCallback = options.onClose || null;

    // 既存のエフェクトがあれば即座に削除
    const existing = document.getElementById('revo-quest-clear-overlay');
    if (existing) existing.remove();

    // 1. 画面シェイク
    triggerScreenShake();

    // 2. 重厚なファンファーレ
    playClearChime();

    // 3. オーバーレイDOM作成
    const overlay = document.createElement('div');
    overlay.id = 'revo-quest-clear-overlay';
    overlay.className = 'fixed inset-0 z-[99999] flex items-center justify-center pointer-events-auto select-none overflow-hidden cursor-pointer';
    overlay.style.backgroundColor = 'rgba(11, 17, 32, 0.7)';
    overlay.style.backdropFilter = 'blur(8px)';
    overlay.style.webkitBackdropFilter = 'blur(8px)';
    overlay.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    overlay.style.opacity = '0';

    overlay.innerHTML = `
      <!-- 背景: 放射状回転サンバースト光線 -->
      <div class="absolute top-1/2 left-1/2 w-[800px] h-[800px] pointer-events-none opacity-25" style="animation: revoSunburstSpin 25s linear infinite; background: repeating-conic-gradient(from 0deg, rgba(245, 158, 11, 0.4) 0deg 15deg, transparent 15deg 30deg);"></div>

      <!-- 背景: 衝撃波リング -->
      <div class="absolute top-1/2 left-1/2 w-48 h-48 rounded-full border-4 border-amber-300 pointer-events-none" style="animation: revoShockwaveRing 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;"></div>
      <div class="absolute top-1/2 left-1/2 w-48 h-48 rounded-full border-4 border-cyan-400 pointer-events-none" style="animation: revoShockwaveRing 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) 0.15s forwards;"></div>

      <!-- Canvas パーティクルレイヤー -->
      <canvas id="revo-celebration-canvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
      
      <!-- メイン: ゲームクリアHUDカード -->
      <div id="revo-quest-card" class="relative z-10 mx-4 max-w-sm w-full bg-slate-950/95 text-white border-2 border-amber-400/80 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center overflow-hidden" style="box-shadow: 0 0 50px rgba(245, 158, 11, 0.45), 0 0 100px rgba(6, 182, 212, 0.2), inset 0 0 20px rgba(245, 158, 11, 0.15); transform: scale(0.7); opacity: 0; transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;">
        
        <!-- Ambient Top Gold Glow -->
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-64 h-32 bg-gradient-to-b from-amber-400/50 via-yellow-300/30 to-transparent blur-2xl pointer-events-none rounded-full"></div>

        <!-- Top Badge -->
        <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-gradient-to-r from-amber-500/20 via-amber-400/30 to-yellow-500/20 border border-amber-300 text-amber-200 text-[11px] font-black tracking-widest uppercase mb-3.5 shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-crown text-amber-300 text-xs animate-bounce"></i>
          <span>${badgeText}</span>
        </div>

        <!-- 3D Gold Emblem Icon -->
        <div class="relative my-2 flex items-center justify-center">
          <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-yellow-300 via-amber-400 to-amber-600 flex items-center justify-center text-slate-950 text-3xl shadow-xl shadow-amber-500/60 border-2 border-yellow-100 transform" style="animation: revoEmblemBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;">
            <i class="fa-solid fa-trophy text-slate-950 font-black text-4xl drop-shadow-md"></i>
          </div>
          <!-- Sparkles -->
          <i class="fa-solid fa-star absolute -top-2 -right-3 text-yellow-200 text-sm animate-spin" style="animation-duration: 3s; filter: drop-shadow(0 0 6px #fde047);"></i>
          <i class="fa-solid fa-star absolute -bottom-2 -left-3 text-amber-300 text-xs animate-spin" style="animation-duration: 4s; filter: drop-shadow(0 0 6px #f59e0b);"></i>
        </div>

        <!-- Title -->
        <h2 class="mt-4 text-2xl font-black tracking-widest bg-gradient-to-r from-amber-200 via-yellow-100 to-amber-300 bg-clip-text text-transparent drop-shadow-lg font-sans uppercase" style="text-shadow: 0 0 20px rgba(245, 158, 11, 0.6);">
          ${title}
        </h2>

        <!-- Subtitle -->
        <p class="mt-2 text-base font-extrabold text-white drop-shadow leading-snug">
          ${subtitle}
        </p>

        <!-- Detail Snippet -->
        ${detail ? `
          <div class="mt-4 w-full bg-slate-900/90 border border-amber-400/40 rounded-2xl px-4 py-2.5 text-xs text-amber-100 font-bold truncate shadow-inner">
            <span class="text-amber-400 mr-1.5 font-black">✦</span> ${detail}
          </div>
        ` : ''}

        <!-- Interactive Dismiss Button / Hint -->
        <div class="mt-5 w-full">
          <button type="button" class="w-full py-2.5 px-4 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-extrabold text-xs rounded-xl shadow-lg shadow-amber-500/30 flex items-center justify-center gap-2 transition-transform active:scale-95">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> 画面に戻る（完了）
          </button>
          <div class="mt-2 text-[10px] text-slate-400 font-medium">※画面のどこでもタップして閉じられます</div>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    // Canvas パーティクル起動
    const canvas = document.getElementById('revo-celebration-canvas');
    let cleanupParticles = null;
    if (canvas) {
      cleanupParticles = runHeavyParticles(canvas);
    }

    // スムーズイン
    requestAnimationFrame(() => {
      overlay.style.opacity = '1';
      const card = document.getElementById('revo-quest-card');
      if (card) {
        card.style.transform = 'scale(1)';
        card.style.opacity = '1';
      }
    });

    // 破棄処理（クリック時のみ発火 & 画面リロード/リフレッシュ実行）
    let dismissed = false;
    function dismiss() {
      if (dismissed) return;
      dismissed = true;

      overlay.style.opacity = '0';
      const card = document.getElementById('revo-quest-card');
      if (card) {
        card.style.transform = 'scale(0.85) translateY(15px)';
        card.style.opacity = '0';
      }

      setTimeout(() => {
        if (cleanupParticles) cleanupParticles();
        if (overlay && overlay.parentNode) {
          overlay.parentNode.removeChild(overlay);
        }

        // 閉じた瞬間にステータスリロードを実行！
        if (typeof onCloseCallback === 'function') {
          onCloseCallback();
        }
        if (typeof refreshCurrentActiveView === 'function') {
          refreshCurrentActiveView();
        }
      }, 300);
    }

    overlay.onclick = dismiss;
  }

  return {
    triggerQuestClear: triggerQuestClear,
    playClearChime: playClearChime,
    triggerScreenShake: triggerScreenShake
  };
})();
</script>
