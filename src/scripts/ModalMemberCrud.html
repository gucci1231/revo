<script>
  /* --- 👥 Member Master Setting CRUD Controls --- */
  let cachedFlatMembers = [];

  function fetchMembersMasterData(showLoadingOverlay = true) {
    if (showLoadingOverlay) {
      const loadEl = document.getElementById('loading');
      if (loadEl) loadEl.style.display = 'flex';
    }
    return ApiService.call('getMemberListApi')
      .then(res => {
        const loadEl = document.getElementById('loading');
        if (loadEl) loadEl.style.display = 'none';
        if (res && res.success) {
          cachedFlatMembers = res.flatMembers || [];
          renderMembersMasterTable(cachedFlatMembers);
          return cachedFlatMembers;
        }
        return [];
      })
      .catch(err => {
        const loadEl = document.getElementById('loading');
        if (loadEl) loadEl.style.display = 'none';
        handleError(err);
        return [];
      });
  }

  let currentMembersFilter = 'all'; // 'all' | 'active' | 'resigned'

  function filterMembersMasterTable(filter) {
    currentMembersFilter = filter || 'all';
    ['all', 'active', 'resigned'].forEach(f => {
      const btn = document.getElementById(`tab-member-filter-${f}`);
      if (!btn) return;
      if (f === currentMembersFilter) {
        btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-slate-900 shadow-2xs cursor-pointer flex items-center gap-1.5';
      } else {
        btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900 cursor-pointer flex items-center gap-1.5';
      }
    });
    renderMembersMasterTable(cachedFlatMembers);
  }
  window.filterMembersMasterTable = filterMembersMasterTable;

  function renderMembersMasterTable(members) {
    const tbody = document.getElementById('table-members-master');
    if (!tbody) return;
    tbody.innerHTML = '';

    const allMembers = members || [];
    const activeCount = allMembers.filter(m => (m.status || '在籍') !== '退会').length;
    const resignedCount = allMembers.filter(m => (m.status || '在籍') === '退会').length;

    const countAllEl = document.getElementById('count-members-all');
    const countActiveEl = document.getElementById('count-members-active');
    const countResignedEl = document.getElementById('count-members-resigned');
    if (countAllEl) countAllEl.innerText = allMembers.length;
    if (countActiveEl) countActiveEl.innerText = activeCount;
    if (countResignedEl) countResignedEl.innerText = resignedCount;

    let filtered = allMembers;
    if (currentMembersFilter === 'active') {
      filtered = allMembers.filter(m => (m.status || '在籍') !== '退会');
    } else if (currentMembersFilter === 'resigned') {
      filtered = allMembers.filter(m => (m.status || '在籍') === '退会');
    }

    if (!filtered || filtered.length === 0) {
      const emptyMsg = currentMembersFilter === 'active' ? '在籍中のメンバーはありません'
        : currentMembersFilter === 'resigned' ? '退会したメンバーはありません'
        : '登録されているメンバーはありません';
      tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #868e96; padding: 20px;">${emptyMsg}</td></tr>`;
      return;
    }

    filtered.forEach((m, idx) => {
      const isResigned = (m.status || '在籍') === '退会';
      const tr = document.createElement('tr');
      if (isResigned) {
        tr.className = 'opacity-70 bg-slate-50/50';
      }

      const statusBadge = isResigned
        ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-500 border border-slate-200/80"><span class="w-1.5 h-1.5 rounded-full bg-slate-400 mr-1.5"></span>退会</span>`
        : `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-50 text-blue-700 border border-blue-200/60"><span class="w-1.5 h-1.5 rounded-full bg-blue-600 mr-1.5"></span>在籍</span>`;

      const roleBadge = m.role
        ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200/60" title="${escapeHtml(m.role)}">${formatTruncatedCell(m.role, 14)}</span>`
        : `<span class="text-xs text-slate-300">-</span>`;

      tr.innerHTML = `
        <td style="font-weight: 700;">${idx + 1}</td>
        <td class="text-center">${statusBadge}</td>
        <td>${roleBadge}</td>
        <td><span style="font-weight:700; color:#364fc7; background:#e7f5ff; padding:3px 10px; border-radius:12px; font-size:12px;">${formatTruncatedCell(m.category, 12)}</span></td>
        <td style="font-weight: 800; font-size:14px; color:${isResigned ? '#495057' : '#212529'};">${escapeHtml(m.name)}${isResigned ? ' <span class="text-[11px] text-slate-400 font-normal">(退会)</span>' : ''}</td>
        <td style="color:#495057; font-weight:700;">${formatTruncatedCell(m.profession, 15)}</td>
        <td>
          <button class="btn-icon-action text-blue-600 hover:text-blue-800" onclick="openMemberPersonalDashboard('${escapeJsParam(m.name)}')" title="活動ダッシュボードを開く"><i class="fa-solid fa-id-badge"></i></button>
          <button class="btn-icon-action" onclick="openEditMemberModal('${m.id}')" title="編集"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-icon-action btn-icon-danger" onclick="deleteMemberMaster('${m.id}', '${escapeJsParam(m.name)}')" title="削除"><i class="fa-solid fa-trash"></i></button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function openMemberPersonalDashboard(memberName) {
    switchTab('member-dashboard');
    setTimeout(() => {
      if (typeof selectMemberDashboard === 'function') {
        selectMemberDashboard(memberName, true);
      }
    }, 50);
  }

  function openAddMemberModal() {
    document.getElementById('modal-member-title').innerText = '新規メンバー追加';
    document.getElementById('crud-m-id').value = '';
    document.getElementById('crud-m-category').value = '';
    document.getElementById('crud-m-name').value = '';
    document.getElementById('crud-m-profession').value = '';
    const roleInput = document.getElementById('crud-m-role');
    if (roleInput) roleInput.value = '';
    const activeRadio = document.getElementById('crud-m-status-active');
    if (activeRadio) activeRadio.checked = true;
    document.getElementById('modal-member-crud').style.display = 'flex';
  }

  function openEditMemberModal(id) {
    const m = cachedFlatMembers.find(item => String(item.id) === String(id));
    if (!m) return;
    document.getElementById('modal-member-title').innerText = 'メンバー情報の編集';
    document.getElementById('crud-m-id').value = m.id;
    document.getElementById('crud-m-category').value = m.category || '';
    document.getElementById('crud-m-name').value = m.name || '';
    document.getElementById('crud-m-profession').value = m.profession || '';
    const roleInput = document.getElementById('crud-m-role');
    if (roleInput) roleInput.value = m.role || '';
    const isResigned = (m.status || '在籍') === '退会';
    const resignedRadio = document.getElementById('crud-m-status-resigned');
    const activeRadio = document.getElementById('crud-m-status-active');
    if (isResigned && resignedRadio) {
      resignedRadio.checked = true;
    } else if (activeRadio) {
      activeRadio.checked = true;
    }
    document.getElementById('modal-member-crud').style.display = 'flex';
  }

  function closeMemberCrudModal() {
    document.getElementById('modal-member-crud').style.display = 'none';
  }

  function submitMemberCrudForm() {
    const id = document.getElementById('crud-m-id').value;
    const category = document.getElementById('crud-m-category').value.trim();
    const name = document.getElementById('crud-m-name').value.trim();
    const profession = document.getElementById('crud-m-profession').value.trim();
    const role = (document.getElementById('crud-m-role')?.value || '').trim();
    const status = document.getElementById('crud-m-status-resigned')?.checked ? '退会' : '在籍';

    if (!category || !name || !profession) {
      alert('全ての必須項目を入力してください');
      return;
    }

    const mObj = { id, category, name, profession, role, status };
    showToast(id ? `メンバー情報を更新中...` : `メンバーを追加中...`);
    document.getElementById('loading').style.display = 'flex';

    const apiFunc = id ? 'updateMemberApi' : 'addMemberApi';

    ApiService.call(apiFunc, mObj)
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        closeMemberCrudModal();
        showToast(`✅ メンバーを保存しました`);
        cachedFlatMembers = res.flatMembers || [];
        renderMembersMasterTable(cachedFlatMembers);
      })
      .catch(handleError);
  }

  function deleteMemberMaster(id, name) {
    if (!confirm(`【確認】メンバー「${name}」をリストから削除してよろしいですか？`)) return;
    showToast(`メンバーを削除中...`);
    document.getElementById('loading').style.display = 'flex';

    ApiService.call('deleteMemberApi', id)
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        showToast(`🗑️ メンバーを削除しました`);
        cachedFlatMembers = res.flatMembers || [];
        renderMembersMasterTable(cachedFlatMembers);
      })
      .catch(handleError);
  }

  function renderBniTermsSelectOptions(termsList, selectedDate) {
    if (!termsList || !Array.isArray(termsList)) return;
    ['select-start-date', 'setting-page-period-select'].forEach(elemId => {
      const select = document.getElementById(elemId);
      if (!select) return;
      select.innerHTML = '';

      termsList.forEach(t => {
        const val = t.value || t.dateStr || '';
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = t.label || val;
        if (selectedDate && (val === selectedDate || t.dateStr === selectedDate || t.value === selectedDate)) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });
    });
  }
</script>
