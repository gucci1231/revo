<script>
  /* --- VIEW 2: Priority Follow View Controller --- */
  let currentPfGradeFilter = 'ALL';
  let filteredPfVisitors = [];
  let pfCurrentPage = 1;
  const PF_PAGE_SIZE = 50;

  function setPriorityFollowGradeFilter(grade) {
    currentPfGradeFilter = grade;

    const btnAll = document.getElementById('pf-tab-all') || document.getElementById('pf-filter-btn-ALL');
    const btnA = document.getElementById('pf-tab-a') || document.getElementById('pf-filter-btn-A');
    const btnB = document.getElementById('pf-tab-b') || document.getElementById('pf-filter-btn-B');

    const map = { 'ALL': btnAll, 'A': btnA, 'B': btnB };
    Object.keys(map).forEach(g => {
      const btn = map[g];
      if (btn) {
        if (g === grade) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    });

    filterPriorityFollowTable();
  }

  function filterPriorityFollowTable() {
    const search = (document.getElementById('search-priority-follow-input')?.value || '').toLowerCase().trim();
    const rawList = cachedPriorityFollowList || [];
    const dedupedList = deduplicateVisitorListClient(rawList);

    filteredPfVisitors = dedupedList.filter(v => {
      const isJoinedBool = (v.isJoined === '入会済' || v.isJoined === '済' || v.isJoined === '入会' || v.isJoined === true);
      const isRejected = (v.isJoined === '見送り');
      if (isJoinedBool || isRejected) return false;

      const feel = parseFeelAbc(v.feelAbc);
      const matchGrade = (currentPfGradeFilter === 'A' && feel === 'A') ||
                         (currentPfGradeFilter === 'B' && feel === 'B') ||
                         (currentPfGradeFilter === 'ALL' && (feel === 'A' || feel === 'B'));

      if (!matchGrade) return false;

      const name = (v.name || '').toLowerCase();
      const company = (v.company || '').toLowerCase();
      const profession = (v.profession || '').toLowerCase();
      const inviter = (v.inviter || '').toLowerCase();

      return !search || name.includes(search) || company.includes(search) || profession.includes(search) || inviter.includes(search);
    });

    pfCurrentPage = 1;
    renderPriorityFollowCurrentPage();
  }

  function changePriorityFollowPage(delta) {
    const totalPages = Math.ceil(filteredPfVisitors.length / PF_PAGE_SIZE) || 1;
    const newPage = pfCurrentPage + delta;
    if (newPage >= 1 && newPage <= totalPages) {
      pfCurrentPage = newPage;
      renderPriorityFollowCurrentPage();
    }
  }

  function renderPriorityFollowCurrentPage() {
    const tbody = document.getElementById('table-priority-follow-page') || document.getElementById('table-priority-follow');
    const cardsContainer = document.getElementById('cards-priority-follow');
    const infoEl = document.getElementById('pf-pagination-info');
    const prevBtn = document.getElementById('btn-pf-prev-page') || document.getElementById('pf-btn-prev');
    const nextBtn = document.getElementById('btn-pf-next-page') || document.getElementById('pf-btn-next');
    const pageNumEl = document.getElementById('pf-pagination-page-num');

    if (tbody) tbody.innerHTML = '';
    if (cardsContainer) cardsContainer.innerHTML = '';

    const total = filteredPfVisitors.length;
    const totalPages = Math.ceil(total / PF_PAGE_SIZE) || 1;
    if (pfCurrentPage > totalPages) pfCurrentPage = totalPages;

    const startIdx = (pfCurrentPage - 1) * PF_PAGE_SIZE;
    const pageItems = filteredPfVisitors.slice(startIdx, startIdx + PF_PAGE_SIZE);

    if (infoEl) infoEl.innerText = `全 ${total} 件中 ${total > 0 ? startIdx + 1 : 0} - ${Math.min(startIdx + PF_PAGE_SIZE, total)} 件を表示`;
    if (pageNumEl) pageNumEl.innerText = `${pfCurrentPage} / ${totalPages}`;
    if (prevBtn) prevBtn.disabled = (pfCurrentPage <= 1);
    if (nextBtn) nextBtn.disabled = (pfCurrentPage >= totalPages);

    if (pageItems.length === 0) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #868e96; padding: 24px;">条件に合致する最優先フォロー対象はいません</td></tr>';
      if (cardsContainer) {
        cardsContainer.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #868e96; padding: 36px 16px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1;">
            <i class="fa-solid fa-fire text-2xl text-slate-300 mb-2"></i>
            <div class="font-bold text-sm text-slate-600">条件に合致する最優先フォロー対象はいません</div>
          </div>
        `;
      }
      return;
    }

    pageItems.forEach(v => {
      const vid = v.id || v.visitorId;

      // 1. PCテーブル行
      if (tbody) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.onclick = function(e) {
          if (e.target.closest('button') || e.target.closest('a') || e.target.closest('select')) return;
          openVisitorDetailView(vid);
        };
        tr.innerHTML = `
          <td>${formatEventDateWithElapsed(v.eventDate)}</td>
          <td>${renderRankBadgeHtml(v.feelAbc)}</td>
          <td>
            <div style="font-weight:700;">${renderVisitorNameLinkHtml(vid, v.name)}</div>
            <div style="font-size:11px; color:#64748b;">${formatTruncatedCell(v.company, 12)} / ${formatTruncatedCell(v.profession, 12)}</div>
          </td>
          <td>${formatTruncatedCell(v.inviter, 10)}</td>
          <td>${formatTruncatedCell(v.orientUser, 10)}</td>
          <td>
            <div style="font-size:12px; max-width:260px; white-space:normal;">${formatTruncatedCell(v.q7 || v.orientMemo || v.followMemo, 40)}</div>
          </td>
          <td>
            <div style="display:flex; gap:4px; align-items:center;">
              ${render1to1ButtonHtml(vid, v.is1to1)}
              ${renderJoinedButtonHtml(vid, v.isJoined)}
              <button class="btn-icon-action" onclick="openHearingFormModal('${vid}')" title="ヒアリングシート"><i class="fa-solid fa-file-lines"></i></button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      }

      // 2. スマホカード
      if (cardsContainer) {
        const card = document.createElement('div');
        card.className = 'dash-ap-card';
        card.onclick = function() {
          openVisitorDetailView(vid);
        };

        const memoText = v.q7 || v.orientMemo || v.followMemo;

        card.innerHTML = `
          <div class="dash-ap-card-header">
            <div class="dash-ap-card-badges flex-wrap gap-1">
              ${renderRankBadgeHtml(v.feelAbc)}
              ${formatEventDateWithElapsed(v.eventDate)}
              ${render1to1ButtonHtml(vid, v.is1to1)}
              ${renderJoinedButtonHtml(vid, v.isJoined)}
            </div>
            <div class="flex items-center gap-1">
              <button type="button" class="btn-icon-action" style="padding:3px 6px;" onclick="event.stopPropagation(); openHearingFormModal('${vid}')" title="ヒアリングシート">
                <i class="fa-solid fa-file-lines text-xs text-indigo-600"></i>
              </button>
              <button type="button" class="btn-action-secondary vd-quick-chip" style="font-size:10px; padding:2px 8px;" onclick="event.stopPropagation(); openVisitorDetailView('${vid}')">
                詳細 <i class="fa-solid fa-chevron-right text-[8px]"></i>
              </button>
            </div>
          </div>

          <div class="dash-ap-card-visitor">
            <i class="fa-solid fa-user-tag text-rose-600 text-xs"></i>
            <span>${escapeHtml(v.name || 'ビジター No.' + vid)}</span>
            ${v.company ? `<span style="font-size:11px; font-weight:normal; color:#64748b;">(${escapeHtml(v.company)})</span>` : ''}
          </div>

          <div style="font-size: 11px; color: #475569; display: flex; gap: 8px; flex-wrap: wrap;">
            <span><strong>招待:</strong> ${escapeHtml(v.inviter || '-')}</span>
            ${v.orientUser ? `<span><strong>担当:</strong> <span style="color:#5f3dc4; font-weight:700;">${escapeHtml(v.orientUser)}</span></span>` : ''}
          </div>

          <div style="background: #f8fafc; padding: 8px 10px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 2px;">
            ${renderCurrentStatusColumnHtml(v)}
          </div>
        `;
        cardsContainer.appendChild(card);
      }
    });
  }
</script>
