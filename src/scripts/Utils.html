<script>
  function refreshCurrentActiveView() {
    // 1. ダッシュボード
    if (typeof fetchDashboardData === 'function') {
      fetchDashboardData(true);
    }
    // 2. アクション管理
    if (typeof fetchActionsManagementData === 'function') {
      fetchActionsManagementData(true);
    }
    // 3. 優先フォロー
    if (typeof fetchPriorityFollowData === 'function') {
      fetchPriorityFollowData(true);
    }
    // 4. ビジター一覧
    if (typeof fetchVisitorsList === 'function') {
      fetchVisitorsList(true);
    }
    // 5. 詳細画面が開いている場合
    if (typeof currentVdVisitorId !== 'undefined' && currentVdVisitorId && typeof fetchVisitorDetail === 'function') {
      fetchVisitorDetail(currentVdVisitorId);
    }
  }

  function parseFeelAbc(val) {
    if (!val) return '';
    const s = String(val).toUpperCase().trim();
    if (s === 'A' || s === 'B' || s === 'C') return s;
    if (s.includes('A')) return 'A';
    if (s.includes('B')) return 'B';
    if (s.includes('C')) return 'C';
    return '';
  }

  function renderRankBadgeHtml(val, size = 'default') {
    const feel = parseFeelAbc(val);
    const sizeClass = (size === 'large' || size === 'lg') ? 'emblem-lg' : '';
    if (feel === 'A') {
      return `<div class="badge-rank-emblem rank-A ${sizeClass}" title="感触ランク A">A</div>`;
    }
    if (feel === 'B') {
      return `<div class="badge-rank-emblem rank-B ${sizeClass}" title="感触ランク B">B</div>`;
    }
    if (feel === 'C') {
      return `<div class="badge-rank-emblem rank-C ${sizeClass}" title="感触ランク C">C</div>`;
    }
    return `<div class="badge-rank-emblem rank-none ${sizeClass}" title="感触ランク 未設定">-</div>`;
  }

  function renderActionTypeBadgeHtml(type) {
    if (!type) return '';
    const t = String(type).trim();
    let icon = 'fa-tag';
    if (t === '1to1') icon = 'fa-handshake';
    else if (t === 'リファーラル') icon = 'fa-gift';
    else if (t === '定例会案内' || t === '次回案内') icon = 'fa-calendar-day';
    else if (t === '入会案内') icon = 'fa-envelope-open-text';
    else if (t === '電話フォロー' || t === 'フォロー') icon = 'fa-phone';
    else if (t === 'その他') icon = 'fa-comment-dots';
    return `<span class="badge-action-type"><i class="fa-solid ${icon}"></i> ${escapeHtml(t)}</span>`;
  }

  function changeVisitorStatus(id, field, value) {
    const fieldLabels = {
      'isAttended': '出欠',
      'is1to1': '1to1',
      'isJoined': '入会',
      'followType': 'フォロー方針'
    };
    const fieldName = fieldLabels[field] || field;
    showToast(`${fieldName}を【${value}】に変更中...`);

    // ローカルキャッシュのステータスを即座に更新（画面が飛ばないようUIを即時反映）
    if (typeof cachedAllVisitors !== 'undefined' && cachedAllVisitors && cachedAllVisitors.length > 0) {
      cachedAllVisitors.forEach(v => {
        if (String(v.id) === String(id)) {
          v[field] = value;
        }
      });
      if (typeof filterAllVisitorsTable === 'function') {
        filterAllVisitorsTable();
      }
    }
    if (typeof cachedPriorityFollowList !== 'undefined' && cachedPriorityFollowList && cachedPriorityFollowList.length > 0) {
      cachedPriorityFollowList.forEach(v => {
        if (String(v.id) === String(id) || String(v.visitor_id) === String(id)) {
          v[field] = value;
        }
      });
      if (typeof renderPriorityFollowCurrentPage === 'function') {
        renderPriorityFollowCurrentPage();
      }
    }

    // 詳細画面が開いている場合、セレクトボックスのクラスとローカル状態を即時更新
    if (field === 'followType') {
      const selectFollowType = document.getElementById('vd-select-follow-type');
      if (selectFollowType) {
        const info = getFollowTypeInfo(value);
        selectFollowType.value = info.value;
        selectFollowType.className = 'vd-status-select ' + info.cls;
      }
    } else if (field === 'isJoined') {
      const selectJoin = document.getElementById('vd-select-joined');
      if (selectJoin) {
        const info = getJoinStatusInfo(value);
        selectJoin.value = info.value;
        selectJoin.className = 'vd-status-select ' + info.cls;
      }
    } else if (field === 'isAttended') {
      const selectAtt = document.getElementById('vd-select-attended');
      if (selectAtt) {
        const info = getAttendStatusInfo(value);
        selectAtt.value = info.value;
        selectAtt.className = 'vd-status-select ' + info.cls;
      }
    }

    ApiService.call('updateVisitorStatusApi', id, field, value)
      .then(res => {
        showToast(`✅ ${fieldName}を【${value}】に変更しました`);
        refreshAllActiveViews();

        if (field === 'followType' && (value === '時期尚早' || value === '関係維持') && typeof openFollowPendingReminderModal === 'function') {
          openFollowPendingReminderModal(id, value);
        }
      })
      .catch(handleError);
  }

  // ==========================================
  // 🎯 ステータスマスタ定義 (Single Source of Truth)
  // ==========================================
  const JOIN_STATUS_CONFIG = {
    '未': { value: '未', label: '未', shortLabel: '未', cls: '', priority: 0 },
    '検討中': { value: '検討中', label: '検討中', shortLabel: '検討中', cls: 'state-considering', priority: 1 },
    '申込書提出': { value: '申込書提出', label: '申込書提出', shortLabel: '申込書提出', cls: 'state-applying', priority: 2 },
    '入金待ち': { value: '入金待ち', label: '入金待ち', shortLabel: '入金待ち', cls: 'state-payment', priority: 3 },
    '審査': { value: '審査', label: '審査', shortLabel: '審査', cls: 'state-review', priority: 4 },
    '入会済': { value: '入会済', label: '入会済', shortLabel: '入会済', cls: 'state-joined', priority: 5 },
    'フォロー終了': { value: 'フォロー終了', label: 'フォロー終了', shortLabel: '終了', cls: 'state-closed', priority: 6 },
    '見送り': { value: '見送り', label: '見送り', shortLabel: '見送り', cls: 'state-closed', priority: 6 }
  };
  const JOIN_STATUS_ORDER = ['未', '検討中', '申込書提出', '入金待ち', '審査', '入会済', 'フォロー終了', '見送り'];

  const FOLLOW_TYPE_CONFIG = {
    'フォロー': { value: 'フォロー', label: 'フォロー', shortLabel: 'フォロー', cls: 'follow-type-active', color: '#0284c7' },
    '時期尚早': { value: '時期尚早', label: '時期尚早', shortLabel: '時期尚早', cls: 'follow-type-pending', color: '#6366f1' },
    '関係維持': { value: '関係維持', label: '関係維持', shortLabel: '関係維持', cls: 'follow-type-alliance', color: '#059669' },
    'フォロー終了': { value: 'フォロー終了', label: 'フォロー終了', shortLabel: '終了', cls: 'follow-type-closed', color: '#64748b' },
    '終了': { value: 'フォロー終了', label: 'フォロー終了', shortLabel: '終了', cls: 'follow-type-closed', color: '#64748b' }
  };
  const FOLLOW_TYPE_ORDER = ['フォロー', '時期尚早', '関係維持', 'フォロー終了'];

  function normalizeFollowType(raw) {
    if (!raw) return 'フォロー';
    if (FOLLOW_TYPE_CONFIG[raw]) return FOLLOW_TYPE_CONFIG[raw].value;
    if (raw === '直近フォロー' || raw === '直近' || raw === 'フォロー') return 'フォロー';
    if (raw === '保留' || raw === '保留（時期尚早）' || raw.includes('時期尚早')) return '時期尚早';
    if (raw === 'アライアンス' || raw === '繋がり維持' || raw === '定期コンタクト' || raw.includes('関係維持')) return '関係維持';
    if (raw === 'クローズ' || raw === '完了' || raw === 'フォロー終了' || raw === '終了' || raw === '見送り') return 'フォロー終了';
    return 'フォロー';
  }

  function getFollowTypeInfo(raw) {
    const key = normalizeFollowType(raw);
    return FOLLOW_TYPE_CONFIG[key] || FOLLOW_TYPE_CONFIG['フォロー'];
  }

  function renderFollowTypeOptionsHtml(selectedVal) {
    const current = normalizeFollowType(selectedVal);
    return FOLLOW_TYPE_ORDER.map(key => {
      const info = FOLLOW_TYPE_CONFIG[key];
      const isSel = current === info.value ? ' selected' : '';
      return `<option value="${info.value}"${isSel}>${info.label}</option>`;
    }).join('\n');
  }

  const ATTEND_STATUS_CONFIG = {
    '未': { value: '未', label: '未', shortLabel: '未', cls: '' },
    '参加': { value: '参加', label: '参加', shortLabel: '参加', cls: 'state-attended' },
    '不参加': { value: '不参加', label: '不参加', shortLabel: '不参加', cls: 'state-absent' }
  };
  const ATTEND_STATUS_ORDER = ['未', '参加', '不参加'];

  const ONE_TO_ONE_STATUS_CONFIG = {
    '未': { value: '未', label: '1to1: 未', shortLabel: '未', cls: '' },
    '済': { value: '済', label: '1to1: 済', shortLabel: '済', cls: 'state-done' },
    '調整中': { value: '調整中', label: '1to1: 調整中', shortLabel: '調整中', cls: 'state-progress' }
  };
  const ONE_TO_ONE_STATUS_ORDER = ['未', '済', '調整中'];

  function normalizeJoinStatus(raw) {
    if (raw === true || raw === '済' || raw === '入会' || raw === '入会済') return '入会済';
    if (raw === 'メンバーシップ審査' || raw === '審査中' || raw === '審査') return '審査';
    if (raw === '終了' || raw === 'フォロー終了') return 'フォロー終了';
    if (raw === '見送り') return '見送り';
    if (JOIN_STATUS_CONFIG[raw]) return raw;
    return '未';
  }

  function getJoinStatusInfo(raw) {
    const key = normalizeJoinStatus(raw);
    return JOIN_STATUS_CONFIG[key] || JOIN_STATUS_CONFIG['未'];
  }

  function renderJoinStatusOptionsHtml(selectedVal) {
    const current = normalizeJoinStatus(selectedVal);
    return JOIN_STATUS_ORDER.map(key => {
      const info = JOIN_STATUS_CONFIG[key];
      const isSel = current === key ? ' selected' : '';
      return `<option value="${info.value}"${isSel}>${info.label}</option>`;
    }).join('\n');
  }

  function normalizeAttendStatus(raw) {
    if (raw === true || raw === '済' || raw === '出席' || raw === '参加') return '参加';
    if (raw === false || raw === '欠席' || raw === '不参加') return '不参加';
    return '未';
  }

  function getAttendStatusInfo(raw) {
    const key = normalizeAttendStatus(raw);
    return ATTEND_STATUS_CONFIG[key] || ATTEND_STATUS_CONFIG['未'];
  }

  function renderAttendStatusOptionsHtml(selectedVal) {
    const current = normalizeAttendStatus(selectedVal);
    return ATTEND_STATUS_ORDER.map(key => {
      const info = ATTEND_STATUS_CONFIG[key];
      const isSel = current === key ? ' selected' : '';
      return `<option value="${info.value}"${isSel}>${info.label}</option>`;
    }).join('\n');
  }

  function normalize1to1Status(raw) {
    if (raw === true || raw === '済' || raw === '完了') return '済';
    if (raw === '調整中' || raw === '進行中') return '調整中';
    return '未';
  }

  function get1to1StatusInfo(raw) {
    const key = normalize1to1Status(raw);
    return ONE_TO_ONE_STATUS_CONFIG[key] || ONE_TO_ONE_STATUS_CONFIG['未'];
  }

  function render1to1StatusOptionsHtml(selectedVal) {
    const current = normalize1to1Status(selectedVal);
    return ONE_TO_ONE_STATUS_ORDER.map(key => {
      const info = ONE_TO_ONE_STATUS_CONFIG[key];
      const isSel = current === key ? ' selected' : '';
      return `<option value="${info.value}"${isSel}>${info.label}</option>`;
    }).join('\n');
  }

  function renderAttendButtonHtml(id, rawStatus, extraClass = '') {
    const info = getAttendStatusInfo(rawStatus);
    const optionsHtml = renderAttendStatusOptionsHtml(rawStatus);
    return `
      <select class="status-select ${info.cls} ${extraClass}" onclick="event.stopPropagation();" onchange="event.stopPropagation(); changeVisitorStatus('${id}', 'isAttended', this.value)" title="出欠ステータスを変更">
        ${optionsHtml}
      </select>
    `;
  }

  function render1to1ButtonHtml(id, rawStatus, extraClass = '') {
    const info = get1to1StatusInfo(rawStatus);
    const optionsHtml = render1to1StatusOptionsHtml(rawStatus);
    return `
      <select class="status-select ${info.cls} ${extraClass}" onclick="event.stopPropagation();" onchange="event.stopPropagation(); changeVisitorStatus('${id}', 'is1to1', this.value)" title="1to1ステータスを変更">
        ${optionsHtml}
      </select>
    `;
  }

  function renderJoinedButtonHtml(id, rawStatus, extraClass = '') {
    const info = getJoinStatusInfo(rawStatus);
    const optionsHtml = renderJoinStatusOptionsHtml(rawStatus);
    return `
      <select class="status-select ${info.cls} ${extraClass}" onclick="event.stopPropagation();" onchange="event.stopPropagation(); changeVisitorStatus('${id}', 'isJoined', this.value)" title="入会ステータスを変更">
        ${optionsHtml}
      </select>
    `;
  }

  function renderFollowTypeButtonHtml(id, rawStatus, extraClass = '') {
    const info = getFollowTypeInfo(rawStatus);
    const optionsHtml = renderFollowTypeOptionsHtml(rawStatus);
    return `
      <select class="status-select ${info.cls} ${extraClass}" onclick="event.stopPropagation();" onchange="event.stopPropagation(); changeVisitorStatus('${id}', 'followType', this.value)" title="フォロー方針を変更">
        ${optionsHtml}
      </select>
    `;
  }

  function renderVisitorStatusGroupHtml(id, isAttended, isJoined, followType) {
    return `
      <div class="vd-badges-wrap" onclick="event.stopPropagation();">
        <div class="vd-status-select-wrap">
          ${renderAttendButtonHtml(id, isAttended, 'w-full')}
        </div>
        <div class="vd-status-select-wrap">
          ${renderJoinedButtonHtml(id, isJoined, 'w-full')}
        </div>
        <div class="vd-status-select-wrap">
          ${renderFollowTypeButtonHtml(id, followType, 'w-full')}
        </div>
      </div>
    `;
  }

  // 🌟 ダッシュボード用の閲覧専用・洗練テキストステータスバッジ（ミニマル・モノトーン基調）
  function renderDashboardVisitorStatusBadgeHtml(r) {
    if (!r) return '';
    const joinInfo = getJoinStatusInfo(r.isJoined);
    const followInfo = getFollowTypeInfo(r.followType);

    let joinBadge = '';
    if (joinInfo.value === '入会済') {
      joinBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-200">入会済</span>`;
    } else if (joinInfo.value === '未') {
      joinBadge = `<span class="inline-flex items-center px-1.5 py-0.5 text-[11px] font-medium text-slate-400">未対応</span>`;
    } else {
      // 検討中、申込書提出、入金待ち、審査中など：上品で落ち着いたモノトーンスレート
      joinBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-slate-100 text-slate-700 border border-slate-200">${joinInfo.label}</span>`;
    }

    let followBadge = '';
    if (followInfo.value && followInfo.value !== 'フォロー') {
      followBadge = `<span class="text-[10px] text-slate-400 font-medium">${followInfo.label}</span>`;
    }

    return `
      <div class="inline-flex flex-col items-center justify-center gap-0.5">
        ${joinBadge}
        ${followBadge}
      </div>
    `;
  }

  function renderRepeatBadgeHtml(v) {
    if (!v) return '';
    const count = v.visitCount || (v.allIds && v.allIds.length) || 1;
    if (count < 2) return '';
    const datesTitle = (v.eventDates && v.eventDates.length > 0) ? `参加履歴: ${v.eventDates.join(', ')}` : `参加回数: ${count}回`;
    return `<span class="badge" style="background:#f2f2f7; color:#1d1d1f; border:1px solid #d2d2d7; font-size:10px; font-weight:700; padding:1px 5px; border-radius:8px; margin-left:4px; vertical-align:middle;" title="${escapeHtml(datesTitle)}"><i class="fa-solid fa-rotate-right" style="font-size:9px; margin-right:2px; color:#86868b;"></i>${count}回</span>`;
  }

  function renderVisitorNameLinkHtml(id, name, v = null) {
    const repeatBadge = v ? renderRepeatBadgeHtml(v) : '';
    return `<span style="display:inline-flex; align-items:center;"><a href="#visitor/${id}" onclick="openVisitorDetailView('${id}'); return false;" style="font-weight:700; color:#1d1d1f; text-decoration:none;" onmouseover="this.style.color='#0071e3'" onmouseout="this.style.color='#1d1d1f'">${escapeHtml(name)}</a>${repeatBadge}</span>`;
  }

  function formatShortDate(val) {
    if (!val) return '';
    const str = String(val).trim();
    if (!str || str === '-' || str === '未定' || str === '期日未定') return str;

    // YYYY/MM/DD, YYYY-MM-DD, YYYY/M/D, YYYY-M-D, MM/DD, M/D など
    const match = str.match(/(?:(\d{4})[\/\-])?(\d{1,2})[\/\-](\d{1,2})/);
    if (match) {
      const m = match[2].padStart(2, '0');
      const d = match[3].padStart(2, '0');
      return `${m}/${d}`;
    }

    // Date パース fallback
    const dt = new Date(str);
    if (!isNaN(dt.getTime())) {
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const d = String(dt.getDate()).padStart(2, '0');
      return `${m}/${d}`;
    }
    return str;
  }
  window.formatShortDate = formatShortDate;

  function formatEventDateWithElapsed(eventDate) {
    if (!eventDate) return '-';
    const clean = String(eventDate).replace(/\//g, '-').trim();
    const d = new Date(clean);
    if (isNaN(d.getTime())) return escapeHtml(formatShortDate(eventDate));

    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffTime = now.getTime() - target.getTime();
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    let elapsedBadge = '';
    if (diffDays === 0) {
      elapsedBadge = '<span style="font-size:10px; font-weight:800; color:#2b8a3e; background:#d3f9d8; padding:1px 5px; border-radius:4px; margin-left:4px;">本日</span>';
    } else if (diffDays > 0) {
      const color = diffDays >= 28 ? '#c92a2a' : (diffDays >= 14 ? '#e67700' : '#495057');
      const bg = diffDays >= 28 ? '#ffe3e3' : (diffDays >= 14 ? '#fff3bf' : '#f1f5f9');
      elapsedBadge = `<span style="font-size:10px; font-weight:800; color:${color}; background:${bg}; padding:1px 5px; border-radius:4px; margin-left:4px;">${diffDays}日前</span>`;
    }

    const shortDate = formatShortDate(eventDate);
    return `<span style="font-weight:600; color: #0f172a;">${escapeHtml(shortDate)}</span>`;
  }

  function isVisitorActionCompleted(r) {
    if (!r) return false;
    const ap = r.latestActionPlan;
    return !!(ap && Number(ap.is_completed) === 1);
  }

  function renderCurrentStatusColumnHtml(r) {
    const ap = r.latestActionPlan;
    if (ap) {
      const isCompleted = Number(ap.is_completed) === 1;
      const todayStr = new Date().toISOString().slice(0, 10);
      const isOverdue = !isCompleted && ap.due_date && ap.due_date < todayStr;
      const isDueToday = !isCompleted && ap.due_date && ap.due_date === todayStr;

      let dotColor = '#3b82f6'; // 🔵
      if (isCompleted) dotColor = '#10b981'; // 🟢
      else if (isOverdue) dotColor = '#ef4444'; // 🔴
      else if (isDueToday) dotColor = '#f59e0b'; // 🟡
      
      const metaInfo = [];
      if (ap.due_date) {
        const formattedDue = formatShortDate(ap.due_date);
        metaInfo.push(isOverdue ? `<span style="color:#ef4444; font-weight:800;">期日: ${escapeHtml(formattedDue)}</span>` : `期日: ${escapeHtml(formattedDue)}`);
      }
      if (ap.assignee_name) {
        metaInfo.push(`担当: ${escapeHtml(ap.assignee_name)}`);
      }

      return `
        <div style="display:flex; flex-direction:column; gap:2px; min-width:0; width:100%; white-space:normal; word-break:break-word;">
          <div style="font-size:12.5px; font-weight:700; color:${isCompleted ? '#94a3b8' : '#0f172a'}; line-height:1.4; ${isCompleted ? 'text-decoration:line-through;' : ''}">
            <i class="fa-solid fa-circle" style="font-size:7px; color:${dotColor}; vertical-align:1px; margin-right:4px;"></i>${escapeAndLinkify(ap.action_text, false, false)}
          </div>
          ${metaInfo.length > 0 ? `<div style="font-size:10.5px; color:#64748b; margin-top:1px;">${metaInfo.join(' · ')}</div>` : ''}
          ${ap.report_text ? `<div style="font-size:11px; color:#059669; background:#ecfdf5; padding:2px 6px; border-radius:4px; margin-top:2px; line-height:1.35;"><strong>報告:</strong> ${escapeAndLinkify(ap.report_text, false, false)}</div>` : ''}
        </div>
      `;
    }

    const note = r.q7 || r.orientMemo || r.followMemo;
    if (note) {
      return `
        <div style="font-size:12px; color:#475569; line-height:1.4; white-space:normal; word-break:break-word;" title="${escapeHtml(note)}">
          ${escapeAndLinkify(note, true, false)}
        </div>
      `;
    }

    return `<span style="font-size:11px; color:#94a3b8;">未設定</span>`;
  }

  function hideLoading() {
    const el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  const ogpMemoryCache = new Map();

  function escapeAndLinkify(text, nl2br = false, showCard = true) {
    if (text === null || text === undefined) return '';
    const str = String(text);
    if (!str.trim()) return '';

    const urlRegex = /https?:\/\/(?:[a-zA-Z0-9\-._~:/?#[\]@!$*+,;=%]|&amp;)+/gi;

    if (!showCard) {
      // カード表示なし（テーブル一覧セル等）
      let escaped = escapeHtml(str);
      let linkified = escaped.replace(urlRegex, (rawUrl) => {
        let url = rawUrl;
        let trailing = '';
        const tailPunct = url.match(/([.,!?:;)]+)$/);
        if (tailPunct) {
          trailing = tailPunct[1];
          url = url.slice(0, -trailing.length);
        }
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="auto-url-link text-blue-600 hover:text-blue-800 underline underline-offset-2 break-all" onclick="event.stopPropagation();">${url} <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-75"></i></a>${trailing}`;
      });
      if (nl2br) linkified = linkified.replace(/\r?\n/g, '<br>');
      return linkified;
    }

    // 🌟 最先端インラインカード展開モード (Notion / Slack / Linear方式)
    const lines = str.split(/\r?\n/);
    const parsedLines = [];
    const foundCardUrls = [];

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) {
        parsedLines.push('');
        continue;
      }

      // 単独URL行の判定 (前後に文章がないURL単独行の場合、URLテキスト自体をカードスロットに直接置換)
      const isSingleUrlLine = /^https?:\/\/[^\s]+$/i.test(line);
      if (isSingleUrlLine) {
        let u = line;
        let trailing = '';
        const tailPunct = u.match(/([.,!?:;)]+)$/);
        if (tailPunct) {
          trailing = tailPunct[1];
          u = u.slice(0, -trailing.length);
        }
        foundCardUrls.push(u);
        parsedLines.push(`<div class="ogp-inline-card-slot"><div class="ogp-card-container" data-ogp-url="${escapeHtml(u)}"></div></div>${trailing}`);
        continue;
      }

      // 文章とURLが混在している行
      let escapedLine = escapeHtml(line);
      let replacedLine = escapedLine.replace(urlRegex, (rawUrl) => {
        let url = rawUrl;
        let trailing = '';
        const tailPunct = url.match(/([.,!?:;)]+)$/);
        if (tailPunct) {
          trailing = tailPunct[1];
          url = url.slice(0, -trailing.length);
        }
        if (!foundCardUrls.includes(url)) {
          foundCardUrls.push(url);
        }
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="auto-url-link text-blue-600 hover:text-blue-800 underline underline-offset-2 break-all" onclick="event.stopPropagation();">${url} <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-75"></i></a>${trailing}<div class="ogp-inline-card-slot mt-2"><div class="ogp-card-container" data-ogp-url="${escapeHtml(url)}"></div></div>`;
      });

      parsedLines.push(replacedLine);
    }

    // 空白行の無駄なスペースをクリーンアップ
    let result = '';
    for (let i = 0; i < parsedLines.length; i++) {
      const cur = parsedLines[i];
      if (cur === '') {
        const prev = parsedLines[i - 1] || '';
        const next = parsedLines[i + 1] || '';
        // カードスロットの直前直後の空行はマージして巨大な隙間を防止
        if (prev.includes('ogp-inline-card-slot') || next.includes('ogp-inline-card-slot')) {
          continue;
        }
        if (nl2br && result) result += '<br>';
      } else {
        if (result && !result.endsWith('<br>') && !cur.startsWith('<div class="ogp-inline-card-slot"')) {
          if (nl2br) result += '<br>';
        }
        result += cur;
      }
    }

    if (foundCardUrls.length > 0) {
      setTimeout(() => {
        if (typeof OgpCardService !== 'undefined' && OgpCardService.renderAll) {
          OgpCardService.renderAll();
        }
      }, 30);
    }

    return result;
  }
  window.escapeAndLinkify = escapeAndLinkify;

  const OgpCardService = {
    renderAll: function(root = document) {
      const containers = root.querySelectorAll('.ogp-card-container:not(.ogp-loaded)');
      if (!containers || containers.length === 0) return;

      containers.forEach(container => {
        const url = container.getAttribute('data-ogp-url');
        if (!url) return;
        container.classList.add('ogp-loaded');

        if (ogpMemoryCache.has(url)) {
          this.renderCard(container, ogpMemoryCache.get(url));
          return;
        }

        // モダンなスケルトンローディング表示
        container.innerHTML = `
          <div class="ogp-rich-card skeleton-loading animate-pulse" style="min-height: 64px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
              <div style="display: flex; align-items: center; gap: 6px;">
                <div style="width: 15px; height: 15px; border-radius: 4px; background: #cbd5e1;"></div>
                <div style="width: 70px; height: 10px; border-radius: 4px; background: #e2e8f0;"></div>
              </div>
              <div style="width: 80%; height: 13px; border-radius: 4px; background: #cbd5e1;"></div>
              <div style="width: 95%; height: 10px; border-radius: 4px; background: #f1f5f9;"></div>
            </div>
            <div style="width: 72px; height: 72px; border-radius: 8px; background: #e2e8f0; flex-shrink: 0;"></div>
          </div>
        `;

        if (typeof ApiService !== 'undefined' && ApiService.call) {
          ApiService.call('getOgpApi', url)
            .then(res => {
              if (res && res.success && res.data) {
                ogpMemoryCache.set(url, res.data);
                OgpCardService.renderCard(container, res.data);
              } else {
                container.style.display = 'none';
                if (container.closest('.ogp-inline-card-slot')) {
                  container.closest('.ogp-inline-card-slot').style.display = 'none';
                }
              }
            })
            .catch(() => {
              container.style.display = 'none';
              if (container.closest('.ogp-inline-card-slot')) {
                container.closest('.ogp-inline-card-slot').style.display = 'none';
              }
            });
        }
      });
    },

    renderCard: function(container, data) {
      if (!data || (!data.title && !data.description && !data.image)) {
        container.style.display = 'none';
        if (container.closest('.ogp-inline-card-slot')) {
          container.closest('.ogp-inline-card-slot').style.display = 'none';
        }
        return;
      }

      const domain = data.domain || '';
      const siteName = data.site_name || domain;
      const title = data.title || domain;
      const desc = data.description || '';
      const image = data.image || '';
      const favicon = data.favicon || `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=32`;
      const targetUrl = data.url || container.getAttribute('data-ogp-url');

      container.innerHTML = `
        <a href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener noreferrer" class="ogp-rich-card" onclick="event.stopPropagation();">
          <div class="ogp-card-content">
            <div class="ogp-card-domain">
              <img src="${escapeHtml(favicon)}" class="ogp-card-favicon" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">
              <span class="ogp-card-site-name truncate">${escapeHtml(siteName)}</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[9px] text-slate-400 opacity-60 ml-auto"></i>
            </div>
            <div class="ogp-card-title">${escapeHtml(title)}</div>
            ${desc ? `<div class="ogp-card-desc">${escapeHtml(desc)}</div>` : ''}
          </div>
          ${image ? `
            <div class="ogp-card-image-wrap">
              <img src="${escapeHtml(image)}" class="ogp-card-image" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.style.display='none'">
            </div>
          ` : ''}
        </a>
      `;
    }
  };
  window.OgpCardService = OgpCardService;

  function escapeJsParam(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '\\"')
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '');
  }

  function formatTruncatedCell(text, maxLen = 15) {
    if (!text) return '-';
    const str = String(text).trim();
    if (str.length <= maxLen) return escapeHtml(str);
    return `<span title="${escapeHtml(str)}">${escapeHtml(str.substring(0, maxLen))}...</span>`;
  }

  function formatDateForInput(str) {
    if (!str) return '';
    const clean = String(str).replace(/\//g, '-').trim();
    const match = clean.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (match) {
      const m = match[2].padStart(2, '0');
      const d = match[3].padStart(2, '0');
      return `${match[1]}-${m}-${d}`;
    }
    return clean;
  }

  function setCrudQuickDate(type) {
    const input = document.getElementById('crud-v-event-date');
    if (!input) return;

    const now = new Date();
    if (type === 'today') {
      input.value = formatDateForInput(now.toISOString().split('T')[0]);
    } else if (type === 'next-thu') {
      const day = now.getDay();
      const diff = (4 - day + 7) % 7 || 7;
      const nextThu = new Date(now);
      nextThu.setDate(now.getDate() + diff);
      const yyyy = nextThu.getFullYear();
      const mm = String(nextThu.getMonth() + 1).padStart(2, '0');
      const dd = String(nextThu.getDate()).padStart(2, '0');
      input.value = `${yyyy}-${mm}-${dd}`;
    }
  }

  function copyCurrentPageUrl() {
    const origin = window.location.origin + window.location.pathname;
    let cleanUrl = origin.split('?')[0].split('#')[0];
    const rawHash = decodeURIComponent(window.location.hash || '');
    const hash = rawHash.replace(/^#+/, '');
    if (hash && hash !== 'dashboard') {
      cleanUrl += '#' + hash;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cleanUrl).then(() => {
        showToast('🔗 共有URLをコピーしました！');
      }).catch(() => {
        prompt('以下のURLをコピーしてシェアしてください:', cleanUrl);
      });
    } else {
      prompt('以下のURLをコピーしてシェアしてください:', cleanUrl);
    }
  }

  function showToast(msg) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#51cf66;"></i> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function autoResizeTextarea(textarea) {
    if (!textarea) return;
    textarea.style.height = 'auto';
    const newHeight = Math.max(44, textarea.scrollHeight);
    textarea.style.height = newHeight + 'px';
  }
  window.autoResizeTextarea = autoResizeTextarea;

  function initAutoResizeTextareas(root = document) {
    const textareas = root.querySelectorAll('textarea.auto-resize-textarea, #modal-hearing-form textarea');
    textareas.forEach(ta => {
      if (!ta.dataset.autoresizeBound) {
        ta.dataset.autoresizeBound = 'true';
        ta.addEventListener('input', () => autoResizeTextarea(ta));
      }
      autoResizeTextarea(ta);
    });
  }
  window.initAutoResizeTextareas = initAutoResizeTextareas;

  function handleError(err) {
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
    alert('エラーが発生しました: ' + (err.message || err));
  }
</script>
