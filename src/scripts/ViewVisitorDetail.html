<script>
  /* --- 👤 Visitor Detail Full-Page View Controls (VIEW 4) --- */
  let currentVdVisitorId = null;
  let currentVisitorDetail = null;
  let previousTabBeforeDetail = "dashboard";
  let currentVdWebAppUrl = "";
  let currentVdActionPlans = [];
  let cachedMemberCategories = [];

  function openVisitorDetailModal(id) {
    openVisitorDetailView(id);
  }

  function openVisitorDetailView(id, updateHash = true, scrollToTop = true) {
    if (!id || String(id).trim() === '' || String(id).trim() === 'undefined' || String(id).trim() === 'null') {
      return;
    }
    currentVdVisitorId = id;
    if (updateHash) {
      updateUrlHash('visitor/' + id, { visitorId: id });
    }
    if (scrollToTop) {
      document.getElementById('loading').style.display = 'flex';
    }

    ApiService.call('getVisitorDetailApi', id)
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        if (!res || !res.success) {
          showToast('⚠️ ビジターデータの取得に失敗しました（存在しないIDです）');
          switchTab('dashboard', true);
          return;
        }

        currentVdWebAppUrl = res.webAppUrl || "";
        const v = res.visitor || {};
        currentVisitorDetail = v;
        const st = res.status || {};
        const h = res.hearing || {};
        currentVdActionPlans = res.actionPlans || [];
        cachedMemberCategories = res.memberCategories || [];

        document.getElementById('vd-name').innerText = v.name || '-';
        document.getElementById('vd-furigana').innerText = v.furigana || '';
        document.getElementById('vd-company').innerText = v.company || '-';
        document.getElementById('vd-profession').innerText = v.profession || '-';
        document.getElementById('vd-inviter').innerText = v.inviter || '-';
        document.getElementById('vd-event-date').innerText = v.eventDate || '-';
        document.getElementById('vd-email').innerText = v.email || '-';
        document.getElementById('vd-attendance-count').innerText = v.attendanceCount ? `(${v.attendanceCount})` : '(初めて)';

        // 自由メモ
        document.getElementById('vd-free-memo').value = v.remarks || '';

        // ステータスセレクトボックスの反映
        const selectAtt = document.getElementById('vd-select-attended');
        if (selectAtt) {
          const isAtt = (st.isAttended === '参加' || st.isAttended === '済');
          const isAbs = (st.isAttended === '不参加');
          selectAtt.value = isAtt ? '参加' : (isAbs ? '不参加' : '未');
          selectAtt.className = 'vd-status-select ' + (isAtt ? 'state-attended' : (isAbs ? 'state-absent' : ''));
        }

        const select11 = document.getElementById('vd-select-1to1');
        if (select11) {
          const is11 = (st.is1to1 === '済');
          const isProg = (st.is1to1 === '調整中');
          select11.value = is11 ? '済' : (isProg ? '調整中' : '未');
          select11.className = 'vd-status-select ' + (is11 ? 'state-done' : (isProg ? 'state-progress' : ''));
        }

        const selectJoin = document.getElementById('vd-select-joined');
        if (selectJoin) {
          const isJ = (st.isJoined === '入会済' || st.isJoined === '済' || st.isJoined === '入会');
          const isCons = (st.isJoined === '検討中');
          const isRej = (st.isJoined === '見送り');
          selectJoin.value = isJ ? '入会済' : (isCons ? '検討中' : (isRej ? '見送り' : '未'));
          selectJoin.className = 'vd-status-select ' + (isJ ? 'state-joined' : (isCons ? 'state-considering' : (isRej ? 'state-rejected' : '')));
        }

        const feel = (h.feelAbc || '').toUpperCase().trim();
        const rankContainer = document.getElementById('vd-hero-rank-container');
        const rankVal = document.getElementById('vd-hero-rank-val');
        if (rankContainer && rankVal) {
          rankVal.innerText = feel || '未';
          rankContainer.className = `vd-hero-rank-badge ${feel ? 'rank-' + feel : ''}`;
        }

        // ヒアリング内容
        document.getElementById('vd-orient-user').innerText = h.orientUser || '未設定';
        document.getElementById('vd-q1').innerText = h.q1 || '-';
        document.getElementById('vd-q2').innerText = h.q2 || '-';
        document.getElementById('vd-q3').innerText = h.q3 || '-';
        document.getElementById('vd-q4').innerText = h.q4 || '-';
        document.getElementById('vd-q5').innerText = h.q5 || '-';
        document.getElementById('vd-q6').innerText = h.q6 || '-';
        document.getElementById('vd-q7').innerText = h.q7 || '-';
        document.getElementById('vd-orient-memo').innerText = h.orientMemo || '-';
        document.getElementById('vd-follow-memo').innerText = h.followMemo || '-';

        // アクションプランの担当者セレクト＆サジェスト初期化
        initActionPlanForm(v, h);
        renderActionPlansList(currentVdActionPlans);

        // メール履歴
        const mailContainer = document.getElementById('vd-mail-history-list');
        mailContainer.innerHTML = '';
        if (res.mailLogs && res.mailLogs.length > 0) {
          res.mailLogs.forEach(m => {
            const div = document.createElement('div');
            div.style.cssText = 'padding: 12px 16px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #364fc7; display: flex; justify-content: space-between; align-items: center; font-size: 13px;';
            div.innerHTML = `
              <div>
                <strong style="color:#343a40;">${m.mailType}</strong>
                <div style="font-size: 11px; color: #6c757d; margin-top:2px;">送信日時: ${m.sentAt}</div>
              </div>
              <span style="font-size: 11px; font-weight: 800; color: #2b8a3e; background: #d3f9d8; padding: 3px 10px; border-radius: 10px;">${m.status}</span>
            `;
            mailContainer.appendChild(div);
          });
        } else {
          mailContainer.innerHTML = '<div style="color:#868e96; font-size:13px; padding: 10px;">メール送信履歴はありません</div>';
        }

        document.getElementById('vd-btn-open-hearing-page').onclick = () => {
          openHearingFormModal(id);
        };

        // 画面全体を VIEW 4 (ビジター詳細全画面) へ切り替え
        document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('view-visitor-detail').classList.add('active');

        if (scrollToTop) {
          switchVdTab('action-plan');
          window.scrollTo(0, 0);
        }
      })
      .catch(handleError);
  }

  function closeVisitorDetailView() {
    currentVdVisitorId = null;
    switchTab(previousTabBeforeDetail || 'dashboard', true);
  }

  function openCurrentVisitorInNewTab() {
    if (!currentVdVisitorId) return;
    if (currentVdWebAppUrl) {
      window.open(`${currentVdWebAppUrl}?id=${currentVdVisitorId}`, '_blank');
    } else {
      alert('Web App URLが読み込めていません');
    }
  }

  function switchVdTab(tab) {
    document.getElementById('vd-tab-btn-action-plan').classList.toggle('active', tab === 'action-plan');
    document.getElementById('vd-tab-btn-hearing').classList.toggle('active', tab === 'hearing');
    document.getElementById('vd-tab-btn-memo').classList.toggle('active', tab === 'memo');
    document.getElementById('vd-tab-btn-mail').classList.toggle('active', tab === 'mail');

    document.getElementById('vd-tab-content-action-plan').style.display = tab === 'action-plan' ? 'block' : 'none';
    document.getElementById('vd-tab-content-hearing').style.display = tab === 'hearing' ? 'block' : 'none';
    document.getElementById('vd-tab-content-memo').style.display = tab === 'memo' ? 'block' : 'none';
    document.getElementById('vd-tab-content-mail').style.display = tab === 'mail' ? 'block' : 'none';
  }

  /* --- 🎯 Action Plan Specific Controls --- */
  function initActionPlanForm(visitor, hearing) {
    // 担当者セレクトをチャプターメンバーで構築
    const select = document.getElementById('vd-ap-assignee-select');
    if (select) {
      select.innerHTML = '<option value="">-- 担当メンバーを選択 --</option>';
      if (cachedMemberCategories && cachedMemberCategories.length > 0) {
        cachedMemberCategories.forEach(catObj => {
          const grp = document.createElement('optgroup');
          grp.label = catObj.category;
          if (catObj.members && catObj.members.length > 0) {
            catObj.members.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m.name;
              opt.textContent = `${m.name} (${m.profession || ''})`;
              grp.appendChild(opt);
            });
          }
          select.appendChild(grp);
        });
      }
    }

    // 担当者クイックサジェストボタン
    const quickContainer = document.getElementById('vd-ap-quick-assignees');
    if (quickContainer) {
      quickContainer.innerHTML = '';
      const inviter = visitor.inviter || '';
      const orientUser = hearing.orientUser || '';

      if (inviter && inviter !== '-') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-action-secondary';
        btn.style.cssText = 'padding: 3px 8px; font-size: 11px; font-weight: 700; color: #d6336c;';
        btn.innerHTML = `<i class="fa-solid fa-user-tag"></i> 招待者 (${inviter})`;
        btn.onclick = () => setApAssigneeQuick(inviter);
        quickContainer.appendChild(btn);
      }

      if (orientUser && orientUser !== '-' && orientUser !== '未設定') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-action-secondary';
        btn.style.cssText = 'padding: 3px 8px; font-size: 11px; font-weight: 700; color: #1c7ed6;';
        btn.innerHTML = `<i class="fa-solid fa-user-check"></i> オリエン担当 (${orientUser})`;
        btn.onclick = () => setApAssigneeQuick(orientUser);
        quickContainer.appendChild(btn);
      }
    }

    // デフォルト期日（3日後）
    setApDateQuick(3);
    cancelApEdit();
  }

  function setApDateQuick(daysOffset) {
    const d = new Date();
    d.setDate(d.getDate() + daysOffset);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const input = document.getElementById('vd-ap-due-date');
    if (input) {
      input.value = `${yyyy}-${mm}-${dd}`;
    }
  }

  function setApAssigneeQuick(name) {
    const select = document.getElementById('vd-ap-assignee-select');
    if (!select) return;

    // もし既存の選択肢になければ追加して選択
    let found = false;
    for (let i = 0; i < select.options.length; i++) {
      if (select.options[i].value === name) {
        select.selectedIndex = i;
        found = true;
        break;
      }
    }
    if (!found && name) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      opt.selected = true;
      select.appendChild(opt);
    }
  }

  function setApActionQuick(text) {
    const input = document.getElementById('vd-ap-action-text');
    if (input) {
      input.value = text;
      input.focus();
    }
  }

  function renderActionPlansList(list) {
    currentVdActionPlans = list || [];
    const pendingList = document.getElementById('vd-ap-pending-list');
    const completedList = document.getElementById('vd-ap-completed-list');
    const badge = document.getElementById('vd-action-plan-badge');
    const summaryText = document.getElementById('vd-ap-summary-text');

    if (!pendingList || !completedList) return;

    pendingList.innerHTML = '';
    completedList.innerHTML = '';

    const todayStr = new Date().toISOString().slice(0, 10);
    const pendingItems = currentVdActionPlans.filter(p => Number(p.is_completed) === 0);
    const completedItems = currentVdActionPlans.filter(p => Number(p.is_completed) === 1);

    // バッジとサマリー更新
    if (badge) {
      badge.innerText = pendingItems.length;
      badge.style.display = pendingItems.length > 0 ? 'inline-block' : 'none';
    }
    if (summaryText) {
      summaryText.innerText = `未完了 ${pendingItems.length}件 / 完了 ${completedItems.length}件`;
    }

    // 1. 未完了リスト
    if (pendingItems.length === 0) {
      pendingList.innerHTML = `
        <div class="vd-ap-empty">
          <i class="fa-solid fa-circle-check text-emerald-500 text-lg mb-1" style="display:block;"></i>
          進行中の未完了アクションプランはありません
        </div>
      `;
    } else {
      pendingItems.forEach(item => {
        const isOverdue = item.due_date && item.due_date < todayStr;
        const card = document.createElement('div');
        card.className = `vd-ap-card ${isOverdue ? 'is-overdue' : ''}`;

        const reportSnippet = item.report_text ? `
          <div class="vd-ap-report-snippet">
            <strong style="color: #0ca678;"><i class="fa-regular fa-comment-dots"></i> 途中経過:</strong> ${escapeHtml(item.report_text)}
          </div>
        ` : '';

        card.innerHTML = `
          <div class="vd-ap-card-top">
            <div class="vd-ap-meta-row">
              <span class="vd-ap-badge-date ${isOverdue ? 'overdue' : ''}">
                <i class="fa-regular fa-calendar"></i> ${item.due_date || '期日未定'} ${isOverdue ? '(期限超過)' : ''}
              </span>
              <span class="vd-ap-badge-user">
                <i class="fa-regular fa-user"></i> ${escapeHtml(item.assignee_name || '担当未定')}
              </span>
            </div>
            <div class="vd-ap-card-tools">
              <button type="button" class="btn-action-secondary vd-quick-chip" onclick="shareActionPlan('${item.id}', '${currentVdVisitorId || ''}', event)" title="共有URLをコピー">
                <i class="fa-solid fa-share-nodes text-blue-600"></i>
              </button>
              <button type="button" class="btn-action-secondary vd-quick-chip" onclick="editActionPlan('${item.id}')" title="編集">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button type="button" class="btn-action-secondary vd-quick-chip" style="color: var(--danger-accent);" onclick="deleteActionPlan('${item.id}')" title="削除">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>

          <div class="vd-ap-text">
            ${escapeHtml(item.action_text)}
          </div>
          ${reportSnippet}

          <div class="vd-ap-card-bottom">
            <button type="button" class="vd-ap-btn-report" onclick="openActionReportModal('${item.id}', '${currentVdVisitorId || ''}')">
              <i class="fa-solid fa-clipboard-check" style="margin-right: 4px;"></i> 報告して完了
            </button>
          </div>
        `;
        pendingList.appendChild(card);
      });
    }

    // 2. 完了済みリスト
    if (completedItems.length > 0) {
      completedItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'vd-ap-card is-completed';

        const reportBox = item.report_text ? `
          <div class="vd-ap-report-snippet completed">
            <strong style="color: #0ca678;"><i class="fa-regular fa-comment-dots"></i> 実施報告:</strong> ${escapeHtml(item.report_text)}
            ${item.completed_by ? `<span style="color: #64748b; margin-left: 6px; font-weight: normal;">(確認者: ${escapeHtml(item.completed_by)})</span>` : ''}
          </div>
        ` : '';

        card.innerHTML = `
          <div class="vd-ap-card-top">
            <div class="vd-ap-meta-row">
              <span class="badge" style="background:#e6fcf5; color:#0ca678; font-weight:800; font-size:11px; padding:2px 8px; border-radius:6px;">
                <i class="fa-solid fa-circle-check" style="margin-right: 2px;"></i> 完了済
              </span>
              <span class="vd-ap-badge-date">
                <i class="fa-regular fa-calendar"></i> 期日: ${item.due_date || '-'}
              </span>
              <span class="vd-ap-badge-user">
                <i class="fa-regular fa-user"></i> ${escapeHtml(item.assignee_name || '-')}
              </span>
            </div>
            <div class="vd-ap-card-tools">
              <button type="button" class="btn-action-secondary vd-quick-chip" onclick="shareActionPlan('${item.id}', '${currentVdVisitorId || ''}', event)" title="共有URLをコピー">
                <i class="fa-solid fa-share-nodes text-blue-600"></i>
              </button>
              <button type="button" class="btn-action-secondary vd-quick-chip" style="color: #adb5bd;" onclick="deleteActionPlan('${item.id}')" title="削除">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>

          <div class="vd-ap-text completed">
            ${escapeHtml(item.action_text)}
          </div>
          ${reportBox}

          <div class="vd-ap-card-bottom" style="justify-content: space-between; font-size: 11px; color: #64748b;">
            <span>${item.completed_at ? `完了: ${escapeHtml(item.completed_at)}` : ''}</span>
            <button type="button" class="btn-action-secondary text-xs" style="padding: 4px 10px; font-size: 11px;" onclick="openActionReportModal('${item.id}', '${currentVdVisitorId || ''}')" title="報告確認・編集">
              <i class="fa-solid fa-pen-to-square" style="margin-right: 2px;"></i> 報告確認・編集
            </button>
          </div>
        `;
        completedList.appendChild(card);
      });
    } else {
      completedList.innerHTML = `
        <div class="vd-ap-submeta" style="padding: 10px; text-align: center;">完了済みのアクションはありません</div>
      `;
    }
  }

  function submitNewActionPlan() {
    if (!currentVdVisitorId) return;

    const editId = document.getElementById('vd-ap-edit-id').value;
    const dueDate = document.getElementById('vd-ap-due-date').value.trim();
    const assigneeName = document.getElementById('vd-ap-assignee-select').value.trim();
    const actionText = document.getElementById('vd-ap-action-text').value.trim();

    if (!dueDate) {
      alert('いつ（期日）を入力してください');
      return;
    }
    if (!assigneeName) {
      alert('誰が（担当者）を選択してください');
      return;
    }
    if (!actionText) {
      alert('どうする（アクション内容）を入力してください');
      return;
    }

    const payload = {
      visitorId: currentVdVisitorId,
      dueDate: dueDate,
      assigneeName: assigneeName,
      actionText: actionText
    };

    if (editId) {
      payload.id = editId;
      showToast('アクションプランを更新中...');
      ApiService.call('updateActionPlanApi', payload)
        .then(res => {
          showToast('✅ アクションプランを更新しました！');
          if (res.list) renderActionPlansList(res.list);
          cancelApEdit();
        })
        .catch(handleError);
    } else {
      showToast('アクションプランを登録中...');
      ApiService.call('createActionPlanApi', payload)
        .then(res => {
          showToast('✅ アクションプランを登録しました！');
          if (res.list) renderActionPlansList(res.list);
          document.getElementById('vd-ap-action-text').value = '';
          setApDateQuick(3);
        })
        .catch(handleError);
    }
  }

  function toggleActionPlan(id, newStatus) {
    if (!id) return;
    ApiService.call('toggleActionPlanApi', id, newStatus)
      .then(res => {
        showToast(newStatus === 1 ? '🎉 アクションプランを完了にしました！' : 'アクションプランを未完了に戻しました');
        if (res.list) renderActionPlansList(res.list);
      })
      .catch(handleError);
  }

  function editActionPlan(id) {
    const item = currentVdActionPlans.find(p => String(p.id) === String(id));
    if (!item) return;

    document.getElementById('vd-ap-edit-id').value = item.id;
    document.getElementById('vd-ap-due-date').value = item.due_date || '';
    setApAssigneeQuick(item.assignee_name || '');
    document.getElementById('vd-ap-action-text').value = item.action_text || '';

    document.getElementById('vd-ap-btn-submit-label').innerText = '変更を保存する';
    document.getElementById('vd-ap-btn-cancel-edit').style.display = 'inline-block';

    document.getElementById('vd-ap-action-text').focus();
    window.scrollTo({ top: document.getElementById('vd-form-action-plan').offsetTop - 60, behavior: 'smooth' });
  }

  function cancelApEdit() {
    document.getElementById('vd-ap-edit-id').value = '';
    document.getElementById('vd-ap-btn-submit-label').innerText = 'アクションプランを登録する';
    document.getElementById('vd-ap-btn-cancel-edit').style.display = 'none';
  }

  function deleteActionPlan(id) {
    if (!confirm('このアクションプランを削除してもよろしいですか？')) return;

    ApiService.call('deleteActionPlanApi', id, currentVdVisitorId)
      .then(res => {
        showToast('🗑️ アクションプランを削除しました');
        if (res.list) renderActionPlansList(res.list);
      })
      .catch(handleError);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function saveVisitorFreeMemo() {
    if (!currentVdVisitorId) return;
    const memoText = document.getElementById('vd-free-memo').value.trim();
    showToast(`自由メモを保存中...`);

    ApiService.call('saveVisitorMemoApi', currentVdVisitorId, memoText)
      .then(res => {
        showToast(`✅ メモを正常に保存しました！`);
        fetchDashboardData();
        if (cachedAllVisitors.length > 0) fetchAllVisitorsData();
      })
      .catch(handleError);
  }

  function toggleAttend(id, newStatus) {
    changeVisitorStatus(id, 'isAttended', newStatus);
  }

  function toggle1to1(id, current) {
    const next = (current === '済' || current === true) ? '未' : '済';
    changeVisitorStatus(id, 'is1to1', next);
  }

  function toggle1to1InDetail(id, current) {
    toggle1to1(id, current);
  }

  function toggleJoined(id, current) {
    const isJoinedBool = (current === '入会済' || current === '済' || current === '入会' || current === true);
    const next = isJoinedBool ? '未' : '入会済';
    changeVisitorStatus(id, 'isJoined', next);
  }

  function toggleJoinedInDetail(id, current) {
    toggleJoined(id, current);
  }

  function deleteVisitor(id, name) {
    if (!confirm(`【確認】ビジター「${name}」のデータを削除してもよろしいですか？`)) return;

    document.getElementById('loading').style.display = 'flex';
    ApiService.call('deleteVisitorApi', id)
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        if (res.success) {
          showToast(`🗑️ ${name}様のデータを削除しました`);
          fetchDashboardData();
          if (cachedAllVisitors.length > 0) fetchAllVisitorsData();
        }
      })
      .catch(handleError);
  }
</script>
