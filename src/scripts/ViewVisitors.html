<script>
  /* --- VIEW 3: Main Visitors List View Controller --- */
  let filteredVisitors = [];
  let visitorsCurrentPage = 1;
  const VISITORS_PAGE_SIZE = 50;

  function changeVisitorsPage(delta) {
    const totalPages = Math.ceil(filteredVisitors.length / VISITORS_PAGE_SIZE) || 1;
    const newPage = visitorsCurrentPage + delta;
    if (newPage >= 1 && newPage <= totalPages) {
      visitorsCurrentPage = newPage;
      renderVisitorsCurrentPage();
    }
  }

  function renderVisitorsCurrentPage() {
    const tbody = document.getElementById('table-all-visitors');
    const cardsContainer = document.getElementById('cards-all-visitors');
    const infoEl = document.getElementById('visitors-pagination-info');
    const pageNumEl = document.getElementById('visitors-pagination-page-num');
    const prevBtn = document.getElementById('btn-visitors-prev-page') || document.getElementById('visitors-btn-prev');
    const nextBtn = document.getElementById('btn-visitors-next-page') || document.getElementById('visitors-btn-next');

    if (tbody) tbody.innerHTML = '';
    if (cardsContainer) cardsContainer.innerHTML = '';

    const total = filteredVisitors.length;
    const totalPages = Math.ceil(total / VISITORS_PAGE_SIZE) || 1;
    if (visitorsCurrentPage > totalPages) visitorsCurrentPage = totalPages;

    const startIdx = (visitorsCurrentPage - 1) * VISITORS_PAGE_SIZE;
    const pageItems = filteredVisitors.slice(startIdx, startIdx + VISITORS_PAGE_SIZE);

    if (infoEl) infoEl.innerText = `全 ${total} 件中 ${total === 0 ? 0 : startIdx + 1} - ${Math.min(startIdx + VISITORS_PAGE_SIZE, total)} 件を表示`;
    if (pageNumEl) pageNumEl.innerText = `${visitorsCurrentPage} / ${totalPages}`;
    if (prevBtn) prevBtn.disabled = (visitorsCurrentPage <= 1);
    if (nextBtn) nextBtn.disabled = (visitorsCurrentPage >= totalPages);

    if (pageItems.length === 0) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; color: #868e96; padding: 24px;">条件に合致するビジターはいません</td></tr>';
      if (cardsContainer) {
        cardsContainer.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #868e96; padding: 36px 16px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1;">
            <i class="fa-solid fa-users text-2xl text-slate-300 mb-2"></i>
            <div class="font-bold text-sm text-slate-600">条件に合致するビジターはいません</div>
          </div>
        `;
      }
      return;
    }

    pageItems.forEach(v => {
      // 1. PCテーブル行
      if (tbody) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.onclick = function(e) {
          if (e.target.closest('button') || e.target.closest('a') || e.target.closest('select')) return;
          openVisitorDetailView(v.id);
        };

        tr.innerHTML = `
          <td>${formatEventDateWithElapsed(v.eventDate)}</td>
          <td class="text-center">${renderRankBadgeHtml(v.feelAbc)}</td>
          <td>
            <div>
              ${renderVisitorNameLinkHtml(v.id, v.name, v)}
              ${(v.company || v.profession) ? `<div style="font-size:11px; color:#86868b; margin-top:1px;">${escapeHtml(v.company || '')}${v.company && v.profession ? ' · ' : ''}${escapeHtml(v.profession || '')}</div>` : ''}
            </div>
          </td>
          <td>${formatTruncatedCell(v.company, 12)}</td>
          <td>${formatTruncatedCell(v.profession, 12)}</td>
          <td><span style="font-weight:600; color:#1d1d1f;">${formatTruncatedCell(v.inviter, 10)}</span></td>
          <td class="text-center">${renderAttendButtonHtml(v.id, v.isAttended)}</td>
          <td class="text-center">${renderJoinedButtonHtml(v.id, v.isJoined)}</td>
          <td class="text-center">${renderFollowTypeButtonHtml(v.id, v.followType)}</td>
        `;
        tbody.appendChild(tr);
      }

      // 2. スマホカード
      if (cardsContainer) {
        const card = document.createElement('div');
        card.className = 'dash-ap-card';
        card.onclick = function(e) {
          if (e.target.closest('button') || e.target.closest('a') || e.target.closest('select')) return;
          openVisitorDetailView(v.id);
        };

        card.innerHTML = `
          <!-- 上段: 左側に大型ランク＋大きめ名前＋会社名、右側に参加日＋シェブロン -->
          <div class="dash-card-main-row">
            <div class="dash-card-left">
              ${renderRankBadgeHtml(v.feelAbc, 'large')}
              <div class="dash-card-info">
                <div class="dash-card-name-row">
                  <span class="dash-card-name">${escapeHtml(v.name || 'ビジター No.' + v.id)}</span>
                  ${renderRepeatBadgeHtml(v)}
                </div>
                <div class="dash-card-company">
                  ${escapeHtml(v.company || '-')}${v.profession ? ` / ${escapeHtml(v.profession)}` : ''}
                </div>
              </div>
            </div>

            <div class="dash-card-right">
              <span class="dash-card-date-badge">${escapeHtml(v.eventDate || '-')}</span>
              <span class="dash-card-chevron"><i class="fa-solid fa-chevron-right"></i></span>
            </div>
          </div>

          <!-- 中段: 紹介者・担当者 -->
          <div class="dash-card-bottom-row pt-1 pb-1 border-t border-b border-slate-100">
            <div class="dash-card-meta-left text-[11px] text-slate-500">
              <span><i class="fa-solid fa-user-plus text-rose-500 mr-1"></i>${escapeHtml(v.inviter || '-')}</span>
              ${v.orientUser ? `<span class="ml-2"><i class="fa-solid fa-user-check text-indigo-500 mr-1"></i>${escapeHtml(v.orientUser)}</span>` : ''}
            </div>
          </div>

          <!-- 下段: ステータスセレクター群 -->
          <div class="grid grid-cols-3 gap-1.5 pt-2">
            <div class="text-center">
              ${renderAttendButtonHtml(v.id, v.isAttended)}
            </div>
            <div class="text-center">
              ${renderJoinedButtonHtml(v.id, v.isJoined)}
            </div>
            <div class="text-center">
              ${renderFollowTypeButtonHtml(v.id, v.followType)}
            </div>
          </div>
        `;
        cardsContainer.appendChild(card);
      }
    });
  }

  let currentVisitorsStatusFilter = 'all';

  function setVisitorsStatusFilter(status) {
    currentVisitorsStatusFilter = status;
    document.querySelectorAll('.visitors-status-tab').forEach(btn => {
      if (btn.getAttribute('data-status-filter') === status) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    filterAllVisitorsTable();
  }

  function updateVisitorsFilterCounts(dedupedList) {
    const counts = {
      all: dedupedList.length,
      follow: 0,
      pending: 0,
      maintenance: 0,
      joined: 0,
      closed: 0
    };

    dedupedList.forEach(v => {
      const isJoined = (v.isJoined === '入会済' || v.isJoined === '済' || v.isJoined === '入会' || v.isJoined === true);
      const isClosed = (v.isJoined === 'フォロー終了' || v.isJoined === '見送り');
      const followType = typeof normalizeFollowType === 'function' ? normalizeFollowType(v.followType) : (v.followType || 'フォロー');

      if (isJoined) {
        counts.joined++;
      } else if (isClosed || followType === '終了') {
        counts.closed++;
      } else if (followType === '時期尚早') {
        counts.pending++;
      } else if (followType === '関係維持') {
        counts.maintenance++;
      } else if (followType === 'フォロー') {
        counts.follow++;
      }
    });

    const setBadge = (id, count) => {
      const el = document.getElementById(id);
      if (el) el.innerText = count;
    };
    setBadge('count-filter-all', counts.all);
    setBadge('count-filter-follow', counts.follow);
    setBadge('count-filter-pending', counts.pending);
    setBadge('count-filter-maintenance', counts.maintenance);
    setBadge('count-filter-joined', counts.joined);
    setBadge('count-filter-closed', counts.closed);
  }

  function filterAllVisitorsTable() {
    const search = (
      document.getElementById('search-visitors-input')?.value || 
      document.getElementById('search-visitor-input')?.value || ''
    ).toLowerCase().trim();

    const dateFrom = (document.getElementById('visitors-date-from')?.value || '').trim();
    const dateTo = (document.getElementById('visitors-date-to')?.value || '').trim();
    const legacyDate = (document.getElementById('filter-visitor-date')?.value || '').trim();

    const rawList = cachedAllVisitors || [];
    const dedupedList = deduplicateVisitorListClient(rawList);

    updateVisitorsFilterCounts(dedupedList);

    filteredVisitors = dedupedList.filter(v => {
      const name = (v.name || '').toLowerCase();
      const furigana = (v.furigana || '').toLowerCase();
      const inviter = (v.inviter || '').toLowerCase();
      const company = (v.company || '').toLowerCase();
      const profession = (v.profession || '').toLowerCase();
      const eventDate = (v.eventDate || '').replace(/\//g, '-');

      const matchSearch = !search || name.includes(search) || furigana.includes(search) || inviter.includes(search) || company.includes(search) || profession.includes(search);
      
      let matchDate = true;
      if (dateFrom && eventDate < dateFrom) matchDate = false;
      if (dateTo && eventDate > dateTo) matchDate = false;
      if (legacyDate && eventDate !== legacyDate) matchDate = false;

      let matchStatus = true;
      const isJoined = (v.isJoined === '入会済' || v.isJoined === '済' || v.isJoined === '入会' || v.isJoined === true);
      const isClosed = (v.isJoined === 'フォロー終了' || v.isJoined === '見送り');
      const followType = typeof normalizeFollowType === 'function' ? normalizeFollowType(v.followType) : (v.followType || 'フォロー');

      if (currentVisitorsStatusFilter === 'follow') {
        matchStatus = (!isJoined && !isClosed && followType === 'フォロー');
      } else if (currentVisitorsStatusFilter === 'pending') {
        matchStatus = (!isJoined && !isClosed && followType === '時期尚早');
      } else if (currentVisitorsStatusFilter === 'maintenance') {
        matchStatus = (!isJoined && !isClosed && followType === '関係維持');
      } else if (currentVisitorsStatusFilter === 'joined') {
        matchStatus = isJoined;
      } else if (currentVisitorsStatusFilter === 'closed') {
        matchStatus = (isClosed || followType === '終了');
      }

      return matchSearch && matchDate && matchStatus;
    });

    visitorsCurrentPage = 1;
    renderVisitorsCurrentPage();
  }

  function clearVisitorsDateFilter() {
    const fromEl = document.getElementById('visitors-date-from');
    const toEl = document.getElementById('visitors-date-to');
    const legacyEl = document.getElementById('filter-visitor-date');
    if (fromEl) fromEl.value = '';
    if (toEl) toEl.value = '';
    if (legacyEl) legacyEl.value = '';
    filterAllVisitorsTable();
  }

  function renderMeetingVisitorTable(tbodyId, records, showActions) {
    const tbody = document.getElementById(tbodyId);
    const cardsContainerId = tbodyId === 'table-next-meeting' ? 'cards-next-meeting' : 'cards-last-meeting';
    const cardsContainer = document.getElementById(cardsContainerId);

    if (tbody) tbody.innerHTML = '';
    if (cardsContainer) cardsContainer.innerHTML = '';

    if (!records || records.length === 0) {
      const cols = showActions ? 7 : 6;
      if (tbody) tbody.innerHTML = `<tr><td colspan="${cols}" style="text-align: center; color: #868e96; padding: 24px;">該当するビジターはいません</td></tr>`;
      if (cardsContainer) {
        cardsContainer.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #868e96; padding: 32px 16px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1;">
            <i class="fa-solid fa-users text-2xl text-slate-300 mb-2"></i>
            <div class="font-bold text-sm text-slate-600">該当するビジターはいません</div>
          </div>
        `;
      }
      return;
    }

    records.forEach((r, idx) => {
      const companyPart = formatTruncatedCell(r.company, 12);
      const profPart = formatTruncatedCell(r.profession, 12);
      const companyCell = (r.company && r.profession) ? `${companyPart} / ${profPart}` : (r.company ? companyPart : profPart);

      // 1. PCテーブル行
      if (tbody) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.onclick = function(e) {
          if (e.target.closest('button') || e.target.closest('a')) return;
          openVisitorDetailView(r.id);
        };

        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${renderVisitorNameLinkHtml(r.id, r.name)}</td>
          <td>${companyCell}</td>
          <td>${formatTruncatedCell(r.inviter, 10)}</td>
          <td class="text-center">${renderRankBadgeHtml(r.feelAbc)}</td>
          <td class="text-center">${renderAttendButtonHtml(r.id, r.isAttended)}</td>
        `;
        tbody.appendChild(tr);
      }

      // 2. スマホカード
      if (cardsContainer) {
        const card = document.createElement('div');
        card.className = 'dash-ap-card';
        card.onclick = function() {
          openVisitorDetailView(r.id);
        };

        card.innerHTML = `
          <div class="dash-card-main-row">
            <div class="dash-card-left">
              ${renderRankBadgeHtml(r.feelAbc, 'large')}
              <div class="dash-card-info">
                <div class="dash-card-name-row">
                  <span class="dash-card-name">${escapeHtml(r.name || 'ビジター No.' + r.id)}</span>
                  ${renderRepeatBadgeHtml(r)}
                </div>
                <div class="dash-card-company">
                  ${escapeHtml(r.company || '-')}${r.profession ? ` / ${escapeHtml(r.profession)}` : ''}
                </div>
              </div>
            </div>

            <div class="dash-card-right">
              <span class="dash-card-date-badge">No.${idx + 1}</span>
              <span class="dash-card-chevron"><i class="fa-solid fa-chevron-right"></i></span>
            </div>
          </div>

          <div class="dash-card-bottom-row">
            <div class="dash-card-meta-left">
              <span><i class="fa-solid fa-user-plus text-rose-500 mr-1"></i>${escapeHtml(r.inviter || '-')}</span>
            </div>
            <div class="dash-card-status-right">
              ${renderAttendButtonHtml(r.id, r.isAttended)}
            </div>
          </div>
        `;
        cardsContainer.appendChild(card);
      }
    });
  }

  function renderNextMeetingTable(records) {
    renderMeetingVisitorTable('table-next-meeting', records, true);
  }

  function renderLastMeetingTable(records) {
    renderMeetingVisitorTable('table-last-meeting', records, false);
  }

  function renderOneMonthTable(records) {
    if (records) {
      currentDashboardOneMonthList = records;
    }
    const tbody = document.getElementById('table-one-month');
    const cardsContainer = document.getElementById('cards-one-month');

    if (tbody) tbody.innerHTML = '';
    if (cardsContainer) cardsContainer.innerHTML = '';

    const list = (currentDashboardOneMonthList || []).filter(r => r.isJoined !== '見送り');
    const filterMode = (typeof currentDashboardOneMonthFilter !== 'undefined') ? currentDashboardOneMonthFilter : 'pending';

    let filtered = list;
    if (filterMode === 'pending') {
      filtered = list.filter(r => !isVisitorActionCompleted(r));
    } else if (filterMode === 'completed') {
      filtered = list.filter(r => isVisitorActionCompleted(r));
    }

    if (!filtered || filtered.length === 0) {
      const emptyMsg = filterMode === 'completed'
        ? '完了済みのアクションはありません'
        : (filterMode === 'pending' ? '現在、要対応のフォローアップ対象者はいません（すべて完了済）' : '該当するフォローアップ対象者はいません');

      if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #868e96; padding: 24px;">${emptyMsg}</td></tr>`;
      if (cardsContainer) {
        cardsContainer.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #868e96; padding: 36px 16px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1;">
            <i class="fa-solid fa-comments text-2xl text-slate-300 mb-2"></i>
            <div class="font-bold text-sm text-slate-600">${emptyMsg}</div>
          </div>
        `;
      }
      return;
    }

    filtered.forEach(r => {
      // 1. PCテーブル行
      if (tbody) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.onclick = function(e) {
          if (e.target.closest('button') || e.target.closest('a')) return;
          openVisitorDetailView(r.id);
        };

        tr.innerHTML = `
          <td>${formatEventDateWithElapsed(r.eventDate)}</td>
          <td class="text-center">${renderRankBadgeHtml(r.feelAbc)}</td>
          <td>
            <div>
              ${renderVisitorNameLinkHtml(r.id, r.name)}
              <div style="font-size:11px; color:#64748b;">${escapeHtml(r.company || '-')} / ${escapeHtml(r.profession || '-')}</div>
            </div>
          </td>
          <td>
            <div>
              <span style="font-weight:600;">${formatTruncatedCell(r.inviter, 8)}</span>
              ${r.orientUser ? `<div style="font-size:11px; color:#5f3dc4;"><i class="fa-regular fa-user" style="font-size:10px;"></i> 担当: ${escapeHtml(r.orientUser)}</div>` : ''}
            </div>
          </td>
          <td>${renderCurrentStatusColumnHtml(r)}</td>
        `;
        tbody.appendChild(tr);
      }

      // 2. スマホカード
      if (cardsContainer) {
        const card = document.createElement('div');
        card.className = 'dash-ap-card';
        card.onclick = function() {
          openVisitorDetailView(r.id);
        };

        card.innerHTML = `
          <div class="dash-card-main-row">
            <div class="dash-card-left">
              ${renderRankBadgeHtml(r.feelAbc, 'large')}
              <div class="dash-card-info">
                <div class="dash-card-name-row">
                  <span class="dash-card-name">${escapeHtml(r.name || 'ビジター No.' + r.id)}</span>
                  ${renderRepeatBadgeHtml(r)}
                </div>
                <div class="dash-card-company">
                  ${escapeHtml(r.company || '-')}${r.profession ? ` / ${escapeHtml(r.profession)}` : ''}
                </div>
              </div>
            </div>

            <div class="dash-card-right">
              ${formatEventDateWithElapsed(r.eventDate)}
              <span class="dash-card-chevron"><i class="fa-solid fa-chevron-right"></i></span>
            </div>
          </div>

          <div class="dash-card-bottom-row">
            <div class="dash-card-meta-left">
              <span><i class="fa-solid fa-user-plus text-rose-500 mr-1"></i>${escapeHtml(r.inviter || '-')}</span>
              ${r.orientUser ? `<span><i class="fa-solid fa-user-check text-indigo-500 mr-1"></i>${escapeHtml(r.orientUser)}</span>` : ''}
            </div>
            <div class="dash-card-status-right">
              ${renderCurrentStatusColumnHtml(r)}
            </div>
          </div>
        `;
        cardsContainer.appendChild(card);
      }
    });
  }
</script>
