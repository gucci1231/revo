<!-- VIEW 2: ビジター全一覧 (CRUD統合管理) -->
<div id="view-visitors" class="view-content">
  <section class="section-card">
    <div class="section-header">
      <h2 class="section-title"><i class="fa-solid fa-users"></i> 全ビジター統合管理名簿</h2>
      <div class="table-filter-group">
        <div class="date-range-box">
          <i class="fa-solid fa-calendar-range date-range-icon"></i>
          <input type="date" id="visitors-date-from" class="date-range-input" onchange="filterAllVisitorsTable()" title="開始日">
          <span class="date-range-sep">〜</span>
          <input type="date" id="visitors-date-to" class="date-range-input" onchange="filterAllVisitorsTable()" title="終了日">
          <button type="button" onclick="clearVisitorsDateFilter()" class="date-range-clear" title="期間クリア"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <input type="text" id="search-visitors-input" class="search-box" placeholder="🔍 氏名・会社名・招待者で検索..." onkeyup="filterAllVisitorsTable()">
        <button class="btn-create-visitor" onclick="openAddVisitorModal()"><i class="fa-solid fa-plus"></i> 新規追加</button>
      </div>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>参加日</th>
            <th>氏名</th>
            <th>会社名</th>
            <th>専門分野</th>
            <th>招待者</th>
            <th class="text-center">ランク</th>
            <th class="text-center">出欠</th>
            <th class="text-center">1to1</th>
            <th class="text-center">入会</th>
            <th class="text-center">操作</th>
          </tr>
        </thead>
        <tbody id="table-all-visitors"></tbody>
      </table>
    </div>
    <div class="pagination-bar">
      <div class="pagination-info" id="visitors-pagination-info">全 0 件中 0 - 0 件を表示</div>
      <div class="pagination-controls">
        <button type="button" class="btn-action-secondary" id="btn-visitors-prev-page" onclick="changeVisitorsPage(-1)"><i class="fa-solid fa-chevron-left"></i> 前の50件</button>
        <span id="visitors-pagination-page-num" class="pagination-page-num">1 / 1</span>
        <button type="button" class="btn-action-secondary" id="btn-visitors-next-page" onclick="changeVisitorsPage(1)">次の50件 <i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  </section>
</div>
