<script>
/**
 * Coffee Meeting Slot Assignment Modal Controller
 */
let currentCoffeeAssignDate = null;
let coffeeAssignSearchQuery = '';

function getNextWeekdayIsoDate() {
  const d = new Date();
  // 翌日を基準（今日が土日なら月曜日へ）
  d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) {
    d.setDate(d.getDate() + 1);
  }
  return d.toISOString().slice(0, 10);
}

function updateCoffeeAssignDateDisplay(dateStr) {
  if (!dateStr) return;
  currentCoffeeAssignDate = dateStr;

  const targetDateInput = document.getElementById('cfa-target-date');
  if (targetDateInput && targetDateInput.value !== dateStr) {
    targetDateInput.value = dateStr;
  }

  try {
    const d = new Date(dateStr.replace(/-/g, '/'));
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const month = d.getMonth() + 1;
    const day = d.getDate();
    const dayName = days[d.getDay()];

    const mEl = document.getElementById('cfa-date-month');
    const dEl = document.getElementById('cfa-date-day');
    const fullEl = document.getElementById('cfa-date-full');

    if (mEl) mEl.textContent = `${month}月`;
    if (dEl) dEl.textContent = String(day).padStart(2, '0');
    if (fullEl) fullEl.textContent = `${d.getFullYear()}年${month}月${day}日 (${dayName})`;
  } catch (e) {
    console.error('Error formatting date for coffee assign modal', e);
  }
}

function onCoffeeAssignDateChanged(newDateStr) {
  if (!newDateStr) return;
  updateCoffeeAssignDateDisplay(newDateStr);
}

function setQuickCoffeeDate(type) {
  const today = (typeof getTodayIsoDate === 'function') ? getTodayIsoDate() : new Date().toISOString().slice(0, 10);
  let targetIso = today;

  if (type === 'today') {
    targetIso = today;
  } else if (type === 'tomorrow') {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    targetIso = d.toISOString().slice(0, 10);
  } else if (type === 'next_weekday') {
    targetIso = getNextWeekdayIsoDate();
  }

  updateCoffeeAssignDateDisplay(targetIso);
}

function openCoffeeAssignModal(dateStr, preselectedVisitorId = null) {
  // If visitor is provided but dateStr is not, try to use visitor's existing coffee date or next weekday
  if (!dateStr || typeof dateStr !== 'string') {
    if (preselectedVisitorId && typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors)) {
      const v = cachedAllVisitors.find(item => String(item.id) === String(preselectedVisitorId));
      if (v && (v.step1CoffeeDate || v.step1_coffee_date)) {
        dateStr = (v.step1CoffeeDate || v.step1_coffee_date).replace(/\//g, '-').slice(0, 10);
      }
    }
  }

  if (!dateStr || typeof dateStr !== 'string') {
    dateStr = getNextWeekdayIsoDate();
  }

  const modal = document.getElementById('modal-coffee-assign');
  if (!modal) {
    console.error('Modal #modal-coffee-assign not found');
    return;
  }

  // Update date displays
  updateCoffeeAssignDateDisplay(dateStr);

  // Clear search and dropdown
  coffeeAssignSearchQuery = '';
  const searchInput = document.getElementById('cfa-visitor-search');
  if (searchInput) searchInput.value = '';
  hideCoffeeAutocompleteDropdown();

  // Populate visitor select (Newest First)
  try {
    populateCoffeeAssignVisitorSelect(preselectedVisitorId);
  } catch (e) {
    console.error('Error populating coffee assign visitor select', e);
  }

  // If preselected, fill search input with visitor name
  if (preselectedVisitorId && typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors)) {
    const selV = cachedAllVisitors.find(item => String(item.id) === String(preselectedVisitorId));
    if (selV && searchInput) {
      searchInput.value = selV.name || '';
      const clearBtn = document.getElementById('btn-cfa-clear-search');
      if (clearBtn) clearBtn.classList.remove('hidden');
    }
  }

  modal.style.display = 'flex';
  modal.classList.remove('hidden');
}

function closeCoffeeAssignModal() {
  const modal = document.getElementById('modal-coffee-assign');
  if (modal) {
    modal.style.display = 'none';
    modal.classList.add('hidden');
  }
  hideCoffeeAutocompleteDropdown();
  currentCoffeeAssignDate = null;
}

function handleCoffeeVisitorSearchInput(query) {
  filterCoffeeAssignVisitors(query);
  showCoffeeAutocompleteDropdown();
}

function filterCoffeeAssignVisitors(query) {
  coffeeAssignSearchQuery = (query || '').trim().toLowerCase();
  const clearBtn = document.getElementById('btn-cfa-clear-search');
  if (clearBtn) {
    if (coffeeAssignSearchQuery) {
      clearBtn.classList.remove('hidden');
    } else {
      clearBtn.classList.add('hidden');
    }
  }
  const select = document.getElementById('cfa-visitor-select');
  const currentSelectedId = select ? select.value : null;
  populateCoffeeAssignVisitorSelect(currentSelectedId);
  renderCoffeeAutocompleteDropdown();
}

function clearCoffeeAssignSearch() {
  const searchInput = document.getElementById('cfa-visitor-search');
  if (searchInput) searchInput.value = '';
  filterCoffeeAssignVisitors('');
  hideCoffeeAutocompleteDropdown();
  const select = document.getElementById('cfa-visitor-select');
  if (select) {
    select.value = '';
    onCoffeeAssignVisitorChanged();
  }
}

function showCoffeeAutocompleteDropdown() {
  const dropdown = document.getElementById('cfa-autocomplete-dropdown');
  if (!dropdown) return;
  renderCoffeeAutocompleteDropdown();
  dropdown.classList.remove('hidden');
}

function hideCoffeeAutocompleteDropdown() {
  const dropdown = document.getElementById('cfa-autocomplete-dropdown');
  if (dropdown) dropdown.classList.add('hidden');
}

function selectCoffeeAssignVisitor(vId) {
  const select = document.getElementById('cfa-visitor-select');
  if (select) {
    select.value = vId;
  }
  const allVisitors = (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors))
    ? cachedAllVisitors
    : [];
  const v = allVisitors.find(item => String(item.id) === String(vId));
  if (v) {
    const searchInput = document.getElementById('cfa-visitor-search');
    if (searchInput) {
      searchInput.value = v.name || '';
    }
    const clearBtn = document.getElementById('btn-cfa-clear-search');
    if (clearBtn) clearBtn.classList.remove('hidden');
  }
  hideCoffeeAutocompleteDropdown();
  onCoffeeAssignVisitorChanged();
}

function getSortedCoffeeCandidates(query = '') {
  const allVisitors = (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors))
    ? cachedAllVisitors
    : [];

  const unassigned = [];
  const assigned = [];

  allVisitors.forEach(v => {
    // Search query filter (name, furigana, inviter, company, profession)
    if (query) {
      const name = (v.name || '').toLowerCase();
      const furigana = (v.furigana || '').toLowerCase();
      const inviter = (v.inviter || '').toLowerCase();
      const company = (v.company || '').toLowerCase();
      const profession = (v.profession || '').toLowerCase();
      if (!name.includes(query) && !furigana.includes(query) && !inviter.includes(query) && !company.includes(query) && !profession.includes(query)) {
        return;
      }
    }

    const st = (typeof getVisitorFollowSteps === 'function') ? getVisitorFollowSteps(v) : null;
    const isCoffeeDone = st ? (st.s1 && (st.s1.status === '済' || st.s1.status === 'done')) : (v.step1Coffee === '済');
    const hasCoffeeDate = !!(v.step1CoffeeDate || v.step1_coffee_date);

    if (!isCoffeeDone && !hasCoffeeDate) {
      unassigned.push(v);
    } else {
      assigned.push(v);
    }
  });

  // Sort function: 最新順 (日付がある場合は日付DESC、ない場合はID降順)
  const sortNewestFirst = (a, b) => {
    const rawA = (a.eventDate || a.createdAt || '').replace(/\//g, '-').slice(0, 10);
    const rawB = (b.eventDate || b.createdAt || '').replace(/\//g, '-').slice(0, 10);
    if (rawA && rawB && rawA !== rawB) {
      return rawB.localeCompare(rawA); // 最新順 (DESC)
    }
    if (rawA && !rawB) return -1;
    if (!rawA && rawB) return 1;
    const idA = parseInt(a.id || 0, 10);
    const idB = parseInt(b.id || 0, 10);
    return idB - idA; // 最新ID順 (DESC)
  };

  unassigned.sort(sortNewestFirst);
  assigned.sort(sortNewestFirst);

  return { unassigned, assigned };
}

function renderCoffeeAutocompleteDropdown() {
  const dropdown = document.getElementById('cfa-autocomplete-dropdown');
  if (!dropdown) return;

  const { unassigned, assigned } = getSortedCoffeeCandidates(coffeeAssignSearchQuery);
  const total = unassigned.length + assigned.length;

  if (total === 0) {
    dropdown.innerHTML = `
      <div class="p-3 text-center text-xs text-slate-400 font-medium">
        一致するビジターが見つかりません
      </div>
    `;
    return;
  }

  let html = '';

  // 1. 未予約ビジター (優先)
  if (unassigned.length > 0) {
    html += `
      <div class="px-3 py-1.5 bg-slate-50 text-[11px] font-black text-slate-600 flex items-center justify-between border-b border-slate-100">
        <span>✨ 候補ビジター (${unassigned.length}名 - 最新順)</span>
      </div>
    `;
    unassigned.slice(0, 15).forEach(v => {
      const inviter = v.inviter ? `紹介: ${escapeHtml(v.inviter)}` : '';
      const eventStr = v.eventDate ? `定例会: ${formatShortDate(v.eventDate)}` : '申込前（未定）';
      const company = v.company ? `${escapeHtml(v.company)}` : '';
      const sub = [inviter, eventStr, company].filter(Boolean).join(' • ');

      html += `
        <div 
          onclick="selectCoffeeAssignVisitor('${v.id}')" 
          class="p-2.5 hover:bg-blue-50/70 transition-colors cursor-pointer flex items-center justify-between gap-2"
        >
          <div class="min-w-0">
            <div class="text-xs font-bold text-slate-900 truncate">
              ${escapeHtml(v.name || '名称未定')}
              ${v.furigana ? `<span class="text-3xs text-slate-400 font-normal ml-1">(${escapeHtml(v.furigana)})</span>` : ''}
            </div>
            <div class="text-3xs text-slate-500 font-medium truncate mt-0.5">
              ${sub}
            </div>
          </div>
          <span class="shrink-0 text-3xs font-bold px-1.5 py-0.5 rounded bg-blue-50 text-blue-600 border border-blue-200">
            未予約
          </span>
        </div>
      `;
    });
  }

  // 2. 設定済み・変更ビジター
  if (assigned.length > 0) {
    html += `
      <div class="px-3 py-1.5 bg-slate-50 text-[11px] font-black text-slate-600 flex items-center justify-between border-b border-slate-100">
        <span>🔄 設定済み・日程変更 (${assigned.length}名 - 最新順)</span>
      </div>
    `;
    assigned.slice(0, 10).forEach(v => {
      const curDate = v.step1CoffeeDate || v.step1_coffee_date || '';
      const curStr = curDate ? `現予定: ${formatShortDate(curDate)}` : '済';
      const inviter = v.inviter ? `紹介: ${escapeHtml(v.inviter)}` : '';
      const sub = [inviter, curStr].filter(Boolean).join(' • ');

      html += `
        <div 
          onclick="selectCoffeeAssignVisitor('${v.id}')" 
          class="p-2.5 hover:bg-slate-100/70 transition-colors cursor-pointer flex items-center justify-between gap-2"
        >
          <div class="min-w-0">
            <div class="text-xs font-bold text-slate-700 truncate">
              ${escapeHtml(v.name || '名称未定')}
              ${v.furigana ? `<span class="text-3xs text-slate-400 font-normal ml-1">(${escapeHtml(v.furigana)})</span>` : ''}
            </div>
            <div class="text-3xs text-slate-500 font-medium truncate mt-0.5">
              ${sub}
            </div>
          </div>
          <span class="shrink-0 text-3xs font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">
            ${curStr}
          </span>
        </div>
      `;
    });
  }

  dropdown.innerHTML = html;
}

function populateCoffeeAssignVisitorSelect(preselectedVisitorId = null) {
  const select = document.getElementById('cfa-visitor-select');
  if (!select) return;

  select.innerHTML = '<option value="">-- ビジターを選択 (最新順) --</option>';

  const { unassigned, assigned } = getSortedCoffeeCandidates(coffeeAssignSearchQuery);

  // Group 1: 候補ビジター (優先・最新順)
  if (unassigned.length > 0) {
    const optGroup1 = document.createElement('optgroup');
    optGroup1.label = `候補ビジター (${unassigned.length}名 - 最新順)`;
    unassigned.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      const inviterStr = v.inviter ? ` (紹介: ${v.inviter})` : '';
      const eventStr = v.eventDate ? ` [定例会: ${formatShortDate(v.eventDate)}]` : ' [未定]';
      opt.textContent = `${v.name || '名称未定'}${inviterStr}${eventStr}`;
      if (preselectedVisitorId && String(v.id) === String(preselectedVisitorId)) {
        opt.selected = true;
      }
      optGroup1.appendChild(opt);
    });
    select.appendChild(optGroup1);
  }

  // Group 2: その他・日程変更ビジター (最新順)
  if (assigned.length > 0) {
    const optGroup2 = document.createElement('optgroup');
    optGroup2.label = `設定済み・変更 (${assigned.length}名 - 最新順)`;
    assigned.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      const curDate = v.step1CoffeeDate || v.step1_coffee_date || '';
      const curStr = curDate ? ` (現: ${formatShortDate(curDate)})` : '';
      opt.textContent = `${v.name || '名称未定'}${curStr}`;
      if (preselectedVisitorId && String(v.id) === String(preselectedVisitorId)) {
        opt.selected = true;
      }
      optGroup2.appendChild(opt);
    });
    select.appendChild(optGroup2);
  }

  onCoffeeAssignVisitorChanged();
}

function onCoffeeAssignVisitorChanged() {
  const select = document.getElementById('cfa-visitor-select');
  const preview = document.getElementById('cfa-visitor-preview');
  if (!select || !preview) return;

  const vId = select.value;
  if (!vId) {
    preview.classList.add('hidden');
    return;
  }

  const allVisitors = (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors))
    ? cachedAllVisitors
    : [];
  const v = allVisitors.find(item => String(item.id) === String(vId));

  if (!v) {
    preview.classList.add('hidden');
    return;
  }

  const nameEl = document.getElementById('cfa-preview-name');
  const furiganaEl = document.getElementById('cfa-preview-furigana');
  const badgeEl = document.getElementById('cfa-preview-step1-badge');
  const inviterEl = document.getElementById('cfa-preview-inviter');
  const eventDateEl = document.getElementById('cfa-preview-event-date');
  const companyEl = document.getElementById('cfa-preview-company');

  if (nameEl) nameEl.textContent = v.name || '-';
  if (furiganaEl) furiganaEl.textContent = v.furigana ? `(${v.furigana})` : '';
  if (inviterEl) inviterEl.textContent = v.inviter || '-';
  if (eventDateEl) eventDateEl.textContent = v.eventDate ? formatShortDate(v.eventDate) : '申込前（未定）';
  if (companyEl) companyEl.textContent = v.company || '-';

  if (badgeEl) {
    const curDate = v.step1CoffeeDate || v.step1_coffee_date;
    if (curDate) {
      badgeEl.className = 'text-3xs px-2 py-0.5 rounded-full font-bold bg-slate-100 text-slate-700 border border-slate-200';
      badgeEl.textContent = `現予定: ${formatShortDate(curDate)}`;
    } else {
      badgeEl.className = 'text-3xs px-2 py-0.5 rounded-full font-bold bg-blue-50 text-blue-700 border border-blue-200';
      badgeEl.textContent = '未予約';
    }
  }

  preview.classList.remove('hidden');
}

async function submitCoffeeAssign() {
  const select = document.getElementById('cfa-visitor-select');
  const dateInput = document.getElementById('cfa-target-date');
  const createPlanCheckbox = document.getElementById('cfa-create-action-plan');

  const visitorId = select ? select.value : null;
  const targetDate = dateInput ? dateInput.value : null;

  if (!visitorId) {
    alert('ビジターを選択してください');
    return;
  }
  if (!targetDate) {
    alert('日程が指定されていません');
    return;
  }

  const submitBtn = document.getElementById('btn-cfa-submit');
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 登録中...';
  }

  try {
    // 1. Update visitor status: step1_coffee_date & step1_coffee
    if (typeof updateVisitorStatusApi === 'function' || typeof ApiService !== 'undefined') {
      await ApiService.call('updateVisitorStatusApi', visitorId, 'step1_coffee_date', targetDate);
      await ApiService.call('updateVisitorStatusApi', visitorId, 'step1_coffee', '予定');
    }

    // 2. Optionally create action plan for 12:00
    if (createPlanCheckbox && createPlanCheckbox.checked) {
      const planPayload = {
        visitor_id: visitorId,
        action_type: 'コーヒーミーティング',
        due_date: `${targetDate} 12:00`,
        title: '事前コーヒーミーティング (Zoom 12:00-12:30)',
        plan_details: '定例会参加前の事前ヒアリング＆WIIFM整理 (平日12:00-12:30)'
      };
      try {
        await ApiService.call('createActionPlanApi', planPayload);
      } catch (err) {
        console.warn('Action plan creation warning:', err);
      }
    }

    // 3. Update local cachedAllVisitors
    if (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors)) {
      const target = cachedAllVisitors.find(v => String(v.id) === String(visitorId));
      if (target) {
        target.step1Coffee = '予定';
        target.step1_coffee = '予定';
        target.step1CoffeeDate = targetDate;
        target.step1_coffee_date = targetDate;
      }
    }

    if (typeof showToast === 'function') {
      showToast(`☕ ${targetDate} 12:00〜12:30 にコーヒーミーティングを予約しました`, 'success');
    }

    closeCoffeeAssignModal();

    // Re-render coffee calendar and priority follow / visitors
    if (typeof renderCoffeeMeetingView === 'function') {
      renderCoffeeMeetingView();
    }

    // 4. If currently viewing Visitor Detail View, immediately refresh it
    if (typeof currentVdVisitorId !== 'undefined' && currentVdVisitorId && String(currentVdVisitorId) === String(visitorId)) {
      if (typeof openVisitorDetailView === 'function') {
        openVisitorDetailView(visitorId, false, false);
      }
    }
  } catch (error) {
    console.error('Failed to assign coffee meeting slot:', error);
    alert('予約登録に失敗しました: ' + (error.message || '通信エラー'));
  } finally {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> 予約を確定する';
    }
  }
}

// Global click listener to close autocomplete dropdown
if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
  document.addEventListener('click', function(e) {
    const container = document.getElementById('modal-coffee-assign');
    if (!container || container.style.display === 'none') return;
    const dropdown = document.getElementById('cfa-autocomplete-dropdown');
    const searchInput = document.getElementById('cfa-visitor-search');
    if (dropdown && !dropdown.contains(e.target) && e.target !== searchInput) {
      dropdown.classList.add('hidden');
    }
  });
}

// Global Exports
window.openCoffeeAssignModal = openCoffeeAssignModal;
window.closeCoffeeAssignModal = closeCoffeeAssignModal;
window.filterCoffeeAssignVisitors = filterCoffeeAssignVisitors;
window.handleCoffeeVisitorSearchInput = handleCoffeeVisitorSearchInput;
window.showCoffeeAutocompleteDropdown = showCoffeeAutocompleteDropdown;
window.hideCoffeeAutocompleteDropdown = hideCoffeeAutocompleteDropdown;
window.selectCoffeeAssignVisitor = selectCoffeeAssignVisitor;
window.clearCoffeeAssignSearch = clearCoffeeAssignSearch;
window.populateCoffeeAssignVisitorSelect = populateCoffeeAssignVisitorSelect;
window.onCoffeeAssignVisitorChanged = onCoffeeAssignVisitorChanged;
window.onCoffeeAssignDateChanged = onCoffeeAssignDateChanged;
window.setQuickCoffeeDate = setQuickCoffeeDate;
window.submitCoffeeAssign = submitCoffeeAssign;
</script>
