  function initReportManager() {
    ensureReportCodeEditors();
    fetchReportTemplatesData(false);
  }

  function ensureReportCodeEditors() {
    // 1. Quill WYSIWYG Editor (初心者向け見たまま編集)
    const quillEl = document.getElementById('rm-email-quill-editor');
    if (quillEl && !reportEmailQuill && typeof Quill !== 'undefined') {
      reportEmailQuill = new Quill('#rm-email-quill-editor', {
        theme: 'snow',
        placeholder: 'HTMLメール本文をWord感覚でここに入力してください...',
        modules: {
          toolbar: [
            [{ 'header': [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'color': [] }, { 'background': [] }],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            ['link', 'clean']
          ]
        }
      });
      reportEmailQuill.on('text-change', () => {
        if (isSyncingEditor) return;
        const html = reportEmailQuill.root.innerHTML;
        const emailTextarea = document.getElementById('rm-email-body');
        if (emailTextarea) emailTextarea.value = html;
        if (reportEmailCodeMirror && reportEmailCodeMirror.getValue() !== html) {
          isSyncingEditor = true;
          reportEmailCodeMirror.setValue(html);
          isSyncingEditor = false;
        }
        updateReportEditorStats('email');
        updateReportPreview();
      });
    }

    // 2. CodeMirror Editor (HTMLコード直接編集)
    const emailTextarea = document.getElementById('rm-email-body');
    if (emailTextarea && !reportEmailCodeMirror && typeof CodeMirror !== 'undefined') {
      reportEmailCodeMirror = CodeMirror.fromTextArea(emailTextarea, {
        mode: 'htmlmixed',
        lineNumbers: true,
        autoCloseTags: true,
        matchBrackets: true,
        styleActiveLine: true,
        lineWrapping: true,
        indentUnit: 2,
        tabSize: 2
      });
      reportEmailCodeMirror.on('change', () => {
        if (isSyncingEditor) return;
        const val = reportEmailCodeMirror.getValue();
        emailTextarea.value = val;
        if (reportEmailQuill) {
          isSyncingEditor = true;
          reportEmailQuill.root.innerHTML = val;
          isSyncingEditor = false;
        }
        updateReportEditorStats('email');
        updateReportPreview();
      });
    }

    // 3. Line CodeMirror
    const lineTextarea = document.getElementById('rm-line-body');
    if (lineTextarea && !reportLineCodeMirror && typeof CodeMirror !== 'undefined') {
      reportLineCodeMirror = CodeMirror.fromTextArea(lineTextarea, {
        mode: null,
        lineNumbers: true,
        lineWrapping: true,
        styleActiveLine: true
      });
      reportLineCodeMirror.on('change', () => {
        lineTextarea.value = reportLineCodeMirror.getValue();
        updateReportEditorStats('line');
        updateReportPreview();
      });
    }
  }

  function switchEmailEditorMode(mode) {
    currentEmailEditorMode = mode;
    const wysiwygContainer = document.getElementById('rm-email-wysiwyg-container');
    const codeContainer = document.getElementById('rm-email-code-container');
    const tabWysiwyg = document.getElementById('rm-email-tab-wysiwyg');
    const tabCode = document.getElementById('rm-email-tab-code');

    if (mode === 'wysiwyg') {
      if (wysiwygContainer) wysiwygContainer.style.display = 'block';
      if (codeContainer) codeContainer.style.display = 'none';
      if (tabWysiwyg) tabWysiwyg.className = 'editor-mode-tab-btn active';
      if (tabCode) tabCode.className = 'editor-mode-tab-btn';
      if (reportEmailQuill && reportEmailCodeMirror) {
        isSyncingEditor = true;
        reportEmailQuill.root.innerHTML = reportEmailCodeMirror.getValue();
        isSyncingEditor = false;
      }
    } else {
      if (wysiwygContainer) wysiwygContainer.style.display = 'none';
      if (codeContainer) codeContainer.style.display = 'block';
      if (tabWysiwyg) tabWysiwyg.className = 'editor-mode-tab-btn';
      if (tabCode) tabCode.className = 'editor-mode-tab-btn active';
      if (reportEmailQuill && reportEmailCodeMirror) {
        isSyncingEditor = true;
        reportEmailCodeMirror.setValue(reportEmailQuill.root.innerHTML);
        isSyncingEditor = false;
      }
      refreshReportEditors();
    }
    updateReportPreview();
  }

  function updateReportEditorStats(type) {
    if (type === 'email') {
      const val = reportEmailCodeMirror ? reportEmailCodeMirror.getValue() : (document.getElementById('rm-email-body')?.value || '');
      const lines = val ? val.split('\n').length : 0;
      const chars = val ? val.length : 0;
      const lEl = document.getElementById('rm-email-stat-lines');
      const cEl = document.getElementById('rm-email-stat-chars');
      const wEl = document.getElementById('rm-email-wysiwyg-stat-chars');
      if (lEl) lEl.innerText = `${lines} 行`;
      if (cEl) cEl.innerText = `${chars.toLocaleString()} 文字`;
      if (wEl) wEl.innerText = `${chars.toLocaleString()} 文字`;
    } else {
      const val = reportLineCodeMirror ? reportLineCodeMirror.getValue() : (document.getElementById('rm-line-body')?.value || '');
      const lines = val ? val.split('\n').length : 0;
      const chars = val ? val.length : 0;
      const lEl = document.getElementById('rm-line-stat-lines');
      const cEl = document.getElementById('rm-line-stat-chars');
      if (lEl) lEl.innerText = `${lines} 行`;
      if (cEl) cEl.innerText = `${chars.toLocaleString()} 文字`;
    }
  }

  function refreshReportEditors() {
    setTimeout(() => {
      if (reportEmailCodeMirror) reportEmailCodeMirror.refresh();
      if (reportLineCodeMirror) reportLineCodeMirror.refresh();
    }, 60);
  }

  function fetchReportTemplatesData(force = false) {
    if (!force && cachedReportTemplates && cachedReportTemplates.length >= 6) {
      renderReportManagerUI();
      return;
    }

    if (typeof ApiService !== 'undefined' && ApiService.call) {
      ApiService.call('getReportTemplatesApi').then(res => {
        if (res && res.templates) {
          cachedReportTemplates = res.templates;
        }
        renderReportManagerUI();
      }).catch(err => {
        console.error('Failed to load report templates:', err);
        renderReportManagerUI();
      });
    }
  }

    renderReportManagerUI();
    refreshReportEditors();
  }

      if (previewEmail) previewEmail.style.display = 'block';
      if (previewLine) previewLine.style.display = 'none';

      if (formLine) formLine.style.display = 'block';
      if (previewEmail) previewEmail.style.display = 'none';
      if (previewLine) previewLine.style.display = 'block';
    }

    refreshReportEditors();
    updateReportPreview();
  }

  function setReportEditorValues(emailBody, lineBody) {
    ensureReportCodeEditors();
    const emailTextarea = document.getElementById('rm-email-body');
    const lineTextarea = document.getElementById('rm-line-body');

    isSyncingEditor = true;
    if (emailTextarea) emailTextarea.value = emailBody;
    if (reportEmailCodeMirror) {
      reportEmailCodeMirror.setValue(emailBody);
      reportEmailCodeMirror.clearHistory();
    }
    if (reportEmailQuill) {
      reportEmailQuill.root.innerHTML = emailBody;
    }

    if (lineTextarea) lineTextarea.value = lineBody;
    if (reportLineCodeMirror) {
      reportLineCodeMirror.setValue(lineBody);
      reportLineCodeMirror.clearHistory();
    }
    isSyncingEditor = false;

    updateReportEditorStats('email');
    updateReportEditorStats('line');
    refreshReportEditors();
  }

  function getReportEmailBodyValue() {
    if (currentEmailEditorMode === 'wysiwyg' && reportEmailQuill) {
      return reportEmailQuill.root.innerHTML;
    }
    if (reportEmailCodeMirror) {
      return reportEmailCodeMirror.getValue();
    }
    return document.getElementById('rm-email-body')?.value || '';
  }

  function getReportLineBodyValue() {
    if (reportLineCodeMirror) {
      return reportLineCodeMirror.getValue();
    }
    return document.getElementById('rm-line-body')?.value || '';
  }

  function renderPlaceholderChips() {
    const tags = REPORT_TAGS[currentSelectedReportId] || [];
    const emailContainer = document.getElementById('rm-email-placeholder-chips');
    const lineContainer = document.getElementById('rm-line-placeholder-chips');

    const makeChips = (targetInputId) => {
      return tags.map(item => `
        <button type="button" onclick="insertTagIntoTextarea('${targetInputId}', '${item.tag}')" class="px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-mono border border-slate-200/80 transition cursor-pointer" title="${item.label}">
          ${escapeHtml(item.tag)}
        </button>
      `).join('');
    };

    if (emailContainer) emailContainer.innerHTML = makeChips('rm-email-body');
    if (lineContainer) lineContainer.innerHTML = makeChips('rm-line-body');
  }

  function insertTagIntoTextarea(targetId, tag) {
    if (targetId === 'rm-email-body') {
      if (currentEmailEditorMode === 'wysiwyg' && reportEmailQuill) {
        const range = reportEmailQuill.getSelection(true);
        const index = range ? range.index : reportEmailQuill.getLength();
        reportEmailQuill.insertText(index, tag, 'user');
        reportEmailQuill.setSelection(index + tag.length, 0, 'user');
        reportEmailQuill.focus();
        updateReportEditorStats('email');
        updateReportPreview();
        return;
      }

      if (reportEmailCodeMirror) {
        reportEmailCodeMirror.replaceSelection(tag);
        reportEmailCodeMirror.focus();
        updateReportEditorStats('email');
        updateReportPreview();
        return;
      }
    }

    if (targetId === 'rm-line-body' && reportLineCodeMirror) {
      reportLineCodeMirror.replaceSelection(tag);
      reportLineCodeMirror.focus();
      updateReportEditorStats('line');
      updateReportPreview();
      return;
    }

    const textarea = document.getElementById(targetId);
    if (!textarea) return;

    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const val = textarea.value;
    textarea.value = val.substring(0, start) + tag + val.substring(end);
    textarea.selectionStart = textarea.selectionEnd = start + tag.length;
    textarea.focus();
    updateReportPreview();
  }

  function insertEmojiIntoLine(emoji) {
    insertTagIntoTextarea('rm-line-body', emoji);
  }

  function execEmailEditorAction(action) {
    if (!reportEmailCodeMirror) return;

    const cm = reportEmailCodeMirror;
    const selected = cm.getSelection();

    switch (action) {
      case 'bold':
        cm.replaceSelection(selected ? `<strong>${selected}</strong>` : '<strong>太字テキスト</strong>');
        break;
      case 'link':
        cm.replaceSelection(selected ? `<a href="{{ダッシュボードURL}}" style="color:#0071e3; font-weight:bold; text-decoration:underline;">${selected}</a>` : `<a href="{{ダッシュボードURL}}" style="color:#0071e3; font-weight:bold; text-decoration:underline;">詳細はこちら</a>`);
        break;
      case 'h3':
        cm.replaceSelection(selected ? `<h3 style="font-size:15px; font-weight:800; color:#0f172a; margin:16px 0 8px 0;">${selected}</h3>` : `<h3 style="font-size:15px; font-weight:800; color:#0f172a; margin:16px 0 8px 0;">見出しタイトル</h3>`);
        break;
      case 'p':
        cm.replaceSelection(selected ? `<p style="font-size:13px; line-height:1.65; color:#334155; margin:0 0 12px 0;">${selected}</p>` : `<p style="font-size:13px; line-height:1.65; color:#334155; margin:0 0 12px 0;">段落テキスト</p>`);
        break;
      case 'table':
        cm.replaceSelection(`<table style="width:100%; font-size:12px; border-collapse:collapse; margin:12px 0;">\n  <tr style="background:#f1f5f9;">\n    <th style="padding:8px 10px; text-align:left;">項目</th>\n    <th style="padding:8px 10px; text-align:left;">内容</th>\n  </tr>\n  <tr>\n    <td style="padding:8px 10px; border-bottom:1px solid #f1f5f9;">項目1</td>\n    <td style="padding:8px 10px; border-bottom:1px solid #f1f5f9;">内容1</td>\n  </tr>\n</table>`);
        break;
      case 'list':
        cm.replaceSelection(`<ul style="margin:8px 0; padding-left:20px; font-size:13px; color:#334155; line-height:1.6;">\n  <li>リスト項目1</li>\n  <li>リスト項目2</li>\n</ul>`);
        break;
      case 'undo':
        cm.undo();
        break;
      case 'redo':
        cm.redo();
        break;
    }
    cm.focus();
    updateReportPreview();
  }

  function execLineEditorAction(action) {
    if (!reportLineCodeMirror) return;
    if (action === 'undo') reportLineCodeMirror.undo();
    if (action === 'redo') reportLineCodeMirror.redo();
    reportLineCodeMirror.focus();
    updateReportPreview();
  }

    if (!reportEmailCodeMirror) return;

    // Clean indent formatter for HTML
    let formatted = '';
    let pad = 0;
    const lines = raw.split(/>\s*</);
    lines.forEach((node, index) => {
      let indent = 0;
      if (node.match(/.+<\/\w[^>]*>$/)) {
        indent = 0;
      } else if (node.match(/^<\/\w/)) {
        if (pad !== 0) pad -= 1;
      } else if (node.match(/^<\w[^>]*[^\/]>.*$/)) {
        indent = 1;
      } else {
        indent = 0;
      }

      let padding = '';
      for (let i = 0; i < pad; i++) padding += '  ';

      if (index === 0) {
        formatted += node + (lines.length > 1 ? '>\n' : '');
      } else if (index === lines.length - 1) {
        formatted += padding + '<' + node;
      } else {
        formatted += padding + '<' + node + '>\n';
      }
      pad += indent;
    });

    if (formatted.trim()) {
      reportEmailCodeMirror.setValue(formatted.trim());
      showToast('HTMLコードを整形しました', 'info');
    }
  }

  function replacePlaceholders(templateText, context) {
    if (!templateText) return '';
    let result = templateText;
    for (const [key, value] of Object.entries(context)) {
      result = result.split(key).join(value);
    }
    return result;
  }

  function updateReportPreview() {
    const context = getReportSampleContext();

    // 1. メールプレビュー
    const subjectRaw = document.getElementById('rm-email-subject')?.value || '';
    const bodyRaw = getReportEmailBodyValue();
    const replacedSubject = replacePlaceholders(subjectRaw, context);
    const replacedBody = replacePlaceholders(bodyRaw, context);

    const previewSubjectEl = document.getElementById('rm-preview-email-subject');
    if (previewSubjectEl) previewSubjectEl.innerText = replacedSubject;

    const iframe = document.getElementById('rm-email-preview-frame');
    if (iframe) {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(replacedBody);
      doc.close();
    }

    // 2. LINEプレビュー
    const lineRaw = getReportLineBodyValue();
    const replacedLine = replacePlaceholders(lineRaw, context);
    const linePreviewEl = document.getElementById('rm-preview-line-content');
    if (linePreviewEl) linePreviewEl.innerText = replacedLine;
  }

  function saveCurrentReportTemplate() {
    const t = getCurrentTemplate();
    const title = document.getElementById('rm-current-title')?.innerText || t.title;
    const isEnabled = document.getElementById('rm-enabled-toggle')?.checked ? 1 : 0;
    const schedType = document.getElementById('rm-schedule-type')?.value || 'weekly';
    const schedDay = document.getElementById('rm-schedule-day')?.value || 'Sun';
    const schedTime = document.getElementById('rm-schedule-time')?.value || '20:00';
    const recipients = document.getElementById('rm-email-recipients')?.value || 'info@k-d-o.biz';
    const subject = document.getElementById('rm-email-subject')?.value || '';
    const emailBody = getReportEmailBodyValue();
    const lineBody = getReportLineBodyValue();

    const payload = {
      id: currentSelectedReportId,
      title: title,
      schedule_type: schedType,
      schedule_day: schedDay,
      schedule_time: schedTime,
      is_enabled: isEnabled,
      default_recipients: recipients,
      email_subject: subject,
      email_html_body: emailBody,
      line_template_body: lineBody
    };

    if (typeof ApiService !== 'undefined' && ApiService.call) {
      ApiService.call('updateReportTemplateApi', payload).then(res => {
        if (res && res.success) {
          showToast('通知設定・テンプレートを保存しました', 'success');
          const idx = cachedReportTemplates.findIndex(x => x.id === currentSelectedReportId);
          if (idx !== -1) {
            cachedReportTemplates[idx] = res.template || payload;
          }
        }
      }).catch(err => {
        showToast('保存に失敗しました', 'error');
      });
    }
  }

  function resetCurrentReportTemplateToDefault() {
    if (!confirm('この通知テンプレートを推奨の完成形ひな形に戻しますか？\n（現在の編集内容は上書きされます）')) {
      return;
    }

    if (typeof ApiService !== 'undefined' && ApiService.call) {
      ApiService.call('resetReportTemplateApi', currentSelectedReportId).then(res => {
        if (res && res.success && res.template) {
          showToast('完成形ひな形を読み込みました', 'success');
          const idx = cachedReportTemplates.findIndex(x => x.id === currentSelectedReportId);
          if (idx !== -1) {
            cachedReportTemplates[idx] = res.template;
          } else {
            cachedReportTemplates.push(res.template);
          }
          renderReportManagerUI();
        }
      }).catch(err => {
        showToast('ひな形の読み込みに失敗しました', 'error');
      });
    }
  }

  function onReportToggleChange(checked) {
    const isEnabled = checked ? 1 : 0;
    const labelEl = document.getElementById('rm-enabled-label');
    if (labelEl) {
      labelEl.innerText = checked ? '有効 (配信対象)' : '無効 (停止中)';
      labelEl.className = checked ? 'text-xs font-bold text-emerald-600' : 'text-xs font-bold text-slate-400';
    }

    if (typeof ApiService !== 'undefined' && ApiService.call) {
      ApiService.call('toggleReportTemplateApi', currentSelectedReportId, isEnabled).then(res => {
        showToast(checked ? 'この通知を「有効」にしました' : 'この通知を「無効」にしました', 'info');
        const t = cachedReportTemplates.find(x => x.id === currentSelectedReportId);
        if (t) t.is_enabled = isEnabled;
        renderReportManagerUI();
      }).catch(() => {
        showToast('設定の変更に失敗しました', 'error');
      });
    }
  }

  function sendTestReportEmail() {
    const recipients = document.getElementById('rm-email-recipients')?.value || 'info@k-d-o.biz';
    const subjectRaw = document.getElementById('rm-email-subject')?.value || '';
    const bodyRaw = getReportEmailBodyValue();

    const context = getReportSampleContext();
    const replacedSubject = replacePlaceholders(subjectRaw, context);
    const replacedBody = replacePlaceholders(bodyRaw, context);

    if (!recipients) {
      showToast('送信先アドレスを入力してください', 'warning');
      return;
    }

    showToast('info@k-d-o.biz からテストメールを送信中...', 'info');
    const firstRecipient = recipients.split(',')[0].trim();

    if (typeof ApiService !== 'undefined' && ApiService.call) {
      ApiService.call('sendReportMailApi', firstRecipient, replacedSubject, replacedBody).then(res => {
        if (res && res.success) {
          showToast(`送信成功: ${firstRecipient} にメールを送信しました`, 'success');
        }
      }).catch(err => {
        showToast('メール送信に失敗しました', 'error');
      });
    }
  }

  function copyReplacedLineReportText() {
    const lineRaw = getReportLineBodyValue();
    const context = getReportSampleContext();
    const replacedLine = replacePlaceholders(lineRaw, context);

    if (!replacedLine) {
      showToast('コピーする文面がありません', 'warning');
      return;
    }

    navigator.clipboard.writeText(replacedLine).then(() => {
      showToast('LINE報告文をクリップボードにコピーしました！', 'success');
    }).catch(() => {
      showToast('コピーに失敗しました', 'error');
    });
  }
