<!-- Modal: アクション報告・完了登録 -->
<div id="modal-action-report" class="modal-overlay" style="display: none;">
  <div class="modal-card max-w-lg">
    <!-- Top-Right Close Button -->
    <button type="button" class="modal-close-btn" onclick="closeActionReportModal()" title="閉じる">&times;</button>

    <!-- Header -->
    <div class="modal-header pr-8 pb-3 mb-4 border-b border-slate-100">
      <h3 class="modal-title flex items-center gap-2 m-0 p-0 border-none">
        <i class="fa-solid fa-clipboard-check text-blue-600"></i> アクション報告・完了登録
      </h3>
    </div>

    <!-- Body -->
    <div class="modal-body space-y-4">
      <input type="hidden" id="report-ap-id">
      <input type="hidden" id="report-ap-visitor-id">

      <!-- Target Action Plan Preview Box -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 space-y-1.5 text-xs">
        <div class="flex items-center justify-between text-slate-500 font-bold">
          <span><i class="fa-regular fa-user mr-1"></i> <span id="report-ap-visitor-name" class="text-slate-800 text-sm font-extrabold">-</span></span>
          <span id="report-ap-due-badge" class="vd-ap-badge-date">-</span>
        </div>
        <div class="text-slate-600">
          <strong>担当者:</strong> <span id="report-ap-assignee" class="font-bold text-indigo-700">-</span>
        </div>
        <div class="bg-white border border-slate-200 rounded-lg p-2 text-slate-800 font-bold text-xs" id="report-ap-action-text">
          -
        </div>
      </div>

      <!-- Report Input Form -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1" for="report-ap-text">
          実施結果・報告内容 <span class="text-rose-500 font-normal">※必須</span>
        </label>
        <textarea id="report-ap-text" rows="4" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例：電話にてフォロー連絡実施。次回8/20定例会への参加を前向きに検討とのこと。1to1日程を来週水曜で調整中。"></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1" for="report-ap-reporter">
            報告者 / 確認者
          </label>
          <input type="text" id="report-ap-reporter" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="担当者または確認者名">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">
            完了ステータス
          </label>
          <div class="flex items-center gap-2 pt-2">
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" id="report-ap-is-completed" class="sr-only peer" checked onchange="updateReportCompletedLabel()">
              <div class="w-10 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-600"></div>
              <span class="ml-2 text-xs font-bold text-slate-800" id="report-ap-completed-label">完了にする</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer flex justify-end items-center gap-2 mt-5 pt-4 border-t border-slate-100">
      <button type="button" class="btn-action-secondary" style="width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px;" onclick="shareCurrentReportingPlan(event)" title="このアクションの共有URLをコピー">
        <i class="fa-solid fa-share-nodes text-blue-600 text-sm"></i>
      </button>
      <button type="button" class="btn-action-primary text-xs flex items-center justify-center gap-1.5 px-5 py-2 font-bold rounded-lg" id="btn-save-action-report" onclick="submitActionReport()">
        <i class="fa-solid fa-check"></i> 保存
      </button>
    </div>
  </div>
</div>
