<script>
  /* --- VIEW: Actions Management Controller --- */
  let cachedAllActionPlans = [];
  let currentActionsFilter = 'pending';

  function fetchActionsManagementData(forceRefresh = false) {
    if (!forceRefresh && cachedAllActionPlans && cachedAllActionPlans.length > 0) {
      filterActionsList();
      return;
    }
    showKanbanSkeleton();
    ApiService.call('getActionPlansApi', '')
      .then(res => {
        if (res && res.success) {
          cachedAllActionPlans = res.list || [];
          populateActionsAssigneeFilter();
          updateActionsKpisAndBadges();
          filterActionsList();
        }
      })
      .catch(handleError);
  }

  function showKanbanSkeleton() {
    ['overdue', 'pending', 'completed'].forEach(col => {
      const container = document.getElementById(`kanban-list-${col}`);
      if (container) {
        container.innerHTML = `
          <div class="skeleton skeleton-card" style="min-height: 100px; border-radius: 14px; margin-bottom: 10px;"></div>
          <div class="skeleton skeleton-card" style="min-height: 100px; border-radius: 14px; margin-bottom: 10px;"></div>
        `;
      }
    });
    const cardsContainer = document.getElementById('cards-actions-all');
    if (cardsContainer) {
      cardsContainer.innerHTML = `
        <div class="skeleton skeleton-card" style="min-height: 110px; border-radius: 14px; margin-bottom: 10px;"></div>
        <div class="skeleton skeleton-card" style="min-height: 110px; border-radius: 14px; margin-bottom: 10px;"></div>
      `;
    }
  }

  function updateActionsKpisAndBadges() {
    const list = cachedAllActionPlans || [];
    const todayStr = new Date().toISOString().slice(0, 10);

    const pendingList = list.filter(p => Number(p.is_completed) === 0);
    const overdueList = list.filter(p => Number(p.is_completed) === 0 && p.due_date && p.due_date < todayStr);
    const completedList = list.filter(p => Number(p.is_completed) === 1);

    const elPendingKpi = document.getElementById('actions-kpi-pending');
    const elOverdueKpi = document.getElementById('actions-kpi-overdue');
    const elCompletedKpi = document.getElementById('actions-kpi-completed');

    if (elPendingKpi) elPendingKpi.innerText = pendingList.length;
    if (elOverdueKpi) elOverdueKpi.innerText = overdueList.length;
    if (elCompletedKpi) elCompletedKpi.innerText = completedList.length;

    const bPending = document.getElementById('actions-badge-pending');
    const bOverdue = document.getElementById('actions-badge-overdue');
    const bAll = document.getElementById('actions-badge-all');
    const bCompleted = document.getElementById('actions-badge-completed');

    if (bPending) bPending.innerText = pendingList.length;
    if (bOverdue) bOverdue.innerText = overdueList.length;
    if (bAll) bAll.innerText = list.length;
    if (bCompleted) bCompleted.innerText = completedList.length;
  }

  function populateActionsAssigneeFilter() {
    const select = document.getElementById('actions-assignee-filter');
    if (!select) return;

    const currentVal = select.value;
    const assignees = new Set();
    (cachedAllActionPlans || []).forEach(p => {
      if (p.assignee_name && p.assignee_name.trim()) {
        assignees.add(p.assignee_name.trim());
      }
    });

    let html = '<option value="">担当者: 全員</option>';
    Array.from(assignees).sort().forEach(name => {
      html += `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`;
    });
    select.innerHTML = html;
    select.value = currentVal;
  }

  function setActionsStatusFilter(mode) {
    currentActionsFilter = mode;
    ['pending', 'overdue', 'all', 'completed'].forEach(m => {
      const btn = document.getElementById(`actions-filter-btn-${m}`);
      if (btn) {
        if (m === mode) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    });
    filterActionsList();
  }

  function filterActionsList() {
    const list = cachedAllActionPlans || [];
    const todayStr = new Date().toISOString().slice(0, 10);
    const search = (document.getElementById('actions-search-input')?.value || '').toLowerCase().trim();
    const assigneeFilter = (document.getElementById('actions-assignee-filter')?.value || '').trim();

    let filtered = list;

    // 1. Status Filter (Mobile tabs or KPI click)
    let mobileFiltered = list;
    if (currentActionsFilter === 'pending') {
      mobileFiltered = mobileFiltered.filter(p => Number(p.is_completed) === 0);
    } else if (currentActionsFilter === 'overdue') {
      mobileFiltered = mobileFiltered.filter(p => Number(p.is_completed) === 0 && p.due_date && p.due_date < todayStr);
    } else if (currentActionsFilter === 'completed') {
      mobileFiltered = mobileFiltered.filter(p => Number(p.is_completed) === 1);
    }

    // 2. Assignee Filter
    if (assigneeFilter) {
      filtered = filtered.filter(p => (p.assignee_name || '').trim() === assigneeFilter);
      mobileFiltered = mobileFiltered.filter(p => (p.assignee_name || '').trim() === assigneeFilter);
    }

    // 3. Search Query
    if (search) {
      const matcher = p => {
        const text = (p.action_text || '').toLowerCase();
        const vName = (p.visitor_name || '').toLowerCase();
        const vCompany = (p.visitor_company || '').toLowerCase();
        const assignee = (p.assignee_name || '').toLowerCase();
        const report = (p.report_text || '').toLowerCase();
        return text.includes(search) || vName.includes(search) || vCompany.includes(search) || assignee.includes(search) || report.includes(search);
      };
      filtered = filtered.filter(matcher);
      mobileFiltered = mobileFiltered.filter(matcher);
    }

    renderActionsKanbanAndCards(filtered, mobileFiltered);
  }

  function renderActionsKanbanAndCards(allFilteredList, mobileFilteredList) {
    const todayStr = new Date().toISOString().slice(0, 10);

    // Grouping for Kanban Columns
    const overdueItems = [];
    const pendingItems = [];
    const completedItems = [];

    (allFilteredList || []).forEach(p => {
      const isCompleted = Number(p.is_completed) === 1;
      const isOverdue = !isCompleted && p.due_date && p.due_date < todayStr;
      if (isCompleted) {
        completedItems.push(p);
      } else if (isOverdue) {
        overdueItems.push(p);
      } else {
        pendingItems.push(p);
      }
    });

    // Update Kanban Column Counts
    const countOverdueEl = document.getElementById('kanban-count-overdue');
    const countPendingEl = document.getElementById('kanban-count-pending');
    const countCompletedEl = document.getElementById('kanban-count-completed');
    if (countOverdueEl) countOverdueEl.innerText = overdueItems.length;
    if (countPendingEl) countPendingEl.innerText = pendingItems.length;
    if (countCompletedEl) countCompletedEl.innerText = completedItems.length;

    // Render Kanban Columns (PC)
    renderKanbanColumnList('kanban-list-overdue', overdueItems, 'overdue', '期限超過のアクションはありません');
    renderKanbanColumnList('kanban-list-pending', pendingItems, 'pending', '進行中のアクションはありません');
    renderKanbanColumnList('kanban-list-completed', completedItems, 'completed', '完了済みのアクションはありません');

    // Render Mobile Cards List
    renderMobileActionCards(mobileFilteredList);
  }

  function renderKanbanColumnList(containerId, items, columnType, emptyMsg) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';

    if (!items || items.length === 0) {
      container.innerHTML = `
        <div class="kanban-empty-placeholder">
          <i class="fa-solid ${columnType === 'overdue' ? 'fa-circle-check text-emerald-500' : 'fa-clipboard-list text-slate-300'} text-lg mb-1"></i>
          <div>${emptyMsg}</div>
        </div>
      `;
      return;
    }

    const todayStr = new Date().toISOString().slice(0, 10);

    items.forEach(p => {
      const isCompleted = Number(p.is_completed) === 1;
      const isOverdue = !isCompleted && p.due_date && p.due_date < todayStr;
      const isDueToday = !isCompleted && p.due_date && p.due_date === todayStr;

      let scheduleBadgeHtml = '';
      if (isCompleted) {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[11.5px] font-bold text-slate-500"><i class="fa-solid fa-circle text-[7px] text-emerald-500"></i><span>${p.due_date || '完了'}</span></span>`;
      } else if (isOverdue) {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[11.5px] font-bold text-slate-800"><i class="fa-solid fa-circle text-[7px] text-rose-500"></i><span>${p.due_date || '期日未定'}</span></span>`;
      } else if (isDueToday) {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[11.5px] font-bold text-slate-800"><i class="fa-solid fa-circle text-[7px] text-amber-500"></i><span>本日 (${p.due_date})</span></span>`;
      } else {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[11.5px] font-bold text-slate-800"><i class="fa-solid fa-circle text-[7px] text-blue-500"></i><span>${p.due_date || '期日未定'}</span></span>`;
      }

      const reportBoxHtml = p.report_text
        ? `<div class="dash-ap-card-report">
             <strong><i class="fa-regular fa-comment-dots text-emerald-600"></i> 報告:</strong> ${escapeHtml(p.report_text)}
             ${p.completed_by ? `<span class="text-slate-500 font-normal text-[10px] ml-1">(${escapeHtml(p.completed_by)})</span>` : ''}
           </div>`
        : '';

      const card = document.createElement('div');
      card.className = `kanban-card is-${columnType}`;
      card.onclick = function(e) {
        if (e.target.closest('button') || e.target.closest('a')) return;
        openVisitorDetailView(p.visitor_id);
      };

      card.innerHTML = `
        <div class="kanban-card-top">
          <div class="min-w-0 flex-1">
            <div class="kanban-card-title truncate">
              ${renderVisitorNameLinkHtml(p.visitor_id, p.visitor_name)}
            </div>
            ${p.visitor_company ? `<div class="kanban-card-sub truncate">${escapeHtml(p.visitor_company)}</div>` : ''}
          </div>
          ${renderRankBadgeHtml(p.feelAbc || '', 'small')}
        </div>

        <div class="kanban-card-action-text ${isCompleted ? 'completed' : ''}">
          ${escapeAndLinkify(p.action_text, true)}
        </div>
        ${reportBoxHtml}

        <div class="kanban-card-footer" onclick="event.stopPropagation()">
          <div class="kanban-card-meta">
            ${renderActionTypeBadgeHtml(p.action_type)}
            ${scheduleBadgeHtml}
            <span class="vd-ap-badge-user text-[10.5px] py-0.5 px-2"><i class="fa-regular fa-user text-[9px]"></i> ${escapeHtml(p.assignee_name || '担当未定')}</span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button type="button" class="btn-action-secondary vd-quick-chip text-[11px] px-2 py-1" onclick="shareActionPlan('${p.id}', '${p.visitor_id}', event)" title="共有URLをコピー">
              <i class="fa-solid fa-share-nodes text-blue-600"></i>
            </button>
            ${!isCompleted ? `
              <button type="button" class="btn-action-primary text-xs" style="padding: 4px 10px; font-size:11.5px; font-weight:700; border-radius:6px;" onclick="openActionReportModal('${p.id}', '${p.visitor_id}')">
                <i class="fa-solid fa-clipboard-check mr-1"></i> 報告する
              </button>
            ` : `
              <button type="button" class="btn-action-secondary text-xs" style="padding: 4px 8px; font-size:11px; font-weight:600; border-radius:6px;" onclick="openActionReportModal('${p.id}', '${p.visitor_id}')">
                <i class="fa-solid fa-check mr-1 text-emerald-600"></i> 確認
              </button>
            `}
          </div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  function renderMobileActionCards(list) {
    const cardsContainer = document.getElementById('cards-actions-all');
    if (!cardsContainer) return;
    cardsContainer.innerHTML = '';

    const todayStr = new Date().toISOString().slice(0, 10);

    if (!list || list.length === 0) {
      const emptyMsg = currentActionsFilter === 'overdue'
        ? '期限超過のアクションプランはありません（すべて順調です）'
        : (currentActionsFilter === 'completed' ? '完了済みのアクションプランはありません' : '該当するアクションプランはありません');

      cardsContainer.innerHTML = `
        <div style="grid-column: 1 / -1; text-align: center; color: #868e96; padding: 48px 16px; background: #f8fafc; border-radius: 16px; border: 1px dashed #cbd5e1;">
          <i class="fa-solid fa-clipboard-check text-3xl text-slate-300 mb-2"></i>
          <div class="font-bold text-sm text-slate-600">${emptyMsg}</div>
        </div>
      `;
      return;
    }

    list.forEach(p => {
      const isCompleted = Number(p.is_completed) === 1;
      const isOverdue = !isCompleted && p.due_date && p.due_date < todayStr;
      const isDueToday = !isCompleted && p.due_date && p.due_date === todayStr;

      let scheduleBadgeHtml = '';
      if (isCompleted) {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[12px] font-bold text-slate-500"><i class="fa-solid fa-circle text-[8px] text-emerald-500"></i><span>${p.due_date || '完了'}</span></span>`;
      } else if (isOverdue) {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[12px] font-bold text-slate-800"><i class="fa-solid fa-circle text-[8px] text-red-500"></i><span>${p.due_date || '期日未定'}</span></span>`;
      } else if (isDueToday) {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[12px] font-bold text-slate-800"><i class="fa-solid fa-circle text-[8px] text-amber-500"></i><span>${p.due_date}</span></span>`;
      } else {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[12px] font-bold text-slate-800"><i class="fa-solid fa-circle text-[8px] text-blue-500"></i><span>${p.due_date || '期日未定'}</span></span>`;
      }

      const reportBoxHtml = p.report_text
        ? `<div class="dash-ap-card-report">
             <strong><i class="fa-regular fa-comment-dots text-emerald-600"></i> 報告:</strong> ${escapeAndLinkify(p.report_text, true)}
             ${p.completed_by ? `<span class="text-slate-500 font-normal text-[10px] ml-1">(確認: ${escapeHtml(p.completed_by)})</span>` : ''}
           </div>`
        : '';

      const card = document.createElement('div');
      card.className = `dash-ap-card ${isCompleted ? 'is-completed' : (isOverdue ? 'is-overdue' : '')}`;
      card.onclick = function() {
        openVisitorDetailView(p.visitor_id);
      };

      card.innerHTML = `
        <div class="dash-ap-card-top-row">
          <div class="dash-ap-card-visitor-left">
            <div class="dash-ap-card-visitor-name">
              <i class="fa-solid fa-user-tag text-blue-600 text-sm"></i>
              <span>${escapeHtml(p.visitor_name || 'ビジター No.' + p.visitor_id)}</span>
            </div>
            ${p.visitor_company ? `<div class="dash-ap-card-visitor-sub">${escapeHtml(p.visitor_company)}</div>` : ''}
          </div>
          <div class="dash-ap-card-btn-right" onclick="event.stopPropagation()">
            ${!isCompleted ? `
              <button type="button" class="dash-ap-btn-report" onclick="openActionReportModal('${p.id}', '${p.visitor_id}')">
                <i class="fa-solid fa-clipboard-check"></i> 報告する
              </button>
            ` : `
              <button type="button" class="dash-ap-btn-confirmed" onclick="openActionReportModal('${p.id}', '${p.visitor_id}')">
                <i class="fa-solid fa-check text-emerald-600"></i> 確認
              </button>
            `}
          </div>
        </div>

        <div class="dash-ap-card-body">
          <div class="dash-ap-card-action ${isCompleted ? 'completed' : ''}">
            ${escapeAndLinkify(p.action_text, true)}
          </div>
          ${reportBoxHtml}
        </div>

        <div class="dash-ap-card-bottom-row">
          <div class="dash-ap-card-badges-left flex-wrap">
            ${renderActionTypeBadgeHtml(p.action_type)}
            ${scheduleBadgeHtml}
            <span class="vd-ap-badge-user" style="font-size:11px;"><i class="fa-regular fa-user"></i> ${escapeHtml(p.assignee_name || '担当未定')}</span>
          </div>
          <div class="dash-ap-card-tools-right" onclick="event.stopPropagation()">
            <button type="button" class="btn-action-secondary vd-quick-chip" style="font-size:11px; padding:3px 8px;" onclick="shareActionPlan('${p.id}', '${p.visitor_id}', event)" title="共有URLをコピー">
              <i class="fa-solid fa-share-nodes text-blue-600"></i> 共有
            </button>
            <span class="text-slate-300 text-sm ml-0.5"><i class="fa-solid fa-chevron-right"></i></span>
          </div>
        </div>
      `;
      cardsContainer.appendChild(card);
    });
  }
</script>
