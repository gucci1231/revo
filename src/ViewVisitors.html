<!-- VIEW 2: ビジター全一覧 (CRUD統合管理 - Apple Minimal & Clean) -->
<div id="view-visitors" class="view-content">
  <section class="section-card">
    <div class="section-header flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between p-4 md:p-5">
      <div class="flex items-center justify-between gap-3 w-full sm:w-auto">
        <div>
          <h2 class="section-title text-base md:text-lg font-bold text-slate-900 m-0">
            <i class="fa-solid fa-users text-slate-400"></i> 全ビジター統合管理名簿
          </h2>
          <div class="section-sub text-xs text-slate-400 mt-0.5">全ビジターのステータス・進捗管理と検索</div>
        </div>
        <button type="button" class="btn-create-visitor sm:hidden" onclick="openAddVisitorModal()">
          <i class="fa-solid fa-plus"></i> 新規追加
        </button>
      </div>

      <div class="table-filter-group">
        <div class="w-full sm:w-64">
          <input type="text" id="search-visitors-input" class="search-box" placeholder="🔍 氏名・会社名・招待者で検索..." onkeyup="filterAllVisitorsTable()">
        </div>
        <div class="date-range-box">
          <i class="fa-solid fa-calendar-range date-range-icon"></i>
          <input type="date" id="visitors-date-from" class="date-range-input" onchange="filterAllVisitorsTable()" title="開始日">
          <span class="date-range-sep">〜</span>
          <input type="date" id="visitors-date-to" class="date-range-input" onchange="filterAllVisitorsTable()" title="終了日">
          <button type="button" onclick="clearVisitorsDateFilter()" class="date-range-clear" title="期間クリア"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <button type="button" class="btn-create-visitor hidden sm:inline-flex" onclick="openAddVisitorModal()">
          <i class="fa-solid fa-plus"></i> 新規追加
        </button>
      </div>
    </div>

    <!-- ステータス絞り込みタブバー (Apple Pill Style) -->
    <div class="visitors-status-tabs">
      <button type="button" class="visitors-status-tab active" data-status-filter="all" onclick="setVisitorsStatusFilter('all')">
        すべて <span class="badge" id="count-filter-all">0</span>
      </button>
      <button type="button" class="visitors-status-tab" data-status-filter="considering" onclick="setVisitorsStatusFilter('considering')">
        検討中 <span class="badge" id="count-filter-considering">0</span>
      </button>
      <button type="button" class="visitors-status-tab" data-status-filter="joined" onclick="setVisitorsStatusFilter('joined')">
        入会済 <span class="badge" id="count-filter-joined">0</span>
      </button>
      <button type="button" class="visitors-status-tab" data-status-filter="attended" onclick="setVisitorsStatusFilter('attended')">
        出席済 <span class="badge" id="count-filter-attended">0</span>
      </button>
      <button type="button" class="visitors-status-tab" data-status-filter="hot" onclick="setVisitorsStatusFilter('hot')">
        HOT (A/B) <span class="badge" id="count-filter-hot">0</span>
      </button>
    </div>

    <div class="dash-ap-table-wrap table-container">
      <table>
        <thead>
          <tr>
            <th>参加日</th>
            <th class="text-center">ランク</th>
            <th>氏名</th>
            <th>会社名</th>
            <th>専門分野</th>
            <th>招待者</th>
            <th class="text-center">出欠</th>
          </tr>
        </thead>
        <tbody id="table-all-visitors"></tbody>
      </table>
    </div>

    <!-- スマホ用カード一覧 -->
    <div id="cards-all-visitors" class="dash-ap-grid dash-ap-cards-wrap"></div>
    <div class="pagination-bar">
      <div class="pagination-info" id="visitors-pagination-info">全 0 件中 0 - 0 件を表示</div>
      <div class="pagination-controls">
        <button type="button" class="btn-action-secondary" id="btn-visitors-prev-page" onclick="changeVisitorsPage(-1)"><i class="fa-solid fa-chevron-left"></i> 前の50件</button>
        <span id="visitors-pagination-page-num" class="pagination-page-num">1 / 1</span>
        <button type="button" class="btn-action-secondary" id="btn-visitors-next-page" onclick="changeVisitorsPage(1)">次の50件 <i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  </section>
</div>
