<script>
/**
 * Event & Training Calendar Controller (REvo Chapter & Kyoto CC Region)
 */

let allCalendarEvents = [];
let allTrainingEvents = []; // Backward compatibility
let currentCalendarMonth = new Date().toISOString().substring(0, 7);
let currentEventViewMode = 'calendar'; // 'calendar' (or 'month'), 'week', 'list'
let currentWeekStartDate = getSundayOfDate(new Date());
let selectedDayForModal = '';
let currentDetailTrainingEvent = null;
let currentEditingChapterEvent = null;
let currentSharingEvent = null;

let currentTrainingFilter = {
  sourceType: '',      // '' (all), 'meeting', 'chapter', 'training'
  format: 'all',       // 'all', 'online', 'inperson'
  month: '',           // '' for all, or 'YYYY-MM'
  category: '',
  keyword: '',
  scope: 'upcoming'    // for list view
};
let trainingSearchTimeout = null;

function getSundayOfDate(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0 is Sunday
  date.setDate(date.getDate() - day);
  return date;
}

function formatDateToIso(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function initTrainingView() {
  // Sync initial month if not set
  if (!currentCalendarMonth) {
    currentCalendarMonth = new Date().toISOString().substring(0, 7);
  }
  if (!currentWeekStartDate) {
    currentWeekStartDate = getSundayOfDate(new Date());
  }
  updateCalendarMonthHeader();
  loadCalendarAndEvents();
}

/**
 * Backward compatibility alias for loadCalendarAndEvents
 */
function loadTrainingEvents() {
  return loadCalendarAndEvents();
}

function setTrainingMonthFilter(month, btn) {
  if (month) {
    currentCalendarMonth = month;
    updateCalendarMonthHeader();
  }
  loadCalendarAndEvents();
}

/**
 * Update the period (month or week) label in calendar toolbar
 */
function updateCalendarMonthHeader() {
  const label = document.getElementById('calendar-current-month-label');
  if (!label) return;

  if (currentEventViewMode === 'week') {
    const sun = new Date(currentWeekStartDate);
    const sat = new Date(currentWeekStartDate);
    sat.setDate(sat.getDate() + 6);

    const sunM = sun.getMonth() + 1;
    const sunD = sun.getDate();
    const satM = sat.getMonth() + 1;
    const satD = sat.getDate();

    if (sun.getFullYear() === sat.getFullYear()) {
      if (sunM === satM) {
        label.innerText = `${sun.getFullYear()}年 ${sunM}月 ${sunD}日 - ${satD}日`;
      } else {
        label.innerText = `${sun.getFullYear()}年 ${sunM}月${sunD}日 - ${satM}月${satD}日`;
      }
    } else {
      label.innerText = `${sun.getFullYear()}年${sunM}月${sunD}日 - ${sat.getFullYear()}年${satM}月${satD}日`;
    }
  } else {
    if (!currentCalendarMonth) {
      currentCalendarMonth = new Date().toISOString().substring(0, 7);
    }
    const parts = currentCalendarMonth.split('-');
    label.innerText = `${parts[0]}年 ${parseInt(parts[1], 10)}月`;
  }
}

/**
 * Fetch calendar and event data
 */
async function loadCalendarAndEvents() {
  const loadingEl = document.getElementById('training-loading-state');
  const emptyEl = document.getElementById('training-empty-state');
  const gridEl = document.getElementById('calendar-grid');

  if (loadingEl) loadingEl.classList.remove('hidden');
  if (emptyEl) emptyEl.classList.add('hidden');

  try {
    const res = await ApiService.call('getCalendarEventsApi', {
      month: currentCalendarMonth,
      format: currentTrainingFilter.format !== 'all' ? currentTrainingFilter.format : '',
      source_type: currentTrainingFilter.sourceType,
      keyword: currentTrainingFilter.keyword
    });

    if (loadingEl) loadingEl.classList.add('hidden');

    if (res && res.success !== false) {
      const data = res.data || res;
      allCalendarEvents = data.events || [];
      allTrainingEvents = allCalendarEvents.filter(e => e.source_type === 'training');

      // Render KPIs
      renderTrainingKpis(data.summary);

      // Render Active View
      if (currentEventViewMode === 'week') {
        renderWeekView();
      } else if (currentEventViewMode === 'list') {
        renderFilteredTrainingEvents();
      } else {
        renderCalendarGrid();
      }

      // Check URL deep link for opening event modal
      checkUrlEventDeepLink();
    } else {
      if (emptyEl) emptyEl.classList.remove('hidden');
      if (gridEl) {
        gridEl.innerHTML = `
          <div class="col-span-7 py-20 text-center bg-white text-xs text-slate-400">
            予定データの取得に失敗しました
          </div>
        `;
      }
    }
  } catch (err) {
    console.error('Failed to load calendar events:', err);
    if (loadingEl) loadingEl.classList.add('hidden');
    if (emptyEl) emptyEl.classList.remove('hidden');
    showToast('イベント情報の読み込みに失敗しました', 'error');
  }
}

/**
 * Universal Period Navigation (works for both Month & Week modes)
 */
function navigateCalendarPeriod(delta) {
  if (currentEventViewMode === 'week') {
    navigateCalendarWeek(delta);
  } else {
    navigateCalendarMonth(delta);
  }
}

function jumpToCurrentCalendarPeriod() {
  if (currentEventViewMode === 'week') {
    jumpToCurrentWeek();
  } else {
    jumpToCurrentMonth();
  }
}

/**
 * Navigate calendar week (delta = -1 or +1)
 */
function navigateCalendarWeek(delta) {
  const current = new Date(currentWeekStartDate);
  current.setDate(current.getDate() + (delta * 7));
  currentWeekStartDate = current;

  // Determine the primary month of this week (use Wednesday as midpoint)
  const midWeek = new Date(currentWeekStartDate);
  midWeek.setDate(midWeek.getDate() + 3);
  const midMonth = `${midWeek.getFullYear()}-${String(midWeek.getMonth() + 1).padStart(2, '0')}`;

  updateCalendarMonthHeader();

  if (midMonth !== currentCalendarMonth) {
    currentCalendarMonth = midMonth;
    loadCalendarAndEvents();
  } else {
    renderWeekView();
  }
}

/**
 * Jump back to current week
 */
function jumpToCurrentWeek() {
  currentWeekStartDate = getSundayOfDate(new Date());
  const now = new Date();
  currentCalendarMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  updateCalendarMonthHeader();
  loadCalendarAndEvents();
}

/**
 * Navigate calendar month (delta = -1 or +1)
 */
function navigateCalendarMonth(delta) {
  const parts = currentCalendarMonth.split('-').map(Number);
  const d = new Date(parts[0], parts[1] - 1 + delta, 1);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  currentCalendarMonth = `${y}-${m}`;
  updateCalendarMonthHeader();
  loadCalendarAndEvents();
}

/**
 * Jump back to current real-world month
 */
function jumpToCurrentMonth() {
  currentCalendarMonth = new Date().toISOString().substring(0, 7);
  updateCalendarMonthHeader();
  loadCalendarAndEvents();
}

/**
 * Set Event View Mode (Month vs Week vs List)
 */
function setEventViewMode(mode) {
  // Normalize 'calendar' or 'month'
  if (mode === 'calendar') mode = 'month';
  currentEventViewMode = mode;

  const calContainer = document.getElementById('calendar-view-container');
  const weekContainer = document.getElementById('week-view-container');
  const listContainer = document.getElementById('list-view-container');
  const calToolbar = document.getElementById('calendar-month-toolbar');
  const listToolbar = document.getElementById('list-mode-toolbar');

  const btnMonth = document.getElementById('btn-view-mode-calendar');
  const btnWeek = document.getElementById('btn-view-mode-week');
  const btnList = document.getElementById('btn-view-mode-list');
  const btnJumpToday = document.getElementById('btn-calendar-jump-today');

  const activeBtnClass = 'px-3 py-1.5 rounded-md transition-all bg-white text-slate-900 shadow-xs font-black flex items-center gap-1.5 cursor-pointer';
  const inactiveBtnClass = 'px-3 py-1.5 rounded-md transition-all hover:text-slate-900 text-slate-600 flex items-center gap-1.5 font-bold cursor-pointer';

  if (mode === 'month') {
    if (calContainer) calContainer.classList.remove('hidden');
    if (weekContainer) weekContainer.classList.add('hidden');
    if (listContainer) listContainer.classList.add('hidden');
    if (calToolbar) calToolbar.classList.remove('hidden');
    if (listToolbar) listToolbar.classList.add('hidden');

    if (btnMonth) btnMonth.className = activeBtnClass;
    if (btnWeek) btnWeek.className = inactiveBtnClass;
    if (btnList) btnList.className = inactiveBtnClass;
    if (btnJumpToday) btnJumpToday.innerText = '今月';

    updateCalendarMonthHeader();
    renderCalendarGrid();
  } else if (mode === 'week') {
    if (calContainer) calContainer.classList.add('hidden');
    if (weekContainer) weekContainer.classList.remove('hidden');
    if (listContainer) listContainer.classList.add('hidden');
    if (calToolbar) calToolbar.classList.remove('hidden');
    if (listToolbar) listToolbar.classList.add('hidden');

    if (btnMonth) btnMonth.className = inactiveBtnClass;
    if (btnWeek) btnWeek.className = activeBtnClass;
    if (btnList) btnList.className = inactiveBtnClass;
    if (btnJumpToday) btnJumpToday.innerText = '今週';

    updateCalendarMonthHeader();
    renderWeekView();
  } else {
    // List mode
    if (calContainer) calContainer.classList.add('hidden');
    if (weekContainer) weekContainer.classList.add('hidden');
    if (listContainer) listContainer.classList.remove('hidden');
    if (calToolbar) calToolbar.classList.add('hidden');
    if (listToolbar) listToolbar.classList.remove('hidden');

    if (btnMonth) btnMonth.className = inactiveBtnClass;
    if (btnWeek) btnWeek.className = inactiveBtnClass;
    if (btnList) btnList.className = activeBtnClass;

    renderFilteredTrainingEvents();
  }
}

/**
 * Source Type Filter (All, Meeting, Chapter, Training)
 */
function setEventSourceFilter(type, btn) {
  currentTrainingFilter.sourceType = type;
  const container = document.getElementById('event-source-filters');
  if (container) {
    container.querySelectorAll('button').forEach(b => {
      b.className = 'px-2.5 py-1 rounded-md transition-all hover:text-slate-900 text-slate-600 flex items-center gap-1 cursor-pointer';
    });
    if (btn) {
      btn.className = 'px-2.5 py-1 rounded-md transition-all active-source-pill bg-white text-slate-900 shadow-xs font-bold flex items-center gap-1 cursor-pointer';
    }
  }
  loadCalendarAndEvents();
}

/**
 * Format Filter (All, Online, In-person)
 */
function setTrainingFormatFilter(format, btn) {
  currentTrainingFilter.format = format;
  const container = document.getElementById('training-format-filters');
  if (container) {
    container.querySelectorAll('button').forEach(b => {
      b.className = 'px-2 py-1 rounded-md transition-all hover:text-slate-900 text-slate-600 cursor-pointer';
    });
    if (btn) {
      btn.className = 'px-2 py-1 rounded-md transition-all bg-white text-slate-900 shadow-xs font-bold cursor-pointer';
    }
  }
  loadCalendarAndEvents();
}

/**
 * Keyword search with debounce
 */
function debounceTrainingFilter() {
  clearTimeout(trainingSearchTimeout);
  trainingSearchTimeout = setTimeout(() => {
    const input = document.getElementById('training-search-input');
    currentTrainingFilter.keyword = input ? input.value.trim().toLowerCase() : '';
    loadCalendarAndEvents();
  }, 250);
}

/**
 * Render Weekly Calendar View (Apple Calendar Style Time-Aware Timeline)
 */
function renderWeekView() {
  const weekGrid = document.getElementById('week-grid');
  if (!weekGrid) return;

  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  const todayStr = new Date().toISOString().substring(0, 10);
  const now = new Date();
  const currentHour = now.getHours();
  const currentMinutes = now.getMinutes();

  // Timeline configuration (06:00 to 22:00 = 17 hours)
  const START_HOUR = 6;
  const END_HOUR = 22;
  const TOTAL_HOURS = END_HOUR - START_HOUR + 1;
  const HOUR_HEIGHT = 56; // px per hour
  const TOTAL_HEIGHT = TOTAL_HOURS * HOUR_HEIGHT;

  // Group events by YYYY-MM-DD
  const eventsByDate = {};
  allCalendarEvents.forEach(ev => {
    if (!ev.start_datetime) return;
    const dateKey = ev.start_datetime.substring(0, 10);
    if (!eventsByDate[dateKey]) eventsByDate[dateKey] = [];
    eventsByDate[dateKey].push(ev);
  });

  const startDate = new Date(currentWeekStartDate);

  // 1. Build Day Header Cells (Top Bar)
  let headerColsHtml = '';
  const daysMeta = [];

  for (let i = 0; i < 7; i++) {
    const dayDate = new Date(startDate);
    dayDate.setDate(dayDate.getDate() + i);

    const dateKey = formatDateToIso(dayDate);
    const dayOfWeek = dayDate.getDay();
    const dayName = dayNames[dayOfWeek];
    const dayNum = dayDate.getDate();
    const isToday = dateKey === todayStr;
    const isThursday = dayOfWeek === 4;

    daysMeta.push({ dayDate, dateKey, dayOfWeek, dayName, dayNum, isToday, isThursday });

    let dayNameColor = 'text-slate-500';
    let dayNumDisplay = `<span class="text-sm font-semibold font-mono tabular-nums text-slate-800">${dayNum}</span>`;

    if (dayOfWeek === 0) {
      dayNameColor = 'text-rose-500 font-bold';
      dayNumDisplay = `<span class="text-sm font-semibold font-mono tabular-nums text-rose-500">${dayNum}</span>`;
    } else if (dayOfWeek === 6) {
      dayNameColor = 'text-blue-500 font-bold';
      dayNumDisplay = `<span class="text-sm font-semibold font-mono tabular-nums text-blue-500">${dayNum}</span>`;
    } else if (isThursday) {
      dayNameColor = 'text-blue-600 font-bold';
      dayNumDisplay = `<span class="text-sm font-bold font-mono tabular-nums text-blue-600">${dayNum}</span>`;
    }

    if (isToday) {
      dayNameColor = 'text-blue-600 font-bold';
      dayNumDisplay = `<span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-2xs font-mono tabular-nums">${dayNum}</span>`;
    }

    headerColsHtml += `
      <div class="flex-1 min-w-[110px] sm:min-w-[120px] p-2 text-center border-r border-slate-200 last:border-r-0 ${isToday ? 'bg-blue-50/30' : (isThursday ? 'bg-blue-50/15' : 'bg-white')} flex items-center justify-between group">
        <div class="flex items-center gap-1.5 mx-auto">
          <span class="text-xs ${dayNameColor}">${dayName}</span>
          ${dayNumDisplay}
          ${isThursday ? '<span class="text-3xs font-extrabold text-blue-600 hidden xl:inline ml-0.5">定例会</span>' : ''}
        </div>
        <button type="button" onclick="openChapterEventModalOnDate('${dateKey}', event)" class="w-5 h-5 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-700 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-3xs shrink-0 cursor-pointer" title="この日に予定を追加">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
    `;
  }

  // 2. Build Time Labels Column (Left Column)
  let timeLabelsHtml = '';
  for (let h = START_HOUR; h <= END_HOUR; h++) {
    const timeStr = `${String(h).padStart(2, '0')}:00`;
    timeLabelsHtml += `
      <div style="height: ${HOUR_HEIGHT}px;" class="relative border-b border-transparent">
        <span class="absolute -top-2.5 right-2 font-mono font-bold text-xs tabular-nums text-slate-400 select-none">
          ${timeStr}
        </span>
      </div>
    `;
  }

  // 3. Build 7 Day Timeline Columns with Placed Events
  let timelineColsHtml = '';

  daysMeta.forEach(meta => {
    const dayEvents = eventsByDate[meta.dateKey] || [];

    // Separate timed events vs all-day events
    const timedEvents = [];
    const allDayEvents = [];

    dayEvents.forEach(ev => {
      const timePart = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
      if (!timePart || timePart === '00:00' && (!ev.end_datetime || ev.end_datetime.substring(11, 16) === '00:00')) {
        allDayEvents.push(ev);
      } else {
        const [h, m] = timePart.split(':').map(Number);
        const startMin = h * 60 + m;

        let endMin = startMin + 60; // Default 1 hour duration
        if (ev.end_datetime && ev.end_datetime.length >= 16) {
          const [eh, em] = ev.end_datetime.substring(11, 16).split(':').map(Number);
          const calculatedEnd = eh * 60 + em;
          if (calculatedEnd > startMin) endMin = calculatedEnd;
        }

        timedEvents.push({ ev, startMin, endMin });
      }
    });

    // Layout algorithm for overlapping events within the day column
    timedEvents.sort((a, b) => a.startMin - b.startMin || (b.endMin - b.startMin) - (a.endMin - a.startMin));

    // Calculate positions
    const placedEventsHtml = timedEvents.map((item, idx, arr) => {
      const ev = item.ev;
      const startMinFromBase = item.startMin - (START_HOUR * 60);
      const durationMin = item.endMin - item.startMin;

      const topPx = Math.max(0, (startMinFromBase * HOUR_HEIGHT) / 60);
      const heightPx = Math.max(34, (durationMin * HOUR_HEIGHT) / 60);

      // Overlap detection
      const overlapping = arr.filter(other => (other.startMin < item.endMin && other.endMin > item.startMin));
      const colIndex = overlapping.indexOf(item);
      const colCount = Math.max(1, overlapping.length);

      const widthPct = 100 / colCount;
      const leftPct = colIndex * widthPct;

      const timeStr = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
      const endTimeStr = ev.end_datetime ? ` - ${ev.end_datetime.substring(11, 16)}` : '';

      let cardStyle = '';
      if (ev.source_type === 'meeting') {
        cardStyle = 'bg-blue-50/95 border-l-[3px] border-blue-600 text-blue-950 hover:bg-blue-100 hover:border-blue-700';
      } else if (ev.source_type === 'chapter') {
        cardStyle = 'bg-purple-50/95 border-l-[3px] border-purple-600 text-purple-950 hover:bg-purple-100 hover:border-purple-700';
      } else {
        cardStyle = 'bg-emerald-50/95 border-l-[3px] border-emerald-600 text-emerald-950 hover:bg-emerald-100 hover:border-emerald-700';
      }

      const visitorTag = (ev.visitor_count !== undefined && ev.visitor_count > 0)
        ? `<span class="inline-flex items-center gap-1 text-3xs font-extrabold text-blue-700 bg-blue-100/70 px-1 py-0.2 rounded shrink-0">V:${ev.visitor_count}</span>`
        : '';

      const formatTag = ev.is_online
        ? `<span class="text-3xs font-extrabold text-blue-600 bg-blue-100/60 px-1 py-0.2 rounded shrink-0">Zoom</span>`
        : '';

      return `
        <div onclick="handleCalendarEventClick('${ev.id}', event)"
             style="top: ${topPx}px; height: ${heightPx}px; left: calc(${leftPct}% + 1px); width: calc(${widthPct}% - 2px);"
             class="absolute z-10 rounded-lg p-1.5 sm:p-2 border ${cardStyle} shadow-2xs transition-all cursor-pointer overflow-hidden flex flex-col justify-between group/card hover:shadow-xs active:scale-[0.99]"
             title="${escapeHtml(ev.title)} (${timeStr}${endTimeStr})">

          <div>
            <!-- Unified Font Size: Time in tabular-nums and Title in same size -->
            <div class="flex items-center justify-between gap-1 mb-0.5">
              <div class="font-mono font-bold text-xs tabular-nums text-slate-800 flex items-center gap-1 shrink-0">
                <i class="fa-regular fa-clock text-slate-400 text-xs"></i>
                <span>${timeStr}${endTimeStr}</span>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                ${formatTag}
                ${visitorTag}
              </div>
            </div>

            <h5 class="font-bold text-xs text-slate-900 leading-snug line-clamp-2 group-hover/card:text-blue-700 transition-colors">
              ${escapeHtml(ev.title)}
            </h5>
          </div>

          ${ev.location_name && heightPx > 50 ? `
            <p class="text-3xs text-slate-500 truncate mt-0.5 flex items-center gap-1">
              <i class="fa-solid fa-location-dot text-slate-400 text-3xs shrink-0"></i>
              <span class="truncate">${escapeHtml(ev.location_name)}</span>
            </p>
          ` : ''}
        </div>
      `;
    }).join('');

    // Current Time Red Line Indicator (if today)
    let currentTimeIndicatorHtml = '';
    if (meta.isToday && currentHour >= START_HOUR && currentHour <= END_HOUR) {
      const nowMinFromBase = (currentHour * 60 + currentMinutes) - (START_HOUR * 60);
      const lineTopPx = (nowMinFromBase * HOUR_HEIGHT) / 60;
      currentTimeIndicatorHtml = `
        <div style="top: ${lineTopPx}px;" class="absolute left-0 right-0 z-20 pointer-events-none flex items-center">
          <div class="w-2.5 h-2.5 -ml-1.25 rounded-full bg-rose-500 ring-2 ring-white"></div>
          <div class="flex-1 h-0.5 bg-rose-500"></div>
        </div>
      `;
    }

    // Grid Horizontal Lines for each hour
    let hourLinesHtml = '';
    for (let h = 0; h < TOTAL_HOURS; h++) {
      hourLinesHtml += `
        <div style="height: ${HOUR_HEIGHT}px;" class="border-b border-slate-100 w-full hover:bg-slate-50/40 transition-colors cursor-pointer" onclick="openChapterEventModalOnDate('${meta.dateKey}', event)"></div>
      `;
    }

    timelineColsHtml += `
      <div class="flex-1 min-w-[110px] sm:min-w-[120px] relative border-r border-slate-100 last:border-r-0 ${meta.isToday ? 'bg-blue-50/10' : (meta.isThursday ? 'bg-blue-50/5' : 'bg-white')}" style="height: ${TOTAL_HEIGHT}px;">
        <!-- Hour Grid Lines -->
        <div class="absolute inset-0 pointer-events-auto">
          ${hourLinesHtml}
        </div>

        <!-- Current Time Line -->
        ${currentTimeIndicatorHtml}

        <!-- Positioned Events -->
        ${placedEventsHtml}
      </div>
    `;
  });

  // Assemble the Apple Calendar Week Timeline View
  weekGrid.innerHTML = `
    <div class="min-w-[770px] bg-white">
      <!-- Fixed Header Row (Days Sun - Sat) -->
      <div class="flex border-b border-slate-200 bg-slate-50/50 sticky top-0 z-20">
        <!-- Spacer for time axis -->
        <div class="w-14 sm:w-16 shrink-0 border-r border-slate-200 bg-slate-50/80 p-2 text-center text-3xs font-bold text-slate-400 flex items-center justify-center">
          <span>時刻</span>
        </div>
        <!-- 7 Day Headers -->
        <div class="flex-1 flex">
          ${headerColsHtml}
        </div>
      </div>

      <!-- Scrollable Timeline Body -->
      <div class="flex overflow-y-auto max-h-[580px] sm:max-h-[640px] relative">
        <!-- Time Axis Labels (Left Column) -->
        <div class="w-14 sm:w-16 shrink-0 border-r border-slate-200 bg-slate-50/40 select-none" style="height: ${TOTAL_HEIGHT}px;">
          ${timeLabelsHtml}
        </div>

        <!-- 7 Day Timeline Columns Grid -->
        <div class="flex-1 flex relative">
          ${timelineColsHtml}
        </div>
      </div>
    </div>
  `;
}

/**
 * Render the 7-day Month Grid (Apple Calendar Radical Minimalism)
 */
function renderCalendarGrid() {
  const gridEl = document.getElementById('calendar-grid');
  if (!gridEl) return;

  const [year, month] = currentCalendarMonth.split('-').map(Number);
  const firstDayObj = new Date(year, month - 1, 1);
  const lastDayObj = new Date(year, month, 0);

  const startDayOfWeek = firstDayObj.getDay(); // 0: Sun, 1: Mon, ... 4: Thu
  const totalDays = lastDayObj.getDate();

  // Days from previous month to fill the first row
  const prevMonthLastDay = new Date(year, month - 1, 0).getDate();

  const todayStr = new Date().toISOString().substring(0, 10);

  // Group events by YYYY-MM-DD
  const eventsByDate = {};
  allCalendarEvents.forEach(ev => {
    if (!ev.start_datetime) return;
    const dateKey = ev.start_datetime.substring(0, 10);
    if (!eventsByDate[dateKey]) eventsByDate[dateKey] = [];
    eventsByDate[dateKey].push(ev);
  });

  let cellsHtml = '';

  // 1. Prev month filler cells
  for (let i = startDayOfWeek - 1; i >= 0; i--) {
    const dayNum = prevMonthLastDay - i;
    const prevMonthNum = month - 1 === 0 ? 12 : month - 1;
    const prevYearNum = month - 1 === 0 ? year - 1 : year;
    const dateKey = `${prevYearNum}-${String(prevMonthNum).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dateKey] || [];

    cellsHtml += renderCalendarCell(dateKey, dayNum, dayEvents, false, dateKey === todayStr);
  }

  // 2. Current month cells
  for (let d = 1; d <= totalDays; d++) {
    const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dateKey] || [];

    cellsHtml += renderCalendarCell(dateKey, d, dayEvents, true, dateKey === todayStr);
  }

  // 3. Next month filler cells to complete the 7-col grid (up to 35 or 42 cells)
  const currentTotalCells = startDayOfWeek + totalDays;
  const targetTotal = currentTotalCells <= 35 ? 35 : 42;
  const nextMonthFill = targetTotal - currentTotalCells;

  for (let d = 1; d <= nextMonthFill; d++) {
    const nextMonthNum = month + 1 === 13 ? 1 : month + 1;
    const nextYearNum = month + 1 === 13 ? year + 1 : year;
    const dateKey = `${nextYearNum}-${String(nextMonthNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayEvents = eventsByDate[dateKey] || [];

    cellsHtml += renderCalendarCell(dateKey, d, dayEvents, false, dateKey === todayStr);
  }

  gridEl.innerHTML = cellsHtml;
}

/**
 * Helper to render individual calendar cell HTML (Apple Calendar Style)
 */
function renderCalendarCell(dateKey, dayNum, dayEvents, isCurrentMonth, isToday) {
  const dObj = new Date(dateKey.replace(/-/g, '/'));
  const dayOfWeek = dObj.getDay();
  const isThursday = dayOfWeek === 4;

  let bgClass = isCurrentMonth ? 'bg-white' : 'bg-slate-50/40';
  if (isToday) bgClass = 'bg-blue-50/20';

  let numDisplay = `<span class="text-xs sm:text-sm font-semibold font-mono tabular-nums text-slate-800">${dayNum}</span>`;

  if (!isCurrentMonth) {
    numDisplay = `<span class="text-xs sm:text-sm font-normal font-mono tabular-nums text-slate-300">${dayNum}</span>`;
  } else if (dayOfWeek === 0) {
    numDisplay = `<span class="text-xs sm:text-sm font-bold font-mono tabular-nums text-rose-500">${dayNum}</span>`;
  } else if (dayOfWeek === 6) {
    numDisplay = `<span class="text-xs sm:text-sm font-bold font-mono tabular-nums text-blue-500">${dayNum}</span>`;
  } else if (isThursday) {
    numDisplay = `<span class="text-xs sm:text-sm font-bold font-mono tabular-nums text-blue-600">${dayNum}</span>`;
  }

  if (isToday) {
    numDisplay = `
      <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-2xs font-mono tabular-nums">
        ${dayNum}
      </div>
    `;
  }

  // Event pills (up to 3 visible, rest collapsed)
  const maxPills = 3;
  const visibleEvents = dayEvents.slice(0, maxPills);
  const extraCount = dayEvents.length - maxPills;

  const pillsHtml = visibleEvents.map(ev => {
    const timeStr = ev.start_datetime ? ev.start_datetime.substring(11, 16) : '';
    let pillStyle = '';

    if (ev.source_type === 'meeting') {
      pillStyle = 'bg-blue-50/90 text-blue-950 border-l-[3px] border-blue-600 hover:bg-blue-100';
    } else if (ev.source_type === 'chapter') {
      pillStyle = 'bg-purple-50/90 text-purple-950 border-l-[3px] border-purple-600 hover:bg-purple-100';
    } else {
      // Training
      pillStyle = 'bg-emerald-50/90 text-emerald-950 border-l-[3px] border-emerald-600 hover:bg-emerald-100';
    }

    const visitorPrefix = (ev.visitor_count !== undefined && ev.visitor_count > 0)
      ? `<span class="px-1 py-0.2 rounded text-3xs font-extrabold bg-blue-600 text-white shrink-0">V:${ev.visitor_count}</span>`
      : '';

    return `
      <div onclick="handleCalendarEventClick('${ev.id}', event)" class="group/pill flex items-center gap-1.5 px-2 py-0.5 rounded-md text-xs font-semibold ${pillStyle} transition-all cursor-pointer truncate shadow-2xs hover:shadow-xs active:scale-[0.99]">
        <span class="font-mono font-bold tabular-nums text-xs shrink-0 text-slate-800">${timeStr}</span>
        ${visitorPrefix}
        <span class="truncate font-semibold text-xs text-slate-900">${escapeHtml(ev.title)}</span>
      </div>
    `;
  }).join('');

  const extraBadge = extraCount > 0 ? `
    <div onclick="openDayEventsModal('${dateKey}')" class="text-3xs font-extrabold text-slate-500 hover:text-blue-600 cursor-pointer pt-0.5 pl-1.5">
      + 他 ${extraCount} 件
    </div>
  ` : '';

  return `
    <div class="calendar-cell min-h-[105px] sm:min-h-[125px] p-1.5 sm:p-2 flex flex-col justify-between ${bgClass} transition-colors hover:bg-slate-50/80 group cursor-pointer relative" onclick="onCalendarCellClick('${dateKey}', event)">
      <div>
        <!-- Top bar: Date Num & Action -->
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-1.5">
            ${numDisplay}
            ${isThursday && isCurrentMonth ? '<span class="text-3xs font-extrabold text-blue-600 hidden sm:inline">定例会</span>' : ''}
          </div>
          <button type="button" onclick="openChapterEventModalOnDate('${dateKey}', event)" class="w-5 h-5 rounded-full hover:bg-slate-200 text-slate-400 hover:text-slate-700 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-3xs cursor-pointer" title="この日に予定を追加">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <!-- Event Pills (Unified Font Size: time & title both text-xs) -->
        <div class="space-y-1">
          ${pillsHtml}
          ${extraBadge}
        </div>
      </div>
    </div>
  `;
}

/**
 * Chapter Event Modal Management
 */
function openChapterEventModal(eventObj = null) {
  currentEditingChapterEvent = eventObj;
  const modal = document.getElementById('modal-chapter-event');
  const form = document.getElementById('form-chapter-event');
  const titleHeader = document.getElementById('modal-chapter-event-title');
  const btnDelete = document.getElementById('btn-delete-chapter-event');
  const btnDeleteSeries = document.getElementById('btn-delete-chapter-series');
  const btnShare = document.getElementById('btn-share-chapter-event');
  const repeatSection = document.getElementById('ch-ev-repeat-section');
  if (!modal || !form) return;

  form.reset();

  const todayStr = new Date().toISOString().substring(0, 10);
  const next3Months = new Date(Date.now() + 90 * 86400000).toISOString().substring(0, 10);

  if (eventObj) {
    titleHeader.innerText = 'チャプター予定を編集';
    document.getElementById('ch-ev-id').value = eventObj.id || '';
    document.getElementById('ch-ev-title').value = eventObj.title || '';
    document.getElementById('ch-ev-category').value = eventObj.category || 'チャプターイベント';
    document.getElementById('ch-ev-is-online').value = eventObj.is_online ? '1' : '0';

    if (eventObj.start_datetime) {
      document.getElementById('ch-ev-date').value = eventObj.start_datetime.substring(0, 10);
      document.getElementById('ch-ev-start-time').value = eventObj.start_datetime.substring(11, 16);
    }
    if (eventObj.end_datetime) {
      document.getElementById('ch-ev-end-time').value = eventObj.end_datetime.substring(11, 16);
    }
    document.getElementById('ch-ev-location').value = eventObj.location_name || '';
    document.getElementById('ch-ev-url').value = eventObj.location_url || '';
    document.getElementById('ch-ev-organizer').value = eventObj.organizer || '';
    document.getElementById('ch-ev-desc').value = eventObj.description || '';

    // Repeat section hidden on single edit
    if (repeatSection) repeatSection.classList.add('hidden');

    if (btnShare) btnShare.classList.remove('hidden');
    if (btnDelete) btnDelete.classList.remove('hidden');
    if (btnDeleteSeries) {
      if (eventObj.recurrence_group_id) {
        btnDeleteSeries.classList.remove('hidden');
      } else {
        btnDeleteSeries.classList.add('hidden');
      }
    }
  } else {
    titleHeader.innerText = 'チャプター予定を追加';
    if (btnShare) btnShare.classList.add('hidden');
    document.getElementById('ch-ev-id').value = '';
    document.getElementById('ch-ev-date').value = todayStr;
    document.getElementById('ch-ev-start-time').value = '19:00';
    document.getElementById('ch-ev-end-time').value = '21:00';

    if (repeatSection) repeatSection.classList.remove('hidden');
    const repeatTypeSelect = document.getElementById('ch-ev-repeat-type');
    if (repeatTypeSelect) repeatTypeSelect.value = 'none';

    const repeatUntilInput = document.getElementById('ch-ev-repeat-until');
    if (repeatUntilInput) repeatUntilInput.value = next3Months;

    const repeatCountSelect = document.getElementById('ch-ev-repeat-count');
    if (repeatCountSelect) repeatCountSelect.value = '12';

    const repeatOptions = document.getElementById('ch-ev-repeat-options');
    if (repeatOptions) repeatOptions.classList.add('hidden');

    if (btnDelete) btnDelete.classList.add('hidden');
    if (btnDeleteSeries) btnDeleteSeries.classList.add('hidden');
  }

  modal.classList.remove('hidden');
}

function openChapterEventModalOnDate(dateStr, evt) {
  if (evt) evt.stopPropagation();
  openChapterEventModal();
  const dateInput = document.getElementById('ch-ev-date');
  if (dateInput) {
    dateInput.value = dateStr;
    // Update repeat until date to 3 months from selected date
    const dObj = new Date(dateStr.replace(/-/g, '/'));
    if (!isNaN(dObj.getTime())) {
      const until = new Date(dObj.getTime() + 90 * 86400000).toISOString().substring(0, 10);
      const untilInput = document.getElementById('ch-ev-repeat-until');
      if (untilInput) untilInput.value = until;
    }
    updateChapterEventRepeatSummary();
  }
}

function onChapterEventRepeatTypeChange() {
  const select = document.getElementById('ch-ev-repeat-type');
  const options = document.getElementById('ch-ev-repeat-options');
  if (!select || !options) return;

  if (select.value === 'none') {
    options.classList.add('hidden');
  } else {
    options.classList.remove('hidden');
    updateChapterEventRepeatSummary();
  }
}

function updateChapterEventRepeatSummary() {
  const select = document.getElementById('ch-ev-repeat-type');
  const dateInput = document.getElementById('ch-ev-date');
  const untilInput = document.getElementById('ch-ev-repeat-until');
  const countSelect = document.getElementById('ch-ev-repeat-count');
  const summaryText = document.getElementById('ch-ev-repeat-summary-text');
  if (!select || !summaryText) return;

  const repeatType = select.value;
  if (repeatType === 'none') return;

  const dateStr = dateInput?.value || new Date().toISOString().substring(0, 10);
  const untilStr = untilInput?.value || '';
  const maxCountLimit = parseInt(countSelect?.value || '0', 10);

  const startObj = new Date(dateStr.replace(/-/g, '/'));
  if (isNaN(startObj.getTime())) {
    summaryText.innerText = '開始日を正しく選択してください';
    return;
  }

  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  const dayName = dayNames[startObj.getDay()];

  let untilObj = untilStr ? new Date(untilStr.replace(/-/g, '/')) : new Date(startObj.getTime() + 90 * 86400000);
  if (isNaN(untilObj.getTime()) || untilObj < startObj) {
    untilObj = new Date(startObj.getTime() + 90 * 86400000);
  }

  // Calculate occurrences
  let count = 0;
  let cur = new Date(startObj.getTime());
  const maxSafety = maxCountLimit > 0 ? Math.min(maxCountLimit, 120) : 120;

  // If weekdays and start date is on weekend, advance to next Monday
  if (repeatType === 'weekdays') {
    while (cur.getDay() === 0 || cur.getDay() === 6) {
      cur.setDate(cur.getDate() + 1);
    }
  }

  while (count < maxSafety && cur <= untilObj) {
    count++;
    if (repeatType === 'weekdays') {
      do {
        cur.setDate(cur.getDate() + 1);
      } while (cur.getDay() === 0 || cur.getDay() === 6);
    } else if (repeatType === 'daily') {
      cur.setDate(cur.getDate() + 1);
    } else if (repeatType === 'weekly') {
      cur.setDate(cur.getDate() + 7);
    } else if (repeatType === 'biweekly') {
      cur.setDate(cur.getDate() + 14);
    } else if (repeatType === 'monthly') {
      cur.setMonth(cur.getMonth() + 1);
    } else {
      break;
    }
  }

  const untilFormatted = `${untilObj.getFullYear()}年${untilObj.getMonth() + 1}月${untilObj.getDate()}日`;

  if (repeatType === 'weekdays') {
    summaryText.innerText = `平日毎日(月〜金)に計 ${count}回 登録されます（${untilFormatted} まで）`;
  } else if (repeatType === 'daily') {
    summaryText.innerText = `毎日(土日含む)に計 ${count}回 登録されます（${untilFormatted} まで）`;
  } else if (repeatType === 'weekly') {
    summaryText.innerText = `毎週(${dayName}曜日)に計 ${count}回 登録されます（${untilFormatted} まで）`;
  } else if (repeatType === 'biweekly') {
    summaryText.innerText = `隔週(2週に1回 ${dayName}曜日)に計 ${count}回 登録されます（${untilFormatted} まで）`;
  } else if (repeatType === 'monthly') {
    summaryText.innerText = `毎月(${startObj.getDate()}日)に計 ${count}回 登録されます（${untilFormatted} まで）`;
  }
}

/**
 * Save Chapter Event (Submit)
 */
async function handleChapterEventSubmit(evt) {
  evt.preventDefault();
  const btn = document.getElementById('btn-save-chapter-event');
  if (btn) btn.disabled = true;

  const id = document.getElementById('ch-ev-id').value;
  const title = document.getElementById('ch-ev-title').value.trim();
  const category = document.getElementById('ch-ev-category').value;
  const isOnline = parseInt(document.getElementById('ch-ev-is-online').value, 10);
  const date = document.getElementById('ch-ev-date').value;
  const startTime = document.getElementById('ch-ev-start-time').value || '00:00';
  const endTime = document.getElementById('ch-ev-end-time').value || '';
  const locationName = document.getElementById('ch-ev-location').value.trim();
  const locationUrl = document.getElementById('ch-ev-url').value.trim();
  const organizer = document.getElementById('ch-ev-organizer').value.trim();
  const desc = document.getElementById('ch-ev-desc').value.trim();

  const repeatType = document.getElementById('ch-ev-repeat-type')?.value || 'none';
  const repeatUntil = document.getElementById('ch-ev-repeat-until')?.value || '';
  const repeatCount = parseInt(document.getElementById('ch-ev-repeat-count')?.value || '0', 10);

  const startDatetime = `${date} ${startTime}:00`;
  const endDatetime = endTime ? `${date} ${endTime}:00` : '';

  try {
    const res = await ApiService.call('saveChapterEventApi', {
      id,
      title,
      category,
      is_online: isOnline,
      start_datetime: startDatetime,
      end_datetime: endDatetime,
      location_name: locationName,
      location_url: locationUrl,
      organizer,
      description: desc,
      recurrence_rule: repeatType,
      recurrence_until: repeatUntil,
      recurrence_count: repeatCount
    });

    if (res && res.success !== false) {
      showToast(res.message || 'チャプター予定を保存しました', 'success');
      closeChapterEventModal();
      loadCalendarAndEvents();
    } else {
      showToast(res?.message || '保存に失敗しました', 'error');
    }
  } catch (err) {
    console.error('Save chapter event error:', err);
    showToast(err?.message || '予定の保存中にエラーが発生しました', 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

/**
 * Delete Chapter Event
 */
async function handleDeleteChapterEvent(deleteSeries = false) {
  const id = document.getElementById('ch-ev-id').value;
  if (!id) return;

  const confirmMsg = deleteSeries
    ? 'この繰り返し予定グループ（すべてのシリーズ予定）を一括削除してもよろしいですか？'
    : 'このチャプター予定を削除してもよろしいですか？';

  if (!confirm(confirmMsg)) return;

  try {
    const res = await ApiService.call('deleteChapterEventApi', { id, delete_series: deleteSeries });
    if (res && res.success !== false) {
      showToast(res.message || (deleteSeries ? '繰り返し予定を一括削除しました' : 'チャプター予定を削除しました'), 'success');
      closeChapterEventModal();
      loadCalendarAndEvents();
    } else {
      showToast(res?.message || '削除に失敗しました', 'error');
    }
  } catch (err) {
    console.error('Delete error:', err);
    showToast('削除中にエラーが発生しました', 'error');
  }
}

  const urlLink = document.getElementById('modal-meeting-url');
  if (urlWrap && urlLink) {
    if (meeting.location_url) {
      urlLink.href = meeting.location_url;
      urlWrap.classList.remove('hidden');
    } else {
      urlWrap.classList.add('hidden');
    }
  }

  const descWrap = document.getElementById('modal-meeting-desc-wrap');
  const descEl = document.getElementById('modal-meeting-desc');
  if (descWrap && descEl) {
    if (meeting.description) {
      descEl.innerText = meeting.description;
      descWrap.classList.remove('hidden');
    } else {
      descWrap.classList.add('hidden');
    }
  }

  // Render meeting visitors
  renderMeetingModalVisitors(meeting);

  modal.classList.remove('hidden');
}

/**
 * Render Visitors in Meeting Detail Modal
 */
function renderMeetingModalVisitors(meeting) {
  const listWrap = document.getElementById('modal-meeting-visitors-wrap');
  const countEl = document.getElementById('modal-meeting-visitor-count');
  if (!listWrap) return;

  const dateKey = meeting.start_datetime.substring(0, 10);
  const slashDate = dateKey.replace(/-/g, '/');

  let matchedVisitors = [];

  if (Array.isArray(meeting.visitors) && meeting.visitors.length > 0) {
    matchedVisitors = meeting.visitors;
  } else {
    let sourceList = [];
    if (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors) && cachedAllVisitors.length > 0) {
      sourceList = cachedAllVisitors;
    } else if (typeof StateService !== 'undefined' && StateService.getVisitorList) {
      sourceList = StateService.getVisitorList();
    }
    if (Array.isArray(sourceList) && sourceList.length > 0) {
      matchedVisitors = sourceList.filter(v => {
        const vDate = (v.eventDate || v.event_date || '').substring(0, 10);
        return vDate === dateKey || vDate === slashDate;
      });
    }
  }

  const totalCount = Math.max(meeting.visitor_count || 0, matchedVisitors.length);
  if (countEl) countEl.innerText = totalCount;

  if (matchedVisitors.length === 0) {
    if (totalCount > 0) {
      listWrap.innerHTML = `
        <div class="p-3 text-center text-slate-500 text-xs flex items-center justify-center gap-2">
          <i class="fa-solid fa-spinner fa-spin text-blue-500"></i>
          <span>ビジター情報を取得中...</span>
        </div>
      `;
      // Fetch visitors if not cached
      if (typeof ApiService !== 'undefined') {
        ApiService.call('getAllVisitorsDataApi').then(res => {
          if (res && res.success) {
            const list = res.visitors || res.list || [];
            if (typeof cachedAllVisitors !== 'undefined') cachedAllVisitors = list;
            if (typeof StateService !== 'undefined' && StateService.setAllVisitors) StateService.setAllVisitors(list);
            const refiltered = list.filter(v => {
              const vDate = (v.eventDate || v.event_date || '').substring(0, 10);
              return vDate === dateKey || vDate === slashDate;
            });
            meeting.visitors = refiltered;
            renderMeetingModalVisitors(meeting);
          }
        }).catch(() => {
          listWrap.innerHTML = `
            <div class="text-slate-400 py-3 text-center text-xs">
              システム登録: ${totalCount}名
            </div>
          `;
        });
      }
    } else {
      listWrap.innerHTML = `
        <div class="text-slate-400 py-4 text-center text-xs">
          <i class="fa-regular fa-user text-slate-300 text-sm mb-1 block"></i>
          現在、この定例会へのビジター申込はありません
        </div>
      `;
    }
    return;
  }

  listWrap.innerHTML = matchedVisitors.map(v => {
    const vId = v.id || '';
    const vName = escapeHtml(v.name || v.visitor_name || 'ビジター');
    const vProf = escapeHtml(v.profession || '');
    const vCompany = escapeHtml(v.company || '');
    const vInviter = escapeHtml(v.inviter || '-');
    const isGuest = (v.category === 'ゲスト');
    const isAttended = (v.is_attended === '参加' || v.isAttended === '参加');

    const badgeCat = isGuest
      ? '<span class="px-1.5 py-0.2 rounded text-3xs font-extrabold bg-purple-50 text-purple-700 border border-purple-200 shrink-0">ゲスト</span>'
      : '<span class="px-1.5 py-0.2 rounded text-3xs font-extrabold bg-blue-50 text-blue-700 border border-blue-200 shrink-0">ビジター</span>';

    const badgeAtt = isAttended
      ? '<span class="px-1.5 py-0.2 rounded text-3xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 shrink-0"><i class="fa-solid fa-check text-3xs mr-0.5"></i>参加</span>'
      : '<span class="px-1.5 py-0.2 rounded text-3xs font-medium bg-slate-100 text-slate-500 shrink-0">申込済</span>';

    const subInfo = [vCompany, vProf].filter(Boolean).join(' / ');

    return `
      <div onclick="navigateToVisitorFromMeeting('${vId}')" class="p-2.5 rounded-xl border border-slate-200/80 bg-white hover:border-blue-300 hover:shadow-2xs transition-all flex items-center justify-between gap-2.5 group cursor-pointer">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5 flex-wrap mb-0.5">
            ${badgeCat}
            ${badgeAtt}
            <span class="font-bold text-xs text-slate-900 group-hover:text-blue-600 transition-colors">${vName} 様</span>
          </div>
          ${subInfo ? `<div class="text-3xs text-slate-500 truncate">${subInfo}</div>` : ''}
        </div>
        <div class="text-right shrink-0">
          <span class="text-3xs text-slate-400 block font-medium">紹介: ${vInviter}</span>
          <span class="text-3xs font-bold text-blue-600 group-hover:underline inline-flex items-center gap-0.5 mt-0.5">
            詳細 <i class="fa-solid fa-chevron-right text-3xs"></i>
          </span>
        </div>
      </div>
    `;
  }).join('');
}

/**
 * Save Meeting Edit
 */
async function handleMeetingEditSubmit(evt) {
  evt.preventDefault();
  const btn = document.getElementById('btn-save-meeting-edit');
  if (btn) btn.disabled = true;

  const meetingDate = document.getElementById('mt-edit-date-val').value;
  const title = document.getElementById('mt-edit-title').value.trim();
  const category = document.getElementById('mt-edit-category').value;
  const isOnline = parseInt(document.getElementById('mt-edit-is-online').value, 10);
  const locationName = document.getElementById('mt-edit-location').value.trim();
  const locationUrl = document.getElementById('mt-edit-url').value.trim();
  const startTime = document.getElementById('mt-edit-start-time').value || '06:45';
  const endTime = document.getElementById('mt-edit-end-time').value || '08:30';
  const organizer = document.getElementById('mt-edit-organizer').value.trim();
  const desc = document.getElementById('mt-edit-desc').value.trim();

  const startDatetime = `${meetingDate} ${startTime}:00`;
  const endDatetime = endTime ? `${meetingDate} ${endTime}:00` : '';

  try {
    const res = await ApiService.call('saveMeetingCustomizationApi', {
      meeting_date: meetingDate,
      title,
      category,
      is_online: isOnline,
      location_name: locationName,
      location_url: locationUrl,
      start_datetime: startDatetime,
      end_datetime: endDatetime,
      organizer,
      description: desc
    });

    if (res && res.success !== false) {
      showToast(res.message || '定例会情報を更新しました', 'success');
      closeMeetingEditModal();
      loadCalendarAndEvents();
    } else {
      showToast(res?.message || '保存に失敗しました', 'error');
    }
  } catch (err) {
    console.error('Save meeting customization error:', err);
    showToast(err?.message || '定例会情報の保存中にエラーが発生しました', 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

/**
 * Reset Meeting to Default
 */
async function handleMeetingReset() {
  const meetingDate = document.getElementById('mt-edit-date-val').value;
  if (!meetingDate) return;

  if (!confirm(`${meetingDate} の定例会情報をデフォルト（通常定例会）に戻しますか？`)) {
    return;
  }

  try {
    const res = await ApiService.call('resetMeetingCustomizationApi', { meeting_date: meetingDate });
    if (res && res.success !== false) {
      showToast(res.message || '定例会情報をデフォルトに戻しました', 'success');
      closeMeetingEditModal();
      loadCalendarAndEvents();
    } else {
      showToast(res?.message || 'リセットに失敗しました', 'error');
    }
  } catch (err) {
    console.error('Reset meeting error:', err);
    showToast('定例会情報のリセット中にエラーが発生しました', 'error');
  }
}

/**
 * Render KPIs
 */
function renderTrainingKpis(summary) {
  if (!summary) return;

  const nextDateEl = document.getElementById('kpi-training-next-date');
  const nextTitleEl = document.getElementById('kpi-training-next-title');
  const monthCountEl = document.getElementById('kpi-training-month-count');
  const onlineCountEl = document.getElementById('kpi-training-online-count');
  const inpersonCountEl = document.getElementById('kpi-training-inperson-count');
  const lastSyncedEl = document.getElementById('training-last-synced');

  // Next Thursday meeting calculation
  const today = new Date();
  const dayOfWeek = today.getDay();
  let daysUntilThu = (4 - dayOfWeek + 7) % 7;
  if (daysUntilThu === 0 && today.getHours() >= 9) {
    daysUntilThu = 7;
  }
  const nextThu = new Date(today);
  nextThu.setDate(today.getDate() + daysUntilThu);
  const nextThuStr = `${nextThu.getMonth() + 1}/${nextThu.getDate()} (木)`;

  if (nextDateEl) nextDateEl.innerText = nextThuStr;
  if (nextTitleEl) nextTitleEl.innerText = '07:00 開会 / 6:45受付';

  // Count total events this month in calendar
  const totalEventsInMonth = allCalendarEvents.length;
  if (monthCountEl) monthCountEl.innerText = totalEventsInMonth || summary.currentMonthTotal || 0;

  // Online & In-person counts
  let onlineCnt = 0;
  let inpersonCnt = 0;
  allCalendarEvents.forEach(e => {
    if (e.is_online) onlineCnt++;
    else inpersonCnt++;
  });

  if (onlineCountEl) onlineCountEl.innerText = onlineCnt;
  if (inpersonCountEl) inpersonCountEl.innerText = inpersonCnt;

  if (lastSyncedEl && summary.lastSyncedAt) {
    lastSyncedEl.innerText = `最終同期: ${summary.lastSyncedAt}`;
  }
}

async function syncTrainingEvents() {
  const icon = document.getElementById('sync-training-icon');
  const btn = document.getElementById('btn-sync-training');

  if (icon) icon.classList.add('fa-spin');
  if (btn) btn.disabled = true;

  showToast('京都シティセントラルのイベント情報を同期中...', 'info');

  try {
    const res = await ApiService.call('syncTrainingEventsApi');
    if (res && res.success !== false) {
      showToast('最新のトレーニング日程を同期しました', 'success');
      if (typeof celebrateQuestClear === 'function') {
        celebrateQuestClear();
      }
      loadCalendarAndEvents();
    } else {
      showToast(res?.message || '同期に失敗しました', 'error');
    }
  } catch (err) {
    console.error('Manual sync error:', err);
    showToast('同期中にエラーが発生しました', 'error');
  } finally {
    if (icon) icon.classList.remove('fa-spin');
    if (btn) btn.disabled = false;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/* ==========================================================================
   EVENT SHARE & DEEP LINK SYSTEM
   ========================================================================== */

/**
 * Format Date & Time for sharing text
 */
function formatShareDateTime(startStr, endStr) {
  if (!startStr) return '';
  const startDate = new Date(startStr.replace(/-/g, '/'));
  if (isNaN(startDate.getTime())) return startStr;
  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  const dayName = dayNames[startDate.getDay()];
  const yyyy = startDate.getFullYear();
  const mm = startDate.getMonth() + 1;
  const dd = startDate.getDate();
  const startTime = startStr.length >= 16 ? startStr.substring(11, 16) : '';

  let endTime = '';
  if (endStr && endStr.length >= 16) {
    endTime = ' ～ ' + endStr.substring(11, 16);
  }

  return `${yyyy}年${mm}月${dd}日(${dayName}) ${startTime}${endTime}`;
}

/**
 * Get Deep Link URL to view this specific event
 */
function getEventDeepLink(ev) {
  if (!ev || !ev.id) return window.location.href;
  const origin = window.location.origin + window.location.pathname;
  const cleanUrl = origin.split('?')[0].split('#')[0];
  return `${cleanUrl}#training?event=${encodeURIComponent(ev.id)}`;
}

/**
 * Build beautifully formatted share text
 */
function buildEventShareText(ev) {
  if (!ev) return '';
  const dtStr = formatShareDateTime(ev.start_datetime, ev.end_datetime);
  const isOnline = !!ev.is_online;
  const formatLabel = isOnline ? 'オンライン (Zoom)' : '対面・集合開催';
  const locText = ev.location_name || (isOnline ? 'オンライン (Zoom)' : '');

  let text = `【イベント案内】\n`;
  text += `━━━━━━━━━━━━━━━━━━━━\n`;
  text += `■ タイトル: ${ev.title || 'イベント'}\n`;
  if (dtStr) text += `■ 日時: ${dtStr}\n`;
  text += `■ 形式: ${formatLabel}\n`;
  if (locText) text += `■ 会場: ${locText}\n`;
  if (ev.location_url) text += `■ 参加/案内URL: ${ev.location_url}\n`;
  if (ev.cost_member) text += `■ 費用: ${ev.cost_member}\n`;
  if (ev.organizer) text += `■ 主催・担当: ${ev.organizer}\n`;

  if (ev.description) {
    const cleanDesc = ev.description.replace(/<[^>]*>/g, '').trim();
    if (cleanDesc) {
      text += `\n■ 詳細・案内:\n${cleanDesc}\n`;
    }
  }

  if (ev.source_type === 'training' && (ev.registration_url || ev.detail_url)) {
    text += `\n▼ 公式申込ページ:\n${ev.registration_url || ev.detail_url}\n`;
  }

  text += `━━━━━━━━━━━━━━━━━━━━\n`;
  text += `▼ REvoカレンダーで確認・共有:\n${getEventDeepLink(ev)}`;
  return text;
}

/**
 * Generate Google Calendar Event Creation URL
 */
function getGoogleCalendarUrl(ev) {
  if (!ev || !ev.start_datetime) return '#';
  try {
    const start = new Date(ev.start_datetime.replace(/-/g, '/'));
    if (isNaN(start.getTime())) return '#';
    let end = ev.end_datetime ? new Date(ev.end_datetime.replace(/-/g, '/')) : new Date(start.getTime() + 90 * 60 * 1000);
    if (isNaN(end.getTime()) || end <= start) {
      end = new Date(start.getTime() + 90 * 60 * 1000);
    }

    const pad = (n) => String(n).padStart(2, '0');
    const toGCalLocal = (d) => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

    const dates = `${toGCalLocal(start)}/${toGCalLocal(end)}`;
    const title = encodeURIComponent(ev.title || 'イベント');
    const deepLink = getEventDeepLink(ev);
    const descParts = [];
    if (ev.description) descParts.push(ev.description.replace(/<[^>]*>/g, '').trim());
    if (ev.location_url) descParts.push(`参加URL: ${ev.location_url}`);
    if (ev.registration_url || ev.detail_url) descParts.push(`公式リンク: ${ev.registration_url || ev.detail_url}`);
    descParts.push(`▼ REvoカレンダー:\n${deepLink}`);
    const details = encodeURIComponent(descParts.join('\n\n'));
    const location = encodeURIComponent(ev.location_name || (ev.is_online ? 'オンライン (Zoom)' : ''));

    return `https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}&location=${location}`;
  } catch (e) {
    return '#';
  }
}

/**
 * Open Event Share Modal
 */
function openEventShareModal(eventOrId, evt) {
  if (evt) evt.stopPropagation();

  let ev = null;
  if (typeof eventOrId === 'object' && eventOrId !== null) {
    ev = eventOrId;
  } else if (eventOrId) {
    ev = allCalendarEvents.find(e => e.id == eventOrId) ||
         allTrainingEvents.find(e => e.id == eventOrId) ||
         (currentSelectedMeeting && currentSelectedMeeting.id == eventOrId ? currentSelectedMeeting : null) ||
         (currentDetailTrainingEvent && currentDetailTrainingEvent.id == eventOrId ? currentDetailTrainingEvent : null) ||
         (currentEditingChapterEvent && currentEditingChapterEvent.id == eventOrId ? currentEditingChapterEvent : null);
  }

  if (!ev) {
    showToast('イベント情報が見つかりません', 'error');
    return;
  }

  currentSharingEvent = ev;
  const modal = document.getElementById('modal-event-share');
  if (!modal) return;

  // Set Modal Badge & Info
  const badgeEl = document.getElementById('share-modal-badge');
  if (badgeEl) {
    if (ev.source_type === 'meeting') {
      badgeEl.innerText = '定例会';
      badgeEl.className = 'px-2 py-0.5 rounded-full text-3xs font-extrabold bg-blue-50 text-blue-700 border border-blue-200';
    } else if (ev.source_type === 'chapter') {
      badgeEl.innerText = ev.category || 'チャプター予定';
      badgeEl.className = 'px-2 py-0.5 rounded-full text-3xs font-extrabold bg-purple-50 text-purple-700 border border-purple-200';
    } else {
      badgeEl.innerText = ev.event_type_name || ev.category || '京都CC研修';
      badgeEl.className = 'px-2 py-0.5 rounded-full text-3xs font-extrabold bg-emerald-50 text-emerald-800 border border-emerald-200';
    }
  }

  const titleEl = document.getElementById('share-modal-title');
  if (titleEl) titleEl.innerText = ev.title || 'イベント';

  const dateEl = document.getElementById('share-modal-date');
  if (dateEl) {
    dateEl.innerText = formatShareDateTime(ev.start_datetime, ev.end_datetime);
  }

  // Build full text
  const shareText = buildEventShareText(ev);
  const previewTextarea = document.getElementById('share-modal-preview-text');
  if (previewTextarea) {
    previewTextarea.value = shareText;
  }

  // LINE share button
  const lineBtn = document.getElementById('btn-share-line');
  if (lineBtn) {
    lineBtn.href = `https://line.me/R/msg/text/?${encodeURIComponent(shareText)}`;
  }

  // Google Calendar button
  const gcalBtn = document.getElementById('btn-share-gcal');
  if (gcalBtn) {
    gcalBtn.href = getGoogleCalendarUrl(ev);
  }

  // Reset copy button status
  const copyBtnText = document.getElementById('share-copy-btn-text');
  const copyIcon = document.getElementById('share-copy-icon');
  if (copyBtnText) copyBtnText.innerText = '案内文をコピー';
  if (copyIcon) copyIcon.className = 'fa-regular fa-copy';

  modal.classList.remove('hidden');
}

/**
 * Copy Full Share Text to Clipboard
 */
function copyEventShareFullText() {
  if (!currentSharingEvent) return;
  const shareText = buildEventShareText(currentSharingEvent);

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(shareText).then(() => {
      showToast('📋 イベント案内文をコピーしました！', 'success');
      const copyBtnText = document.getElementById('share-copy-btn-text');
      const copyIcon = document.getElementById('share-copy-icon');
      if (copyBtnText) copyBtnText.innerText = 'コピー完了！';
      if (copyIcon) copyIcon.className = 'fa-solid fa-check text-emerald-300';
      setTimeout(() => {
        if (copyBtnText) copyBtnText.innerText = '案内文をコピー';
        if (copyIcon) copyIcon.className = 'fa-regular fa-copy';
      }, 2500);
    }).catch(() => {
      prompt('以下のテキストをコピーしてください:', shareText);
    });
  } else {
    prompt('以下のテキストをコピーしてください:', shareText);
  }
}

/**
 * Handle Native Share (Web Share API) or fallback to URL copy
 */
function handleNativeShareOrUrlCopy() {
  if (!currentSharingEvent) return;
  const deepLink = getEventDeepLink(currentSharingEvent);
  const shareText = buildEventShareText(currentSharingEvent);

  if (navigator.share) {
    navigator.share({
      title: currentSharingEvent.title,
      text: shareText,
      url: deepLink
    }).then(() => {
      showToast('共有が完了しました', 'success');
    }).catch((err) => {
      // User cancelled or share failed, fallback silently or copy URL
      if (err.name !== 'AbortError') {
        copyDeepLinkUrl(deepLink);
      }
    });
  } else {
    copyDeepLinkUrl(deepLink);
  }
}

function copyDeepLinkUrl(url) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => {
      showToast('🔗 イベント共有URLをコピーしました！', 'success');
    }).catch(() => {
      prompt('以下の共有URLをコピーしてください:', url);
    });
  } else {
    prompt('以下の共有URLをコピーしてください:', url);
  }
}

/**
 * Check URL hash for direct event link (deep linking)
 */
function checkUrlEventDeepLink() {
  try {
    const rawHash = decodeURIComponent(window.location.hash || '');
    if (!rawHash.includes('training') && !rawHash.includes('events')) return;

    const match = rawHash.match(/[?&]event=([^&]+)/);
    if (!match || !match[1]) return;

    const targetEventId = decodeURIComponent(match[1]);
    const ev = allCalendarEvents.find(e => e.id == targetEventId) || allTrainingEvents.find(e => e.id == targetEventId);

    if (ev) {
      setTimeout(() => {
        handleCalendarEventClick(ev.id);
      }, 100);
    }
  } catch (e) {
    console.error('Deep link check error:', e);
  }
}
