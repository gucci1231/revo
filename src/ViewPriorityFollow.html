<!-- VIEW: 最優先フォロービジター一覧 (感触A・B評価 2カラム Master-Detail) -->
<div id="view-priority-follow" class="view-content">
  <div class="pf-2col-layout">
    
    <!-- 左カラム: 最優先フォロー名簿パネル (Master List) -->
    <div class="pf-master-panel section-card">
      <div class="section-header flex-col gap-2.5 p-4 bg-white">
        <div class="flex items-center justify-between gap-2 w-full">
          <div class="flex items-center gap-2">
            <h2 class="section-title text-base font-bold text-slate-800 m-0 flex items-center gap-1.5">
              <i class="fa-solid fa-fire text-rose-600"></i> 最優先フォロー
            </h2>
          </div>
          <span id="pf-total-badge" class="px-2.5 py-0.5 rounded-full text-xs font-black bg-slate-100 text-slate-700">0</span>
        </div>

        <div class="flex items-center gap-2 w-full flex-wrap sm:flex-nowrap">
          <div class="tab-filter-group flex gap-1 bg-slate-100 p-1 rounded-lg shrink-0">
            <button type="button" class="tab-btn active px-2.5 py-1 text-xs font-bold" id="pf-tab-all" onclick="setPriorityFollowGradeFilter('ALL')">ALL</button>
            <button type="button" class="tab-btn px-2.5 py-1 text-xs font-bold" id="pf-tab-a" onclick="setPriorityFollowGradeFilter('A')">A</button>
            <button type="button" class="tab-btn px-2.5 py-1 text-xs font-bold" id="pf-tab-b" onclick="setPriorityFollowGradeFilter('B')">B</button>
          </div>

          <!-- アクション状況スマートセグメント (ALL / 🔴 超過 / 🟡 未設定 / 🔵 進行中) -->
          <div class="tab-filter-group flex gap-1 bg-slate-100 p-1 rounded-lg shrink-0" id="pf-action-filter-group">
            <button type="button" class="tab-btn active px-2.5 py-1 text-xs font-bold" id="pf-action-filter-all" onclick="setPriorityFollowActionFilter('ALL')">
              全件
            </button>
            <button type="button" class="tab-btn px-2.5 py-1 text-xs font-bold flex items-center gap-1" id="pf-action-filter-overdue" onclick="setPriorityFollowActionFilter('OVERDUE')" title="期限超過">
              <span class="w-2 h-2 rounded-full bg-rose-500 shrink-0"></span>
              <span>超過</span>
              <span id="pf-count-overdue" class="text-[10px] tabular-nums font-bold text-slate-500">0</span>
            </button>
            <button type="button" class="tab-btn px-2.5 py-1 text-xs font-bold flex items-center gap-1" id="pf-action-filter-stagnant" onclick="setPriorityFollowActionFilter('STAGNANT')" title="アクション未設定">
              <span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>
              <span>未設定</span>
              <span id="pf-count-stagnant" class="text-[10px] tabular-nums font-bold text-slate-500">0</span>
            </button>
            <button type="button" class="tab-btn px-2.5 py-1 text-xs font-bold flex items-center gap-1" id="pf-action-filter-active" onclick="setPriorityFollowActionFilter('ACTIVE')" title="進行中">
              <span class="w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>
              <span>進行中</span>
              <span id="pf-count-active" class="text-[10px] tabular-nums font-bold text-slate-500">0</span>
            </button>
          </div>

          <div class="relative flex-1 min-w-[140px]">
            <input type="text" id="search-priority-follow-input" class="search-box w-full text-xs py-1.5 pl-3" placeholder="🔍 検索..." onkeyup="filterPriorityFollowTable()">
          </div>
        </div>
      </div>

      <!-- ビジターアイテム一覧 (スクロール可能) -->
      <div id="pf-visitor-list" class="pf-visitor-list"></div>

      <!-- ページネーションバー -->
      <div class="pagination-bar p-3 border-t border-slate-100 bg-white">
        <div class="pagination-info text-[11px]" id="pf-pagination-info">0 件</div>
        <div class="pagination-controls gap-1">
          <button type="button" class="btn-action-secondary text-xs px-2.5 py-1" id="btn-pf-prev-page" onclick="changePriorityFollowPage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="pf-pagination-page-num" class="pagination-page-num text-xs">1/1</span>
          <button type="button" class="btn-action-secondary text-xs px-2.5 py-1" id="btn-pf-next-page" onclick="changePriorityFollowPage(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </div>

    <!-- 右カラム: ビジター詳細カルテパネル (Detail View) -->
    <div class="pf-detail-panel" id="pf-detail-panel">
      <div id="pf-detail-content" class="pf-detail-content">
        <!-- JSで選択されたビジターのカルテがここにリアルタイム描画される -->
      </div>
    </div>

  </div>
</div>
