<script>
  function parseFeelAbc(val) {
    if (!val) return '';
    const s = String(val).toUpperCase().trim();
    if (s === 'A' || s === 'B' || s === 'C') return s;
    if (s.includes('A')) return 'A';
    if (s.includes('B')) return 'B';
    if (s.includes('C')) return 'C';
    return '';
  }

  let currentDashboardData = null;
  let cachedAllVisitors = [];
  let cachedHearingList = [];
  let cachedScheduledEmails = [];
  let currentPreviewItem = null;

  const initialVisitorId = "";
  const rawInitialData = {};

  function hideLoading() {
    const el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  }
  setTimeout(hideLoading, 1500);

  /* --- URL Hash Router & Share Utilities --- */
  let isProgrammaticHashChange = false;
  let currentVdWebAppUrl = "";

  function updateUrlHash(hashStr, stateObj = {}) {
    if (!hashStr) return;
    const cleanHash = String(hashStr).replace(/^#+/, '');
    if (window.location.hash !== '#' + cleanHash) {
      isProgrammaticHashChange = true;
      window.location.hash = '#' + cleanHash;
      setTimeout(() => { isProgrammaticHashChange = false; }, 100);
    }
    if (typeof google !== 'undefined' && google.script && google.script.history) {
      try {
        google.script.history.push(stateObj, stateObj, '#' + cleanHash);
      } catch (e) {}
    }
  }

  function handleHashRouting() {
    if (isProgrammaticHashChange) return;
    const rawHash = decodeURIComponent(window.location.hash || '');
    const hash = rawHash.replace(/^#+/, '');
    if (hash.startsWith('visitor/')) {
      const vid = hash.replace('visitor/', '').trim();
      if (vid && vid !== currentVdVisitorId) {
        openVisitorDetailView(vid, false);
      }
    } else if (['dashboard', 'visitors', 'hearings', 'email-schedule', 'settings'].includes(hash)) {
      switchTab(hash, false);
    }
  }

  function copyCurrentPageUrl() {
    let cleanUrl = window.location.href.split('?')[0];
    const rawHash = decodeURIComponent(window.location.hash || '');
    const hash = rawHash.replace(/^#+/, '');
    if (hash && hash !== 'dashboard') {
      cleanUrl += '#' + hash;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cleanUrl).then(() => {
        showToast('🔗 共有URLをコピーしました！');
      }).catch(() => {
        prompt('以下のURLをコピーしてシェアしてください:', cleanUrl);
      });
    } else {
      prompt('以下のURLをコピーしてシェアしてください:', cleanUrl);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    hideLoading();

    if (rawInitialData && rawInitialData.dashboardData) {
      try {
        renderDashboard(rawInitialData.dashboardData);
      } catch(e) {
        console.error('Dashboard render error:', e);
        fetchDashboardData();
      }
    } else {
      fetchDashboardData();
    }

    window.addEventListener('hashchange', handleHashRouting);
    if (typeof google !== 'undefined' && google.script && google.script.history) {
      google.script.history.setChangeHandler((e) => {
        handleHashRouting();
      });
    }

    const hash = (window.location.hash || '').replace(/^#/, '');
    if (hash.startsWith('visitor/')) {
      openVisitorDetailView(hash.replace('visitor/', ''), false);
    } else if (hash && ['dashboard', 'visitors', 'hearings', 'email-schedule', 'settings'].includes(hash)) {
      switchTab(hash, false);
    } else if (initialVisitorId) {
      openVisitorDetailView(initialVisitorId, true);
    } else {
      updateUrlHash('dashboard', { tab: 'dashboard' });
    }
  });

  /* --- ☰ Left Drawer Controller --- */
  function toggleLeftDrawer() {
    const drawer = document.getElementById('left-drawer');
    if (drawer && drawer.classList.contains('open')) {
      closeLeftDrawer();
    } else {
      openLeftDrawer();
    }
  }

  function openLeftDrawer() {
    const drawer = document.getElementById('left-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    if (drawer) drawer.classList.add('open');
    if (backdrop) backdrop.classList.add('open');
  }

  function closeLeftDrawer() {
    const drawer = document.getElementById('left-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    if (drawer) drawer.classList.remove('open');
    if (backdrop) backdrop.classList.remove('open');
  }

  /* --- Tab Navigation Controller --- */
  function switchTab(tabName, updateHash = true) {
    if (tabName !== 'visitor-detail') {
      previousTabBeforeDetail = tabName;
    }
    ['dashboard', 'priority-follow', 'visitors', 'hearings', 'email-schedule', 'settings', 'visitor-detail'].forEach(t => {
      const btn = document.getElementById('tab-btn-' + t);
      const drawerItem = document.getElementById('drawer-item-' + t);
      const view = document.getElementById('view-' + t);
      if (btn) btn.classList.remove('active');
      if (drawerItem) drawerItem.classList.remove('active');
      if (view) view.classList.remove('active');
    });

    const targetBtn = document.getElementById('tab-btn-' + tabName);
    const targetDrawerItem = document.getElementById('drawer-item-' + tabName);
    const targetView = document.getElementById('view-' + tabName);
    if (targetBtn) targetBtn.classList.add('active');
    if (targetDrawerItem) targetDrawerItem.classList.add('active');
    if (targetView) targetView.classList.add('active');

    if (window.innerWidth < 1024) {
      closeLeftDrawer();
    }

    if (updateHash && tabName !== 'visitor-detail') {
      updateUrlHash(tabName, { tab: tabName });
    }

    if (tabName === 'priority-follow') {
      fetchPriorityFollowData(true);
    } else if (tabName === 'visitors') {
      fetchAllVisitorsData(true);
    } else if (tabName === 'hearings') {
      fetchHearingListData(true);
    } else if (tabName === 'email-schedule') {
      fetchScheduledEmailsData(true);
    } else if (tabName === 'settings') {
      fetchMembersMasterData();
    }
  }

  function showTableSkeleton(tbodyId, cols = 8, rows = 4) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    let html = '';
    for (let i = 0; i < rows; i++) {
      html += '<tr>';
      for (let c = 0; c < cols; c++) {
        html += '<td><div class="skeleton skeleton-row"></div></td>';
      }
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  function fetchScheduledEmailsData(forceRefresh = false) {
    if (!forceRefresh && cachedScheduledEmails && cachedScheduledEmails.length > 0) {
      filterEmailSchedule();
      return;
    }
    showTableSkeleton('table-email-schedule', 9, 4);
    ApiService.call('getScheduledEmailsApi')
      .then(res => {
        if (res && res.success) {
          cachedScheduledEmails = res.scheduledList || [];
          if (document.getElementById('val-es-total-count')) document.getElementById('val-es-total-count').textContent = res.metrics ? res.metrics.totalCount : 0;
          if (document.getElementById('val-es-today-count')) document.getElementById('val-es-today-count').textContent = res.metrics ? res.metrics.todayCount : 0;
          if (document.getElementById('val-es-week-count')) document.getElementById('val-es-week-count').textContent = res.metrics ? res.metrics.thisWeekCount : 0;

          const testBanner = document.getElementById('es-test-mode-banner');
          if (testBanner) {
            if (res.isTestMode) {
              testBanner.style.display = 'flex';
              document.getElementById('es-test-email-list').textContent = (res.testEmailList || []).join(', ');
            } else {
              testBanner.style.display = 'none';
            }
          }

          filterEmailSchedule();
        }
      })
      .catch(handleError);
  }

  function filterEmailSchedule() {
    const q = (document.getElementById('es-search-box').value || '').toLowerCase().trim();
    const typeFilter = document.getElementById('es-type-filter').value;
    const statusFilter = document.getElementById('es-status-filter').value;

    let filtered = cachedScheduledEmails.filter(item => {
      const matchesQ = !q || 
        (item.visitorName && item.visitorName.toLowerCase().includes(q)) ||
        (item.email && item.email.toLowerCase().includes(q)) ||
        (item.inviter && item.inviter.toLowerCase().includes(q)) ||
        (item.company && item.company.toLowerCase().includes(q));

      let matchesType = true;
      if (typeFilter === 'intro') matchesType = item.templateKey.includes('INTRO');
      else if (typeFilter === 'remind') matchesType = item.templateKey.includes('REMIND');
      else if (typeFilter === 'thanks') matchesType = item.templateKey.includes('THANKS');
      else if (typeFilter === 'follow') matchesType = item.templateKey.includes('FOLLOW');

      let matchesStatus = true;
      if (statusFilter === 'today') matchesStatus = item.daysRemaining === 0;
      else if (statusFilter === 'upcoming') matchesStatus = item.daysRemaining > 0;
      else if (statusFilter === 'urgent') matchesStatus = item.daysRemaining < 0;

      return matchesQ && matchesType && matchesStatus;
    });

    renderEmailScheduleTable(filtered);
  }

  /* --- 🛡️ 安全なエスケープヘルパー --- */
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeJsParam(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '\\"')
      .replace(/\r/g, '')
      .replace(/\n/g, '\\n');
  }

  /* --- ✂️ テキスト省略＆ポップアップツールチップヘルパー --- */
  function formatTruncatedCell(text, maxLen = 15) {
    if (!text && text !== 0) return '-';
    const str = String(text).trim();
    if (!str || str === '-') return '-';
    const safeAttr = escapeHtml(str);
    if (str.length > maxLen) {
      const shortText = escapeHtml(str.substring(0, maxLen) + '...');
      return `<span class="cell-truncate-text" title="${safeAttr}">${shortText}</span>`;
    }
    return `<span title="${safeAttr}">${escapeHtml(str)}</span>`;
  }

  function renderEmailScheduleTable(list) {
    const tbody = document.getElementById('table-email-schedule');
    tbody.innerHTML = '';

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: #868e96; padding: 24px;">送信予定のメールはありません。</td></tr>';
      return;
    }

    list.forEach((item, index) => {
      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td style="font-weight: 700;">${item.scheduledDate}</td>
        <td><span class="badge-status ${item.statusBadgeClass}">${item.status}</span></td>
        <td><strong>${item.visitorName}</strong><br><span style="font-size: 11px; color: #6c757d;">${item.email}</span></td>
        <td>${formatTruncatedCell(item.company, 12)}<br><span style="font-size: 11px; color: #6c757d;">${formatTruncatedCell(item.profession, 12)}</span></td>
        <td>${formatTruncatedCell(item.inviter, 12)}</td>
        <td>${item.eventDate}</td>
        <td><span style="font-weight: 600; font-size: 12px;">${item.mailTypeName}</span></td>
        <td>${formatTruncatedCell(item.subject, 18)}</td>
        <td style="text-align: center;">
          <button class="btn-icon-action" title="プレビュー" onclick="openEmailPreviewModal(${index})">
            <i class="fa-solid fa-eye"></i>
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function openEmailPreviewModal(index) {
    const item = cachedScheduledEmails[index];
    if (!item) return;
    currentPreviewItem = item;

    document.getElementById('ep-visitor-name').textContent = item.visitorName;
    document.getElementById('ep-email').textContent = item.email;
    document.getElementById('ep-mail-type').textContent = item.mailTypeName;
    document.getElementById('ep-scheduled-date').textContent = item.scheduledDate;
    document.getElementById('ep-status-badge').textContent = item.status;
    document.getElementById('ep-event-date').textContent = item.eventDate;
    document.getElementById('ep-inviter').textContent = item.inviter || '-';
    document.getElementById('ep-subject').value = item.subject;
    document.getElementById('ep-body').value = item.bodyFull;

    document.getElementById('modal-email-preview').style.display = 'flex';
  }

  function closeEmailPreviewModal() {
    document.getElementById('modal-email-preview').style.display = 'none';
    currentPreviewItem = null;
  }

  function sendSingleTestEmailFromPreview() {
    if (!currentPreviewItem) return;
    if (!confirm(`「${currentPreviewItem.visitorName}様」向けのテスト送信を実行しますか？`)) return;

    document.getElementById('loading').style.display = 'flex';
    ApiService.call('executeSend', currentPreviewItem.email, currentPreviewItem.templateKey, null, null, null, currentPreviewItem.visitorId)
      .then(() => {
        document.getElementById('loading').style.display = 'none';
        showToast('テストメールを送信しました！');
        closeEmailPreviewModal();
      })
      .catch(handleError);
  }

  function fetchDashboardData() {
    ApiService.call('getDashboardData')
      .then(data => {
        if (data) {
          renderDashboard(data);
        }
      })
      .catch(handleError);
  }

  function fetchAllVisitorsData() {
    showTableSkeleton('table-all-visitors', 11, 5);
    ApiService.call('getAllVisitorsApi')
      .then(res => {
        if (res && res.success) {
          cachedAllVisitors = deduplicateVisitorListClient(res.list || []);
          renderAllVisitorsTable(cachedAllVisitors);
        } else {
          renderAllVisitorsTable([]);
        }
      })
      .catch(err => {
        handleError(err);
        renderAllVisitorsTable([]);
      });
  }

  function fetchHearingListData() {
    showTableSkeleton('table-hearing-list', 10, 5);
    ApiService.call('getHearingSheetsListApi')
      .then(res => {
        if (res && res.success) {
          cachedHearingList = deduplicateVisitorListClient(res.list || []);
          renderHearingListTable(cachedHearingList);
        }
      })
      .catch(handleError);
  }

  let donutChartInstance = null;
  let lineChartInstance = null;

  function renderBniTermsSelectOptions(termsList, selectedStartDate) {
    if (!termsList || !Array.isArray(termsList)) return;
    const activeStartDate = selectedStartDate || "2025/01/01";
    const selects = [
      document.getElementById('select-start-date'),
      document.getElementById('setting-page-period-select')
    ];

    selects.forEach(selectEl => {
      if (!selectEl) return;
      let html = '';
      termsList.forEach(t => {
        const isSel = (t.dateStr === activeStartDate) || (!selectedStartDate && t.dateStr === "2025/01/01");
        html += `<option value="${t.dateStr}" ${isSel ? 'selected' : ''}>${t.label}</option>`;
      });
      selectEl.innerHTML = html;
    });
  }

  function renderDashboard(data) {
    if (!data) return;
    currentDashboardData = data;
    hideLoading();

    const cleanNum = (val, defaultVal) => {
      if (typeof val === 'number') return val;
      const s = String(val || "").replace(/[^0-9.]/g, '');
      return s !== "" ? s : defaultVal;
    };

    const setSafeText = (id, text) => {
      const el = document.getElementById(id);
      if (el) el.innerText = text;
    };

    setSafeText('date-next-thu', data.nextThuStr || '');
    setSafeText('date-after-next-thu', data.afterNextThuStr || '');
    setSafeText('title-next-meeting-date', data.nextThuStr ? `${data.nextThuStr} ` : '次回');
    setSafeText('title-last-meeting-date', data.lastThuStr ? `${data.lastThuStr} ` : '先週');

    const m = data.metrics || {};
    setSafeText('val-apply-count', cleanNum(m.applyCount, 0));
    setSafeText('val-joined-count', cleanNum(m.joinedCount, 0));
    setSafeText('val-target-goal', cleanNum(m.targetJoinGoal, 12));
    setSafeText('val-next-thu-count', cleanNum(m.nextThuCount, 0));
    setSafeText('val-after-next-thu-count', cleanNum(m.afterNextThuCount, 0));

    setSafeText('val-join-rate', cleanNum(m.joinRate, "0.0") + '%');
    setSafeText('val-achievement-rate', cleanNum(m.achievementRate, "0.0") + '%');
    setSafeText('val-avg-visitors', cleanNum(m.avgVisitorCount, "0.0"));
    setSafeText('val-feedback-rate', cleanNum(m.feedbackRate, "0.0") + '%');
    setSafeText('val-hearing-rate', cleanNum(m.hearingRate, "0.0") + '%');

    if (data.bniTermsList) {
      try { renderBniTermsSelectOptions(data.bniTermsList, data.startDateStr); } catch(e) {}
    }

    try {
      if (m.joinedCount !== undefined && m.targetJoinGoal !== undefined) {
        initDonutChart(m.joinedCount, m.targetJoinGoal);
      }
    } catch(e) {}

    try {
      if (data.chart && data.chart.labels && data.chart.data) {
        initLineChart(data.chart.labels, data.chart.data);
      }
    } catch(e) {}

    try { renderHotVisitorsTable(deduplicateVisitorListClient(data.tables ? data.tables.hotVisitors : [])); } catch(e) { console.error(e); }
    try { renderNextMeetingTable(deduplicateVisitorListClient(data.tables ? data.tables.nextMeeting : [])); } catch(e) { console.error(e); }
    try { renderLastMeetingTable(deduplicateVisitorListClient(data.tables ? data.tables.lastMeeting : [])); } catch(e) { console.error(e); }
    try { renderOneMonthTable(deduplicateVisitorListClient(data.tables ? data.tables.oneMonthFollowup : [])); } catch(e) { console.error(e); }
    try { renderWeeklyStatsTable(data.tables ? data.tables.weeklyStats : []); } catch(e) { console.error(e); }
    try { renderMonthlyStatsTable(data.tables ? data.tables.monthlyStats : []); } catch(e) { console.error(e); }
  }

  function normalizeNameKey(str) {
    if (!str) return '';
    let s = String(str);
    try { s = s.normalize('NFKC'); } catch (e) {}
    s = s.replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
    s = s.replace(/[・·\.\,\-\_]/g, '');
    s = s.replace(/[\s\u3000\t\r\n]+/g, '');
    return s.toLowerCase();
  }

  function deduplicateVisitorListClient(list) {
    if (!list || !Array.isArray(list) || list.length === 0) return [];

    const result = [];
    const nameMap = new Map();
    const furiganaMap = new Map();
    const emailMap = new Map();

    list.forEach(r => {
      const emailKey = r.email ? normalizeNameKey(r.email) : '';
      const rawName = r.name ? String(r.name).trim() : '';
      const isGenericName = !rawName || /^ビジター\s*(no\.?\s*\d+)?$/i.test(rawName);
      const nameKey = !isGenericName ? normalizeNameKey(rawName) : '';
      const furiganaKey = (r.furigana && !isGenericName) ? normalizeNameKey(r.furigana) : '';

      let existing = null;
      if (emailKey && emailMap.has(emailKey)) {
        existing = emailMap.get(emailKey);
      } else if (nameKey && nameMap.has(nameKey)) {
        existing = nameMap.get(nameKey);
      } else if (furiganaKey && furiganaMap.has(furiganaKey)) {
        existing = furiganaMap.get(furiganaKey);
      }

      if (!existing) {
        const entry = { ...r, historyCount: 1 };
        result.push(entry);

        if (emailKey) emailMap.set(emailKey, entry);
        if (nameKey) nameMap.set(nameKey, entry);
        if (furiganaKey) furiganaMap.set(furiganaKey, entry);
      } else {
        existing.historyCount = (existing.historyCount || 1) + 1;

        if (emailKey && !emailMap.has(emailKey)) emailMap.set(emailKey, existing);
        if (nameKey && !nameMap.has(nameKey)) nameMap.set(nameKey, existing);
        if (furiganaKey && !furiganaMap.has(furiganaKey)) furiganaMap.set(furiganaKey, existing);

        const tExisting = new Date(existing.eventDate || 0).getTime();
        const tNew = new Date(r.eventDate || 0).getTime();

        const isJoinedBool = (val) => (val === '入会済' || val === '済' || val === '入会' || val === true);
        const mergedAttended = (existing.isAttended === '参加' || r.isAttended === '参加') ? '参加' : (r.isAttended || existing.isAttended);
        const mergedJoined = (isJoinedBool(existing.isJoined) || isJoinedBool(r.isJoined)) ? '入会済' : (r.isJoined || existing.isJoined);
        const merged1to1 = (existing.is1to1 === '済' || r.is1to1 === '済') ? '済' : (r.is1to1 || existing.is1to1);
        const mergedHasHearing = existing.hasHearingSheet || r.hasHearingSheet;

        const mergedQ1 = r.q1 || existing.q1 || '';
        const mergedQ2 = r.q2 || existing.q2 || '';
        const mergedQ3 = r.q3 || existing.q3 || '';
        const mergedQ4 = r.q4 || existing.q4 || '';
        const mergedQ5 = r.q5 || existing.q5 || '';
        const mergedQ6 = r.q6 || existing.q6 || '';
        const mergedQ7 = r.q7 || existing.q7 || '';
        const mergedOrientUser = r.orientUser || existing.orientUser || '';
        const mergedOrientMemo = r.orientMemo || existing.orientMemo || '';
        const mergedFollowMemo = r.followMemo || existing.followMemo || '';
        const mergedFeelAbc = r.feelAbc || existing.feelAbc || '';
        const mergedSheetUrl = r.hearingUrl || r.sheetUrl || existing.hearingUrl || existing.sheetUrl || '';

        if (tNew >= tExisting) {
          Object.assign(existing, r, {
            historyCount: existing.historyCount,
            isAttended: mergedAttended,
            isJoined: mergedJoined,
            is1to1: merged1to1,
            hasHearingSheet: mergedHasHearing,
            q1: mergedQ1,
            q2: mergedQ2,
            q3: mergedQ3,
            q4: mergedQ4,
            q5: mergedQ5,
            q6: mergedQ6,
            q7: mergedQ7,
            orientUser: mergedOrientUser,
            orientMemo: mergedOrientMemo,
            followMemo: mergedFollowMemo,
            feelAbc: mergedFeelAbc,
            hearingUrl: mergedSheetUrl,
            sheetUrl: mergedSheetUrl
          });
        } else {
          existing.isAttended = mergedAttended;
          existing.isJoined = mergedJoined;
          existing.is1to1 = merged1to1;
          existing.hasHearingSheet = mergedHasHearing;
          existing.q1 = mergedQ1;
          existing.q2 = mergedQ2;
          existing.q3 = mergedQ3;
          existing.q4 = mergedQ4;
          existing.q5 = mergedQ5;
          existing.q6 = mergedQ6;
          existing.q7 = mergedQ7;
          existing.orientUser = mergedOrientUser;
          existing.orientMemo = mergedOrientMemo;
          existing.followMemo = mergedFollowMemo;
          existing.feelAbc = mergedFeelAbc;
          existing.hearingUrl = mergedSheetUrl;
          existing.sheetUrl = mergedSheetUrl;
        }
      }
    });

    return result;
  }

  /* --- 🔥 入会温度感の高いビジター(HOT)テーブル描画 (評価 A かつ 未入会 のみ、重複統合) --- */
  function renderHotVisitorsTable(records) {
    const tbody = document.getElementById('table-hot-visitors');
    if (!tbody) return;
    tbody.innerHTML = '';

    // 評価 A のみ かつ 未入会 のみ表示 (1人1行に統合)
    const validRecords = deduplicateVisitorListClient((records || []).filter(r => {
      const g = parseFeelAbc(r.feelAbc);
      const isJoined = (r.isJoined === '入会済' || r.isJoined === '済' || r.isJoined === '入会' || r.isJoined === true);
      return g === 'A' && !isJoined;
    }));

    if (validRecords.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #868e96; padding: 20px;">🔥 現在、感触【A評価】の最優先フォロー対象（未入会）ビジターはいません</td></tr>`;
      return;
    }

    validRecords.forEach(r => {
      const tr = document.createElement('tr');
      const is1to1Class = r.is1to1 === '済' ? 'done' : 'none';
      const hearingBtnClass = r.hasHearingSheet ? 'btn-hearing has-data' : 'btn-hearing';
      const hearingBtnText = r.hasHearingSheet ? '<i class="fa-solid fa-pen-to-square"></i> シート' : '<i class="fa-solid fa-plus"></i> 入力';

      const countBadge = (r.historyCount && r.historyCount > 1)

  /* --- 🔥 最優先フォロー専用ページ（感触A評価・未入会一覧 ＆ 50件ページネーション） --- */
  let pfCurrentPage = 1;
  const pfPageSize = 50;
  let pfFilteredList = [];
  let pfGradeFilter = 'ALL';
  let cachedPriorityFollowList = [];

  function fetchPriorityFollowData() {
    showTableSkeleton('table-priority-follow-page', 10, 5);
    ApiService.call('getAllVisitorsApi')
      .then(res => {
        if (res && res.success) {
          const list = res.list || [];
          // まず全体を重複統合（1人1行）してから A/B評価 かつ 未入会 のみを抽出
          const deduplicatedList = deduplicateVisitorListClient(list);
          cachedPriorityFollowList = deduplicatedList.filter(item => {
            const grade = parseFeelAbc(item.feelAbc || item.feeling);
            const joinedVal = item.isJoined || item.is_joined;
            const isJoined = (joinedVal === '入会済' || joinedVal === '済' || joinedVal === '入会' || joinedVal === true);
            return (grade === 'A' || grade === 'B') && !isJoined;
          });
          filterPriorityFollowTable();
        } else {
          cachedPriorityFollowList = [];
          renderPriorityFollowCurrentPage();
        }
      })
      .catch(err => {
        handleError(err);
        cachedPriorityFollowList = [];
        renderPriorityFollowCurrentPage();
      });
  }

  function setPriorityFollowGradeFilter(grade) {
    pfGradeFilter = grade;
    ['all', 'a', 'b', 'c'].forEach(g => {
      const btn = document.getElementById('pf-tab-' + g);
      if (btn) btn.classList.remove('active');
    });
    const activeBtn = document.getElementById('pf-tab-' + grade.toLowerCase());
    if (activeBtn) activeBtn.classList.add('active');
    filterPriorityFollowTable();
  }

  function filterPriorityFollowTable() {
    const q = (document.getElementById('search-priority-follow-input')?.value || '').toLowerCase().trim();

    pfFilteredList = cachedPriorityFollowList.filter(r => {
      const grade = parseFeelAbc(r.feelAbc || r.feeling);
      const joinedVal = r.isJoined || r.is_joined;
      const isJoined = (joinedVal === '入会済' || joinedVal === '済' || joinedVal === '入会' || joinedVal === true);
      const matchesGrade = (grade === 'A' || grade === 'B') && !isJoined;

      const matchesQ = !q ||
        (r.name || '').toLowerCase().includes(q) ||
        (r.company || '').toLowerCase().includes(q) ||
        (r.profession || '').toLowerCase().includes(q) ||
        (r.inviter || '').toLowerCase().includes(q) ||
        (r.orientUser || '').toLowerCase().includes(q);

      return matchesGrade && matchesQ;
    });

    pfCurrentPage = 1;
    renderPriorityFollowCurrentPage();
  }

  function changePriorityFollowPage(delta) {
    const totalPages = Math.ceil(pfFilteredList.length / pfPageSize) || 1;
    pfCurrentPage += delta;
    if (pfCurrentPage < 1) pfCurrentPage = 1;
    if (pfCurrentPage > totalPages) pfCurrentPage = totalPages;
    renderPriorityFollowCurrentPage();
  }

  function renderPriorityFollowCurrentPage() {
    const tbody = document.getElementById('table-priority-follow-page');
    if (!tbody) return;
    tbody.innerHTML = '';

    const totalRecords = pfFilteredList.length;
    const totalPages = Math.ceil(totalRecords / pfPageSize) || 1;
    if (pfCurrentPage > totalPages) pfCurrentPage = totalPages;
    if (pfCurrentPage < 1) pfCurrentPage = 1;

    const startIdx = (pfCurrentPage - 1) * pfPageSize;
    const endIdx = Math.min(startIdx + pfPageSize, totalRecords);

    // ページネーションUI表示の更新
    const infoEl = document.getElementById('pf-pagination-info');
    const pageNumEl = document.getElementById('pf-pagination-page-num');
    const prevBtn = document.getElementById('btn-pf-prev-page');
    const nextBtn = document.getElementById('btn-pf-next-page');

    if (infoEl) {
      infoEl.innerText = totalRecords === 0
        ? '全 0 件中 0 - 0 件を表示'
        : `全 ${totalRecords} 件中 ${startIdx + 1} - ${endIdx} 件を表示`;
    }
    if (pageNumEl) pageNumEl.innerText = `${pfCurrentPage} / ${totalPages}`;
    if (prevBtn) prevBtn.disabled = (pfCurrentPage <= 1);
    if (nextBtn) nextBtn.disabled = (pfCurrentPage >= totalPages);

    if (totalRecords === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #868e96; padding: 24px;">該当する最優先フォロー対象（A・B評価・未入会）のビジターはいません</td></tr>`;

    const pageRecords = pfFilteredList.slice(startIdx, endIdx);

    pageRecords.forEach(r => {

      tr.innerHTML = `

  function initDonutChart(joined, target) {
    const canvas = document.getElementById('donutChart');
    if (!canvas || typeof Chart === 'undefined') return;
    if (donutChartInstance) {
      try { donutChartInstance.destroy(); } catch(e) {}
    }
    const ctx = canvas.getContext('2d');
    const remain = Math.max(0, target - joined);
    try {
      donutChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [joined, remain],
            backgroundColor: ['#e63946', '#e9ecef'],
            borderWidth: 0
          }]
        },
        options: {
          cutout: '72%',
          responsive: true,
          maintainAspectRatio: false,
          plugins: { tooltip: { enabled: false } }
        }
      });
    } catch(e) {
      console.warn('Donut chart error:', e);
    }
  }

  function initLineChart(labels, values) {
    const canvas = document.getElementById('lineChart');
    if (!canvas || typeof Chart === 'undefined') return;
    if (lineChartInstance) {
      try { lineChartInstance.destroy(); } catch(e) {}
    }
    const ctx = canvas.getContext('2d');
    try {
      lineChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'ビジター数',
            data: values,
            borderColor: '#e63946',
            backgroundColor: 'rgba(230, 57, 70, 0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#e63946'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 9 } } },
            y: { display: false, beginAtZero: true }
          }
        }
      });
    } catch(e) {
      console.warn('Line chart error:', e);
    }
  }

  function changeVisitorsPage(delta) {

  function renderVisitorsCurrentPage() {
    const tbody = document.getElementById('table-all-visitors');
    if (!tbody) return;
    tbody.innerHTML = '';

    const totalRecords = visitorsFilteredList.length;
    const totalPages = Math.ceil(totalRecords / visitorsPageSize) || 1;
    if (visitorsCurrentPage > totalPages) visitorsCurrentPage = totalPages;
    if (visitorsCurrentPage < 1) visitorsCurrentPage = 1;

    const startIdx = (visitorsCurrentPage - 1) * visitorsPageSize;
    const endIdx = Math.min(startIdx + visitorsPageSize, totalRecords);

    // ページネーションUI表示の更新
    const infoEl = document.getElementById('visitors-pagination-info');
    const pageNumEl = document.getElementById('visitors-pagination-page-num');
    const prevBtn = document.getElementById('btn-visitors-prev-page');
    const nextBtn = document.getElementById('btn-visitors-next-page');

    if (infoEl) {
      infoEl.innerText = totalRecords === 0
        ? '全 0 件中 0 - 0 件を表示'
        : `全 ${totalRecords} 件中 ${startIdx + 1} - ${endIdx} 件を表示`;
    }
    if (pageNumEl) pageNumEl.innerText = `${visitorsCurrentPage} / ${totalPages}`;
    if (prevBtn) prevBtn.disabled = (visitorsCurrentPage <= 1);
    if (nextBtn) nextBtn.disabled = (visitorsCurrentPage >= totalPages);

    if (totalRecords === 0) {
      tbody.innerHTML = `<tr><td colspan="11" style="text-align: center; color: #868e96; padding: 20px;">データがありません</td></tr>`;
      return;
    }

    const pageRecords = visitorsFilteredList.slice(startIdx, endIdx);

    pageRecords.forEach(r => {
      const tr = document.createElement('tr');
      const attendClass = r.isAttended === '参加' ? 'attended' : 'absent';
      const hearingBtnClass = r.hasHearingSheet ? 'btn-hearing has-data' : 'btn-hearing';
      const hearingBtnText = r.hasHearingSheet ? '<i class="fa-solid fa-pen-to-square"></i> シート確認' : '<i class="fa-solid fa-plus"></i> シート入力';
      const is1to1Class = r.is1to1 === '済' ? 'done' : 'none';
      const isJoined = (r.isJoined === '入会済' || r.isJoined === '済' || r.isJoined === '入会' || r.isJoined === true);
      const joinClass = isJoined ? 'done' : 'none';
      const joinText = isJoined ? '入会済' : '未';

      tr.innerHTML = `
        <td style="font-weight: 700;">${escapeHtml(r.no)}</td>
        <td style="font-weight: 700;">${formatTruncatedCell(r.inviter, 12)}</td>
        <td style="font-weight: 700; white-space: nowrap;">${escapeHtml(r.eventDate)}</td>
        <td>
          <strong class="link-visitor-name" style="font-weight: 800; color: var(--primary-accent); cursor: pointer; text-decoration: underline; font-size: 14px;" title="クリックでビジター詳細プロファイルを表示">${escapeHtml(r.name)}</strong>
          <div style="color: #6c757d; font-size: 11px; margin-top: 2px;">${escapeHtml(r.furigana)}</div>
        </td>
        <td>
          <div style="font-weight: 600; color: #212529; font-size: 13px;">${formatTruncatedCell(r.profession, 15)}</div>
          <div style="color: #6c757d; font-size: 11px; margin-top: 2px;">${formatTruncatedCell(r.company, 15)}</div>
        </td>
        <td><span class="badge-count">${escapeHtml(r.attendanceCount)}</span></td>
        <td>
          <label class="toggle-attend-wrapper">
            <input type="checkbox" class="toggle-attend ${attendClass}" ${r.isAttended === '参加' ? 'checked' : ''} />
          </label>
        </td>
        <td><button class="${hearingBtnClass} btn-hearing-act">${hearingBtnText}</button></td>
        <td><span class="badge-toggle ${is1to1Class} btn-toggle-1to1">${escapeHtml(r.is1to1 || '未')}</span></td>
        <td><span class="badge-toggle ${joinClass} btn-toggle-joined">${escapeHtml(joinText)}</span></td>
        <td style="white-space: nowrap;">
          <div class="action-btn-group">
            <button class="btn-table-action primary btn-detail-act" title="詳細プロファイル"><i class="fa-solid fa-id-card"></i> 詳細</button>
            <button class="btn-table-action btn-edit-act" title="編集"><i class="fa-solid fa-pen"></i> 編集</button>
            <button class="btn-table-action danger btn-delete-act" title="削除"><i class="fa-solid fa-trash"></i> 削除</button>
          </div>
        </td>
      `;

      tr.querySelector('.link-visitor-name').onclick = () => openVisitorDetailModal(r.id);
      tr.querySelector('.toggle-attend').onchange = (e) => toggleAttend(r.id, e.target.checked ? '参加' : '不参加');
      tr.querySelector('.btn-hearing-act').onclick = () => openHearingFormModal(r.id);
      tr.querySelector('.btn-toggle-1to1').onclick = () => toggle1to1(r.id, r.is1to1);
      tr.querySelector('.btn-toggle-joined').onclick = () => toggleJoined(r.id, r.isJoined);
      tr.querySelector('.btn-detail-act').onclick = () => openVisitorDetailModal(r.id);
      tr.querySelector('.btn-edit-act').onclick = () => openEditVisitorModal(r.id);
      tr.querySelector('.btn-delete-act').onclick = () => deleteVisitor(r.id, r.name);

      tbody.appendChild(tr);
    });

  /* --- ビジター全一覧テーブル描写 (CRUD ＆ 50件ページネーション対応) --- */
  function renderAllVisitorsTable(records) {
    if (!records) records = [];

    // 参加日順（最新順）に並び替え
    visitorsFilteredList = [...records].sort((a, b) => {
      const ta = a.eventDate ? new Date(a.eventDate).getTime() : 0;
      const tb = b.eventDate ? new Date(b.eventDate).getTime() : 0;
      return tb - ta;
    });

    visitorsCurrentPage = 1;
    renderVisitorsCurrentPage();
  }

  function filterAllVisitorsTable() {
    const q = (document.getElementById('search-visitors-input')?.value || '').toLowerCase().trim();
    const fromVal = document.getElementById('visitors-date-from')?.value || '';
    const toVal = document.getElementById('visitors-date-to')?.value || '';
    const fromDate = fromVal ? new Date(fromVal) : null;
    const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;

    const filtered = cachedAllVisitors.filter(r => {
      // テキスト検索
      const matchesQ = !q ||
        (r.name || '').toLowerCase().includes(q) ||
        (r.company || '').toLowerCase().includes(q) ||
        (r.profession || '').toLowerCase().includes(q) ||
        (r.inviter || '').toLowerCase().includes(q);

      // 日付範囲フィルタ
      let matchesDate = true;
      if (fromDate || toDate) {
        const d = r.eventDate ? new Date(r.eventDate) : null;
        if (!d) return false;
        if (fromDate && d < fromDate) matchesDate = false;
        if (toDate && d > toDate) matchesDate = false;
      }

      return matchesQ && matchesDate;
    });

    renderAllVisitorsTable(filtered);
  }

  function clearVisitorsDateFilter() {
    const fromEl = document.getElementById('visitors-date-from');
    const toEl = document.getElementById('visitors-date-to');
    if (fromEl) fromEl.value = '';

    filterAllVisitorsTable();
  }

  /* --- CRUD Modal Controls --- */
  function formatDateForInput(str) {
    if (!str) return '';
    const parts = String(str).replace(/年|月/g, '/').replace(/日/g, '').replace(/\./g, '/').replace(/-/g, '/').split('/');
    if (parts.length === 3) {
      const y = parts[0].trim();
      const m = parts[1].trim().padStart(2, '0');
      const d = parts[2].trim().padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    return '';
  }

  function renderOrientUserOptions(cats, selectedVal) {
    const select = document.getElementById('hf-orient-user');
    if (!select) return;
    select.innerHTML = '<option value="">-- DBより選択 (オリエン担当者) --</option>';

    let found = false;
    if (cats && cats.length > 0) {
      cats.forEach(catObj => {
        const grp = document.createElement('optgroup');
        grp.label = catObj.category;
        if (catObj.members && catObj.members.length > 0) {
          catObj.members.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.name;
            opt.textContent = `${m.name} (${m.profession || ''})`;
            if (m.name === selectedVal) {
              opt.selected = true;
              found = true;
            }
            grp.appendChild(opt);
          });
        }
        select.appendChild(grp);
      });
    }

    if (selectedVal && !found) {
      const opt = document.createElement('option');
      opt.value = selectedVal;
      opt.textContent = `${selectedVal} (登録内容)`;
      opt.selected = true;
      select.appendChild(opt);
    }

    if (selectedVal) select.value = selectedVal;
  }

        document.getElementById('vd-q5').innerText = h.q5 || '-';
        document.getElementById('vd-q6').innerText = h.q6 || '-';
        document.getElementById('vd-q7').innerText = h.q7 || '-';
        document.getElementById('vd-orient-memo').innerText = h.orientMemo || '-';
        document.getElementById('vd-follow-memo').innerText = h.followMemo || '-';

        // メール履歴
        const mailContainer = document.getElementById('vd-mail-history-list');
        mailContainer.innerHTML = '';
        if (res.mailLogs && res.mailLogs.length > 0) {
          res.mailLogs.forEach(m => {
            const div = document.createElement('div');
            div.style.cssText = 'padding: 12px 16px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #364fc7; display: flex; justify-content: space-between; align-items: center; font-size: 13px;';
            div.innerHTML = `
              <div>
                <strong style="color:#343a40;">${m.mailType}</strong>
                <div style="font-size: 11px; color: #6c757d; margin-top:2px;">送信日時: ${m.sentAt}</div>
              </div>
              <span style="font-size: 11px; font-weight: 800; color: #2b8a3e; background: #d3f9d8; padding: 3px 10px; border-radius: 10px;">${m.status}</span>
            `;
            mailContainer.appendChild(div);
          });
        } else {
          mailContainer.innerHTML = '<div style="color:#868e96; font-size:13px; padding: 10px;">メール送信履歴はありません</div>';
        }

        document.getElementById('vd-btn-open-hearing-page').onclick = () => {
          openHearingFormModal(id);
        };

        // 画面全体を VIEW 4 (ビジター詳細全画面) へ切り替え
        document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('view-visitor-detail').classList.add('active');

        switchVdTab('hearing');
        window.scrollTo(0, 0);
      })
      .catch(handleError);
  }

  function closeVisitorDetailView() {
    switchTab(previousTabBeforeDetail || 'dashboard', true);
  }

  function openCurrentVisitorInNewTab() {
    if (!currentVdVisitorId) return;
    if (currentVdWebAppUrl) {
      window.open(`${currentVdWebAppUrl}?id=${currentVdVisitorId}`, '_blank');
    } else {
      alert('Web App URLが読み込めていません');
    }
  }

  function switchVdTab(tab) {
    document.getElementById('vd-tab-btn-hearing').classList.toggle('active', tab === 'hearing');
    document.getElementById('vd-tab-btn-memo').classList.toggle('active', tab === 'memo');
    document.getElementById('vd-tab-btn-mail').classList.toggle('active', tab === 'mail');

    document.getElementById('vd-tab-content-hearing').style.display = tab === 'hearing' ? 'block' : 'none';
    document.getElementById('vd-tab-content-memo').style.display = tab === 'memo' ? 'block' : 'none';
    document.getElementById('vd-tab-content-mail').style.display = tab === 'mail' ? 'block' : 'none';
  }

  function saveVisitorFreeMemo() {
    if (!currentVdVisitorId) return;
    const memoText = document.getElementById('vd-free-memo').value.trim();
    showToast(`自由メモを保存中...`);

    ApiService.call('saveVisitorMemoApi', currentVdVisitorId, memoText)
      .then(res => {
        showToast(`✅ メモを正常に保存しました！`);
        fetchDashboardData();
        if (cachedAllVisitors.length > 0) fetchAllVisitorsData();
      })
      .catch(handleError);
  }

  function toggleJoined(id, current) {
    const isJoinedBool = (current === '入会済' || current === '済' || current === '入会' || current === true);
    const next = isJoinedBool ? '未' : '入会済';
    showToast(`入会ステータスを変更中...`);
    ApiService.call('updateVisitorStatusApi', id, 'isJoined', next)
      .then(res => {
        showToast(`✅ 入会状況を【${next}】に変更しました`);
        refreshAllActiveViews();
      })
      .catch(handleError);
  }

  function syncFormResponsesManual() {
    showToast(`Googleフォーム新着申込を同期中...`);
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'flex';

    ApiService.call('syncFormResponsesApi')
      .then(res => {
        if (loading) loading.style.display = 'none';

        const msg = (res && typeof res === 'object' && res.message)
          ? res.message
          : String(res || '同期が完了しました。');

        alert("【Googleフォーム同期結果】\n\n" + msg);

        if (res && res.data) {
          renderDashboard(res.data);
        } else {
          fetchDashboardData(true);
        }
        if (cachedAllVisitors.length > 0) fetchAllVisitorsData(true);
      })
      .catch(err => {
        if (loading) loading.style.display = 'none';
        alert("❌ フォーム同期中にエラーが発生しました:\n" + (err.message || err));
      });
  }

  function forceRefreshAllCacheAndData() {
    showToast(`🔄 キャッシュをクリアし、最新データを再読み込み中...`);
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'flex';

    try { sessionStorage.clear(); } catch(e) {}
    cachedAllVisitors = [];
    cachedHearingList = [];
    cachedScheduledEmails = [];

    ApiService.call('checkAndRepairDataFormatApi')
      .then(res => {
        if (loading) loading.style.display = 'none';
        showToast(`✨ キャッシュをクリアし、最新データをロードしました！`);
        fetchDashboardData(true);
        const activeTab = document.querySelector('.main-tab-bar .tab-btn.active');
        if (activeTab) {
          const tabId = activeTab.id.replace('tab-btn-', '');
          if (tabId === 'visitors') fetchAllVisitorsData(true);
          else if (tabId === 'hearings') fetchHearingListData(true);
          else if (tabId === 'email-schedule') fetchScheduledEmailsData(true);
        }
      })
      .catch(handleError);
  }

  function changeStartDate(newVal) {
    showToast(`集計期間を【${newVal} 〜】に変更中...`);
    document.getElementById('loading').style.display = 'flex';

    ApiService.call('updateSettingStartDateApi', newVal)
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        if (res.success) {
          showToast(`✅ 集計期間を【${newVal} 〜】に切り替えました`);
          renderDashboard(res.data);
        }
      })
      .catch(handleError);
  }

  /* --- 👥 Member Master Setting CRUD Controls --- */
  let cachedFlatMembers = [];

  function fetchMembersMasterData() {
    document.getElementById('loading').style.display = 'flex';
    ApiService.call('getMemberListApi')
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        if (res.success) {
          cachedFlatMembers = res.flatMembers || [];
          renderMembersMasterTable(cachedFlatMembers);
        }
      })
      .catch(handleError);
  }

  function renderMembersMasterTable(members) {
    const tbody = document.getElementById('table-members-master');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (!members || members.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #868e96; padding: 20px;">登録されているメンバーはありません</td></tr>`;
      return;
    }

    members.forEach((m, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight: 700;">${idx + 1}</td>
        <td><span style="font-weight:700; color:#364fc7; background:#e7f5ff; padding:3px 10px; border-radius:12px; font-size:12px;">${formatTruncatedCell(m.category, 12)}</span></td>
        <td style="font-weight: 800; font-size:14px; color:#212529;">${m.name}</td>
        <td style="color:#495057; font-weight:700;">${formatTruncatedCell(m.profession, 15)}</td>
        <td>
          <button class="btn-icon-action" onclick="openEditMemberModal('${m.id}')" title="編集"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-icon-action btn-icon-danger" onclick="deleteMemberMaster('${m.id}', '${m.name}')" title="削除"><i class="fa-solid fa-trash"></i></button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function openAddMemberModal() {
    document.getElementById('modal-member-title').innerText = '新規メンバー追加';
    document.getElementById('crud-m-id').value = '';
    document.getElementById('crud-m-category').value = '';
    document.getElementById('crud-m-name').value = '';
    document.getElementById('crud-m-profession').value = '';
    document.getElementById('modal-member-crud').style.display = 'flex';
  }

  function openEditMemberModal(id) {
    const m = cachedFlatMembers.find(item => String(item.id) === String(id));
    if (!m) return;
    document.getElementById('modal-member-title').innerText = 'メンバー情報の編集';
    document.getElementById('crud-m-id').value = m.id;
    document.getElementById('crud-m-category').value = m.category || '';
    document.getElementById('crud-m-name').value = m.name || '';
    document.getElementById('crud-m-profession').value = m.profession || '';
    document.getElementById('modal-member-crud').style.display = 'flex';
  }

  function closeMemberCrudModal() {
    document.getElementById('modal-member-crud').style.display = 'none';
  }

  function submitMemberCrudForm() {
    const id = document.getElementById('crud-m-id').value;
    const category = document.getElementById('crud-m-category').value.trim();
    const name = document.getElementById('crud-m-name').value.trim();
    const profession = document.getElementById('crud-m-profession').value.trim();

    if (!category || !name || !profession) {
      alert('全ての必須項目を入力してください');
      return;
    }

    const mObj = { id, category, name, profession };
    showToast(id ? `メンバー情報を更新中...` : `メンバーを追加中...`);
    document.getElementById('loading').style.display = 'flex';

    const apiFunc = id ? 'updateMemberApi' : 'addMemberApi';

    ApiService.call(apiFunc, mObj)
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        closeMemberCrudModal();
        showToast(`✅ メンバーを保存しました`);
        cachedFlatMembers = res.flatMembers || [];
        renderMembersMasterTable(cachedFlatMembers);
      })
      .catch(handleError);
  }

  function deleteMemberMaster(id, name) {
    if (!confirm(`【確認】メンバー「${name}」をリストから削除してよろしいですか？`)) return;
    showToast(`メンバーを削除中...`);
    document.getElementById('loading').style.display = 'flex';

    ApiService.call('deleteMemberApi', id)
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        showToast(`🗑️ メンバーを削除しました`);
        cachedFlatMembers = res.flatMembers || [];
        renderMembersMasterTable(cachedFlatMembers);
      })
      .catch(handleError);
  }

  function renderBniTermsSelectOptions(termsList, selectedDate) {
    ['select-start-date', 'setting-page-period-select'].forEach(elemId => {
      const select = document.getElementById(elemId);
      if (!select || !termsList) return;
      select.innerHTML = '';

      termsList.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.dateStr;
        opt.textContent = t.label;
        if (t.dateStr === selectedDate) opt.selected = true;
        select.appendChild(opt);
      });
    });
  }

  function showToast(msg) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#51cf66;"></i> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function handleError(err) {
    document.getElementById('loading').style.display = 'none';
    alert('エラーが発生しました: ' + (err.message || err));
  }
</script>
