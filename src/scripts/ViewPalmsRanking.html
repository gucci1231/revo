<script>
/**
 * PALMS & BNI Traffic Lights View Controller (REvo OS Phase 2)
 * Full 100-Point Scoring System + PPW / RPW Analytics + Flexible Period Selection + Rich Chart.js
 */

let currentPalmsRecords = [];
let currentPalmsPeriodsList = [];
let currentPalmsMetric = 'total';
let currentPalmsSort = { field: 'total_score', asc: false };
let currentPalmsPeriod = { startDate: null, endDate: null };
let isPalmsSyncing = false;

// Chart.js Instances
let palmsDonutChart = null;
let palmsPpwChart = null;
let palmsRadarChart = null;
let palmsTrendChart = null;

/**
 * Human-friendly period label formatter
 */
function formatPalmsPeriodLabel(p) {
  const s = p.start_date;
  const e = p.end_date;
  if (s === '2024-10-01' && e === '2026-09-30') return `過去2年間累計 (2024/10〜2026/09) [${p.member_count}名]`;
  if (s === '2026-04-01' && e === '2026-09-30') return `直近第2期 6ヶ月 (2026/04〜2026/09) ★最新基準 [${p.member_count}名]`;
  if (s === '2025-10-01' && e === '2026-03-31') return `第1期後半 6ヶ月 (2025/10〜2026/03) [${p.member_count}名]`;
  if (s === '2025-04-01' && e === '2025-09-30') return `第1期前半 6ヶ月 (2025/04〜2025/09) [${p.member_count}名]`;
  if (s === '2026-08-27' && e === '2026-09-24') return `直近4週間 (2026/08/27〜09/24) [${p.member_count}名]`;
  if (s === '2026-09-17' && e === '2026-09-24') return `直近定例会 週次 (2026/09/17〜09/24) [${p.member_count}名]`;
  const sFmt = s.replace(/-/g, '/');
  const eFmt = e.replace(/-/g, '/');
  return `${sFmt} 〜 ${eFmt} (${p.member_count}名)`;
}

/**
 * Fetch list of available PALMS periods
 */
function fetchPalmsPeriods() {
  const selectEl = document.getElementById('palms-period-select');
  if (!selectEl) return;

  ApiService.call('getPalmsPeriodsApi')
    .then(res => {
      if (res && res.success && Array.isArray(res.periods) && res.periods.length > 0) {
        currentPalmsPeriodsList = res.periods;
        selectEl.innerHTML = '';
        
        // Priority order for default period: 2026-04-01_2026-09-30 (Latest 6M)
        let defaultVal = '';
        const pref6M = res.periods.find(p => p.start_date === '2026-04-01' && p.end_date === '2026-09-30');
        const pref4W = res.periods.find(p => p.start_date === '2026-08-27' && p.end_date === '2026-09-24');
        const pref2Y = res.periods.find(p => p.start_date === '2024-10-01' && p.end_date === '2026-09-30');
        
        if (pref6M) defaultVal = `${pref6M.start_date}_${pref6M.end_date}`;
        else if (pref4W) defaultVal = `${pref4W.start_date}_${pref4W.end_date}`;
        else if (pref2Y) defaultVal = `${pref2Y.start_date}_${pref2Y.end_date}`;
        else defaultVal = `${res.periods[0].start_date}_${res.periods[0].end_date}`;

        res.periods.forEach(p => {
          const opt = document.createElement('option');
          opt.value = `${p.start_date}_${p.end_date}`;
          opt.textContent = formatPalmsPeriodLabel(p);
          if (opt.value === defaultVal && !currentPalmsPeriod.startDate) {
            opt.selected = true;
          }
          selectEl.appendChild(opt);
        });

        // Trigger load for the selected period
        if (selectEl.value) {
          const [s, e] = selectEl.value.split('_');
          fetchPalmsRankingData(s, e);
        }
      } else {
        selectEl.innerHTML = '<option value="">登録期間なし</option>';
        fetchPalmsRankingData();
      }
    })
    .catch(err => {
      console.error('Failed to fetch PALMS periods:', err);
      selectEl.innerHTML = '<option value="">期間取得失敗</option>';
      fetchPalmsRankingData();
    });
}

/**
 * Change selected PALMS period from dropdown
 */
function changePalmsPeriod(val) {
  if (!val) return;
  const [s, e] = val.split('_');
  updatePeriodPresetPillActive(s, e);
  fetchPalmsRankingData(s, e);
}

/**
 * Select from quick preset pills
 */
function selectPalmsPreset(presetKey) {
  let s = '';
  let e = '';

  if (presetKey === '4weeks') {
    s = '2026-08-27';
    e = '2026-09-24';
  } else if (presetKey === 'term2') {
    s = '2026-04-01';
    e = '2026-09-30';
  } else if (presetKey === 'term1_h2') {
    s = '2025-10-01';
    e = '2026-03-31';
  } else if (presetKey === 'term1_h1') {
    s = '2025-04-01';
    e = '2025-09-30';
  } else if (presetKey === '2years') {
    s = '2024-10-01';
    e = '2026-09-30';
  }

  if (s && e) {
    updatePeriodPresetPillActive(s, e);
    
    // Update select dropdown if matching option exists
    const selectEl = document.getElementById('palms-period-select');
    if (selectEl) {
      const matchVal = `${s}_${e}`;
      for (let i = 0; i < selectEl.options.length; i++) {
        if (selectEl.options[i].value === matchVal) {
          selectEl.selectedIndex = i;
          break;
        }
      }
    }

    fetchPalmsRankingData(s, e);
  }
}

/**
 * Toggle custom period selection bar
 */
function toggleCustomPeriodBar(forceState = null) {
  const bar = document.getElementById('palms-custom-period-bar');
  if (!bar) return;
  const isHidden = bar.classList.contains('hidden');
  const shouldShow = (forceState !== null) ? forceState : isHidden;

  if (shouldShow) {
    bar.classList.remove('hidden');
    // Set default values from current period
    const startInput = document.getElementById('palms-custom-start');
    const endInput = document.getElementById('palms-custom-end');
    if (startInput && currentPalmsPeriod.startDate) startInput.value = currentPalmsPeriod.startDate;
    if (endInput && currentPalmsPeriod.endDate) endInput.value = currentPalmsPeriod.endDate;
  } else {
    bar.classList.add('hidden');
  }
}

/**
 * Apply user-entered custom date range
 */
function applyCustomPalmsPeriod() {
  const startInput = document.getElementById('palms-custom-start');
  const endInput = document.getElementById('palms-custom-end');
  if (!startInput || !endInput || !startInput.value || !endInput.value) {
    showToast('開始日と終了日を両方入力してください', 'warning');
    return;
  }

  const s = startInput.value;
  const e = endInput.value;

  if (s > e) {
    showToast('開始日は終了日以前の日付を指定してください', 'warning');
    return;
  }

  // Check if period already exists in loaded periods
  const exists = currentPalmsPeriodsList.some(p => p.start_date === s && p.end_date === e);

  if (exists) {
    fetchPalmsRankingData(s, e);
    toggleCustomPeriodBar(false);
  } else {
    // Need to crawl / sync from BNI Connect for this specific date range
    showToast(`BNI Connectより指定期間 (${s}〜${e}) を取得中...`, 'info');
    
    // Format to MM/DD/YYYY for BNI Connect API
    const partsS = s.split('-');
    const partsE = e.split('-');
    const bniStart = `${partsS[1]}/${partsS[2]}/${partsS[0]}`;
    const bniEnd = `${partsE[1]}/${partsE[2]}/${partsE[0]}`;

    ApiService.call('syncPalmsApi', bniStart, bniEnd)
      .then(res => {
        if (res && res.success) {
          showToast(res.message || '指定期間のデータを正常に取得しました', 'success');
          toggleCustomPeriodBar(false);
          fetchPalmsPeriods();
        } else {
          showToast('データ取得に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
        }
      })
      .catch(err => {
        console.error('Custom sync error:', err);
        showToast('通信エラーが発生しました', 'error');
      });
  }
}

/**
 * Update active state of preset pills
 */
function updatePeriodPresetPillActive(s, e) {
  const pills = document.querySelectorAll('#palms-period-presets .palms-period-pill');
  pills.forEach(pill => {
    const key = pill.getAttribute('data-preset');
    let match = false;
    if (key === '4weeks' && s === '2026-08-27' && e === '2026-09-24') match = true;
    else if (key === 'term2' && s === '2026-04-01' && e === '2026-09-30') match = true;
    else if (key === 'term1_h2' && s === '2025-10-01' && e === '2026-03-31') match = true;
    else if (key === 'term1_h1' && s === '2025-04-01' && e === '2025-09-30') match = true;
    else if (key === '2years' && s === '2024-10-01' && e === '2026-09-30') match = true;

    if (match) {
      pill.classList.add('active', 'border-blue-600', 'bg-blue-50', 'text-blue-700');
      pill.classList.remove('border-slate-200', 'bg-white', 'text-slate-600');
    } else {
      pill.classList.remove('active', 'border-blue-600', 'bg-blue-50', 'text-blue-700');
      pill.classList.add('border-slate-200', 'bg-white', 'text-slate-600');
    }
  });
}

/**
 * Calculate BNI Traffic Lights Official 100-Point Score & PPW / RPW
 * Formula Source: BNI Member Traffic Lights Report (2025/10~) & Summary PALMS Report
 */
function calcBniTrafficLightScore(r, weeks) {
  // Number of meeting weeks in period (W = P + A + L + M + S)
  const meetingCount = (r.p || 0) + (r.a || 0) + (r.l || 0) + (r.m || 0) + (r.s || 0);
  const w = Math.max(1, meetingCount > 0 ? meetingCount : weeks);

  // --- RPW & PPW Metrics (Summary PALMS Standard) ---
  // RPW = (RGI + RGO) / W (Referrals Given per Week)
  const totalRefGiven = r.total_referrals_given || 0;
  const rpw = totalRefGiven / w;

  // PPW = (RGI + RGO + Visitors + Testimonials/Sponsors) / W
  const sponsors = Number(r.testimonials || r.sponsors || 0);
  const visitors = r.visitors || 0;
  const ppw = (totalRefGiven + visitors + sponsors) / w;

  // PPW Band Tier (Reference lines: 2.0000 and 1.0000)
  let ppwTier = 'low';
  let ppwTierLabel = '1.0未満 (要フォロー)';
  let ppwBadgeClass = 'bg-rose-50 text-rose-700 border-rose-200';
  let ppwDot = '⚠️';

  if (ppw >= 2.0) {
    ppwTier = 'high';
    ppwTierLabel = '2.0以上 (維持・共有)';
    ppwBadgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
    ppwDot = '🌟';
  } else if (ppw >= 1.0) {
    ppwTier = 'mid';
    ppwTierLabel = '1.0〜2.0 (具体化)';
    ppwBadgeClass = 'bg-blue-50 text-blue-700 border-blue-200';
    ppwDot = '🔹';
  }

  // --- 100-Point Traffic Light Scoring System ---
  // 1. Visitors in 6 Months (Max 25 pt)
  const vis6m = visitors * (26 / w);
  let scoreVisitor = 0;
  if (vis6m >= 5) scoreVisitor = 25;
  else if (vis6m >= 4) scoreVisitor = 20;
  else if (vis6m >= 3) scoreVisitor = 15;
  else if (vis6m >= 2) scoreVisitor = 10;
  else if (vis6m >= 1) scoreVisitor = 5;
  else scoreVisitor = 0;

  // 2. TYFCB Score in 6 Months (Max 5 pt)
  const tyfcb6m = (r.tyfcb_yen || 0) * (26 / w);
  let scoreTyfcb = 0;
  if (tyfcb6m >= 5700000) scoreTyfcb = 5;
  else if (tyfcb6m >= 2850000) scoreTyfcb = 4;
  else if (tyfcb6m >= 950000) scoreTyfcb = 3;
  else if (tyfcb6m >= 380000) scoreTyfcb = 2;
  else if (tyfcb6m > 0) scoreTyfcb = 1;
  else scoreTyfcb = 0;

  // 3. 1-2-1s Score Per Week (Max 20 pt)
  const otoPerWeek = (r.one_to_ones || 0) / w;
  let scoreOto = 0;
  if (otoPerWeek >= 1.00) scoreOto = 20;
  else if (otoPerWeek >= 0.75) scoreOto = 15;
  else if (otoPerWeek >= 0.50) scoreOto = 10;
  else if (otoPerWeek >= 0.25) scoreOto = 5;
  else scoreOto = 0;

  // 4. Referrals Given Per Week (Max 25 pt)
  const refPerWeek = rpw;
  let scoreReferral = 0;
  if (refPerWeek >= 1.25) scoreReferral = 25;
  else if (refPerWeek >= 1.00) scoreReferral = 20;
  else if (refPerWeek >= 0.75) scoreReferral = 15;
  else if (refPerWeek >= 0.50) scoreReferral = 10;
  else if (refPerWeek >= 0.25) scoreReferral = 5;
  else scoreReferral = 0;

  // 5. Members Sponsored in 6 Months (Max 5 pt)
  const scoreSponsor = (sponsors >= 1) ? 5 : 0;

  // 6. CEU Per Week (Max 10 pt)
  const ceuPerWeek = (r.ceu || 0) / w;
  let scoreCeu = 0;
  if (ceuPerWeek > 0.5) scoreCeu = 10;
  else if (ceuPerWeek > 0) scoreCeu = 5;
  else scoreCeu = 0;

  // 7. Attendance Rate (Max 10 pt)
  const attRate = meetingCount > 0 ? (((r.p || 0) + (r.s || 0)) / meetingCount) * 100 : 100;
  let scoreAttendance = 0;
  if (attRate >= 96) scoreAttendance = 10;
  else if (attRate >= 88) scoreAttendance = 5;
  else scoreAttendance = 0;

  // Total 100-Point Sum
  const totalScore = scoreVisitor + scoreTyfcb + scoreOto + scoreReferral + scoreSponsor + scoreCeu + scoreAttendance;

  // Traffic Light Color Tier
  let tier = 'grey';
  let tierName = 'グレー';
  let tierColor = '#64748b';
  let tierBg = '#f1f5f9';
  let tierBadgeClass = 'bg-slate-100 text-slate-700 border-slate-200';
  let tierDot = '⚪';

  if (totalScore >= 70) {
    tier = 'green';
    tierName = 'グリーン';
    tierColor = '#059669';
    tierBg = '#d1fae5';
    tierBadgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
    tierDot = '🟢';
  } else if (totalScore >= 50) {
    tier = 'yellow';
    tierName = 'イエロー';
    tierColor = '#d97706';
    tierBg = '#fef3c7';
    tierBadgeClass = 'bg-amber-50 text-amber-700 border-amber-200';
    tierDot = '🟡';
  } else if (totalScore >= 30) {
    tier = 'red';
    tierName = 'レッド';
    tierColor = '#dc2626';
    tierBg = '#fee2e2';
    tierBadgeClass = 'bg-rose-50 text-rose-700 border-rose-200';
    tierDot = '🔴';
  }

  return {
    totalScore,
    tier,
    tierName,
    tierColor,
    tierBg,
    tierBadgeClass,
    tierDot,
    rpw,
    ppw,
    ppwTier,
    ppwTierLabel,
    ppwBadgeClass,
    ppwDot,
    weeksCount: w,
    scores: {
      visitor: scoreVisitor,
      tyfcb: scoreTyfcb,
      one_to_ones: scoreOto,
      referral: scoreReferral,
      sponsor: scoreSponsor,
      ceu: scoreCeu,
      attendance: scoreAttendance
    },
    rates: {
      vis6m,
      tyfcb6m,
      otoPerWeek,
      refPerWeek,
      ceuPerWeek,
      attRate
    }
  };
}

/**
 * Fetch PALMS records for specified or latest period
 */
function fetchPalmsRankingData(startDate = null, endDate = null) {
  const podiumContainer = document.getElementById('palms-podium-container');
  const tableBody = document.getElementById('palms-table-body');
  
  if (podiumContainer) {
    podiumContainer.innerHTML = `
      <div class="col-span-full py-8 text-center text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
        <p class="text-xs">ランキングを集計中...</p>
      </div>
    `;
  }
  if (tableBody) {
    tableBody.innerHTML = `
      <tr>
        <td colspan="12" class="py-12 text-center text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-xl mb-2"></i>
          <p class="text-xs">データを読込中...</p>
        </td>
      </tr>
    `;
  }

  ApiService.call('getPalmsListApi', startDate, endDate)
    .then(res => {
      if (res && res.success) {
        currentPalmsPeriod = res.period || { startDate, endDate };
        
        // Calculate weeks in active period
        let weeks = 26; // Default to 26 weeks
        if (currentPalmsPeriod.startDate && currentPalmsPeriod.endDate) {
          const d1 = new Date(currentPalmsPeriod.startDate);
          const d2 = new Date(currentPalmsPeriod.endDate);
          const diffDays = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1);
          weeks = Math.max(1, diffDays / 7);

          const periodBadge = document.getElementById('palms-data-period-badge');
          if (periodBadge) {
            const s = currentPalmsPeriod.startDate.replace(/-/g, '/');
            const e = currentPalmsPeriod.endDate.replace(/-/g, '/');
            periodBadge.textContent = `集計期間: ${s} 〜 ${e} (約${Math.round(weeks)}週間)`;
          }

          updatePeriodPresetPillActive(currentPalmsPeriod.startDate, currentPalmsPeriod.endDate);
        }

        // Process records with BNI Traffic Light Scoring System
        const rawRecords = res.records || [];
        currentPalmsRecords = rawRecords.map(r => {
          const p = Number(r.p_present || 0);
          const a = Number(r.a_absent || 0);
          const l = Number(r.l_late || 0);
          const m = Number(r.m_medical || 0);
          const s = Number(r.s_substitute || 0);
          const rgi = Number(r.rgi_referrals_given_internal || 0);
          const rgo = Number(r.rgo_referrals_given_external || 0);
          const totalRefGiven = Number(r.total_referrals_given != null ? r.total_referrals_given : (rgi + rgo));
          const rri = Number(r.rri_referrals_received_internal || 0);
          const rro = Number(r.rro_referrals_received_external || 0);
          const totalRefReceived = Number(r.total_referrals_received != null ? r.total_referrals_received : (rri + rro));
          const visitors = Number(r.v_visitors || 0);
          const oto = Number(r.one_to_ones || 0);
          const tyfcbYen = Number(r.tyfcb_yen != null ? r.tyfcb_yen : (Number(r.tyfcb_amount || 0) * 1000));
          const ceu = Number(r.ceu || r.ceu_credits || 0);
          const sponsors = Number(r.testimonials || r.sponsors || 0);

          const parsed = {
            ...r,
            p, a, l, m, s,
            rgi, rgo,
            total_referrals_given: totalRefGiven,
            rri, rro,
            total_referrals_received: totalRefReceived,
            visitors,
            one_to_ones: oto,
            tyfcb_yen: tyfcbYen,
            ceu,
            sponsors
          };

          const trafficLight = calcBniTrafficLightScore(parsed, weeks);

          return {
            ...parsed,
            trafficLight,
            total_score: trafficLight.totalScore,
            rpw: trafficLight.rpw,
            ppw: trafficLight.ppw,
            tier: trafficLight.tier,
            tierName: trafficLight.tierName,
            tierColor: trafficLight.tierColor,
            tierDot: trafficLight.tierDot
          };
        });

        // Update member count badge
        const countBadge = document.getElementById('palms-member-count-badge');
        if (countBadge) countBadge.textContent = `${currentPalmsRecords.length}名`;

        // Render Overview KPIs & Charts & Tables
        renderPalmsKpiCards();
        renderPalmsCharts();
        renderPalmsRankingView();
      } else {
        renderPalmsEmptyState(res ? res.error : 'データ取得に失敗しました');
      }
    })
    .catch(err => {
      console.error('Failed to fetch PALMS ranking:', err);
      renderPalmsEmptyState('サーバー通信エラーが発生しました');
    });
}

/**
 * Render 5 KPI Overview Cards (including PPW and RPW)
 */
function renderPalmsKpiCards() {
  if (!currentPalmsRecords || currentPalmsRecords.length === 0) return;

  const totalMembers = currentPalmsRecords.length;
  const sumScore = currentPalmsRecords.reduce((acc, r) => acc + r.total_score, 0);
  const avgScore = totalMembers > 0 ? (sumScore / totalMembers).toFixed(1) : 0;

  // PPW & RPW Averages
  const sumPpw = currentPalmsRecords.reduce((acc, r) => acc + r.ppw, 0);
  const avgPpw = totalMembers > 0 ? (sumPpw / totalMembers).toFixed(2) : '0.00';

  const sumRpw = currentPalmsRecords.reduce((acc, r) => acc + r.rpw, 0);
  const avgRpw = totalMembers > 0 ? (sumRpw / totalMembers).toFixed(2) : '0.00';
  const totalRef = currentPalmsRecords.reduce((acc, r) => acc + r.total_referrals_given, 0);

  const ppwHighCount = currentPalmsRecords.filter(r => r.ppw >= 2.0).length;
  const ppwMidCount = currentPalmsRecords.filter(r => r.ppw >= 1.0 && r.ppw < 2.0).length;
  const ppwLowCount = currentPalmsRecords.filter(r => r.ppw < 1.0).length;

  const greenCount = currentPalmsRecords.filter(r => r.total_score >= 70).length;
  const yellowCount = currentPalmsRecords.filter(r => r.total_score >= 50 && r.total_score < 70).length;
  const redCount = currentPalmsRecords.filter(r => r.total_score < 50).length;

  const greenPct = totalMembers > 0 ? Math.round((greenCount / totalMembers) * 100) : 0;

  // DOM Updates
  const elAvgScore = document.getElementById('palms-kpi-avg-score');
  const elAvgTier = document.getElementById('palms-kpi-avg-tier');
  if (elAvgScore) elAvgScore.textContent = avgScore;
  if (elAvgTier) {
    if (avgScore >= 70) {
      elAvgTier.innerHTML = '<span class="inline-flex items-center gap-1 font-bold text-emerald-700">🟢 GREEN ZONE (優秀)</span>';
    } else if (avgScore >= 50) {
      elAvgTier.innerHTML = '<span class="inline-flex items-center gap-1 font-bold text-amber-700">🟡 YELLOW ZONE (標準)</span>';
    } else {
      elAvgTier.innerHTML = '<span class="inline-flex items-center gap-1 font-bold text-rose-700">🔴 RED ZONE (要改善)</span>';
    }
  }

  const elAvgPpw = document.getElementById('palms-kpi-avg-ppw');
  const elPpwBreakdown = document.getElementById('palms-kpi-ppw-breakdown');
  if (elAvgPpw) elAvgPpw.textContent = avgPpw;
  if (elPpwBreakdown) {
    elPpwBreakdown.textContent = `2.0以上: ${ppwHighCount}名 / 1.0~2.0: ${ppwMidCount}名 / <1.0: ${ppwLowCount}名`;
  }

  const elAvgRpw = document.getElementById('palms-kpi-avg-rpw');
  const elRpwBreakdown = document.getElementById('palms-kpi-rpw-breakdown');
  if (elAvgRpw) elAvgRpw.textContent = avgRpw;
  if (elRpwBreakdown) {
    elRpwBreakdown.textContent = `総提供: ${totalRef}件 (内与+外与)`;
  }

  const elGreenCount = document.getElementById('palms-kpi-green-count');
  const elGreenPct = document.getElementById('palms-kpi-green-pct');
  if (elGreenCount) elGreenCount.textContent = greenCount;
  if (elGreenPct) elGreenPct.textContent = `構成比: ${greenPct}% (${greenCount}/${totalMembers}名)`;

  const elYellowCount = document.getElementById('palms-kpi-yellow-count');
  if (elYellowCount) elYellowCount.textContent = yellowCount + redCount;
}

/**
 * Render 4 Interactive Chart.js Graphs (including PPW / RPW Distribution with reference lines)
 */
function renderPalmsCharts() {

/**
 * Trigger manual sync from BNI Connect
 */
function syncPalmsFromBniConnect() {
  if (isPalmsSyncing) return;
  isPalmsSyncing = true;

  const btn = document.getElementById('btn-sync-palms');
  const btnText = btn ? btn.querySelector('.btn-text') : null;
  const btnIcon = btn ? btn.querySelector('i') : null;

  if (btn) btn.disabled = true;
  if (btnIcon) btnIcon.classList.add('fa-spin');
  if (btnText) btnText.textContent = '同期中...';

  showToast('BNI Connectから最新PALMSデータを取得しています...', 'info');

  ApiService.call('syncPalmsApi')
    .then(res => {
      if (res && res.success) {
        showToast(res.message || 'PALMSデータを正常に更新しました', 'success');
        fetchPalmsPeriods();
      } else {
        showToast('同期に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
    })
    .catch(err => {
      console.error('BNI Connect Sync error:', err);
      showToast('BNI Connect同期中にエラーが発生しました', 'error');
    })
    .finally(() => {
      isPalmsSyncing = false;
      if (btn) btn.disabled = false;
      if (btnIcon) btnIcon.classList.remove('fa-spin');
      if (btnText) btnText.textContent = 'Connect同期';
    });
}

/**
 * Switch metric filter
 */
function switchPalmsMetric(metric) {
  currentPalmsMetric = metric;

  // Update tabs active state
  const tabs = document.querySelectorAll('#palms-metric-tabs .palms-metric-tab');
  tabs.forEach(tab => {
    if (tab.getAttribute('data-metric') === metric) {
      tab.classList.add('active', 'bg-blue-600', 'text-white', 'shadow-2xs');
      tab.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
    } else {
      tab.classList.remove('active', 'bg-blue-600', 'text-white', 'shadow-2xs');
      tab.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
    }
  });

  // Update formula/hint text
  const hintEl = document.getElementById('palms-hint-text');
  if (hintEl) {
    const hints = {
      'total': '公式新基準（100点満点）: ビジター(25点) ＋ リファーラル週平均(25点) ＋ 1to1週平均(20点) ＋ CEU週平均(10点) ＋ 出席率(10点) ＋ TYFCB(5点) ＋ スポンサー(5点)',
      'ppw': 'PPW（Points Per Week: 週貢献指数）= (リファーラル提供 ＋ ビジター ＋ 推薦・スポンサー) ÷ 週数 【黒線基準: 2.00以上 達成 / 1.00以上 目安】',
      'rpw': 'RPW（Referrals Per Week: 週リファーラル提供）= (内部リファーラル ＋ 外部リファーラル) ÷ 週数 【目標: 1.25以上】',
      'referrals': 'リファーラル提供点数（週1.25件以上=25点, 1.00件=20点, 0.75件=15点, 0.50件=10点, 0.25件=5点）',
      'visitors': 'ビジター招待点数（6ヶ月換算: 5名以上=25点, 4名=20点, 3名=15点, 2名=10点, 1名=5点）',
      'one_to_ones': '1to1実施点数（週1.00回以上=20点, 0.75回=15点, 0.50回=10点, 0.25回=5点）',
      'ceu': 'CEU学習点数（週0.5pt超=10点, 0超0.5以下=5点, 0以下=0点）',
      'attendance': '定例会出席率点数（出席率96%以上=10点, 88%以上=5点, 88%未満=0点）',
      'tyfcb': 'TYFCB売上貢献点数（6ヶ月換算: 570万円以上=5点, 285万円=4点, 95万円=3点, 38万円=2点, 1円以上=1点）'
    };
    hintEl.textContent = hints[metric] || '';
  }

  // Set default sort for metric
  if (metric === 'total') currentPalmsSort = { field: 'total_score', asc: false };
  else if (metric === 'ppw') currentPalmsSort = { field: 'ppw', asc: false };
  else if (metric === 'rpw') currentPalmsSort = { field: 'rpw', asc: false };
  else if (metric === 'referrals') currentPalmsSort = { field: 'referrals_given', asc: false };
  else if (metric === 'visitors') currentPalmsSort = { field: 'visitors', asc: false };
  else if (metric === 'one_to_ones') currentPalmsSort = { field: 'one_to_ones', asc: false };
  else if (metric === 'ceu') currentPalmsSort = { field: 'ceu', asc: false };
  else if (metric === 'attendance') currentPalmsSort = { field: 'attendance', asc: false };
  else if (metric === 'tyfcb') currentPalmsSort = { field: 'tyfcb', asc: false };

  renderPalmsRankingView();
}

/**
 * Render the entire PALMS Ranking View
 */
function renderPalmsRankingView() {
  if (!currentPalmsRecords || currentPalmsRecords.length === 0) {
    renderPalmsEmptyState();
    return;
  }

  // Sort records according to current metric / sort setting
  const sortedRecords = [...currentPalmsRecords].sort((a, b) => {
    let valA = 0;
    let valB = 0;

    switch (currentPalmsSort.field) {
      case 'name':
        valA = a.member_name || '';
        valB = b.member_name || '';
        return currentPalmsSort.asc ? valA.localeCompare(valB, 'ja') : valB.localeCompare(valA, 'ja');
      case 'traffic_light':
      case 'total_score':
      case 'rank':
        valA = a.total_score;
        valB = b.total_score;
        break;
      case 'ppw':
        valA = a.ppw;
        valB = b.ppw;
        break;
      case 'rpw':
        valA = a.rpw;
        valB = b.rpw;
        break;
      case 'referrals_given':
        valA = a.trafficLight.scores.referral;
        valB = b.trafficLight.scores.referral;
        break;
      case 'visitors':
        valA = a.trafficLight.scores.visitor;
        valB = b.trafficLight.scores.visitor;
        break;
      case 'one_to_ones':
        valA = a.trafficLight.scores.one_to_ones;
        valB = b.trafficLight.scores.one_to_ones;
        break;
      case 'ceu':
        valA = a.trafficLight.scores.ceu;
        valB = b.trafficLight.scores.ceu;
        break;
      case 'attendance':
        valA = a.trafficLight.scores.attendance;
        valB = b.trafficLight.scores.attendance;
        break;
      case 'tyfcb':
        valA = a.trafficLight.scores.tyfcb;
        valB = b.trafficLight.scores.tyfcb;
        break;
      default:
        valA = a.total_score;
        valB = b.total_score;
    }

    if (valA !== valB) {
      return currentPalmsSort.asc ? (valA - valB) : (valB - valA);
    }
    // Secondary tie-breaker: PPW then total referrals given
    return b.ppw - a.ppw;
  });

  // Assign ranking numbers (1-indexed)
  sortedRecords.forEach((r, idx) => {
    r.display_rank = idx + 1;
  });

  renderPalmsPodium(sortedRecords);
  renderPalmsTable(sortedRecords);
}

        <td class="py-3 px-3 text-right align-middle font-tabular ${isTotalActive ? colHighlightClass : 'text-slate-800'}">
          <span class="text-sm font-black">${m.total_score}</span>
          <span class="text-3xs text-slate-400 font-normal">/100</span>
        </td>
        <td class="py-3 px-3 text-right align-middle font-tabular ${isPpwActive ? colHighlightClass : 'text-blue-700 font-bold'}">
          <div class="text-sm font-black text-blue-600">${m.ppw.toFixed(2)}</div>
          <div class="text-3xs"><span class="px-1.5 py-0.2 rounded border ${tl.ppwBadgeClass}">${tl.ppwTierLabel.split(' ')[0]}</span></div>
        </td>
        <td class="py-3 px-3 text-right align-middle font-tabular ${isRpwActive ? colHighlightClass : 'text-slate-700 font-semibold'}">
          <div class="text-sm font-bold text-indigo-600">${m.rpw.toFixed(2)}</div>
          <div class="text-3xs text-slate-400 font-normal">件/週</div>
        </td>
        <td class="py-3 px-3 text-right align-middle font-tabular ${isVisActive ? colHighlightClass : 'text-slate-700'}">
          <div class="font-bold">${m.visitors}名</div>
          <div class="text-3xs text-emerald-600 font-semibold">${tl.scores.visitor} pt</div>
        </td>
        <td class="py-3 px-3 text-right align-middle font-tabular ${isRefActive ? colHighlightClass : 'text-slate-700'}">
          <div class="font-bold">${m.total_referrals_given}件</div>
          <div class="text-3xs text-blue-600 font-semibold">${tl.scores.referral} pt</div>
        </td>
        <td class="py-3 px-3 text-right align-middle font-tabular ${isOtoActive ? colHighlightClass : 'text-slate-700'}">
          <div class="font-bold">${m.one_to_ones}回</div>
          <div class="text-3xs text-amber-600 font-semibold">${tl.scores.one_to_ones} pt</div>
        </td>
        <td class="py-3 px-3 text-right align-middle font-tabular ${isCeuActive ? colHighlightClass : 'text-slate-700'}">
          <div class="font-bold">${m.ceu} pt</div>
          <div class="text-3xs text-purple-600 font-semibold">${tl.scores.ceu} pt</div>
        </td>
        <td class="py-3 px-3 text-right align-middle font-tabular ${isAttActive ? colHighlightClass : 'text-slate-700'}">
          <div class="font-bold">${tl.rates.attRate.toFixed(0)}%</div>
          <div class="text-3xs text-slate-500 font-semibold">${tl.scores.attendance} pt</div>
        </td>
        <td class="py-3 px-4 text-right align-middle font-tabular ${isTyfcbActive ? colHighlightClass : 'text-slate-700'}">
          <div class="font-bold">¥${m.tyfcb_yen.toLocaleString()}</div>
          <div class="text-3xs text-indigo-600 font-semibold">${tl.scores.tyfcb} pt</div>
        </td>
      </tr>
    `;
  });

  tableBody.innerHTML = html;
}

/**
 * Navigate to Member Personal Dashboard
 */
function navigateToMemberDetail(memberName) {
  if (!memberName) return;
  if (typeof switchTab === 'function') {
    switchTab('member-dashboard', false);
    setTimeout(() => {
      if (typeof initMemberDashboard === 'function') {
        initMemberDashboard(memberName);
      }
    }, 50);
  }
}

/**
 * Sort PALMS Table by column
 */
function sortPalmsTable(field) {
  if (currentPalmsSort.field === field) {
    currentPalmsSort.asc = !currentPalmsSort.asc;
  } else {
    currentPalmsSort.field = field;
    currentPalmsSort.asc = (field === 'name');
  }

  // Update table sort header icons
  ['rank', 'name', 'traffic_light', 'total_score', 'ppw', 'rpw', 'visitors', 'referrals_given', 'one_to_ones', 'ceu', 'attendance', 'tyfcb'].forEach(f => {
    const iconEl = document.getElementById('sort-icon-' + f);
    if (!iconEl) return;
    if (f === currentPalmsSort.field) {
      iconEl.innerHTML = currentPalmsSort.asc 
        ? '<i class="fa-solid fa-sort-up text-blue-600 text-3xs"></i>' 
        : '<i class="fa-solid fa-sort-down text-blue-600 text-3xs"></i>';
    } else {
      iconEl.innerHTML = '<i class="fa-solid fa-sort text-slate-300 text-3xs"></i>';
    }
  });

  renderPalmsRankingView();
}

/**
 * Render empty state when no data exists
 */
function renderPalmsEmptyState(customMessage = null) {
  const podiumContainer = document.getElementById('palms-podium-container');
  const tableBody = document.getElementById('palms-table-body');

  const msg = customMessage || 'PALMSデータがまだ登録されていません。「Connect同期」ボタンを押してBNI Connectから取得してください。';

  if (podiumContainer) {
    podiumContainer.innerHTML = `
      <div class="col-span-full bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-500 shadow-2xs">
        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-3 text-slate-400">
          <i class="fa-solid fa-cloud-arrow-down text-xl"></i>
        </div>
        <h4 class="text-sm font-bold text-slate-700 mb-1">PALMSデータがありません</h4>
        <p class="text-xs text-slate-400 max-w-md mx-auto mb-4">${msg}</p>
        <button onclick="syncPalmsFromBniConnect()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-2xs transition-all inline-flex items-center gap-2 cursor-pointer">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>BNI Connectから今すぐ同期</span>
        </button>
      </div>
    `;
  }

  if (tableBody) {
    tableBody.innerHTML = `
      <tr>
        <td colspan="12" class="py-12 text-center text-slate-400 text-xs">
          表示可能なデータがありません
        </td>
      </tr>
    `;
  }
}
</script>
