<!-- VIEW: 最優先フォロービジター一覧 (感触A・B評価) -->
<div id="view-priority-follow" class="view-content">
  <section class="section-card">
    <div class="section-header flex-col md:flex-row gap-3 items-stretch md:items-center justify-between p-4 md:p-5">
      <div>
        <h2 class="section-title text-base md:text-lg font-bold text-slate-800 m-0">
          <i class="fa-solid fa-fire text-rose-600"></i> 最優先フォロービジター一覧
        </h2>
        <div class="section-sub text-xs text-slate-500 mt-0.5">ヒアリングシートで感触 《A》または《B》 と評価されたビジター名簿です。</div>
      </div>
      <div class="flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center w-full md:w-auto">
        <div class="tab-filter-group flex gap-1.5 bg-slate-100 p-1 rounded-lg">
          <button type="button" class="tab-btn active px-3 py-1.5 text-xs font-bold" id="pf-tab-all" onclick="setPriorityFollowGradeFilter('ALL')">🔥 A+B 評価</button>
          <button type="button" class="tab-btn px-3 py-1.5 text-xs font-bold" id="pf-tab-a" onclick="setPriorityFollowGradeFilter('A')">A 評価のみ</button>
          <button type="button" class="tab-btn px-3 py-1.5 text-xs font-bold" id="pf-tab-b" onclick="setPriorityFollowGradeFilter('B')">B 評価のみ</button>
        </div>
        <input type="text" id="search-priority-follow-input" class="search-box w-full sm:w-60" placeholder="🔍 氏名・会社名・招待者で検索..." onkeyup="filterPriorityFollowTable()">
      </div>
    </div>

    <!-- 🖥️ PC表示用: テーブルビュー -->
    <div class="dash-ap-table-wrap table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 95px;">参加日</th>
            <th style="width: 75px;">評価</th>
            <th>氏名 / 会社名・専門分野</th>
            <th style="width: 120px;">招待者</th>
            <th style="width: 120px;">オリエン担当</th>
            <th>ヒアリングメモ (Q7 / 直後メモ)</th>
            <th style="width: 160px;">シート / 1to1 / 操作</th>
          </tr>
        </thead>
        <tbody id="table-priority-follow-page"></tbody>
      </table>
    </div>

    <!-- 📱 スマホ用カード一覧 -->
    <div id="cards-priority-follow" class="dash-ap-grid dash-ap-cards-wrap"></div>

    <div class="pagination-bar">
      <div class="pagination-info" id="pf-pagination-info">全 0 件中 0 - 0 件を表示</div>
      <div class="pagination-controls">
        <button type="button" class="btn-action-secondary" id="btn-pf-prev-page" onclick="changePriorityFollowPage(-1)"><i class="fa-solid fa-chevron-left"></i> 前の50件</button>
        <span id="pf-pagination-page-num" class="pagination-page-num">1 / 1</span>
        <button type="button" class="btn-action-secondary" id="btn-pf-next-page" onclick="changePriorityFollowPage(1)">次の50件 <i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  </section>
</div>
