<!-- Coffee Meeting Slot Assignment Modal -->
<div id="modal-coffee-assign" class="modal-backdrop hidden" style="z-index: 1100;">
  <div class="modal-card max-w-lg w-full mx-4 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
    
    <!-- Modal Header -->
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-600 flex items-center justify-center text-sm">
          <i class="fa-solid fa-mug-hot"></i>
        </div>
        <div>
          <h3 class="text-base font-black text-slate-800 tracking-tight">コーヒーミーティングの予約</h3>
          <p class="text-3xs text-slate-500 font-medium">平日 12:00〜12:30 事前ヒアリング枠</p>
        </div>
      </div>
      <button type="button" onclick="closeCoffeeAssignModal()" class="w-8 h-8 rounded-full border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors cursor-pointer" title="閉じる">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-5 space-y-4">
      <!-- Target Date Info Card -->
      <div class="bg-amber-50/50 border border-amber-200/60 rounded-xl p-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-amber-500 text-white flex flex-col items-center justify-center font-mono leading-none shadow-xs">
            <span id="cfa-date-month" class="text-3xs font-extrabold uppercase">--月</span>
            <span id="cfa-date-day" class="text-base font-black">--</span>
          </div>
          <div>
            <div id="cfa-date-full" class="text-sm font-black text-slate-800">----年--月--日 (--)</div>
            <div class="text-xs font-bold text-amber-700 flex items-center gap-1.5 mt-0.5">
              <i class="fa-regular fa-clock text-3xs"></i>
              <span>12:00 〜 12:30 (30分間・Zoom)</span>
            </div>
          </div>
        </div>
        <input type="hidden" id="cfa-target-date" value="">
      </div>

      <!-- Visitor Selection Form -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-black text-slate-700 flex items-center gap-1">
            <span>対象ビジターを選択</span>
            <span class="text-rose-500">*</span>
          </label>
          <span class="text-3xs font-bold text-slate-400">未設定ビジター優先表示</span>
        </div>
        <div class="relative">
          <select id="cfa-visitor-select" onchange="onCoffeeAssignVisitorChanged()" class="w-full text-sm font-medium border border-slate-200 rounded-xl px-3 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all">
            <option value="">-- ビジターを選択してください --</option>
          </select>
        </div>
      </div>

      <!-- Selected Visitor Preview Card -->
      <div id="cfa-visitor-preview" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-3.5 space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span id="cfa-preview-name" class="text-sm font-black text-slate-900"></span>
            <span id="cfa-preview-furigana" class="text-3xs text-slate-400"></span>
          </div>
          <span id="cfa-preview-step1-badge" class="text-3xs px-2 py-0.5 rounded-full font-bold"></span>
        </div>
        <div class="grid grid-cols-2 gap-2 text-xs pt-1 border-t border-slate-200/60">
          <div>
            <span class="text-slate-400 font-medium">紹介者:</span>
            <span id="cfa-preview-inviter" class="font-bold text-slate-700 ml-1"></span>
          </div>
          <div>
            <span class="text-slate-400 font-medium">定例会予定日:</span>
            <span id="cfa-preview-event-date" class="font-bold text-slate-700 ml-1"></span>
          </div>
        </div>
        <div class="text-xs">
          <span class="text-slate-400 font-medium">会社・業種:</span>
          <span id="cfa-preview-company" class="font-bold text-slate-700 ml-1"></span>
        </div>
      </div>

      <!-- Action Plan Link Toggle -->
      <div class="pt-1">
        <label class="flex items-start gap-2.5 cursor-pointer">
          <input type="checkbox" id="cfa-create-action-plan" checked class="mt-0.5 rounded border-slate-300 text-amber-600 focus:ring-amber-500">
          <div class="text-xs">
            <span class="font-black text-slate-800">アクションプランにも連動登録する</span>
            <p class="text-3xs text-slate-500 font-medium mt-0.5">ダッシュボードやカレンダーの「今日のアクション」に12:00予定として自動追加されます</p>
          </div>
        </label>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="px-5 py-3.5 border-t border-slate-100 bg-slate-50/80 flex items-center justify-end gap-2">
      <button type="button" onclick="closeCoffeeAssignModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200/70 border border-slate-200 transition-colors cursor-pointer">
        キャンセル
      </button>
      <button type="button" id="btn-cfa-submit" onclick="submitCoffeeAssign()" class="px-5 py-2 rounded-xl text-xs font-black text-white bg-amber-600 hover:bg-amber-700 shadow-xs active:scale-95 transition-all flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-check"></i>
        <span>この日程で予約を確定する</span>
      </button>
    </div>

  </div>
</div>
