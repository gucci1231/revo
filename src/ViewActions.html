<!-- VIEW: アクションプラン統合管理 (Apple-Style Actions Management) -->
<div id="view-actions" class="view-content">

  <!-- 1. トップサマリーKPIカード -->
  <div class="dash-hero-grid grid-3">
    <!-- KPI 1: 進行中 -->
    <div class="dash-hero-card cursor-pointer active-kpi-card" id="actions-kpi-card-pending" onclick="setActionsStatusFilter('pending')" title="進行中アクションに絞り込み">
      <div class="dash-hero-split">
        <div class="dash-hero-left">
          <span class="dash-hero-title">進行中</span>
        </div>
        <div class="dash-hero-right">
          <div class="dash-hero-val-container">
            <span class="dash-hero-number" id="actions-kpi-pending">-</span>
            <span class="dash-hero-unit-text">件</span>
          </div>
        </div>
      </div>
    </div>

    <!-- KPI 2: 期限超過 -->
    <div class="dash-hero-card cursor-pointer" id="actions-kpi-card-overdue" onclick="setActionsStatusFilter('overdue')" title="期限超過アクションに絞り込み">
      <div class="dash-hero-split">
        <div class="dash-hero-left flex items-center gap-1.5">
          <span class="dash-hero-title">期限超過</span>
          <span class="kpi-status-dot red" title="超過"></span>
        </div>
        <div class="dash-hero-right">
          <div class="dash-hero-val-container">
            <span class="dash-hero-number" id="actions-kpi-overdue" style="color: #ef4444;">-</span>
            <span class="dash-hero-unit-text">件</span>
          </div>
        </div>
      </div>
    </div>

    <!-- KPI 3: 完了済 -->
    <div class="dash-hero-card cursor-pointer" id="actions-kpi-card-completed" onclick="setActionsStatusFilter('completed')" title="完了済実績に絞り込み">
      <div class="dash-hero-split">
        <div class="dash-hero-left">
          <span class="dash-hero-title">完了実績</span>
        </div>
        <div class="dash-hero-right">
          <div class="dash-hero-val-container">
            <span class="dash-hero-number" id="actions-kpi-completed" style="color: #10b981;">-</span>
            <span class="dash-hero-unit-text">件</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section class="section-card overflow-hidden">
    <!-- ヘッダー ＆ 検索フィルターバー -->
    <div class="p-4 border-b border-slate-100 flex items-center justify-end gap-2 flex-wrap">
      <!-- 担当者＆検索 -->
      <select id="actions-assignee-filter" class="form-input text-xs py-1.5 px-2.5 rounded-lg border-slate-200 bg-slate-50" onchange="filterActionsList()" style="width: auto; font-weight: 700;">
        <option value="">担当者: 全員</option>
      </select>
      <div class="relative w-48 sm:w-64">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
        <input type="text" id="actions-search-input" class="form-input text-xs py-1.5 pl-8 pr-3 rounded-lg border-slate-200 bg-slate-50 w-full" placeholder="検索..." oninput="filterActionsList()">
      </div>
    </div>

    <!-- 🖥️ PC表示用: 看板ボード (Kanban Board) -->
    <div class="actions-kanban-board hidden lg:grid">
      <!-- レーン 1: ⚠️ 期限超過 -->
      <div class="kanban-column kanban-col-overdue">
        <div class="kanban-column-header">
          <div class="kanban-col-title text-rose-700">
            <i class="fa-solid fa-triangle-exclamation text-rose-500"></i>
            <span>期限超過</span>
          </div>
          <span class="kanban-col-count bg-rose-100 text-rose-700" id="kanban-count-overdue">0</span>
        </div>
        <div class="kanban-card-list" id="kanban-list-overdue"></div>
      </div>

      <!-- レーン 2: 🎯 進行中・予定 -->
      <div class="kanban-column kanban-col-pending">
        <div class="kanban-column-header">
          <div class="kanban-col-title text-blue-700">
            <i class="fa-solid fa-bullseye text-blue-600"></i>
            <span>進行中 / 本日予定</span>
          </div>
          <span class="kanban-col-count bg-blue-100 text-blue-700" id="kanban-count-pending">0</span>
        </div>
        <div class="kanban-card-list" id="kanban-list-pending"></div>
      </div>

      <!-- レーン 3: ✅ 完了実績 -->
      <div class="kanban-column kanban-col-completed">
        <div class="kanban-column-header">
          <div class="kanban-col-title text-emerald-700">
            <i class="fa-solid fa-circle-check text-emerald-600"></i>
            <span>完了実績</span>
          </div>
          <span class="kanban-col-count bg-emerald-100 text-emerald-700" id="kanban-count-completed">0</span>
        </div>
        <div class="kanban-card-list" id="kanban-list-completed"></div>
      </div>
    </div>

    <!-- 📱 スマホ表示用: カードグリッド -->
    <div id="cards-actions-all" class="dash-ap-grid dash-ap-cards-wrap p-3 sm:p-4 lg:hidden"></div>
  </section>

</div>
