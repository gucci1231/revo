  function switchEmailViewMode(mode) {
    emailViewMode = mode;
    const timelineContainer = document.getElementById('et-timeline-container');
    const gridContainer = document.getElementById('et-grid-container');
    const btnTimeline = document.getElementById('et-mode-btn-timeline');
    const btnGrid = document.getElementById('et-mode-btn-grid');

    if (mode === 'timeline') {
      if (timelineContainer) timelineContainer.style.display = 'block';
      if (gridContainer) gridContainer.style.display = 'none';
      if (btnTimeline) btnTimeline.className = 'px-3 py-1.5 rounded-lg text-xs font-black transition-all bg-white text-blue-600 shadow-sm';
      if (btnGrid) btnGrid.className = 'px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition-all';
    } else {
      if (timelineContainer) timelineContainer.style.display = 'none';
      if (gridContainer) gridContainer.style.display = 'block';
      if (btnTimeline) btnTimeline.className = 'px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition-all';
      if (btnGrid) btnGrid.className = 'px-3 py-1.5 rounded-lg text-xs font-black transition-all bg-white text-blue-600 shadow-sm';
    }
  }

  function fetchEmailTemplatesData(force = false) {
    const timelineContainer = document.getElementById('et-timeline-container');
    if (timelineContainer && rawEmailTemplates.length === 0) {
      timelineContainer.innerHTML = `
        <div class="py-12 text-center text-slate-400 bg-white rounded-2xl border border-slate-200">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-blue-600"></i>
          <p class="text-xs font-bold">メールテンプレート配信フローを読み込み中...</p>
        </div>
      `;
    }

    ApiService.call('getEmailTemplatesApi')
      .then(res => {
        if (res && res.success && Array.isArray(res.templates)) {
          rawEmailTemplates = res.templates;
          renderEmailTemplatesList();
          updateEmailTemplateCategoryCounts();
        } else {
          showToast('メールテンプレートの取得に失敗しました');
        }
      })
      .catch(err => {
        console.error('Fetch email templates error:', err);
        handleError(err);
      });
  }

  function updateEmailTemplateCategoryCounts() {
    const counts = { all: rawEmailTemplates.length, welcome: 0, remind: 0, thanks: 0, follow: 0 };
    rawEmailTemplates.forEach(t => {
      const cat = t.category || 'welcome';
      if (counts[cat] !== undefined) counts[cat]++;
    });

    ['all', 'welcome', 'remind', 'thanks', 'follow'].forEach(c => {
      const el = document.getElementById(`et-count-${c}`);
      if (el) el.innerText = `(${counts[c] || 0})`;
    });
  }

  function filterEmailTemplates(category) {
    activeTemplateCategory = category;
    document.querySelectorAll('.et-filter-btn').forEach(btn => {
      if (btn.getAttribute('data-category') === category) {
        btn.className = 'et-filter-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow-sm transition shrink-0 active';
      } else {
        btn.className = 'et-filter-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white text-slate-600 hover:bg-slate-50 border border-slate-200/80 transition shrink-0';
      }
    });
    renderEmailTemplatesGrid();
  }

  function renderEmailTemplatesList() {
    renderEmailTimeline();
    renderEmailTemplatesGrid();
  }

  function renderTemplateCardHtml(t, customBadge = null, subLabel = null) {
    const safeSubject = escapeHtml(t.subject || '');
    const bodySnippet = escapeHtml((t.body || '').slice(0, 130) + ((t.body || '').length > 130 ? '...' : ''));

  function renderEmailTemplatesGrid() {
    const cardsGrid = document.getElementById('et-cards-grid');
    if (!cardsGrid) return;

    const filtered = activeTemplateCategory === 'all'
      ? rawEmailTemplates
      : rawEmailTemplates.filter(t => t.category === activeTemplateCategory);

    if (filtered.length === 0) {
      cardsGrid.innerHTML = `
        <div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-2xl border border-slate-200/80">
          <i class="fa-solid fa-envelope-open text-3xl mb-2 text-slate-300"></i>
          <p class="text-xs font-bold text-slate-500">該当するメールテンプレートがありません</p>
        </div>
      `;
      return;
    }

    cardsGrid.innerHTML = filtered.map(t => renderTemplateCardHtml(t)).join('');
  }

  function startEditEmailTemplate(tmplId) {
    const tmpl = rawEmailTemplates.find(t => t.id === tmplId);
    if (!tmpl) {
      showToast('テンプレートが見つかりません');
      return;
    }

    currentEditingTemplate = JSON.parse(JSON.stringify(tmpl));

    // Fill Form Inputs
    document.getElementById('et-edit-name').innerText = tmpl.name;
    document.getElementById('et-edit-key').innerText = tmpl.id;
    document.getElementById('et-edit-desc').innerText = tmpl.description || '';
    document.getElementById('et-edit-subject').value = tmpl.subject || '';
    document.getElementById('et-edit-body').value = tmpl.body || '';

    // Update Badge
    const badgeEl = document.getElementById('et-edit-badge');
    if (badgeEl) {
      badgeEl.innerText = (tmpl.category || 'STEP').toUpperCase();
    }

    // Reset Validation Box
    const valBox = document.getElementById('et-validation-box');
    if (valBox) valBox.style.display = 'none';

    // Track Focus Target
    const subjInput = document.getElementById('et-edit-subject');
    const bodyInput = document.getElementById('et-edit-body');
    subjInput.onfocus = () => { lastActiveInputTarget = 'subject'; };
    bodyInput.onfocus = () => { lastActiveInputTarget = 'body'; };

    onTemplateInputChange();

    // Switch View from List to Editor
    document.getElementById('et-view-list').style.display = 'none';
    document.getElementById('et-view-editor').style.display = 'block';

    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEmailTemplateEdit() {
    currentEditingTemplate = null;
    document.getElementById('et-view-editor').style.display = 'none';
    document.getElementById('et-view-list').style.display = 'block';
  }

  function onTemplateInputChange() {
    const subject = document.getElementById('et-edit-subject').value;
    const body = document.getElementById('et-edit-body').value;

    const subjLenEl = document.getElementById('et-subject-len');
    if (subjLenEl) subjLenEl.innerText = `${subject.length} 文字`;

    const bodyLines = body ? body.split('\n').length : 0;
    const bodyChars = body ? body.length : 0;

    const linesEl = document.getElementById('et-body-lines');
    const charsEl = document.getElementById('et-body-chars');
    if (linesEl) linesEl.innerText = `${bodyLines} 行`;
    if (charsEl) charsEl.innerText = `${bodyChars} 文字`;

    // Hide validation box on typing
    const valBox = document.getElementById('et-validation-box');
    if (valBox) valBox.style.display = 'none';
  }

  function insertTagToTemplate(tag) {
    const targetInput = lastActiveInputTarget === 'subject'
      ? document.getElementById('et-edit-subject')
      : document.getElementById('et-edit-body');

    if (!targetInput) return;

    const startPos = targetInput.selectionStart || targetInput.value.length;
    const endPos = targetInput.selectionEnd || targetInput.value.length;
    const beforeText = targetInput.value.substring(0, startPos);
    const afterText = targetInput.value.substring(endPos, targetInput.value.length);

    targetInput.value = beforeText + tag + afterText;
    targetInput.focus();
    targetInput.selectionStart = startPos + tag.length;
    targetInput.selectionEnd = startPos + tag.length;

    onTemplateInputChange();
    showToast(`タグ ${tag} を挿入しました`);
  }

  function validateEmailTemplate(subject, body) {
    const errors = [];
    const warnings = [];

    if (!subject || subject.trim() === '') {
      errors.push('件名 (Subject) を入力してください。');
    }
    if (!body || body.trim() === '') {
      errors.push('本文 (Body) を入力してください。');
    }

    // Check for unmatched {$
    const combined = (subject || '') + '\n' + (body || '');
    const tagMatches = combined.match(/\{\$[a-zA-Z0-9_]+/g) || [];
    const fullTagMatches = combined.match(/\{\$[a-zA-Z0-9_]+\}/g) || [];

    if (tagMatches.length !== fullTagMatches.length) {
      warnings.push('閉じ括弧 "}" が抜けているタグが存在する可能性があります。');
    }

    // Check valid known tags
    const validTags = [
      'name', 'visitor_name', 'event_date', 'date', 'profession',
      'company', 'inviter', 'main_presenter', 'wanted', 'matching_status',
      'ras_message', 'referral_message'
    ];
    const extractedTags = [];
    const tagRegex = /\{\$([a-zA-Z0-9_]+)\}/g;
    let match;
    while ((match = tagRegex.exec(combined)) !== null) {
      extractedTags.push(match[1]);
      if (!validTags.includes(match[1])) {
        warnings.push(`未定義の差し込みタグ "{$${match[1]}}" が含まれています。`);
      }
    }

    return {
      isValid: errors.length === 0,
      errors,
      warnings,
      extractedTags: [...new Set(extractedTags)]
    };
  }

  function runValidationAndProceedToPreview() {
    const subject = document.getElementById('et-edit-subject').value;
    const body = document.getElementById('et-edit-body').value;

    const valResult = validateEmailTemplate(subject, body);
    const valBox = document.getElementById('et-validation-box');
    const valTitle = document.getElementById('et-val-title');
    const valList = document.getElementById('et-val-list');
    const valIcon = document.getElementById('et-val-icon');

    if (!valResult.isValid) {
      valBox.style.display = 'block';
      valBox.className = 'rounded-xl p-4 border bg-red-50 border-red-200 text-red-900 transition-all';
      valIcon.innerHTML = '<i class="fa-solid fa-circle-exclamation text-red-600"></i>';
      valTitle.innerText = 'バリデーションエラー: 入力内容をご確認ください';
      valList.innerHTML = valResult.errors.map(e => `<li>${escapeHtml(e)}</li>`).join('');
      showToast('❌ 入力エラーがあります');
      return;
    }

    if (valResult.warnings.length > 0) {
      valBox.style.display = 'block';
      valBox.className = 'rounded-xl p-4 border bg-amber-50 border-amber-200 text-amber-900 transition-all';
      valIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-600"></i>';
      valTitle.innerText = 'バリデーション警告（確認後、そのまま進むことができます）';
      valList.innerHTML = valResult.warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('');
    } else {
      valBox.style.display = 'none';
    }

    // Step 4: Open Sample Preview
    openEmailSamplePreview();
  }

  function renderTemplateTextWithVisitor(text, visitor) {
    if (!text) return '';
    let res = text;
    const vName = visitor.name || '';
    const vDate = visitor.eventDate || '';
    const vProf = visitor.profession || '';
    const vComp = visitor.company || '';
    const vInviter = visitor.inviter || '';
    const mainPresenter = visitor.mainPresenter || '未定';
    const wanted = visitor.wanted || 'なし';

    let matchingBlock = '';
    if (visitor.matchingReq && visitor.matchingReq !== '') {
      matchingBlock =
        "\n━━━━━━━━━━━━━━━━━━━━\n" +
        "🌟 マッチングのご要望について\n" +
        "「" + visitor.matchingReq + "」に関するご要望、承知いたしました！\n" +
        "当日、最適なメンバーとお繋ぎできるよう現在調整を進めております。楽しみにしていてくださいね！\n" +
        "━━━━━━━━━━━━━━━━━━━━\n";
    }

    res = res.replace(/\{\$(name|visitor_name)\}/g, vName)
             .replace(/\{\$(event_date|date)\}/g, vDate)
             .replace(/\{\$profession\}/g, vProf)
             .replace(/\{\$company\}/g, vComp)
             .replace(/\{\$inviter\}/g, vInviter)
             .replace(/\{\$main_presenter\}/g, mainPresenter)
             .replace(/\{\$wanted\}/g, wanted)
             .replace(/\{\$matching_status\}/g, matchingBlock);

    return res;
  }

  function openEmailSamplePreview() {
    if (!currentEditingTemplate) return;

    document.getElementById('et-preview-tmpl-key').innerText = currentEditingTemplate.id;
    updateEmailSamplePreview();

    const previewSec = document.getElementById('et-preview-section');
    if (previewSec) {
      previewSec.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
  }

  function closeEmailSamplePreview() {
    const previewSec = document.getElementById('et-preview-section');
    if (previewSec) {
      previewSec.style.display = 'none';
      document.body.style.overflow = '';
    }
  }

  function updateEmailSamplePreview() {
    const selector = document.getElementById('et-sample-selector');
    const selectedKey = selector ? selector.value : 'first_time';
    const visitor = SAMPLE_VISITOR_PRESETS[selectedKey] || SAMPLE_VISITOR_PRESETS.first_time;

    const rawSubject = document.getElementById('et-edit-subject').value;
    const rawBody = document.getElementById('et-edit-body').value;

    const renderedSubject = renderTemplateTextWithVisitor(rawSubject, visitor);
    const renderedBody = renderTemplateTextWithVisitor(rawBody, visitor);

    const recipientEl = document.getElementById('et-preview-recipient');
    if (recipientEl) {
      recipientEl.innerText = `${visitor.name} 様 <${visitor.email}>`;
    }

    const subjectEl = document.getElementById('et-preview-subject');
    if (subjectEl) {
      subjectEl.innerText = renderedSubject;
    }

    const bodyEl = document.getElementById('et-preview-body');
    if (bodyEl) {
      bodyEl.innerText = renderedBody;
    }
  }

  function saveEmailTemplateConfirm() {
    if (!currentEditingTemplate) return;

    const subject = document.getElementById('et-edit-subject').value;
    const body = document.getElementById('et-edit-body').value;

    const valResult = validateEmailTemplate(subject, body);
    if (!valResult.isValid) {
      closeEmailSamplePreview();
      runValidationAndProceedToPreview();
      return;
    }

    const saveBtn = document.getElementById('btn-et-save-confirm');
    const originalText = saveBtn.innerHTML;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>保存＆同期中...</span>';

    ApiService.call('updateEmailTemplateApi', currentEditingTemplate.id, subject, body)
      .then(res => {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalText;

        if (res && res.success) {
          showToast('✅ メールテンプレートを更新・スプレッドシートへ同期しました！');
          closeEmailSamplePreview();
          
          // Update local memory cache
          const idx = rawEmailTemplates.findIndex(t => t.id === currentEditingTemplate.id);
          if (idx !== -1) {
            rawEmailTemplates[idx].subject = subject;
            rawEmailTemplates[idx].body = body;
            rawEmailTemplates[idx].updated_at = new Date().toISOString().replace('T', ' ').slice(0, 19);
          }

          cancelEmailTemplateEdit();
          renderEmailTemplatesList();
        } else {
          showToast('❌ 保存に失敗しました: ' + (res.error || '不明なエラー'));
        }
      })
      .catch(err => {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalText;
        console.error('Save email template error:', err);
        showToast('❌ 通信エラーが発生しました');
      });
  }
</script>
