<script>
  /* --- 👤 Member Personal Dashboard Logic (Radical Minimalism & Apple-Style Clean Slate) --- */
  let currentSelectedMemberName = '';
  let currentMemberRoleView = 'invited'; // 'invited' | 'oriented'
  let currentMemberVisitorsFilter = 'all'; // 'all' | 'active' | 'joined'
  let currentMemberActionFilter = 'pending'; // 'pending' | 'completed' | 'all'
  let currentMemberActionData = { pending: [], completed: [] };
  let isAllMembersSummaryView = false;

  function initMemberDashboard(targetMemberName = null) {
    const promises = [];
    
    // メンバーマスターデータのキャッシュ確認
    if ((!cachedFlatMembers || cachedFlatMembers.length === 0) && typeof fetchMembersMasterData === 'function') {
      promises.push(fetchMembersMasterData(false));
    }

    // 全ビジターデータのキャッシュ確認
    if ((!cachedAllVisitors || cachedAllVisitors.length === 0) && typeof fetchAllVisitorsData === 'function') {
      promises.push(fetchAllVisitorsData(false));
    }

    if (promises.length > 0) {
      Promise.all(promises).then(() => {
        populateMemberDashDropdown();
        setupMemberDashboardView(targetMemberName);
      }).catch(() => {
        populateMemberDashDropdown();
        setupMemberDashboardView(targetMemberName);
      });
    } else {
      populateMemberDashDropdown();
      setupMemberDashboardView(targetMemberName);
    }
  }

  function populateMemberDashDropdown() {
    const select = document.getElementById('member-dash-select');
    if (!select) return;

    const members = typeof getFlatMemberList === 'function' ? getFlatMemberList() : [];
    const prevVal = select.value || currentSelectedMemberName;

    let html = '<option value="">メンバーを選択...</option>';
    members.forEach(m => {
      const mName = (m.name || '').trim();
      const mId = m.id !== undefined && m.id !== null ? String(m.id) : mName;
      const cat = m.category ? ` (${m.category})` : '';
      html += `<option value="${escapeHtml(mId)}">${escapeHtml(mName)}${escapeHtml(cat)}</option>`;
    });

    select.innerHTML = html;
    if (prevVal) {
      // IDまたは名前で選択状態を復元
      const resolved = resolveMemberFromParam(prevVal);
      if (resolved && resolved.id) {
        select.value = String(resolved.id);
      } else {
        select.value = prevVal;
      }
    }
  }

  function resolveMemberFromParam(param) {
    if (!param) return null;
    const cleanParam = String(param).trim();
    const members = typeof getFlatMemberList === 'function' ? getFlatMemberList() : [];

    // 1. ID完全一致
    let found = members.find(m => String(m.id) === cleanParam);
    if (found) return found;

    // 2. 氏名完全一致または正規化一致
    const cleanKey = normalizeNameKey(cleanParam);
    found = members.find(m => (m.name || '').trim() === cleanParam || normalizeNameKey(m.name || '') === cleanKey);
    if (found) return found;

    // 3. findMemberByName (苗字のみ・表記揺れ一致)
    if (typeof findMemberByName === 'function') {
      const fuzzy = findMemberByName(cleanParam);
      if (fuzzy) {
        const exact = members.find(m => (m.name || '').trim() === fuzzy.name);
        return exact || fuzzy;
      }
    }

    return { id: null, name: cleanParam, category: 'メンバー', profession: '' };
  }

  function getMemberNameFromUrl() {
    // 1. Pathname (/member/12 or /member/居原田晃司)
    try {
      const pathname = decodeURIComponent(window.location.pathname || '');
      const pathMatch = pathname.match(/\/member\/([^\/\?#]+)/);
      if (pathMatch && pathMatch[1]) {
        return pathMatch[1].trim();
      }
    } catch(e) {}

    // 2. Query Params (?member=... or ?m=... or ?id=...)
    try {
      const searchParams = new URLSearchParams(window.location.search);
      const qMember = searchParams.get('id') || searchParams.get('member') || searchParams.get('m') || searchParams.get('name');
      if (qMember) return decodeURIComponent(qMember).trim();
    } catch(e) {}

    // 3. Hash (#member/12 or #member-dashboard?id=...)
    try {
      const hash = decodeURIComponent(window.location.hash || '').replace(/^#+/, '');
      if (hash.startsWith('member/')) {
        return hash.replace('member/', '').split('?')[0].trim();
      }
      const match = hash.match(/[?&](?:name|id|m)=([^&]+)/);
      if (match && match[1]) {
        return match[1].trim();
      }
    } catch(e) {}

    return null;
  }

  function setupMemberDashboardView(targetMemberIdentifier = null) {
    populateMemberDashDropdown();

    let identifierToSelect = targetMemberIdentifier || getMemberNameFromUrl();

    if (identifierToSelect) {
      selectMemberDashboard(identifierToSelect, false);
    } else if (currentSelectedMemberName) {
      selectMemberDashboard(currentSelectedMemberName, false);
    } else {
      // メンバー未指定時はデフォルトで全体一覧を表示
      toggleAllMembersView(true);
    }
  }

  function onMemberDashSelectChange(val) {
    if (!val) {
      // セレクターで未選択に戻した場合は全体一覧を表示
      currentSelectedMemberName = '';
      toggleAllMembersView(true);
      if (window.history && window.history.pushState) {
        window.history.pushState(null, '', '/#member-dashboard');
      }
      return;
    }
    selectMemberDashboard(val, true);
  }

  function selectMemberDashboard(memberIdentifier, updateHistory = true) {
    if (!memberIdentifier) return;

    const memberObj = resolveMemberFromParam(memberIdentifier);
    const memberName = memberObj ? memberObj.name : memberIdentifier;
    const memberId = memberObj && memberObj.id !== undefined && memberObj.id !== null ? memberObj.id : null;

    currentSelectedMemberName = memberName;

    // 個別ダッシュボードを表示
    toggleAllMembersView(false);

    const select = document.getElementById('member-dash-select');
    if (select) {
      if (memberId !== null) {
        select.value = String(memberId);
      } else {
        select.value = memberName;
      }
    }

    if (updateHistory) {
      const urlParam = memberId !== null ? String(memberId) : encodeURIComponent(memberName);
      const cleanPath = '/member/' + urlParam;
      try {
        if (window.history && window.history.pushState) {
          window.history.pushState({ memberId: memberId, memberName: memberName }, '', cleanPath);
        } else {
          updateUrlHash(`member/${urlParam}`);
        }
      } catch(e) {
        updateUrlHash(`member/${urlParam}`);
      }
    }

    renderMemberProfileHeader(memberObj || { name: memberName, category: 'メンバー', profession: '' });
    renderMemberDashboardData(memberName);
  }

  function showMemberDashEmpty() {
    currentSelectedMemberName = '';
    toggleAllMembersView(true);
  }

  function renderMemberProfileHeader(memberObj) {
    const emptyEl = document.getElementById('member-dash-empty');
    const contentEl = document.getElementById('member-dash-content');
    if (emptyEl) emptyEl.style.display = 'none';
    if (contentEl) contentEl.style.display = 'block';

    const nameEl = document.getElementById('member-dash-name');
    const catEl = document.getElementById('member-dash-category-badge');
    const profEl = document.getElementById('member-dash-profession');
    const avatarEl = document.getElementById('member-dash-avatar');

    const mName = memberObj.name || 'メンバー';
    if (nameEl) nameEl.innerText = mName;
    if (catEl) catEl.innerText = memberObj.category || 'メンバー';
    if (profEl) profEl.innerText = memberObj.profession || '';
    if (avatarEl) avatarEl.innerText = mName.slice(0, 1) || '名';
  }

  function getVisitorsByInviter(inviterName) {
    if (!inviterName || !cachedAllVisitors) return [];
    const cleanInviter = normalizeNameKey(inviterName);

    const rawMatched = cachedAllVisitors.filter(v => {
      const vInviter = (v.inviter || '').trim();
      if (!vInviter) return false;
      if (normalizeNameKey(vInviter) === cleanInviter) return true;
      if (typeof findMemberByName === 'function') {
        const found = findMemberByName(vInviter);
        if (found && (found.name === inviterName || normalizeNameKey(found.name) === cleanInviter)) {
          return true;
        }
      }
      return false;
    });

    // 同一人物（複数回申込・リピート参加）を1人として名寄せ統合
    if (typeof deduplicateVisitorListClient === 'function') {
      return deduplicateVisitorListClient(rawMatched);
    }
    return rawMatched;
  }

  function getVisitorsByOrientationUser(orientMemberName) {
    if (!orientMemberName || !cachedAllVisitors) return [];
    const cleanOrient = normalizeNameKey(orientMemberName);

    const rawMatched = cachedAllVisitors.filter(v => {
      const vOrient = (v.orientUser || v.orient_user || '').trim();
      if (!vOrient) return false;
      if (normalizeNameKey(vOrient) === cleanOrient) return true;
      if (typeof findMemberByName === 'function') {
        const found = findMemberByName(vOrient);
        if (found && (found.name === orientMemberName || normalizeNameKey(found.name) === cleanOrient)) {
          return true;
        }
      }
      return false;
    });

    // 同一人物を1人として名寄せ統合
    if (typeof deduplicateVisitorListClient === 'function') {
      return deduplicateVisitorListClient(rawMatched);
    }
    return rawMatched;
  }

  let memberActivityChartInstance = null;
  let memberFeelDonutChartInstance = null;

  function initMemberActivityChart(labels, invitedData, joinedData, orientedData) {
    const canvas = document.getElementById('member-activity-chart');
    if (!canvas) return;

    if (memberActivityChartInstance) {
      try { memberActivityChartInstance.destroy(); } catch(e) {}
    }

    const ctx = canvas.getContext('2d');
    memberActivityChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            label: '招待',
            data: invitedData,
            backgroundColor: '#0071e3',
            borderRadius: 6,
            barThickness: 10,
            maxBarThickness: 14
          },
          {
            label: '入会',
            data: joinedData,
            backgroundColor: '#0f172a',
            borderRadius: 6,
            barThickness: 10,
            maxBarThickness: 14
          },
          {
            label: 'オリエン',
            data: orientedData,
            backgroundColor: '#94a3b8',
            borderRadius: 6,
            barThickness: 10,
            maxBarThickness: 14
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            grid: { display: false },
            ticks: { color: '#94a3b8', font: { size: 10.5, weight: '700' } }
          },
          y: {
            beginAtZero: true,
            grid: { color: '#f1f5f9' },
            ticks: { stepSize: 1, color: '#94a3b8', font: { size: 10.5, weight: '700' } }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0f172a',
            titleFont: { size: 11, weight: 'bold' },
            bodyFont: { size: 11, weight: 'bold' },
            padding: 8,
            cornerRadius: 8
          }
        }
      }
    });
  }

  function initMemberFeelDonutChart(feelA, feelB, feelC) {
    const canvas = document.getElementById('member-feel-donut-chart');
    if (!canvas) return;

    if (memberFeelDonutChartInstance) {
      try { memberFeelDonutChartInstance.destroy(); } catch(e) {}
    }

    const total = feelA + feelB + feelC;
    const dataValues = total > 0 ? [feelA, feelB, feelC] : [0, 0, 1];
    const bgColors = total > 0 ? ['#10b981', '#f59e0b', '#cbd5e1'] : ['#f1f5f9', '#f1f5f9', '#f1f5f9'];

    const ctx = canvas.getContext('2d');
    memberFeelDonutChartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['A (高感触)', 'B (中感触)', 'C (その他)'],
        datasets: [{
          data: dataValues,
          backgroundColor: bgColors,
          borderWidth: 2,
          borderColor: '#ffffff',
          hoverOffset: 3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '76%',
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: total > 0,
            backgroundColor: '#0f172a',
            titleFont: { size: 11, weight: 'bold' },
            bodyFont: { size: 11, weight: 'bold' },
            padding: 8,
            cornerRadius: 8,
            callbacks: {
              label: function(context) {
                const val = context.parsed || 0;
                const pct = total > 0 ? Math.round((val / total) * 100) : 0;
                return ` ${context.label}: ${val}名 (${pct}%)`;
              }
            }
          }
        }
      }
    });
  }

  function renderMemberDashboardData(memberName) {
    const invitedVisitors = getVisitorsByInviter(memberName);
    const orientedVisitors = getVisitorsByOrientationUser(memberName);

    // 1. 招待実績
    const totalInvited = invitedVisitors.length;
    let invitedJoinedCount = 0;
    let invitedActiveCount = 0;
    const pendingTodoList = [];
    const completedActionList = [];

    const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '/');
    const cleanMember = normalizeNameKey(memberName);

    // 招待ビジターベースのアクション抽出
    invitedVisitors.forEach(v => {
      const joinVal = String(v.isJoined || '').trim();
      const isJoined = (joinVal === '入会' || joinVal === '入会済' || joinVal === '入会申請中' || joinVal === '済');
      const isDeclined = (joinVal === '辞退' || joinVal === '不参加' || joinVal === '見送り');

      if (isJoined) {
        invitedJoinedCount++;
        completedActionList.push({
          visitorId: v.id,
          visitorName: v.name,
          title: `入会決定・オリエンテーション完了`,
          dueDate: v.eventDate,
          assignee: memberName,
          isCompleted: true,
          actionType: '入会確定',
          source: 'joined'
        });
      } else if (!isDeclined) {
        invitedActiveCount++;
      }

      if (v.nextActionText && v.nextActionDueDate) {
        const isOverdue = v.nextActionDueDate < todayStr;
        pendingTodoList.push({
          visitorId: v.id,
          visitorName: v.name,
          title: v.nextActionText,
          dueDate: v.nextActionDueDate,
          assignee: v.nextActionAssignee || memberName,
          isOverdue: isOverdue,
          actionType: v.nextActionType || 'フォロー',
          source: 'action_plan'
        });
      }

      if (v.eventDate && v.eventDate >= todayStr && (!v.isAttended || v.isAttended === '未')) {
        pendingTodoList.push({
          visitorId: v.id,
          visitorName: v.name,
          title: `定例会参加リマインド連絡 (Zoomリンク送付)`,
          dueDate: v.eventDate,
          assignee: memberName,
          isOverdue: false,
          actionType: 'リマインド',
          source: 'event_reminder'
        });
      }

      if (v.isAttended === '出席') {
        if (!v.is1to1 || v.is1to1 === '未') {
          if (!isJoined && !isDeclined) {
            pendingTodoList.push({
              visitorId: v.id,
              visitorName: v.name,
              title: `お礼連絡 ＆ フォロー1to1日程調整`,
              dueDate: v.eventDate || todayStr,
              assignee: memberName,
              isOverdue: false,
              actionType: '1to1調整',
              source: 'follow_1to1'
            });
          }
        } else if (v.is1to1 === '済') {
          completedActionList.push({
            visitorId: v.id,
            visitorName: v.name,
            title: `フォロー1to1 実施済み`,
            dueDate: v.eventDate || todayStr,
            assignee: memberName,
            isCompleted: true,
            actionType: '1to1実施',
            source: '1to1_done'
          });
        }
      }
    });

    // 完了済みアクションプランの抽出 (ダッシュボードキャッシュまたはアクション管理データから)
    if (typeof currentDashboardActionPlans !== 'undefined' && Array.isArray(currentDashboardActionPlans)) {
      currentDashboardActionPlans.forEach(p => {
        if (Number(p.is_completed) === 1) {
          const pAssignee = normalizeNameKey(p.assignee_name || '');
          const isAssignee = pAssignee === cleanMember;
          const isInvitedVisitor = invitedVisitors.some(iv => String(iv.id) === String(p.visitor_id));
          const isOrientedVisitor = orientedVisitors.some(ov => String(ov.id) === String(p.visitor_id));

          if (isAssignee || isInvitedVisitor || isOrientedVisitor) {
            // 重複チェック
            if (!completedActionList.some(c => c.actionPlanId === p.id)) {
              completedActionList.push({
                actionPlanId: p.id,
                visitorId: p.visitor_id,
                visitorName: p.visitor_name,
                title: p.action_text,
                reportText: p.report_text,
                completedBy: p.completed_by,
                dueDate: p.due_date,
                isCompleted: true,
                actionType: p.action_type || '完了',
                source: 'action_plan_completed'
              });
            }
          }
        }
      });
    }

    // 2. オリエンテーション＆クロージング実績
    const totalOriented = orientedVisitors.length;
    let orientJoinedCount = 0;
    orientedVisitors.forEach(v => {
      const joinVal = String(v.isJoined || '').trim();
      const isJoined = (joinVal === '入会' || joinVal === '入会済' || joinVal === '入会申請中' || joinVal === '済');
      if (isJoined) {
        orientJoinedCount++;
      }
    });

    const joinRate = totalInvited > 0 ? Math.round((invitedJoinedCount / totalInvited) * 100) : 0;
    const closingRate = totalOriented > 0 ? Math.round((orientJoinedCount / totalOriented) * 100) : 0;

    // 3. 過去6ヶ月の月別推移グラフ集計
    const monthKeys = [];
    const monthLabels = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      monthKeys.push(`${yyyy}/${mm}`);
      monthLabels.push(`${d.getMonth() + 1}月`);
    }

    const monthlyInvited = Array(6).fill(0);
    const monthlyJoined = Array(6).fill(0);
    const monthlyOriented = Array(6).fill(0);

    invitedVisitors.forEach(v => {
      if (v.eventDate) {
        const ym = v.eventDate.slice(0, 7);
        const idx = monthKeys.indexOf(ym);
        if (idx !== -1) {
          monthlyInvited[idx]++;
          const joinVal = String(v.isJoined || '').trim();
          if (joinVal === '入会' || joinVal === '入会済' || joinVal === '入会申請中' || joinVal === '済') {
            monthlyJoined[idx]++;
          }
        }
      }
    });

    orientedVisitors.forEach(v => {
      if (v.eventDate) {
        const ym = v.eventDate.slice(0, 7);
        const idx = monthKeys.indexOf(ym);
        if (idx !== -1) {
          monthlyOriented[idx]++;
        }
      }
    });

    initMemberActivityChart(monthLabels, monthlyInvited, monthlyJoined, monthlyOriented);

    // 4. 感触・温度感ランク分布 (ドーナツチャート集計)
    let feelACount = 0;
    let feelBCount = 0;
    let feelCCount = 0;
    const allMemberVisitors = [...invitedVisitors];
    orientedVisitors.forEach(ov => {
      if (!allMemberVisitors.some(v => String(v.id) === String(ov.id))) {
        allMemberVisitors.push(ov);
      }
    });

    allMemberVisitors.forEach(v => {
      const f = parseFeelAbc(v.feelAbc);
      if (f === 'A') feelACount++;
      else if (f === 'B') feelBCount++;
      else feelCCount++;
    });

    const totalFeel = allMemberVisitors.length;
    const feelAPercent = totalFeel > 0 ? Math.round((feelACount / totalFeel) * 100) : 0;
    const feelBPercent = totalFeel > 0 ? Math.round((feelBCount / totalFeel) * 100) : 0;
    const feelCPercent = totalFeel > 0 ? Math.round((feelCCount / totalFeel) * 100) : 0;

    initMemberFeelDonutChart(feelACount, feelBCount, feelCCount);

    const elTotalLabel = document.getElementById('member-feel-total-label');
    const elDonutCenter = document.getElementById('member-feel-donut-center');
    const elFeelA = document.getElementById('member-feel-a-count');
    const elFeelB = document.getElementById('member-feel-b-count');
    const elFeelC = document.getElementById('member-feel-c-count');

    if (elTotalLabel) elTotalLabel.innerText = `${totalFeel}名`;
    if (elDonutCenter) elDonutCenter.innerText = `${feelAPercent}%`;
    if (elFeelA) elFeelA.innerText = `${feelACount}名 (${feelAPercent}%)`;
    if (elFeelB) elFeelB.innerText = `${feelBCount}名 (${feelBPercent}%)`;
    if (elFeelC) elFeelC.innerText = `${feelCCount}名 (${feelCPercent}%)`;

    // アクションデータ保存
    currentMemberActionData = {
      pending: pendingTodoList,
      completed: completedActionList
    };

    // DOM更新
    const totalEl = document.getElementById('member-kpi-total-visitors');
    const joinedEl = document.getElementById('member-kpi-joined-count');
    const orientCountEl = document.getElementById('member-kpi-orient-count');
    const orientJoinedEl = document.getElementById('member-kpi-orient-joined-count');
    const activeEl = document.getElementById('member-kpi-active-count');
    const todoEl = document.getElementById('member-kpi-todo-count');
    const todoDot = document.getElementById('member-kpi-todo-dot');
    const joinRateEl = document.getElementById('member-dash-join-rate');
    const closingRateEl = document.getElementById('member-dash-closing-rate');
    const roleCountInvitedEl = document.getElementById('role-count-invited');
    const roleCountOrientedEl = document.getElementById('role-count-oriented');

    const countPendingEl = document.getElementById('todo-count-pending');
    const countCompletedEl = document.getElementById('todo-count-completed');
    const countAllEl = document.getElementById('todo-count-all');

    if (totalEl) totalEl.innerText = totalInvited;
    if (joinedEl) joinedEl.innerText = invitedJoinedCount;
    if (orientCountEl) orientCountEl.innerText = totalOriented;
    if (orientJoinedEl) orientJoinedEl.innerText = orientJoinedCount;
    if (activeEl) activeEl.innerText = invitedActiveCount;
    if (todoEl) todoEl.innerText = pendingTodoList.length;
    if (joinRateEl) joinRateEl.innerText = `${joinRate}%`;
    if (closingRateEl) closingRateEl.innerText = `${closingRate}%`;
    if (roleCountInvitedEl) roleCountInvitedEl.innerText = totalInvited;
    if (roleCountOrientedEl) roleCountOrientedEl.innerText = totalOriented;

    if (countPendingEl) countPendingEl.innerText = pendingTodoList.length;
    if (countCompletedEl) countCompletedEl.innerText = completedActionList.length;
    if (countAllEl) countAllEl.innerText = (pendingTodoList.length + completedActionList.length);

    if (todoDot) {
      const hasOverdue = pendingTodoList.some(t => t.isOverdue);
      todoDot.className = 'kpi-status-dot ' + (hasOverdue ? 'red' : 'blue');
      todoDot.title = hasOverdue ? '期限切れアクションあり' : '正常';
    }

    renderMemberTodoListUI();

    const activeList = currentMemberRoleView === 'oriented' ? orientedVisitors : invitedVisitors;
    renderMemberVisitorCards(activeList);
  }

  function filterMemberActionList(mode) {
    currentMemberActionFilter = mode;
    ['pending', 'completed', 'all'].forEach(m => {
      const btn = document.getElementById('tab-action-' + m);
      if (btn) {
        if (m === mode) {
          btn.className = 'px-2.5 py-1 rounded-lg bg-white text-slate-900 shadow-2xs cursor-pointer';
        } else {
          btn.className = 'px-2.5 py-1 rounded-lg text-slate-500 hover:text-slate-900 cursor-pointer';
        }
      }
    });

    renderMemberTodoListUI();
  }

  function renderMemberTodoListUI() {
    const listEl = document.getElementById('member-todo-list');
    if (!listEl) return;

    let itemsToDisplay = [];
    if (currentMemberActionFilter === 'pending') {
      itemsToDisplay = currentMemberActionData.pending || [];
    } else if (currentMemberActionFilter === 'completed') {
      itemsToDisplay = currentMemberActionData.completed || [];
    } else {
      itemsToDisplay = [...(currentMemberActionData.pending || []), ...(currentMemberActionData.completed || [])];
    }

    if (itemsToDisplay.length === 0) {
      const emptyMsg = currentMemberActionFilter === 'completed'
        ? '完了したアクション履歴はありません'
        : '現在やるべき未対応アクションはありません';

      listEl.innerHTML = `
        <div class="py-6 text-center text-xs font-bold text-slate-400">
          ${emptyMsg}
        </div>
      `;
      return;
    }

    let html = '';
    itemsToDisplay.forEach(item => {
      const isCompleted = item.isCompleted;
      const isOverdue = !isCompleted && item.isOverdue;
      const dateText = item.dueDate ? item.dueDate.replace(/^\d{4}\//, '') : '';

      let badgeClass = 'bg-slate-100 text-slate-600 border-slate-200/60';
      if (isCompleted) {
        badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
      } else if (isOverdue) {
        badgeClass = 'bg-red-50 text-red-700 border-red-200';
      }

      const reportHtml = item.reportText ? `
        <div class="mt-1.5 p-2 bg-slate-50 border border-slate-100 rounded-lg text-[11px] text-slate-600">
          <span class="font-bold text-emerald-600"><i class="fa-regular fa-comment-dots mr-1"></i>報告:</span> ${escapeHtml(item.reportText)}
          ${item.completedBy ? `<span class="text-[10px] text-slate-400 ml-1">(${escapeHtml(item.completedBy)})</span>` : ''}
        </div>
      ` : '';

      html += `
        <div class="p-3 rounded-xl border ${isCompleted ? 'border-slate-200/60 bg-slate-50/40' : (isOverdue ? 'border-red-200 bg-red-50/20' : 'border-slate-200/80 bg-white')} flex items-center justify-between gap-3 transition-colors">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 mb-0.5">
              <span class="text-[10px] font-extrabold px-1.5 py-0.2 rounded border ${badgeClass}">
                ${isCompleted ? '<i class="fa-solid fa-check text-[9px] mr-0.5"></i>' : ''}${escapeHtml(item.actionType)}
              </span>
              <span class="text-xs font-extrabold text-slate-900 truncate">
                ${escapeHtml(item.visitorName || 'ビジター')} 様
              </span>
            </div>
            <div class="text-xs ${isCompleted ? 'text-slate-500 font-semibold line-through-offset-2' : 'text-slate-700 font-bold'} truncate">
              ${escapeHtml(item.title)}
            </div>
            ${reportHtml}
            <div class="text-[10px] font-bold ${isCompleted ? 'text-slate-400' : (isOverdue ? 'text-red-600' : 'text-slate-400')} mt-0.5">
              ${isCompleted ? '完了' : '期日'}: ${escapeHtml(dateText)} ${isOverdue ? '(期限切れ)' : ''}
            </div>
          </div>
          <div class="shrink-0">
            ${item.visitorId ? `
              <button type="button" onclick="openVisitorDetailView('${escapeHtml(item.visitorId)}')" class="w-8 h-8 rounded-lg bg-white hover:bg-slate-100 text-slate-700 flex items-center justify-center text-xs border border-slate-200/80 shadow-2xs transition-colors cursor-pointer" title="カルテ詳細">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            ` : ''}
          </div>
        </div>
      `;
    });

    listEl.innerHTML = html;
  }

  function switchMemberRoleView(role) {
    currentMemberRoleView = role;
    ['invited', 'oriented'].forEach(r => {
      const btn = document.getElementById('tab-role-' + r);
      if (btn) {
        if (r === role) {
          btn.className = 'px-3 py-1 rounded-lg bg-white text-slate-900 shadow-2xs cursor-pointer';
        } else {
          btn.className = 'px-3 py-1 rounded-lg text-slate-500 hover:text-slate-900 cursor-pointer';
        }
      }
    });

    const visitors = currentMemberRoleView === 'oriented'
      ? getVisitorsByOrientationUser(currentSelectedMemberName)
      : getVisitorsByInviter(currentSelectedMemberName);

    renderMemberVisitorCards(visitors);
  }

  function filterMemberVisitors(filterType) {
    currentMemberVisitorsFilter = filterType;
    ['all', 'active', 'joined'].forEach(f => {
      const btn = document.getElementById('tab-mv-' + f);
      if (btn) {
        if (f === filterType) {
          btn.className = 'px-2.5 py-1 rounded-lg bg-white text-slate-900 shadow-2xs cursor-pointer';
        } else {
          btn.className = 'px-2.5 py-1 rounded-lg text-slate-500 hover:text-slate-900 cursor-pointer';
        }
      }
    });

    const visitors = currentMemberRoleView === 'oriented'
      ? getVisitorsByOrientationUser(currentSelectedMemberName)
      : getVisitorsByInviter(currentSelectedMemberName);

    renderMemberVisitorCards(visitors);
  }

  function renderMemberVisitorCards(visitors) {
    const gridEl = document.getElementById('member-visitor-cards-grid');
    const emptyEl = document.getElementById('member-visitor-empty');
    if (!gridEl) return;

    let filtered = visitors;
    if (currentMemberVisitorsFilter === 'active') {
      filtered = visitors.filter(v => {
        const j = String(v.isJoined || '').trim();
        return j !== '入会' && j !== '入会済' && j !== '済' && j !== '辞退' && j !== '不参加' && j !== '見送り';
      });
    } else if (currentMemberVisitorsFilter === 'joined') {
      filtered = visitors.filter(v => {
        const j = String(v.isJoined || '').trim();
        return j === '入会' || j === '入会済' || j === '入会申請中' || j === '済';
      });
    }

    if (filtered.length === 0) {
      gridEl.innerHTML = '';
      if (emptyEl) emptyEl.style.display = 'block';
      return;
    }

    if (emptyEl) emptyEl.style.display = 'none';

    let html = '';
    filtered.forEach(v => {
      if (typeof renderStandardVisitorCardHtml === 'function') {
        html += renderStandardVisitorCardHtml(v);
      } else {
        const dateStr = v.eventDate ? v.eventDate.replace(/^\d{4}\//, '') : '';
        html += `
          <div class="dash-ap-card" onclick="openVisitorDetailView('${escapeHtml(v.id)}')">
            <div class="dash-card-main-row">
              <div class="dash-card-left">
                ${renderRankBadgeHtml(v.feelAbc, 'large')}
                <div class="dash-card-info">
                  <div class="dash-card-name-row">
                    <span class="dash-card-name">${escapeHtml(v.name || 'ビジター')}</span>
                  </div>
                  <div class="dash-card-company">${escapeHtml(v.company || '')}</div>
                </div>
              </div>
              <div class="dash-card-right">
                <span class="dash-card-date-badge">${escapeHtml(dateStr)}</span>
                <span class="dash-card-chevron"><i class="fa-solid fa-chevron-right"></i></span>
              </div>
            </div>
          </div>
        `;
      }
    });

    gridEl.innerHTML = html;
  }

  function toggleAllMembersView(forceState = null) {
    if (forceState !== null) {
      isAllMembersSummaryView = forceState;
    } else {
      isAllMembersSummaryView = !isAllMembersSummaryView;
    }

    const singleContainer = document.getElementById('member-single-dash-container');
    const allContainer = document.getElementById('member-all-summary-container');
    const labelEl = document.getElementById('label-toggle-all-members');

    if (isAllMembersSummaryView) {
      if (singleContainer) singleContainer.style.display = 'none';
      if (allContainer) allContainer.style.display = 'block';
      if (labelEl) labelEl.innerText = '個別';
      renderAllMembersSummaryTable();
    } else {
      if (singleContainer) singleContainer.style.display = 'block';
      if (allContainer) allContainer.style.display = 'none';
      if (labelEl) labelEl.innerText = '全体';
      if (currentSelectedMemberName) {
        selectMemberDashboard(currentSelectedMemberName, false);
      }
    }
  }

  function renderAllMembersSummaryTable() {
    const tbody = document.getElementById('all-members-summary-tbody');
    if (!tbody) return;

    const searchInput = document.getElementById('all-members-search-input');
    const query = searchInput ? (searchInput.value || '').trim().toLowerCase() : '';

    const members = typeof getFlatMemberList === 'function' ? getFlatMemberList() : [];
    if (members.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center py-6 text-slate-400">メンバー情報がありません</td></tr>';
      return;
    }

    const summaryList = members.map(m => {
      const mName = (m.name || '').trim();
      const invitedVisitors = getVisitorsByInviter(mName);
      const orientedVisitors = getVisitorsByOrientationUser(mName);

      // 招待実績
      const totalInvited = invitedVisitors.length;
      let invitedJoinedCount = 0;
      let todoCount = 0;

      const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '/');

      invitedVisitors.forEach(v => {
        const joinVal = String(v.isJoined || '').trim();
        if (joinVal === '入会' || joinVal === '入会済' || joinVal === '入会申請中' || joinVal === '済') {
          invitedJoinedCount++;
        }

        if (v.nextActionText && v.nextActionDueDate) todoCount++;
        if (v.eventDate && v.eventDate >= todayStr && (!v.isAttended || v.isAttended === '未')) todoCount++;
      });

      // オリエン実績
      const totalOriented = orientedVisitors.length;
      let orientJoinedCount = 0;
      orientedVisitors.forEach(v => {
        const joinVal = String(v.isJoined || '').trim();
        if (joinVal === '入会' || joinVal === '入会済' || joinVal === '入会申請中' || joinVal === '済') {
          orientJoinedCount++;
        }
      });

      const joinRate = totalInvited > 0 ? Math.round((invitedJoinedCount / totalInvited) * 100) : 0;
      const closingRate = totalOriented > 0 ? Math.round((orientJoinedCount / totalOriented) * 100) : 0;

      return {
        id: m.id !== undefined && m.id !== null ? m.id : null,
        name: mName,
        category: m.category || 'その他',
        profession: m.profession || '',
        totalInvited,
        invitedJoinedCount,
        joinRate,
        totalOriented,
        orientJoinedCount,
        closingRate,
        todoCount
      };
    });

    summaryList.sort((a, b) => (b.totalInvited + b.totalOriented) - (a.totalInvited + a.totalOriented) || b.totalInvited - a.totalInvited);

    let filtered = summaryList;
    if (query) {
      filtered = summaryList.filter(s => s.name.toLowerCase().includes(query) || s.category.toLowerCase().includes(query) || s.profession.toLowerCase().includes(query));
    }

    let html = '';
    filtered.forEach(s => {
      const clickArg = s.id !== null ? String(s.id) : s.name;
      html += `
        <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="selectMemberFromSummaryTable('${escapeHtml(clickArg)}')">
          <td class="py-2.5 px-3 font-extrabold text-slate-900 text-xs">
            ${escapeHtml(s.name)}
          </td>
          <td class="py-2.5 px-3 text-slate-500 font-bold text-[11px]">
            ${escapeHtml(s.category)}
          </td>
          <td class="py-2.5 px-3 text-center font-black text-slate-900 font-mono text-xs">${s.totalInvited}</td>
          <td class="py-2.5 px-3 text-center font-black text-slate-900 font-mono text-xs">${s.invitedJoinedCount}</td>
          <td class="py-2.5 px-3 text-center font-bold text-slate-500 font-mono text-xs">${s.joinRate}%</td>
          <td class="py-2.5 px-3 text-center font-black text-slate-900 font-mono text-xs">${s.totalOriented}</td>
          <td class="py-2.5 px-3 text-center font-black text-slate-900 font-mono text-xs">${s.orientJoinedCount}</td>
          <td class="py-2.5 px-3 text-center font-bold text-slate-500 font-mono text-xs">${s.closingRate}%</td>
          <td class="py-2.5 px-3 text-center font-mono text-xs">
            ${s.todoCount > 0 ? `<span class="font-bold text-red-600">${s.todoCount}</span>` : '<span class="text-slate-300">-</span>'}
          </td>
          <td class="py-2.5 px-3 text-right">
            <i class="fa-solid fa-chevron-right text-slate-400 text-[10px]"></i>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  function selectMemberFromSummaryTable(memberIdentifier) {
    toggleAllMembersView(false);
    selectMemberDashboard(memberIdentifier, true);
  }

  function getMemberShareUrl(memberNameOrIdentifier) {
    const origin = window.location.origin;
    const memberObj = resolveMemberFromParam(memberNameOrIdentifier);
    if (memberObj && memberObj.id !== undefined && memberObj.id !== null) {
      return `${origin}/member/${memberObj.id}`;
    }
    const name = memberObj ? memberObj.name : memberNameOrIdentifier;
    return `${origin}/member/${encodeURIComponent(name)}`;
  }

  function copyMemberDashUrl() {
    if (!currentSelectedMemberName) {
      showToast('メンバーを選択してください', 'warning');
      return;
    }

    const shareUrl = getMemberShareUrl(currentSelectedMemberName);
    navigator.clipboard.writeText(shareUrl).then(() => {
      showToast(`URLをコピーしました (${currentSelectedMemberName} 様)`, 'success');
    }).catch(() => {
      showToast('コピーに失敗しました', 'error');
    });
  }

  function copyMemberDashLineText() {
    if (!currentSelectedMemberName) {
      showToast('メンバーを選択してください', 'warning');
      return;
    }

    const visitors = getVisitorsByInviter(currentSelectedMemberName);
    const shareUrl = getMemberShareUrl(currentSelectedMemberName);

    let activeSummary = '';
    const activeVisitors = visitors.filter(v => {
      const j = String(v.isJoined || '').trim();
      return j !== '入会' && j !== '入会済' && j !== '済' && j !== '辞退' && j !== '不参加' && j !== '見送り';
    });

    if (activeVisitors.length > 0) {
      activeSummary = activeVisitors.map(v => `・${v.name} 様 (${v.feelAbc ? '温度感' + v.feelAbc : 'フォロー中'})`).join('\n');
    } else {
      activeSummary = '現在フォロー中のゲストはいません';
    }

    const text = `${currentSelectedMemberName}さん\nビジター招待ありがとうございます！\n\n最新フォロー状況・To-Doはこちら👇\n${shareUrl}\n\n【現在フォロー中のゲスト】\n${activeSummary}`;

    navigator.clipboard.writeText(text).then(() => {
      showToast('LINE共有文をコピーしました', 'success');
    }).catch(() => {
      showToast('コピーに失敗しました', 'error');
    });
  }
</script>
