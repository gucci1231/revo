<script>
/**
 * Ultra-Fast REST API Bridge & Fallback Service
 */
const ApiService = {
  call: function(functionName, ...args) {
    const effectiveArgs = (args.length === 1 && Array.isArray(args[0])) ? args[0] : args;
    return new Promise((resolve, reject) => {
      const restConfig = this.getRestConfig(functionName, effectiveArgs);

      if (restConfig) {
        const fetchOptions = {
          method: restConfig.method || 'GET',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store'
        };
        if (restConfig.body) {
          fetchOptions.body = JSON.stringify(restConfig.body);
        }

        fetch(restConfig.url, fetchOptions)
          .then(res => res.json())
          .then(data => {
            if (data && data.success !== false) {
              resolve(data);
              return;
            }
            this.fallbackToGas(functionName, effectiveArgs, resolve, reject);
          })
          .catch(() => {
            this.fallbackToGas(functionName, effectiveArgs, resolve, reject);
          });
      } else {
        this.fallbackToGas(functionName, effectiveArgs, resolve, reject);
      }
    });
  },

  getRestConfig: function(functionName, args = []) {
    switch (functionName) {
      case 'getDashboardData':
      case 'getDashboardDataApi':
        return { url: '/api/dashboard.php', method: 'GET' };
      case 'getAllVisitorsApi':

        return {
          url: '/api/visitors.php?action=update_status',
          method: 'POST',
          body: { visitorId: args[0], field: args[1], value: args[2] }
        };
      case 'updateVisitorCategoryApi':
        const catArg = (args[0] && typeof args[0] === 'object') ? args[0] : { visitorId: args[0], category: args[1] };

          url: '/api/visitors.php?action=update_category',
          method: 'POST',
          body: catArg
        };
      case 'saveVisitorMemoApi':
        return {
          url: '/api/visitors.php?action=save_memo',
          method: 'POST',
          body: { visitorId: args[0], memo: args[1] }
        };
      case 'addVisitorApi':
      case 'updateVisitorApi':
        return {
          url: '/api/visitors.php?action=add',
          method: 'POST',
          body: args[0] || {}
        };
      case 'deleteVisitorApi':
        return {
          url: '/api/visitors.php?action=delete',

          body: { id: args[0] }
        };
      case 'getHearingSheetsListApi':

          body: args[0] || {}
        };
      case 'getMembersApi':
      case 'getMemberListApi':
        return { url: '/api/members.php?action=list', method: 'GET' };
      case 'addMemberApi':
        return {
          url: '/api/members.php?action=add',

          body: args[0] || {}

      case 'updateMemberApi':

      case 'deleteMemberApi':

          body: { id: args[0] }
        };
      case 'syncFormResponsesApi':

      case 'updateSettingStartDateApi':
        return {
          url: '/api/settings.php?action=update',

          body: { key: 'start_date', value: args[0] }
        };
      case 'getGoalsApi':

          url: '/api/settings.php?action=get_goals',

      case 'saveDefaultGoalsApi':

      case 'deleteMonthlyGoalApi':

      case 'getActionPlansApi':

      case 'getActionPlanDetailApi':

        };
      case 'updateActionPlanApi':
        return {

        };
      case 'toggleActionPlanApi':

      case 'updateReportTemplateApi':

      case 'toggleReportTemplateApi':

      case 'reorderChapterLinksApi':

      case 'reorderChapterCategoriesApi':

      case 'saveChapterCategoryApi':

        };
      case 'getOgpApi':
        return { url: '/api/ogp.php?url=' + encodeURIComponent(args[0] || ''), method: 'GET' };
      case 'getPalmsListApi':
      case 'getPalmsRankingApi': {
        const pStart = args[0] ? encodeURIComponent(args[0]) : '';
        const pEnd = args[1] ? encodeURIComponent(args[1]) : '';
        const q = (pStart && pEnd) ? `&startDate=${pStart}&endDate=${pEnd}` : '';
        return { url: `/api/palms.php?action=list${q}`, method: 'GET' };

      case 'getPalmsMemberHistoryApi': {
        const mName = args[0] ? encodeURIComponent(args[0]) : '';
        return { url: `/api/palms.php?action=member&name=${mName}`, method: 'GET' };
      }
      case 'getPalmsPeriodsApi':
        return { url: '/api/palms.php?action=periods', method: 'GET' };
      case 'getPalmsChapterTrendsApi':
        return { url: '/api/palms.php?action=chapter_trends', method: 'GET' };
      case 'syncPalmsApi':
      case 'syncPalmsFromBniConnectApi':
        return {
          url: '/api/palms.php?action=sync',
          method: 'POST',
          body: (args[0] && typeof args[0] === 'object') ? args[0] : (args[0] && args[1] ? { startDate: args[0], endDate: args[1] } : {})

      case 'getScheduledEmailsApi':

      case 'getLotteryDataApi':
      case 'getLotteryHistoryApi':

      case 'recordLotteryWinnerApi':

      case 'resetLotteryHistoryApi':

          url: '/api/lottery.php?action=reset',

        };
      case 'getCalendarEventsApi': {
        const params = new URLSearchParams();
        if (args[0] && typeof args[0] === 'object') {
          Object.keys(args[0]).forEach(k => {
            if (args[0][k] !== undefined && args[0][k] !== '') params.append(k, args[0][k]);
          });
        } else if (typeof args[0] === 'string' && args[0]) {
          params.append('month', args[0]);
        }
        params.append('_t', Date.now().toString());
        const qs = params.toString() ? '&' + params.toString() : '';
        return { url: `/api/events.php?action=calendar${qs}`, method: 'GET' };

        };

      case 'getEventsListApi':
      case 'getTrainingEventsApi': {
        const params = new URLSearchParams();
        if (args[0] && typeof args[0] === 'object') {
          Object.keys(args[0]).forEach(k => {
            if (args[0][k] !== undefined && args[0][k] !== '') params.append(k, args[0][k]);
          });
        }
        const qs = params.toString() ? '&' + params.toString() : '';
        return { url: `/api/events.php?action=list${qs}`, method: 'GET' };
      }
      case 'getEventDetailApi':
        return { url: `/api/events.php?action=get&id=${encodeURIComponent(args[0] || '')}`, method: 'GET' };
      case 'syncEventsApi':
      case 'syncTrainingEventsApi':
        return {
          url: '/api/events.php?action=sync',
          method: 'POST',
          body: (args[0] && typeof args[0] === 'object') ? args[0] : {}
        };
      case 'getEventCategoriesApi':
        return { url: '/api/events.php?action=categories', method: 'GET' };
      case 'getEventSummaryApi':
        return { url: '/api/events.php?action=summary', method: 'GET' };
      default:
        return null;

    }
  },

  fallbackToGas: function(functionName, args, resolve, reject) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      let runner = google.script.run
        .withSuccessHandler(res => resolve(res))
        .withFailureHandler(err => reject(err));
      if (typeof runner[functionName] === 'function') {
        runner[functionName](...args);
      } else {
        reject(new Error(`API method ${functionName} not found`));
      }
    } else {
      resolve({ success: true, list: [], metrics: {}, visitors: [], hearings: [] });
    }
  }
};
</script>
