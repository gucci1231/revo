<!-- VIEW: 報告・メッセージ管理センター (HTMLメール & LINEグループ報告 一元管理) -->
<div id="view-report-manager" class="view-content">

  <!-- 1. ヘッダー ツールバー -->
  <div class="bg-white border border-slate-200/80 rounded-2xl p-5 mb-5 shadow-2xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="px-2 py-0.5 rounded text-[11px] font-extrabold bg-blue-50 text-blue-700 border border-blue-200">
          <i class="fa-solid fa-paper-plane text-[9px] mr-1"></i>Report & Notification Center
        </span>
        <span class="text-xs text-slate-400 font-bold font-mono">From: info@k-d-o.biz</span>
      </div>
      <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight m-0">報告・メッセージ管理</h2>
    </div>

    <!-- 右側アクション -->
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" onclick="fetchReportTemplatesData(true)" class="h-9 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl border border-slate-200/60 transition-colors flex items-center gap-1.5 cursor-pointer" title="再読込">
        <i class="fa-solid fa-rotate-right"></i>
        <span>再読込</span>
      </button>
    </div>
  </div>

  <!-- 2. 4大報告タイプ タブセレクター (Apple Minimal Pill Tabs) -->
  <div class="bg-slate-100 p-1 rounded-2xl mb-5 flex items-center gap-1 overflow-x-auto scrollbar-none">
    <button type="button" id="rm-tab-btn-meeting_recap" onclick="switchReportTab('meeting_recap')" class="flex-1 min-w-[140px] py-2.5 px-3 rounded-xl text-xs font-black transition-all bg-white text-slate-900 shadow-2xs flex items-center justify-center gap-1.5 cursor-pointer">
      <i class="fa-solid fa-bullhorn text-[#0071e3]"></i>
      <span>定例会速報</span>
    </button>
    <button type="button" id="rm-tab-btn-member_remind" onclick="switchReportTab('member_remind')" class="flex-1 min-w-[140px] py-2.5 px-3 rounded-xl text-xs font-bold transition-all text-slate-500 hover:text-slate-900 flex items-center justify-center gap-1.5 cursor-pointer">
      <i class="fa-solid fa-user-clock text-[#64748b]"></i>
      <span>メンバー個別リマインド</span>
    </button>
    <button type="button" id="rm-tab-btn-weekly_summary" onclick="switchReportTab('weekly_summary')" class="flex-1 min-w-[140px] py-2.5 px-3 rounded-xl text-xs font-bold transition-all text-slate-500 hover:text-slate-900 flex items-center justify-center gap-1.5 cursor-pointer">
      <i class="fa-solid fa-chart-line text-[#64748b]"></i>
      <span>成果サマリー</span>
    </button>
    <button type="button" id="rm-tab-btn-action_cleared" onclick="switchReportTab('action_cleared')" class="flex-1 min-w-[140px] py-2.5 px-3 rounded-xl text-xs font-bold transition-all text-slate-500 hover:text-slate-900 flex items-center justify-center gap-1.5 cursor-pointer">
      <i class="fa-solid fa-circle-check text-[#059669]"></i>
      <span>アクション完了速報</span>
    </button>
  </div>

  <!-- 3. メイン管理パネル -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
    
    <!-- 左側: テンプレート設定 ＆ 編集エディタ (7カラム) -->
    <div class="lg:col-span-7 space-y-4">
      
      <!-- ステータス ＆ チャンネル切り替えカード -->
      <div class="bg-white border border-slate-200/80 rounded-2xl p-5 shadow-2xs">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
          <div>
            <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Report Status</span>
            <h3 class="text-sm font-extrabold text-slate-900 m-0" id="rm-current-title">定例会ビジター来訪＆フォロー速報</h3>
          </div>

          <!-- オン/オフ トグルスイッチ -->
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-600" id="rm-enabled-label">有効</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="rm-enabled-toggle" class="sr-only peer" onchange="onReportToggleChange(this.checked)">
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
            </label>
          </div>
        </div>

        <!-- チャンネル切り替え (HTMLメール ⇄ LINE報告文) -->
        <div class="inline-flex rounded-xl bg-slate-100 p-0.5 text-xs font-bold w-full">
          <button type="button" id="rm-channel-btn-email" onclick="switchReportChannel('email')" class="flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-2xs cursor-pointer flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-envelope text-blue-600"></i>
            <span>HTMLメール (From: info@k-d-o.biz)</span>
          </button>
          <button type="button" id="rm-channel-btn-line" onclick="switchReportChannel('line')" class="flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 cursor-pointer flex items-center justify-center gap-1.5">
            <i class="fa-brands fa-line text-emerald-600"></i>
            <span>LINEグループ報告文</span>
          </button>
        </div>
      </div>

      <!-- A. HTMLメール編集フォーム -->
      <div id="rm-form-email" class="bg-white border border-slate-200/80 rounded-2xl p-5 shadow-2xs space-y-4">
        
        <!-- 送信先設定 -->
        <div>
          <label class="block text-xs font-extrabold text-slate-700 mb-1">
            <span>送信先メールアドレス (カンマ区切りで複数可)</span>
          </label>
          <input type="text" id="rm-email-recipients" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:bg-white transition" placeholder="info@k-d-o.biz, chapter-core@k-d-o.biz">
        </div>

        <!-- 件名 -->
        <div>
          <label class="block text-xs font-extrabold text-slate-700 mb-1">
            <span>メール件名</span>
          </label>
          <input type="text" id="rm-email-subject" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:bg-white transition" placeholder="【ビジホス速報】{{定例会日付}} ビジター来訪報告">
        </div>

        <!-- プレースホルダー一覧 -->
        <div>
          <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">利用可能な自動置換タグ (クリックで挿入)</div>
          <div class="flex flex-wrap gap-1.5" id="rm-email-placeholder-chips">
            <!-- JSで動的生成 -->
          </div>
        </div>

        <!-- HTML本文エディタ -->
        <div>
          <label class="block text-xs font-extrabold text-slate-700 mb-1">
            <span>HTMLメール本文</span>
          </label>
          <textarea id="rm-email-body" rows="12" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-mono text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:bg-white transition leading-relaxed" oninput="updateReportPreview()"></textarea>
        </div>

        <!-- アクションボタン -->
        <div class="flex items-center justify-between pt-2 border-t border-slate-100 gap-3">
          <button type="button" onclick="sendTestReportEmail()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold rounded-xl border border-slate-200/80 transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-paper-plane text-blue-600"></i>
            <span>テスト送信 (info@k-d-o.bizから)</span>
          </button>

          <button type="button" onclick="saveCurrentReportTemplate()" class="px-5 py-2 bg-slate-900 hover:bg-black text-white text-xs font-extrabold rounded-xl shadow-2xs transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>テンプレートを保存</span>
          </button>
        </div>
      </div>

      <!-- B. LINEグループ報告文 編集フォーム -->
      <div id="rm-form-line" class="bg-white border border-slate-200/80 rounded-2xl p-5 shadow-2xs space-y-4" style="display: none;">
        
        <!-- プレースホルダー一覧 -->
        <div>
          <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">利用可能な自動置換タグ (クリックで挿入)</div>
          <div class="flex flex-wrap gap-1.5" id="rm-line-placeholder-chips">
            <!-- JSで動的生成 -->
          </div>
        </div>

        <!-- LINE文面エディタ -->
        <div>
          <label class="block text-xs font-extrabold text-slate-700 mb-1">
            <span>LINEグループ報告文テンプレート</span>
          </label>
          <textarea id="rm-line-body" rows="14" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-mono text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:bg-white transition leading-relaxed" oninput="updateReportPreview()"></textarea>
        </div>

        <!-- アクションボタン -->
        <div class="flex items-center justify-between pt-2 border-t border-slate-100 gap-3">
          <button type="button" onclick="copyReplacedLineReportText()" class="px-4 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold rounded-xl border border-emerald-200 transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-regular fa-copy"></i>
            <span>最新データでLINE文面をコピー</span>
          </button>

          <button type="button" onclick="saveCurrentReportTemplate()" class="px-5 py-2 bg-slate-900 hover:bg-black text-white text-xs font-extrabold rounded-xl shadow-2xs transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>テンプレートを保存</span>
          </button>
        </div>
      </div>

    </div>

    <!-- 右側: リアルタイムプレビュー (実データ置換サンプル) (5カラム) -->
    <div class="lg:col-span-5 space-y-4">
      <div class="bg-white border border-slate-200/80 rounded-2xl p-5 shadow-2xs sticky top-20">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <h3 class="text-xs font-extrabold text-slate-800 m-0">リアルタイム実データプレビュー</h3>
          </div>
          <span class="text-[10px] font-bold text-slate-400 font-mono">Live Output</span>
        </div>

        <!-- メールプレビューコンテナ -->
        <div id="rm-preview-container-email">
          <div class="mb-2 p-2 bg-slate-50 border border-slate-200/60 rounded-xl text-xs font-mono">
            <div class="text-slate-400 text-[10px]">Subject:</div>
            <div class="font-bold text-slate-900 truncate" id="rm-preview-email-subject">件名プレビュー</div>
          </div>
          <div class="border border-slate-200 rounded-xl overflow-hidden bg-slate-50 max-h-[500px] overflow-y-auto">
            <iframe id="rm-email-preview-frame" class="w-full min-h-[420px] bg-white border-0"></iframe>
          </div>
        </div>

        <!-- LINEプレビューコンテナ -->
        <div id="rm-preview-container-line" style="display: none;">
          <div class="bg-[#7494c0] p-4 rounded-2xl min-h-[420px] max-h-[500px] overflow-y-auto font-sans text-xs">
            <div class="bg-white text-slate-900 rounded-2xl p-3.5 shadow-sm whitespace-pre-wrap leading-relaxed border border-slate-100 select-all" id="rm-preview-line-content">
              LINEプレビュー
            </div>
          </div>
          <div class="mt-3 text-center">
            <button type="button" onclick="copyReplacedLineReportText()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-2xs transition flex items-center justify-center gap-1.5 cursor-pointer">
              <i class="fa-regular fa-copy"></i>
              <span>LINE報告文をクリップボードにコピー</span>
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>

</div>
