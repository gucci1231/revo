<script>
  /* --- VIEW 2: Priority Follow Kanban & List View Controller --- */
  let currentPfGradeFilter = 'ALL';
  let currentPfActionFilter = 'ALL'; // 'ALL' | 'STAGNANT' | 'OVERDUE' | 'ACTIVE'
  let filteredPfVisitors = [];
  let pfCurrentPage = 1;
  const PF_PAGE_SIZE = 50;
  let selectedPfVisitorId = null;
  let pfViewMode = 'kanban'; // 'kanban' | 'list'
  let pfMobileActiveStage = 'stagnant'; // 'stagnant' | 'active' | 'applying-payment' | 'review'

  // モバイル用スワイプ追跡
  let pfTouchStartX = 0;
  let pfTouchEndX = 0;

  function togglePfViewMode(mode) {
    pfViewMode = mode;
    try {
      localStorage.setItem('pf_view_mode', mode);
    } catch(e) {}

    const btnKanban = document.getElementById('pf-mode-btn-kanban');
    const btnList = document.getElementById('pf-mode-btn-list');
    const kanbanContainer = document.getElementById('pf-kanban-container');
    const listContainer = document.getElementById('pf-list-container');

    if (mode === 'kanban') {
      if (btnKanban) btnKanban.classList.add('active');
      if (btnList) btnList.classList.remove('active');
      if (kanbanContainer) kanbanContainer.classList.remove('hidden');
      if (listContainer) listContainer.classList.add('hidden');
    } else {
      if (btnList) btnList.classList.add('active');
      if (btnKanban) btnKanban.classList.remove('active');
      if (listContainer) listContainer.classList.remove('hidden');
      if (kanbanContainer) kanbanContainer.classList.add('hidden');
    }
  }

  function setPriorityFollowMobileStage(stageKey) {
    pfMobileActiveStage = stageKey;

    // タブボタンのアクティブ更新
    const stages = ['stagnant', 'active', 'applying-payment', 'review'];
    stages.forEach(s => {
      const btn = document.getElementById(`pf-mobile-tab-${s}`);
      const col = document.getElementById(`pf-col-${s}`);
      if (btn) {
        if (s === stageKey) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
      if (col) {
        if (s === stageKey) {
          col.classList.add('is-mobile-active');
        } else {
          col.classList.remove('is-mobile-active');
        }
      }
    });
  }

  function setPriorityFollowGradeFilter(grade) {
    currentPfGradeFilter = grade;

    const btnAll = document.getElementById('pf-tab-all');
    const btnA = document.getElementById('pf-tab-a');
    const btnB = document.getElementById('pf-tab-b');

    const map = { 'ALL': btnAll, 'A': btnA, 'B': btnB };
    Object.keys(map).forEach(g => {
      const btn = map[g];
      if (btn) {
        if (g === grade) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    });

    filterPriorityFollowTable();
  }

  function setPriorityFollowActionFilter(actionStatus) {
    currentPfActionFilter = actionStatus;

    const btnAll = document.getElementById('pf-action-filter-all');
    const btnStagnant = document.getElementById('pf-action-filter-stagnant');
    const btnOverdue = document.getElementById('pf-action-filter-overdue');
    const btnActive = document.getElementById('pf-action-filter-active');

    const map = { 'ALL': btnAll, 'STAGNANT': btnStagnant, 'OVERDUE': btnOverdue, 'ACTIVE': btnActive };
    Object.keys(map).forEach(s => {
      const btn = map[s];
      if (btn) {
        if (s === actionStatus) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    });

    filterPriorityFollowTable();
  }

  function filterPriorityFollowTable() {
    const search = (document.getElementById('search-priority-follow-input')?.value || '').toLowerCase().trim();
    const rawList = cachedPriorityFollowList || [];
    const dedupedList = deduplicateVisitorListClient(rawList);

    // 感触A/Bかつ未入会・未クローズ・直近フォロー対象のベースリスト
    const basePfList = dedupedList.filter(v => {
      const isJoinedBool = (v.isJoined === '入会済' || v.isJoined === '済' || v.isJoined === '入会' || v.isJoined === true);
      const isClosed = (v.isJoined === '見送り' || v.isJoined === 'フォロー終了');
      const followType = typeof normalizeFollowType === 'function' ? normalizeFollowType(v.followType) : (v.followType || 'フォロー');
      const isFollowActive = (followType === 'フォロー' || followType === '直近フォロー');

      if (isJoinedBool || isClosed || !isFollowActive) return false;

      const feel = parseFeelAbc(v.feelAbc);
      const matchGrade = (currentPfGradeFilter === 'A' && feel === 'A') ||
                         (currentPfGradeFilter === 'B' && feel === 'B') ||
                         (currentPfGradeFilter === 'ALL' && (feel === 'A' || feel === 'B'));

      return matchGrade;
    });

    // カウンター集計 (ベースリストから算出)
    let stagnantCount = 0;
    let overdueCount = 0;
    let activeCount = 0;

    basePfList.forEach(v => {
      const pCount = Number(v.pendingActionCount) || 0;
      const oCount = Number(v.overdueActionCount) || 0;
      if (oCount > 0) {
        overdueCount++;
      } else if (pCount === 0) {
        stagnantCount++;
      } else {
        activeCount++;
      }
    });

    const elStagnant = document.getElementById('pf-count-stagnant');
    const elOverdue = document.getElementById('pf-count-overdue');
    const elActive = document.getElementById('pf-count-active');
    if (elStagnant) elStagnant.innerText = stagnantCount;
    if (elOverdue) elOverdue.innerText = overdueCount;
    if (elActive) elActive.innerText = activeCount;

    // アクション状況・キーワード検索で絞り込み
    filteredPfVisitors = basePfList.filter(v => {
      const pCount = Number(v.pendingActionCount) || 0;
      const oCount = Number(v.overdueActionCount) || 0;

      if (currentPfActionFilter === 'STAGNANT') {
        if (pCount > 0) return false;
      } else if (currentPfActionFilter === 'OVERDUE') {
        if (oCount === 0) return false;
      } else if (currentPfActionFilter === 'ACTIVE') {
        if (pCount === 0 || oCount > 0) return false;
      }

      if (!search) return true;

      const name = (v.name || '').toLowerCase();
      const company = (v.company || '').toLowerCase();
      const profession = (v.profession || '').toLowerCase();
      const inviter = (v.inviter || '').toLowerCase();
      const actionText = (v.nextActionText || '').toLowerCase();
      const assignee = (v.nextActionAssignee || '').toLowerCase();

      return name.includes(search) || company.includes(search) || profession.includes(search) || inviter.includes(search) || actionText.includes(search) || assignee.includes(search);
    });

    // ソート: 期限超過 (1) → 停滞・未設定 (2) → 進行中 (3)、同一グループ内は参加日降順
    filteredPfVisitors.sort((a, b) => {
      const getPriorityRank = (v) => {
        const p = Number(v.pendingActionCount) || 0;
        const o = Number(v.overdueActionCount) || 0;
        if (o > 0) return 1;
        if (p === 0) return 2;
        return 3;
      };

      const rankA = getPriorityRank(a);
      const rankB = getPriorityRank(b);
      if (rankA !== rankB) return rankA - rankB;

      const dateA = a.eventDate || '';
      const dateB = b.eventDate || '';
      return dateB.localeCompare(dateA);
    });

    pfCurrentPage = 1;
    renderPriorityFollowCurrentPage();
    renderPriorityFollowKanban(basePfList, search);
  }

  // ==========================================
  // 📌 カンバンボード レンダリング＆ドラッグ＆ドロップ
  // ==========================================
  function renderPriorityFollowKanban(sourceList, search) {
    const listToRender = (sourceList || []).filter(v => {
      if (!search) return true;
      const name = (v.name || '').toLowerCase();
      const company = (v.company || '').toLowerCase();
      const profession = (v.profession || '').toLowerCase();
      const inviter = (v.inviter || '').toLowerCase();
      const actionText = (v.nextActionText || '').toLowerCase();
      const assignee = (v.nextActionAssignee || '').toLowerCase();
      return name.includes(search) || company.includes(search) || profession.includes(search) || inviter.includes(search) || actionText.includes(search) || assignee.includes(search);
    });

    // 4ステージへの自動分類
    const stageItems = {
      'stagnant': [],           // ① 未設定
      'active': [],             // ② 進行中・超過
      'applying-payment': [],   // ③ 申込提出・入金待ち
      'review': []              // ④ 審査
    };

    listToRender.forEach(v => {
      const isJoined = v.isJoined || '未';
      const pendingCount = Number(v.pendingActionCount) || 0;

      if (isJoined === 'メンバーシップ審査') {
        stageItems['review'].push(v);
      } else if (isJoined === '申込書提出' || isJoined === '入金待ち') {
        stageItems['applying-payment'].push(v);
      } else if (pendingCount === 0) {
        stageItems['stagnant'].push(v);
      } else {
        stageItems['active'].push(v);
      }
    });

    // 各ステージ内ソート
    // activeステージ: 期限超過（overdueActionCount > 0）を最上位に、次に参加日降順
    stageItems['active'].sort((a, b) => {
      const oA = Number(a.overdueActionCount) || 0;
      const oB = Number(b.overdueActionCount) || 0;
      if (oA !== oB) return oB - oA;
      return (b.eventDate || '').localeCompare(a.eventDate || '');
    });

    ['stagnant', 'applying-payment', 'review'].forEach(key => {
      stageItems[key].sort((a, b) => (b.eventDate || '').localeCompare(a.eventDate || ''));
    });

    // カウントバッジ更新 (PC & Mobile)
    const stages = ['stagnant', 'active', 'applying-payment', 'review'];
    stages.forEach(key => {
      const count = stageItems[key].length;
      const pcCountEl = document.getElementById(`pf-kanban-count-${key}`);
      const mobCountEl = document.getElementById(`pf-mobile-count-${key}`);
      if (pcCountEl) pcCountEl.innerText = count;
      if (mobCountEl) mobCountEl.innerText = count;

      // カラム内カードリストを描画
      const container = document.getElementById(`pf-kanban-list-${key}`);
      if (!container) return;

      container.innerHTML = '';
      if (count === 0) {
        container.innerHTML = `
          <div class="pf-kanban-empty-placeholder">
            <i class="fa-solid fa-inbox text-slate-300 text-2xl"></i>
            <span>該当ビジターなし</span>
          </div>
        `;
        return;
      }

      stageItems[key].forEach(v => {
        const vid = String(v.id || v.visitorId);
        const feel = (v.feelAbc || '').toUpperCase().trim();
        const feelTag = feel ? renderRankBadgeHtml(feel) : '';
        const count = v.visitCount || (v.allIds && v.allIds.length) || 1;
        const repeatTag = count > 1 ? `<span style="font-size:10px; color:#d97706; background:#fef3c7; font-weight:800; padding:1px 5px; border-radius:4px; margin-left:4px;">${count}回</span>` : '';
        const elapsedText = formatPfElapsed(v.eventDate);

        const oCount = Number(v.overdueActionCount) || 0;
        const pCount = Number(v.pendingActionCount) || 0;
        const isOverdue = (oCount > 0);

        // 1. 次回アクション（未完了・進行中/超過）
        let nextActionBlockHtml = '';
        if (v.nextActionText) {
          const actionDateText = v.nextActionDueDate ? `<span class="tabular-nums font-bold ${isOverdue ? 'text-rose-600' : 'text-slate-500'}"><i class="fa-regular fa-clock mr-1"></i>${escapeHtml(v.nextActionDueDate)}</span>` : '';
          const assigneeText = v.nextActionAssignee ? `<span class="text-slate-500"><i class="fa-regular fa-user mr-1"></i>${escapeHtml(v.nextActionAssignee)}</span>` : '';

          nextActionBlockHtml = `
            <div class="p-2 bg-slate-50 rounded-lg border border-slate-100 mt-1">
              <div class="flex items-center justify-between gap-1 mb-1">
                <div class="flex items-center gap-1.5 text-[10px] font-bold text-slate-600 truncate">
                  ${renderActionTypeBadgeHtml(v.nextActionType)}
                </div>
                ${actionDateText}
              </div>
              <div class="text-xs font-semibold text-slate-800 line-clamp-2">${escapeHtml(v.nextActionText)}</div>
              ${assigneeText ? `<div class="text-[10px] text-right mt-1">${assigneeText}</div>` : ''}
            </div>
          `;
        }

        // 2. 最終アクション履歴（完了実績）
        let lastActionBlockHtml = '';
        if (v.lastActionText || v.lastActionReport) {
          const lastDate = v.lastActionDate ? formatActionDateSimple(v.lastActionDate) : '';
          const lastReporter = v.lastActionReporter ? `<span class="text-slate-400">(${escapeHtml(v.lastActionReporter)})</span>` : '';
          
          lastActionBlockHtml = `
            <div class="p-2 bg-emerald-50/40 rounded-lg border border-emerald-100/80 mt-1 text-[11px]">
              <div class="flex items-center justify-between gap-1 mb-1 text-[10px]">
                <span class="font-bold text-emerald-800 flex items-center gap-1">
                  <i class="fa-solid fa-circle-check text-emerald-600"></i>
                  <span>最終: ${escapeHtml(lastDate || '完了')}</span>
                </span>
                ${renderActionTypeBadgeHtml(v.lastActionType)}
              </div>
              ${v.lastActionText ? `<div class="font-medium text-slate-700 text-xs line-clamp-2">${escapeHtml(v.lastActionText)}</div>` : ''}
              ${v.lastActionReport ? `
                <div class="text-[10px] text-slate-600 bg-white/90 p-1.5 rounded mt-1 border border-emerald-100 line-clamp-2">
                  <i class="fa-regular fa-comment-dots text-emerald-500 mr-1"></i>${escapeHtml(v.lastActionReport)} ${lastReporter}
                </div>
              ` : ''}
            </div>
          `;
        }

        // 3. アクション表示エリアの結合
        let actionAreaHtml = '';
        if (nextActionBlockHtml && lastActionBlockHtml) {
          actionAreaHtml = nextActionBlockHtml + lastActionBlockHtml;
        } else if (nextActionBlockHtml) {
          actionAreaHtml = nextActionBlockHtml;
        } else if (lastActionBlockHtml) {
          actionAreaHtml = lastActionBlockHtml + `
            <div class="p-1.5 bg-slate-50 rounded-lg border border-dashed border-slate-200 mt-1 flex items-center justify-between text-slate-500 text-xs">
              <span class="font-bold flex items-center gap-1 text-[11px]"><i class="fa-solid fa-triangle-exclamation text-slate-400"></i> 次回未設定</span>
              <button type="button" class="btn-action-primary text-[10px] py-0.5 px-2 font-bold" onclick="event.stopPropagation(); openPfVisitorFullDetail('${vid}');">次回設定</button>
            </div>
          `;
        } else {
          actionAreaHtml = `
            <div class="p-2 bg-slate-50 rounded-lg border border-dashed border-slate-200 mt-1 flex items-center justify-between text-slate-500 text-xs">
              <span class="font-bold flex items-center gap-1"><i class="fa-solid fa-triangle-exclamation text-slate-400"></i> 放置</span>
              <button type="button" class="btn-action-primary text-[10px] py-0.5 px-2 font-bold" onclick="event.stopPropagation(); openPfVisitorFullDetail('${vid}');">アクション設定</button>
            </div>
          `;
        }

        // 入会ステータスセレクト
        const joinStatusSelectHtml = renderJoinedButtonHtml(vid, v.isJoined);

        const card = document.createElement('div');
        card.className = `pf-kanban-card ${isOverdue ? 'is-overdue-card' : ''}`;
        card.setAttribute('draggable', 'true');
        card.setAttribute('data-visitor-id', vid);
        card.setAttribute('data-stage', key);
        card.ondragstart = (e) => onPfCardDragStart(e, vid);
        card.onclick = () => openPfVisitorFullDetail(vid);

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-1.5 flex-1 min-w-0">
              ${feelTag}
              <div class="truncate font-bold text-sm text-slate-800 hover:text-blue-600">
                ${escapeHtml(v.name || '名称未設定')}
                ${repeatTag}
              </div>
            </div>
            <span class="text-[10px] text-slate-400 font-semibold shrink-0">${elapsedText}</span>
          </div>

          <div class="text-[11px] text-slate-500 font-medium truncate flex items-center gap-1">
            ${v.company ? `<span class="truncate">${escapeHtml(v.company)}</span>` : ''}
            ${v.profession ? `<span class="text-slate-400">/</span><span class="truncate">${escapeHtml(v.profession)}</span>` : ''}
          </div>

          ${v.inviter ? `<div class="text-[10px] text-slate-400 truncate"><i class="fa-solid fa-hand-holding-heart mr-1"></i>紹介: <span class="font-semibold text-slate-600">${escapeHtml(v.inviter)}</span></div>` : ''}

          ${actionAreaHtml}

          <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-100" onclick="event.stopPropagation()">
            <span class="text-[10px] font-bold text-slate-400">進捗</span>
            <div class="shrink-0">
              ${joinStatusSelectHtml}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    });

    // モバイルの初期アクティブステージ同期
    setPriorityFollowMobileStage(pfMobileActiveStage);
    initPfMobileSwipeEvents();
  }

  function formatActionDateSimple(raw) {
    if (!raw) return '';
    const clean = String(raw).split(' ')[0].replace(/-/g, '/');
    return clean;
  }

  function formatPfElapsed(eventDate) {
    if (!eventDate) return '';
    const clean = String(eventDate).replace(/\//g, '-').trim();
    const d = new Date(clean);
    if (isNaN(d.getTime())) return '';
    const now = new Date();
    now.setHours(0,0,0,0);
    const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diff = Math.floor((now.getTime() - target.getTime()) / (1000 * 60 * 60 * 24));
    if (diff === 0) return '本日参加';
    if (diff < 0) return '参加予定';
    return `${diff}日前`;
  }

  // ==========================================
  // 🖱️ カンバン ドラッグ＆ドロップ イベントハンドラー
  // ==========================================
  let draggedPfVisitorId = null;

  function onPfCardDragStart(e, vid) {
    draggedPfVisitorId = String(vid);
    if (e.dataTransfer) {
      e.dataTransfer.setData('text/plain', vid);
      e.dataTransfer.effectAllowed = 'move';
    }
    e.currentTarget.classList.add('is-dragging');
  }

  function onPfColumnDragOver(e) {
    e.preventDefault();
    if (e.dataTransfer) {
      e.dataTransfer.dropEffect = 'move';
    }
    const col = e.currentTarget;
    if (col && !col.classList.contains('drag-over')) {
      col.classList.add('drag-over');
    }
  }

  function onPfColumnDragLeave(e) {
    const col = e.currentTarget;
    if (col) {
      col.classList.remove('drag-over');
    }
  }

  function onPfColumnDrop(e, targetStage) {
    e.preventDefault();
    const col = e.currentTarget;
    if (col) {
      col.classList.remove('drag-over');
    }
    document.querySelectorAll('.pf-kanban-card.is-dragging').forEach(el => el.classList.remove('is-dragging'));

    const vid = e.dataTransfer ? (e.dataTransfer.getData('text/plain') || draggedPfVisitorId) : draggedPfVisitorId;
    if (!vid) return;

    // ステージ移動に応じた入会ステータス更新マッピング
    const stageStatusMap = {
      'stagnant': '未',
      'active': '検討中',
      'applying-payment': '申込書提出',
      'review': 'メンバーシップ審査'
    };

    const newStatus = stageStatusMap[targetStage];
    if (newStatus && typeof changeVisitorStatus === 'function') {
      changeVisitorStatus(vid, 'isJoined', newStatus);
    }
  }

  // ==========================================
  // 📱 モバイル スワイプイベント登録
  // ==========================================
  function initPfMobileSwipeEvents() {
    const board = document.getElementById('pf-kanban-board');
    if (!board || board._swipeInitialized) return;
    board._swipeInitialized = true;

    board.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length === 1) {
        pfTouchStartX = e.touches[0].clientX;
      }
    }, { passive: true });

    board.addEventListener('touchend', (e) => {
      if (e.changedTouches && e.changedTouches.length === 1) {
        pfTouchEndX = e.changedTouches[0].clientX;
        handlePfSwipe();
      }
    }, { passive: true });
  }

  function handlePfSwipe() {
    const swipeThreshold = 50;
    const diff = pfTouchStartX - pfTouchEndX;
    const stages = ['stagnant', 'active', 'applying-payment', 'review'];
    const currentIndex = stages.indexOf(pfMobileActiveStage);
    if (currentIndex === -1) return;

    if (diff > swipeThreshold) {
      // 左スワイプ ➜ 次のステージ
      if (currentIndex < stages.length - 1) {
        setPriorityFollowMobileStage(stages[currentIndex + 1]);
      }
    } else if (diff < -swipeThreshold) {
      // 右スワイプ ➜ 前のステージ
      if (currentIndex > 0) {
        setPriorityFollowMobileStage(stages[currentIndex - 1]);
      }
    }
  }


  function changePriorityFollowPage(delta) {
    const totalPages = Math.ceil(filteredPfVisitors.length / PF_PAGE_SIZE) || 1;
    const newPage = pfCurrentPage + delta;
    if (newPage >= 1 && newPage <= totalPages) {
      pfCurrentPage = newPage;
      renderPriorityFollowCurrentPage();
    }
  }

  function selectPriorityFollowVisitor(vid) {
    selectedPfVisitorId = String(vid);
    
    // ハイライト更新
    document.querySelectorAll('.pf-visitor-item').forEach(el => {
      if (el.getAttribute('data-visitor-id') === selectedPfVisitorId) {
        el.classList.add('is-selected');
      } else {
        el.classList.remove('is-selected');
      }
    });

    // 右側詳細パネルを描画
    renderPfDetailPanel(selectedPfVisitorId);

    // スマホ画面（幅1024px未満）の場合は全画面カルテビューへ直接遷移
    if (window.innerWidth < 1024) {
      openPfVisitorFullDetail(selectedPfVisitorId);
    }
  }

  function openPfVisitorFullDetail(vid) {
    currentVisitorNavList = filteredPfVisitors;
    openVisitorDetailView(vid);
  }

  function renderPriorityFollowCurrentPage() {
    const listContainer = document.getElementById('pf-visitor-list');
    const infoEl = document.getElementById('pf-pagination-info');
    const prevBtn = document.getElementById('btn-pf-prev-page');
    const nextBtn = document.getElementById('btn-pf-next-page');
    const pageNumEl = document.getElementById('pf-pagination-page-num');
    const totalBadge = document.getElementById('pf-total-badge');

    if (listContainer) listContainer.innerHTML = '';

    const total = filteredPfVisitors.length;
    if (totalBadge) totalBadge.innerText = `${total}`;

    const totalPages = Math.ceil(total / PF_PAGE_SIZE) || 1;
    if (pfCurrentPage > totalPages) pfCurrentPage = totalPages;

    const startIdx = (pfCurrentPage - 1) * PF_PAGE_SIZE;
    const pageItems = filteredPfVisitors.slice(startIdx, startIdx + PF_PAGE_SIZE);

    if (infoEl) infoEl.innerText = `全 ${total} 件中 ${total > 0 ? startIdx + 1 : 0} - ${Math.min(startIdx + PF_PAGE_SIZE, total)} 件`;
    if (pageNumEl) pageNumEl.innerText = `${pfCurrentPage} / ${totalPages}`;
    if (prevBtn) prevBtn.disabled = (pfCurrentPage <= 1);
    if (nextBtn) nextBtn.disabled = (pfCurrentPage >= totalPages);

    if (pageItems.length === 0) {
      if (listContainer) {
        listContainer.innerHTML = `
          <div style="text-align: center; color: #868e96; padding: 48px 16px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1; margin: 12px;">
            <i class="fa-solid fa-filter-circle-xmark text-3xl text-slate-300 mb-2"></i>

                <div class="bg-slate-50/90 p-3 rounded-xl border border-slate-200/70 space-y-0.5">
                  <span class="text-[10px] font-black text-slate-400 uppercase tracking-wide block">Q6. 懸念点</span>
                  <span class="text-slate-800 font-bold block leading-relaxed">${escapeAndLinkify(h.q6 || '-', true)}</span>
                </div>
              </div>
            </div>

          </div>
        `;

        // デフォルト期日（3日後）をフォームにセット
        const dateInput = document.getElementById('pf-ap-date-input');
        if (dateInput) {
          const d = new Date();
          d.setDate(d.getDate() + 3);
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          dateInput.value = `${yyyy}-${mm}-${dd}`;
        }
      })
      .catch(err => {
        container.innerHTML = `
          <div class="section-card p-8 text-center text-slate-400">
            <p class="text-xs text-red-500 font-bold">読み込みエラー: ${escapeHtml(err.message || 'データ取得に失敗しました')}</p>
          </div>
        `;
      });
  }

  /* --- 🎯 Priority Follow Action Plan Helpers --- */
  function setPfApTextQuick(text) {
    const input = document.getElementById('pf-ap-text-input');
    if (input) {
      input.value = text;
      input.focus();
    }
  }

  function togglePfAddActionForm() {
    const form = document.getElementById('pf-quick-ap-form');
    if (!form) return;
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
    if (form.style.display === 'block') {
      const input = document.getElementById('pf-ap-text-input');
      if (input) input.focus();
    }
  }

  function savePfNewActionPlan(vid) {
    const textInput = document.getElementById('pf-ap-text-input');
    const assigneeInput = document.getElementById('pf-ap-assignee-input');
    const dateInput = document.getElementById('pf-ap-date-input');

    const actionText = textInput ? textInput.value.trim() : '';
    const assigneeName = assigneeInput ? assigneeInput.value.trim() : '';
    const dueDate = dateInput ? dateInput.value : '';

    if (!actionText) {
      showToast('アクション内容を入力してください');
      return;
    }

    const payload = {
      visitor_id: vid,
      action_text: actionText,
      assignee_name: assigneeName,
      due_date: dueDate
    };

    ApiService.call('createActionPlanApi', payload)
      .then(res => {
        if (res && res.success) {
          showToast('アクションプランを追加しました');
          renderPfDetailPanel(vid);
        } else {
          showToast('追加に失敗しました: ' + (res.message || 'エラー'));
        }
      })
      .catch(handleError);
  }

  function togglePfActionPlan(apId, vid, isCompleted) {
    const payload = {
      id: apId,
      is_completed: isCompleted,
      completed_by: (typeof currentLoginUser !== 'undefined' && currentLoginUser) ? currentLoginUser : 'ユーザー'
    };

    ApiService.call('updateActionPlanApi', payload)
      .then(res => {
        if (res && res.success) {
          if (isCompleted && typeof triggerActionClearCelebration === 'function') {
            triggerActionClearCelebration();
          } else {
            showToast(isCompleted ? 'アクションを完了にしました！' : '未完了に戻しました');
          }
          renderPfDetailPanel(vid);
          if (typeof fetchDashboardData === 'function') {
            fetchDashboardData(false);
          }
        } else {
          showToast('更新に失敗しました: ' + (res.message || 'エラー'));
        }
      })
      .catch(handleError);
  }

  // 初期ビューモードの復元
  document.addEventListener('DOMContentLoaded', () => {
    try {
      const savedMode = localStorage.getItem('pf_view_mode');
      if (savedMode && (savedMode === 'kanban' || savedMode === 'list')) {
        togglePfViewMode(savedMode);
      }
    } catch (e) {}
  });
</script>
