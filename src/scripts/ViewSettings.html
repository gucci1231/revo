<script>
  /* --- VIEW 5: Settings & KPI Goals Controller --- */
  let cachedGoalsData = null;
  let currentSelectedGoalMonth = '';

  function fetchGoalsSettings(forceRefresh = false) {
    if (typeof ApiService === 'undefined') return;

    ApiService.call('getGoalsApi', [])
      .then(res => {
        if (!res || !res.success) return;
        cachedGoalsData = res;
        renderGoalsSettings(res);
      })
      .catch(err => {
        console.error('Failed to fetch goals settings:', err);
      });
  }

  function renderGoalsSettings(data) {
    if (!data) return;

    const def = data.defaultGoals || { target_joined: 2, target_visitors_weekly: 4, target_join_rate: 25.0, target_hearing_rate: 100.0 };
    const defJoinedEl = document.getElementById('setting-def-goal-joined');
    const defVisitorsEl = document.getElementById('setting-def-goal-visitors');
    const defJoinRateEl = document.getElementById('setting-def-goal-join-rate');
    const defHearingRateEl = document.getElementById('setting-def-goal-hearing-rate');

    if (defJoinedEl) defJoinedEl.value = def.target_joined !== undefined ? def.target_joined : 2;
    if (defVisitorsEl) defVisitorsEl.value = def.target_visitors_weekly !== undefined ? def.target_visitors_weekly : 4;
    if (defJoinRateEl) defJoinRateEl.value = def.target_join_rate !== undefined ? def.target_join_rate : 25.0;
    if (defHearingRateEl) defHearingRateEl.value = def.target_hearing_rate !== undefined ? def.target_hearing_rate : 100.0;

    // 月選択セレクトの構築
    const selectEl = document.getElementById('setting-month-goal-select');
    if (selectEl) {
      const monthsPreview = data.monthsPreview || [];
      const currentMonth = data.currentMonth || new Date().toISOString().substring(0, 7).replace('-', '/');
      if (!currentSelectedGoalMonth || !monthsPreview.some(m => m.month === currentSelectedGoalMonth)) {
        currentSelectedGoalMonth = currentMonth;
      }

      selectEl.innerHTML = '';
      monthsPreview.forEach(mObj => {
        const opt = document.createElement('option');
        opt.value = mObj.month;
        let suffix = '';
        if (mObj.is_custom) {
          suffix = ' (個別設定)';
        } else if (mObj.source === 'inherited') {
          suffix = ` (引継: ${mObj.inherited_from})`;
        }
        opt.text = `${mObj.month}${suffix}`;
        if (mObj.month === currentSelectedGoalMonth) {
          opt.selected = true;
        }
        selectEl.appendChild(opt);
      });
    }

    onGoalMonthSelected(currentSelectedGoalMonth);
    renderMonthlyGoalsPreviewTable(data.monthsPreview || []);
  }

  function onGoalMonthSelected(monthStr) {
    if (!monthStr || !cachedGoalsData) return;
    currentSelectedGoalMonth = monthStr;

    const monthsPreview = cachedGoalsData.monthsPreview || [];
    const monthlyMap = cachedGoalsData.monthlyMap || {};
    const defaultGoals = cachedGoalsData.defaultGoals || {};

    let targetObj = monthsPreview.find(m => m.month === monthStr);
    if (!targetObj) {
      if (monthlyMap[monthStr]) {
        targetObj = { ...monthlyMap[monthStr], month: monthStr, is_custom: true, source: 'custom' };
      } else {
        targetObj = { ...defaultGoals, month: monthStr, is_custom: false, source: 'default' };
      }
    }

    const titleEl = document.getElementById('setting-selected-month-title');
    const badgeEl = document.getElementById('setting-month-source-badge');
    const resetBtn = document.getElementById('btn-reset-monthly-goal');
    const saveBtnLabel = document.getElementById('btn-save-monthly-goal-label');

    const mJoinedEl = document.getElementById('setting-month-goal-joined');
    const mVisitorsEl = document.getElementById('setting-month-goal-visitors');

    if (titleEl) titleEl.innerText = `${monthStr} 目標設定`;

    if (mJoinedEl) mJoinedEl.value = targetObj.target_joined !== undefined ? targetObj.target_joined : 2;
    if (mVisitorsEl) mVisitorsEl.value = targetObj.target_visitors_weekly !== undefined ? targetObj.target_visitors_weekly : 4;

    if (badgeEl) {
      if (targetObj.is_custom) {
        badgeEl.className = 'inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-blue-100 text-blue-800';
        badgeEl.innerText = '個別設定中';
      } else if (targetObj.source === 'inherited') {
        badgeEl.className = 'inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-amber-100 text-amber-800';
        badgeEl.innerText = `${targetObj.inherited_from} より引き継ぎ中`;
      } else {
        badgeEl.className = 'inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-slate-100 text-slate-600';
        badgeEl.innerText = '基本目標を適用中';
      }
    }

    if (resetBtn) {
      if (targetObj.is_custom) {
        resetBtn.classList.remove('hidden');
      } else {
        resetBtn.classList.add('hidden');
      }
    }

    if (saveBtnLabel) {
      saveBtnLabel.innerText = `${monthStr} の目標を保存`;
    }
  }

  function renderMonthlyGoalsPreviewTable(previewList) {
    const tbody = document.getElementById('table-monthly-goals-preview');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (!previewList || previewList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-slate-400 py-3">データがありません</td></tr>';
      return;
    }

    previewList.forEach(mObj => {
      const tr = document.createElement('tr');
      let typeBadge = '';
      if (mObj.is_custom) {
        typeBadge = '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800">個別設定</span>';
      } else if (mObj.source === 'inherited') {
        typeBadge = `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800" title="${mObj.inherited_from}の設定を自動引き継ぎ">引継 (${mObj.inherited_from})</span>`;
      } else {
        typeBadge = '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-600">基本目標</span>';
      }

      tr.innerHTML = `
        <td class="font-bold">${mObj.month}</td>
        <td class="text-center font-bold text-slate-800">${mObj.target_joined || 0}名</td>
        <td class="text-center font-bold text-blue-600">${mObj.target_visitors_weekly || 0}名/週</td>
        <td class="text-center">${typeBadge}</td>
        <td class="text-center">
          <button type="button" class="btn-action-secondary text-xs px-2 py-0.5" onclick="selectGoalMonthFromTable('${mObj.month}')">
            編集
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function selectGoalMonthFromTable(monthStr) {
    const selectEl = document.getElementById('setting-month-goal-select');
    if (selectEl) {
      selectEl.value = monthStr;
    }
    onGoalMonthSelected(monthStr);
    const targetCard = document.getElementById('setting-selected-month-title');
    if (targetCard) {
      targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function saveDefaultGoalsSetting() {
    const defJoined = Number(document.getElementById('setting-def-goal-joined').value) || 2;
    const defVisitors = Number(document.getElementById('setting-def-goal-visitors').value) || 4;
    const defJoinRate = Number(document.getElementById('setting-def-goal-join-rate').value) || 25.0;
    const defHearingRate = Number(document.getElementById('setting-def-goal-hearing-rate').value) || 100.0;

    const payload = {
      target_joined: defJoined,
      target_visitors_weekly: defVisitors,
      target_join_rate: defJoinRate,
      target_hearing_rate: defHearingRate
    };

    showToast('基本目標を保存中...');
    ApiService.call('saveDefaultGoalsApi', payload)
      .then(res => {
        if (res && res.success) {
          showToast('基本目標を保存しました！');
          fetchGoalsSettings(true);
          if (typeof fetchDashboardData === 'function') fetchDashboardData(true);
        } else {
          showToast('保存に失敗しました', 'error');
        }
      })
      .catch(err => {
        console.error(err);
        showToast('通信エラーが発生しました', 'error');
      });
  }

  function saveMonthlyGoalSetting() {
    if (!currentSelectedGoalMonth) return;

    const mJoined = Number(document.getElementById('setting-month-goal-joined').value) || 2;
    const mVisitors = Number(document.getElementById('setting-month-goal-visitors').value) || 4;

    const payload = {
      target_joined: mJoined,
      target_visitors_weekly: mVisitors
    };

    showToast(`${currentSelectedGoalMonth} の目標を保存中...`);
    ApiService.call('saveMonthlyGoalApi', currentSelectedGoalMonth, payload)
      .then(res => {
        if (res && res.success) {
          showToast(`${currentSelectedGoalMonth} の目標を保存しました！以後の月にも自動引き継ぎされます。`);
          fetchGoalsSettings(true);
          if (typeof fetchDashboardData === 'function') fetchDashboardData(true);
        } else {
          showToast('保存に失敗しました', 'error');
        }
      })
      .catch(err => {
        console.error(err);
        showToast('通信エラーが発生しました', 'error');
      });
  }

  function resetMonthlyGoalSetting() {
    if (!currentSelectedGoalMonth) return;
    if (!confirm(`${currentSelectedGoalMonth} の個別設定を削除し、前月の設定（または基本目標）の自動引き継ぎに戻しますか？`)) {
      return;
    }

    showToast(`${currentSelectedGoalMonth} の個別設定を削除中...`);
    ApiService.call('deleteMonthlyGoalApi', currentSelectedGoalMonth)
      .then(res => {
        if (res && res.success) {
          showToast(`${currentSelectedGoalMonth} を前月引き継ぎに戻しました。`);
          fetchGoalsSettings(true);
          if (typeof fetchDashboardData === 'function') fetchDashboardData(true);
        } else {
          showToast('削除に失敗しました', 'error');
        }
      })
      .catch(err => {
        console.error(err);
        showToast('通信エラーが発生しました', 'error');
      });
  }

  // タブ切り替え時または初期ロード時のフック
  document.addEventListener('DOMContentLoaded', () => {
    fetchGoalsSettings();
  });
</script>
