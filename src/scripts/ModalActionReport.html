<script>
  /* --- Modal Action Report Controller --- */
  let currentReportingPlan = null;

  function openActionReportModal(planId, optVisitorId) {
    let plan = null;
    if (typeof currentDashboardActionPlans !== 'undefined' && Array.isArray(currentDashboardActionPlans)) {
      plan = currentDashboardActionPlans.find(p => p.id === planId);
    }
    if (!plan && typeof currentVisitorActionPlans !== 'undefined' && Array.isArray(currentVisitorActionPlans)) {
      plan = currentVisitorActionPlans.find(p => p.id === planId);
    }

    if (!plan) {
      // Fallback
      plan = {
        id: planId,
        visitor_id: optVisitorId || '',
        action_text: '',
        assignee_name: '',
        due_date: '',
        report_text: '',
        reporter_name: '',
        is_completed: 0
      };
    }

    currentReportingPlan = plan;

    document.getElementById('report-ap-id').value = plan.id;
    document.getElementById('report-ap-visitor-id').value = plan.visitor_id || optVisitorId || '';
    document.getElementById('report-ap-visitor-name').innerText = plan.visitor_name ? `${plan.visitor_name} 様` : (plan.visitor_id ? `ビジター No.${plan.visitor_id}` : '対象ビジター');
    const resolvedAssignee = resolveMemberName(plan.assignee_name);
    document.getElementById('report-ap-assignee').innerText = resolvedAssignee || '担当者未設定';
    document.getElementById('report-ap-action-text').innerHTML = plan.action_text ? escapeAndLinkify(plan.action_text, true) : '-';

    const dueBadge = document.getElementById('report-ap-due-badge');
    if (dueBadge) {
      dueBadge.innerText = plan.due_date ? `期日: ${formatShortDate(plan.due_date)}` : '期日未設定';
      const todayStr = new Date().toISOString().slice(0, 10);
      if (plan.due_date && plan.due_date < todayStr && Number(plan.is_completed) === 0) {
        dueBadge.classList.add('overdue');
      } else {
        dueBadge.classList.remove('overdue');
      }
    }

    document.getElementById('report-ap-text').value = plan.report_text || '';
    document.getElementById('report-ap-reporter').value = plan.reporter_name || resolvedAssignee || '';

    const isCompCheckbox = document.getElementById('report-ap-is-completed');
    if (isCompCheckbox) {
      isCompCheckbox.checked = true; // Default to completed when submitting report
      updateReportCompletedLabel();
    }

    const modal = document.getElementById('modal-action-report');
    if (modal) modal.style.display = 'flex';
  }

  function closeActionReportModal() {
    const modal = document.getElementById('modal-action-report');
    if (modal) modal.style.display = 'none';
    currentReportingPlan = null;
  }

  function updateReportCompletedLabel() {
    const isComp = document.getElementById('report-ap-is-completed').checked;
    const label = document.getElementById('report-ap-completed-label');
    const saveBtn = document.getElementById('btn-save-action-report');
    if (label) {
      label.innerText = isComp ? '完了にする（達成）' : '途中経過として保存（未完了）';
    }
    if (saveBtn) {
      saveBtn.innerHTML = isComp ? '<i class="fa-solid fa-check"></i> 報告を保存して完了' : '<i class="fa-solid fa-floppy-disk"></i> 途中経過を保存';
    }
  }

  function submitActionReport() {
    const id = document.getElementById('report-ap-id').value;
    const visitorId = document.getElementById('report-ap-visitor-id').value;
    const rawReporter = document.getElementById('report-ap-reporter').value.trim();
    const reporterName = resolveMemberName(rawReporter);
    const isCompleted = document.getElementById('report-ap-is-completed').checked ? 1 : 0;

    if (!reportText) {
      alert('実施結果・報告内容を入力してください');
      document.getElementById('report-ap-text').focus();
      return;
    }

    showToast('報告を保存中...');
    ApiService.call('reportActionPlanApi', {
      id: id,
      reportText: reportText,
      reporterName: reporterName,
      isCompleted: isCompleted
    })
      .then(res => {
        if (res && res.success) {
          const vName = document.getElementById('report-ap-visitor-name')?.innerText || '';
          const actionTxt = document.getElementById('report-ap-action-text')?.innerText || '';
          const reporterOrAssignee = reporterName || document.getElementById('report-ap-assignee')?.innerText || '';

          closeActionReportModal();

          if (isCompleted === 1 && window.CelebrationEffect) {
            const actorGreeting = reporterOrAssignee && reporterOrAssignee !== '-' && reporterOrAssignee !== '担当者未設定'
              ? `${reporterOrAssignee}さん、ナイスアクション！`
              : 'ナイスアクション！目標達成！';
            
            const detailSnippet = vName && vName !== '-'
              ? `${vName} へのフォローを達成`
              : (actionTxt && actionTxt !== '-' ? actionTxt : 'アクションを完了しました');

            CelebrationEffect.triggerQuestClear({
              title: 'QUEST CLEAR !',
              subtitle: actorGreeting,
              detail: detailSnippet,
              badgeText: 'ACTION COMPLETED ✨',
              onClose: () => {
                if (typeof refreshCurrentActiveView === 'function') {
                  refreshCurrentActiveView();
                }
              }
            });
          } else {
            showToast('💾 途中経過を保存しました');
            if (typeof refreshCurrentActiveView === 'function') {
              refreshCurrentActiveView();
            }
          }
        } else {
          showToast(res && res.message ? res.message : '保存に失敗しました');
        }
      })
      .catch(handleError);
  }

  function shareCurrentReportingPlan(event) {
    if (currentReportingPlan && currentReportingPlan.id) {
      shareActionPlan(currentReportingPlan.id, currentReportingPlan.visitor_id, event);
    } else {
      const id = document.getElementById('report-ap-id').value;
      const vId = document.getElementById('report-ap-visitor-id').value;
      if (id) shareActionPlan(id, vId, event);
    }
  }

  function shareActionPlan(planId, optVisitorId, event) {
    if (event) {
      if (typeof event.stopPropagation === 'function') event.stopPropagation();
      if (typeof event.preventDefault === 'function') event.preventDefault();
    }

    let plan = null;
    if (typeof currentDashboardActionPlans !== 'undefined' && Array.isArray(currentDashboardActionPlans)) {
      plan = currentDashboardActionPlans.find(p => p.id === planId);
    }
    if (!plan && typeof currentVisitorActionPlans !== 'undefined' && Array.isArray(currentVisitorActionPlans)) {
      plan = currentVisitorActionPlans.find(p => p.id === planId);
    }
    if (!plan && currentReportingPlan && currentReportingPlan.id === planId) {
      plan = currentReportingPlan;
    }

    const doShareWithPlan = (p) => {
      const shareUrl = `${window.location.origin}${window.location.pathname}#action/${p.id}`;
      const visitorName = p.visitor_name || (p.visitor_id ? `ビジター No.${p.visitor_id}` : '対象ビジター');
      const companyPart = p.visitor_company ? ` (${p.visitor_company})` : '';
      const assigneePart = p.assignee_name || '担当未定';
      const duePart = p.due_date || '期日未定';

      const shareText = `【REvo アクション共有・報告依頼】\n` +
        `以下のアクションについて\n こちらから報告書を提出して下さい\n` +
        `${shareUrl}\n\n` +
        `👤 対象: ${visitorName}${companyPart}\n` +
        `📅 期日: ${duePart} / 担当: ${assigneePart}\n` +
        `🎯 アクション内容:\n${p.action_text}`;

      if (navigator.share && /mobile|android|iphone|ipad/i.test(navigator.userAgent)) {
        navigator.share({
          title: `【REvo】アクション共有: ${visitorName}`,
          text: shareText
        }).catch(() => {
          copyTextToClipboard(shareText, '✅ 共有用メッセージとURLをコピーしました！');
        });
      } else {
        copyTextToClipboard(shareText, '✅ 共有用メッセージとURLをコピーしました！');
      }
    };

    if (plan && plan.action_text) {
      doShareWithPlan(plan);
    } else {
      showToast('アクション情報を取得中...');
      ApiService.call('getActionPlanDetailApi', planId)
        .then(res => {
          if (res && res.success && res.item) {
            doShareWithPlan(res.item);
          } else {
            const fallbackUrl = `${window.location.origin}${window.location.pathname}#action/${planId}`;
            copyTextToClipboard(fallbackUrl, '✅ 共有URLをコピーしました！');
          }
        })
        .catch(() => {
          const fallbackUrl = `${window.location.origin}${window.location.pathname}#action/${planId}`;
          copyTextToClipboard(fallbackUrl, '✅ 共有URLをコピーしました！');
        });
    }
  }

  function copyTextToClipboard(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(successMsg || '✅ コピーしました！');
      }).catch(() => {
        fallbackCopyText(text, successMsg);
      });
    } else {
      fallbackCopyText(text, successMsg);
    }
  }

  function fallbackCopyText(text, successMsg) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.left = '-999999px';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      showToast(successMsg || '✅ コピーしました！');
    } catch (err) {
      prompt('以下のURLをコピーしてください:', text);
    }
    document.body.removeChild(textArea);
  }

  function openActionReportDirectly(apId) {
    showToast('アクションプランを読込中...');
    ApiService.call('getActionPlanDetailApi', apId)
      .then(res => {
        if (res && res.success && res.item) {
          const item = res.item;
          if (typeof currentDashboardActionPlans !== 'undefined') {
            const existingIdx = currentDashboardActionPlans.findIndex(p => p.id === item.id);
            if (existingIdx >= 0) {
              currentDashboardActionPlans[existingIdx] = item;
            } else {
              currentDashboardActionPlans.push(item);
            }
          }
          openActionReportModal(item.id, item.visitor_id);
        } else {
          showToast('該当のアクションプランが見つかりませんでした');
        }
      })
      .catch(handleError);
  }
</script>
