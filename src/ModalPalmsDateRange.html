<!-- GA4-Style Date Range Modal (Center-aligned Full Screen Modal) -->
<div id="modal-palms-date-range" class="fixed inset-0 z-[9999] flex items-center justify-center p-3 sm:p-4 bg-slate-900/50 backdrop-blur-xs hidden transition-all duration-200" style="z-index: 9999;" role="dialog" aria-modal="true" aria-labelledby="palms-date-modal-title">
  <div class="fixed inset-0 cursor-pointer" onclick="closePalmsDateModal()"></div>
  <div class="relative bg-white rounded-2xl sm:rounded-3xl shadow-2xl border border-slate-200/90 w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden z-10 animate-scale-in my-auto mx-auto">
    
    <!-- Modal Header (Fixed) -->
    <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
      <div class="flex items-center gap-2">
        <i class="fa-regular fa-calendar text-blue-600 text-sm"></i>
        <h3 id="palms-date-modal-title" class="text-sm sm:text-base font-black text-slate-900 tracking-tight">
          期間の選択
        </h3>
      </div>
      <button type="button" onclick="closePalmsDateModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition-colors cursor-pointer" title="閉じる">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- Modal Body (Scrollable, Flex Row) -->
    <div class="flex-1 min-h-0 flex flex-col md:flex-row divide-y md:divide-y-0 md:divide-x divide-slate-100 overflow-y-auto">
      <!-- Preset Sidebar (1-Month Unit & Terms) -->
      <div class="w-full md:w-52 bg-slate-50/70 p-3 sm:p-4 flex md:flex-col gap-1 overflow-x-auto md:overflow-y-auto shrink-0 text-xs font-semibold" id="palms-modal-sidebar">
        <div class="text-3xs font-bold text-slate-400 px-3 py-1 uppercase tracking-wider hidden md:block">月別（1ヶ月単位）</div>
        <button type="button" onclick="selectPalmsDatePreset('1month')" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="1month">
          <span>先月 (9月)</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>
        <button type="button" onclick="selectPalmsDatePreset('2months')" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="2months">
          <span>先々月 (8月)</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>
        <button type="button" onclick="selectPalmsDatePreset('3months')" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="3months">
          <span>7月 (2026/07)</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>
        <button type="button" onclick="selectPalmsDatePreset('month_6')" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="month_6">
          <span>6月 (2026/06)</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>
        <button type="button" onclick="selectPalmsDatePreset('month_5')" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="month_5">
          <span>5月 (2026/05)</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>
        <button type="button" onclick="selectPalmsDatePreset('month_4')" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="month_4">
          <span>4月 (2026/04)</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>

        <div class="hidden md:block my-1.5 border-t border-slate-200/70"></div>
        <div class="text-3xs font-bold text-slate-400 px-3 py-1 uppercase tracking-wider hidden md:block">期別・通算</div>
        <button type="button" onclick="selectPalmsDatePreset('term_2months')" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="term_2months">
          <span>2ヶ月</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>
        <button type="button" onclick="selectPalmsDatePreset('term_3months')" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="term_3months">
          <span>3ヶ月</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>
        <button type="button" onclick="selectPalmsDatePreset('6months')" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="6months">
          <span>半年 (直近期)</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>
        <button type="button" onclick="selectPalmsDatePreset('all')" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="all">
          <span>全期間 (通算)</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>

        <div class="hidden md:block my-1.5 border-t border-slate-200/70"></div>
        <button type="button" onclick="selectPalmsDatePreset('custom', false)" class="palms-preset-item w-full text-left px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-200/60 transition-all flex items-center justify-between cursor-pointer" data-preset-key="custom">
          <span>カスタム範囲</span>
          <i class="fa-solid fa-check text-blue-600 text-2xs hidden check-icon"></i>
        </button>
      </div>

      <!-- Main Content Area: Tab Selectors & Calendar -->
      <div class="flex-1 p-4 sm:p-5 overflow-y-auto bg-white flex flex-col gap-3.5">
        <!-- Interactive Start / End Date Selector Tabs -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
          <div class="flex items-center gap-2 flex-wrap">
            <!-- Start Date Tab -->
            <div id="palms-picker-tab-start" onclick="setPalmsPickerActiveField('start')" class="group flex items-center gap-2 px-3 py-1.5 rounded-xl border-2 border-blue-600 bg-blue-50/80 text-blue-900 transition-all cursor-pointer shadow-2xs">
              <div class="flex flex-col">
                <span class="text-3xs uppercase tracking-wider font-black text-blue-600">開始日</span>
                <div class="flex items-center gap-1.5 mt-0.5">
                  <span id="palms-modal-start-display" class="sr-only">--/--/--</span>
                  <input type="date" id="palms-modal-start" onchange="onPalmsModalInputChange()" onclick="event.stopPropagation(); setPalmsPickerActiveField('start');" class="text-xs sm:text-sm font-black text-slate-900 bg-white/90 border border-slate-200 rounded-lg px-2 py-0.5 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer">
                </div>
              </div>
              <i class="fa-regular fa-calendar text-xs text-blue-600 shrink-0 ml-1"></i>
            </div>

            <i class="fa-solid fa-arrow-right text-slate-300 text-2xs"></i>

            <!-- End Date Tab -->
            <div id="palms-picker-tab-end" onclick="setPalmsPickerActiveField('end')" class="group flex items-center gap-2 px-3 py-1.5 rounded-xl border border-slate-200 bg-white hover:border-slate-300 text-slate-700 transition-all cursor-pointer shadow-2xs">
              <div class="flex flex-col">
                <span class="text-3xs uppercase tracking-wider font-bold text-slate-400">終了日</span>
                <div class="flex items-center gap-1.5 mt-0.5">
                  <span id="palms-modal-end-display" class="sr-only">--/--/--</span>
                  <input type="date" id="palms-modal-end" onchange="onPalmsModalInputChange()" onclick="event.stopPropagation(); setPalmsPickerActiveField('end');" class="text-xs sm:text-sm font-black text-slate-900 bg-white/90 border border-slate-200 rounded-lg px-2 py-0.5 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer">
                </div>
              </div>
              <i class="fa-regular fa-calendar text-xs text-slate-400 shrink-0 ml-1"></i>
            </div>
          </div>

          <!-- Status Guide Badge & Duration -->
          <div class="flex items-center gap-2 self-start sm:self-auto flex-wrap">
            <span id="palms-picker-guide-badge" class="text-3xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-100 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-pulse"></span>
              <span id="palms-picker-guide-text">カレンダーをクリックして期間を選択</span>
            </span>
            <div class="text-2xs font-bold text-slate-700 bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-full tabular-nums" id="palms-modal-duration-badge">
              -- 日間
            </div>
          </div>
        </div>

        <!-- Calendar Navigation Header -->
        <div class="flex items-center justify-between px-1">
          <button type="button" onclick="movePalmsCalendarMonth(-1)" class="w-8 h-8 rounded-xl border border-slate-200 hover:border-slate-300 hover:bg-slate-50 flex items-center justify-center text-slate-600 transition-colors cursor-pointer" title="前月">
            <i class="fa-solid fa-chevron-left text-xs"></i>
          </button>
          <div class="text-xs sm:text-sm font-black text-slate-800 flex items-center gap-12 sm:gap-24">
            <span id="palms-cal-left-title">--年 --月</span>
            <span id="palms-cal-right-title" class="hidden sm:inline">--年 --月</span>
          </div>
          <button type="button" onclick="movePalmsCalendarMonth(1)" class="w-8 h-8 rounded-xl border border-slate-200 hover:border-slate-300 hover:bg-slate-50 flex items-center justify-center text-slate-600 transition-colors cursor-pointer" title="翌月">
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
        </div>

        <!-- Two-Month Calendars Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 select-none">
          <div class="border border-slate-100 rounded-2xl p-2.5 bg-white shadow-2xs">
            <div class="grid grid-cols-7 text-center text-3xs font-black text-slate-400 mb-1.5">
              <span class="text-rose-500">日</span>
              <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span>
              <span class="text-blue-500">土</span>
            </div>
            <div id="palms-cal-left-grid" class="grid grid-cols-7 gap-y-0.5 text-center text-xs"></div>
          </div>

          <div class="hidden sm:block border border-slate-100 rounded-2xl p-2.5 bg-white shadow-2xs">
            <div class="grid grid-cols-7 text-center text-3xs font-black text-slate-400 mb-1.5">
              <span class="text-rose-500">日</span>
              <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span>
              <span class="text-blue-500">土</span>
            </div>
            <div id="palms-cal-right-grid" class="grid grid-cols-7 gap-y-0.5 text-center text-xs"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Footer (Fixed at Bottom, Always Visible) -->
    <div class="shrink-0 px-5 py-3.5 border-t border-slate-100 bg-slate-50/90 flex items-center justify-between gap-3 flex-wrap">
      <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700 select-none">
        <input type="checkbox" id="palms-include-resigned-modal" onchange="toggleIncludeResignedMembers(this.checked)" class="w-4 h-4 rounded text-blue-600 border-slate-300 focus:ring-blue-500 cursor-pointer">
        <span>退会メンバーを含む</span>
      </label>
      <div class="flex items-center gap-2">
        <button type="button" onclick="closePalmsDateModal()" class="px-4 py-2 text-xs font-bold text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 rounded-xl transition-all cursor-pointer">
          キャンセル
        </button>
        <button type="button" id="btn-palms-modal-apply" onclick="applyPalmsDateModal()" class="px-5 py-2.5 text-xs font-bold bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl shadow-xs transition-all flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-check text-2xs"></i>
          <span>この期間で集計</span>
        </button>
      </div>
    </div>

  </div>
</div>
