let currentLinkSearchQuery = '';

const linkGenreCollapsedMap = {};

// Drag and drop state
let draggedLinkId = null;
let draggedLinkCategory = null;
let draggedCategoryName = null;
let isCategoryDragEnabled = false;

function getCategorySlug(cat) {
  let hash = 0;
  for (let i = 0; i < cat.length; i++) {
    hash = ((hash << 5) - hash) + cat.charCodeAt(i);
    hash |= 0;
  }
  return 'cat_' + Math.abs(hash);
}

function toggleLinkGenre(genreKey) {
  linkGenreCollapsedMap[genreKey] = !linkGenreCollapsedMap[genreKey];
  const body = document.getElementById(`genre-body-${genreKey}`);
  const icon = document.getElementById(`genre-icon-${genreKey}`);
  if (body) {
    if (linkGenreCollapsedMap[genreKey]) {
      body.classList.add('hidden');
      if (icon) icon.className = 'fa-solid fa-chevron-right text-slate-400 text-xs transition-transform';
    } else {
      body.classList.remove('hidden');
      if (icon) icon.className = 'fa-solid fa-chevron-down text-slate-400 text-xs transition-transform';
    }
  }
}

function getLinkDomainInfo(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.toLowerCase();
    const path = u.pathname.toLowerCase();
    if (host.includes('docs.google.com')) {
      if (path.includes('/spreadsheets')) return { label: 'Sheets', icon: 'fa-solid fa-table', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200/70' };
      if (path.includes('/forms')) return { label: 'Form', icon: 'fa-solid fa-square-poll-horizontal', badge: 'bg-purple-50 text-purple-700 border-purple-200/70' };
      return { label: 'Google Docs', icon: 'fa-solid fa-file-lines', badge: 'bg-blue-50 text-blue-700 border-blue-200/70' };
    }
    if (host.includes('forms.gle')) {
      return { label: 'Form', icon: 'fa-solid fa-square-poll-horizontal', badge: 'bg-purple-50 text-purple-700 border-purple-200/70' };
    }
    if (host.includes('drive.google.com')) {
      return { label: 'Drive', icon: 'fa-brands fa-google-drive', badge: 'bg-blue-50 text-blue-700 border-blue-200/70' };
    }
    if (host.includes('zoom.us')) {
      return { label: 'Zoom', icon: 'fa-solid fa-video', badge: 'bg-sky-50 text-sky-700 border-sky-200/70' };
    }
    if (host.includes('paypal.com')) {
      return { label: 'PayPal', icon: 'fa-brands fa-paypal', badge: 'bg-indigo-50 text-indigo-700 border-indigo-200/70' };
    }
    if (host.includes('bniconnectglobal.com')) {
      return { label: 'BNI Connect', icon: 'fa-solid fa-network-wired', badge: 'bg-red-50 text-red-700 border-red-200/70' };
    }
    if (host.includes('bniglobalacademy.com')) {
      return { label: 'Academy', icon: 'fa-solid fa-graduation-cap', badge: 'bg-amber-50 text-amber-700 border-amber-200/70' };
    }
    if (host.includes('bni-ck.com')) {
      return { label: 'BNI京都CC', icon: 'fa-solid fa-landmark', badge: 'bg-rose-50 text-rose-700 border-rose-200/70' };
    }
    if (host.includes('onedrive.live.com')) {
      return { label: 'OneDrive', icon: 'fa-brands fa-microsoft', badge: 'bg-blue-50 text-blue-700 border-blue-200/70' };
    }
    return { label: host.replace(/^www\./, ''), icon: 'fa-solid fa-globe', badge: 'bg-slate-50 text-slate-600 border-slate-200' };
  } catch(e) {
    return { label: 'Web', icon: 'fa-solid fa-link', badge: 'bg-slate-50 text-slate-600 border-slate-200' };
  }
}

function getActiveScopes() {
  if (chapterScopesData && chapterScopesData.length > 0) {
    return chapterScopesData;
  }
  return DEFAULT_SCOPES;
}

function renderScopeTabs() {
  const container = document.getElementById('links-scope-tabs');
  if (!container) return;

  const scopes = getActiveScopes();
  let html = '';

  scopes.forEach(s => {
    const isActive = currentLinkScope === s.id;
    const activeCls = 'link-scope-tab active flex-1 min-w-[130px] py-2 px-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center gap-2 cursor-pointer bg-white text-blue-600 shadow-xs';
    const inactiveCls = 'link-scope-tab flex-1 min-w-[110px] py-2 px-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center gap-2 cursor-pointer text-slate-600 hover:text-slate-800';
    const icon = s.icon || 'fa-solid fa-folder';

    html += `
      <button 
        type="button" 
        onclick="setLinkScope('${escapeHtml(s.id)}')" 
        data-scope="${escapeHtml(s.id)}" 
        class="${isActive ? activeCls : inactiveCls}"
        title="${escapeHtml(s.name)}"
      >
        <i class="${escapeHtml(icon)} text-xs"></i>
        <span>${escapeHtml(s.name)}</span>
      </button>
    `;
  });

  // Always append 'all' tab
  const isAllActive = currentLinkScope === 'all';
  const allActiveCls = 'link-scope-tab active py-2 px-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center gap-2 cursor-pointer bg-white text-blue-600 shadow-xs shrink-0';
  const allInactiveCls = 'link-scope-tab py-2 px-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center gap-2 cursor-pointer text-slate-500 hover:text-slate-700 shrink-0';

  html += `
    <button 
      type="button" 
      onclick="setLinkScope('all')" 
      data-scope="all" 
      class="${isAllActive ? allActiveCls : allInactiveCls}"
    >
      <span>すべて</span>
    </button>
  `;

  container.innerHTML = html;
}

function renderCategoryScopeSelect() {
  const select = document.getElementById('category-field-scope');
  if (!select) return;

  const currentVal = select.value;
  const scopes = getActiveScopes();

  let html = '';
  scopes.forEach(s => {
    html += `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`;
  });

  select.innerHTML = html;
  if (currentVal && scopes.some(s => s.id === currentVal)) {
    select.value = currentVal;
  }
}

function fetchChapterLinks() {
  const container = document.getElementById('links-grid-container');
  if (container && chapterLinksData.length === 0) {
    container.innerHTML = `
      <div class="col-span-full py-16 text-center text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-blue-600"></i>
        <p class="text-xs font-bold">リンク情報を取得中...</p>
      </div>
    `;
  }

  ApiService.call('getChapterLinksApi')
    .then(res => {
      if (res && res.links) {
        chapterLinksData = Array.isArray(res.links) ? res.links : [];
        if (Array.isArray(res.categories)) {
          chapterCategoriesData = res.categories;
        }
        if (Array.isArray(res.scopes)) {
          chapterScopesData = res.scopes;
        }
        try {
          renderScopeTabs();
          renderCategoryScopeSelect();
          renderCategoryPills();
          renderChapterLinks();
          renderModalCategorySelect();
        } catch (renderErr) {
          console.error('Render chapter links error:', renderErr);
        }
      } else {
        showToast('リンク情報の取得に失敗しました', 'error');
      }
    })
    .catch(err => {
      console.error('Fetch chapter links error:', err);
      showToast('通信エラーが発生しました', 'error');
    });
}

function setLinkScope(scope) {
  currentLinkScope = scope;
  currentLinkCategory = 'ALL';

  // Update scope tabs
  renderScopeTabs();
  renderCategoryPills();
  renderChapterLinks();
}

function getScopeForCategory(catName) {
  if (!catName) return 'member';
  const custom = chapterCategoriesData.find(c => c.name === catName);
  if (custom && custom.scope) return custom.scope;
  if (catName === '役員・チャプター運営') return 'admin';
  if (catName === 'アーカイブ') return 'archive';
  return 'member';
}

function getAvailableCategoriesForScope(targetScope = currentLinkScope) {
  const combined = [];

  // 1. From chapterCategoriesData (custom / DB defined categories)
  if (chapterCategoriesData && chapterCategoriesData.length > 0) {
    chapterCategoriesData.forEach(c => {
      const scope = c.scope || 'member';
      if ((targetScope === 'all' || scope === targetScope) && !combined.includes(c.name)) {
        combined.push(c.name);
      }
    });
  }

  // 2. Default base categories if not yet registered in chapterCategoriesData
  const defaultList = [
    { name: 'ビジター情報', scope: 'member' },
    { name: 'メンバー情報', scope: 'member' },
    { name: '日常・1to1', scope: 'member' },
    { name: 'ビジター・入会', scope: 'member' },
    { name: '公式ポータル・学び', scope: 'member' },
    { name: '役員・チャプター運営', scope: 'admin' },
    { name: 'アセット関連', scope: 'member' },
    { name: 'アーカイブ', scope: 'archive' }
  ];

  defaultList.forEach(def => {
    const custom = chapterCategoriesData.find(c => c.name === def.name);
    if (!custom) {
      if (targetScope === 'all' || def.scope === targetScope) {
        if (!combined.includes(def.name)) combined.push(def.name);
      }
    }
  });

  // 3. Fallback: categories from existing links
  chapterLinksData.forEach(l => {
    if (l.category && !combined.includes(l.category)) {
      const scope = l.scope || getScopeForCategory(l.category);
      if (targetScope === 'all' || scope === targetScope) {
        combined.push(l.category);
      }
    }
  });

  return combined;
}

function renderCategoryPills() {
  const filterContainer = document.getElementById('links-category-filter');
  if (!filterContainer) return;

  const availableCats = getAvailableCategoriesForScope();

  // Count items for each category
  const getCatCount = (cat) => {
    return chapterLinksData.filter(item => {
      const itemScope = item.scope || getScopeForCategory(item.category);
      if (currentLinkScope !== 'all' && itemScope !== currentLinkScope) {
        return false;
      }
      if (cat === 'ALL') return true;
      return item.category === cat;
    }).length;
  };

  let html = `
    <button 
      type="button"
      onclick="filterLinksCategory('ALL')" 
      class="category-pill ${currentLinkCategory === 'ALL' ? 'active bg-blue-600 text-white shadow-xs' : 'bg-white text-slate-600 border border-slate-200 hover:border-slate-300'} px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shrink-0 cursor-pointer flex items-center gap-1.5" 
      data-category="ALL"
    >
      <span>すべて</span>
      <span class="text-[10px] opacity-80 tabular-nums">(${getCatCount('ALL')})</span>
    </button>
  `;

  availableCats.forEach(cat => {
    const isActive = currentLinkCategory === cat;
    const count = getCatCount(cat);
    const activeClass = 'active bg-blue-600 text-white shadow-xs';
    const inactiveClass = 'bg-white text-slate-600 border border-slate-200 hover:border-slate-300';

    html += `
      <button 
        type="button"
        onclick="filterLinksCategory('${escapeHtml(cat)}')" 
        class="category-pill ${isActive ? activeClass : inactiveClass} px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shrink-0 cursor-pointer flex items-center gap-1.5" 
        data-category="${escapeHtml(cat)}"
      >
        <span>${escapeHtml(cat)}</span>
        <span class="text-[10px] opacity-80 tabular-nums">(${count})</span>
      </button>
    `;
  });

  filterContainer.innerHTML = html;
}

function filterLinksCategory(category) {
  currentLinkCategory = category;

  const pills = document.querySelectorAll('#links-category-filter .category-pill');
  pills.forEach(pill => {
    if (pill.getAttribute('data-category') === category) {
      pill.className = 'category-pill active bg-blue-600 text-white shadow-xs px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shrink-0 cursor-pointer flex items-center gap-1.5';
    } else {
      pill.className = 'category-pill bg-white text-slate-600 border border-slate-200 hover:border-slate-300 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shrink-0 cursor-pointer flex items-center gap-1.5';
    }
  });

  renderChapterLinks();
}

function handleLinkSearch(query) {
  currentLinkSearchQuery = (query || '').toLowerCase().trim();
  const clearBtn = document.getElementById('btn-clear-link-search');
  if (clearBtn) {
    if (currentLinkSearchQuery) {
      clearBtn.classList.remove('hidden');
    } else {
      clearBtn.classList.add('hidden');
    }
  }
  renderChapterLinks();
}

function clearLinkSearch() {
  const input = document.getElementById('links-search-input');
  if (input) {
    input.value = '';
    handleLinkSearch('');
    input.focus();
  }
}

function renderChapterLinks() {
  const container = document.getElementById('links-grid-container');
  const countBadge = document.getElementById('links-count-badge');
  if (!container) return;

  const filtered = chapterLinksData.filter(item => {
    // 1. Scope filter
    if (currentLinkScope !== 'all') {
      const itemScope = item.scope || getScopeForCategory(item.category);
      if (itemScope !== currentLinkScope) {
        return false;
      }
    }

    // 2. Subcategory filter
    if (currentLinkCategory !== 'ALL') {
      if (item.category !== currentLinkCategory) {
        return false;
      }
    }

    // 3. Search query filter
    if (currentLinkSearchQuery) {
      const title = (item.title || '').toLowerCase();
      const desc = (item.description || '').toLowerCase();
      const url = (item.url || '').toLowerCase();
      const cat = (item.category || '').toLowerCase();
      return title.includes(currentLinkSearchQuery) ||
             desc.includes(currentLinkSearchQuery) ||
             url.includes(currentLinkSearchQuery) ||
             cat.includes(currentLinkSearchQuery);
    }

    return true;
  });

  if (countBadge) {
    countBadge.textContent = `${filtered.length}件`;
  }

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="py-16 text-center text-slate-400 bg-white rounded-2xl border border-slate-200">
        <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-slate-50 flex items-center justify-center text-slate-400">
          <i class="fa-solid fa-magnifying-glass text-xl"></i>
        </div>
        <p class="text-sm font-bold text-slate-700">条件に一致するリンクは見つかりませんでした</p>
        <p class="text-xs text-slate-400 mt-1">検索キーワードを変更するか、カテゴリを切り替えてください</p>
        ${currentLinkSearchQuery ? `
          <button type="button" onclick="clearLinkSearch()" class="mt-4 px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition-colors cursor-pointer">
            検索条件をクリア
          </button>
        ` : ''}
      </div>
    `;
    return;
  }

  // Group filtered links by category
  const grouped = {};
  filtered.forEach(link => {
    const cat = link.category || 'その他';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(link);
  });

  // Determine category display order
  const categoriesInOrder = [];
  // 1. From chapterCategoriesData (ordered by DB sort_order)
  if (chapterCategoriesData && chapterCategoriesData.length > 0) {
    chapterCategoriesData.forEach(c => {
      if (grouped[c.name] && grouped[c.name].length > 0 && !categoriesInOrder.includes(c.name)) {
        categoriesInOrder.push(c.name);
      }
    });
  }
  // 2. From LINK_CATEGORY_ORDER
  LINK_CATEGORY_ORDER.forEach(cat => {
    if (grouped[cat] && grouped[cat].length > 0 && !categoriesInOrder.includes(cat)) {
      categoriesInOrder.push(cat);
    }
  });
  // 3. Append remaining categories
  Object.keys(grouped).forEach(cat => {
    if (!categoriesInOrder.includes(cat) && grouped[cat].length > 0) {
      categoriesInOrder.push(cat);
    }
  });

  let html = '';

  categoriesInOrder.forEach(catName => {
    const items = grouped[catName];
    // Sort items by sort_order ASC, then title ASC
    items.sort((a, b) => {
      const orderA = typeof a.sort_order === 'number' ? a.sort_order : parseInt(a.sort_order || 0, 10);
      const orderB = typeof b.sort_order === 'number' ? b.sort_order : parseInt(b.sort_order || 0, 10);
      if (orderA !== orderB) return orderA - orderB;
      return (a.title || '').localeCompare(b.title || '', 'ja');
    });

    const catSlug = getCategorySlug(catName);
    const isCollapsed = !!linkGenreCollapsedMap[catSlug];
    const catMeta = chapterCategoriesData.find(c => c.name === catName);
    const theme = LINK_CATEGORY_THEMES[catName] || {
      icon: (catMeta && catMeta.icon) || 'fa-solid fa-folder',
      iconBg: 'bg-slate-100',
      iconBorder: 'border-slate-200',
      iconText: 'text-slate-600',
      badgeClass: 'bg-slate-100 text-slate-600 border border-slate-200',
      dotColor: '#64748b',
      desc: ''
    };

    let itemsHtml = '';
    items.forEach((link, idx) => {
      const escapedTitle = escapeHtml(link.title || '');
      const escapedUrl = escapeHtml(link.url || '');
      const escapedDesc = escapeHtml(link.description || '');
      const iconClass = link.icon ? escapeHtml(link.icon) : 'fa-solid fa-link';
      const linkId = escapeHtml(link.id || '');
      const domainInfo = getLinkDomainInfo(link.url || '');

      itemsHtml += `
        <div 
          id="link-row-${linkId}"
          class="link-item-row px-3 sm:px-4 py-2.5 flex items-center justify-between gap-2.5 hover:bg-slate-50/90 transition-colors group relative cursor-default"
          draggable="true"
          data-id="${linkId}"
          data-category="${escapeHtml(catName)}"
          data-index="${idx}"
          ondragstart="handleLinkDragStart(event, '${linkId}', '${escapeHtml(catName)}')"
          ondragover="handleLinkDragOver(event)"
          ondragleave="handleLinkDragLeave(event)"
          ondrop="handleLinkDrop(event, '${linkId}', '${escapeHtml(catName)}')"
          ondragend="handleLinkDragEnd(event)"
        >
          <!-- Left: Drag Handle + Icon + Title + Description -->
          <div class="flex items-center gap-2 sm:gap-3 min-w-0 flex-1">
            <!-- Drag Handle -->
            <div 
              class="link-drag-handle p-1 text-slate-300 hover:text-slate-600 cursor-grab active:cursor-grabbing transition-colors shrink-0" 
              title="ドラッグして並び順（優先順位）を変更"
            >
              <i class="fa-solid fa-grip-vertical text-xs"></i>
            </div>

            <!-- Quick move buttons for mobile/quick clicks -->
            <div class="flex flex-col text-[9px] text-slate-300 sm:opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
              <button type="button" onclick="moveLinkQuick('${linkId}', -1)" title="上へ移動" class="hover:text-blue-600 p-0.5 leading-none cursor-pointer">
                <i class="fa-solid fa-chevron-up"></i>
              </button>
              <button type="button" onclick="moveLinkQuick('${linkId}', 1)" title="下へ移動" class="hover:text-blue-600 p-0.5 leading-none cursor-pointer">
                <i class="fa-solid fa-chevron-down"></i>
              </button>

/* ========================================================
   Drag & Drop Logic for Links
======================================================== */
function handleLinkDragStart(event, linkId, category) {
  draggedLinkId = linkId;
  draggedLinkCategory = category;
  draggedCategoryName = null;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', linkId);

  const row = document.getElementById(`link-row-${linkId}`);
  if (row) {
    row.classList.add('opacity-40', 'bg-blue-50/40');
  }
}

function handleLinkDragOver(event) {
  if (!draggedLinkId) return;
  event.preventDefault();
  event.stopPropagation();
  event.dataTransfer.dropEffect = 'move';

  const targetRow = event.currentTarget;
  if (!targetRow || targetRow.id === `link-row-${draggedLinkId}`) return;

  const rect = targetRow.getBoundingClientRect();
  const relY = event.clientY - rect.top;
  if (relY < rect.height / 2) {
    targetRow.classList.add('border-t-2', 'border-blue-500');
    targetRow.classList.remove('border-b-2');
  } else {
    targetRow.classList.add('border-b-2', 'border-blue-500');
    targetRow.classList.remove('border-t-2');
  }
}

function handleLinkDragLeave(event) {
  const targetRow = event.currentTarget;
  if (targetRow) {
    targetRow.classList.remove('border-t-2', 'border-b-2', 'border-blue-500');
  }
}

function handleLinkDrop(event, targetLinkId, targetCategory) {
  event.preventDefault();
  event.stopPropagation();

  const targetRow = event.currentTarget;
  if (targetRow) {
    targetRow.classList.remove('border-t-2', 'border-b-2', 'border-blue-500');
  }

  if (!draggedLinkId || draggedLinkId === targetLinkId) {
    return;
  }

  const draggedItem = chapterLinksData.find(l => l.id === draggedLinkId);
  if (!draggedItem) return;

  const rect = targetRow.getBoundingClientRect();
  const insertBefore = (event.clientY - rect.top) < (rect.height / 2);

  // Reorder items in target category
  draggedItem.category = targetCategory;

  // Filter links for this category
  const catItems = chapterLinksData.filter(l => l.category === targetCategory && l.id !== draggedLinkId);
  const targetIndex = catItems.findIndex(l => l.id === targetLinkId);

  if (targetIndex !== -1) {
    const insertIndex = insertBefore ? targetIndex : targetIndex + 1;
    catItems.splice(insertIndex, 0, draggedItem);
  } else {
    catItems.push(draggedItem);
  }

  // Update sort_order for all items in target category
  const updatePayload = [];
  catItems.forEach((item, idx) => {
    item.sort_order = (idx + 1) * 10;
    updatePayload.push({
      id: item.id,
      sort_order: item.sort_order,
      category: targetCategory
    });
  });

  // Re-render immediately
  renderChapterLinks();
  showToast('優先順位を更新しました', 'success');

  // Send update to API
  ApiService.call('reorderChapterLinksApi', updatePayload)
    .then(res => {
      if (res && res.links) {
        chapterLinksData = res.links;
      }
    })
    .catch(err => {
      console.error('Reorder links failed:', err);
    });
}

function handleCategoryBodyDragOver(event) {
  if (!draggedLinkId) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
}

function handleCategoryBodyDrop(event, targetCategory) {
  if (!draggedLinkId) return;
  event.preventDefault();
  event.stopPropagation();

  const draggedItem = chapterLinksData.find(l => l.id === draggedLinkId);
  if (!draggedItem) return;

  draggedItem.category = targetCategory;
  const catItems = chapterLinksData.filter(l => l.category === targetCategory && l.id !== draggedLinkId);
  catItems.push(draggedItem);

  const updatePayload = [];
  catItems.forEach((item, idx) => {
    item.sort_order = (idx + 1) * 10;
    updatePayload.push({
      id: item.id,
      sort_order: item.sort_order,
      category: targetCategory
    });
  });

  renderChapterLinks();
  showToast('優先順位を更新しました', 'success');

  ApiService.call('reorderChapterLinksApi', updatePayload)
    .then(res => {
      if (res && res.links) {
        chapterLinksData = res.links;
      }
    })
    .catch(err => {
      console.error('Category drop reorder failed:', err);
    });
}

function handleLinkDragEnd(event) {
  if (draggedLinkId) {
    const row = document.getElementById(`link-row-${draggedLinkId}`);
    if (row) {
      row.classList.remove('opacity-40', 'bg-blue-50/40');
    }
  }
  document.querySelectorAll('.link-item-row').forEach(row => {
    row.classList.remove('border-t-2', 'border-b-2', 'border-blue-500');
  });
  draggedLinkId = null;
  draggedLinkCategory = null;
}

function moveLinkQuick(linkId, direction) {
  const item = chapterLinksData.find(l => l.id === linkId);
  if (!item) return;

  const catItems = chapterLinksData
    .filter(l => l.category === item.category)
    .sort((a, b) => (parseInt(a.sort_order || 0, 10) - parseInt(b.sort_order || 0, 10)));

  const currIdx = catItems.findIndex(l => l.id === linkId);
  const newIdx = currIdx + direction;

  if (newIdx < 0 || newIdx >= catItems.length) return;

  // Swap
  const swapItem = catItems[newIdx];
  catItems[currIdx] = swapItem;
  catItems[newIdx] = item;

  const updatePayload = [];
  catItems.forEach((it, idx) => {
    it.sort_order = (idx + 1) * 10;
    updatePayload.push({ id: it.id, sort_order: it.sort_order, category: it.category });
  });

  renderChapterLinks();
  showToast('優先順位を更新しました', 'success');

  ApiService.call('reorderChapterLinksApi', updatePayload)
    .then(res => {
      if (res && res.links) {
        chapterLinksData = res.links;
      }
    })
    .catch(err => {
      console.error('Quick reorder error:', err);
    });
}

function handleCategoryDragStart(event, catName) {
  draggedCategoryName = catName;
  draggedLinkId = null;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', 'category:' + catName);

  const card = document.getElementById(`category-block-${slug}`);
  if (card) {
    card.classList.add('opacity-40', 'border-blue-400');
  }
}

function handleCategoryCardDragOver(event) {
  if (!draggedCategoryName) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';

  const card = event.currentTarget;
  if (!card) return;

  const rect = card.getBoundingClientRect();
  if (event.clientY - rect.top < rect.height / 2) {
    card.classList.add('border-t-4', 'border-blue-500');
    card.classList.remove('border-b-4');
  } else {
    card.classList.add('border-b-4', 'border-blue-500');
    card.classList.remove('border-t-4');
  }
}

function handleCategoryCardDragLeave(event) {
  const card = event.currentTarget;
  if (card) {
    card.classList.remove('border-t-4', 'border-b-4', 'border-blue-500');
  }
}

function handleCategoryCardDrop(event, targetCategory) {
  if (!draggedCategoryName || draggedCategoryName === targetCategory) return;
  event.preventDefault();
  event.stopPropagation();

  const card = event.currentTarget;
  if (card) {
    card.classList.remove('border-t-4', 'border-b-4', 'border-blue-500');
  }

  const rect = card.getBoundingClientRect();
  const insertBefore = (event.clientY - rect.top) < (rect.height / 2);

  // Reorder categories
  const currentOrder = getAvailableCategoriesForScope().filter(c => c !== draggedCategoryName);
  const targetIdx = currentOrder.indexOf(targetCategory);
  if (targetIdx !== -1) {
    currentOrder.splice(insertBefore ? targetIdx : targetIdx + 1, 0, draggedCategoryName);
  } else {
    currentOrder.push(draggedCategoryName);
  }

  const payload = [];
  currentOrder.forEach((name, idx) => {
    payload.push({ name: name, sort_order: (idx + 1) * 10 });
    const existing = chapterCategoriesData.find(c => c.name === name);
    if (existing) {
      existing.sort_order = (idx + 1) * 10;
    } else {
      chapterCategoriesData.push({ name: name, sort_order: (idx + 1) * 10, scope: currentLinkScope === 'all' ? 'member' : currentLinkScope });
    }
  });

  renderChapterLinks();
  renderCategoryPills();
  showToast('カテゴリーの優先順位を更新しました', 'success');

  ApiService.call('reorderChapterCategoriesApi', payload)
    .then(res => {
      if (res && res.categories) {
        chapterCategoriesData = res.categories;
      }
    })
    .catch(err => {
      console.error('Reorder categories error:', err);
    });
}

function handleCategoryDragEnd(event) {
  document.querySelectorAll('.link-category-block').forEach(card => {
    card.classList.remove('opacity-40', 'border-blue-400', 'border-t-4', 'border-b-4', 'border-blue-500');
  });
  draggedCategoryName = null;
}

function moveCategoryQuick(catName, direction) {
  const currentOrder = getAvailableCategoriesForScope();
  const currIdx = currentOrder.indexOf(catName);
  const newIdx = currIdx + direction;
  if (newIdx < 0 || newIdx >= currentOrder.length) return;

  const swapCat = currentOrder[newIdx];
  currentOrder[currIdx] = swapCat;
  currentOrder[newIdx] = catName;

  const payload = [];
  currentOrder.forEach((name, idx) => {
    payload.push({ name: name, sort_order: (idx + 1) * 10 });
    const existing = chapterCategoriesData.find(c => c.name === name);
    if (existing) {
      existing.sort_order = (idx + 1) * 10;
    } else {
      chapterCategoriesData.push({ name: name, sort_order: (idx + 1) * 10, scope: currentLinkScope === 'all' ? 'member' : currentLinkScope });
    }
  });

  renderChapterLinks();
  renderCategoryPills();
  showToast('カテゴリーの優先順位を更新しました', 'success');

  ApiService.call('reorderChapterCategoriesApi', payload)
    .then(res => {
      if (res && res.categories) {
        chapterCategoriesData = res.categories;
      }
    })
    .catch(err => {
      console.error('Quick category reorder error:', err);

}

function updateCategoryIconPreview(val) {

function openCategoryModal(catName = null) {
  const modal = document.getElementById('modal-category-crud');
  const container = document.getElementById('modal-category-container');
  const titleEl = document.getElementById('modal-category-title');
  const form = document.getElementById('form-category-crud');

  if (!modal || !container || !form) return;

  form.reset();
  document.getElementById('category-field-id').value = '';
  document.getElementById('category-field-sort').value = '10';
  document.getElementById('category-field-icon').value = 'fa-solid fa-folder';
  updateCategoryIconPreview('fa-solid fa-folder');

  if (catName) {
    const target = chapterCategoriesData.find(c => c.name === catName);
    if (titleEl) titleEl.innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-600"></i><span>カテゴリーを編集</span>`;
    document.getElementById('category-field-id').value = (target && target.id) || '';
    document.getElementById('category-field-name').value = catName;
    document.getElementById('category-field-scope').value = (target && target.scope) || (currentLinkScope === 'admin' ? 'admin' : 'member');
    document.getElementById('category-field-sort').value = (target && target.sort_order) || '10';
    document.getElementById('category-field-icon').value = (target && target.icon) || 'fa-solid fa-folder';
    updateCategoryIconPreview((target && target.icon) || 'fa-solid fa-folder');
  } else {
    if (titleEl) titleEl.innerHTML = `<i class="fa-solid fa-folder-plus text-blue-600"></i><span>カテゴリーを作成</span>`;
    document.getElementById('category-field-scope').value = currentLinkScope === 'admin' ? 'admin' : (currentLinkScope === 'archive' ? 'archive' : 'member');
  }

  modal.style.display = 'flex';
  setTimeout(() => {
    container.classList.remove('scale-95');
    container.classList.add('scale-100');
  }, 10);
}

function closeCategoryModal() {
  const modal = document.getElementById('modal-category-crud');
  const container = document.getElementById('modal-category-container');
  if (modal && container) {
    container.classList.remove('scale-100');
    container.classList.add('scale-95');
    setTimeout(() => {
      modal.style.display = 'none';
    }, 150);
  }
}

function handleCategorySubmit(event) {
  event.preventDefault();
  const id = document.getElementById('category-field-id').value.trim();
  const name = document.getElementById('category-field-name').value.trim();
  const scope = document.getElementById('category-field-scope').value;
  const sort_order = parseInt(document.getElementById('category-field-sort').value, 10) || 10;
  const icon = document.getElementById('category-field-icon').value.trim() || 'fa-solid fa-folder';

  if (!name) {
    showToast('カテゴリー名を入力してください', 'error');
    return;
  }

  const payload = {
    id: id || undefined,
    name,
    scope,
    sort_order,
    icon
  };

  const btn = document.getElementById('btn-save-category');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i><span>保存中...</span>`;
  }

  ApiService.call('saveChapterCategoryApi', payload)
    .then(res => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check"></i><span>保存する</span>`;
      }
      if (res && res.success) {
        showToast('カテゴリーを保存しました', 'success');
        closeCategoryModal();
        if (res.categories) chapterCategoriesData = res.categories;
        if (res.links) chapterLinksData = res.links;
        renderCategoryPills();
        renderChapterLinks();
        renderModalCategorySelect();
      } else {
        showToast((res && res.message) || '保存に失敗しました', 'error');
      }
    })
    .catch(err => {
      console.error('Save category error:', err);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check"></i><span>保存する</span>`;
      }
      showToast('通信エラーが発生しました', 'error');
    });
}

        if (res.links) chapterLinksData = res.links;

        renderModalCategorySelect();
      } else {

function renderModalCategorySelect(selectedCategory = null) {
  const select = document.getElementById('link-field-category');
  if (!select) return;

  const currentVal = selectedCategory || select.value;
  const categories = getAvailableCategoriesForScope();

  // Ensure default test required options are always available
  const baseOptions = [
    'ビジター情報',
    'メンバー情報',
    '日常・1to1',
    'ビジター・入会',
    '公式ポータル・学び',
    '役員・チャプター運営',
    'アセット関連',
    'アーカイブ'
  ];

  const allCats = [];
  categories.forEach(c => { if (!allCats.includes(c)) allCats.push(c); });
  baseOptions.forEach(c => { if (!allCats.includes(c)) allCats.push(c); });

  let html = '';
  allCats.forEach(cat => {
    html += `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`;
  });

  select.innerHTML = html;
  if (currentVal && allCats.includes(currentVal)) {
    select.value = currentVal;
  }
}

  document.getElementById('link-field-id').value = '';
  document.getElementById('link-field-sort').value = '0';
  document.getElementById('link-field-icon').value = 'fa-solid fa-link';
  updateLinkIconPreview('fa-solid fa-link');
  renderModalCategorySelect();

  if (linkId) {
    const target = chapterLinksData.find(l => l.id === linkId);
    if (target) {
      if (titleEl) titleEl.innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-600"></i><span>リンクを編集</span>`;
      renderModalCategorySelect(target.category);

      document.getElementById('link-field-id').value = target.id;
      document.getElementById('link-field-title').value = target.title || '';
      document.getElementById('link-field-url').value = target.url || '';
      document.getElementById('link-field-category').value = target.category || 'メンバー情報';
      document.getElementById('link-field-description').value = target.description || '';
      document.getElementById('link-field-icon').value = target.icon || 'fa-solid fa-link';
      document.getElementById('link-field-sort').value = target.sort_order || '0';
      updateLinkIconPreview(target.icon || 'fa-solid fa-link');
    }
  } else {
    if (titleEl) titleEl.innerHTML = `<i class="fa-solid fa-link text-blue-600"></i><span>リンクを追加</span>`;
    let defaultCat = 'ビジター情報';
    if (currentLinkScope === 'admin') defaultCat = '役員・チャプター運営';
    else if (currentLinkScope === 'archive') defaultCat = 'アーカイブ';
    else if (currentLinkCategory !== 'ALL') defaultCat = currentLinkCategory;

    renderModalCategorySelect(defaultCat);
    const catSelect = document.getElementById('link-field-category');
    if (catSelect) catSelect.value = defaultCat;
  }

  modal.style.display = 'flex';
  setTimeout(() => {
    container.classList.remove('scale-95');
    container.classList.add('scale-100');
  }, 10);
}

function closeLinkModal() {
  const modal = document.getElementById('modal-link-crud');
  const container = document.getElementById('modal-link-container');
  if (modal && container) {
    container.classList.remove('scale-100');
    container.classList.add('scale-95');
    setTimeout(() => {
      modal.style.display = 'none';
    }, 150);
  }
}

function handleLinkSubmit(event) {
  event.preventDefault();
  const id = document.getElementById('link-field-id').value.trim();
  const title = document.getElementById('link-field-title').value.trim();
  const url = document.getElementById('link-field-url').value.trim();
  const category = document.getElementById('link-field-category').value;
  const description = document.getElementById('link-field-description').value.trim();
  const icon = document.getElementById('link-field-icon').value.trim() || 'fa-solid fa-link';
  const sort_order = parseInt(document.getElementById('link-field-sort').value, 10) || 0;

  if (!title || !url) {
    showToast('タイトルとURLは必須です', 'error');
    return;
  }

  const payload = {
    id: id || undefined,
    title,
    url,
    category,
    description,
    icon,
    sort_order
  };

  const btn = document.getElementById('btn-save-link');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i><span>保存中...</span>`;
  }

  ApiService.call('saveChapterLinkApi', payload)
    .then(res => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check"></i><span>保存する</span>`;
      }
      if (res && res.success) {
        showToast('リンクを保存しました', 'success');
        closeLinkModal();
        fetchChapterLinks();
      } else {
        showToast((res && res.message) || '保存に失敗しました', 'error');
      }
    })
    .catch(err => {
      console.error('Save link error:', err);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check"></i><span>保存する</span>`;
      }
      showToast('通信エラーが発生しました', 'error');
    });
}

function deleteChapterLink(linkId, fallbackTitle = '') {
  const target = chapterLinksData.find(l => String(l.id) === String(linkId));
  const title = (target && target.title) ? target.title : (fallbackTitle || 'このリンク');

  if (!confirm(`「${title}」を削除してもよろしいですか？`)) {
    return;
  }

  ApiService.call('deleteChapterLinkApi', linkId)
    .then(res => {
      if (res && res.success) {
        showToast('リンクを削除しました', 'success');
        if (Array.isArray(res.links)) {
          chapterLinksData = res.links;
          if (Array.isArray(res.categories)) {
            chapterCategoriesData = res.categories;
          }
          renderCategoryPills();
          renderChapterLinks();
          renderModalCategorySelect();
        } else {
          fetchChapterLinks();
        }
      } else {
        showToast((res && res.message) || '削除に失敗しました', 'error');
      }
    })
    .catch(err => {
      console.error('Delete link error:', err);
      showToast((err && err.message) || '通信エラーが発生しました', 'error');
    });
}

/* ========================================================
   Scope Modal & Form Controller
======================================================== */
function updateScopeIconPreview(val) {
  const preview = document.getElementById('scope-icon-preview');
  if (preview) {
    const iconClass = (val || '').trim() || 'fa-solid fa-layer-group';
    preview.innerHTML = `<i class="${escapeHtml(iconClass)}"></i>`;
  }
}

function openScopeModal(scopeId = null) {
  const modal = document.getElementById('modal-scope-crud');
  const container = document.getElementById('modal-scope-container');
  const form = document.getElementById('form-scope-crud');
  const title = document.getElementById('modal-scope-title');

  if (!modal || !container || !form) return;

  form.reset();
  document.getElementById('scope-field-id').value = '';
  document.getElementById('scope-field-sort').value = '10';
  document.getElementById('scope-field-icon').value = 'fa-solid fa-layer-group';
  updateScopeIconPreview('fa-solid fa-layer-group');

  if (scopeId) {
    const scopes = getActiveScopes();
    const target = scopes.find(s => s.id === scopeId);
    if (target) {
      if (title) title.innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-600"></i><span>所属スコープを編集</span>`;
      document.getElementById('scope-field-id').value = target.id;
      document.getElementById('scope-field-key').value = target.id;
      document.getElementById('scope-field-key').disabled = (target.is_system == 1 || ['member', 'admin', 'archive'].includes(target.id));
      document.getElementById('scope-field-name').value = target.name || '';
      document.getElementById('scope-field-sort').value = target.sort_order || 10;
      document.getElementById('scope-field-icon').value = target.icon || 'fa-solid fa-layer-group';
      updateScopeIconPreview(target.icon || 'fa-solid fa-layer-group');
    }
  } else {
    if (title) title.innerHTML = `<i class="fa-solid fa-layer-group text-blue-600"></i><span>所属スコープを追加・編集</span>`;
    document.getElementById('scope-field-key').disabled = false;
  }

  renderScopeModalList();

  modal.style.display = 'flex';
  setTimeout(() => {
    container.classList.remove('scale-95');
    container.classList.add('scale-100');
  }, 10);
}

function closeScopeModal() {
  const modal = document.getElementById('modal-scope-crud');
  const container = document.getElementById('modal-scope-container');
  if (modal && container) {
    container.classList.remove('scale-100');
    container.classList.add('scale-95');
    setTimeout(() => {
      modal.style.display = 'none';
    }, 150);
  }
}

function renderScopeModalList() {
  const listEl = document.getElementById('scope-modal-list');
  if (!listEl) return;

  const scopes = getActiveScopes();
  let html = '';

  scopes.forEach(s => {
    const isSystem = s.is_system == 1 || ['member', 'admin', 'archive'].includes(s.id);
    const icon = s.icon || 'fa-solid fa-folder';

    html += `
      <div class="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-200/80 hover:bg-slate-100/70 transition-colors text-xs">
        <div class="flex items-center gap-2 min-w-0 cursor-pointer" onclick="openScopeModal('${escapeHtml(s.id)}')">
          <i class="${escapeHtml(icon)} text-blue-600 w-4 text-center"></i>
          <span class="font-bold text-slate-800 truncate">${escapeHtml(s.name)}</span>
          <span class="text-[10px] text-slate-400 font-mono">(${escapeHtml(s.id)})</span>
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <button type="button" onclick="openScopeModal('${escapeHtml(s.id)}')" class="p-1 text-slate-400 hover:text-blue-600 rounded cursor-pointer" title="編集">
            <i class="fa-solid fa-pen text-[11px]"></i>
          </button>
          ${!isSystem ? `
            <button type="button" onclick="deleteScopePrompt('${escapeHtml(s.id)}', '${escapeHtml(s.name)}')" class="p-1 text-slate-400 hover:text-red-600 rounded cursor-pointer" title="削除">
              <i class="fa-solid fa-trash text-[11px]"></i>
            </button>
          ` : `
            <span class="text-[10px] text-slate-300 px-1 font-medium">基本</span>
          `}
        </div>
      </div>
    `;
  });

  listEl.innerHTML = html;
}

function handleScopeSubmit(event) {
  event.preventDefault();
  const idVal = document.getElementById('scope-field-id').value.trim();
  const keyVal = document.getElementById('scope-field-key').value.trim();
  const name = document.getElementById('scope-field-name').value.trim();
  const sort_order = parseInt(document.getElementById('scope-field-sort').value, 10) || 10;
  const icon = document.getElementById('scope-field-icon').value.trim() || 'fa-solid fa-layer-group';

  if (!name) {
    showToast('スコープ名を入力してください', 'error');
    return;
  }

  const payload = {
    id: idVal || keyVal || undefined,
    name,
    sort_order,
    icon
  };

  const btn = document.getElementById('btn-save-scope');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i><span>保存中...</span>`;
  }

  ApiService.call('saveChapterScopeApi', payload)
    .then(res => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check"></i><span>保存する</span>`;
      }
      if (res && res.success) {
        showToast('所属スコープを保存しました', 'success');
        if (res.scopes) chapterScopesData = res.scopes;
        if (res.categories) chapterCategoriesData = res.categories;
        renderScopeTabs();
        renderCategoryScopeSelect();
        renderCategoryPills();
        renderChapterLinks();
        renderScopeModalList();
        closeScopeModal();
      } else {
        showToast((res && res.message) || '保存に失敗しました', 'error');
      }
    })
    .catch(err => {
      console.error('Save scope error:', err);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check"></i><span>保存する</span>`;
      }
      showToast('通信エラーが発生しました', 'error');
    });
}

function deleteScopePrompt(scopeId, scopeName) {
  if (!confirm(`所属スコープ「${scopeName}」を削除してもよろしいですか？\n※所属するカテゴリーは「メンバー用」に移動します。`)) {
    return;
  }

  ApiService.call('deleteChapterScopeApi', { id: scopeId })
    .then(res => {
      if (res && res.success) {
        showToast('所属スコープを削除しました', 'success');
        if (res.scopes) chapterScopesData = res.scopes;
        if (res.categories) chapterCategoriesData = res.categories;
        if (currentLinkScope === scopeId) {
          currentLinkScope = 'member';
        }
        renderScopeTabs();
        renderCategoryScopeSelect();
        renderCategoryPills();
        renderChapterLinks();
        renderScopeModalList();
      } else {
        showToast((res && res.message) || '削除に失敗しました', 'error');
      }
    })
    .catch(err => {
      console.error('Delete scope error:', err);
      showToast('通信エラーが発生しました', 'error');
    });
}
</script>
