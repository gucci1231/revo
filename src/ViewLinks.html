<!-- Chapter Links Management View -->
<div id="view-links" class="view-content">
  <!-- Header / Action Bar -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-200">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-blue-50 text-blue-600 text-sm">
          <i class="fa-solid fa-link"></i>
        </span>
        <h2 class="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">
          チャプター公式リンク集
        </h2>
        <span id="links-count-badge" class="ml-1 text-[11px] font-black px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 tabular-nums">
          0件
        </span>
      </div>
      <p class="text-xs sm:text-sm text-slate-500">
        定例会準備・1to1・ビジター招待・公式ポータル・チャプター運営に必要なすべてのリンクを統合
      </p>
    </div>
    
    <div class="flex items-center gap-2.5 shrink-0">
      <!-- Search Box -->
      <div class="relative w-full sm:w-64">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input 
          type="text" 
          id="links-search-input" 
          placeholder="リンク名・用途・URLで検索..." 
          oninput="handleLinkSearch(this.value)" 
          class="w-full text-xs pl-8 pr-7 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/20 text-slate-700 transition-all placeholder:text-slate-400"
        >
        <button 
          id="btn-clear-link-search" 
          type="button" 
          onclick="clearLinkSearch()" 
          class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 p-1 text-[11px] hidden transition-colors"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Edit Mode Toggle Button -->
      <button 
        type="button"
        id="btn-toggle-link-edit-mode"
        onclick="toggleLinkEditMode()" 
        class="px-3 py-2 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-all flex items-center gap-1.5 cursor-pointer shrink-0"
        title="並べ替え・編集・削除モードを切替"
      >
        <i class="fa-solid fa-pen text-[11px]" id="icon-link-edit-mode"></i>
        <span id="label-link-edit-mode">編集</span>
      </button>

      <!-- Add Category Button -->
      <button 
        type="button"
        id="btn-add-category"
        onclick="openCategoryModal()" 
        class="px-3 py-2 bg-white hover:bg-slate-50 border border-slate-200 active:scale-95 text-slate-700 text-xs font-bold rounded-xl shadow-2xs transition-all flex items-center gap-1.5 cursor-pointer shrink-0"
        title="新しいカテゴリーを作成"
      >
        <i class="fa-solid fa-folder-plus text-slate-500 text-[11px]"></i>
        <span class="hidden sm:inline">カテゴリ作成</span>
      </button>

      <!-- Add Link Button -->
      <button 
        type="button"
        id="btn-add-link"
        onclick="openLinkModal()" 
        class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs font-bold rounded-xl shadow-xs transition-all flex items-center gap-1.5 cursor-pointer shrink-0"
      >
        <i class="fa-solid fa-plus text-[11px]"></i>
        <span class="hidden sm:inline">リンクを追加</span>
        <span class="sm:hidden">追加</span>
      </button>
    </div>
  </div>

  <!-- Scope Segmented Control (Radical Minimalism) -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
    <div class="flex items-center gap-2 max-w-full overflow-x-auto scrollbar-none">
      <div class="bg-slate-100/80 p-1 rounded-2xl flex items-center gap-1 border border-slate-200/80 shrink-0" id="links-scope-tabs">
        <button 
          type="button" 
          onclick="setLinkScope('member')" 
          data-scope="member" 
          class="link-scope-tab active flex-1 min-w-[130px] py-2 px-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center gap-2 cursor-pointer bg-white text-blue-600 shadow-xs"
        >
          <i class="fa-solid fa-users text-xs"></i>
          <span>メンバー用 (日常・学び)</span>
        </button>
        <button 
          type="button" 
          onclick="setLinkScope('admin')" 
          data-scope="admin" 
          class="link-scope-tab flex-1 min-w-[110px] py-2 px-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center gap-2 cursor-pointer text-slate-600 hover:text-slate-800"
        >
          <i class="fa-solid fa-user-gear text-xs"></i>
          <span>役員・運営用</span>
        </button>
        <button 
          type="button" 
          onclick="setLinkScope('archive')" 
          data-scope="archive" 
          class="link-scope-tab py-2 px-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center gap-2 cursor-pointer text-slate-500 hover:text-slate-700 shrink-0"
        >
          <i class="fa-solid fa-box-archive text-xs"></i>
          <span>アーカイブ</span>
        </button>
        <button 
          type="button" 
          onclick="setLinkScope('all')" 
          data-scope="all" 
          class="link-scope-tab py-2 px-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center gap-2 cursor-pointer text-slate-500 hover:text-slate-700 shrink-0"
        >
          <span>すべて</span>
        </button>
      </div>

      <button 
        type="button" 
        id="btn-add-scope"
        onclick="openScopeModal()" 
        class="h-9 px-3 bg-white hover:bg-slate-50 text-slate-600 hover:text-blue-600 border border-slate-200 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-xs cursor-pointer shrink-0"
        title="所属スコープを追加・編集"
      >
        <i class="fa-solid fa-layer-group text-slate-400"></i>
        <span>+ スコープ</span>
      </button>
    </div>

    <!-- DnD Reorder Hint -->
    <div class="hidden lg:flex items-center gap-1.5 text-[11px] text-slate-400 font-medium select-none">
      <i class="fa-solid fa-grip-vertical text-slate-300"></i>
      <span>ドラッグ＆ドロップで優先順位を変更可能</span>
    </div>
  </div>

  <!-- Subcategory Filter Pills -->
  <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-6 scrollbar-none" id="links-category-filter">
    <!-- Populated dynamically based on active scope by JS -->
  </div>

  <!-- Nested Genre Links Container -->
  <div id="links-grid-container" class="space-y-4">
    <!-- Populated by JavaScript -->
    <div class="py-16 text-center text-slate-400 bg-white rounded-2xl border border-slate-200">
      <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-blue-600"></i>
      <p class="text-xs font-bold">リンク情報を取得中...</p>
    </div>
  </div>
</div>

<!-- Link Modal (Add / Edit) -->
<div id="modal-link-crud" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-xs transition-opacity duration-200" style="display: none;">
  <div class="bg-white rounded-2xl max-w-lg w-full mx-4 shadow-xl border border-slate-200 overflow-hidden transform transition-transform duration-200 scale-95" id="modal-link-container">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <h3 id="modal-link-title" class="text-base font-bold text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-link text-blue-600"></i>
        <span>リンクを追加</span>
      </h3>
      <button type="button" onclick="closeLinkModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
    <form id="form-link-crud" onsubmit="handleLinkSubmit(event)" class="p-6 space-y-4">
      <input type="hidden" id="link-field-id" value="">
      
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">タイトル <span class="text-red-500">*</span></label>
        <input type="text" id="link-field-title" required placeholder="例: みんなの1to1シート一覧" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">URL <span class="text-red-500">*</span></label>
        <input type="url" id="link-field-url" required placeholder="https://..." class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-bold text-slate-700">分類カテゴリ</label>
            <button type="button" onclick="openCategoryModal()" class="text-[11px] text-blue-600 hover:underline cursor-pointer">+ 新規</button>
          </div>
          <select id="link-field-category" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
            <option value="ビジター情報">🤝 ビジター情報</option>
            <option value="メンバー情報">👥 メンバー情報</option>
            <option value="日常・1to1">👥 日常・1to1</option>
            <option value="ビジター・入会">🤝 ビジター・入会</option>
            <option value="公式ポータル・学び">📚 公式ポータル・学び</option>
            <option value="役員・チャプター運営">⚙️ 役員・チャプター運営</option>
            <option value="アセット関連">📁 アセット関連</option>
            <option value="アーカイブ">🗄️ アーカイブ</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">表示順 (小さい順)</label>
          <input type="number" id="link-field-sort" value="0" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">アイコン (FontAwesome クラス)</label>
        <div class="flex items-center gap-2">
          <input type="text" id="link-field-icon" value="fa-solid fa-link" placeholder="fa-solid fa-link" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all" oninput="updateLinkIconPreview(this.value)">
          <div id="link-icon-preview" class="w-10 h-10 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 shrink-0">
            <i class="fa-solid fa-link"></i>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">説明・メモ</label>
        <textarea id="link-field-description" rows="2" placeholder="利用シーンや注意事項など" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all"></textarea>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" onclick="closeLinkModal()" class="px-4 py-2 text-xs sm:text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer">
          キャンセル
        </button>
        <button type="submit" id="btn-save-link" class="px-5 py-2 text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 active:scale-95 rounded-xl shadow-xs transition-all flex items-center gap-2 cursor-pointer">
          <i class="fa-solid fa-check"></i>
          <span>保存する</span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Category Modal (Add / Edit) -->
<div id="modal-category-crud" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-xs transition-opacity duration-200" style="display: none;">
  <div class="bg-white rounded-2xl max-w-md w-full mx-4 shadow-xl border border-slate-200 overflow-hidden transform transition-transform duration-200 scale-95" id="modal-category-container">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <h3 id="modal-category-title" class="text-base font-bold text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-folder-plus text-blue-600"></i>
        <span>カテゴリーを作成</span>
      </h3>
      <button type="button" onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
    <form id="form-category-crud" onsubmit="handleCategorySubmit(event)" class="p-6 space-y-4">
      <input type="hidden" id="category-field-id" value="">
      
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">カテゴリー名 <span class="text-red-500">*</span></label>
        <input type="text" id="category-field-name" required placeholder="例: メンバー情報、ビジター情報、企画等" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">所属スコープ</label>
          <select id="category-field-scope" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
            <option value="member">メンバー用 (日常・学び)</option>
            <option value="admin">役員・運営用</option>
            <option value="archive">アーカイブ</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">表示優先順 (小さい順)</label>
          <input type="number" id="category-field-sort" value="10" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">アイコン (FontAwesome クラス)</label>
        <div class="flex items-center gap-2">
          <input type="text" id="category-field-icon" value="fa-solid fa-folder" placeholder="fa-solid fa-folder" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all" oninput="updateCategoryIconPreview(this.value)">
          <div id="category-icon-preview" class="w-10 h-10 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 shrink-0">
            <i class="fa-solid fa-folder"></i>
          </div>
        </div>
      </div>

      <!-- Category List for quick management -->
      <div class="pt-2 border-t border-slate-100">
        <div class="flex items-center justify-between mb-2">
          <label class="block text-xs font-bold text-slate-600">登録済みカテゴリー一覧</label>
          <span class="text-[11px] text-slate-400">クリックで編集 / 削除</span>
        </div>
        <div id="category-modal-list" class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" onclick="closeCategoryModal()" class="px-4 py-2 text-xs sm:text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer">
          閉じる
        </button>
        <button type="submit" id="btn-save-category" class="px-5 py-2 text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 active:scale-95 rounded-xl shadow-xs transition-all flex items-center gap-2 cursor-pointer">
          <i class="fa-solid fa-check"></i>
          <span>保存する</span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Scope Modal (Add / Edit) -->
<div id="modal-scope-crud" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-xs transition-opacity duration-200" style="display: none;">
  <div class="bg-white rounded-2xl max-w-md w-full mx-4 shadow-xl border border-slate-200 overflow-hidden transform transition-transform duration-200 scale-95" id="modal-scope-container">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <h3 id="modal-scope-title" class="text-base font-bold text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-layer-group text-blue-600"></i>
        <span>所属スコープを追加・編集</span>
      </h3>
      <button type="button" onclick="closeScopeModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
    <form id="form-scope-crud" onsubmit="handleScopeSubmit(event)" class="p-6 space-y-4">
      <input type="hidden" id="scope-field-id" value="">
      
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">スコープ表示名 <span class="text-red-500">*</span></label>
        <input type="text" id="scope-field-name" required placeholder="例: ビジターホスト用、書記会計用 等" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">識別キー (ID)</label>
          <input type="text" id="scope-field-key" placeholder="英数字 (例: vh, team)" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">表示優先順 (小さい順)</label>
          <input type="number" id="scope-field-sort" value="10" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">アイコン (FontAwesome クラス)</label>
        <div class="flex items-center gap-2">
          <input type="text" id="scope-field-icon" value="fa-solid fa-layer-group" placeholder="fa-solid fa-folder" class="w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all" oninput="updateScopeIconPreview(this.value)">
          <div id="scope-icon-preview" class="w-10 h-10 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 shrink-0">
            <i class="fa-solid fa-layer-group"></i>
          </div>
        </div>
      </div>

      <!-- Scope List for quick management -->
      <div class="pt-2 border-t border-slate-100">
        <div class="flex items-center justify-between mb-2">
          <label class="block text-xs font-bold text-slate-600">登録済み所属スコープ</label>
          <span class="text-[11px] text-slate-400">クリックで編集</span>
        </div>
        <div id="scope-modal-list" class="space-y-1.5 max-h-36 overflow-y-auto pr-1">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" onclick="closeScopeModal()" class="px-4 py-2 text-xs sm:text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer">
          閉じる
        </button>
        <button type="submit" id="btn-save-scope" class="px-5 py-2 text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 active:scale-95 rounded-xl shadow-xs transition-all flex items-center gap-2 cursor-pointer">
          <i class="fa-solid fa-check"></i>
          <span>保存する</span>
        </button>
      </div>
    </form>
  </div>
</div>
