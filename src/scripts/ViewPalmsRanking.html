            <i class="fa-solid fa-chart-pie"></i>
          </button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

/**
 * Select a member directly into the simulator
 */
function selectMemberForPpwSim(name) {
  const sel = document.getElementById('ppw-sim-member-select');
  if (sel) {
    sel.value = name;
    runPpwGoalSimulation();
    // Smooth scroll into simulator
    sel.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

/**
 * Run PPW Goal Simulation for a selected member
 */
function runPpwGoalSimulation() {
  const sel = document.getElementById('ppw-sim-member-select');
  const container = document.getElementById('ppw-sim-result-container');
  if (!sel || !container) return;

  const memberName = sel.value;
  if (!memberName) {
    container.innerHTML = `
      <div class="text-center text-slate-400 py-4 text-xs">
        メンバーを選択するとシミュレーションが表示されます
      </div>
    `;
    return;
  }

  const m = currentPalmsRecords.find(r => r.member_name === memberName);
  if (!m) return;

  const currentPpw = Number(m.ppw) || 0;
  const currentRpw = Number(m.rpw) || 0;
  // 新しい会員は出席が始まった週からカウントした週数（m.weeks_count）を使用
  const weeks = Math.max(1, m.weeks_count || 1);
  const targetPpw = 2.0000;

  const totalPointsNeeded = targetPpw * weeks;
  const currentPoints = currentPpw * weeks;
  const gapPoints = Math.max(0, totalPointsNeeded - currentPoints);

  // Recommended Action Mix:
  // 1 Referral = 1.0 pt
  // 1 Visitor = 1.0 pt
  // 1 One-to-One = 0.5 pt
  const reqReferrals = Math.ceil(gapPoints * 0.5); // 50% from referrals
  const reqVisitors = Math.ceil(gapPoints * 0.25); // 25% from visitors
  const reqOto = Math.ceil((gapPoints - reqReferrals - reqVisitors) / 0.5); // balance from 1to1

  const isAchieved = currentPpw >= targetPpw;

  let planHtml = '';
  if (isAchieved) {
    planHtml = `
      <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-center">
        <i class="fa-solid fa-circle-check text-2xl text-emerald-500 mb-1"></i>
        <div class="text-sm font-black text-emerald-800">目標 PPW 2.0000 を達成中！</div>
        <p class="text-xs text-emerald-700 mt-1">
          現在値 <b>${currentPpw.toFixed(2)}</b> pt/週 (出席 ${weeks} 週${m.is_new_member ? '・新会員' : ''})。模範的な行動をぜひチャプター内で共有してください。
        </p>
      </div>
    `;
  } else {
    const basisLabel = m.is_new_member ? `新会員・出席${weeks}週目基準` : `出席${weeks}週基準`;
    planHtml = `
      <div class="space-y-3">
        <div class="flex items-center justify-between pb-2 border-b border-slate-200/60">
          <div>
            <div class="text-3xs font-bold uppercase tracking-wider text-slate-400">現在 ➔ 目標 <span class="ml-1 text-slate-500">(${basisLabel})</span></div>
            <div class="text-base font-black text-slate-900 tabular-nums">
              <span class="text-rose-600">${currentPpw.toFixed(2)}</span>
              <span class="text-slate-300 text-xs mx-1">/</span>
              <span class="text-blue-600">2.0000</span>
            </div>
          </div>
          <div class="text-right">
            <div class="text-3xs font-bold uppercase tracking-wider text-slate-400">必要ポイント</div>
            <div class="text-base font-black text-blue-600 tabular-nums">+${gapPoints.toFixed(1)} pt</div>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center text-xs">
          <div class="bg-white border border-slate-200 rounded-xl p-2.5">
            <div class="text-3xs font-bold text-slate-400">リファーラル</div>
            <div class="text-base font-black text-indigo-600 tabular-nums">+${Math.max(1, reqReferrals)} 件</div>
            <div class="text-3xs text-slate-400 mt-0.5">週 ${(Math.max(1, reqReferrals) / weeks).toFixed(1)} 件</div>
          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-2.5">
            <div class="text-3xs font-bold text-slate-400">ビジター</div>
            <div class="text-base font-black text-emerald-600 tabular-nums">+${Math.max(1, reqVisitors)} 名</div>
            <div class="text-3xs text-slate-400 mt-0.5">同行</div>
          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-2.5">
            <div class="text-3xs font-bold text-slate-400">1to1</div>
            <div class="text-base font-black text-amber-600 tabular-nums">+${Math.max(2, reqOto)} 回</div>
            <div class="text-3xs text-slate-400 mt-0.5">週 ${(Math.max(2, reqOto) / weeks).toFixed(1)} 回</div>
          </div>
        </div>
      </div>
    `;
  }

  container.innerHTML = planHtml;
}

/**
 * Copy PPW Goal Plan to clipboard for 1to1 or mentoring
 */
function copyPpwGoalPlanText() {
  const sel = document.getElementById('ppw-sim-member-select');
  if (!sel || !sel.value) {
    if (typeof showToast === 'function') showToast('シミュレーション対象のメンバーを選択してください', 'warning');
    return;
  }

  const memberName = sel.value;
  const m = currentPalmsRecords.find(r => r.member_name === memberName);
  if (!m) return;

  const currentPpw = (Number(m.ppw) || 0).toFixed(2);
  const weeks = Math.max(1, m.weeks_count || 1);
  const gapPoints = Math.max(0, (2.0 - Number(m.ppw)) * weeks);
  const reqRef = Math.max(1, Math.ceil(gapPoints * 0.5));
  const reqVis = Math.max(1, Math.ceil(gapPoints * 0.25));
  const reqOto = Math.max(2, Math.ceil((gapPoints - reqRef - reqVis) / 0.5));

  const text = `【PPW 2.0000 達成伴走プラン】
対象メンバー: ${memberName} 様
現在PPW: ${currentPpw} pt/週 (目標: 2.0000)
算出基準: 出席 ${weeks} 週間${m.is_new_member ? ' (新会員・出席開始週よりカウント)' : ''}

【推奨アクション】
・リファーラル提供: +${reqRef} 件
・ビジター招待: +${reqVis} 名
・1to1実施: +${reqOto} 回 (週 ${(reqOto / weeks).toFixed(1)} 回ペース)

※数字は評価ではなく、全員で豊かになるための改善目標です。一緒にクリアしていきましょう！`;

  navigator.clipboard.writeText(text).then(() => {
    if (typeof showToast === 'function') showToast('目標プランをクリップボードにコピーしました！', 'success');
  }).catch(() => {
    alert(text);
  });
}

let activeTrafficLightZone = 'all';

function filterTrafficLightZone(zone) {
  activeTrafficLightZone = zone;
  const pills = document.querySelectorAll('.tl-filter-pill');
  pills.forEach(p => {
    const isCurrent = p.getAttribute('data-zone') === zone;
    if (isCurrent) {
      p.className = 'tl-filter-pill active px-3 py-1.5 rounded-full text-xs font-bold transition-all cursor-pointer bg-slate-900 text-white shadow-2xs flex items-center gap-1.5';
    } else {
      p.className = 'tl-filter-pill px-3 py-1.5 rounded-full text-xs font-bold transition-all cursor-pointer bg-white text-slate-600 border border-slate-200 hover:border-slate-300 flex items-center gap-1.5';
    }
  });
  renderTrafficLightsGrid();
}

/**
 * Render Subview 3: Personal Traffic Lights (100pt Diagnosis Grid)
 * Apple Radical Minimalism Design
 */
function renderTrafficLightsGrid() {
  const container = document.getElementById('traffic-light-member-cards');
  if (!container || !currentPalmsRecords) return;

  // Sort by total score descending
  const sorted = [...currentPalmsRecords].sort((a, b) => (Number(b.total_score) || 0) - (Number(a.total_score) || 0));

  // Count metrics for summary card
  const totalCount = sorted.length;
  const greenCount = sorted.filter(m => (Number(m.total_score) || 0) >= 70).length;
  const yellowCount = sorted.filter(m => {
    const s = Number(m.total_score) || 0;
    return s >= 50 && s < 70;
  }).length;
  const redCount = sorted.filter(m => {
    const s = Number(m.total_score) || 0;
    return s >= 30 && s < 50;
  }).length;
  const greyCount = sorted.filter(m => (Number(m.total_score) || 0) < 30).length;

  const greenPct = totalCount > 0 ? Math.round((greenCount / totalCount) * 100) : 0;

  // Update summary header numbers
  const pctEl = document.getElementById('traffic-light-summary-green-pct');
  const gCountEl = document.getElementById('traffic-light-summary-green-count');
  const tCountEl = document.getElementById('traffic-light-summary-total-count');
  const cAllEl = document.getElementById('tl-count-all');
  const cGreenEl = document.getElementById('tl-count-green');
  const cYellowEl = document.getElementById('tl-count-yellow');
  const cRedEl = document.getElementById('tl-count-red');
  const cGreyEl = document.getElementById('tl-count-grey');

  if (pctEl) pctEl.textContent = `${greenPct}%`;
  if (gCountEl) gCountEl.textContent = greenCount;
  if (tCountEl) tCountEl.textContent = `/ ${totalCount}`;
  if (cAllEl) cAllEl.textContent = totalCount;
  if (cGreenEl) cGreenEl.textContent = greenCount;
  if (cYellowEl) cYellowEl.textContent = yellowCount;
  if (cRedEl) cRedEl.textContent = redCount;
  if (cGreyEl) cGreyEl.textContent = greyCount;

  // Sync donut chart if canvas exists
  if (typeof Chart !== 'undefined') {
    const donutCanvas = document.getElementById('chart-palms-donut');
    if (donutCanvas) {
      if (!palmsDonutChart) {
        const ctx = donutCanvas.getContext('2d');
        palmsDonutChart = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['グリーン', 'イエロー', 'レッド', 'グレー'],
            datasets: [{
              data: [greenCount, yellowCount, redCount, greyCount],
              backgroundColor: ['#10b981', '#f59e0b', '#f43f5e', '#cbd5e1'],
              hoverBackgroundColor: ['#059669', '#d97706', '#e11d48', '#94a3b8'],
              borderWidth: 2,
              borderColor: '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '80%',
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(item) {
                    const val = item.raw || 0;
                    const pct = totalCount > 0 ? Math.round((val / totalCount) * 100) : 0;
                    return ` ${item.label}: ${val}名 (${pct}%)`;
                  }
                }
              }
            }
          }
        });
      } else {
        palmsDonutChart.data.datasets[0].data = [greenCount, yellowCount, redCount, greyCount];
        palmsDonutChart.update();
      }
    }
  }

  // Filter records by selected zone
  const filtered = sorted.filter(m => {
    const s = Number(m.total_score) || 0;
    if (activeTrafficLightZone === 'green') return s >= 70;
    if (activeTrafficLightZone === 'yellow') return s >= 50 && s < 70;
    if (activeTrafficLightZone === 'red') return s >= 30 && s < 50;
    if (activeTrafficLightZone === 'grey') return s < 30;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="col-span-full p-8 text-center text-slate-400 bg-white border border-slate-200/80 rounded-2xl">
        <p class="text-xs font-bold">該当するメンバーはいません</p>
      </div>
    `;
    return;
  }

  // Helper for mini equalizer bar (Apple Activity Bar Style)
  const renderMiniBar = (val, max, label, title) => {
    const v = Number(val) || 0;
    const ratio = Math.min(1, Math.max(0, v / max));
    const pct = Math.round(ratio * 100);
    let color = 'bg-slate-300';
    if (ratio >= 0.8) color = 'bg-emerald-500';
    else if (ratio >= 0.5) color = 'bg-amber-500';
    else if (ratio > 0) color = 'bg-rose-500';

    return `
      <div class="flex flex-col items-center gap-1 group/bar" title="${title}: ${v}/${max}pt (${pct}%)">
        <div class="w-full bg-slate-100 rounded-full h-8 flex items-end p-0.5 overflow-hidden">
          <div class="w-full ${color} rounded-full transition-all duration-300" style="height: ${Math.max(12, pct)}%;"></div>
        </div>
        <span class="text-3xs font-black text-slate-400 group-hover/bar:text-slate-700 tracking-tighter leading-none">${label}</span>
      </div>
    `;
  };

  let html = '';
  filtered.forEach(m => {
    const tl = m.trafficLight || {};
    const scores = tl.scores || {};
    const memberNameSafe = (m.member_name || '').replace(/'/g, "\\'");
    const currentScore = Number(m.total_score) || 0;

    let dotColor = 'bg-slate-300';
    if (currentScore >= 70) dotColor = 'bg-emerald-500 shadow-2xs shadow-emerald-500/50';
    else if (currentScore >= 50) dotColor = 'bg-amber-500 shadow-2xs shadow-amber-500/50';
    else if (currentScore >= 30) dotColor = 'bg-rose-500 shadow-2xs shadow-rose-500/50';

    html += `
      <div onclick="navigateToMemberPersonalDashboard('${memberNameSafe}', 'traffic')" class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-2xs hover:border-slate-300 hover:shadow-xs hover:-translate-y-0.5 transition-all cursor-pointer flex flex-col justify-between group">
        <div>
          <!-- Top Row: Avatar, Name, Category, Score & Status Dot -->
          <div class="flex items-start justify-between gap-2.5 mb-3">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-8 h-8 rounded-xl bg-slate-100 text-slate-700 font-black text-xs flex items-center justify-center shrink-0 group-hover:bg-blue-50 group-hover:text-blue-600 transition-colors">
                ${m.member_name ? m.member_name.charAt(0) : '名'}
              </div>
              <div class="min-w-0">
                <div class="text-xs font-black text-slate-900 group-hover:text-blue-600 truncate transition-colors">
                  ${m.member_name}
                </div>
                <div class="text-3xs text-slate-400 font-semibold truncate">
                  ${m.member_category || 'メンバー'}
                </div>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <span class="text-lg font-black text-slate-900 tabular-nums tracking-tight">${currentScore}</span>
              <span class="w-2.5 h-2.5 rounded-full ${dotColor}"></span>
            </div>
          </div>

          <!-- 7-Metric Visual Equalizer (Apple Activity Bar Style, Radical Minimalism) -->
          <div class="bg-slate-50/70 rounded-xl p-2">
            <div class="grid grid-cols-7 gap-1 items-end">
              ${renderMiniBar(scores.referral, 25, 'REF', 'リファーラル')}
              ${renderMiniBar(scores.visitor, 25, 'VIS', 'ビジター')}
              ${renderMiniBar(scores.one_to_ones, 20, '1:1', '1to1')}
              ${renderMiniBar(scores.ceu, 10, 'CEU', 'CEU')}
              ${renderMiniBar(scores.attendance, 10, 'ATT', '出席')}
              ${renderMiniBar(scores.tyfcb, 5, 'TYF', 'TYFCB')}
              ${renderMiniBar(scores.sponsor, 5, 'SPO', '推薦/スポンサー')}
            </div>
          </div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

/**
 * Render Subview 5: Chapter Traffic Lights Matrix
 */
function renderChapterTrafficView() {
  if (!currentPalmsRecords || currentPalmsRecords.length === 0) return;

  const memberCount = currentPalmsRecords.length;
  const weeks = Math.max(1, currentPalmsRecords[0].weeks_count || 4);

  let totalPresent = 0;
  let totalPalms = 0;
  let totalRef = 0;
  let totalVis = 0;

  currentPalmsRecords.forEach(r => {
    totalPresent += (Number(r.p_present) || 0) + (Number(r.s_substitute) || 0);
    totalPalms += (Number(r.p_present) || 0) + (Number(r.a_absent) || 0) + (Number(r.l_late) || 0) + (Number(r.m_medical) || 0) + (Number(r.s_substitute) || 0);
    totalRef += (Number(r.rgi_referrals_given_internal) || 0) + (Number(r.rgo_referrals_given_external) || 0);
    totalVis += (Number(r.v_visitors) || 0);
  });

  // チャプターRPWおよびビジター月平均は各メンバーの活動週数に基づく数値の平均として算出
  const sumMemberRpw = currentPalmsRecords.reduce((acc, r) => acc + (Number(r.rpw) || 0), 0);
  const rpw = memberCount > 0 ? (sumMemberRpw / memberCount).toFixed(2) : '1.25';
  
  const sumVisMonth = currentPalmsRecords.reduce((acc, r) => {
    const mW = Math.max(1, r.weeks_count || 1);
    return acc + ((Number(r.v_visitors) || 0) / mW * 4);
  }, 0);
  const visitorsPerMember = memberCount > 0 ? (sumVisMonth / memberCount).toFixed(2) : '0.50';

  const sizeEl = document.getElementById('chapter-metric-size');
  const attEl = document.getElementById('chapter-metric-attendance');
  const rpwEl = document.getElementById('chapter-metric-rpw');
  const visEl = document.getElementById('chapter-metric-visitors');

  if (sizeEl) sizeEl.textContent = memberCount;
  if (attEl) attEl.textContent = attendanceRate;
  if (rpwEl) rpwEl.textContent = rpw;
  if (visEl) visEl.textContent = visitorsPerMember;
}
