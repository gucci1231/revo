<script>
  /* --- VIEW 4: Hearing Sheets List View Controller --- */
  function renderHearingListTable(records) {
    const tbody = document.getElementById('table-hearing-list') || document.getElementById('table-hearings');
    const cardsContainer = document.getElementById('cards-hearing-list');

    if (tbody) tbody.innerHTML = '';
    if (cardsContainer) cardsContainer.innerHTML = '';

    if (!records || records.length === 0) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; color: #868e96; padding: 24px;">登録されているヒアリングシートはありません</td></tr>';
      if (cardsContainer) {
        cardsContainer.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #868e96; padding: 36px 16px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1;">
            <i class="fa-solid fa-file-lines text-2xl text-slate-300 mb-2"></i>
            <div class="font-bold text-sm text-slate-600">登録されているヒアリングシートはありません</div>
          </div>
        `;
      }
      return;
    }

    records.forEach((h, idx) => {
      const vid = h.id || h.visitorId;

      // 1. PCテーブル行
      if (tbody) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.onclick = function(e) {
          if (e.target.closest('button') || e.target.closest('a')) return;
          openVisitorDetailView(vid);
        };

        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td><strong style="color:#2b8a3e;">${formatTruncatedCell(h.eventDate, 10)}</strong></td>
          <td>${renderVisitorNameLinkHtml(vid, h.name)}</td>
          <td>${formatTruncatedCell(h.company, 12)} / ${formatTruncatedCell(h.profession, 12)}</td>
          <td>${formatTruncatedCell(h.inviter, 10)}</td>
          <td>${formatTruncatedCell(h.orientUser, 10)}</td>
          <td class="text-center">${renderRankBadgeHtml(h.feelAbc)}</td>
          <td><div style="font-size:12px; max-width:180px; white-space:normal;">${formatTruncatedCell(h.q1, 30)}</div></td>
          <td><div style="font-size:12px; max-width:180px; white-space:normal;">${formatTruncatedCell(h.orientMemo || h.followMemo, 30)}</div></td>
          <td class="text-center">
            <div class="flex items-center justify-center gap-1">
              <button class="btn-icon-action" onclick="event.stopPropagation(); openHearingFormModal('${vid}')" title="ヒアリング編集"><i class="fa-solid fa-pen"></i></button>
              <button type="button" class="btn-action-secondary vd-quick-chip" onclick="event.stopPropagation(); openVisitorDetailView('${vid}')">詳細</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      }

      // 2. スマホカード
      if (cardsContainer) {
        const card = document.createElement('div');
        card.className = 'dash-ap-card';
        card.onclick = function() {
          openVisitorDetailView(vid);
        };

        const memoSnippet = h.orientMemo || h.followMemo || h.q1 || '';

        card.innerHTML = `
          <div class="dash-ap-card-header">
            <div class="dash-ap-card-badges flex-wrap gap-1">
              <span class="badge" style="background:#f1f5f9; color:#475569; font-weight:800; font-size:10px; padding:2px 6px;">No.${idx + 1}</span>
              <span class="badge" style="background:#e6fcf5; color:#0ca678; font-weight:800; font-size:10px; padding:2px 6px;">${escapeHtml(h.eventDate || '-')}</span>
              ${renderRankBadgeHtml(h.feelAbc)}
            </div>
            <div class="flex items-center gap-1">
              <button type="button" class="btn-icon-action" style="padding:3px 6px;" onclick="event.stopPropagation(); openHearingFormModal('${vid}')" title="ヒアリング編集">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
              <button type="button" class="btn-action-secondary vd-quick-chip" style="font-size:10px; padding:2px 8px;" onclick="event.stopPropagation(); openVisitorDetailView('${vid}')">
                詳細 <i class="fa-solid fa-chevron-right text-[8px]"></i>
              </button>
            </div>
          </div>

          <div class="dash-ap-card-visitor">
            <i class="fa-solid fa-user-tag text-emerald-600 text-xs"></i>
            <span>${escapeHtml(h.name || 'ビジター No.' + vid)}</span>
          </div>

          <div style="font-size: 11px; color: #64748b;">
            ${escapeHtml(h.company || '-')} ${h.profession ? ` / ${escapeHtml(h.profession)}` : ''}
          </div>

          <div style="font-size: 11px; color: #475569; display: flex; gap: 8px; flex-wrap: wrap;">
            <span><strong>招待:</strong> ${escapeHtml(h.inviter || '-')}</span>
            ${h.orientUser ? `<span><strong>担当:</strong> <span style="color:#5f3dc4; font-weight:700;">${escapeHtml(h.orientUser)}</span></span>` : ''}
          </div>

          ${memoSnippet ? `
            <div style="font-size: 11px; color: #334155; background: #fff9db; border-left: 3px solid #fab005; padding: 6px 10px; border-radius: 6px; line-height: 1.4;">
              ${escapeHtml(memoSnippet)}
            </div>
          ` : ''}
        `;
        cardsContainer.appendChild(card);
      }
    });
  }
</script>
