<script>
  /* --- 👤 Member Personal Dashboard Logic (Radical Minimalism & Apple-Style Clean Slate) --- */
  let currentSelectedMemberName = '';
  let currentMemberVisitorsFilter = 'all';
  let isAllMembersSummaryView = false;

  function initMemberDashboard(targetMemberName = null) {
    const promises = [];
    
    // メンバーマスターデータのキャッシュ確認
    if ((!cachedFlatMembers || cachedFlatMembers.length === 0) && typeof fetchMembersMasterData === 'function') {
      promises.push(fetchMembersMasterData(false));
    }

    // 全ビジターデータのキャッシュ確認
    if ((!cachedAllVisitors || cachedAllVisitors.length === 0) && typeof fetchAllVisitorsData === 'function') {
      promises.push(fetchAllVisitorsData(false));
    }

    if (promises.length > 0) {
      Promise.all(promises).then(() => {
        populateMemberDashDropdown();
        setupMemberDashboardView(targetMemberName);
      }).catch(() => {
        populateMemberDashDropdown();
        setupMemberDashboardView(targetMemberName);
      });
    } else {
      populateMemberDashDropdown();
      setupMemberDashboardView(targetMemberName);
    }
  }

  function populateMemberDashDropdown() {
    const select = document.getElementById('member-dash-select');
    if (!select) return;

    const members = typeof getFlatMemberList === 'function' ? getFlatMemberList() : [];
    const prevVal = select.value || currentSelectedMemberName;

    let html = '<option value="">メンバーを選択...</option>';
    members.forEach(m => {
      const mName = (m.name || '').trim();
      const cat = m.category ? ` (${m.category})` : '';
      html += `<option value="${escapeHtml(mName)}">${escapeHtml(mName)}${escapeHtml(cat)}</option>`;
    });

    select.innerHTML = html;
    if (prevVal) select.value = prevVal;
  }

  function getMemberNameFromUrl() {
    // 1. Pathname (/member/川口陽平)
    try {
      const pathname = decodeURIComponent(window.location.pathname || '');
      const pathMatch = pathname.match(/\/member\/([^\/\?#]+)/);
      if (pathMatch && pathMatch[1]) {
        return pathMatch[1].trim();
      }
    } catch(e) {}

    // 2. Query Params (?member=... or ?m=...)
    try {
      const searchParams = new URLSearchParams(window.location.search);
      const qMember = searchParams.get('member') || searchParams.get('m') || searchParams.get('name');
      if (qMember) return decodeURIComponent(qMember).trim();
    } catch(e) {}

    // 3. Hash (#member/川口陽平 or #member-dashboard?name=...)
    try {
      const hash = decodeURIComponent(window.location.hash || '').replace(/^#+/, '');
      if (hash.startsWith('member/')) {
        return hash.replace('member/', '').split('?')[0].trim();
      }
      const match = hash.match(/[?&]name=([^&]+)/);
      if (match && match[1]) {
        return match[1].trim();
      }
    } catch(e) {}

    return null;
  }

  function setupMemberDashboardView(targetMemberName = null) {
    populateMemberDashDropdown();

    let nameToSelect = targetMemberName || getMemberNameFromUrl();

    if (nameToSelect) {
      const found = typeof findMemberByName === 'function' ? findMemberByName(nameToSelect) : null;
      const finalName = found ? found.name : nameToSelect;
      selectMemberDashboard(finalName, false);
    } else if (currentSelectedMemberName) {
      selectMemberDashboard(currentSelectedMemberName, false);
    } else {
      showMemberDashEmpty();
    }
  }

  function onMemberDashSelectChange(val) {
    if (!val) {
      showMemberDashEmpty();
      if (window.history && window.history.pushState) {
        window.history.pushState(null, '', '/#settings');
      }
      return;
    }
    selectMemberDashboard(val, true);
  }

  function selectMemberDashboard(memberName, updateHistory = true) {
    if (!memberName) return;
    currentSelectedMemberName = memberName;

    if (isAllMembersSummaryView) {
      toggleAllMembersView(false);
    }

    const select = document.getElementById('member-dash-select');
    if (select && select.value !== memberName) {
      select.value = memberName;
    }

    if (updateHistory) {
      const cleanPath = '/member/' + encodeURIComponent(memberName);
      try {
        if (window.history && window.history.pushState) {
          window.history.pushState({ member: memberName }, '', cleanPath);
        } else {
          updateUrlHash(`member/${encodeURIComponent(memberName)}`);
        }
      } catch(e) {
        updateUrlHash(`member/${encodeURIComponent(memberName)}`);
      }
    }

    const members = typeof getFlatMemberList === 'function' ? getFlatMemberList() : [];
    const memberObj = members.find(m => (m.name || '').trim() === memberName) || { name: memberName, category: 'メンバー', profession: '' };

    renderMemberProfileHeader(memberObj);
    renderMemberDashboardData(memberName);
  }

  function showMemberDashEmpty() {
    currentSelectedMemberName = '';
    const emptyEl = document.getElementById('member-dash-empty');
    const contentEl = document.getElementById('member-dash-content');
    if (emptyEl) emptyEl.style.display = 'block';
    if (contentEl) contentEl.style.display = 'none';
  }

  function renderMemberProfileHeader(memberObj) {
    const emptyEl = document.getElementById('member-dash-empty');
    const contentEl = document.getElementById('member-dash-content');
    if (emptyEl) emptyEl.style.display = 'none';
    if (contentEl) contentEl.style.display = 'block';

    const nameEl = document.getElementById('member-dash-name');
    const catEl = document.getElementById('member-dash-category-badge');
    const profEl = document.getElementById('member-dash-profession');
    const avatarEl = document.getElementById('member-dash-avatar');

    const mName = memberObj.name || 'メンバー';
    if (nameEl) nameEl.innerText = mName;
    if (catEl) catEl.innerText = memberObj.category || 'メンバー';
    if (profEl) profEl.innerText = memberObj.profession || '';
    if (avatarEl) avatarEl.innerText = mName.slice(0, 1) || '名';
  }

  function getVisitorsByInviter(inviterName) {
    if (!inviterName || !cachedAllVisitors) return [];
    const cleanInviter = normalizeNameKey(inviterName);

    const rawMatched = cachedAllVisitors.filter(v => {
      const vInviter = (v.inviter || '').trim();
      if (!vInviter) return false;
      if (normalizeNameKey(vInviter) === cleanInviter) return true;
      if (typeof findMemberByName === 'function') {
        const found = findMemberByName(vInviter);
        if (found && (found.name === inviterName || normalizeNameKey(found.name) === cleanInviter)) {
          return true;
        }
      }
      return false;
    });

    // 同一人物（複数回申込・リピート参加）を1人として名寄せ統合
    if (typeof deduplicateVisitorListClient === 'function') {
      return deduplicateVisitorListClient(rawMatched);
    }
    return rawMatched;
  }

  function renderMemberDashboardData(memberName) {
    const visitors = getVisitorsByInviter(memberName);
    
    const totalVisitors = visitors.length;
    let joinedCount = 0;
    let activeCount = 0;
    const todoList = [];

    const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '/');

    visitors.forEach(v => {
      const joinVal = String(v.isJoined || '').trim();
      const isJoined = (joinVal === '入会' || joinVal === '入会済' || joinVal === '入会申請中' || joinVal === '済');
      const isDeclined = (joinVal === '辞退' || joinVal === '不参加' || joinVal === '見送り');

      if (isJoined) {
        joinedCount++;
      } else if (!isDeclined) {
        activeCount++;
      }

      if (v.nextActionText && v.nextActionDueDate) {
        const isOverdue = v.nextActionDueDate < todayStr;
        todoList.push({
          visitorId: v.id,
          visitorName: v.name,
          title: v.nextActionText,
          dueDate: v.nextActionDueDate,
          assignee: v.nextActionAssignee || memberName,
          isOverdue: isOverdue,
          actionType: v.nextActionType || 'フォロー',
          source: 'action_plan'
        });
      }

      if (v.eventDate && v.eventDate >= todayStr && (!v.isAttended || v.isAttended === '未')) {
        todoList.push({
          visitorId: v.id,
          visitorName: v.name,
          title: `定例会参加リマインド連絡 (Zoomリンク送付)`,
          dueDate: v.eventDate,
          assignee: memberName,
          isOverdue: false,
          actionType: 'リマインド',
          source: 'event_reminder'
        });
      }

      if (v.isAttended === '出席' && (!v.is1to1 || v.is1to1 === '未') && !isJoined && !isDeclined) {
        todoList.push({
          visitorId: v.id,
          visitorName: v.name,
          title: `お礼連絡 ＆ フォロー1to1日程調整`,
          dueDate: v.eventDate || todayStr,
          assignee: memberName,
          isOverdue: false,
          actionType: '1to1調整',
          source: 'follow_1to1'
        });
      }
    });

    const joinRate = totalVisitors > 0 ? Math.round((joinedCount / totalVisitors) * 100) : 0;

    const totalEl = document.getElementById('member-kpi-total-visitors');
    const joinedEl = document.getElementById('member-kpi-joined-count');
    const activeEl = document.getElementById('member-kpi-active-count');
    const todoEl = document.getElementById('member-kpi-todo-count');
    const todoDot = document.getElementById('member-kpi-todo-dot');
    const joinRateEl = document.getElementById('member-dash-join-rate');

    if (totalEl) totalEl.innerText = totalVisitors;
    if (joinedEl) joinedEl.innerText = joinedCount;
    if (activeEl) activeEl.innerText = activeCount;
    if (todoEl) todoEl.innerText = todoList.length;
    if (joinRateEl) joinRateEl.innerText = `${joinRate}%`;

    if (todoDot) {
      const hasOverdue = todoList.some(t => t.isOverdue);
      todoDot.className = 'kpi-status-dot ' + (hasOverdue ? 'red' : 'blue');
      todoDot.title = hasOverdue ? '期限切れアクションあり' : '正常';
    }

    renderMemberTodoList(todoList, memberName);
    renderMemberVisitorCards(visitors);
  }

  function renderMemberTodoList(todoList, memberName) {
    const listEl = document.getElementById('member-todo-list');
    const badgeEl = document.getElementById('member-todo-summary-badge');
    if (!listEl) return;

    if (badgeEl) badgeEl.innerText = `${todoList.length}`;

    if (todoList.length === 0) {
      listEl.innerHTML = `
        <div class="py-6 text-center text-xs font-bold text-slate-400">
          やり残しアクションはありません
        </div>
      `;
      return;
    }

    let html = '';
    todoList.forEach(todo => {
      const isOverdue = todo.isOverdue;
      const dateText = todo.dueDate ? todo.dueDate.replace(/^\d{4}\//, '') : '';

      html += `
        <div class="p-3 rounded-xl border ${isOverdue ? 'border-red-200 bg-red-50/20' : 'border-slate-200/80 bg-white'} flex items-center justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-2 mb-0.5">
              <span class="text-[10px] font-extrabold px-1.5 py-0.2 rounded border ${isOverdue ? 'bg-red-50 text-red-700 border-red-200' : 'bg-slate-100 text-slate-600 border-slate-200/60'}">
                ${escapeHtml(todo.actionType)}
              </span>
              <span class="text-xs font-extrabold text-slate-900 truncate">
                ${escapeHtml(todo.visitorName || 'ビジター')} 様
              </span>
            </div>
            <div class="text-xs text-slate-700 font-bold truncate">
              ${escapeHtml(todo.title)}
            </div>
            <div class="text-[10px] font-bold ${isOverdue ? 'text-red-600' : 'text-slate-400'} mt-0.5">
              期日: ${escapeHtml(dateText)} ${isOverdue ? '(期限切れ)' : ''}
            </div>
          </div>
          <div class="shrink-0">
            ${todo.visitorId ? `
              <button type="button" onclick="openVisitorDetailView('${escapeHtml(todo.visitorId)}')" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center text-xs border border-slate-200/60 transition-colors cursor-pointer" title="詳細">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            ` : ''}
          </div>
        </div>
      `;
    });

    listEl.innerHTML = html;
  }

  function filterMemberVisitors(filterType) {
    currentMemberVisitorsFilter = filterType;
    ['all', 'active', 'joined'].forEach(f => {
      const btn = document.getElementById('tab-mv-' + f);
      if (btn) {
        if (f === filterType) {
          btn.className = 'px-2.5 py-1 rounded-lg bg-white text-slate-900 shadow-2xs cursor-pointer';
        } else {
          btn.className = 'px-2.5 py-1 rounded-lg text-slate-500 hover:text-slate-900 cursor-pointer';
        }
      }
    });

    const visitors = getVisitorsByInviter(currentSelectedMemberName);
    renderMemberVisitorCards(visitors);
  }

  function renderMemberVisitorCards(visitors) {
    const gridEl = document.getElementById('member-visitor-cards-grid');
    const emptyEl = document.getElementById('member-visitor-empty');
    if (!gridEl) return;

    let filtered = visitors;
    if (currentMemberVisitorsFilter === 'active') {
      filtered = visitors.filter(v => {
        const j = String(v.isJoined || '').trim();
        return j !== '入会' && j !== '入会済' && j !== '済' && j !== '辞退' && j !== '不参加' && j !== '見送り';
      });
    } else if (currentMemberVisitorsFilter === 'joined') {
      filtered = visitors.filter(v => {
        const j = String(v.isJoined || '').trim();
        return j === '入会' || j === '入会済' || j === '入会申請中' || j === '済';
      });
    }

    if (filtered.length === 0) {
      gridEl.innerHTML = '';
      if (emptyEl) emptyEl.style.display = 'block';
      return;
    }

    if (emptyEl) emptyEl.style.display = 'none';

    let html = '';
    filtered.forEach(v => {
      if (typeof renderStandardVisitorCardHtml === 'function') {
        html += renderStandardVisitorCardHtml(v);
      } else {
        const dateStr = v.eventDate ? v.eventDate.replace(/^\d{4}\//, '') : '';
        html += `
          <div class="dash-ap-card" onclick="openVisitorDetailView('${escapeHtml(v.id)}')">
            <div class="dash-card-main-row">
              <div class="dash-card-left">
                ${renderRankBadgeHtml(v.feelAbc, 'large')}
                <div class="dash-card-info">
                  <div class="dash-card-name-row">
                    <span class="dash-card-name">${escapeHtml(v.name || 'ビジター')}</span>
                  </div>
                  <div class="dash-card-company">${escapeHtml(v.company || '')}</div>
                </div>
              </div>
              <div class="dash-card-right">
                <span class="dash-card-date-badge">${escapeHtml(dateStr)}</span>
                <span class="dash-card-chevron"><i class="fa-solid fa-chevron-right"></i></span>
              </div>
            </div>
          </div>
        `;
      }
    });

    gridEl.innerHTML = html;
  }

  function toggleAllMembersView(forceState = null) {
    if (forceState !== null) {
      isAllMembersSummaryView = forceState;
    } else {
      isAllMembersSummaryView = !isAllMembersSummaryView;
    }

    const singleContainer = document.getElementById('member-single-dash-container');
    const allContainer = document.getElementById('member-all-summary-container');
    const labelEl = document.getElementById('label-toggle-all-members');

    if (isAllMembersSummaryView) {
      if (singleContainer) singleContainer.style.display = 'none';
      if (allContainer) allContainer.style.display = 'block';
      if (labelEl) labelEl.innerText = '個別';
      renderAllMembersSummaryTable();
    } else {
      if (singleContainer) singleContainer.style.display = 'block';
      if (allContainer) allContainer.style.display = 'none';
      if (labelEl) labelEl.innerText = '全体';
      if (currentSelectedMemberName) {
        selectMemberDashboard(currentSelectedMemberName, false);
      }
    }
  }

  function renderAllMembersSummaryTable() {
    const tbody = document.getElementById('all-members-summary-tbody');
    if (!tbody) return;

    const searchInput = document.getElementById('all-members-search-input');
    const query = searchInput ? (searchInput.value || '').trim().toLowerCase() : '';

    const members = typeof getFlatMemberList === 'function' ? getFlatMemberList() : [];
    if (members.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-6 text-slate-400">メンバー情報がありません</td></tr>';
      return;
    }

    const summaryList = members.map(m => {
      const mName = (m.name || '').trim();
      const visitors = getVisitorsByInviter(mName);
      const totalVisitors = visitors.length;
      let joinedCount = 0;
      let activeCount = 0;
      let todoCount = 0;

      const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '/');

      visitors.forEach(v => {
        const joinVal = String(v.isJoined || '').trim();
        if (joinVal === '入会' || joinVal === '入会済' || joinVal === '入会申請中' || joinVal === '済') {
          joinedCount++;
        } else if (joinVal !== '辞退' && joinVal !== '不参加' && joinVal !== '見送り') {
          activeCount++;
        }

        if (v.nextActionText && v.nextActionDueDate) todoCount++;
        if (v.eventDate && v.eventDate >= todayStr && (!v.isAttended || v.isAttended === '未')) todoCount++;
      });

      const joinRate = totalVisitors > 0 ? Math.round((joinedCount / totalVisitors) * 100) : 0;

      return {
        name: mName,
        category: m.category || 'その他',
        profession: m.profession || '',
        totalVisitors,
        joinedCount,
        joinRate,
        activeCount,
        todoCount
      };
    });

    summaryList.sort((a, b) => b.totalVisitors - a.totalVisitors || b.joinedCount - a.joinedCount);

    let filtered = summaryList;
    if (query) {
      filtered = summaryList.filter(s => s.name.toLowerCase().includes(query) || s.category.toLowerCase().includes(query) || s.profession.toLowerCase().includes(query));
    }

    let html = '';
    filtered.forEach(s => {
      html += `
        <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="selectMemberFromSummaryTable('${escapeHtml(s.name)}')">
          <td class="py-2.5 px-3 font-extrabold text-slate-900 text-xs">
            ${escapeHtml(s.name)}
          </td>
          <td class="py-2.5 px-3 text-slate-500 font-bold text-[11px]">
            ${escapeHtml(s.category)}
          </td>
          <td class="py-2.5 px-3 text-center font-black text-slate-900 font-mono text-xs">${s.totalVisitors}</td>
          <td class="py-2.5 px-3 text-center font-black text-slate-900 font-mono text-xs">${s.joinedCount}</td>
          <td class="py-2.5 px-3 text-center font-bold text-slate-500 font-mono text-xs">${s.joinRate}%</td>
          <td class="py-2.5 px-3 text-center font-bold text-slate-700 font-mono text-xs">${s.activeCount}</td>
          <td class="py-2.5 px-3 text-center font-mono text-xs">
            ${s.todoCount > 0 ? `<span class="font-bold text-red-600">${s.todoCount}</span>` : '<span class="text-slate-300">-</span>'}
          </td>
          <td class="py-2.5 px-3 text-right">
            <i class="fa-solid fa-chevron-right text-slate-400 text-[10px]"></i>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  function selectMemberFromSummaryTable(memberName) {
    toggleAllMembersView(false);
    selectMemberDashboard(memberName, true);
  }

  function getMemberShareUrl(memberName) {
    const origin = window.location.origin;
    return `${origin}/member/${encodeURIComponent(memberName)}`;
  }

  function copyMemberDashUrl() {
    if (!currentSelectedMemberName) {
      showToast('メンバーを選択してください', 'warning');
      return;
    }

    const shareUrl = getMemberShareUrl(currentSelectedMemberName);
    navigator.clipboard.writeText(shareUrl).then(() => {
      showToast(`URLをコピーしました (${currentSelectedMemberName} 様)`, 'success');
    }).catch(() => {
      showToast('コピーに失敗しました', 'error');
    });
  }

  function copyMemberDashLineText() {
    if (!currentSelectedMemberName) {
      showToast('メンバーを選択してください', 'warning');
      return;
    }

    const visitors = getVisitorsByInviter(currentSelectedMemberName);
    const shareUrl = getMemberShareUrl(currentSelectedMemberName);

    let activeSummary = '';
    const activeVisitors = visitors.filter(v => {
      const j = String(v.isJoined || '').trim();
      return j !== '入会' && j !== '入会済' && j !== '済' && j !== '辞退' && j !== '不参加' && j !== '見送り';
    });

    if (activeVisitors.length > 0) {
      activeSummary = activeVisitors.map(v => `・${v.name} 様 (${v.feelAbc ? '温度感' + v.feelAbc : 'フォロー中'})`).join('\n');
    } else {
      activeSummary = '現在フォロー中のゲストはいません';
    }

    const text = `${currentSelectedMemberName}さん\nビジター招待ありがとうございます！\n\n最新フォロー状況・To-Doはこちら👇\n${shareUrl}\n\n【現在フォロー中のゲスト】\n${activeSummary}`;

    navigator.clipboard.writeText(text).then(() => {
      showToast('LINE共有文をコピーしました', 'success');
    }).catch(() => {
      showToast('コピーに失敗しました', 'error');
    });
  }
</script>
