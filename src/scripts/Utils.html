<script>
  function parseFeelAbc(val) {
    if (!val) return '';
    const s = String(val).toUpperCase().trim();
    if (s === 'A' || s === 'B' || s === 'C') return s;
    if (s.includes('A')) return 'A';
    if (s.includes('B')) return 'B';
    if (s.includes('C')) return 'C';
    return '';
  }

  function renderRankBadgeHtml(val) {
    const feel = parseFeelAbc(val);
    if (feel === 'A') {
      return '<span style="background:#ffe3e3; color:#c92a2a; padding:2px 8px; border-radius:10px; font-weight:800; font-size:12px;">A</span>';
    }
    if (feel === 'B') {
      return '<span style="background:#fff3bf; color:#e67700; padding:2px 8px; border-radius:10px; font-weight:800; font-size:12px;">B</span>';
    }
    if (feel === 'C') {
      return '<span style="background:#e9ecef; color:#495057; padding:2px 8px; border-radius:10px; font-weight:800; font-size:12px;">C</span>';
    }
    return '<span style="background:#e9ecef; color:#495057; padding:2px 8px; border-radius:10px; font-weight:800; font-size:12px;">-</span>';
  }

  function changeVisitorStatus(id, field, value) {
    const fieldLabels = {
      'isAttended': '出欠',
      'is1to1': '1to1',
      'isJoined': '入会'
    };
    const fieldName = fieldLabels[field] || field;
    showToast(`${fieldName}を【${value}】に変更中...`);

    ApiService.call('updateVisitorStatusApi', id, field, value)
      .then(res => {
        showToast(`✅ ${fieldName}を【${value}】に変更しました`);
        refreshAllActiveViews();
      })
      .catch(handleError);
  }

  function renderAttendButtonHtml(id, rawStatus) {
    const isAttended = (rawStatus === '参加' || rawStatus === '済' || rawStatus === true);
    const isAbsent = (rawStatus === '不参加');
    const val = isAttended ? '参加' : (isAbsent ? '不参加' : '未');
    const stateClass = isAttended ? 'state-attended' : (isAbsent ? 'state-absent' : '');
    return `
      <select class="status-select ${stateClass}" onclick="event.stopPropagation();" onchange="event.stopPropagation(); changeVisitorStatus('${id}', 'isAttended', this.value)" title="出欠ステータスを変更">
        <option value="未" ${val === '未' ? 'selected' : ''}>出欠: 未</option>
        <option value="参加" ${val === '参加' ? 'selected' : ''}>出欠: 参加</option>
        <option value="不参加" ${val === '不参加' ? 'selected' : ''}>出欠: 不参加</option>
      </select>
    `;
  }

  function render1to1ButtonHtml(id, rawStatus) {
    const isDone = (rawStatus === '済' || rawStatus === true);
    const isProgress = (rawStatus === '調整中');
    const val = isDone ? '済' : (isProgress ? '調整中' : '未');
    const stateClass = isDone ? 'state-done' : (isProgress ? 'state-progress' : '');
    return `
      <select class="status-select ${stateClass}" onclick="event.stopPropagation();" onchange="event.stopPropagation(); changeVisitorStatus('${id}', 'is1to1', this.value)" title="1to1ステータスを変更">
        <option value="未" ${val === '未' ? 'selected' : ''}>1to1: 未</option>
        <option value="済" ${val === '済' ? 'selected' : ''}>1to1: 済</option>
        <option value="調整中" ${val === '調整中' ? 'selected' : ''}>1to1: 調整中</option>
      </select>
    `;
  }

  function renderJoinedButtonHtml(id, rawStatus) {
    const isJoined = (rawStatus === '入会済' || rawStatus === '済' || rawStatus === '入会' || rawStatus === true);
    const isConsidering = (rawStatus === '検討中');
    const isRejected = (rawStatus === '見送り');
    const val = isJoined ? '入会済' : (isConsidering ? '検討中' : (isRejected ? '見送り' : '未'));
    const stateClass = isJoined ? 'state-joined' : (isConsidering ? 'state-considering' : (isRejected ? 'state-rejected' : ''));
    return `
      <select class="status-select ${stateClass}" onclick="event.stopPropagation();" onchange="event.stopPropagation(); changeVisitorStatus('${id}', 'isJoined', this.value)" title="入会ステータスを変更">
        <option value="未" ${val === '未' ? 'selected' : ''}>入会: 未</option>
        <option value="入会済" ${val === '入会済' ? 'selected' : ''}>入会: 済</option>
        <option value="検討中" ${val === '検討中' ? 'selected' : ''}>入会: 検討中</option>
        <option value="見送り" ${val === '見送り' ? 'selected' : ''}>入会: 見送り</option>
      </select>
    `;
  }

  function renderVisitorNameLinkHtml(id, name) {
    return `<a href="#visitor/${id}" onclick="openVisitorDetailView('${id}'); return false;" style="font-weight:800; color:#364fc7; text-decoration:underline;">${escapeHtml(name)}</a>`;
  }

  function formatEventDateWithElapsed(eventDate) {
    if (!eventDate) return '-';
    const clean = String(eventDate).replace(/\//g, '-').trim();
    const d = new Date(clean);
    if (isNaN(d.getTime())) return escapeHtml(eventDate);

    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffTime = now.getTime() - target.getTime();
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    let elapsedBadge = '';
    if (diffDays === 0) {
      elapsedBadge = '<span style="font-size:10px; font-weight:800; color:#2b8a3e; background:#d3f9d8; padding:1px 5px; border-radius:4px; margin-left:4px;">本日</span>';
    } else if (diffDays > 0) {
      const color = diffDays >= 28 ? '#c92a2a' : (diffDays >= 14 ? '#e67700' : '#495057');
      const bg = diffDays >= 28 ? '#ffe3e3' : (diffDays >= 14 ? '#fff3bf' : '#f1f5f9');
      elapsedBadge = `<span style="font-size:10px; font-weight:800; color:${color}; background:${bg}; padding:1px 5px; border-radius:4px; margin-left:4px;">${diffDays}日前</span>`;
    }

    const shortDate = eventDate.length >= 10 ? eventDate.substring(5) : eventDate;
    return `<div><span style="font-weight:700;">${escapeHtml(shortDate)}</span>${elapsedBadge}</div>`;
  }

  function isVisitorActionCompleted(r) {
    if (!r) return false;
    const ap = r.latestActionPlan;
    return !!(ap && Number(ap.is_completed) === 1);
  }

  function renderCurrentStatusColumnHtml(r) {
    const ap = r.latestActionPlan;
    if (ap) {
      const isCompleted = Number(ap.is_completed) === 1;
      const todayStr = new Date().toISOString().slice(0, 10);
      const isOverdue = !isCompleted && ap.due_date && ap.due_date < todayStr;
      const dateBadge = `<span class="vd-ap-badge-date ${isOverdue ? 'overdue' : ''}" style="font-size:10px; padding:1px 6px;"><i class="fa-regular fa-calendar"></i> ${ap.due_date || '期日未定'}</span>`;
      const userBadge = ap.assignee_name ? `<span class="vd-ap-badge-user" style="font-size:10px; padding:1px 6px;"><i class="fa-regular fa-user"></i> ${escapeHtml(ap.assignee_name)}</span>` : '';
      const textStyle = isCompleted ? 'color:#868e96; text-decoration:line-through;' : 'color:#1e293b; font-weight:700;';

      const reportSnippet = ap.report_text
        ? `<div style="font-size:11px; color:#0ca678; background:#e6fcf5; padding:2px 6px; border-radius:4px; margin-top:2px;">
             <strong>報告:</strong> ${escapeHtml(ap.report_text)}
           </div>`
        : '';

      return `
        <div style="display:flex; flex-direction:column; gap:2px; max-width:280px;">
          <div style="display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
            <span style="font-size:11px; font-weight:800; color:${isCompleted ? '#2b8a3e' : '#228be6'};">
              ${isCompleted ? '✅ 完了アクション:' : '🎯 次の一手:'}
            </span>
            ${dateBadge}
            ${userBadge}
          </div>
          <div style="font-size:12px; line-height:1.3; ${textStyle}" title="${escapeHtml(ap.action_text)}">
            ${escapeHtml(ap.action_text)}
          </div>
          ${reportSnippet}
        </div>
      `;
    }

    const note = r.q7 || r.orientMemo || r.followMemo;
    if (note) {
      return `
        <div style="display:flex; flex-direction:column; gap:2px; max-width:280px;">
          <div style="font-size:11px; font-weight:800; color:#495057;">
            <i class="fa-regular fa-comment-dots" style="color:#868e96;"></i> 共有メモ / 提案状況:
          </div>
          <div style="font-size:12px; color:#475569; line-height:1.3;" title="${escapeHtml(note)}">
            ${formatTruncatedCell(note, 26)}
          </div>
        </div>
      `;
    }

    return `
      <button type="button" class="btn-action-secondary" style="padding: 2px 8px; font-size: 11px; font-weight: 700; color: #228be6;" onclick="openVisitorDetailView('${r.id}'); return false;">
        <i class="fa-solid fa-plus text-[10px]"></i> プランを登録
      </button>
    `;
  }

  function hideLoading() {
    const el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeJsParam(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '\\"')
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '');
  }

  function formatTruncatedCell(text, maxLen = 15) {
    if (!text) return '-';
    const str = String(text).trim();
    if (str.length <= maxLen) return escapeHtml(str);
    return `<span title="${escapeHtml(str)}">${escapeHtml(str.substring(0, maxLen))}...</span>`;
  }

  function formatDateForInput(str) {
    if (!str) return '';
    const clean = String(str).replace(/\//g, '-').trim();
    const match = clean.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (match) {
      const m = match[2].padStart(2, '0');
      const d = match[3].padStart(2, '0');
      return `${match[1]}-${m}-${d}`;
    }
    return clean;
  }

  function setCrudQuickDate(type) {
    const input = document.getElementById('crud-v-event-date');
    if (!input) return;

    const now = new Date();
    if (type === 'today') {
      input.value = formatDateForInput(now.toISOString().split('T')[0]);
    } else if (type === 'next-thu') {
      const day = now.getDay();
      const diff = (4 - day + 7) % 7 || 7;
      const nextThu = new Date(now);
      nextThu.setDate(now.getDate() + diff);
      const yyyy = nextThu.getFullYear();
      const mm = String(nextThu.getMonth() + 1).padStart(2, '0');
      const dd = String(nextThu.getDate()).padStart(2, '0');
      input.value = `${yyyy}-${mm}-${dd}`;
    }
  }

  function copyCurrentPageUrl() {
    let cleanUrl = window.location.href.split('?')[0];
    const rawHash = decodeURIComponent(window.location.hash || '');
    const hash = rawHash.replace(/^#+/, '');
    if (hash && hash !== 'dashboard') {
      cleanUrl += '#' + hash;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cleanUrl).then(() => {
        showToast('🔗 共有URLをコピーしました！');
      }).catch(() => {
        prompt('以下のURLをコピーしてシェアしてください:', cleanUrl);
      });
    } else {
      prompt('以下のURLをコピーしてシェアしてください:', cleanUrl);
    }
  }

  function showToast(msg) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#51cf66;"></i> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function handleError(err) {
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
    alert('エラーが発生しました: ' + (err.message || err));
  }
</script>
