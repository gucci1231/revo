<script>
  /* --- VIEW 4: Hearing Sheets List View Controller --- */
  function renderHearingListTable(records) {
    const tbody = document.getElementById('table-hearing-list') || document.getElementById('table-hearings');
    const cardsContainer = document.getElementById('cards-hearing-list');

    if (tbody) tbody.innerHTML = '';
    if (cardsContainer) cardsContainer.innerHTML = '';

    if (!records || records.length === 0) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; color: #868e96; padding: 24px;">登録されているヒアリングシートはありません</td></tr>';
      if (cardsContainer) {
        cardsContainer.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #868e96; padding: 36px 16px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1;">
            <i class="fa-solid fa-file-lines text-2xl text-slate-300 mb-2"></i>
            <div class="font-bold text-sm text-slate-600">登録されているヒアリングシートはありません</div>
          </div>
        `;
      }
      return;
    }

    records.forEach((h, idx) => {
      const vid = h.id || h.visitorId;

      // 1. PCテーブル行
      if (tbody) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.onclick = function(e) {
          if (e.target.closest('button') || e.target.closest('a')) return;
          openVisitorDetailView(vid);
        };

        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td><strong style="color: #0f172a;">${escapeHtml(formatShortDate(h.eventDate) || '-')}</strong></td>
          <td>${renderVisitorNameLinkHtml(vid, h.name)}</td>
          <td>${formatTruncatedCell(h.company, 12)} / ${formatTruncatedCell(h.profession, 12)}</td>
          <td>${formatTruncatedCell(h.inviter, 10)}</td>
          <td>${formatTruncatedCell(h.orientUser, 10)}</td>
          <td class="text-center">${renderRankBadgeHtml(h.feelAbc)}</td>
          <td><div style="font-size:12px; max-width:180px; white-space:normal;">${formatTruncatedCell(h.q1, 30)}</div></td>
          <td><div style="font-size:12px; max-width:180px; white-space:normal;">${formatTruncatedCell(h.orientMemo || h.followMemo, 30)}</div></td>
          <td class="text-center">
            <button class="btn-icon-action" onclick="event.stopPropagation(); openHearingFormModal('${vid}')" title="ヒアリング編集"><i class="fa-solid fa-pen"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      }

      // 2. スマホカード
      if (cardsContainer) {
        const card = document.createElement('div');
        card.className = 'dash-ap-card';
        card.onclick = function() {
          openVisitorDetailView(vid);
        };

        const memoSnippet = h.orientMemo || h.followMemo || h.q1 || '';

        card.innerHTML = `
          <div class="dash-card-main-row">
            <div class="dash-card-left">
              ${renderRankBadgeHtml(h.feelAbc, 'large')}
              <div class="dash-card-info">
                <div class="dash-card-name-row">
                  <span class="dash-card-name">${escapeHtml(h.name || 'ビジター No.' + vid)}</span>
                </div>
                <div class="dash-card-company">
                  ${escapeHtml(h.company || '-')}${h.profession ? ` / ${escapeHtml(h.profession)}` : ''}
                </div>
              </div>
            </div>

            <div class="dash-card-right">
              <span class="dash-card-date-badge">${escapeHtml(formatShortDate(h.eventDate) || '-')}</span>
              <span class="dash-card-chevron"><i class="fa-solid fa-chevron-right"></i></span>
            </div>
          </div>

          <div class="dash-card-bottom-row">
            <div class="dash-card-meta-left">
              <span><i class="fa-solid fa-user-plus text-rose-500 mr-1"></i>${escapeHtml(h.inviter || '-')}</span>
              ${h.orientUser ? `<span><i class="fa-solid fa-user-check text-indigo-500 mr-1"></i>${escapeHtml(h.orientUser)}</span>` : ''}
            </div>
          </div>

          ${memoSnippet ? `
            <div style="font-size: 11px; color: #334155; background: #fff9db; border-left: 3px solid #fab005; padding: 6px 10px; border-radius: 6px; line-height: 1.4; margin-top:2px;">
              ${escapeAndLinkify(memoSnippet, true)}
            </div>
          ` : ''}
        `;
        cardsContainer.appendChild(card);
      }
    });
  }
</script>
