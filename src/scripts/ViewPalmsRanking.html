<script>
/**
 * PALMS & BNI Traffic Lights View Controller (REvo OS Phase 2)
 * Full 100-Point Scoring System + PPW / RPW Analytics + Flexible Period Selection + Rich Chart.js
 */

let currentPalmsRecords = [];
let currentPalmsPeriodsList = [];
let currentPalmsMetric = 'total';
let currentPalmsSort = { field: 'total_score', asc: false };
let currentPalmsPeriod = { startDate: null, endDate: null };
let isPalmsSyncing = false;

// Chart.js Instances
let palmsDonutChart = null;
let palmsPpwChart = null;
let palmsRadarChart = null;
let palmsTrendChart = null;
let palmsDetailRadarChart = null;
let palmsChapterTrendsData = null;
let growthTrendGranularity = 'weekly';

/**
 * Human-friendly period label formatter
 */
function formatPalmsPeriodLabel(p) {
  const s = p.start_date;
  const e = p.end_date;
  if (s === '2024-10-01' && e === '2026-09-30') return `過去2年間累計 (2024/10〜2026/09) [${p.member_count}名]`;
  if (s === '2026-04-01' && e === '2026-09-30') return `直近第2期 6ヶ月 (2026/04〜2026/09) ★最新基準 [${p.member_count}名]`;
  if (s === '2025-10-01' && e === '2026-03-31') return `第1期後半 6ヶ月 (2025/10〜2026/03) [${p.member_count}名]`;
  if (s === '2025-04-01' && e === '2025-09-30') return `第1期前半 6ヶ月 (2025/04〜2025/09) [${p.member_count}名]`;
  if (s === '2026-08-27' && e === '2026-09-24') return `直近4週間 (2026/08/27〜09/24) [${p.member_count}名]`;
  if (s === '2026-09-17' && e === '2026-09-24') return `直近定例会 週次 (2026/09/17〜09/24) [${p.member_count}名]`;
  const sFmt = s.replace(/-/g, '/');
  const eFmt = e.replace(/-/g, '/');
  return `${sFmt} 〜 ${eFmt} (${p.member_count}名)`;
}

/**
 * --- GA4-Style Period Selection Modal Controller ---
 */
let palmsDateModalState = {
  start: null,
  end: null,
  activeField: 'end', // 'start' or 'end' (which date is being selected)
  hoverDate: null,
  viewYear: 2026,
  viewMonth: 8, // 0-indexed (8 = September)
  activePreset: '1month'
};

/**
 * Switch Active Date Input Field (Start or End)
 */
function setPalmsPickerActiveField(field) {
  palmsDateModalState.activeField = (field === 'start') ? 'start' : 'end';
  updatePalmsPickerTabsUi();
  renderPalmsModalCalendars();
}

/**
 * Update UI for Start / End Selector Tabs & Guide Text
 */
function updatePalmsPickerTabsUi() {
  const tabStart = document.getElementById('palms-picker-tab-start');
  const tabEnd = document.getElementById('palms-picker-tab-end');
  const guideText = document.getElementById('palms-picker-guide-text');

  const isStart = (palmsDateModalState.activeField === 'start');

  if (tabStart) {
    if (isStart) {
      tabStart.className = 'group flex items-center gap-2.5 px-3.5 py-2 rounded-xl border-2 border-blue-600 bg-blue-50/80 text-blue-900 transition-all cursor-pointer text-left shadow-2xs';
      const label = tabStart.querySelector('.text-3xs');
      if (label) label.className = 'text-3xs uppercase tracking-wider font-black text-blue-600';
    } else {
      tabStart.className = 'group flex items-center gap-2.5 px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:border-slate-300 text-slate-700 transition-all cursor-pointer text-left shadow-2xs';
      const label = tabStart.querySelector('.text-3xs');
      if (label) label.className = 'text-3xs uppercase tracking-wider font-bold text-slate-400';
    }
  }

  if (tabEnd) {
    if (!isStart) {
      tabEnd.className = 'group flex items-center gap-2.5 px-3.5 py-2 rounded-xl border-2 border-blue-600 bg-blue-50/80 text-blue-900 transition-all cursor-pointer text-left shadow-2xs';
      const label = tabEnd.querySelector('.text-3xs');
      if (label) label.className = 'text-3xs uppercase tracking-wider font-black text-blue-600';
    } else {
      tabEnd.className = 'group flex items-center gap-2.5 px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:border-slate-300 text-slate-700 transition-all cursor-pointer text-left shadow-2xs';
      const label = tabEnd.querySelector('.text-3xs');
      if (label) label.className = 'text-3xs uppercase tracking-wider font-bold text-slate-400';
    }
  }

  if (guideText) {
    guideText.textContent = isStart ? 'カレンダーをクリックして開始日を選択' : 'カレンダーをクリックして終了日を選択';
  }
}

/**
 * Format human-friendly label for the trigger button
 */
function updatePalmsPeriodDisplayLabel(s, e) {
  const labelEl = document.getElementById('palms-period-display-label');
  if (!labelEl) return;
  if (!s || !e) {
    labelEl.textContent = '期間を選択';
    return;
  }
  const sFmt = s.replace(/-/g, '/');
  const eFmt = e.replace(/-/g, '/');

  if (s === '2026-09-01' && e === '2026-09-30') {
    labelEl.textContent = `先月: 9月 (${sFmt}〜${eFmt})`;
  } else if (s === '2026-08-01' && e === '2026-08-31') {
    labelEl.textContent = `先々月: 8月 (${sFmt}〜${eFmt})`;
  } else if (s === '2026-07-01' && e === '2026-07-31') {
    labelEl.textContent = `7月 (${sFmt}〜${eFmt})`;
  } else if (s === '2026-06-01' && e === '2026-06-30') {
    labelEl.textContent = `6月 (${sFmt}〜${eFmt})`;
  } else if (s === '2026-05-01' && e === '2026-05-31') {
    labelEl.textContent = `5月 (${sFmt}〜${eFmt})`;
  } else if (s === '2026-04-01' && e === '2026-04-30') {
    labelEl.textContent = `4月 (${sFmt}〜${eFmt})`;
  } else if (s === '2026-04-01' && e === '2026-09-30') {
    labelEl.textContent = `半年: 直近第2期 (${sFmt}〜${eFmt})`;
  } else if (s === '2024-10-01' && e === '2026-09-30') {
    labelEl.textContent = `全期間: 過去2年通算 (${sFmt}〜${eFmt})`;
  } else if (s === '2026-08-27' && e === '2026-09-24') {
    labelEl.textContent = `直近4週間 (${sFmt}〜${eFmt})`;
  } else if (s === '2025-10-01' && e === '2026-03-31') {
    labelEl.textContent = `第1期後半 6ヶ月 (${sFmt}〜${eFmt})`;
  } else if (s === '2025-04-01' && e === '2025-09-30') {
    labelEl.textContent = `第1期前半 6ヶ月 (${sFmt}〜${eFmt})`;
  } else {
    const preset = detectPalmsActivePreset(s, e);
    if (preset === '1month') labelEl.textContent = `先月: 9月 (${sFmt}〜${eFmt})`;
    else if (preset === '2months') labelEl.textContent = `先々月: 8月 (${sFmt}〜${eFmt})`;
    else if (preset === '3months') labelEl.textContent = `7月 (${sFmt}〜${eFmt})`;
    else if (preset === '6months') labelEl.textContent = `半年 (${sFmt}〜${eFmt})`;
    else if (preset === 'all') labelEl.textContent = `全期間 (${sFmt}〜${eFmt})`;
    else labelEl.textContent = `${sFmt} 〜 ${eFmt}`;
  }
}

/**
 * Calculate Start & End Date for presets (1-Month Units & Terms)
 */
function calcPalmsPresetRange(presetKey) {
  let maxEnd = '2026-09-30';
  let minStart = '2024-10-01';

  if (Array.isArray(currentPalmsPeriodsList) && currentPalmsPeriodsList.length > 0) {
    const ends = currentPalmsPeriodsList.map(p => p.end_date).filter(Boolean).sort();
    const starts = currentPalmsPeriodsList.map(p => p.start_date).filter(Boolean).sort();
    if (ends.length) maxEnd = ends[ends.length - 1];
    if (starts.length) minStart = starts[0];
  }

  // 1-Month Units requested by user (先月=9月, 先々月=8月, 7月, 6月, 5月, 4月)
  if (presetKey === '1month' || presetKey === 'last_month') {
    return { start: '2026-09-01', end: '2026-09-30' };
  } else if (presetKey === '2months' || presetKey === 'two_months_ago') {
    return { start: '2026-08-01', end: '2026-08-31' };
  } else if (presetKey === '3months' || presetKey === 'month_7') {
    return { start: '2026-07-01', end: '2026-07-31' };
  } else if (presetKey === 'month_6') {
    return { start: '2026-06-01', end: '2026-06-30' };
  } else if (presetKey === 'month_5') {
    return { start: '2026-05-01', end: '2026-05-31' };
  } else if (presetKey === 'month_4') {
    return { start: '2026-04-01', end: '2026-04-30' };
  } else if (presetKey === '6months') {
    return { start: '2026-04-01', end: '2026-09-30' };
  } else if (presetKey === 'all') {
    return { start: minStart, end: maxEnd };
  }

  return { start: minStart, end: maxEnd };
}

/**
 * Detect which preset matches the given range
 */
function detectPalmsActivePreset(s, e) {
  if (!s || !e) return 'custom';
  if (s === '2026-09-01' && e === '2026-09-30') return '1month';
  if (s === '2026-08-01' && e === '2026-08-31') return '2months';
  if (s === '2026-07-01' && e === '2026-07-31') return '3months';
  if (s === '2026-06-01' && e === '2026-06-30') return 'month_6';
  if (s === '2026-05-01' && e === '2026-05-31') return 'month_5';
  if (s === '2026-04-01' && e === '2026-04-30') return 'month_4';
  if (s === '2026-04-01' && e === '2026-09-30') return '6months';
  if (s === '2024-10-01' && e === '2026-09-30') return 'all';

  // 4W fallback compatibility
  if (s === '2026-08-27' && e === '2026-09-24') return '1month';

  const pAll = calcPalmsPresetRange('all');
  if (s === pAll.start && e === pAll.end) return 'all';

  return 'custom';
}

/**
 * Open GA4-Style Date Range Modal
 */
function openPalmsDateModal() {
  const modal = document.getElementById('modal-palms-date-range');
  if (!modal) return;

  const s = currentPalmsPeriod.startDate || '2026-09-01';
  const e = currentPalmsPeriod.endDate || '2026-09-30';
  palmsDateModalState.start = s;
  palmsDateModalState.end = e;
  // Default active field is 'end' so clicking a date immediately sets the end date without clearing start!
  palmsDateModalState.activeField = 'end';
  palmsDateModalState.hoverDate = null;

  const endD = new Date(e + 'T00:00:00');
  palmsDateModalState.viewYear = !isNaN(endD.getFullYear()) ? endD.getFullYear() : 2026;
  palmsDateModalState.viewMonth = !isNaN(endD.getMonth()) ? endD.getMonth() : 8;

  palmsDateModalState.activePreset = detectPalmsActivePreset(s, e);

  syncPalmsModalInputs();
  updatePalmsModalSidebarActive(palmsDateModalState.activePreset);
  renderPalmsModalCalendars();

  modal.classList.remove('hidden');
}

/**
 * Close GA4-Style Date Range Modal
 */
function closePalmsDateModal() {
  const modal = document.getElementById('modal-palms-date-range');
  if (modal) modal.classList.add('hidden');
  palmsDateModalState.hoverDate = null;
}

/**
 * Synchronize inputs, displays and duration badge
 */
function syncPalmsModalInputs() {
  const startInput = document.getElementById('palms-modal-start');
  const endInput = document.getElementById('palms-modal-end');
  const startDisplay = document.getElementById('palms-modal-start-display');
  const endDisplay = document.getElementById('palms-modal-end-display');
  const badge = document.getElementById('palms-modal-duration-badge');

  const s = palmsDateModalState.start || '';
  const e = palmsDateModalState.end || '';

  if (startInput) startInput.value = s;
  if (endInput) endInput.value = e;

  if (startDisplay) startDisplay.textContent = s ? s.replace(/-/g, '/') : '開始日を選択';
  if (endDisplay) endDisplay.textContent = e ? e.replace(/-/g, '/') : '終了日を選択';

  if (badge) {
    if (s && e) {
      const d1 = new Date(s + 'T00:00:00');
      const d2 = new Date(e + 'T00:00:00');
      const days = Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
      badge.textContent = `${Math.max(1, days)} 日間`;
    } else if (s) {
      badge.textContent = '終了日を選択中';
    } else {
      badge.textContent = '-- 日間';
    }
  }

  updatePalmsPickerTabsUi();
}

/**
 * Update Sidebar Active Preset Highlight
 */
function updatePalmsModalSidebarActive(presetKey) {
  const items = document.querySelectorAll('#palms-modal-sidebar .palms-preset-item');
  items.forEach(item => {
    const key = item.getAttribute('data-preset-key');
    if (key === presetKey) {
      item.classList.add('active', 'bg-blue-50', 'text-blue-700', 'font-black');
      item.classList.remove('text-slate-700');
      const icon = item.querySelector('.check-icon');
      if (icon) icon.classList.remove('hidden');
    } else {
      item.classList.remove('active', 'bg-blue-50', 'text-blue-700', 'font-black');
      item.classList.add('text-slate-700');
      const icon = item.querySelector('.check-icon');
      if (icon) icon.classList.add('hidden');
    }
  });
}

/**
 * Preset selection from Sidebar
 */
function selectPalmsDatePreset(presetKey) {
  if (presetKey === 'custom') {
    palmsDateModalState.activePreset = 'custom';
    updatePalmsModalSidebarActive('custom');
    return;
  }

  const range = calcPalmsPresetRange(presetKey);
  palmsDateModalState.start = range.start;
  palmsDateModalState.end = range.end;
  palmsDateModalState.activeField = 'end';
  palmsDateModalState.hoverDate = null;
  palmsDateModalState.activePreset = presetKey;

  const endD = new Date(range.end + 'T00:00:00');
  palmsDateModalState.viewYear = endD.getFullYear();
  palmsDateModalState.viewMonth = endD.getMonth();

  syncPalmsModalInputs();
  updatePalmsModalSidebarActive(presetKey);
  renderPalmsModalCalendars();
}

/**
 * Input direct change event
 */
function onPalmsModalInputChange() {
  const sInput = document.getElementById('palms-modal-start');
  const eInput = document.getElementById('palms-modal-end');
  if (!sInput || !eInput) return;

  const s = sInput.value;
  const e = eInput.value;

  if (s && e) {
    if (s <= e) {
      palmsDateModalState.start = s;
      palmsDateModalState.end = e;
    } else {
      palmsDateModalState.start = e;
      palmsDateModalState.end = s;
    }
    palmsDateModalState.activeField = 'end';
    palmsDateModalState.activePreset = detectPalmsActivePreset(palmsDateModalState.start, palmsDateModalState.end);
    updatePalmsModalSidebarActive(palmsDateModalState.activePreset);
    syncPalmsModalInputs();
    renderPalmsModalCalendars();
  }
}

/**
 * Navigate Month (-1 or +1)
 */
function movePalmsCalendarMonth(delta) {
  palmsDateModalState.viewMonth += delta;
  if (palmsDateModalState.viewMonth < 0) {
    palmsDateModalState.viewYear--;
    palmsDateModalState.viewMonth = 11;
  } else if (palmsDateModalState.viewMonth > 11) {
    palmsDateModalState.viewYear++;
    palmsDateModalState.viewMonth = 0;
  }
  renderPalmsModalCalendars();
}

/**
 * Handle date click inside calendar:
 * If selecting start -> updates start, auto-advances to end
 * If selecting end -> updates end directly!
 */
function onPalmsCalendarDateClick(dateStr) {
  if (palmsDateModalState.activeField === 'start') {
    palmsDateModalState.start = dateStr;
    // If end exists and is before start, advance end to match start
    if (palmsDateModalState.end && dateStr > palmsDateModalState.end) {
      palmsDateModalState.end = dateStr;
    }
    // Auto-advance to end date selection
    palmsDateModalState.activeField = 'end';
  } else {
    // Selecting End Date
    if (palmsDateModalState.start && dateStr < palmsDateModalState.start) {
      // If clicked date is before start, gracefully swap them
      palmsDateModalState.end = palmsDateModalState.start;
      palmsDateModalState.start = dateStr;
    } else {
      palmsDateModalState.end = dateStr;
    }
  }

  palmsDateModalState.hoverDate = null;
  palmsDateModalState.activePreset = detectPalmsActivePreset(palmsDateModalState.start, palmsDateModalState.end);

  syncPalmsModalInputs();
  updatePalmsModalSidebarActive(palmsDateModalState.activePreset);
  renderPalmsModalCalendars();
}

/**
 * Handle date hover inside calendar for interactive range preview
 */
function onPalmsCalendarDateHover(dateStr) {
  if (!palmsDateModalState.start && !palmsDateModalState.end) return;
  palmsDateModalState.hoverDate = dateStr;
  renderPalmsModalCalendars();
}

/**
 * Render Both Left & Right Calendars
 */
function renderPalmsModalCalendars() {
  const rightY = palmsDateModalState.viewYear;
  const rightM = palmsDateModalState.viewMonth;

  let leftY = rightY;
  let leftM = rightM - 1;
  if (leftM < 0) {
    leftY--;
    leftM = 11;
  }

  const leftTitle = document.getElementById('palms-cal-left-title');
  const rightTitle = document.getElementById('palms-cal-right-title');
  if (leftTitle) leftTitle.textContent = `${leftY}年 ${leftM + 1}月`;
  if (rightTitle) rightTitle.textContent = `${rightY}年 ${rightM + 1}月`;

  renderSingleMonthGrid('palms-cal-left-grid', leftY, leftM);
  renderSingleMonthGrid('palms-cal-right-grid', rightY, rightM);
}

/**
 * Render single month days into container
 */
function renderSingleMonthGrid(containerId, year, month) {
  const container = document.getElementById(containerId);
  if (!container) return;

  container.innerHTML = '';

  const firstDay = new Date(year, month, 1).getDay(); // 0(Sun) - 6(Sat)
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // Range bounds
  const start = palmsDateModalState.start;
  const end = palmsDateModalState.end;
  const selectingEnd = palmsDateModalState.selectingEnd;
  const hoverDate = palmsDateModalState.hoverDate;

  // Empty cells before 1st day
  for (let i = 0; i < firstDay; i++) {
    const emptyCell = document.createElement('div');
    emptyCell.className = 'palms-cal-day empty';
    container.appendChild(emptyCell);
  }

  const todayStr = new Date().toISOString().split('T')[0];

  for (let day = 1; day <= daysInMonth; day++) {
    const dayStr = String(day).padStart(2, '0');
    const monthStr = String(month + 1).padStart(2, '0');
    const dateStr = `${year}-${monthStr}-${dayStr}`;

    const cell = document.createElement('div');
    cell.className = 'palms-cal-day';
    cell.textContent = day;
    cell.setAttribute('data-date', dateStr);

    let isStart = (start === dateStr);
    let isEnd = (end === dateStr);
    let isSingle = (isStart && isEnd);
    let isInRange = (start && end && dateStr > start && dateStr < end);

    // Hover preview handling based on activeField
    const activeField = palmsDateModalState.activeField;
    if (activeField === 'end' && start && hoverDate) {
      const minH = start < hoverDate ? start : hoverDate;
      const maxH = start < hoverDate ? hoverDate : start;
      if (dateStr === minH) isStart = true;
      if (dateStr === maxH) isEnd = true;
      if (dateStr > minH && dateStr < maxH) {
        cell.classList.add('hover-range');
      }
    } else if (activeField === 'start' && end && hoverDate) {
      const minH = end < hoverDate ? end : hoverDate;
      const maxH = end < hoverDate ? hoverDate : end;
      if (dateStr === minH) isStart = true;
      if (dateStr === maxH) isEnd = true;
      if (dateStr > minH && dateStr < maxH) {
        cell.classList.add('hover-range');
      }
    }

    if (isSingle) {
      cell.classList.add('range-single');
    } else if (isStart) {
      cell.classList.add('range-start');
    } else if (isEnd) {
      cell.classList.add('range-end');
    } else if (isInRange) {
      cell.classList.add('in-range');
    }

    if (dateStr === todayStr && !isStart && !isEnd && !isInRange) {
      cell.classList.add('font-bold', 'text-blue-600', 'underline');
    }

    cell.onclick = () => onPalmsCalendarDateClick(dateStr);
    cell.onmouseenter = () => onPalmsCalendarDateHover(dateStr);

    container.appendChild(cell);
  }
}

/**
 * Apply GA4-Style Selected Period
 */
function applyPalmsDateModal() {
  const s = palmsDateModalState.start;
  const e = palmsDateModalState.end;

  if (!s || !e) {
    showToast('開始日と終了日を両方指定してください', 'warning');
    return;
  }

  const sFin = s <= e ? s : e;
  const eFin = s <= e ? e : s;

  // Sync with compatibility inputs
  const startInput = document.getElementById('palms-custom-start');
  const endInput = document.getElementById('palms-custom-end');
  if (startInput) startInput.value = sFin;
  if (endInput) endInput.value = eFin;

  // Update dropdown if matching option exists
  const selectEl = document.getElementById('palms-period-select');
  if (selectEl) {
    const matchVal = `${sFin}_${eFin}`;
    for (let i = 0; i < selectEl.options.length; i++) {
      if (selectEl.options[i].value === matchVal) {
        selectEl.selectedIndex = i;
        break;
      }
    }
  }

  // Update display label
  updatePalmsPeriodDisplayLabel(sFin, eFin);

  // Close Modal
  closePalmsDateModal();

  // Check if period exists in DB
  const exists = currentPalmsPeriodsList.some(p => p.start_date === sFin && p.end_date === eFin);

  if (exists) {
    fetchPalmsRankingData(sFin, eFin);
  } else {
    // Sync via BNI Connect
    showToast(`BNI Connectより指定期間 (${sFin}〜${eFin}) を取得中...`, 'info');
    const partsS = sFin.split('-');
    const partsE = eFin.split('-');
    const bniStart = `${partsS[1]}/${partsS[2]}/${partsS[0]}`;
    const bniEnd = `${partsE[1]}/${partsE[2]}/${partsE[0]}`;

    ApiService.call('syncPalmsApi', bniStart, bniEnd)
      .then(res => {
        if (res && res.success) {
          showToast(res.message || '指定期間のデータを正常に取得しました', 'success');
          fetchPalmsPeriods();
        } else {
          showToast('データ取得に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
        }
      })
      .catch(err => {
        console.error('Custom sync error:', err);
        showToast('通信エラーが発生しました', 'error');
      });
  }
}


/**
 * Fetch list of available PALMS periods
 */
function fetchPalmsPeriods() {
  const selectEl = document.getElementById('palms-period-select');
  if (!selectEl) return;

  ApiService.call('getPalmsPeriodsApi')
    .then(res => {
      if (res && res.success && Array.isArray(res.periods) && res.periods.length > 0) {
        currentPalmsPeriodsList = res.periods;
        selectEl.innerHTML = '';
        
        // Priority order for default period: 2026-04-01_2026-09-30 (Latest 6M)
        let defaultVal = '';
        const pref6M = res.periods.find(p => p.start_date === '2026-04-01' && p.end_date === '2026-09-30');
        const pref4W = res.periods.find(p => p.start_date === '2026-08-27' && p.end_date === '2026-09-24');
        const pref2Y = res.periods.find(p => p.start_date === '2024-10-01' && p.end_date === '2026-09-30');
        
        if (pref6M) defaultVal = `${pref6M.start_date}_${pref6M.end_date}`;
        else if (pref4W) defaultVal = `${pref4W.start_date}_${pref4W.end_date}`;
        else if (pref2Y) defaultVal = `${pref2Y.start_date}_${pref2Y.end_date}`;
        else defaultVal = `${res.periods[0].start_date}_${res.periods[0].end_date}`;

        res.periods.forEach(p => {
          const opt = document.createElement('option');
          opt.value = `${p.start_date}_${p.end_date}`;
          opt.textContent = formatPalmsPeriodLabel(p);
          if (opt.value === defaultVal && !currentPalmsPeriod.startDate) {
            opt.selected = true;
          }
          selectEl.appendChild(opt);
        });

        // Trigger load for the selected period
        if (selectEl.value) {
          const [s, e] = selectEl.value.split('_');
          fetchPalmsRankingData(s, e);
        }
      } else {
        selectEl.innerHTML = '<option value="">登録期間なし</option>';
        fetchPalmsRankingData();
      }
    })
    .catch(err => {
      console.error('Failed to fetch PALMS periods:', err);
      selectEl.innerHTML = '<option value="">期間取得失敗</option>';
      fetchPalmsRankingData();
    });
}

/**

 */
function toggleCustomPeriodBar(forceState = null) {
  const bar = document.getElementById('palms-custom-period-bar');
  if (!bar) return;
  const isHidden = bar.classList.contains('hidden');
  const shouldShow = (forceState !== null) ? forceState : isHidden;

  if (shouldShow) {
    bar.classList.remove('hidden');

    const startInput = document.getElementById('palms-custom-start');

/**
 * Apply user-entered custom date range
 */
function applyCustomPalmsPeriod() {
  const startInput = document.getElementById('palms-custom-start');
  const endInput = document.getElementById('palms-custom-end');
  if (!startInput || !endInput || !startInput.value || !endInput.value) {
    showToast('開始日と終了日を両方入力してください', 'warning');
    return;
  }

  const s = startInput.value;
  const e = endInput.value;

  if (s > e) {
    showToast('開始日は終了日以前の日付を指定してください', 'warning');
    return;
  }

  // Check if period already exists in loaded periods
  const exists = currentPalmsPeriodsList.some(p => p.start_date === s && p.end_date === e);

  if (exists) {
    fetchPalmsRankingData(s, e);
    toggleCustomPeriodBar(false);
  } else {
    // Need to crawl / sync from BNI Connect for this specific date range
    showToast(`BNI Connectより指定期間 (${s}〜${e}) を取得中...`, 'info');
    
    // Format to MM/DD/YYYY for BNI Connect API
    const partsS = s.split('-');
    const partsE = e.split('-');
    const bniStart = `${partsS[1]}/${partsS[2]}/${partsS[0]}`;
    const bniEnd = `${partsE[1]}/${partsE[2]}/${partsE[0]}`;

    ApiService.call('syncPalmsApi', bniStart, bniEnd)
      .then(res => {
        if (res && res.success) {
          showToast(res.message || '指定期間のデータを正常に取得しました', 'success');
          toggleCustomPeriodBar(false);
          fetchPalmsPeriods();
        } else {
          showToast('データ取得に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
        }
      })
      .catch(err => {
        console.error('Custom sync error:', err);
        showToast('通信エラーが発生しました', 'error');
      });
  }
}

/**

    else if (key === 'term1_h1' && s === '2025-04-01' && e === '2025-09-30') match = true;

/**
 * Calculate BNI Traffic Lights Official 100-Point Score & PPW / RPW
 * Formula Source: BNI Member Traffic Lights Report (2025/10~) & Summary PALMS Report
 */
function calcBniTrafficLightScore(r, weeks) {
  // 出席データの抽出（r.p または r.p_present の双方に完全対応）
  const p = Number(r.p ?? r.p_present ?? 0);
  const a = Number(r.a ?? r.a_absent ?? 0);
  const l = Number(r.l ?? r.l_late ?? 0);
  const m = Number(r.m ?? r.m_medical ?? 0);
  const s = Number(r.s ?? r.s_substitute ?? 0);

  // Number of meeting weeks in period (W = P + A + L + M + S)
  // 新しい会員に関しては、期間の週数ではなく、出席が始まった週からのカウント（定例会参加週数＝P+A+L+M+S）で算出
  const meetingCount = p + a + l + m + s;
  const w = Math.max(1, meetingCount > 0 ? meetingCount : Math.round(Number(weeks) || 1));

  // --- RPW & PPW Metrics (Summary PALMS Standard) ---
  // RPW = (RGI + RGO) / W (Referrals Given per Week)
  const totalRefGiven = Number(r.total_referrals_given != null ? r.total_referrals_given : (Number(r.rgi ?? r.rgi_referrals_given_internal ?? 0) + Number(r.rgo ?? r.rgo_referrals_given_external ?? 0)));
  const rpw = totalRefGiven / w;

  // PPW = (RGI + RGO + Visitors + Testimonials/Sponsors) / W
  const sponsors = Number(r.testimonials ?? r.sponsors ?? 0);
  const visitors = Number(r.visitors ?? r.v_visitors ?? 0);
  const ppw = (totalRefGiven + visitors + sponsors) / w;

  // PPW Band Tier (Reference lines: 2.0000 and 1.0000)
  let ppwTier = 'low';
  let ppwTierLabel = '1.0未満 (要フォロー)';
  let ppwBadgeClass = 'bg-rose-50 text-rose-700 border-rose-200';
  let ppwDot = '⚠️';

  if (ppw >= 2.0) {
    ppwTier = 'high';
    ppwTierLabel = '2.0以上 (維持・共有)';
    ppwBadgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
    ppwDot = '🌟';
  } else if (ppw >= 1.0) {
    ppwTier = 'mid';
    ppwTierLabel = '1.0〜2.0 (具体化)';
    ppwBadgeClass = 'bg-blue-50 text-blue-700 border-blue-200';
    ppwDot = '🔹';
  }

  // --- 100-Point Traffic Light Scoring System ---
  // 1. Visitors in 6 Months (Max 25 pt)
  const vis6m = visitors * (26 / w);
  let scoreVisitor = 0;
  if (vis6m >= 5) scoreVisitor = 25;
  else if (vis6m >= 4) scoreVisitor = 20;
  else if (vis6m >= 3) scoreVisitor = 15;
  else if (vis6m >= 2) scoreVisitor = 10;
  else if (vis6m >= 1) scoreVisitor = 5;
  else scoreVisitor = 0;

  // 2. TYFCB Score in 6 Months (Max 5 pt)
  const tyfcb6m = (r.tyfcb_yen || 0) * (26 / w);
  let scoreTyfcb = 0;
  if (tyfcb6m >= 5700000) scoreTyfcb = 5;
  else if (tyfcb6m >= 2850000) scoreTyfcb = 4;
  else if (tyfcb6m >= 950000) scoreTyfcb = 3;
  else if (tyfcb6m >= 380000) scoreTyfcb = 2;
  else if (tyfcb6m > 0) scoreTyfcb = 1;
  else scoreTyfcb = 0;

  // 3. 1-2-1s Score Per Week (Max 20 pt)
  const otoPerWeek = (r.one_to_ones || 0) / w;
  let scoreOto = 0;
  if (otoPerWeek >= 1.00) scoreOto = 20;
  else if (otoPerWeek >= 0.75) scoreOto = 15;
  else if (otoPerWeek >= 0.50) scoreOto = 10;
  else if (otoPerWeek >= 0.25) scoreOto = 5;
  else scoreOto = 0;

  // 4. Referrals Given Per Week (Max 25 pt)
  const refPerWeek = rpw;
  let scoreReferral = 0;
  if (refPerWeek >= 1.25) scoreReferral = 25;
  else if (refPerWeek >= 1.00) scoreReferral = 20;
  else if (refPerWeek >= 0.75) scoreReferral = 15;
  else if (refPerWeek >= 0.50) scoreReferral = 10;
  else if (refPerWeek >= 0.25) scoreReferral = 5;
  else scoreReferral = 0;

  // 5. Members Sponsored in 6 Months (Max 5 pt)
  const scoreSponsor = (sponsors >= 1) ? 5 : 0;

  // 6. CEU Per Week (Max 10 pt)
  const ceuPerWeek = (r.ceu || 0) / w;
  let scoreCeu = 0;
  if (ceuPerWeek > 0.5) scoreCeu = 10;
  else if (ceuPerWeek > 0) scoreCeu = 5;
  else scoreCeu = 0;

  // 7. Attendance Rate (Max 10 pt)
  const attRate = meetingCount > 0 ? (((r.p || 0) + (r.s || 0)) / meetingCount) * 100 : 100;
  let scoreAttendance = 0;
  if (attRate >= 96) scoreAttendance = 10;
  else if (attRate >= 88) scoreAttendance = 5;
  else scoreAttendance = 0;

  // Total 100-Point Sum
  const totalScore = scoreVisitor + scoreTyfcb + scoreOto + scoreReferral + scoreSponsor + scoreCeu + scoreAttendance;

  // Traffic Light Color Tier
  let tier = 'grey';
  let tierName = 'グレー';
  let tierColor = '#64748b';
  let tierBg = '#f1f5f9';
  let tierBadgeClass = 'bg-slate-100 text-slate-700 border-slate-200';
  let tierDot = '⚪';
  let dotBg = 'bg-slate-400';

  if (totalScore >= 70) {
    tier = 'green';
    tierName = 'グリーン';
    tierColor = '#059669';
    tierBg = '#d1fae5';
    tierBadgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
    tierDot = '🟢';
    dotBg = 'bg-emerald-500';
  } else if (totalScore >= 50) {
    tier = 'yellow';
    tierName = 'イエロー';
    tierColor = '#d97706';
    tierBg = '#fef3c7';
    tierBadgeClass = 'bg-amber-50 text-amber-700 border-amber-200';
    tierDot = '🟡';
    dotBg = 'bg-amber-500';
  } else if (totalScore >= 30) {
    tier = 'red';
    tierName = 'レッド';
    tierColor = '#dc2626';
    tierBg = '#fee2e2';
    tierBadgeClass = 'bg-rose-50 text-rose-700 border-rose-200';
    tierDot = '🔴';
    dotBg = 'bg-rose-500';
  }

  return {
    totalScore,
    tier,
    tierName,
    tierColor,
    tierBg,
    tierBadgeClass,
    tierDot,
    dotBg,
    rpw,
    ppw,
    ppwTier,
    ppwTierLabel,
    ppwBadgeClass,
    ppwDot,
    weeksCount: w,
    memberWeeks: w,
    meetingCount,
    scores: {
      visitor: scoreVisitor,
      tyfcb: scoreTyfcb,
      one_to_ones: scoreOto,
      referral: scoreReferral,
      sponsor: scoreSponsor,
      ceu: scoreCeu,
      attendance: scoreAttendance
    },
    rates: {
      vis6m,
      tyfcb6m,
      otoPerWeek,
      refPerWeek,
      ceuPerWeek,
      attRate
    }
  };
}

/**
 * Helper to get semantic color class based on score achievement ratio
 * Green (>=80%), Yellow (>=50%), Red (<50%), Slate/Grey (0 or less)
 */
function getPalmsScoreColorClass(score, maxScore) {
  if (score == null || score <= 0) return 'text-slate-400 font-medium';
  const ratio = maxScore > 0 ? (score / maxScore) : 0;
  if (ratio >= 0.8) return 'text-emerald-600 font-bold';
  if (ratio >= 0.5) return 'text-amber-600 font-bold';
  return 'text-rose-600 font-bold';
}

/**
 * Fetch PALMS records for specified or latest period
 */
function fetchPalmsRankingData(startDate = null, endDate = null) {
  const podiumContainer = document.getElementById('palms-podium-container');
  const tableBody = document.getElementById('palms-table-body');
  
  if (podiumContainer) {
    podiumContainer.innerHTML = `
      <div class="col-span-full py-8 text-center text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
        <p class="text-xs">ランキングを集計中...</p>
      </div>
    `;
  }
  if (tableBody) {
    tableBody.innerHTML = `
      <tr>
        <td colspan="13" class="py-12 text-center text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-xl mb-2"></i>
          <p class="text-xs">データを読込中...</p>
        </td>
      </tr>
    `;
  }

  ApiService.call('getPalmsListApi', startDate, endDate)
    .then(res => {
      if (res && res.success) {
        currentPalmsPeriod = res.period || { startDate, endDate };
        
        // Calculate weeks in active period
        let weeks = 26; // Default to 26 weeks
        if (currentPalmsPeriod.startDate && currentPalmsPeriod.endDate) {
          const d1 = new Date(currentPalmsPeriod.startDate);
          const d2 = new Date(currentPalmsPeriod.endDate);
          const diffDays = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1);
          weeks = Math.max(1, diffDays / 7);

          const periodBadge = document.getElementById('palms-data-period-badge');
          if (periodBadge) {
            const s = currentPalmsPeriod.startDate.replace(/-/g, '/');
            const e = currentPalmsPeriod.endDate.replace(/-/g, '/');
            periodBadge.textContent = `集計期間: ${s} 〜 ${e} (約${Math.round(weeks)}週間)`;
          }

          updatePeriodPresetPillActive(currentPalmsPeriod.startDate, currentPalmsPeriod.endDate);
          updatePalmsPeriodDisplayLabel(currentPalmsPeriod.startDate, currentPalmsPeriod.endDate);
        }


        // Process records with BNI Traffic Light Scoring System
        const rawRecords = res.records || [];

        // チャプター全体の定例会開催週数を特定（既存メンバーの最大定例会回数）
        let chapterMaxMeetings = 0;
        rawRecords.forEach(r => {
          const mCount = Number(r.p_present || 0) + Number(r.a_absent || 0) + Number(r.l_late || 0) + Number(r.m_medical || 0) + Number(r.s_substitute || 0);
          if (mCount > chapterMaxMeetings) chapterMaxMeetings = mCount;
        });

        currentPalmsRecords = rawRecords.map(r => {
          const p = Number(r.p_present || 0);
          const a = Number(r.a_absent || 0);
          const l = Number(r.l_late || 0);
          const m = Number(r.m_medical || 0);
          const s = Number(r.s_substitute || 0);
          const rgi = Number(r.rgi_referrals_given_internal || 0);
          const rgo = Number(r.rgo_referrals_given_external || 0);
          const totalRefGiven = Number(r.total_referrals_given != null ? r.total_referrals_given : (rgi + rgo));
          const rri = Number(r.rri_referrals_received_internal || 0);
          const rro = Number(r.rro_referrals_received_external || 0);
          const totalRefReceived = Number(r.total_referrals_received != null ? r.total_referrals_received : (rri + rro));
          const visitors = Number(r.v_visitors || 0);
          const oto = Number(r.one_to_ones || 0);
          const tyfcbYen = Number(r.tyfcb_yen != null ? r.tyfcb_yen : (Number(r.tyfcb_amount || 0) * 1000));
          const ceu = Number(r.ceu || r.ceu_credits || 0);
          const sponsors = Number(r.testimonials || r.sponsors || 0);

          // 出席が始まった週からのカウント（定例会参加週数＝P+A+L+M+S）
          const memberAttendanceWeeks = (p + a + l + m + s);
          // 新会員に関しては出席が始まった週からカウントして算出（未出席の場合は期間週数）
          const memberWeeks = Math.max(1, memberAttendanceWeeks > 0 ? memberAttendanceWeeks : Math.round(weeks));
          // 新会員判定: 定例会開催数が一定以上あり、かつ出席週数がチャプター最大より少ない場合
          const isNewMember = chapterMaxMeetings >= 6 && memberAttendanceWeeks < chapterMaxMeetings;

          const parsed = {
            ...r,
            p, a, l, m, s,
            rgi, rgo,
            total_referrals_given: totalRefGiven,
            rri, rro,
            total_referrals_received: totalRefReceived,
            visitors,
            one_to_ones: oto,
            tyfcb_yen: tyfcbYen,
            ceu,
            sponsors,
            weeks_count: memberWeeks,
            attendance_weeks: memberAttendanceWeeks,
            is_new_member: isNewMember
          };

          const trafficLight = calcBniTrafficLightScore(parsed, weeks);

          return {
            ...parsed,
            trafficLight,
            total_score: trafficLight.totalScore,
            rpw: trafficLight.rpw,
            ppw: trafficLight.ppw,
            weeks_count: trafficLight.weeksCount || memberWeeks,
            attendance_weeks: memberAttendanceWeeks,
            is_new_member: isNewMember,
            tier: trafficLight.tier,
            tierName: trafficLight.tierName,
            tierColor: trafficLight.tierColor,
            tierDot: trafficLight.tierDot
          };
        });

        // Update member count badge
        const countBadge = document.getElementById('palms-member-count-badge');
        if (countBadge) countBadge.textContent = `${currentPalmsRecords.length}名`;

        // Render Overview KPIs & Charts & Tables
        renderPalmsKpiCards();
        renderPalmsCharts();
        renderPalmsRankingView();
      } else {
        renderPalmsEmptyState(res ? res.error : 'データ取得に失敗しました');
      }
    })
    .catch(err => {
      console.error('Failed to fetch PALMS ranking:', err);
      renderPalmsEmptyState('サーバー通信エラーが発生しました');
    });
}

/**
 * Render 5 KPI Overview Cards (including PPW and RPW)
 */
function renderPalmsKpiCards() {
  if (!currentPalmsRecords || currentPalmsRecords.length === 0) return;

  const totalMembers = currentPalmsRecords.length;
  const sumScore = currentPalmsRecords.reduce((acc, r) => acc + r.total_score, 0);
  const avgScore = totalMembers > 0 ? (sumScore / totalMembers).toFixed(1) : 0;

  // PPW & RPW Averages
  const sumPpw = currentPalmsRecords.reduce((acc, r) => acc + r.ppw, 0);
  const avgPpw = totalMembers > 0 ? (sumPpw / totalMembers).toFixed(2) : '0.00';

  const sumRpw = currentPalmsRecords.reduce((acc, r) => acc + r.rpw, 0);
  const avgRpw = totalMembers > 0 ? (sumRpw / totalMembers).toFixed(2) : '0.00';
  const totalRef = currentPalmsRecords.reduce((acc, r) => acc + r.total_referrals_given, 0);

  const ppwHighCount = currentPalmsRecords.filter(r => r.ppw >= 2.0).length;
  const ppwMidCount = currentPalmsRecords.filter(r => r.ppw >= 1.0 && r.ppw < 2.0).length;
  const ppwLowCount = currentPalmsRecords.filter(r => r.ppw < 1.0).length;

  const greenCount = currentPalmsRecords.filter(r => r.total_score >= 70).length;
  const yellowCount = currentPalmsRecords.filter(r => r.total_score >= 50 && r.total_score < 70).length;
  const redCount = currentPalmsRecords.filter(r => r.total_score < 50).length;

  const greenPct = totalMembers > 0 ? Math.round((greenCount / totalMembers) * 100) : 0;

  // DOM Updates
  const elAvgScore = document.getElementById('palms-kpi-avg-score');
  const elAvgTier = document.getElementById('palms-kpi-avg-tier');
  if (elAvgScore) elAvgScore.textContent = avgScore;
  if (elAvgTier) {
    if (avgScore >= 70) {
      elAvgTier.innerHTML = '<span class="inline-flex items-center gap-1 font-bold text-emerald-700" title="グリーン (70点以上)">🟢 70+ pt (優秀)</span>';
    } else if (avgScore >= 50) {
      elAvgTier.innerHTML = '<span class="inline-flex items-center gap-1 font-bold text-amber-700" title="イエロー (50-69点)">🟡 50-69 pt (標準)</span>';
    } else {
      elAvgTier.innerHTML = '<span class="inline-flex items-center gap-1 font-bold text-rose-700" title="レッド (<50点)">🔴 &lt;50 pt (要注力)</span>';
    }
  }

  const elAvgPpw = document.getElementById('palms-kpi-avg-ppw');
  const elPpwBreakdown = document.getElementById('palms-kpi-ppw-breakdown');
  if (elAvgPpw) elAvgPpw.textContent = avgPpw;
  if (elPpwBreakdown) {
    elPpwBreakdown.textContent = `2.0以上: ${ppwHighCount}名 / 1.0~2.0: ${ppwMidCount}名 / <1.0: ${ppwLowCount}名`;
  }

  const elAvgRpw = document.getElementById('palms-kpi-avg-rpw');
  const elRpwBreakdown = document.getElementById('palms-kpi-rpw-breakdown');
  if (elAvgRpw) elAvgRpw.textContent = avgRpw;
  if (elRpwBreakdown) {
    elRpwBreakdown.textContent = `総提供: ${totalRef}件 (内与+外与)`;
  }

  const elGreenCount = document.getElementById('palms-kpi-green-count');

/**

 */
function fetchPalmsChapterTrends() {
  if (typeof ApiService === 'undefined') return Promise.resolve(null);
  return ApiService.call('getPalmsChapterTrendsApi')
    .then(res => {
      if (res && res.success) {
        palmsChapterTrendsData = res;

      return res;

      renderGrowthDashboardSummary();

/**
 * Trigger manual sync from BNI Connect
 */
function syncPalmsFromBniConnect() {
  if (isPalmsSyncing) return;
  isPalmsSyncing = true;

  const btn = document.getElementById('btn-sync-palms');
  const btnText = btn ? btn.querySelector('.btn-text') : null;
  const btnIcon = btn ? btn.querySelector('i') : null;

  if (btn) btn.disabled = true;
  if (btnIcon) btnIcon.classList.add('fa-spin');
  if (btnText) btnText.textContent = '同期中...';

  showToast('BNI Connectから最新PALMSデータを取得しています...', 'info');

  ApiService.call('syncPalmsApi')
    .then(res => {
      if (res && res.success) {
        showToast(res.message || 'PALMSデータを正常に更新しました', 'success');
        fetchPalmsPeriods();
      } else {
        showToast('同期に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
    })
    .catch(err => {
      console.error('BNI Connect Sync error:', err);
      showToast('BNI Connect同期中にエラーが発生しました', 'error');
    })
    .finally(() => {
      isPalmsSyncing = false;
      if (btn) btn.disabled = false;
      if (btnIcon) btnIcon.classList.remove('fa-spin');
      if (btnText) btnText.textContent = 'Connect同期';
    });
}

      'total': '公式新基準（100点満点）: ビジター(25点) ＋ リファーラル週平均(25点) ＋ 1to1週平均(20点) ＋ CEU週平均(10点) ＋ 出席率(10点) ＋ TYFCB(5点) ＋ スポンサー(5点)',

      'rpw': 'RPW（Referrals Per Week: 週リファーラル提供）= (内部リファーラル ＋ 外部リファーラル) ÷ 週数 【目標: 1.25以上】',
      'referrals': 'リファーラル提供点数（週1.25件以上=25点, 1.00件=20点, 0.75件=15点, 0.50件=10点, 0.25件=5点）',
      'visitors': 'ビジター招待点数（6ヶ月換算: 5名以上=25点, 4名=20点, 3名=15点, 2名=10点, 1名=5点）',
      'one_to_ones': '1to1実施点数（週1.00回以上=20点, 0.75回=15点, 0.50回=10点, 0.25回=5点）',
      'ceu': 'CEU学習点数（週0.5pt超=10点, 0超0.5以下=5点, 0以下=0点）',
      'attendance': '定例会出席率点数（出席率96%以上=10点, 88%以上=5点, 88%未満=0点）',
      'tyfcb': 'TYFCB売上貢献点数（6ヶ月換算: 570万円以上=5点, 285万円=4点, 95万円=3点, 38万円=2点, 1円以上=1点）'
    };
    hintEl.textContent = hints[metric] || '';

  // Set default sort for metric
  if (metric === 'total') currentPalmsSort = { field: 'total_score', asc: false };
  else if (metric === 'ppw') currentPalmsSort = { field: 'ppw', asc: false };
  else if (metric === 'rpw') currentPalmsSort = { field: 'rpw', asc: false };
  else if (metric === 'referrals') currentPalmsSort = { field: 'referrals_given', asc: false };

  else if (metric === 'tyfcb') currentPalmsSort = { field: 'tyfcb', asc: false };

  renderPalmsRankingView();

/**
 * Render the entire PALMS Ranking View
 */
function renderPalmsRankingView() {
  if (!currentPalmsRecords || currentPalmsRecords.length === 0) {
    renderPalmsEmptyState();
    return;
  }

  // Sort records according to current metric / sort setting
  const sortedRecords = [...currentPalmsRecords].sort((a, b) => {
    let valA = 0;
    let valB = 0;

    switch (currentPalmsSort.field) {
      case 'name':
        valA = a.member_name || '';
        valB = b.member_name || '';
        return currentPalmsSort.asc ? valA.localeCompare(valB, 'ja') : valB.localeCompare(valA, 'ja');
      case 'traffic_light':
      case 'total_score':
      case 'rank':
        valA = a.total_score;
        valB = b.total_score;
        break;
      case 'ppw':
        valA = a.ppw;
        valB = b.ppw;
        break;
      case 'rpw':
        valA = a.rpw;
        valB = b.rpw;
        break;
      case 'rgi':
        valA = a.rgi;
        valB = b.rgi;
        break;
      case 'rgo':
        valA = a.rgo;
        valB = b.rgo;
        break;
      case 'referrals_given':
      case 'referrals':
        valA = a.total_referrals_given;
        valB = b.total_referrals_given;
        break;
      case 'visitors':
        valA = a.visitors;
        valB = b.visitors;
        break;
      case 'one_to_ones':
        valA = a.one_to_ones;
        valB = b.one_to_ones;
        break;
      case 'ceu':
        valA = a.ceu;
        valB = b.ceu;
        break;
      case 'attendance_rate':
      case 'attendance':
        valA = a.trafficLight ? a.trafficLight.rates.attRate : 0;
        valB = b.trafficLight ? b.trafficLight.rates.attRate : 0;
        break;
      case 'tyfcb':
        valA = a.tyfcb_yen;
        valB = b.tyfcb_yen;
        break;
      default:
        valA = a.total_score;
        valB = b.total_score;
    }

    if (valA !== valB) {
      return currentPalmsSort.asc ? (valA - valB) : (valB - valA);
    }
    // Secondary tie-breaker: PPW then total referrals given
    return b.ppw - a.ppw;
  });

  // Assign ranking numbers (1-indexed)
  sortedRecords.forEach((r, idx) => {
    r.display_rank = idx + 1;
  });

  renderPalmsPodium(sortedRecords);
  renderPalmsTable(sortedRecords);

  // Render all 5 Member Management Sitemap Subviews
  if (typeof renderGrowthDashboardSummary === 'function') renderGrowthDashboardSummary();
  if (typeof renderPpwRpwHub === 'function') renderPpwRpwHub();
  if (typeof renderTrafficLightsGrid === 'function') renderTrafficLightsGrid();
  if (typeof renderChapterTrafficView === 'function') renderChapterTrafficView();
}

/**
 * Render Comprehensive PALMS Table with PPW and RPW
 */
function renderPalmsTable(records) {
  const tableBody = document.getElementById('palms-table-body');
  if (!tableBody) return;

  if (records.length === 0) {
    tableBody.innerHTML = `
      <tr>
        <td colspan="13" class="py-12 text-center text-slate-400 text-xs">
          表示対象のデータがありません
        </td>
      </tr>
    `;
    return;
  }

  let html = '';

  records.forEach(m => {
    const rank = m.display_rank;
    let rankBadge = '';

    if (rank === 1) {
      rankBadge = '<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-amber-400 text-amber-950 font-black text-2xs shadow-2xs">1</span>';
    } else if (rank === 2) {
      rankBadge = '<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-300 text-slate-800 font-black text-2xs shadow-2xs">2</span>';
    } else if (rank === 3) {
      rankBadge = '<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-amber-700/20 text-amber-800 font-black text-2xs">3</span>';
    } else {
      rankBadge = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 font-bold text-2xs font-tabular">${rank}</span>`;
    }

    const tl = m.trafficLight;
    const memberCategory = m.member_category || m.member_profession || '-';
    const memberNameSafe = (m.member_name || '').replace(/'/g, "\\'");

    // Determine highlight column styling based on active metric
    const isTotalActive = currentPalmsMetric === 'total' || currentPalmsSort.field === 'total_score' || currentPalmsSort.field === 'rank';
    const isPpwActive = currentPalmsMetric === 'ppw' || currentPalmsSort.field === 'ppw';
    const isRpwActive = currentPalmsMetric === 'rpw' || currentPalmsSort.field === 'rpw';
    const isRgiActive = currentPalmsMetric === 'referrals' || currentPalmsSort.field === 'rgi';
    const isRgoActive = currentPalmsMetric === 'referrals' || currentPalmsSort.field === 'rgo' || currentPalmsSort.field === 'referrals_given';
    const isVisActive = currentPalmsMetric === 'visitors' || currentPalmsSort.field === 'visitors';
    const isOtoActive = currentPalmsMetric === 'one_to_ones' || currentPalmsSort.field === 'one_to_ones';
    const isTyfcbActive = currentPalmsMetric === 'tyfcb' || currentPalmsSort.field === 'tyfcb';
    const isCeuActive = currentPalmsMetric === 'ceu' || currentPalmsSort.field === 'ceu';
    const isAttActive = currentPalmsMetric === 'attendance' || currentPalmsSort.field === 'attendance_rate' || currentPalmsSort.field === 'attendance';

    const colHighlightClass = 'bg-blue-50/50 font-bold text-blue-700';

    let scoreColorClass = 'text-slate-800';
    if (m.total_score >= 70) scoreColorClass = 'text-emerald-600';
    else if (m.total_score >= 50) scoreColorClass = 'text-amber-600';
    else if (m.total_score >= 30) scoreColorClass = 'text-rose-600';
    else scoreColorClass = 'text-slate-500';

    html += `
      <tr class="hover:bg-slate-50/80 transition-colors">
        <!-- 1. 順位 -->
        <td class="py-3 px-3 text-center align-middle">
          ${rankBadge}
        </td>
        <!-- 2. メンバー -->
        <td class="py-3 px-4 align-middle">
          <div class="font-bold text-slate-800 hover:text-blue-600 cursor-pointer flex items-center gap-1.5 transition-colors group" onclick="openPalmsDetailModal('${memberNameSafe}')" title="パームス詳細を表示">
            <span class="group-hover:underline underline-offset-4 decoration-blue-500">${m.member_name}</span>
            <i class="fa-solid fa-circle-info text-3xs text-slate-300 group-hover:text-blue-500 transition-colors"></i>
          </div>
          <div class="text-3xs text-slate-400 mt-0.5 truncate max-w-[140px]">${memberCategory}</div>
        </td>
        <!-- 3. 判定 -->
        <td class="py-3 px-3 text-center align-middle">
          <span class="inline-flex items-center justify-center text-xs px-1.5 py-0.5 rounded-full border ${tl.tierBadgeClass} cursor-default" title="${tl.tierName} (${m.total_score}pt)">
            <span>${tl.tierDot}</span>
          </span>
        </td>
        <!-- 4. 総合点 -->
        <td class="py-3 px-3 text-right align-middle font-tabular ${isTotalActive ? colHighlightClass : ''}">
          <span class="text-sm font-black ${scoreColorClass}">${m.total_score}</span>
          <span class="text-3xs text-slate-400 font-normal">/100</span>
        </td>
        <!-- 5. PPW -->
        <td class="py-3 px-3 text-right align-middle font-tabular ${isPpwActive ? colHighlightClass : ''}">
          <div class="text-sm font-black text-slate-800">${m.ppw.toFixed(2)}</div>
          <div class="text-3xs"><span class="px-1.5 py-0.2 rounded border ${tl.ppwBadgeClass}">${tl.ppwTierLabel.split(' ')[0]}</span></div>
        </td>

          <div class="text-3xs ${getPalmsScoreColorClass(tl.scores.one_to_ones, 20)}">${tl.scores.one_to_ones} pt</div>
        </td>

        <td class="py-3 px-4 text-right align-middle font-tabular ${isTyfcbActive ? colHighlightClass : ''}">
          <div class="font-bold text-slate-800">¥${m.tyfcb_yen.toLocaleString()}</div>
          <div class="text-3xs ${getPalmsScoreColorClass(tl.scores.tyfcb, 5)}">${tl.scores.tyfcb} pt</div>
        </td>
        <!-- 12. CEU -->
        <td class="py-3 px-3 text-right align-middle font-tabular ${isCeuActive ? colHighlightClass : ''}">
          <div class="font-bold text-slate-800">${m.ceu} pt</div>

  tableBody.innerHTML = html;

/**
 * Currently inspected member in PALMS detail modal / dashboard
 */
let currentInspectedPalmsMember = null;

/**
 * Navigate to Member Personal Dashboard with PALMS & Traffic Lights
 */
function navigateToMemberPersonalDashboard(memberName, initialSubTab = 'traffic') {
  if (!memberName) return;
  const cleanName = String(memberName).trim();
  currentInspectedPalmsMember = cleanName;
  window.lastNavigatedFromTab = window.currentTab || 'traffic-lights';

  if (typeof switchTab === 'function') {
    switchTab('member-dashboard', false);
    setTimeout(() => {
      if (typeof selectMemberDashboard === 'function') {
        selectMemberDashboard(cleanName, true);
        if (typeof switchMemberDashboardSubTab === 'function') {
          switchMemberDashboardSubTab(initialSubTab);
        }
      }
    }, 50);
  }
}

/**
 * Open PALMS Detail - Redirected to Member Dashboard per user requirement
 */
function openPalmsDetailModal(memberName) {
  if (!memberName) return;
  navigateToMemberPersonalDashboard(memberName, 'traffic');
}


function handlePalmsModalKeydown(e) {
  if (e.key === 'Escape') {
    closePalmsDetailModal();
  }
}

function closePalmsDetailModal() {
  const modalEl = document.getElementById('modal-palms-detail');
  const containerEl = document.getElementById('modal-palms-container');
  if (modalEl && containerEl) {
    containerEl.classList.remove('scale-100');
    containerEl.classList.add('scale-95');
    setTimeout(() => {
      modalEl.style.display = 'none';
      if (palmsDetailRadarChart) {
        palmsDetailRadarChart.destroy();
        palmsDetailRadarChart = null;
      }
    }, 150);
  }
  window.removeEventListener('keydown', handlePalmsModalKeydown);
}

/**
 * Render 7 Indicators Radar Chart for Member Detail Modal
 */
function renderPalmsDetailRadar(m, items) {
  if (typeof Chart === 'undefined') return;
  const canvas = document.getElementById('chart-palms-detail-radar');
  if (!canvas) return;

  if (palmsDetailRadarChart) {
    palmsDetailRadarChart.destroy();
    palmsDetailRadarChart = null;
  }

  const labels = items.map(it => `${it.shortTitle} (${it.maxScore}点)`);
  const userScores = items.map(it => it.pct);
  const targetScores = [70, 70, 70, 70, 70, 70, 70]; // 目標クリア基準 (70%水準)

  const ctx = canvas.getContext('2d');
  palmsDetailRadarChart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: labels,
      datasets: [
        {
          label: '本人達成率 (%)',
          data: userScores,
          backgroundColor: 'rgba(0, 113, 227, 0.22)',
          borderColor: '#0071e3',
          borderWidth: 2.5,
          pointBackgroundColor: '#0071e3',
          pointBorderColor: '#ffffff',
          pointBorderWidth: 1.5,
          pointRadius: 4,
          pointHoverRadius: 6
        },
        {
          label: '目標基準 (70%ライン)',
          data: targetScores,
          backgroundColor: 'transparent',

function fetchPalmsMemberHistory(memberName) {
  const weeklyTbody = document.getElementById('palms-detail-weekly-tbody');
  const weeklyBadge = document.getElementById('palms-detail-weekly-badge');

  if (weeklyTbody) {
    weeklyTbody.innerHTML = `
      <tr>
        <td colspan="9" class="py-6 text-center text-slate-400 text-xs">
          <i class="fa-solid fa-circle-notch fa-spin text-sm mb-1.5"></i>
          <p>半年間データを読込中...</p>
        </td>
      </tr>
    `;
  }

  ApiService.call('getPalmsMemberHistoryApi', memberName)
    .then(res => {
      if (res && res.success && Array.isArray(res.history)) {
        renderPalmsDetailWeeklySubmissions(res.history);
      } else {
        if (weeklyTbody) {
          weeklyTbody.innerHTML = `
            <tr>
              <td colspan="9" class="py-4 text-center text-slate-400 text-xs">
                該当メンバーの半年間データはありません
              </td>
            </tr>

    .catch(err => {
      console.error('Failed to fetch PALMS member history:', err);
      if (weeklyTbody) {
        weeklyTbody.innerHTML = `
          <tr>
            <td colspan="9" class="py-4 text-center text-slate-400 text-xs">
              半年間データの取得に失敗しました
            </td>
          </tr>
        `;
      }
    });
}

/**
 * Render Half-Year PALMS Activity & Slip Submissions Table
 */
function renderPalmsDetailWeeklySubmissions(historyList, targetTbodyId = 'palms-detail-weekly-tbody', targetBadgeId = 'palms-detail-weekly-badge') {
  const tbody = document.getElementById(targetTbodyId);
  const badge = document.getElementById(targetBadgeId);
  if (!tbody) return;

  if (badge) {
    badge.textContent = '半年間 (26週)';
  }

  if (!historyList || historyList.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="9" class="py-6 text-center text-slate-400 text-xs">
          <i class="fa-solid fa-calendar-xmark text-lg mb-1 text-slate-300"></i>
          <p>表示可能な半年間データがまだ登録されていません</p>
          <p class="text-3xs text-slate-400 mt-0.5">※ 上部の「Connect同期」を実行すると最新データが自動反映されます</p>
        </td>
      </tr>
    `;
    return;
  }

  // 1. Identify primary 6-month record (approx 26 weeks, 150-200 days or matching currentPalmsPeriod)
  let halfYearRec = historyList.find(h => {
    if (currentPalmsPeriod.startDate && currentPalmsPeriod.endDate) {
      if (h.start_date === currentPalmsPeriod.startDate && h.end_date === currentPalmsPeriod.endDate) return true;
    }
    const d1 = new Date(h.start_date);
    const d2 = new Date(h.end_date);
    const diffDays = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1);
    return diffDays >= 60 && diffDays <= 210;
  });

  // If not found in history, fallback to current loaded record
  if (!halfYearRec && typeof currentPalmsRecords !== 'undefined') {
    const cached = currentPalmsRecords.find(r => r.member_name === currentInspectedPalmsMember);
    if (cached) halfYearRec = cached;
  }

  let html = '';

  // --- Row 1: 6-Month Comprehensive Total Row (Highlighted) ---
  if (halfYearRec) {
    const d1 = new Date(halfYearRec.start_date || currentPalmsPeriod.startDate || '2026-04-01');
    const d2 = new Date(halfYearRec.end_date || currentPalmsPeriod.endDate || '2026-09-30');
    const diffDays = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1);
    const weeks = Math.max(1, Math.round(diffDays / 7));

    const p = Number(halfYearRec.p_present != null ? halfYearRec.p_present : (halfYearRec.p || 0));
    const a = Number(halfYearRec.a_absent != null ? halfYearRec.a_absent : (halfYearRec.a || 0));
    const l = Number(halfYearRec.l_late != null ? halfYearRec.l_late : (halfYearRec.l || 0));
    const m = Number(halfYearRec.m_medical != null ? halfYearRec.m_medical : (halfYearRec.m || 0));
    const s = Number(halfYearRec.s_substitute != null ? halfYearRec.s_substitute : (halfYearRec.s || 0));

    const rgi = Number(halfYearRec.rgi_referrals_given_internal != null ? halfYearRec.rgi_referrals_given_internal : (halfYearRec.rgi || 0));
    const rgo = Number(halfYearRec.rgo_referrals_given_external != null ? halfYearRec.rgo_referrals_given_external : (halfYearRec.rgo || 0));
    const totalRef = Number(halfYearRec.total_referrals_given != null ? halfYearRec.total_referrals_given : (rgi + rgo));

    const visitors = Number(halfYearRec.v_visitors != null ? halfYearRec.v_visitors : (halfYearRec.visitors || 0));
    const oto = Number(halfYearRec.one_to_ones || 0);
    const tyfcbYen = Number(halfYearRec.tyfcb_yen != null ? halfYearRec.tyfcb_yen : (Number(halfYearRec.tyfcb_amount || 0) * 1000));
    const ceu = Number(halfYearRec.ceu || 0);
    const sponsors = Number(halfYearRec.testimonials != null ? halfYearRec.testimonials : (halfYearRec.sponsors || 0));

    const totalSessions = (p + a + l + m + s) || weeks;
    const attRate = totalSessions > 0 ? Math.round(((p + s) / totalSessions) * 100) : 100;
    const ppw = weeks > 0 ? ((totalRef + visitors + sponsors) / weeks) : 0;
    const rpw = weeks > 0 ? (totalRef / weeks) : 0;

    let attBadge = `<span class="inline-flex items-center gap-1 font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full text-3xs border border-emerald-200">出席${p}回 (${attRate}%)</span>`;
    if (a > 0) {
      attBadge += `<span class="text-3xs text-rose-600 font-bold ml-1">欠${a}</span>`;
    }

    const sFmt = (halfYearRec.start_date || '2026-04-01').replace(/-/g, '/');
    const eFmt = (halfYearRec.end_date || '2026-09-30').replace(/-/g, '/');

    html += `
      <tr class="bg-blue-50/70 border-b-2 border-blue-200 hover:bg-blue-100/60 transition-colors">
        <td class="py-3 px-3 whitespace-nowrap">
          <div class="flex items-center gap-1.5">
            <span class="px-2 py-0.5 rounded-md bg-blue-600 text-white text-3xs font-extrabold shadow-2xs">直近半年間 累計</span>
            <span class="font-black text-slate-800 text-xs">${weeks}週通算</span>
          </div>
          <div class="text-3xs text-slate-500 font-semibold mt-0.5">${sFmt} 〜 ${eFmt}</div>
        </td>
        <td class="py-3 px-3 text-center whitespace-nowrap">
          ${attBadge}
        </td>
        <td class="py-3 px-3 text-center whitespace-nowrap">
          <span class="inline-flex items-center gap-1 font-extrabold text-blue-800 bg-blue-100/80 px-2.5 py-0.5 rounded-md text-3xs border border-blue-300">
            <i class="fa-solid fa-trophy text-amber-500"></i> 半年実績
          </span>
        </td>
        <td class="py-3 px-3 text-right whitespace-nowrap font-black text-blue-700 text-sm">
          ${ppw.toFixed(2)} <span class="text-3xs font-normal text-slate-400">pt/週</span>
        </td>
        <td class="py-3 px-3 text-right whitespace-nowrap">
          <div class="font-black text-slate-900 text-xs">${totalRef}件</div>
          <div class="text-3xs text-slate-400">週${rpw.toFixed(2)}件 (${rgi}/${rgo})</div>
        </td>
        <td class="py-3 px-3 text-right whitespace-nowrap">
          <div class="font-black text-slate-900 text-xs">${visitors}名</div>
          <div class="text-3xs text-slate-400">月${(visitors / (weeks / 4.33)).toFixed(1)}名換算</div>
        </td>
        <td class="py-3 px-3 text-right whitespace-nowrap">
          <div class="font-black text-slate-900 text-xs">${oto}回</div>
          <div class="text-3xs text-slate-400">週${(oto / weeks).toFixed(1)}回</div>
        </td>
        <td class="py-3 px-3 text-right whitespace-nowrap">
          <div class="font-black text-slate-900 text-xs">¥${tyfcbYen.toLocaleString()}</div>
          <div class="text-3xs text-slate-400">月平均 ¥${Math.round(tyfcbYen / (weeks / 4.33)).toLocaleString()}</div>
        </td>
        <td class="py-3 px-3 text-right whitespace-nowrap">
          <div class="font-black text-slate-900 text-xs">${ceu} pt</div>
          <div class="text-3xs text-slate-400">週${(ceu / weeks).toFixed(1)} pt</div>
        </td>
      </tr>
    `;
  }

  // 2. Extract monthly or sub-period records and weekly submissions within the half-year
  const subRecords = historyList.filter(h => {
    const d1 = new Date(h.start_date);
    const d2 = new Date(h.end_date);
    const diffDays = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1);
    // Include monthly (15-40 days) or weekly (<= 14 days)
    return diffDays <= 45;
  });

  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

  if (subRecords.length > 0) {
    subRecords.forEach(w => {
      const d1 = new Date(w.start_date);
      const d2 = new Date(w.end_date);
      const diffDays = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1);
      const isSingleWeek = diffDays <= 14;

      const p = Number(w.p_present || 0);
      const a = Number(w.a_absent || 0);
      const l = Number(w.l_late || 0);
      const m = Number(w.m_medical || 0);
      const s = Number(w.s_substitute || 0);

      const rgi = Number(w.rgi_referrals_given_internal || 0);
      const rgo = Number(w.rgo_referrals_given_external || 0);
      const totalRef = Number(w.total_referrals_given != null ? w.total_referrals_given : (rgi + rgo));

      const visitors = Number(w.v_visitors || 0);
      const oto = Number(w.one_to_ones || 0);
      const tyfcbYen = Number(w.tyfcb_yen != null ? w.tyfcb_yen : (Number(w.tyfcb_amount || 0) * 1000));
      const ceu = Number(w.ceu || 0);
      const sponsors = Number(w.testimonials || w.sponsors || 0);

      const weeksCount = isSingleWeek ? 1 : Math.max(1, Math.round(diffDays / 7));
      const ppw = (totalRef + visitors + sponsors) / weeksCount;

      const endDateObj = new Date(w.end_date);
      const dayOfWeek = isNaN(endDateObj.getDay()) ? '' : ` (${dayNames[endDateObj.getDay()]})`;
      const dateFormatted = isSingleWeek
        ? `${w.end_date.replace(/-/g, '/')}${dayOfWeek}`
        : `${w.start_date.replace(/-/g, '/')} 〜 ${w.end_date.replace(/-/g, '/')}`;
      const periodLabel = isSingleWeek ? '定例会 (週別)' : `${Math.round(diffDays / 30)}ヶ月間`;

      // Attendance Badge
      let attBadge = '<span class="text-slate-300">-</span>';
      if (p > 0) {
        attBadge = `<span class="inline-flex items-center gap-1 font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full text-3xs border border-emerald-200"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>出席 (${p})</span>`;
      } else if (s > 0) {
        attBadge = `<span class="inline-flex items-center gap-1 font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-full text-3xs border border-blue-200"><span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>代理 (${s})</span>`;
      } else if (l > 0) {
        attBadge = `<span class="inline-flex items-center gap-1 font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full text-3xs border border-amber-200"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>遅刻 (${l})</span>`;
      } else if (a > 0) {
        attBadge = `<span class="inline-flex items-center gap-1 font-bold text-rose-700 bg-rose-50 px-2 py-0.5 rounded-full text-3xs border border-rose-200"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>欠席 (${a})</span>`;
      } else if (m > 0) {
        attBadge = `<span class="inline-flex items-center gap-1 font-bold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-full text-3xs border border-slate-200"><span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>医療 (${m})</span>`;
      }

      // Slip Status Badge
      let slipStatusBadge = '';
      const hasHighImpact = (totalRef > 0 || visitors > 0);
      const hasActivity = (hasHighImpact || oto > 0 || ceu > 0 || tyfcbYen > 0);

      if (hasHighImpact) {
        slipStatusBadge = '<span class="inline-flex items-center gap-1 font-extrabold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-md text-3xs border border-blue-200"><i class="fa-solid fa-fire text-amber-500"></i> 高貢献</span>';
      } else if (hasActivity) {
        slipStatusBadge = '<span class="inline-flex items-center gap-1 font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md text-3xs border border-emerald-200"><i class="fa-solid fa-check text-emerald-600"></i> 入力済</span>';
      } else {
        slipStatusBadge = '<span class="inline-flex items-center gap-1 font-bold text-slate-400 bg-slate-50 px-2 py-0.5 rounded-md text-3xs border border-slate-200"><i class="fa-solid fa-minus text-slate-300"></i> スリップなし</span>';
      }

      html += `
        <tr class="hover:bg-slate-50/80 transition-colors">
          <td class="py-2.5 px-3 whitespace-nowrap">
            <div class="font-bold text-slate-800 text-xs">${dateFormatted}</div>
            <div class="text-3xs text-slate-400">${periodLabel}</div>
          </td>
          <td class="py-2.5 px-3 text-center whitespace-nowrap">
            ${attBadge}
          </td>
          <td class="py-2.5 px-3 text-center whitespace-nowrap">
            ${slipStatusBadge}
          </td>
          <td class="py-2.5 px-3 text-right whitespace-nowrap font-bold text-slate-800">
            ${ppw.toFixed(2)}
          </td>
          <td class="py-2.5 px-3 text-right whitespace-nowrap">
            ${totalRef > 0 ? `<span class="font-black text-slate-800">${totalRef}件</span> <span class="text-3xs text-slate-400">(${rgi}/${rgo})</span>` : '<span class="text-slate-300">-</span>'}
          </td>
          <td class="py-2.5 px-3 text-right whitespace-nowrap">
            ${visitors > 0 ? `<span class="font-bold text-slate-800">${visitors}名</span>` : '<span class="text-slate-300">-</span>'}
          </td>
          <td class="py-2.5 px-3 text-right whitespace-nowrap">
            ${oto > 0 ? `<span class="font-bold text-slate-800">${oto}回</span>` : '<span class="text-slate-300">-</span>'}
          </td>
          <td class="py-2.5 px-3 text-right whitespace-nowrap">
            ${tyfcbYen > 0 ? `<span class="font-bold text-slate-800">¥${tyfcbYen.toLocaleString()}</span>` : '<span class="text-slate-300">-</span>'}
          </td>
          <td class="py-2.5 px-3 text-right whitespace-nowrap">
            ${ceu > 0 ? `<span class="font-bold text-slate-800">${ceu} pt</span>` : '<span class="text-slate-300">-</span>'}
          </td>
        </tr>
      `;
    });
  }

  tbody.innerHTML = html;
}

/**

 */
function sortPalmsTable(field) {
  if (currentPalmsSort.field === field) {
    currentPalmsSort.asc = !currentPalmsSort.asc;
  } else {
    currentPalmsSort.field = field;
    currentPalmsSort.asc = (field === 'name');
  }

  // Update table sort header icons
  ['rank', 'name', 'traffic_light', 'total_score', 'ppw', 'rpw', 'rgi', 'rgo', 'visitors', 'one_to_ones', 'tyfcb', 'ceu', 'attendance_rate'].forEach(f => {
    const iconEl = document.getElementById('sort-icon-' + f);
    if (!iconEl) return;
    const isCurrent = (f === currentPalmsSort.field) || 
      (f === 'attendance_rate' && currentPalmsSort.field === 'attendance') ||
      ((f === 'rgi' || f === 'rgo') && (currentPalmsSort.field === 'referrals_given' || currentPalmsSort.field === 'referrals'));
    if (isCurrent) {
      iconEl.innerHTML = currentPalmsSort.asc 
        ? '<i class="fa-solid fa-sort-up text-blue-600 text-3xs"></i>' 
        : '<i class="fa-solid fa-sort-down text-blue-600 text-3xs"></i>';
    } else {
      iconEl.innerHTML = '<i class="fa-solid fa-sort text-slate-300 text-3xs"></i>';
    }
  });

  renderPalmsRankingView();
}

  currentPalmsSubTab = subTabName;

  const subNavTabs = ['growth-dashboard', 'ppw-rpw', 'traffic-lights', 'palms-ranking', 'chapter-traffic'];
  subNavTabs.forEach(t => {
    const drawerItem = document.getElementById('drawer-item-' + t);
    const view = document.getElementById(`palms-subview-${t}`);

    if (drawerItem) {
      if (t === subTabName) {
        drawerItem.classList.add('active');
      } else {
        drawerItem.classList.remove('active');
      }
    }

    if (view) {
      if (t === subTabName) {
        view.classList.remove('hidden');
      } else {
        view.classList.add('hidden');
      }
    }
  });

  // 2. Dynamic Title & Subtitle updates (Apple Radical Minimalism)
  const metaInfo = {
    'growth-dashboard': {
      title: 'ダッシュボード',
      subtitle: ''
    },
    'ppw-rpw': {
      title: 'RPWとPPW',
      subtitle: ''
    },
    'traffic-lights': {
      title: 'トラフィックライト',
      subtitle: ''
    },
    'palms-ranking': {
      title: 'PARMSランキング',
      subtitle: ''
    },
    'chapter-traffic': {
      title: 'チャプタートラフィックライト',
      subtitle: ''
    }
  };

  const titleEl = document.getElementById('palms-view-title');
  const subtitleEl = document.getElementById('palms-view-subtitle');
  if (metaInfo[subTabName]) {
    if (titleEl) titleEl.textContent = metaInfo[subTabName].title;
    if (subtitleEl) subtitleEl.textContent = metaInfo[subTabName].subtitle;
  }

  // 2. Trigger view-specific re-renders & Chart.js resizes
  if (subTabName === 'growth-dashboard') {
    renderGrowthDashboardSummary();
    setTimeout(() => {
      if (palmsTrendChart) palmsTrendChart.resize();
      if (palmsRadarChart) palmsRadarChart.resize();
    }, 50);
  } else if (subTabName === 'ppw-rpw') {
    renderPpwRpwHub();
    setTimeout(() => {

  } else if (subTabName === 'traffic-lights') {
    renderTrafficLightsGrid();
    setTimeout(() => {
      if (palmsDonutChart) palmsDonutChart.resize();
    }, 50);
  } else if (subTabName === 'chapter-traffic') {
    renderChapterTrafficView();
  }
}

/**
 * Format TYFCB Yen currency string
 * Note: Input data in palms_reports is in thousands (1/1000th), so yen = amount * 1000
 */
function formatTyfcbYenDisplay(yen) {
  const num = Number(yen) || 0;
  if (num >= 100000000) {
    const oku = num / 100000000;
    return oku.toLocaleString('ja-JP', { maximumFractionDigits: 2 }) + ' 億円';
  } else if (num >= 10000) {
    const man = num / 10000;
    const isInt = (man % 1 === 0);
    return man.toLocaleString('ja-JP', { maximumFractionDigits: isInt ? 0 : 1 }) + ' 万円';
  } else {
    return num.toLocaleString('ja-JP') + ' 円';
  }
}

/**
 * Render Subview 1: Growth Dashboard Summary Metrics (1 Month, 6 Months, All Time)
 */
function renderGrowthDashboardSummary() {
  if (!palmsChapterTrendsData) {
    fetchPalmsChapterTrends();
  }

  // 1. If periods_summary is provided by API, use it directly
  let summary = (palmsChapterTrendsData && palmsChapterTrendsData.periods_summary) ? palmsChapterTrendsData.periods_summary : null;

  // 2. Fallback calculation if summary is not yet provided by API
  if (!summary) {
    let fallbackTyfcb = 0;
    let fallbackRefInternal = 0;
    let fallbackRefExternal = 0;
    let fallbackVisitors = 0;
    let fallbackOneToOnes = 0;
    let fallbackCeu = 0;

    if (currentPalmsRecords && currentPalmsRecords.length > 0) {
      currentPalmsRecords.forEach(r => {
        fallbackTyfcb += (Number(r.tyfcb_amount) || 0) * 1000;
        fallbackRefInternal += (Number(r.rgi_referrals_given_internal) || 0);
        fallbackRefExternal += (Number(r.rgo_referrals_given_external) || 0);
        fallbackVisitors += (Number(r.v_visitors) || 0);
        fallbackOneToOnes += (Number(r.one_to_ones) || 0);
        fallbackCeu += (Number(r.ceu) || 0);
      });
    }

    const totalRef = fallbackRefInternal + fallbackRefExternal;
    const extRate = totalRef > 0 ? Number(((fallbackRefExternal / totalRef) * 100).toFixed(1)) : 0;

    const dummyItem = {
      period_label: '集計中',
      tyfcb_yen: fallbackTyfcb,
      tyfcb_formatted: formatTyfcbYenDisplay(fallbackTyfcb),
      total_referrals: totalRef,
      internal_referrals: fallbackRefInternal,
      external_referrals: fallbackRefExternal,
      external_rate: extRate,
      visitors: fallbackVisitors,
      one_to_ones: fallbackOneToOnes,
      ceu: fallbackCeu
    };

    summary = {
      one_month: { ...dummyItem, label: '1ヶ月の成果' },
      six_months: { ...dummyItem, label: '半年間の成果' },
      all_time: { ...dummyItem, label: '全期間の成果' }

  }

  const p1m = summary.one_month || {};
  const p6m = summary.six_months || {};
  const pAll = summary.all_time || {};

  // Helper to format date label
  const fmtDateRange = (s, e) => {
    if (!s || !e) return '';
    const sParts = s.split('-');
    const eParts = e.split('-');
    if (sParts.length === 3 && eParts.length === 3) {
      return `${sParts[0]}/${sParts[1]}/${sParts[2]} 〜 ${eParts[0]}/${eParts[1]}/${eParts[2]}`;
    }
    return `${s} 〜 ${e}`;
  };

  // Helper to set text content safely
  const setEl = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  };

  // Helper to set element width
  const setWidth = (id, pct) => {
    const el = document.getElementById(id);
    if (el) el.style.width = Math.min(100, Math.max(0, pct)) + '%';

  // --- Populate 1 Month (直近月) ---
  setEl('growth-period-1m-dates', fmtDateRange(p1m.start_date, p1m.end_date) || p1m.period_label || '--');

/**
 * Render Subview 2: RPW & PPW Improvement Accelerator
 */
function renderPpwRpwHub() {
  if (!currentPalmsRecords || currentPalmsRecords.length === 0) return;

  const totalMembers = currentPalmsRecords.length;

  // Segment members into 3 tiers
  const urgentMembers = currentPalmsRecords.filter(r => (Number(r.ppw) || 0) < 1.0);
  const stepupMembers = currentPalmsRecords.filter(r => (Number(r.ppw) || 0) >= 1.0 && (Number(r.ppw) || 0) < 2.0);
  const benchmarkMembers = currentPalmsRecords.filter(r => (Number(r.ppw) || 0) >= 2.0);

  // Update Counters & Badges
  const urgentCountEl = document.getElementById('ppw-count-urgent');
  const stepupCountEl = document.getElementById('ppw-count-stepup');
  const benchmarkCountEl = document.getElementById('ppw-count-benchmark');
  if (urgentCountEl) urgentCountEl.textContent = urgentMembers.length;
  if (stepupCountEl) stepupCountEl.textContent = stepupMembers.length;
  if (benchmarkCountEl) benchmarkCountEl.textContent = benchmarkMembers.length;

  const qualifiedCountEl = document.getElementById('ppw-qualified-count');
  const totalCountEl = document.getElementById('ppw-total-member-count');
  const achRateEl = document.getElementById('ppw-achievement-rate');
  if (qualifiedCountEl) qualifiedCountEl.textContent = benchmarkMembers.length;
  if (totalCountEl) totalCountEl.textContent = totalMembers;
  if (achRateEl) {
    const rate = totalMembers > 0 ? Math.round((benchmarkMembers.length / totalMembers) * 100) : 0;
    achRateEl.textContent = rate + '%';
  }

  // Populate Simulation Member Select
  const simSelect = document.getElementById('ppw-sim-member-select');
  if (simSelect && simSelect.options.length <= 1) {
    simSelect.innerHTML = '<option value="">メンバーを選択してください...</option>';
    // Sort members alphabetically
    const alphaMembers = [...currentPalmsRecords].sort((a, b) => (a.member_name || '').localeCompare(b.member_name || '', 'ja'));
    alphaMembers.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.member_name;
      opt.textContent = `${m.member_name} (現在PPW: ${(Number(m.ppw) || 0).toFixed(2)})`;
      simSelect.appendChild(opt);
    });
  }

  // Render Top Performers Action Stats (Top 5 average metrics based on member activity weeks)
  const topMembers = [...currentPalmsRecords].sort((a, b) => (Number(b.ppw) || 0) - (Number(a.ppw) || 0)).slice(0, 5);
  if (topMembers.length > 0) {
    let topOtoPerWeekSum = 0;
    let topExtSum = 0;
    let topTotalRefSum = 0;
    let topVisPerMonthSum = 0;

    topMembers.forEach(m => {
      const mW = Math.max(1, m.weeks_count || 1);
      topOtoPerWeekSum += ((Number(m.one_to_ones) || 0) / mW);
      const ext = Number(m.rgo_referrals_given_external) || 0;
      const total = ext + (Number(m.rgi_referrals_given_internal) || 0);
      topExtSum += ext;
      topTotalRefSum += total;
      const vis = Number(m.v_visitors) || 0;
      topVisPerMonthSum += ((vis / mW) * 4);
    });

    const avgOtoPerWeek = (topOtoPerWeekSum / topMembers.length).toFixed(1);
    const extRatio = topTotalRefSum > 0 ? Math.round((topExtSum / topTotalRefSum) * 100) : 65;
    const avgVisPerMonth = (topVisPerMonthSum / topMembers.length).toFixed(1);

    const topAvgOtoEl = document.getElementById('top-avg-oto');
    const topExtRatioEl = document.getElementById('top-ext-ratio');
    const topAvgVEl = document.getElementById('top-avg-v');
    if (topAvgOtoEl) topAvgOtoEl.textContent = `週 ${avgOtoPerWeek} 回`;
    if (topExtRatioEl) topExtRatioEl.textContent = `${extRatio} %`;
    if (topAvgVEl) topAvgVEl.textContent = `月 ${avgVisPerMonth} 名`;
  }

  // Render the member grid according to active filter
  renderPpwFollowMemberGrid(currentPpwFilterTier);
}
