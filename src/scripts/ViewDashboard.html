<script>
  /* --- VIEW 1: Dashboard Controller & Chart Renderers --- */
  let donutChartInstance = null;
  let lineChartInstance = null;
  let currentDashboardActivePanel = 'hot';

  function switchDashboardPanel(panelName, scrollToPanel = false) {
    currentDashboardActivePanel = panelName;
    ['hot', 'ap', 'meeting', 'onemonth', 'stats'].forEach(p => {
      const btn = document.getElementById(`dash-tab-btn-${p}`);
      const panel = document.getElementById(`dash-panel-${p}`);
      if (btn) {
        if (p === panelName) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
      if (panel) {
        if (p === panelName) {
          panel.classList.add('active');
        } else {
          panel.classList.remove('active');
        }
      }
    });

    if (panelName === 'stats' && lineChartInstance) {
      setTimeout(() => {
        try { lineChartInstance.resize(); } catch(e){}
      }, 50);
    }

    if (scrollToPanel) {
      setTimeout(() => {
        const nav = document.querySelector('.dash-nav-wrap');
        if (nav) {
          nav.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 50);
    }
  }

  function renderDashboard(data) {
    if (!data) return;
    currentDashboardData = data;

    const m = data.metrics || data;
    const c = data.chart || data;
    const t = data.tables || data;

    // Dates
    const nextThuDateEl = document.getElementById('date-next-thu');
    const afterNextThuDateEl = document.getElementById('date-after-next-thu');
    if (nextThuDateEl) nextThuDateEl.innerText = data.nextThuStr || '--/--';
    if (afterNextThuDateEl) afterNextThuDateEl.innerText = data.afterNextThuStr || '--/--';
    
    // Meeting table titles
    const nextMeetingTitleEl = document.getElementById('title-next-meeting-date');
    const lastMeetingTitleEl = document.getElementById('title-last-meeting-date');
    if (nextMeetingTitleEl) nextMeetingTitleEl.innerText = data.nextThuStr || '次回';
    if (lastMeetingTitleEl) lastMeetingTitleEl.innerText = data.lastThuStr || '今週';

    // Counts
    const nextMeetingList = t.nextMeeting || t.nextMeetingVisitors || [];
    const lastMeetingList = t.lastMeeting || t.lastMeetingVisitors || [];
    const hotList = t.hotVisitors || [];
    const oneMonthList = t.oneMonthFollowup || t.oneMonthFollowupVisitors || [];
    const allActionPlans = t.actionPlans || [];

    const nextThuCount = m.nextThuCount !== undefined ? Number(m.nextThuCount) : nextMeetingList.length;
    const afterNextThuCount = m.afterNextThuCount !== undefined ? m.afterNextThuCount : '-';
    const targetWeeklyGoal = m.targetVisitorsWeekly || (m.currentMonthGoal ? m.currentMonthGoal.target_visitors_weekly : 4);

    const nextThuValEl = document.getElementById('val-next-thu-count');
    const afterNextThuValEl = document.getElementById('val-after-next-thu-count');
    const targetWeeklyGoalEl = document.getElementById('val-target-weekly-goal');

    if (nextThuValEl) nextThuValEl.innerText = nextThuCount;
    if (afterNextThuValEl) afterNextThuValEl.innerText = afterNextThuCount;
    if (targetWeeklyGoalEl) targetWeeklyGoalEl.innerText = targetWeeklyGoal;

    // Weekly Achievement Rate Calculation
    const weeklyRate = targetWeeklyGoal > 0 ? (nextThuCount / targetWeeklyGoal) * 100 : 0;
    const isWeeklyZero = nextThuCount === 0;

    // Toggle Weekly Top-Right Status Dot (🔴 for 0, 🔵 for >0)
    const weeklyStatusBadgeEl = document.getElementById('badge-weekly-status');
    if (weeklyStatusBadgeEl) {
      if (isWeeklyZero) {
        weeklyStatusBadgeEl.className = 'kpi-status-dot red';
        weeklyStatusBadgeEl.title = '未登録 (0名)';
      } else {
        weeklyStatusBadgeEl.className = 'kpi-status-dot blue';
        weeklyStatusBadgeEl.title = '正常';
      }
    }

    // Main KPI counters
    const applyCountEl = document.getElementById('val-apply-count');
    const joinedCountEl = document.getElementById('val-joined-count');
    const targetGoalEl = document.getElementById('val-target-goal');

    if (applyCountEl) applyCountEl.innerText = m.applyCount !== undefined ? m.applyCount : (m.totalVisitors || 0);
    if (joinedCountEl) joinedCountEl.innerText = m.joinedCount !== undefined ? m.joinedCount : (m.joinedMembers || 0);
    if (targetGoalEl) targetGoalEl.innerText = m.targetJoinGoal || m.targetMembers || 12;

    // Rates
    const joinRateEl = document.getElementById('val-join-rate');
    const achievementRateEl = document.getElementById('val-achievement-rate');
    const avgVisitorsEl = document.getElementById('val-avg-visitors');
    const hearingRateEl = document.getElementById('val-hearing-rate');
    const targetVisitorsWeeklyEl = document.getElementById('val-target-visitors-weekly');
    const targetHearingRateEl = document.getElementById('val-target-hearing-rate');
    const pendingApValEl = document.getElementById('val-pending-action-plans');
    const overdueApValEl = document.getElementById('val-overdue-action-plans');
    const hotCountValEl = document.getElementById('val-hot-count');
    const overdueBadgeEl = document.getElementById('badge-overdue-summary');

    if (joinRateEl) joinRateEl.innerText = `${m.joinRate || 0}%`;
    if (achievementRateEl) achievementRateEl.innerText = `${m.achievementRate || 0}%`;
    if (avgVisitorsEl) avgVisitorsEl.innerText = `${m.avgVisitorCount || m.avgVisitors || 0}`;
    if (hearingRateEl) hearingRateEl.innerText = `${m.hearingRate || 0}%`;
    if (targetVisitorsWeeklyEl) targetVisitorsWeeklyEl.innerText = `${targetWeeklyGoal}`;
    if (targetHearingRateEl) {
      const th = m.targetHearingRate || (m.currentMonthGoal ? `${m.currentMonthGoal.target_hearing_rate}%` : '100%');
      targetHearingRateEl.innerText = `${th}`;
    }

    // 🎯 Update Circular Progress Rings (All clean Blue)
    updateKpiProgressRing('ring-weekly-achievement', 'val-weekly-ring-num', weeklyRate, false, 'blue');
    updateKpiProgressRing('ring-joined-achievement', 'val-achievement-ring-num', m.achievementRate || 0, false, 'blue');
    updateKpiProgressRing('ring-hearing-rate', 'val-hearing-ring-num', parseFloat(m.hearingRate) || 0, false, 'blue');

    const pendingCount = m.pendingActionPlansCount !== undefined ? m.pendingActionPlansCount : allActionPlans.filter(p => Number(p.is_completed) === 0).length;
    const overdueCount = m.overdueActionPlansCount !== undefined ? m.overdueActionPlansCount : 0;

    if (pendingApValEl) pendingApValEl.innerText = pendingCount;
    if (overdueApValEl) overdueApValEl.innerText = overdueCount;
    if (hotCountValEl) hotCountValEl.innerText = hotList.length;

    // Action Status Ring (Blue, offset based on pending/completed)
    const ringActionStatus = document.getElementById('ring-action-status');
    if (ringActionStatus) {
      ringActionStatus.className = 'kpi-ring-fill blue';
      ringActionStatus.style.strokeDashoffset = pendingCount === 0 ? '0' : '60';
    }

    // Action Top-Right Status Dot (🔴 for overdue > 0, 🔵 for normal)
    if (overdueBadgeEl) {
      if (overdueCount > 0) {
        overdueBadgeEl.className = 'kpi-status-dot red';
        overdueBadgeEl.title = `超過 ${overdueCount}件`;
      } else {
        overdueBadgeEl.className = 'kpi-status-dot blue';
        overdueBadgeEl.title = '正常';
      }
    }

    const overdueDotEl = document.getElementById('indicator-overdue-dot');
    if (overdueDotEl) {
      overdueDotEl.className = overdueCount > 0 ? 'kpi-sub-indicator overdue' : 'kpi-sub-indicator normal';
    }

    // Tab badges
    const tabBadgeHot = document.getElementById('dash-tab-badge-hot');
    const tabBadgeAp = document.getElementById('dash-tab-badge-ap');
    const tabBadgeMeeting = document.getElementById('dash-tab-badge-meeting');
    const tabBadgeOnemonth = document.getElementById('dash-tab-badge-onemonth');

    const pendingOneMonthCount = oneMonthList.filter(r => !isVisitorActionCompleted(r)).length;

    if (tabBadgeHot) tabBadgeHot.innerText = hotList.length;
    if (tabBadgeAp) tabBadgeAp.innerText = pendingCount;
    if (tabBadgeMeeting) tabBadgeMeeting.innerText = `次回 ${nextMeetingList.length}名`;
    if (tabBadgeOnemonth) tabBadgeOnemonth.innerText = pendingOneMonthCount;

    // Charts
    const chartLabels = c.labels || data.chartLabels || [];
    const chartValues = c.data || data.chartValues || [];
    if (chartLabels.length > 0) {
      initLineChart(chartLabels, chartValues);
    }

    // Tables
    renderDashboardActionPlansTable(allActionPlans);
    renderWeeklyStatsTable(t.weeklyStats || []);
    renderMonthlyStatsTable(t.monthlyStats || []);
    renderNextMeetingTable(nextMeetingList);
    renderLastMeetingTable(lastMeetingList);
    renderHotVisitorsTable(hotList);
    renderOneMonthTable(oneMonthList);

    if (data.bniTermsList) {
      renderBniTermsSelectOptions(data.bniTermsList, data.startDateStr || data.selectedStartDate);
    }
  }

  let currentDashboardOneMonthList = [];
  let currentDashboardOneMonthFilter = 'pending';

  function filterDashboardOneMonth(filterType) {
    currentDashboardOneMonthFilter = filterType;
    ['pending', 'all', 'completed'].forEach(t => {
      const btn = document.getElementById(`dash-onemonth-filter-${t}`);
      if (btn) {
        if (t === filterType) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    });
    renderOneMonthTable(currentDashboardOneMonthList);
  }

  let currentDashboardActionPlans = [];
  let currentDashboardApFilter = 'pending';

  function filterDashboardActionPlans(mode) {
    currentDashboardApFilter = mode;
    ['pending', 'all', 'completed'].forEach(m => {
      const btn = document.getElementById(`dash-ap-filter-${m}`);
      if (btn) {
        if (m === mode) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    });
    renderDashboardActionPlansTable(currentDashboardActionPlans);
  }

  function renderDashboardActionPlansTable(plans) {
    currentDashboardActionPlans = plans || [];
    const tbody = document.getElementById('table-dashboard-action-plans');
    const cardsContainer = document.getElementById('dashboard-action-plans-cards');

    const todayStr = new Date().toISOString().slice(0, 10);
    let filtered = currentDashboardActionPlans;
    if (currentDashboardApFilter === 'pending') {
      filtered = currentDashboardActionPlans.filter(p => Number(p.is_completed) === 0);
    } else if (currentDashboardApFilter === 'completed') {
      filtered = currentDashboardActionPlans.filter(p => Number(p.is_completed) === 1);
    }

    const emptyHtmlCards = `
      <div style="grid-column: 1 / -1; text-align: center; color: #868e96; padding: 36px 16px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1;">
        <i class="fa-solid fa-clipboard-check text-2xl text-slate-300 mb-2"></i>
        <div class="font-bold text-sm text-slate-600">${currentDashboardApFilter === 'pending' ? '🎉 進行中の未完了アクションプランはありません。' : 'アクションプランはありません。'}</div>
      </div>
    `;
    const emptyHtmlTable = `
      <tr>
        <td colspan="4" style="text-align: center; color: #868e96; padding: 32px 16px;">
          ${currentDashboardApFilter === 'pending' ? '🎉 進行中の未完了アクションプランはありません。' : 'アクションプランはありません。'}
        </td>
      </tr>
    `;

    if (tbody) tbody.innerHTML = '';
    if (cardsContainer) cardsContainer.innerHTML = '';

    if (filtered.length === 0) {
      if (tbody) tbody.innerHTML = emptyHtmlTable;
      if (cardsContainer) cardsContainer.innerHTML = emptyHtmlCards;
      return;
    }

    filtered.forEach(p => {
      const isCompleted = Number(p.is_completed) === 1;
      const isOverdue = !isCompleted && p.due_date && p.due_date < todayStr;
      const isDueToday = !isCompleted && p.due_date && p.due_date === todayStr;

      let scheduleBadgeHtml = '';
      if (isCompleted) {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[12px] font-bold text-slate-500"><i class="fa-solid fa-circle text-[8px] text-emerald-500"></i><span>${p.due_date || '完了'}</span></span>`;
      } else if (isOverdue) {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[12px] font-bold text-slate-800"><i class="fa-solid fa-circle text-[8px] text-red-500"></i><span>${p.due_date || '期日未定'}</span></span>`;
      } else if (isDueToday) {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[12px] font-bold text-slate-800"><i class="fa-solid fa-circle text-[8px] text-amber-500"></i><span>${p.due_date}</span></span>`;
      } else {
        scheduleBadgeHtml = `<span class="inline-flex items-center gap-1.5 text-[12px] font-bold text-slate-800"><i class="fa-solid fa-circle text-[8px] text-blue-500"></i><span>${p.due_date || '期日未定'}</span></span>`;
      }

      const scheduleAndAssigneeHtml = `
        <div class="flex flex-col items-start justify-center">
          ${scheduleBadgeHtml}
          <div class="flex items-center gap-1 text-[11px] text-slate-500 font-semibold mt-0.5 pl-0.5">
            <i class="fa-solid fa-user text-[10px] text-slate-400"></i>
            <span>${escapeHtml(p.assignee_name || '担当未設定')}</span>
          </div>
        </div>
      `;

      const reportBoxHtml = p.report_text
        ? `<div class="dash-ap-card-report">
             <strong><i class="fa-regular fa-comment-dots text-emerald-600"></i> 報告:</strong> ${escapeHtml(p.report_text)}
             ${p.completed_by ? `<span class="text-slate-500 font-normal text-[10px] ml-1">(確認: ${escapeHtml(p.completed_by)})</span>` : ''}
           </div>`
        : '';

      // 1. PCテーブル行描画
      if (tbody) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.onclick = function(e) {
          if (e.target.closest('button')) return;
          openActionReportModal(p.id, p.visitor_id);
        };

        const visitorCellHtml = `
          <div>
            <div style="font-weight: 800; color: #0f172a; font-size: 14px;">
              <i class="fa-solid fa-user-tag text-blue-600 text-xs mr-1"></i>${escapeHtml(p.visitor_name || 'ビジター No.' + p.visitor_id)}
            </div>
            ${p.visitor_company ? `<div style="font-size: 11px; color: #64748b; margin-top: 1px;">${escapeHtml(p.visitor_company)}</div>` : ''}
          </div>
        `;

        const actionCellHtml = `
          <div style="min-width: 130px; white-space: normal; word-break: break-word; line-height: 1.35;">
            <div class="flex items-center gap-1.5 flex-wrap mb-1">
              ${renderActionTypeBadgeHtml(p.action_type)}
            </div>
            <div class="${isCompleted ? 'vd-ap-text completed' : 'vd-ap-text'}" style="font-size: 12px; font-weight: 700;">
              ${escapeAndLinkify(p.action_text, true)}
            </div>
            ${reportBoxHtml}
          </div>
        `;

        const operationCellHtml = `
          <div class="flex items-center justify-center" onclick="event.stopPropagation();">
            ${!isCompleted ? `
              <button type="button" class="btn-action-primary text-xs" style="padding: 5px 12px; font-size: 12px; font-weight: 700; white-space: nowrap; border-radius: 8px;" onclick="openActionReportModal('${p.id}', '${p.visitor_id}')">
                <i class="fa-solid fa-clipboard-check mr-1"></i> 報告する
              </button>
            ` : `
              <button type="button" class="btn-action-secondary text-xs" style="padding: 5px 10px; font-size: 11px; font-weight: 600; white-space: nowrap; border-radius: 8px;" onclick="openActionReportModal('${p.id}', '${p.visitor_id}')">
                <i class="fa-solid fa-check mr-1 text-emerald-600"></i> 確認
              </button>
            `}
          </div>
        `;

        tr.innerHTML = `
          <td>${scheduleAndAssigneeHtml}</td>
          <td>${visitorCellHtml}</td>
          <td>${actionCellHtml}</td>
          <td class="text-center">${operationCellHtml}</td>
        `;
        tbody.appendChild(tr);
      }

      // 2. スマホカード描画
      if (cardsContainer) {
        const card = document.createElement('div');
        card.className = `dash-ap-card ${isCompleted ? 'is-completed' : (isOverdue ? 'is-overdue' : '')}`;
        card.onclick = function() {
          openActionReportModal(p.id, p.visitor_id);
        };

        card.innerHTML = `
          <!-- 上段: 左側にビジター名（大きく太字）＋会社、右側に大きな報告ボタン -->
          <div class="dash-ap-card-top-row">
            <div class="dash-ap-card-visitor-left">
              <div class="dash-ap-card-visitor-name">
                <i class="fa-solid fa-user-tag text-blue-600 text-sm"></i>
                <span>${escapeHtml(p.visitor_name || 'ビジター No.' + p.visitor_id)}</span>
              </div>
              ${p.visitor_company ? `<div class="dash-ap-card-visitor-sub">${escapeHtml(p.visitor_company)}</div>` : ''}
            </div>
            <div class="dash-ap-card-btn-right" onclick="event.stopPropagation()">
              ${!isCompleted ? `
                <button type="button" class="dash-ap-btn-report" onclick="openActionReportModal('${p.id}', '${p.visitor_id}')">
                  <i class="fa-solid fa-clipboard-check"></i> 報告する
                </button>
              ` : `
                <button type="button" class="dash-ap-btn-confirmed" onclick="openActionReportModal('${p.id}', '${p.visitor_id}')">
                  <i class="fa-solid fa-check text-emerald-600"></i> 確認
                </button>
              `}
            </div>
          </div>

          <!-- 中段: アクション内容と実施報告 -->
          <div class="dash-ap-card-body">
            <div class="dash-ap-card-action ${isCompleted ? 'completed' : ''}">
              ${escapeAndLinkify(p.action_text, true)}
            </div>
            ${reportBoxHtml}
          </div>

          <!-- 下段: 左側に期日(状態付)・担当者バッジ、右側に共有・詳細ナビ -->
          <div class="dash-ap-card-bottom-row">
            <div class="dash-ap-card-badges-left flex-wrap">
              ${renderActionTypeBadgeHtml(p.action_type)}
              ${scheduleBadgeHtml}
              <span class="vd-ap-badge-user" style="font-size:10px;"><i class="fa-regular fa-user"></i> ${escapeHtml(p.assignee_name || '担当未定')}</span>
            </div>
            <div class="dash-ap-card-tools-right" onclick="event.stopPropagation()">
              <button type="button" class="btn-action-secondary vd-quick-chip" style="font-size:11px; padding:3px 8px;" onclick="shareActionPlan('${p.id}', '${p.visitor_id}', event)" title="共有URLをコピー">
                <i class="fa-solid fa-share-nodes text-blue-600"></i> 共有
              </button>
              <span class="text-slate-300 text-sm ml-0.5"><i class="fa-solid fa-chevron-right"></i></span>
            </div>
          </div>
        `;
        cardsContainer.appendChild(card);
      }
    });
  }

  function renderHotVisitorsTable(records) {
    const tbody = document.getElementById('table-hot-visitors');
    const cardsContainer = document.getElementById('cards-hot-visitors');

    if (tbody) tbody.innerHTML = '';
    if (cardsContainer) cardsContainer.innerHTML = '';

    const validRecords = (records || []).filter(r => r.isJoined !== '見送り');

    if (!validRecords || validRecords.length === 0) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #868e96; padding: 24px;">現在フォロー対象のホットビジターはいません</td></tr>';
      if (cardsContainer) {
        cardsContainer.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #868e96; padding: 36px 16px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1;">
            <i class="fa-solid fa-fire text-2xl text-slate-300 mb-2"></i>
            <div class="font-bold text-sm text-slate-600">現在フォロー対象のホットビジターはいません</div>
          </div>
        `;
      }
      return;
    }

    validRecords.forEach(r => {
      // 1. PCテーブル行
      if (tbody) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.onclick = function(e) {
          if (e.target.closest('button') || e.target.closest('a')) return;
          openVisitorDetailView(r.id);
        };
        tr.innerHTML = `
          <td style="font-size: 11px; color: #64748b; white-space: nowrap; padding: 8px 6px;">
            ${formatEventDateWithElapsed(r.eventDate)}
          </td>
          <td style="max-width: 120px; padding: 8px 8px; vertical-align: top;">
            <div style="font-weight: 800; font-size: 13px; color: #0f172a; line-height: 1.3;" class="truncate" title="${escapeHtml(r.name)}">
              ${renderVisitorNameLinkHtml(r.id, r.name, r)}
            </div>
            ${r.company ? `<div class="truncate" style="font-size:10.5px; color:#64748b; margin-top:2px;" title="${escapeHtml(r.company)}">${escapeHtml(r.company)}</div>` : ''}
          </td>
          <td style="max-width: 85px; padding: 8px 6px; vertical-align: top;">
            <div class="truncate" style="font-weight: 700; color: #334155; font-size: 11.5px; line-height: 1.3;" title="${escapeHtml(r.inviter || '-')}">
              ${escapeHtml(r.inviter || '-')}
            </div>
            ${r.orientUser ? `<div class="truncate" style="font-size:10px; color:#64748b; margin-top:2px;" title="担当: ${escapeHtml(r.orientUser)}">担当: ${escapeHtml(r.orientUser)}</div>` : ''}
          </td>
          <td style="white-space: normal !important; word-break: break-word; max-width: none !important; line-height: 1.4; padding: 8px 10px; vertical-align: top;">
            ${renderCurrentStatusColumnHtml(r)}
          </td>
        `;
        tbody.appendChild(tr);
      }

      // 2. スマホカード
      if (cardsContainer) {
        const card = document.createElement('div');
        card.className = 'dash-ap-card';
        card.onclick = function() {
          openVisitorDetailView(r.id);
        };

        const actionBlockHtml = renderHotVisitorActionFullWidthHtml(r);

        card.innerHTML = `
          <div class="dash-card-main-row">
            <div class="dash-card-left">
              ${renderRankBadgeHtml(r.feelAbc || 'A', 'large')}
              <div class="dash-card-info">
                <div class="dash-card-name-row">
                  <span class="dash-card-name">${escapeHtml(r.name || 'ビジター No.' + r.id)}</span>
                  ${renderRepeatBadgeHtml(r)}
                </div>
                <div class="dash-card-company">
                  ${escapeHtml(r.company || '-')}${r.profession ? ` / ${escapeHtml(r.profession)}` : ''}
                </div>
              </div>
            </div>

            <div class="dash-card-right">
              ${formatEventDateWithElapsed(r.eventDate)}
              <span class="dash-card-chevron"><i class="fa-solid fa-chevron-right"></i></span>
            </div>
          </div>

          <!-- アクション表示: 横幅一杯一杯 -->
          <div class="dash-hot-action-block">
            ${actionBlockHtml}
          </div>

          <!-- 担当と紹介者を下の列に -->
          <div class="dash-card-bottom-row">
            <div class="dash-card-meta-tags">
              <span class="dash-card-meta-tag">
                <i class="fa-solid fa-user-plus text-rose-500"></i> 紹介: <strong class="text-slate-800">${escapeHtml(r.inviter || '-')}</strong>
              </span>
              ${r.orientUser ? `
                <span class="dash-card-meta-tag">
                  <i class="fa-solid fa-user-check text-indigo-500"></i> 担当: <strong class="text-slate-800">${escapeHtml(r.orientUser)}</strong>
                </span>
              ` : ''}
            </div>
          </div>
        `;
        cardsContainer.appendChild(card);
      }
    });
  }

  function renderHotVisitorActionFullWidthHtml(r) {
    const ap = r.latestActionPlan;
    if (ap) {
      const isCompleted = Number(ap.is_completed) === 1;
      const todayStr = new Date().toISOString().slice(0, 10);
      const isOverdue = !isCompleted && ap.due_date && ap.due_date < todayStr;

      const badgeHtml = isCompleted
        ? `<span class="badge" style="font-size:10px; padding:2px 8px; font-weight:800; background:#d3f9d8; color:#2b8a3e; border-radius:6px;"><i class="fa-solid fa-check mr-1"></i>完了</span>`
        : (isOverdue
            ? `<span class="badge" style="font-size:10px; padding:2px 8px; font-weight:800; background:#ffe3e3; color:#e03131; border-radius:6px;"><i class="fa-solid fa-triangle-exclamation mr-1"></i>期限超過 (${escapeHtml(ap.due_date)})</span>`
            : `<span class="badge" style="font-size:10px; padding:2px 8px; font-weight:800; background:#e7f5ff; color:#1864ab; border-radius:6px;"><i class="fa-regular fa-calendar mr-1"></i>期日: ${escapeHtml(ap.due_date || '未定')}</span>`
          );

      const reportSnippet = ap.report_text ? `
        <div class="dash-hot-action-report">
          <i class="fa-regular fa-comment-dots text-emerald-600 mr-1"></i><strong>報告:</strong> ${escapeHtml(ap.report_text)}
        </div>
      ` : '';

      return `
        <div class="dash-hot-action-inner ${isOverdue ? 'is-overdue' : (isCompleted ? 'is-completed' : '')}">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            ${badgeHtml}
          </div>
          <div class="dash-hot-action-text ${isCompleted ? 'completed' : ''}">
            ${escapeHtml(ap.action_text)}
          </div>
          ${reportSnippet}
        </div>
      `;
    }

    const note = r.q7 || r.orientMemo || r.followMemo;
    if (note) {
      return `
        <div class="dash-hot-action-inner">
          <div class="text-[11px] font-bold text-slate-500 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-note-sticky text-amber-500"></i> ヒアリングメモ
          </div>
          <div class="dash-hot-action-text text-slate-700 font-medium">
            ${escapeHtml(note)}
          </div>
        </div>
      `;
    }

    return `
      <div class="dash-hot-action-inner text-slate-400 text-xs py-2 font-bold flex items-center gap-1.5">
        <i class="fa-solid fa-circle-info text-slate-300"></i> アクションプラン未登録
      </div>
    `;
  }

  function renderFeelRatesBadgeHtml(row) {
    if (!row) return '<span class="feel-meter-empty">-</span>';

    const counts = row.feelCounts || {};
    const rates = row.feelRates || {};

    const countA = counts.A || 0;
    const countB = counts.B || 0;
    const countC = counts.C || 0;
    const countNone = counts.none || 0;

    const total = row.applyCount !== undefined ? row.applyCount : (row.visitorCount || (countA + countB + countC + countNone));
    if (total <= 0) return '<span class="feel-meter-empty">-</span>';

    const pctA = total > 0 ? ((countA / total) * 100).toFixed(1) : '0.0';
    const pctB = total > 0 ? ((countB / total) * 100).toFixed(1) : '0.0';
    const pctC = total > 0 ? ((countC / total) * 100).toFixed(1) : '0.0';
    const pctNone = total > 0 ? ((countNone / total) * 100).toFixed(1) : '0.0';

    const rateA = rates.A || `${pctA}%`;
    const rateB = rates.B || `${pctB}%`;
    const rateC = rates.C || `${pctC}%`;

    const titleText = `感触: A: ${countA}名 (${rateA}) | B: ${countB}名 (${rateB}) | C: ${countC}名 (${rateC})${countNone > 0 ? ` | 未定: ${countNone}名` : ''}`;

    return `
      <div class="feel-meter-wrap" title="${titleText}">
        <div class="feel-meter-bar">
          ${countA > 0 ? `<div class="feel-meter-seg seg-a" style="width: ${pctA}%;"></div>` : ''}
          ${countB > 0 ? `<div class="feel-meter-seg seg-b" style="width: ${pctB}%;"></div>` : ''}
          ${countC > 0 ? `<div class="feel-meter-seg seg-c" style="width: ${pctC}%;"></div>` : ''}
          ${countNone > 0 ? `<div class="feel-meter-seg seg-none" style="width: ${pctNone}%;"></div>` : ''}
        </div>
      </div>
    `;
  }

  function renderPeriodicStatsTable(tbodyId, records, labelKey) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    tbody.innerHTML = '';

    const isMonthly = (tbodyId === 'table-monthly-stats');
    const colCount = isMonthly ? 6 : 5;

    if (!records || records.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align: center; color: #868e96; padding: 15px;">データなし</td></tr>`;
      return;
    }

    records.forEach(row => {
      const tr = document.createElement('tr');
      const labelVal = row[labelKey] || row.date || row.month || '-';
      const applyVal = row.applyCount !== undefined ? row.applyCount : (row.visitorCount || 0);
      const attVal = row.attendedCount !== undefined ? row.attendedCount : (row.attCount || 0);
      const joinedVal = row.joinedCount || 0;
      const feelRatesHtml = renderFeelRatesBadgeHtml(row);

      if (isMonthly) {
        const targetJoined = row.targetJoined !== undefined ? row.targetJoined : (row.goal ? row.goal.target_joined : 2);
        const targetVisitorsWeekly = row.targetVisitorsWeekly !== undefined ? row.targetVisitorsWeekly : (row.goal ? row.goal.target_visitors_weekly : 4);
        const avgWeekly = row.avgVisitorsWeekly || (row.meetingCount ? (applyVal / Math.max(1, row.meetingCount)).toFixed(1) : applyVal);
        const isGoalAchieved = joinedVal >= targetJoined;
        const joinedColor = isGoalAchieved && joinedVal > 0 ? '#15803d' : '#0f172a';
        const isWeeklyGoalAchieved = Number(avgWeekly) >= Number(targetVisitorsWeekly);
        const weeklyAvgColor = isWeeklyGoalAchieved && Number(avgWeekly) > 0 ? '#15803d' : '#0f172a';

        let typeBadge = '';
        if (row.isCustomGoal) {
          typeBadge = '<span class="inline-block w-1.5 h-1.5 rounded-full bg-slate-500 mr-1 align-middle" title="個別目標設定月"></span>';
        }

        tr.innerHTML = `
          <td style="font-weight: 700; white-space: nowrap; padding: 8px 6px; color: #1e293b;">${typeBadge}${labelVal}</td>
          <td style="text-align: center; padding: 8px 4px; white-space: nowrap; font-weight: 700; color: #0f172a; font-size: 13px;">${applyVal}名</td>
          <td style="text-align: center; padding: 8px 4px; white-space: nowrap;">
            <span style="font-weight: 700; font-size: 13px; color: ${weeklyAvgColor};">${avgWeekly}</span>
            <span style="font-size: 11px; color: #94a3b8; font-weight: 600;">/${targetVisitorsWeekly}名</span>
            ${isWeeklyGoalAchieved && Number(avgWeekly) > 0 ? '<span style="font-size: 9px; padding: 1px 3px; border-radius: 4px; background: #f1f5f9; color: #15803d; font-weight: 800; margin-left: 2px;">達成</span>' : ''}
          </td>
          <td style="text-align: center; color: #334155; font-weight: 600; font-size: 12px; padding: 8px 4px; white-space: nowrap;">${attVal}名</td>
          <td style="padding: 8px 6px; vertical-align: middle;">${feelRatesHtml}</td>
          <td style="text-align: center; padding: 8px 4px; white-space: nowrap;">
            <span style="font-weight: 700; font-size: 13px; color: ${joinedColor};">${joinedVal}</span>
            <span style="font-size: 11px; color: #94a3b8; font-weight: 600;">/${targetJoined}名</span>
            ${isGoalAchieved && joinedVal > 0 ? '<span style="font-size: 9px; padding: 1px 3px; border-radius: 4px; background: #f1f5f9; color: #15803d; font-weight: 800; margin-left: 2px;">達成</span>' : ''}
          </td>
        `;
      } else {
        const targetVisitorsWeekly = row.targetVisitorsWeekly !== undefined ? row.targetVisitorsWeekly : 4;
        const isWeeklyGoalAchieved = applyVal >= targetVisitorsWeekly;
        const applyColor = isWeeklyGoalAchieved && applyVal > 0 ? '#15803d' : '#0f172a';

        tr.innerHTML = `
          <td style="font-weight: 700; white-space: nowrap; padding: 8px 6px; color: #1e293b;">${labelVal}</td>
          <td style="text-align: center; padding: 8px 4px; white-space: nowrap;">
            <span style="font-weight: 700; font-size: 13px; color: ${applyColor};">${applyVal}</span>
            <span style="font-size: 11px; color: #94a3b8; font-weight: 600;">/${targetVisitorsWeekly}名</span>
            ${isWeeklyGoalAchieved && applyVal > 0 ? '<span style="font-size: 9px; padding: 1px 3px; border-radius: 4px; background: #f1f5f9; color: #15803d; font-weight: 800; margin-left: 2px;">達成</span>' : ''}
          </td>
          <td style="text-align: center; color: #334155; font-weight: 600; font-size: 12px; padding: 8px 4px; white-space: nowrap;">${attVal}名</td>
          <td style="padding: 8px 6px; vertical-align: middle;">${feelRatesHtml}</td>
          <td style="font-weight: 700; color: #0f172a; font-size: 13px; text-align: center; padding: 8px 4px; white-space: nowrap;">${joinedVal}名</td>
        `;
      }
      tbody.appendChild(tr);
    });
  }

  function renderWeeklyStatsTable(records) {
    renderPeriodicStatsTable('table-weekly-stats', records, 'date');
  }

  function renderMonthlyStatsTable(records) {
    renderPeriodicStatsTable('table-monthly-stats', records, 'month');
  }

  function initDonutChart(joined, target) {
    const ctx = document.getElementById('donutChart') || document.getElementById('chart-donut');
    if (!ctx) return;

    if (donutChartInstance) {
      donutChartInstance.destroy();
    }

    const remaining = Math.max(0, target - joined);
    donutChartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['達成入会数', '残り目標数'],
        datasets: [{
          data: [joined, remaining],
          backgroundColor: ['#20c997', '#e9ecef'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '75%',
        plugins: {
          legend: { display: false }
        }
      }
    });
  }

  function initLineChart(labels, values) {
    const ctx = document.getElementById('lineChart') || document.getElementById('chart-line');
    if (!ctx) return;

    if (lineChartInstance) {
      try { lineChartInstance.destroy(); } catch(e){}
    }

    lineChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'ビジター数',
          data: values,
          borderColor: '#0071e3',
          borderWidth: 2.5,
          pointBackgroundColor: '#0071e3',
          pointBorderColor: '#ffffff',
          pointBorderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6,
          backgroundColor: 'rgba(0, 113, 227, 0.06)',
          fill: true,
          tension: 0.35
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            grid: { display: false },
            ticks: { color: '#94a3b8', font: { size: 11, weight: '600' } }
          },
          y: {
            beginAtZero: true,
            grid: { color: '#f1f5f9' },
            ticks: { stepSize: 1, color: '#94a3b8', font: { size: 11, weight: '600' } }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0f172a',
            titleFont: { size: 12, weight: 'bold' },
            bodyFont: { size: 12, weight: 'bold' },
            padding: 10,
            cornerRadius: 8,
            displayColors: false,
            callbacks: {
              label: function(context) {
                return `${context.parsed.y}名 申込`;
              }
            }
          }
        }
      }
    });
  }

  function updateKpiProgressRing(circleId, textId, rate, isEmeraldOnFull = false, forcedColor = 'blue') {
    const circle = document.getElementById(circleId);
    const text = document.getElementById(textId);
    const numRate = Math.max(0, parseFloat(rate) || 0);
    const radius = 20;
    const circumference = 2 * Math.PI * radius; // 125.6637...

    if (text) {
      // Smooth numeric count-up animation if browser supports requestAnimationFrame
      const targetVal = Math.round(numRate);
      const currentVal = parseInt(text.innerText) || 0;
      if (typeof window !== 'undefined' && window.requestAnimationFrame && targetVal !== currentVal) {
        const startTime = performance.now();
        const duration = 400; // ms
        const step = (now) => {
          const progress = Math.min(1, (now - startTime) / duration);
          const easedProgress = 1 - Math.pow(1 - progress, 3); // cubic ease out
          text.innerText = Math.round(currentVal + (targetVal - currentVal) * easedProgress);
          if (progress < 1) {
            window.requestAnimationFrame(step);
          } else {
            text.innerText = targetVal;
          }
        };
        window.requestAnimationFrame(step);
      } else {
        text.innerText = targetVal;
      }

      if (forcedColor === 'red') {
        text.className = 'kpi-ring-value text-red-600';
      } else {
        text.className = 'kpi-ring-value text-blue-600';
      }
    }

    if (circle) {
      const clampedRate = Math.min(numRate, 100);
      const offset = circumference - (clampedRate / 100) * circumference;
      circle.style.strokeDasharray = `${circumference}`;
      circle.style.strokeDashoffset = `${offset}`;

      if (forcedColor === 'red') {
        circle.className = 'kpi-ring-fill red';
      } else {
        circle.className = 'kpi-ring-fill blue';
      }
    }
  }

  function changeStartDate(newVal) {
    showToast(`集計期間を【${newVal} 〜】に変更中...`);
    document.getElementById('loading').style.display = 'flex';

    ApiService.call('updateSettingStartDateApi', newVal)
      .then(res => {
        document.getElementById('loading').style.display = 'none';
        if (res.success) {
          showToast(`✅ 集計期間を【${newVal} 〜】に切り替えました`);
          renderDashboard(res.data);
        }
      })
      .catch(handleError);
  }
</script>
