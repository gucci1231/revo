<script>
  document.addEventListener('DOMContentLoaded', () => {
    hideLoading();

    if (typeof rawInitialData !== 'undefined' && rawInitialData && rawInitialData.dashboardData) {
      try {
        renderDashboard(rawInitialData.dashboardData);
      } catch(e) {
        console.error('Dashboard render error:', e);
        fetchDashboardData();
      }
    } else {
      fetchDashboardData();
    }

    window.addEventListener('hashchange', handleHashRouting);
    if (typeof google !== 'undefined' && google.script && google.script.history) {
      google.script.history.setChangeHandler((e) => {
        handleHashRouting();
      });
    }

    const hash = (window.location.hash || '').replace(/^#/, '');
    if (hash.startsWith('action/')) {
      const apId = hash.replace('action/', '').trim();
      if (apId && typeof openActionReportDirectly === 'function') {
        setTimeout(() => openActionReportDirectly(apId), 150);
      }
    } else if (hash.startsWith('hearing/')) {
      const vid = hash.replace('hearing/', '').trim();
      if (vid) {
        openVisitorDetailView(vid, false);
        setTimeout(() => {
          if (typeof openHearingFormModal === 'function') openHearingFormModal(vid);
        }, 300);
      }
    } else if (hash.startsWith('visitor/')) {
      openVisitorDetailView(hash.replace('visitor/', ''), false);
    } else if (hash && ['dashboard', 'actions', 'priority-follow', 'visitors', 'hearings', 'email-schedule', 'email-templates', 'settings'].includes(hash)) {
      switchTab(hash, false);
    } else if (typeof initialVisitorId !== 'undefined' && initialVisitorId) {
      openVisitorDetailView(initialVisitorId, true);
    } else {
      updateUrlHash('dashboard', { tab: 'dashboard' });
    }
  });
</script>
