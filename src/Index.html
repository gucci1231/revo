  <!-- Global Client Error Reporter -->
  <script>
    window.onerror = function(msg, url, line, col, error) {
      const errInfo = {
        message: String(msg),
        url: String(url),
        line: line,
        col: col,
        stack: error ? String(error.stack) : '',
        href: window.location.href
      };
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.logClientErrorApi(errInfo);
      }
    };
    window.addEventListener('unhandledrejection', function(event) {
      const errInfo = {
        message: 'Unhandled Rejection: ' + (event.reason ? (event.reason.message || event.reason) : ''),
        stack: event.reason ? String(event.reason.stack) : '',
        href: window.location.href
      };
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.logClientErrorApi(errInfo);
      }
    });
    // Sidebar state initialization (prevent layout shift on reload)
    try {
      if (localStorage.getItem('sidebar_collapsed') === 'true' && window.innerWidth >= 1024) {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch(e) {}
  </script>
