<script>
/**
 * Coffee Meeting Management View Controller (Weekday 12:00-12:30 Focus)
 * Adheres strictly to DESIGN.md (Apple-Grade Minimal, Radical Slate, Electric Blue #0071E3)
 */
let coffeeCurrentViewMode = 'month'; // 'month' | 'week'
let coffeeCurrentDate = new Date();
let coffeeFilterScope = 'upcoming'; // 'upcoming' | 'all' | 'past'
let coffeeSearchQuery = '';
let coffeeDraggedVisitorId = null;

function getTodayIsoDate() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDateToIso(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseIsoDate(str) {
  if (!str) return null;
  const parts = str.split(/[-/]/);
  if (parts.length >= 3) {
    return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }
  return null;
}

/**
 * Main initialization & rendering of Coffee Meeting View
 */
function renderCoffeeMeetingView() {
  const container = document.getElementById('view-coffee');
  if (!container) return;

  // Ensure visitors are loaded
  if (typeof cachedAllVisitors === 'undefined' || !cachedAllVisitors || cachedAllVisitors.length === 0) {
    if (typeof fetchAllVisitorsData === 'function') {
      fetchAllVisitorsData().then(() => renderCoffeeMeetingView());
      return;
    }
  }

  // Update Period Label
  updateCoffeePeriodLabel();

  // Map visitors to dates & collect unassigned
  const visitorsMap = getCoffeeVisitorsDateMap();
  const allUnassigned = getCoffeeUnassignedVisitors('all');

  // Update KPI Cards
  updateCoffeeKpiCards(visitorsMap, allUnassigned);

  // Render Calendar according to mode
  if (coffeeCurrentViewMode === 'month') {
    renderCoffeeMonthCalendar(visitorsMap);
  } else {
    renderCoffeeWeekCalendar(visitorsMap);
  }

  // Render Unassigned Visitors Pool (using current filter scope)
  renderCoffeeUnassignedVisitorsPool();
}

/**
 * Extract map of date (YYYY-MM-DD) -> array of visitors
 */
function getCoffeeVisitorsDateMap() {
  const map = {};
  const allVisitors = (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors))
    ? cachedAllVisitors
    : [];

  allVisitors.forEach(v => {
    const rawDate = v.step1CoffeeDate || v.step1_coffee_date;
    if (rawDate) {
      // Normalize to YYYY-MM-DD
      const iso = rawDate.replace(/\//g, '-').slice(0, 10);
      if (!map[iso]) map[iso] = [];
      map[iso].push(v);
    }
  });

  return map;
}

/**
 * Get active visitors who haven't completed coffee meeting and have no scheduled date
 * Supports filterScope: 'all' (default for unit test invariant), 'upcoming', 'past'
 */
function getCoffeeUnassignedVisitors(filterScope = 'all') {
  const allVisitors = (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors))
    ? cachedAllVisitors
    : [];

  const todayIso = getTodayIsoDate();

  return allVisitors.filter(v => {
    // Exclude resigned or closed/joined unless still pending
    if (v.status === 'resigned' || v.status === '退会') return false;
    const st = (typeof getVisitorFollowSteps === 'function') ? getVisitorFollowSteps(v) : null;
    const isDone = st ? (st.s1 && (st.s1.status === '済' || st.s1.status === 'done')) : (v.step1Coffee === '済' || v.step1_coffee === '済');
    const hasDate = !!(v.step1CoffeeDate || v.step1_coffee_date);
    if (isDone || hasDate) return false;

    if (filterScope === 'upcoming') {
      const ev = (v.eventDate || '').replace(/\//g, '-').slice(0, 10);
      // Empty date (prospective candidate) OR future/today date
      return !ev || ev >= todayIso;
    } else if (filterScope === 'past') {
      const ev = (v.eventDate || '').replace(/\//g, '-').slice(0, 10);
      return ev && ev < todayIso;
    }
    return true;
  }).sort((a, b) => {
    const rawA = (a.eventDate || '').replace(/\//g, '-').slice(0, 10);
    const rawB = (b.eventDate || '').replace(/\//g, '-').slice(0, 10);

    // In upcoming mode, prioritize prospective candidates without fixed eventDate
    if (filterScope === 'upcoming') {
      if (!rawA && rawB) return -1;
      if (rawA && !rawB) return 1;
    }

    const dateA = rawA || '9999-12-31';
    const dateB = rawB || '9999-12-31';
    return dateA.localeCompare(dateB);
  });
}

/**
 * Update Header Period Label
 */
function updateCoffeePeriodLabel() {
  const labelEl = document.getElementById('coffee-current-period-label');
  if (!labelEl) return;

  const y = coffeeCurrentDate.getFullYear();
  const m = coffeeCurrentDate.getMonth() + 1;

  if (coffeeCurrentViewMode === 'month') {
    labelEl.textContent = `${y}年 ${m}月`;
  } else {
    // Week mode: display week range
    const startOfWeek = getStartOfWeek(coffeeCurrentDate); // Monday
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 4); // Friday
    const sm = startOfWeek.getMonth() + 1;
    const sd = startOfWeek.getDate();
    const em = endOfWeek.getMonth() + 1;
    const ed = endOfWeek.getDate();
    labelEl.textContent = `${y}年 ${sm}/${sd} 〜 ${em}/${ed}`;
  }
}

/**
 * Get Monday of the current date's week
 */
function getStartOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1); // adjust when day is sunday
  return new Date(date.setDate(diff));
}

/**
 * Period navigation (<, >, Today)
 */
function navigateCoffeePeriod(delta) {
  if (coffeeCurrentViewMode === 'month') {
    coffeeCurrentDate.setMonth(coffeeCurrentDate.getMonth() + delta);
  } else {
    coffeeCurrentDate.setDate(coffeeCurrentDate.getDate() + (delta * 7));
  }
  renderCoffeeMeetingView();
}

function jumpToCurrentCoffeePeriod() {
  coffeeCurrentDate = new Date();
  renderCoffeeMeetingView();
}

/**
 * Toggle view mode: 'month' | 'week'
 */
function setCoffeeViewMode(mode) {
  coffeeCurrentViewMode = mode;
  const monthBtn = document.getElementById('btn-coffee-mode-month');
  const weekBtn = document.getElementById('btn-coffee-mode-week');
  const monthContainer = document.getElementById('coffee-month-container');
  const weekContainer = document.getElementById('coffee-week-container');

  if (mode === 'month') {
    if (monthBtn) {
      monthBtn.className = 'px-2.5 py-1 rounded-md transition-all cursor-pointer bg-white text-slate-900 font-bold shadow-2xs';
    }
    if (weekBtn) {
      weekBtn.className = 'px-2.5 py-1 rounded-md transition-all cursor-pointer text-slate-600 hover:text-slate-900';
    }
    if (monthContainer) monthContainer.classList.remove('hidden');
    if (weekContainer) weekContainer.classList.add('hidden');
  } else {
    if (weekBtn) {
      weekBtn.className = 'px-2.5 py-1 rounded-md transition-all cursor-pointer bg-white text-slate-900 font-bold shadow-2xs';
    }
    if (monthBtn) {
      monthBtn.className = 'px-2.5 py-1 rounded-md transition-all cursor-pointer text-slate-600 hover:text-slate-900';
    }
    if (monthContainer) monthContainer.classList.add('hidden');
    if (weekContainer) weekContainer.classList.remove('hidden');
  }

  renderCoffeeMeetingView();
}

/**
 * Calculate and render KPI metrics
 */
function updateCoffeeKpiCards(visitorsMap, unassignedVisitors) {
  const todayIso = getTodayIsoDate();
  const currentYear = coffeeCurrentDate.getFullYear();
  const currentMonth = coffeeCurrentDate.getMonth() + 1;

  // 1. Next Coffee Meeting (Imminent >= today)
  let nextDate = null;
  let nextVisitor = null;
  const sortedDates = Object.keys(visitorsMap).filter(d => d >= todayIso).sort();
  if (sortedDates.length > 0) {
    nextDate = sortedDates[0];
    const list = visitorsMap[nextDate];
    if (list && list.length > 0) {
      nextVisitor = list[0];
    }
  }

  const nextDateEl = document.getElementById('kpi-coffee-next-date');
  const nextVisitorEl = document.getElementById('kpi-coffee-next-visitor');
  const statusDotEl = document.getElementById('kpi-coffee-status-dot');

  if (nextDateEl) {
    if (nextDate) {
      const dObj = parseIsoDate(nextDate);
      const m = dObj.getMonth() + 1;
      const d = dObj.getDate();
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      nextDateEl.textContent = `${m}/${d} (${days[dObj.getDay()]}) 12:00`;
      if (statusDotEl) statusDotEl.className = 'w-1.5 h-1.5 rounded-full bg-blue-600';
    } else {
      nextDateEl.textContent = '予定なし';
      if (statusDotEl) statusDotEl.className = 'w-1.5 h-1.5 rounded-full bg-slate-300';
    }
  }
  if (nextVisitorEl) {
    if (nextVisitor) {
      const inviterStr = nextVisitor.inviter ? ` (紹介: ${nextVisitor.inviter})` : '';
      nextVisitorEl.textContent = `${nextVisitor.name || '名称未定'} 様${inviterStr}`;
    } else {
      nextVisitorEl.textContent = '空き枠募集中';
    }
  }

  // 2. Month count (Booked / Done in currently viewed month)
  let monthBookedCount = 0;
  const targetPrefix = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
  Object.keys(visitorsMap).forEach(d => {
    if (d.startsWith(targetPrefix)) {
      monthBookedCount += (visitorsMap[d] ? visitorsMap[d].length : 0);
    }
  });
  const monthCountEl = document.getElementById('kpi-coffee-month-count');
  if (monthCountEl) monthCountEl.textContent = monthBookedCount;

  // 3. Month empty slots (Weekdays Mon-Fri in this month >= today with 0 assigned)
  let monthEmptySlots = 0;
  const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
  for (let day = 1; day <= daysInMonth; day++) {
    const testDate = new Date(currentYear, currentMonth - 1, day);
    const dayOfWeek = testDate.getDay();
    if (dayOfWeek >= 1 && dayOfWeek <= 5) {
      const iso = formatDateToIso(testDate);
      if (iso >= todayIso && (!visitorsMap[iso] || visitorsMap[iso].length === 0)) {
        monthEmptySlots++;
      }
    }
  }
  const emptyCountEl = document.getElementById('kpi-coffee-empty-count');
  if (emptyCountEl) emptyCountEl.textContent = monthEmptySlots;

  // 4. Unassigned visitors count
  const upcomingCandidates = getCoffeeUnassignedVisitors('upcoming');
  const unassignedCountEl = document.getElementById('kpi-coffee-unassigned-count');
  if (unassignedCountEl) unassignedCountEl.textContent = upcomingCandidates.length;

  const poolCountEl = document.getElementById('coffee-unassigned-pool-count');
  if (poolCountEl) poolCountEl.textContent = `${upcomingCandidates.length}名`;
}

/**
 * Render Month Calendar View (Pure White Slate & Compact Apple Minimal)
 */
function renderCoffeeMonthCalendar(visitorsMap) {
  const container = document.getElementById('coffee-month-cells');
  if (!container) return;

  const year = coffeeCurrentDate.getFullYear();
  const month = coffeeCurrentDate.getMonth();
  const todayIso = getTodayIsoDate();

  const firstDay = new Date(year, month, 1);
  const totalDays = new Date(year, month + 1, 0).getDate();

  let startOffset = firstDay.getDay() - 1;
  if (startOffset === -1) startOffset = 6;

  let html = '';

  // Leading empty cells
  for (let i = 0; i < startOffset; i++) {
    html += '<div class="min-h-[76px] sm:min-h-[88px] bg-slate-50/40 border border-slate-100/60 rounded-xl p-1.5 opacity-25"></div>';
  }

  // Month days
  for (let day = 1; day <= totalDays; day++) {
    const dObj = new Date(year, month, day);
    const iso = formatDateToIso(dObj);
    const dayOfWeek = dObj.getDay();
    const isWeekday = (dayOfWeek >= 1 && dayOfWeek <= 5);
    const isToday = (iso === todayIso);
    const isPast = (iso < todayIso);
    const isThursday = (dayOfWeek === 4);
    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

    const visitors = visitorsMap[iso] || [];
    const hasVisitor = visitors.length > 0;

    let cellBg = 'bg-white';
    let cellBorder = 'border-slate-200';
    if (isToday) {
      cellBorder = 'border-blue-500 ring-1 ring-blue-500/20';
    } else if (isWeekend) {
      cellBg = 'bg-slate-50/50 hidden sm:block';
      cellBorder = 'border-slate-100';
    }

    const dndAttrs = (isWeekday && !hasVisitor && !isPast)
      ? `ondragover="onCoffeeSlotDragOver(event)" ondragleave="onCoffeeSlotDragLeave(event)" ondrop="onCoffeeSlotDrop(event, '${iso}')"`
      : '';

    html += `
      <div id="coffee-cell-${iso}" class="min-h-[80px] sm:min-h-[92px] ${cellBg} border ${cellBorder} rounded-xl p-1.5 sm:p-2 flex flex-col justify-between transition-all hover:-translate-y-0.5" ${dndAttrs}>
        <!-- Day Number Header -->
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-1.5">
            <span class="text-xs sm:text-sm font-semibold font-mono tabular-nums ${isToday ? 'w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold shadow-2xs' : (isWeekend ? 'text-slate-400' : 'text-slate-800')}">${day}</span>
            ${isThursday ? '<span class="text-[11px] font-bold px-1.5 py-0.2 rounded bg-blue-50 text-blue-700 border border-blue-200 shrink-0">定例会</span>' : ''}
          </div>
          ${isWeekday ? '<span class="text-[11px] text-slate-400 font-mono">12:00</span>' : ''}
        </div>

        <!-- Slot Content (12:00-12:30 Weekdays) -->
        <div class="flex-1 flex flex-col justify-center">
    `;

    if (!isWeekday) {
      html += `
        <div class="text-center py-1 text-xs text-slate-300 select-none">
          -
        </div>
      `;
    } else if (hasVisitor) {
      const v = visitors[0];
      const isDone = (v.step1Coffee === '済' || v.step1_coffee === '済');
      const badgeBg = isDone ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-blue-50 text-blue-700 border-blue-200';
      const badgeText = isDone ? '済' : '予定';

      html += `
        <div class="bg-white border border-slate-200 hover:border-slate-300 rounded-lg p-1.5 transition-all text-left shadow-2xs group relative">
          <div class="flex items-center justify-between gap-1 mb-0.5">
            <span class="text-[11px] font-bold px-1.5 py-0.2 rounded border ${badgeBg}">
              ${badgeText}
            </span>
            <button type="button" onclick="event.stopPropagation(); toggleCoffeeMeetingDone('${escapeHtml(v.id)}', '${isDone ? '未' : '済'}')" class="w-4 h-4 rounded text-xs flex items-center justify-center cursor-pointer transition-colors ${isDone ? 'bg-emerald-600 text-white' : 'bg-slate-100 hover:bg-emerald-600 hover:text-white text-slate-500'}" title="${isDone ? '未完了に戻す' : '完了済みにする'}">
              <i class="fa-solid fa-check"></i>
            </button>
          </div>
          <div class="text-xs font-bold text-slate-900 truncate cursor-pointer hover:text-blue-600" onclick="openVisitorDetailView('${escapeHtml(v.id)}')">
            ${escapeHtml(v.name || '名称未定')}
          </div>
          ${v.inviter ? `<div class="text-[11px] text-slate-500 truncate">紹介: ${escapeHtml(v.inviter)}</div>` : ''}
          ${visitors.length > 1 ? `<div class="text-[11px] text-blue-600 font-bold">+他${visitors.length - 1}件</div>` : ''}
        </div>
      `;
    } else if (!isPast) {
      html += `
        <div class="border border-slate-200 hover:border-blue-500 bg-slate-50/50 hover:bg-blue-50/30 rounded-lg p-1.5 transition-all text-center group cursor-pointer" onclick="openCoffeeAssignModal('${iso}')" title="クリックして予約 / ビジターをドラッグ＆ドロップ">
          <div class="text-xs font-medium text-slate-600 group-hover:text-blue-600 flex items-center justify-center gap-1">
            <i class="fa-solid fa-plus text-[10px]"></i>
            <span>空き枠</span>
          </div>
          <div class="text-[11px] text-slate-400 font-mono">12:00</div>
        </div>
      `;
    } else {
      html += `
        <div class="text-center py-1.5 text-xs text-slate-300">
          未実施
        </div>
      `;
    }

    html += `
        </div>
      </div>
    `;
  }

  container.innerHTML = html;
}

/**
 * Render Week View (5 Large Weekday Cards - Compact)
 */
function renderCoffeeWeekCalendar(visitorsMap) {
  const container = document.getElementById('coffee-week-cards');
  if (!container) return;

  const startOfWeek = getStartOfWeek(coffeeCurrentDate);
  const todayIso = getTodayIsoDate();
  const dayLabels = ['月', '火', '水', '木', '金'];

  let html = '';

  for (let i = 0; i < 5; i++) {
    const curDate = new Date(startOfWeek);
    curDate.setDate(startOfWeek.getDate() + i);
    const iso = formatDateToIso(curDate);
    const isToday = (iso === todayIso);
    const isPast = (iso < todayIso);
    const isThursday = (i === 3);

    const monthNum = curDate.getMonth() + 1;
    const dayNum = curDate.getDate();
    const dayLabel = dayLabels[i];

    const visitors = visitorsMap[iso] || [];
    const hasVisitor = visitors.length > 0;

    const dndAttrs = (!hasVisitor && !isPast)
      ? `ondragover="onCoffeeSlotDragOver(event)" ondragleave="onCoffeeSlotDragLeave(event)" ondrop="onCoffeeSlotDrop(event, '${iso}')"`
      : '';

    html += `
      <div id="coffee-cell-${iso}" class="bg-white border ${isToday ? 'border-blue-500 ring-1 ring-blue-500/20' : 'border-slate-200'} rounded-2xl p-3.5 shadow-xs flex flex-col justify-between min-h-[240px]" ${dndAttrs}>
        <!-- Card Header -->
        <div class="flex items-center justify-between pb-2.5 border-b border-slate-100">
          <div>
            <div class="flex items-center gap-1.5">
              <span class="text-base font-bold text-slate-900 font-mono">${monthNum}/${dayNum}</span>
              <span class="text-xs font-medium text-slate-500">(${dayLabel})</span>
              ${isToday ? '<span class="text-xs font-bold px-1.5 py-0.2 rounded bg-blue-600 text-white shadow-2xs">今日</span>' : ''}
              ${isThursday ? '<span class="text-xs font-bold px-1.5 py-0.2 rounded bg-blue-50 text-blue-700 border border-blue-200">定例会</span>' : ''}
            </div>
            <div class="text-xs text-slate-400 font-medium mt-0.5">
              <span>12:00 〜 12:30 (Zoom)</span>
            </div>
          </div>
          <button type="button" onclick="openCoffeeAssignModal('${iso}')" class="w-7 h-7 rounded-full bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-600 flex items-center justify-center transition-colors cursor-pointer" title="ビジターを予約">
            <i class="fa-solid fa-plus text-xs"></i>
          </button>
        </div>

        <!-- Card Body -->
        <div class="flex-1 py-2 flex flex-col justify-center">
    `;

    if (hasVisitor) {
      visitors.forEach(v => {
        const isDone = (v.step1Coffee === '済' || v.step1_coffee === '済');
        html += `
          <div class="bg-white border border-slate-200 rounded-xl p-2.5 space-y-1.5 mb-2 shadow-2xs">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold px-2 py-0.5 rounded-full border ${isDone ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-blue-50 text-blue-700 border-blue-200'}">
                ${isDone ? '✓ 実施済' : '予約済'}
              </span>
              <button type="button" onclick="toggleCoffeeMeetingDone('${escapeHtml(v.id)}', '${isDone ? '未' : '済'}')" class="text-xs px-2 py-0.5 rounded-md border font-medium transition-colors ${isDone ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-emerald-600 hover:text-white'}">
                ${isDone ? '取消' : '完了'}
              </button>
            </div>
            <div class="text-xs font-bold text-slate-900 cursor-pointer hover:text-blue-600" onclick="openVisitorDetailView('${escapeHtml(v.id)}')">
              ${escapeHtml(v.name || '名称未定')}
            </div>
            <div class="text-xs text-slate-500 space-y-0.5">
              <div>紹介: <b class="text-slate-700">${escapeHtml(v.inviter || '-')}</b></div>
              <div>定例会: <span class="text-slate-600">${escapeHtml(formatShortDate(v.eventDate) || '申込前・未定')}</span></div>
            </div>
            <div class="pt-1.5 border-t border-slate-100 flex items-center justify-between gap-1 text-xs">
              <button type="button" onclick="openVisitorDetailView('${escapeHtml(v.id)}')" class="font-bold text-blue-600 hover:underline">
                カルテ →
              </button>
              <button type="button" onclick="cancelCoffeeMeetingSlot('${escapeHtml(v.id)}')" class="text-rose-500 hover:text-rose-700 hover:underline">
                予約解除
              </button>
            </div>
          </div>
        `;
      });
    } else if (!isPast) {
      html += `
        <div class="border border-slate-200 hover:border-blue-500 bg-slate-50/50 hover:bg-blue-50/30 rounded-xl p-3 text-center space-y-1.5 transition-all cursor-pointer" onclick="openCoffeeAssignModal('${iso}')">
          <div class="text-xs font-bold text-slate-800 group-hover:text-blue-600">空き枠 (12:00)</div>
          <div class="text-xs text-slate-400">クリックまたはドラッグして予約</div>
          <div class="pt-1">
            <button type="button" onclick="event.stopPropagation(); openCoffeeAssignModal('${iso}')" class="w-full py-1.5 px-3 rounded-lg text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-2xs transition-colors flex items-center justify-center gap-1">
              <i class="fa-solid fa-plus text-xs"></i><span>予約</span>
            </button>
          </div>
        </div>
      `;
    } else {
      html += `
        <div class="text-center py-4 text-xs text-slate-300">
          未実施
        </div>
      `;
    }

    html += `
        </div>
      </div>
    `;
  }

  container.innerHTML = html;
}

/**
 * Filter scope switch: 'upcoming' | 'all' | 'past'
 */
function setCoffeeFilterScope(scope) {
  coffeeFilterScope = scope;
  const btnUpcoming = document.getElementById('btn-coffee-filter-upcoming');
  const btnAll = document.getElementById('btn-coffee-filter-all');
  const btnPast = document.getElementById('btn-coffee-filter-past');

  [btnUpcoming, btnAll, btnPast].forEach(btn => {
    if (btn) {
      btn.className = 'py-1 rounded-lg transition-all cursor-pointer text-slate-600 hover:text-slate-900 font-medium';
    }
  });

  if (scope === 'upcoming' && btnUpcoming) {
    btnUpcoming.className = 'py-1 rounded-lg transition-all cursor-pointer bg-white text-slate-900 font-bold shadow-2xs';
  } else if (scope === 'all' && btnAll) {
    btnAll.className = 'py-1 rounded-lg transition-all cursor-pointer bg-white text-slate-900 font-bold shadow-2xs';
  } else if (scope === 'past' && btnPast) {
    btnPast.className = 'py-1 rounded-lg transition-all cursor-pointer bg-white text-slate-900 font-bold shadow-2xs';
  }

  renderCoffeeUnassignedVisitorsPool();
}

/**
 * Incremental Search Handler
 */
function onCoffeeVisitorSearchInput(val) {
  coffeeSearchQuery = (val || '').trim().toLowerCase();
  renderCoffeeUnassignedVisitorsPool();
}

/**
 * Open Modal to Add Prospective/Unregistered Visitor
 */
function openCoffeeAddVisitorModal() {
  if (typeof openAddVisitorModal === 'function') {
    openAddVisitorModal(true);
  }
}

/**
 * Render Right Column Unassigned Visitors Pool (Consistent with ViewTraining & ViewVisitors)
 */
function renderCoffeeUnassignedVisitorsPool(unassignedList = null) {
  const container = document.getElementById('coffee-unassigned-visitors-pool');
  if (!container) return;

  let list = unassignedList || getCoffeeUnassignedVisitors(coffeeFilterScope);

  if (coffeeSearchQuery) {
    list = list.filter(v => {
      const name = (v.name || '').toLowerCase();
      const inviter = (v.inviter || '').toLowerCase();
      const company = (v.company || '').toLowerCase();
      const profession = (v.profession || '').toLowerCase();
      return name.includes(coffeeSearchQuery) ||
             inviter.includes(coffeeSearchQuery) ||
             company.includes(coffeeSearchQuery) ||
             profession.includes(coffeeSearchQuery);
    });
  }

  const poolCountEl = document.getElementById('coffee-unassigned-pool-count');
  if (poolCountEl) {
    poolCountEl.textContent = `${list.length}名`;
  }

  if (list.length === 0) {
    container.innerHTML = `
      <div class="text-center py-10 text-slate-400 space-y-2">
        <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto text-sm">
          ✓
        </div>
        <p class="text-xs font-bold text-slate-700">対象ビジターなし</p>
        <p class="text-[11px] text-slate-400">「登録」から追加できます</p>
      </div>
    `;
    return;
  }

  let html = '';
  list.forEach(v => {
    const isUndecided = !v.eventDate;
    const eventBadge = isUndecided
      ? '<span class="text-[11px] px-2 py-0.5 rounded font-bold bg-blue-50 text-blue-700 border border-blue-200 shrink-0">申込前・未定</span>'
      : `<span class="text-[11px] px-2 py-0.5 rounded font-medium bg-slate-100 text-slate-600 border border-slate-200 shrink-0">定例会 ${escapeHtml(formatShortDate(v.eventDate))}</span>`;

    html += `
      <div draggable="true" ondragstart="onCoffeeVisitorDragStart(event, '${escapeHtml(v.id)}')" class="bg-white hover:border-blue-400 border border-slate-200 rounded-xl p-3 transition-all text-left shadow-2xs group cursor-grab active:cursor-grabbing hover:-translate-y-0.5">
        <div class="flex items-center justify-between gap-1.5 mb-1">
          <div class="text-xs font-bold text-slate-900 truncate">
            ${escapeHtml(v.name || '名称未定')}
          </div>
          ${eventBadge}
        </div>
        <div class="text-xs text-slate-500 font-medium flex items-center justify-between mb-2">
          <span>紹介: <b class="text-slate-700">${escapeHtml(v.inviter || '-')}</b></span>
          <span class="text-slate-400 truncate max-w-[100px] text-[11px]">${escapeHtml(v.company || v.profession || '')}</span>
        </div>
        <div class="flex items-center gap-1.5 pt-2 border-t border-slate-100">
          <button type="button" onclick="assignVisitorToNextAvailableSlot('${escapeHtml(v.id)}')" class="flex-1 py-1.5 px-2.5 rounded-lg text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-2xs transition-colors flex items-center justify-center gap-1 cursor-pointer">
            <i class="fa-solid fa-calendar-plus text-[10px]"></i><span>予約</span>
          </button>
          <button type="button" onclick="copyCoffeeMeetingInvitation('${escapeHtml(v.id)}')" class="py-1.5 px-2.5 rounded-lg text-xs font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 shadow-2xs transition-colors cursor-pointer" title="案内文コピー">
            <i class="fa-regular fa-copy"></i>
          </button>
          <button type="button" onclick="openVisitorDetailView('${escapeHtml(v.id)}')" class="py-1.5 px-2.5 rounded-lg text-xs font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 shadow-2xs transition-colors cursor-pointer" title="カルテ">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

/**
 * Drag and Drop Handlers for Assigning Visitor to Date Cell
 */
function onCoffeeVisitorDragStart(e, visitorId) {
  coffeeDraggedVisitorId = visitorId;
  if (e.dataTransfer) {
    e.dataTransfer.setData('text/plain', visitorId);
    e.dataTransfer.effectAllowed = 'copyMove';
  }
}

function onCoffeeSlotDragOver(e) {
  e.preventDefault();
  if (e.dataTransfer) {
    e.dataTransfer.dropEffect = 'copy';
  }
  const target = e.currentTarget;
  if (target) {
    target.classList.add('ring-2', 'ring-blue-500', 'bg-blue-50/40');
  }
}

function onCoffeeSlotDragLeave(e) {
  const target = e.currentTarget;
  if (target) {
    target.classList.remove('ring-2', 'ring-blue-500', 'bg-blue-50/40');
  }
}

function onCoffeeSlotDrop(e, targetDate) {
  e.preventDefault();
  const target = e.currentTarget;
  if (target) {
    target.classList.remove('ring-2', 'ring-blue-500', 'bg-blue-50/40');
  }

  const vId = (e.dataTransfer ? e.dataTransfer.getData('text/plain') : null) || coffeeDraggedVisitorId;
  coffeeDraggedVisitorId = null;

  if (vId && targetDate) {
    openCoffeeAssignModal(targetDate, vId);
  }
}

/**
 * High-Conversion Feature: Copy List of Available Slots
 */
function copyAvailableCoffeeSlotsText() {
  const visitorsMap = getCoffeeVisitorsDateMap();
  const todayIso = getTodayIsoDate();
  const days = ['日', '月', '火', '水', '木', '金', '土'];

  // Collect empty weekday slots for next 2 weeks (10 weekdays)
  const emptySlots = [];
  const start = new Date();

  for (let i = 0; i < 21 && emptySlots.length < 8; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const dayOfWeek = d.getDay();
    if (dayOfWeek >= 1 && dayOfWeek <= 5) {
      const iso = formatDateToIso(d);
      if (iso >= todayIso && (!visitorsMap[iso] || visitorsMap[iso].length === 0)) {
        const m = d.getMonth() + 1;
        const day = d.getDate();
        const dayName = days[dayOfWeek];
        emptySlots.push(`・${m}月${day}日(${dayName}) 12:00〜12:30 【空き枠】`);
      }
    }
  }

  let text = `【平日 12:00〜12:30 事前コーヒーミーティング 空き日程】\n`;
  text += `定例会をより有意義にしていただくための、30分間の事前Zoomヒアリング（無料）です！\n\n`;
  if (emptySlots.length > 0) {
    text += `▼ 直近の空き枠一覧\n` + emptySlots.join('\n') + `\n\n`;
  } else {
    text += `※現在直近の枠が埋まっております。個別の日程調整をご希望の場合はご連絡ください。\n\n`;
  }
  text += `ご都合のよろしい日程がございましたら、お気軽に番号または日時をお知らせください！\n`;
  text += `Zoomにてお話しできるのを楽しみにしております。`;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      if (typeof showToast === 'function') {
        showToast('📋 空き日程リストの案内文をコピーしました！', 'success');
      } else {
        alert('空き日程の案内文をコピーしました');
      }
    }).catch(err => {
      console.error('Clipboard copy error:', err);
      prompt('以下のテキストをコピーしてください:', text);
    });
  } else {
    prompt('以下のテキストをコピーしてください:', text);
  }
}

/**
 * Copy invitation text for a single specific slot
 */
function copySingleCoffeeSlotInvitation(dateStr) {
  try {
    const d = parseIsoDate(dateStr);
    if (!d) return;
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const dayName = days[d.getDay()];

    let text = `【事前コーヒーミーティング日程のご案内】\n`;
    text += `日時：${m}月${day}日(${dayName}) 12:00〜12:30\n`;
    text += `形式：オンライン (Zoom)\n\n`;
    text += `定例会ご参加前に、事業の課題や求めている人脈についてお伺いする30分間の事前ヒアリングです。\n`;
    text += `こちらの枠で調整可能でしたら、お返事いただけますと幸いです！`;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        if (typeof showToast === 'function') {
          showToast(`📋 ${m}/${day} の案内文をコピーしました`, 'success');
        } else {
          alert('案内文をコピーしました');

  }

/**
 * Copy personal invitation for a specific visitor
 */
function copyCoffeeMeetingInvitation(visitorId) {
  const allVisitors = (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors))
    ? cachedAllVisitors
    : [];
  const v = allVisitors.find(item => String(item.id) === String(visitorId));
  if (!v) return;

  try {
    const name = v.name || '様';
    const inviter = v.inviter ? `（紹介者: ${v.inviter}さん）` : '';
    let text = `${name}様\n\n`;
    text += `BNI定例会へのご関心、誠にありがとうございます！${inviter}\n`;
    text += `定例会（毎週木曜朝）をより実りある時間にしていただくために、平日12:00〜12:30にて30分間の「事前コーヒーミーティング（Zoom）」を実施しております。\n\n`;
    text += `どのような事業をされているか、どんな人脈や協業先と繋がりたいかを事前にお伺いし、定例会当日に最適なメンバーとお引き合わせできるように準備させていただきます。\n\n`;
    text += `平日12:00〜12:30でご都合のよろしいお日にちをいくつかお知らせいただけますでしょうか？\n`;
    text += `どうぞよろしくお願いいたします！`;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        if (typeof showToast === 'function') {
          showToast(`📋 ${name}様 宛の招待文をコピーしました`, 'success');
        } else {
          alert('招待文をコピーしました');
        }
      });
    } else {
      prompt('以下のテキストをコピーしてください:', text);
    }
  } catch (e) {

  }
}

/**
 * Assign visitor to the next available weekday slot
 */
function assignVisitorToNextAvailableSlot(visitorId) {
  const visitorsMap = getCoffeeVisitorsDateMap();
  const todayIso = getTodayIsoDate();
  const start = new Date();
  let targetIso = null;

  for (let i = 0; i < 30; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const dayOfWeek = d.getDay();
    if (dayOfWeek >= 1 && dayOfWeek <= 5) {
      const iso = formatDateToIso(d);
      if (iso >= todayIso && (!visitorsMap[iso] || visitorsMap[iso].length === 0)) {
        targetIso = iso;
        break;
      }
    }
  }

  if (!targetIso) {
    targetIso = todayIso;
  }

  openCoffeeAssignModal(targetIso, visitorId);
}

/**
 * Auto assign next unassigned visitor to the earliest available slot
 */
function autoAssignNextUnassignedVisitor() {
  const unassigned = getCoffeeUnassignedVisitors('upcoming');
  if (unassigned.length === 0) {
    if (typeof showToast === 'function') {
      showToast('未予約のビジターはいません', 'info');
    } else {
      alert('未予約のビジターはいません');
    }
    return;
  }

  assignVisitorToNextAvailableSlot(unassigned[0].id);
}

/**
 * Toggle Done status for a coffee meeting
 */
async function toggleCoffeeMeetingDone(visitorId, newStatus) {
  try {
    if (typeof updateVisitorStatusApi === 'function' || typeof ApiService !== 'undefined') {
      await ApiService.call('updateVisitorStatusApi', visitorId, 'step1_coffee', newStatus);
    }

    if (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors)) {
      const v = cachedAllVisitors.find(item => String(item.id) === String(visitorId));
      if (v) {
        v.step1Coffee = newStatus;
        v.step1_coffee = newStatus;
      }
    }

    if (typeof showToast === 'function') {
      showToast(newStatus === '済' ? '☕ ミーティングを完了にしました' : '未完了に戻しました', 'success');
    }

    renderCoffeeMeetingView();
  } catch (error) {
    console.error('Failed to toggle coffee meeting status:', error);
    alert('ステータス更新に失敗しました: ' + (error.message || '通信エラー'));
  }
}

/**
 * Cancel / Unassign coffee meeting slot for a visitor
 */
async function cancelCoffeeMeetingSlot(visitorId) {
  if (!confirm('このビジターのコーヒーミーティング予約を解除しますか？')) {
    return;
  }

  try {
    if (typeof updateVisitorStatusApi === 'function' || typeof ApiService !== 'undefined') {
      await ApiService.call('updateVisitorStatusApi', visitorId, 'step1_coffee_date', '');
      await ApiService.call('updateVisitorStatusApi', visitorId, 'step1_coffee', '未');
    }

    if (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors)) {
      const v = cachedAllVisitors.find(item => String(item.id) === String(visitorId));
      if (v) {
        v.step1Coffee = '未';
        v.step1_coffee = '未';
        v.step1CoffeeDate = '';
        v.step1_coffee_date = '';
      }
    }

    if (typeof showToast === 'function') {
      showToast('予約を解除し、候補プールに戻しました', 'info');
    }

    renderCoffeeMeetingView();
  } catch (error) {
    console.error('Failed to cancel coffee slot:', error);
    alert('予約解除に失敗しました');
  }
}
