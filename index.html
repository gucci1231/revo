<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>REvo 定例会ビジター管理 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #e63946;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 20px;
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div id="loading" class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-title">REvo 定例会ビジター管理 2.0</div>
    <div class="loading-sub">システムを初期化中...</div>
  </div>

  <iframe id="app-frame" allow="clipboard-write; clipboard-read; camera; microphone"></iframe>

  <script>
    (function() {
      const baseUrl = "https://script.google.com/macros/s/AKfycbydC-gIMjpdAoeQpsgIwq-RQcBzWHZ17yijcMxc_zm2BNZfWxbij9DO2XutZxs1jO11/exec";
      const currentQuery = window.location.search;
      const iframe = document.getElementById('app-frame');
      const loading = document.getElementById('loading');

      iframe.src = baseUrl + currentQuery;

      iframe.onload = function() {
        setTimeout(function() {
          loading.classList.add('hidden');
        }, 300);
      };

      // Safety timeout in case iframe onload event is delayed
      setTimeout(function() {
        if (!loading.classList.contains('hidden')) {
          loading.classList.add('hidden');
        }
      }, 5000);
    })();
  </script>
</body>
</html>
