<script>
  /* --- URL Hash Router & Navigation Utilities --- */
  let isProgrammaticHashChange = false;

  function updateUrlHash(hashStr, stateObj = {}) {
    if (!hashStr) return;
    const cleanHash = String(hashStr).replace(/^#+/, '');
    
    // もし現在のpathnameが /member/... 等になっている場合、ルートパスに戻す
    const currentPath = window.location.pathname || '';
    if (currentPath.includes('/member/') || (currentPath !== '/' && currentPath !== '/index.html')) {
      try {
        if (window.history && window.history.pushState) {
          isProgrammaticHashChange = true;
          const targetUrl = (cleanHash === 'dashboard' || !cleanHash) ? '/' : ('/#' + cleanHash);
          window.history.pushState(stateObj, '', targetUrl);
          setTimeout(() => { isProgrammaticHashChange = false; }, 100);
          return;
        }
      } catch (e) {}
    }

    if (window.location.hash !== '#' + cleanHash) {
      isProgrammaticHashChange = true;
      window.location.hash = '#' + cleanHash;
      setTimeout(() => { isProgrammaticHashChange = false; }, 100);
    }
    if (typeof google !== 'undefined' && google.script && google.script.history) {
      try {
        google.script.history.push(stateObj, stateObj, '#' + cleanHash);
      } catch (e) {}
    }
  }

  function handleHashRouting() {
    if (isProgrammaticHashChange) return;
    const rawHash = decodeURIComponent(window.location.hash || '');
    const hash = rawHash.replace(/^#+/, '');
    if (hash.startsWith('action/')) {
      const apId = hash.replace('action/', '').trim();
      if (apId && typeof openActionReportDirectly === 'function') {
        openActionReportDirectly(apId);
      }
    } else if (hash.startsWith('hearing/')) {
      const vid = hash.replace('hearing/', '').trim();
      if (vid) {
        openVisitorDetailView(vid, false);
        setTimeout(() => {
          if (typeof openHearingFormModal === 'function') openHearingFormModal(vid);
        }, 300);
      }
    } else if (hash.startsWith('visitor/')) {
      const vid = hash.replace('visitor/', '').trim();
      if (vid && vid !== currentVdVisitorId) {
        openVisitorDetailView(vid, false);
      }
    } else if (hash.startsWith('member/') || hash.startsWith('member-dashboard')) {
      switchTab('member-dashboard', false);
      let targetMember = null;
      if (hash.startsWith('member/')) {
        targetMember = hash.replace('member/', '').split('?')[0].trim();
      } else {
        const match = hash.match(/[?&]name=([^&]+)/);
        if (match) {
          targetMember = match[1];
        }
      }
      setTimeout(() => {
        if (typeof initMemberDashboard === 'function') {
          initMemberDashboard(targetMember);
        }
      }, 50);
    } else if (hash.startsWith('visitors')) {
      switchTab('visitors', false);
      if (hash.includes('considering')) {
        setTimeout(() => { if (typeof setVisitorsStatusFilter === 'function') setVisitorsStatusFilter('considering'); }, 50);
      } else if (hash.includes('joined')) {
        setTimeout(() => { if (typeof setVisitorsStatusFilter === 'function') setVisitorsStatusFilter('joined'); }, 50);
      } else if (hash.includes('attended')) {
        setTimeout(() => { if (typeof setVisitorsStatusFilter === 'function') setVisitorsStatusFilter('attended'); }, 50);
      } else if (hash.includes('hot')) {
        setTimeout(() => { if (typeof setVisitorsStatusFilter === 'function') setVisitorsStatusFilter('hot'); }, 50);
      }
    } else if (hash.startsWith('settings')) {
      switchTab('settings', false);
      if (hash.includes('goals') || hash.includes('kpi')) {
        setTimeout(() => { if (typeof switchSettingsSubTab === 'function') switchSettingsSubTab('goals'); }, 50);
      } else if (hash.includes('members') || hash.includes('member')) {
        setTimeout(() => { if (typeof switchSettingsSubTab === 'function') switchSettingsSubTab('members'); }, 50);
      } else if (hash.includes('maintenance') || hash.includes('sync')) {
        setTimeout(() => { if (typeof switchSettingsSubTab === 'function') switchSettingsSubTab('maintenance'); }, 50);
      } else if (hash.includes('period') || hash.includes('term')) {
        setTimeout(() => { if (typeof switchSettingsSubTab === 'function') switchSettingsSubTab('period'); }, 50);
      }
    } else if (['dashboard', 'actions', 'action-plans', 'priority-follow', 'hearings', 'email-schedule', 'email-templates', 'report-manager', 'reports'].includes(hash)) {
      switchTab(hash === 'action-plans' ? 'actions' : (hash === 'reports' ? 'report-manager' : hash), false);
    }
  }

  window.addEventListener('popstate', (e) => {
    const currentPath = decodeURIComponent(window.location.pathname || '');
    const pathMatch = currentPath.match(/\/member\/([^\/\?#]+)/);
    if (pathMatch && pathMatch[1]) {
      switchTab('member-dashboard', false);
      setTimeout(() => {
        if (typeof selectMemberDashboard === 'function') {
          selectMemberDashboard(pathMatch[1].trim(), false);
        }
      }, 50);
    } else {
      handleHashRouting();
    }
  });

  /* --- ☰ Left Drawer & Sidebar Controller --- */
  function toggleLeftDrawer() {
    const drawer = document.getElementById('left-drawer');
    if (drawer && drawer.classList.contains('open')) {
      closeLeftDrawer();
    } else {
      openLeftDrawer();
    }
  }

  function openLeftDrawer() {
    const drawer = document.getElementById('left-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    if (drawer) drawer.classList.add('open');
    if (backdrop) backdrop.classList.add('open');
  }

  function closeLeftDrawer() {
    const drawer = document.getElementById('left-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    if (drawer) drawer.classList.remove('open');
    if (backdrop) backdrop.classList.remove('open');
  }

  function toggleSidebarCollapse() {
    if (window.innerWidth < 1024) {
      // On mobile/tablet, open/close drawer instead
      toggleLeftDrawer();
      return;
    }
    const isCollapsed = document.body.classList.toggle('sidebar-collapsed');
    if (document.documentElement) {
      if (isCollapsed) {
        document.documentElement.classList.add('sidebar-collapsed');
      } else {
        document.documentElement.classList.remove('sidebar-collapsed');
      }
    }
    try {
      localStorage.setItem('sidebar_collapsed', isCollapsed ? 'true' : 'false');
    } catch (e) {}

    // Dispatch resize event so charts or custom grids adjust immediately
    setTimeout(() => {
      window.dispatchEvent(new Event('resize'));
    }, 260);
  }

  function initSidebarState() {
    try {
      const isCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
      if (isCollapsed && window.innerWidth >= 1024) {
        document.body.classList.add('sidebar-collapsed');
        if (document.documentElement) document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch (e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSidebarState);
  } else {
    initSidebarState();
  }

  const PAGE_NAV_INFO = {
    'dashboard': { title: 'ダッシュボード', icon: 'fa-solid fa-chart-pie' },
    'actions': { title: 'アクション管理', icon: 'fa-solid fa-bullseye' },
    'member-dashboard': { title: 'メンバー別ダッシュボード', icon: 'fa-solid fa-id-badge' },
    'priority-follow': { title: '最優先フォロー', icon: 'fa-solid fa-fire' },
    'visitors': { title: '全ビジター統合管理名簿', icon: 'fa-solid fa-users' },
    'hearings': { title: 'ヒアリングシート一覧', icon: 'fa-solid fa-file-lines' },
    'email-schedule': { title: 'メール送信予定一覧', icon: 'fa-solid fa-clock' },
    'email-templates': { title: 'メールテンプレート管理', icon: 'fa-solid fa-envelope-open-text' },
    'report-manager': { title: '報告・メッセージ管理', icon: 'fa-solid fa-paper-plane' },
    'settings': { title: '各種設定・メンバー管理', icon: 'fa-solid fa-gear' },
    'visitor-detail': { title: 'ビジター詳細', icon: 'fa-solid fa-user-tag' }
  };

  function updateHeaderCurrentPage(tabName, customTitle = null, customIcon = null) {
    const info = PAGE_NAV_INFO[tabName] || { title: 'ビジター管理', icon: 'fa-solid fa-layer-group' };
    const titleEl = document.getElementById('header-page-title');
    const iconEl = document.getElementById('header-page-icon');
    const badgeEl = document.getElementById('header-current-page');
    if (titleEl) titleEl.innerText = customTitle || info.title;
    if (iconEl) iconEl.innerHTML = `<i class="${customIcon || info.icon}"></i>`;
    if (badgeEl) {
      badgeEl.classList.remove('header-badge-animated');
      void badgeEl.offsetWidth;
      badgeEl.classList.add('header-badge-animated');
    }
  }

  /* --- Tab Navigation Controller --- */
  function switchTab(tabName, updateHash = true) {
    if (tabName !== 'visitor-detail') {
      previousTabBeforeDetail = tabName;
      currentVdVisitorId = null;
    }

    updateHeaderCurrentPage(tabName);

    ['dashboard', 'actions', 'member-dashboard', 'priority-follow', 'visitors', 'hearings', 'email-schedule', 'email-templates', 'report-manager', 'settings', 'visitor-detail'].forEach(t => {
      const btn = document.getElementById('tab-btn-' + t);
      const drawerItem = document.getElementById('drawer-item-' + t);
      const mobileNavBtn = document.getElementById('mobile-nav-' + t);
      const view = document.getElementById('view-' + t);
      if (btn) btn.classList.remove('active');
      if (drawerItem) drawerItem.classList.remove('active');
      if (mobileNavBtn) mobileNavBtn.classList.remove('active');
      if (view) view.classList.remove('active');
    });

    const targetBtn = document.getElementById('tab-btn-' + tabName);
    const targetDrawerItem = document.getElementById('drawer-item-' + tabName);
    const targetMobileBtn = document.getElementById('mobile-nav-' + tabName);
    const targetView = document.getElementById('view-' + tabName);
    if (targetBtn) targetBtn.classList.add('active');
    if (targetDrawerItem) targetDrawerItem.classList.add('active');
    if (targetMobileBtn) targetMobileBtn.classList.add('active');
    if (targetView) targetView.classList.add('active');

    if (window.innerWidth < 1024) {
      closeLeftDrawer();
    }

    if (updateHash && tabName !== 'visitor-detail') {
      updateUrlHash(tabName, { tab: tabName });
    }

    if (tabName === 'actions') {
      if (typeof fetchActionsManagementData === 'function') fetchActionsManagementData(true);
    } else if (tabName === 'member-dashboard') {
      if (typeof initMemberDashboard === 'function') initMemberDashboard();
    } else if (tabName === 'priority-follow') {
      fetchPriorityFollowData(true);
    } else if (tabName === 'visitors') {
      fetchAllVisitorsData(true);
    } else if (tabName === 'hearings') {
      fetchHearingListData(true);
    } else if (tabName === 'email-schedule') {
      fetchScheduledEmailsData(true);
    } else if (tabName === 'email-templates') {
      fetchEmailTemplatesData(true);
    } else if (tabName === 'report-manager') {
      if (typeof initReportManager === 'function') initReportManager();
    } else if (tabName === 'settings') {
      if (typeof fetchGoalsSettings === 'function') fetchGoalsSettings(true);
      fetchMembersMasterData();
    }
  }

  function showTableSkeleton(tbodyId, cols = 8, rows = 4) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    let html = '';
    for (let i = 0; i < rows; i++) {
      html += '<tr>';
      for (let c = 0; c < cols; c++) {
        html += '<td><div class="skeleton skeleton-row"></div></td>';
      }
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }
</script>
