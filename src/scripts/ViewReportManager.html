<script>
  /* --- 📢 Report & Message Manager Logic (6 Mentor Reports & Schedule Control) --- */
  let cachedReportTemplates = [];
  let currentSelectedReportId = 'weekly_visitor_status';
  let currentReportChannel = 'email'; // 'email' | 'line'

  const REPORT_TAGS = {
    weekly_visitor_status: [
      { tag: '{{定例会日付}}', label: '定例会日付' },
      { tag: '{{週間目標数}}', label: '週間目標数' },
      { tag: '{{現在申込数}}', label: '現在申込数' },
      { tag: '{{目標差分}}', label: '目標差分' },
      { tag: '{{達成率}}', label: '達成率(%)' },
      { tag: '{{メンターメッセージ}}', label: 'メンターメッセージ' },
      { tag: '{{招待貢献メンバー一覧HTML}}', label: '招待メンバー(HTML)' },
      { tag: '{{招待貢献メンバーLINE一覧}}', label: '招待メンバー(LINE)' },
      { tag: '{{ダッシュボードURL}}', label: 'ダッシュボードURL' }
    ],
    tuesday_visitor_intro: [
      { tag: '{{定例会日付}}', label: '定例会日付' },
      { tag: '{{参加予定ビジター数}}', label: '参加ビジター数' },
      { tag: '{{参加予定ビジターカード一覧HTML}}', label: 'ビジター紹介(HTML)' },
      { tag: '{{参加予定ビジターLINE一覧}}', label: 'ビジター紹介(LINE)' },
      { tag: '{{ダッシュボードURL}}', label: 'ダッシュボードURL' }
    ],
    weekly_full_report: [
      { tag: '{{週間申込数}}', label: '今週の申込数' },
      { tag: '{{完了アクション数}}', label: '完了アクション数' },
      { tag: '{{フォロー中件数}}', label: 'フォロー中件数' },
      { tag: '{{残ToDo数}}', label: '要対応残数' },
      { tag: '{{フォロー中ビジターテーブルHTML}}', label: 'フォロー中一覧(HTML)' },
      { tag: '{{フォロー中重要ビジターLINE一覧}}', label: 'フォロー中一覧(LINE)' },
      { tag: '{{ダッシュボードURL}}', label: 'ダッシュボードURL' }
    ],
    action_completed: [
      { tag: '{{担当者名}}', label: '担当メンバー名' },
      { tag: '{{ビジター名}}', label: 'ビジター名' },
      { tag: '{{ビジター会社}}', label: '会社・専門分野' },
      { tag: '{{招待者名}}', label: '招待メンバー名' },
      { tag: '{{アクション内容}}', label: 'アクション内容' },
      { tag: '{{報告内容}}', label: '報告コメント' },
      { tag: '{{カルテURL}}', label: 'カルテURL' }
    ],
    today_due_tasks: [
      { tag: '{{本日日付}}', label: '本日日付' },
      { tag: '{{本日期限件数}}', label: '本日期限件数' },
      { tag: '{{本日期限タスクテーブルHTML}}', label: '期限タスク(HTML)' },
      { tag: '{{本日期限タスクLINE一覧}}', label: '期限タスク(LINE)' },
      { tag: '{{アクション管理URL}}', label: 'アクション管理URL' }
    ],
    new_visitor_applied: [
      { tag: '{{招待者名}}', label: '招待メンバー名' },
      { tag: '{{ビジター名}}', label: 'ビジター名' },
      { tag: '{{ビジター会社}}', label: 'ビジター会社' },
      { tag: '{{ビジターカテゴリー}}', label: '専門分野' },
      { tag: '{{参加予定日}}', label: '参加予定日' },
      { tag: '{{カルテURL}}', label: 'カルテURL' }
    ]
  };

  const ALL_REPORT_IDS = [
    'weekly_visitor_status',
    'tuesday_visitor_intro',
    'weekly_full_report',
    'action_completed',
    'today_due_tasks',
    'new_visitor_applied'
  ];

  function initReportManager() {
    fetchReportTemplatesData(false);
  }

  function fetchReportTemplatesData(force = false) {
    if (!force && cachedReportTemplates && cachedReportTemplates.length >= 6) {
      renderReportManagerUI();
      return;
    }

    if (typeof ApiService !== 'undefined' && ApiService.call) {
      ApiService.call('getReportTemplatesApi').then(res => {
        if (res && res.templates) {
          cachedReportTemplates = res.templates;
        }
        renderReportManagerUI();
      }).catch(err => {
        console.error('Failed to load report templates:', err);
        renderReportManagerUI();
      });
    }
  }

  function switchReportTab(reportId) {
    currentSelectedReportId = reportId;

    ALL_REPORT_IDS.forEach(id => {
      const itemEl = document.getElementById('rm-item-' + id);
      if (itemEl) {
        if (id === reportId) {
          itemEl.className = 'rm-nav-item p-3 rounded-xl border-2 border-blue-600 bg-blue-50/40 shadow-2xs transition-all cursor-pointer flex items-center justify-between gap-3';
        } else {
          itemEl.className = 'rm-nav-item p-3 rounded-xl border border-slate-200/80 bg-white hover:bg-slate-50 transition-all cursor-pointer flex items-center justify-between gap-3 group';
        }
      }
    });

    renderReportManagerUI();
  }

  function switchReportChannel(channel) {
    currentReportChannel = channel;

    const btnEmail = document.getElementById('rm-channel-btn-email');
    const btnLine = document.getElementById('rm-channel-btn-line');
    const formEmail = document.getElementById('rm-form-email');
    const formLine = document.getElementById('rm-form-line');
    const previewEmail = document.getElementById('rm-preview-container-email');
    const previewLine = document.getElementById('rm-preview-container-line');

    if (channel === 'email') {
      if (btnEmail) btnEmail.className = 'flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-2xs cursor-pointer flex items-center justify-center gap-1.5 transition';
      if (btnLine) btnLine.className = 'flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 cursor-pointer flex items-center justify-center gap-1.5 transition';
      if (formEmail) formEmail.style.display = 'block';
      if (formLine) formLine.style.display = 'none';
      if (previewEmail) previewEmail.style.display = 'block';
      if (previewLine) previewLine.style.display = 'none';
    } else {
      if (btnEmail) btnEmail.className = 'flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 cursor-pointer flex items-center justify-center gap-1.5 transition';
      if (btnLine) btnLine.className = 'flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-2xs cursor-pointer flex items-center justify-center gap-1.5 transition';
      if (formEmail) formEmail.style.display = 'none';
      if (formLine) formLine.style.display = 'block';
      if (previewEmail) previewEmail.style.display = 'none';
      if (previewLine) previewLine.style.display = 'block';
    }

    updateReportPreview();
  }

  function getCurrentTemplate() {
    return cachedReportTemplates.find(t => t.id === currentSelectedReportId) || {
      id: currentSelectedReportId,
      title: '通知テンプレート',
      schedule_type: 'weekly',
      schedule_day: 'Sun',
      schedule_time: '20:00',
      is_enabled: 1,
      email_subject: '',
      email_html_body: '',
      line_template_body: '',
      default_recipients: 'info@k-d-o.biz'
    };
  }

  function onScheduleTypeChange(val) {
    const daySelect = document.getElementById('rm-schedule-day');
    const timeInput = document.getElementById('rm-schedule-time');

    if (val === 'weekly') {
      if (daySelect) daySelect.style.display = 'inline-block';
      if (timeInput) timeInput.style.display = 'inline-block';
    } else if (val === 'daily') {
      if (daySelect) daySelect.style.display = 'none';
      if (timeInput) timeInput.style.display = 'inline-block';
    } else { // instant
      if (daySelect) daySelect.style.display = 'none';
      if (timeInput) timeInput.style.display = 'none';
    }
  }

  function renderReportManagerUI() {
    const t = getCurrentTemplate();

    // 左カラムの全アイテムのアクティブ状態とステータスドットを更新
    ALL_REPORT_IDS.forEach(id => {
      const itemEl = document.getElementById('rm-item-' + id);
      const badgeEl = document.getElementById('rm-badge-' + id);
      const tmpl = cachedReportTemplates.find(x => x.id === id);

      if (itemEl) {
        if (id === currentSelectedReportId) {
          itemEl.className = 'rm-nav-item p-3 rounded-xl border-2 border-blue-600 bg-blue-50/40 shadow-2xs transition-all cursor-pointer flex items-center justify-between gap-3';
        } else {
          itemEl.className = 'rm-nav-item p-3 rounded-xl border border-slate-200/80 bg-white hover:bg-slate-50 transition-all cursor-pointer flex items-center justify-between gap-3 group';
        }
      }

      if (badgeEl) {
        const enabled = tmpl ? Number(tmpl.is_enabled) === 1 : true;
        badgeEl.className = enabled ? 'w-2 h-2 rounded-full bg-emerald-500 shrink-0' : 'w-2 h-2 rounded-full bg-slate-300 shrink-0';
        badgeEl.title = enabled ? '有効 (配信中)' : '無効 (停止中)';
      }
    });

    const titleEl = document.getElementById('rm-current-title');
    const toggleEl = document.getElementById('rm-enabled-toggle');
    const labelEl = document.getElementById('rm-enabled-label');
    const schedTypeEl = document.getElementById('rm-schedule-type');
    const schedDayEl = document.getElementById('rm-schedule-day');
    const schedTimeEl = document.getElementById('rm-schedule-time');
    const recipientsEl = document.getElementById('rm-email-recipients');
    const subjectEl = document.getElementById('rm-email-subject');
    const emailBodyEl = document.getElementById('rm-email-body');
    const lineBodyEl = document.getElementById('rm-line-body');

    if (titleEl) titleEl.innerText = t.title || '通知テンプレート';
    const isEnabled = Number(t.is_enabled) === 1;
    if (toggleEl) toggleEl.checked = isEnabled;
    if (labelEl) {
      labelEl.innerText = isEnabled ? '有効 (配信対象)' : '無効 (停止中)';
      labelEl.className = isEnabled ? 'text-xs font-bold text-emerald-600' : 'text-xs font-bold text-slate-400';
    }

    if (schedTypeEl) {
      schedTypeEl.value = t.schedule_type || 'weekly';
      onScheduleTypeChange(schedTypeEl.value);
    }
    if (schedDayEl) schedDayEl.value = t.schedule_day || 'Sun';
    if (schedTimeEl) schedTimeEl.value = t.schedule_time || '20:00';

    if (recipientsEl) recipientsEl.value = t.default_recipients || 'info@k-d-o.biz';
    if (subjectEl) subjectEl.value = t.email_subject || '';
    if (emailBodyEl) emailBodyEl.value = t.email_html_body || '';
    if (lineBodyEl) lineBodyEl.value = t.line_template_body || '';

    renderPlaceholderChips();
    updateReportPreview();
  }

  function renderPlaceholderChips() {
    const tags = REPORT_TAGS[currentSelectedReportId] || [];
    const emailContainer = document.getElementById('rm-email-placeholder-chips');
    const lineContainer = document.getElementById('rm-line-placeholder-chips');

    const makeChips = (targetInputId) => {
      return tags.map(item => `
        <button type="button" onclick="insertTagIntoTextarea('${targetInputId}', '${item.tag}')" class="px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-mono border border-slate-200/80 transition cursor-pointer" title="${item.label}">
          ${escapeHtml(item.tag)}
        </button>
      `).join('');
    };

    if (emailContainer) emailContainer.innerHTML = makeChips('rm-email-body');
    if (lineContainer) lineContainer.innerHTML = makeChips('rm-line-body');
  }

  function insertTagIntoTextarea(targetId, tag) {
    const textarea = document.getElementById(targetId);
    if (!textarea) return;

    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const val = textarea.value;
    textarea.value = val.substring(0, start) + tag + val.substring(end);
    textarea.selectionStart = textarea.selectionEnd = start + tag.length;
    textarea.focus();
    updateReportPreview();
  }

  function getReportSampleContext() {
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0].replace(/-/g, '/');
    const origin = window.location.origin;

    const visitors = (typeof cachedAllVisitors !== 'undefined' && Array.isArray(cachedAllVisitors)) ? cachedAllVisitors : [];
    const flatMembers = (typeof cachedFlatMembers !== 'undefined' && Array.isArray(cachedFlatMembers)) ? cachedFlatMembers : [];
    const apList = (typeof currentDashboardActionPlans !== 'undefined' && Array.isArray(currentDashboardActionPlans)) ? currentDashboardActionPlans : [];
    
    // サンプルメンバー
    const m1 = flatMembers[0] || { name: '居原田 晃司', category: '不動産' };
    const m2 = flatMembers[1] || { name: '川口 陽平', category: 'Web制作' };

    // 招待貢献メンバー一覧
    const inviterMap = {};
    visitors.forEach(v => {
      if (v.inviter) inviterMap[v.inviter] = (inviterMap[v.inviter] || 0) + 1;
    });
    let inviterHtml = '<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px;">';

      topInviters.forEach(([name, count]) => {
        inviterHtml += `<div style="display:flex; justify-content:space-between; padding:4px 0; font-size:12px;"><strong>${escapeHtml(name)} 様</strong><span style="color:#0071e3; font-weight:bold;">${count}名 招待中</span></div>`;

    } else {
      inviterHtml += `<div style="font-size:12px; color:#64748b;">${m1.name} 様: 2名 / ${m2.name} 様: 1名</div>`;
      inviterLine = `・${m1.name} 様: 2名\n・${m2.name} 様: 1名`;

    inviterHtml += '</div>';

    // 参加予定ビジター

      upHtml += `<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px; margin-bottom:8px;">
        <div style="font-weight:bold; font-size:13px; color:#0f172a;">${escapeHtml(v.name || 'ビジター')} 様 (${escapeHtml(v.company || '会社名')})</div>
        <div style="font-size:11px; color:#64748b; margin-top:2px;">専門: ${escapeHtml(v.businessCategory || '事業')} / 招待: <strong>${escapeHtml(v.inviter || m1.name)} 様</strong></div>
      </div>`;
      upLine += `${i + 1}. ${v.name || 'ビジター'} 様 (${v.company || ''}) / 専門: ${v.businessCategory || ''} (招待: ${v.inviter || m1.name} 様)\n`;
    });

    // メンターメッセージ
    const mentorMsg = '次回定例会まであと2日です！今週の目標【5名】に対し、現在確定申込は【3名】、目標達成まであと【2名】です。日曜夜の今こそ、あなたの大切なビジネスパートナーに「火曜朝にお茶しませんか？」と声を届ける最高のチャンスです！全員で必ず目標を達成させましょう！🔥';

    return {
      '{{定例会日付}}': '2026/08/25(火)',
      '{{本日日付}}': todayStr,
      '{{週間目標数}}': '5',
      '{{現在申込数}}': '3',
      '{{目標差分}}': '2',
      '{{目標差分カラー}}': '#dc2626',
      '{{達成率}}': '60',
      '{{メンターメッセージ}}': mentorMsg,
      '{{招待貢献メンバー一覧HTML}}': inviterHtml,
      '{{招待貢献メンバーLINE一覧}}': inviterLine.trim(),
      '{{参加予定ビジター数}}': `${upcomingVisitors.length || 3}`,
      '{{参加予定ビジターカード一覧HTML}}': upHtml || '<p>参加予定ビジターはいません</p>',
      '{{参加予定ビジターLINE一覧}}': upLine.trim() || '（参加予定ビジターはいません）',
      '{{週間申込数}}': '4',
      '{{完了アクション数}}': '7',
      '{{フォロー中件数}}': '12',
      '{{残ToDo数}}': '3',
      '{{フォロー中ビジターテーブルHTML}}': '<table style="width:100%; font-size:12px; border-collapse:collapse;"><tr style="background:#f1f5f9;"><th style="padding:8px 10px; text-align:left;">ビジター名</th><th style="padding:8px 10px; text-align:left;">感触ランク</th><th style="padding:8px 10px; text-align:left;">次回アクション</th></tr><tr><td style="padding:8px 10px; border-bottom:1px solid #f1f5f9; font-weight:bold;">山田 太郎 様 (不動産)</td><td style="padding:8px 10px; border-bottom:1px solid #f1f5f9;"><span style="color:#059669; font-weight:bold;">🟢 A (高感触)</span></td><td style="padding:8px 10px; border-bottom:1px solid #f1f5f9;">8/26 1to1実施予定</td></tr><tr><td style="padding:8px 10px; border-bottom:1px solid #f1f5f9; font-weight:bold;">佐藤 次郎 様 (税理士)</td><td style="padding:8px 10px; border-bottom:1px solid #f1f5f9;"><span style="color:#a16207; font-weight:bold;">🟡 B (検討中)</span></td><td style="padding:8px 10px; border-bottom:1px solid #f1f5f9;">8/27 再アプローチ連絡</td></tr></table>',
      '{{フォロー中重要ビジターLINE一覧}}': '・山田 太郎 様 (Aランク): 8/26 1to1日程調整済 (担当: 居原田 様)\n・佐藤 次郎 様 (Bランク): 次回定例会再参加を提案中 (担当: 川口 様)',
      '{{担当者名}}': m1.name,
      '{{ビジター名}}': '田中 健太',
      '{{ビジター会社}}': '株式会社イノベーション / 代表取締役',
      '{{ビジターカテゴリー}}': '不動産コンサルティング',
      '{{招待者名}}': m2.name,
      '{{アクション内容}}': 'フォロー1to1 実施完了',
      '{{報告内容}}': 'チャプターの仕組みについて深くご理解いただき、入会申込書をお渡ししました！前向きにご検討中です。',
      '{{本日期限件数}}': '2',
      '{{本日期限タスクテーブルHTML}}': '<table style="width:100%; font-size:12px; border-collapse:collapse;"><tr style="background:#fee2e2; color:#991b1b;"><th style="padding:8px 10px; text-align:left;">期日</th><th style="padding:8px 10px; text-align:left;">ビジター名</th><th style="padding:8px 10px; text-align:left;">アクション内容</th><th style="padding:8px 10px; text-align:left;">担当メンバー</th></tr><tr><td style="padding:8px 10px; border-bottom:1px solid #fecaca; color:#dc2626; font-weight:bold;">本日中</td><td style="padding:8px 10px; border-bottom:1px solid #fecaca; font-weight:bold;">鈴木 一郎 様</td><td style="padding:8px 10px; border-bottom:1px solid #fecaca;">定例会参加お礼 ＆ 1to1調整</td><td style="padding:8px 10px; border-bottom:1px solid #fecaca;">居原田 晃司 様</td></tr><tr><td style="padding:8px 10px; border-bottom:1px solid #fecaca; color:#dc2626; font-weight:bold;">本日中</td><td style="padding:8px 10px; border-bottom:1px solid #fecaca; font-weight:bold;">高橋 花子 様</td><td style="padding:8px 10px; border-bottom:1px solid #fecaca;">入会質問への回答メール</td><td style="padding:8px 10px; border-bottom:1px solid #fecaca;">川口 陽平 様</td></tr></table>',
      '{{本日期限タスクLINE一覧}}': '・【本日中】鈴木 一郎 様: 定例会参加お礼連絡 ＆ 1to1日程調整 (担当: 居原田 様)\n・【本日中】高橋 花子 様: 入会質問への回答メール送信 (担当: 川口 様)',
      '{{参加予定日}}': '2026/08/25(火) 06:45〜',
      '{{ダッシュボードURL}}': `${origin}/#dashboard`,
      '{{アクション管理URL}}': `${origin}/#actions`,
      '{{カルテURL}}': `${origin}/#visitor/1`
    };
  }

  function replacePlaceholders(templateText, context) {
    if (!templateText) return '';
    let result = templateText;
    for (const [key, value] of Object.entries(context)) {
      result = result.split(key).join(value);
    }
    return result;
  }

  function updateReportPreview() {
    const context = getReportSampleContext();

    // 1. メールプレビュー
    const subjectRaw = document.getElementById('rm-email-subject')?.value || '';
    const bodyRaw = document.getElementById('rm-email-body')?.value || '';
    const replacedSubject = replacePlaceholders(subjectRaw, context);
    const replacedBody = replacePlaceholders(bodyRaw, context);

    const previewSubjectEl = document.getElementById('rm-preview-email-subject');
    if (previewSubjectEl) previewSubjectEl.innerText = replacedSubject;

    const iframe = document.getElementById('rm-email-preview-frame');
    if (iframe) {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(replacedBody);
      doc.close();
    }

    // 2. LINEプレビュー
    const lineRaw = document.getElementById('rm-line-body')?.value || '';
    const replacedLine = replacePlaceholders(lineRaw, context);
    const linePreviewEl = document.getElementById('rm-preview-line-content');
    if (linePreviewEl) linePreviewEl.innerText = replacedLine;
  }

  function saveCurrentReportTemplate() {
    const t = getCurrentTemplate();
    const title = document.getElementById('rm-current-title')?.innerText || t.title;
    const isEnabled = document.getElementById('rm-enabled-toggle')?.checked ? 1 : 0;
    const schedType = document.getElementById('rm-schedule-type')?.value || 'weekly';
    const schedDay = document.getElementById('rm-schedule-day')?.value || 'Sun';
    const schedTime = document.getElementById('rm-schedule-time')?.value || '20:00';
    const recipients = document.getElementById('rm-email-recipients')?.value || 'info@k-d-o.biz';
    const subject = document.getElementById('rm-email-subject')?.value || '';
    const emailBody = document.getElementById('rm-email-body')?.value || '';
    const lineBody = document.getElementById('rm-line-body')?.value || '';

    const payload = {
      id: currentSelectedReportId,
      title: title,
      schedule_type: schedType,
      schedule_day: schedDay,
      schedule_time: schedTime,
      is_enabled: isEnabled,
      default_recipients: recipients,
      email_subject: subject,
      email_html_body: emailBody,
      line_template_body: lineBody
    };

    if (typeof ApiService !== 'undefined' && ApiService.call) {
      ApiService.call('updateReportTemplateApi', payload).then(res => {
        if (res && res.success) {
          showToast('通知設定・テンプレートを保存しました', 'success');
          const idx = cachedReportTemplates.findIndex(x => x.id === currentSelectedReportId);
          if (idx !== -1) {
            cachedReportTemplates[idx] = res.template || payload;
          }
        }
      }).catch(err => {
        showToast('保存に失敗しました', 'error');
      });
    }
  }

  function resetCurrentReportTemplateToDefault() {
    if (!confirm('この通知テンプレートを推奨の完成形ひな形に戻しますか？\n（現在の編集内容は上書きされます）')) {
      return;
    }

    if (typeof ApiService !== 'undefined' && ApiService.call) {
      ApiService.call('resetReportTemplateApi', currentSelectedReportId).then(res => {
        if (res && res.success && res.template) {
          showToast('完成形ひな形を読み込みました', 'success');
          const idx = cachedReportTemplates.findIndex(x => x.id === currentSelectedReportId);
          if (idx !== -1) {
            cachedReportTemplates[idx] = res.template;
          } else {
            cachedReportTemplates.push(res.template);
          }
          renderReportManagerUI();
        }
      }).catch(err => {
        showToast('ひな形の読み込みに失敗しました', 'error');
      });
    }
  }

  function onReportToggleChange(checked) {
    const isEnabled = checked ? 1 : 0;
    const labelEl = document.getElementById('rm-enabled-label');
    if (labelEl) {
      labelEl.innerText = checked ? '有効 (配信対象)' : '無効 (停止中)';
      labelEl.className = checked ? 'text-xs font-bold text-emerald-600' : 'text-xs font-bold text-slate-400';
    }

    if (typeof ApiService !== 'undefined' && ApiService.call) {
      ApiService.call('toggleReportTemplateApi', currentSelectedReportId, isEnabled).then(res => {
        showToast(checked ? 'この通知を「有効」にしました' : 'この通知を「無効」にしました', 'info');
        const t = cachedReportTemplates.find(x => x.id === currentSelectedReportId);
        if (t) t.is_enabled = isEnabled;
        renderReportManagerUI();
      }).catch(() => {
        showToast('設定の変更に失敗しました', 'error');
      });
    }
  }

  function sendTestReportEmail() {
    const recipients = document.getElementById('rm-email-recipients')?.value || 'info@k-d-o.biz';
    const subjectRaw = document.getElementById('rm-email-subject')?.value || '';
    const bodyRaw = document.getElementById('rm-email-body')?.value || '';

    const context = getReportSampleContext();
    const replacedSubject = replacePlaceholders(subjectRaw, context);
    const replacedBody = replacePlaceholders(bodyRaw, context);

    if (!recipients) {
      showToast('送信先アドレスを入力してください', 'warning');
      return;
    }

    showToast('info@k-d-o.biz からテストメールを送信中...', 'info');
    const firstRecipient = recipients.split(',')[0].trim();

    if (typeof ApiService !== 'undefined' && ApiService.call) {
      ApiService.call('sendReportMailApi', firstRecipient, replacedSubject, replacedBody).then(res => {
        if (res && res.success) {
          showToast(`送信成功: ${firstRecipient} にメールを送信しました`, 'success');
        }
      }).catch(err => {
        showToast('メール送信に失敗しました', 'error');
      });
    }
  }

  function copyReplacedLineReportText() {
    const lineRaw = document.getElementById('rm-line-body')?.value || '';
    const context = getReportSampleContext();
    const replacedLine = replacePlaceholders(lineRaw, context);

    if (!replacedLine) {
      showToast('コピーする文面がありません', 'warning');
      return;
    }

    navigator.clipboard.writeText(replacedLine).then(() => {
      showToast('LINE報告文をクリップボードにコピーしました！', 'success');
    }).catch(() => {
      showToast('コピーに失敗しました', 'error');
    });
  }
</script>
